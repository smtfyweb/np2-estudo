18", "f": "O que é perpetuação da competência (perpetuatio jurisdictionis)?", "v": "Competência fixada no momento do registro/distribuição da petição inicial (art. 43 CPC). Exceções: supressão do órgão ou alteração de competência ABSOLUTA"}, {"id": "c19", "f": "Ação real sobre imóvel: qual o foro competente e que tipo de competência é?", "v": "Foro da situação da coisa (art. 47 CPC); para ação possessória imobiliária é competência ABSOLUTA (art. 47, §2º)"}, {"id": "c20", "f": "Juizados Especiais Estaduais × Federais: competência relativa ou absoluta?", "v": "Estaduais = relativa (opção do demandante até 40 SM) | Federais = ABSOLUTA (art. 3º, §3º, Lei 10.259/01)"}], "cobertura": ["As questões comentadas vêm só dos Módulos 1 a 3. Dos Módulos 4 a 8 há apenas uma síntese, sem as questões.", "Os arquivos trazem gabarito e comentário. Enunciados e alternativas completas não vieram.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "revisao", "ref": "r7", "titulo": "Ponto em que a doutrina diverge", "texto": "O material trata legitimidade e interesse como “pressupostos processuais” e diz que o CPC abandonou a teoria eclética. Muitos autores veem legitimidade e interesse como requisitos de admissibilidade do mérito (art. 17 e art. 485, VI, do CPC), e a possibilidade jurídica do pedido deixou de ser condição. Em prova objetiva, siga a formulação do AVA."}, {"esc": "card", "ref": "c16", "titulo": "Ponto em que a doutrina diverge", "texto": "Mesmo ponto do Módulo 7: classificar legitimidade e interesse como “pressupostos processuais” é uma leitura do material. Siga o AVA."}, {"esc": "revisao", "ref": "r8", "titulo": "Artigo citado fora do lugar", "texto": "Na lista de competência absoluta aparece “territorial art. 47, §1º”. O §1º trata da opção do autor em certos casos. A competência absoluta da possessória imobiliária está no §2º, como no flashcard."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["883X"]={"cod": "883X", "revisao": [{"id": "r1", "titulo": "Princípios da Administração (LIMPE)", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Sigla</th>\n<th>Princípio</th>\n<th>Essência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L</strong></td>\n<td>Legalidade</td>\n<td>Adm. só faz o que a lei AUTORIZA (≠ particular: faz o que a lei não proíbe)</td>\n</tr>\n<tr>\n<td><strong>I</strong></td>\n<td>Impessoalidade</td>\n<td>Igualdade, sem favoritismo; atos imputados ao Estado, não ao agente (Teoria do Órgão)</td>\n</tr>\n<tr>\n<td><strong>M</strong></td>\n<td>Moralidade</td>\n<td>Agir com ética, boa-fé, lealdade, probidade</td>\n</tr>\n<tr>\n<td><strong>P</strong></td>\n<td>Publicidade</td>\n<td>Divulgação oficial obrigatória; regra é transparência, exceção é sigilo (segurança / intimidade)</td>\n</tr>\n<tr>\n<td><strong>E</strong></td>\n<td>Eficiência</td>\n<td>Rapidez + perfeição + rendimento (acrescido pela EC 19/98)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> Razoabilidade e proporcionalidade NÃO constam expressamente no art. 37 — são princípios implícitos.</p>\n<p><strong>Supraprincípios (Celso A. Bandeira de Mello):</strong> supremacia do interesse público + indisponibilidade do interesse público.</p>\n<p><strong>Princípios infraconstitucionais:</strong> presunção de legitimidade, continuidade, autotutela (Súm. 473 STF), motivação, razoabilidade, hierarquia.</p>"}, {"id": "r2", "titulo": "Poderes administrativos", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Poder</th>\n<th>Finalidade</th>\n<th>Espécies/Destaque</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Normativo</strong></td>\n<td>Atos gerais e abstratos (regulamento, portaria, resolução)</td>\n<td>Regulamento executivo (regra no BR) vs. autônomo (EC 32/2001, art. 84, VI)</td>\n</tr>\n<tr>\n<td><strong>Hierárquico</strong></td>\n<td>Subordinação entre órgãos da mesma PJ</td>\n<td>Delegar, avocar, punir, rever atos; NÃO existe no Judiciário/Legislativo em suas funções típicas</td>\n</tr>\n<tr>\n<td><strong>Disciplinar</strong></td>\n<td>Punir servidores e contratados</td>\n<td>Decorre do hierárquico; omissão = condescendência criminosa (CP, art. 320)</td>\n</tr>\n<tr>\n<td><strong>Polícia</strong></td>\n<td>Limitar liberdade/propriedade em prol do coletivo</td>\n<td>Atributos: <strong>discricionariedade, autoexecutoriedade, coercibilidade</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Atributos do Poder de Polícia:</strong></p>\n<ul>\n<li>Discricionariedade (regra), mas há atos vinculados (ex: licença para construir)</li>\n<li>Autoexecutoriedade = exigibilidade (meios indiretos) + executoriedade (meios diretos)</li>\n<li>Multa é exigível mas NÃO é executória (cobrança depende de execução fiscal)</li>\n</ul>\n<p><strong>Licença vs. Autorização:</strong></p>\n<ul>\n<li>Licença = vinculado, gera direito subjetivo</li>\n<li>Autorização = discricionário, atende interesse do particular</li>\n</ul>"}, {"id": "r3", "titulo": "Atos administrativos", "prob": "alta", "html": "<p><strong>Requisitos/Elementos — FF.COM:</strong></p>\n<ul>\n<li><strong>F</strong>orma (regra: escrita)</li>\n<li><strong>F</strong>inalidade (interesse público; no sentido restrito: fim especificado na lei)</li>\n<li><strong>C</strong>ompetência/Sujeito (vinculado, irrenunciável, imprescritível, improrrogável)</li>\n<li><strong>O</strong>bjeto (conteúdo; pode ser vinculado ou discricionário)</li>\n<li><strong>M</strong>otivo (pressuposto de fato e direito; ≠ motivação = exposição dos motivos)</li>\n</ul>\n<p><strong>Atributos — PAIT:</strong></p>\n<ul>\n<li>Presunção de legitimidade (juris tantum — relativa; inverte ônus da prova)</li>\n<li>Autoexecutoriedade</li>\n<li>Imperatividade/coercibilidade</li>\n<li>Tipicidade</li>\n</ul>\n<p><strong>Discricionariedade reside normalmente em:</strong> motivo + objeto.</p>\n<p><strong>Teoria dos Motivos Determinantes:</strong> se a Adm. indicou motivo (mesmo desnecessário), fica vinculada a ele. Se o motivo for falso/inexistente → ato nulo.</p>\n<p><strong>Extinção dos atos:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Revogação</th>\n<th>Anulação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Causa</td>\n<td>Inconveniência/inoportunidade</td>\n<td>Ilegalidade</td>\n</tr>\n<tr>\n<td>Efeito</td>\n<td>ex nunc (a partir de agora)</td>\n<td>ex tunc (retroativo)</td>\n</tr>\n<tr>\n<td>Quem</td>\n<td>Só Administração</td>\n<td>Adm. + Judiciário</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>NÃO podem ser revogados:</strong> atos vinculados, atos que esgotaram efeitos, atos que geraram direito adquirido.</p>"}, {"id": "r4", "titulo": "Organização administrativa", "prob": "alta", "html": "<p><strong>Concentração/Desconcentração</strong> — dentro da mesma PJ (hierarquia):</p>\n<ul>\n<li>Desconcentração: distribuição interna (Ministérios, Secretarias, Delegacias)</li>\n</ul>\n<p><strong>Centralização/Descentralização</strong> — entre PJs distintas:</p>\n<ul>\n<li>Descentralização por serviço (outorga): lei cria entidade com titularidade do serviço</li>\n<li>Adm. Indireta: Autarquia, Fundação, Empresa Pública, Sociedade de Economia Mista</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Entidade</th>\n<th>Natureza</th>\n<th>Criação</th>\n<th>Capital</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Autarquia</td>\n<td>Direito Público</td>\n<td>Lei específica</td>\n<td>Público</td>\n</tr>\n<tr>\n<td>Fundação pública</td>\n<td>Público ou Privado</td>\n<td>Lei específica (dir. púb.) / autorização (dir. priv.)</td>\n<td>Público</td>\n</tr>\n<tr>\n<td>Empresa Pública</td>\n<td>Direito Privado</td>\n<td>Autorização legislativa</td>\n<td>100% público; qualquer forma</td>\n</tr>\n<tr>\n<td>Soc. Economia Mista</td>\n<td>Direito Privado</td>\n<td>Autorização legislativa</td>\n<td>Misto; só S/A</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Diferenças EP x SEM:</strong> forma jurídica + capital + foro processual (EP federal = JF; SEM federal = JE).</p>\n<p><strong>Agência Reguladora:</strong> autarquia de regime especial — dirigentes com <strong>mandato fixo + estabilidade</strong> (não exoneração ad nutum).</p>\n<p><strong>Agência Executiva:</strong> qualificação dada a autarquia/fundação que celebra contrato de gestão — não é nova entidade (ex.: INMETRO).</p>\n<p><strong>OAB:</strong> entidade sui generis — NÃO é autarquia; não precisa de concurso público.</p>\n<p><strong>Terceiro Setor:</strong> direito privado, sem fins lucrativos, fora da Adm.</p>\n<ul>\n<li>Sistema S (SESI, SENAI, SEBRAE): parafiscalidade + Tribunal de Contas</li>\n<li>OS (Lei 9.637/98): contrato de gestão; saúde, ensino, pesquisa, meio ambiente, cultura</li>\n<li>OSCIP (Lei 9.790/99): termo de parceria</li>\n</ul>"}, {"id": "r5", "titulo": "Licitação (Lei 14.133/2021)", "prob": "media", "html": "<p><strong>Modalidades (nova lei):</strong> pregão, concorrência, concurso, leilão, diálogo competitivo.\n(Extintas: tomada de preços e convite)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Modalidade</th>\n<th>Objeto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pregão</td>\n<td>Bens e serviços comuns (menor preço ou maior desconto)</td>\n</tr>\n<tr>\n<td>Concorrência</td>\n<td>Bens/serviços especiais + obras de engenharia, qualquer valor</td>\n</tr>\n<tr>\n<td>Concurso</td>\n<td>Trabalho técnico/científico/artístico; critério: melhor técnica</td>\n</tr>\n<tr>\n<td>Leilão</td>\n<td>Alienação de bens imóveis ou móveis inservíveis (maior lance)</td>\n</tr>\n<tr>\n<td>Diálogo Competitivo</td>\n<td>Inovação tecnológica; necessidade não atendida pelo mercado</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Contratação direta:</strong></p>\n<ul>\n<li><strong>Dispensa:</strong> viabilidade de competição, mas lei autoriza não licitar (ex.: guerra, emergência, valores baixos R$100k obras / R$50k outros)</li>\n<li><strong>Inexigibilidade:</strong> inviabilidade de competição (fornecedor exclusivo, artista consagrado, serviço técnico especializado de notória especialização — exceto publicidade)</li>\n</ul>\n<p><strong>Princípio da vinculação ao edital:</strong> edital é a \"lei interna da licitação\" — nem a Adm. pode dele se afastar.</p>"}, {"id": "r6", "titulo": "Contratos administrativos", "prob": "media", "html": "<p><strong>Cláusulas exorbitantes (art. 104, Lei 14.133/21):</strong></p>\n<ol>\n<li>Modificação unilateral</li>\n<li>Extinção unilateral</li>\n<li>Fiscalização</li>\n<li>Aplicação de sanções</li>\n<li>Ocupação provisória de bens</li>\n</ol>\n<p><strong>Equilíbrio econômico-financeiro:</strong> direito do contratado (art. 37, XXI, CF) — rebus sic stantibus / teoria da imprevisão.</p>\n<p><strong>Fato do Príncipe:</strong> medida geral do Estado que onera indiretamente o contrato.\n<strong>Fato da Administração:</strong> ação/omissão direta do contratante que prejudica a execução.</p>\n<p><strong>Acréscimos/supressões obrigatórios:</strong> até 25% (obras/serviços/compras) e 50% (reforma de edifícios/equipamentos).</p>\n<p><strong>Rescisão:</strong> unilateral (Adm.), consensual ou judicial/arbitral.</p>"}, {"id": "r7", "titulo": "Servidor público", "prob": "alta", "html": "<p><strong>Classificação de agentes públicos:</strong></p>\n<ul>\n<li>Agentes políticos (chefes do Executivo, parlamentares, magistrados, MP)</li>\n<li>Servidores estatutários (cargo público, regime estatutário — Lei 8.112/90)</li>\n<li>Empregados públicos (emprego público, CLT — EP e SEM)</li>\n<li>Contratados temporários (art. 37, IX CF — sem concurso, processo seletivo simplificado)</li>\n<li>Particulares em colaboração (mesários = honoríficos; concessionários = delegados; gestores de negócio)</li>\n</ul>\n<p><strong>Cargo em comissão x Função de confiança:</strong></p>\n<ul>\n<li>Comissão: livre nomeação E exoneração (ad nutum), sem concurso</li>\n<li>Função de confiança: SOMENTE para servidores de carreira</li>\n</ul>\n<p><strong>Estabilidade:</strong> 3 anos de estágio probatório. Perde o cargo por: sentença judicial, PAD, avaliação de desempenho ou redução de despesas (LRF).</p>\n<p><strong>Vitaliciedade (magistrados, MP, TCU):</strong> estágio de 2 anos; perde só por sentença judicial.</p>\n<p><strong>Aposentadoria (art. 40, CF):</strong></p>\n<ul>\n<li>Invalidez permanente (proventos proporcionais, salvo acidente/doença grave)</li>\n<li>Compulsória: 75 anos</li>\n<li>Voluntária: requisitos de tempo/contribuição</li>\n</ul>\n<p><strong>Acumulação lícita (art. 37, XVI, CF):</strong></p>\n<ul>\n<li>2 cargos de professor</li>\n<li>1 professor + 1 técnico/científico</li>\n<li>2 cargos de profissional de saúde com profissão regulamentada</li>\n</ul>\n<p><strong>Concurso público:</strong> validade até 2 anos, prorrogável 1x por igual período. NÃO existe concurso só de títulos.</p>\n<p><strong>Responsabilidade do servidor:</strong> civil + penal + administrativa (independentes). Absolvição penal por inexistência do fato ou negativa de autoria afasta responsabilidade adm. e civil.</p>"}], "top5": ["<b>Princípios LIMPE</b> — art. 37, distinção implícito/explícito, aplicação prática", "<b>Atos administrativos</b> — requisitos FF.COM, atributos PAIT, revogação x anulação, teoria dos motivos determinantes", "<b>Poderes administrativos</b> — poder de polícia (atributos), disciplinar x hierárquico, normativo", "<b>Organização administrativa</b> — diferenças EP x SEM, agências reguladoras, desconcentração x descentralização", "<b>Servidor público</b> — estabilidade, acumulação de cargos, cargo em comissão x função de confiança, tipos de aposentadoria"], "questoes": [{"id": "M1-Q1", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q1", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sistema administrativo brasileiro: embora exista decisão administrativa, ela é passível de apreciação judicial.", "repete": false, "repeteRef": "", "coment": ["Brasil adota jurisdição única (Sistema Inglês, art. 5º, XXXV CF). Não há coisa julgada administrativa."]}, {"id": "M1-Q2", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q2", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Fonte primária do Direito Administrativo: a <b>lei</b>.", "repete": false, "repeteRef": "", "coment": ["Doutrina, jurisprudência e costumes são fontes secundárias. Nota: gabarito da plataforma tinha erro (marcava E), mas a doutrina é categórica na alternativa A."]}, {"id": "M1-Q3", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q3", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sentido <b>subjetivo</b> da Adm. Pública = entidades e órgãos (quem pratica).", "repete": false, "repeteRef": "", "coment": ["Sentido objetivo = a atividade/função em si (serviço público, polícia adm., fomento, intervenção)."]}, {"id": "M1-Q4", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q4", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Três elementos do Estado: povo + território + <b>governo soberano</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q5", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q5", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Critérios: I=teleológico, II=relações jurídicas, III=administração pública.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q6", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q6", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "É permitida criação de tribunais com competência administrativa (CARF, TIT, Conselhos de ética), mas suas decisões não fazem coisa julgada material.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q7", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q7", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sentido objetivo da Adm. Pública NÃO abrange elaboração legislativa com caráter inovador (isso é função legislativa).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q8", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q8", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Ambas as assertivas corretas e a segunda complementa a primeira.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q9", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I=correta (Direito Adm. rege função adm. dos 3 poderes); II=falsa (fonte primária é a lei, não jurisprudência).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q10", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q10", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I=correta; II=falsa (doutrina é fonte secundária, não primária).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q11", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q11", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Nenhuma das alternativas anteriores contém erro (A, B, C e D todas corretas sobre fontes).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q12", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Q12", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Jurisdição una: NÃO divide a função jurisdicional. Quem divide é o sistema do contencioso administrativo (sistema francês).", "repete": false, "repeteRef": "", "coment": ["Gabarito oficial marca C e B — ambas expressam a mesma coisa."]}, {"id": "M2-Q1", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q1", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Razoabilidade: adequar meios e fins, evitar restrições abusivas.", "repete": true, "repeteRef": "cobrado também de forma aplicada em Q2.", "coment": []}, {"id": "M2-Q2", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q2", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Desapropriação para prejudicar inimigo = violação da <b>moralidade</b> (desvio de finalidade com elemento subjetivo).", "repete": true, "repeteRef": "conceito de moralidade também aparece em Q3 e Q10.", "coment": []}, {"id": "M2-Q3", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q3", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "INCORRETO: CF prevê LIMPE expressamente no art. 37; razoabilidade NÃO consta expressamente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q4", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q4", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Publicidade comporta sigilo quando imprescindível à segurança do Estado/sociedade ou à intimidade (art. 5º, X e XXXIII CF).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q5", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Rol do art. 37 é exemplificativo (não taxativo) — existem princípios implícitos.", "repete": true, "repeteRef": "cobrado em Q3.", "coment": []}, {"id": "M2-Q6", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q6", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Autotutela: Adm. anulou nomeação com documentos falsos. (Súmula 473 STF)", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q7", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q7", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Uso indevido de cartão corporativo = violação da <b>impessoalidade</b> (recursos públicos desviados para interesse privado).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q8", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q8", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Vedação de criar obrigações por mero ato adm. sem lei = <b>legalidade</b> (art. 5º, II e art. 37, caput CF).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q9", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Qualidade/aperfeiçoamento = <b>eficiência</b>; direito à informação = <b>publicidade</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q10", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q10", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Obrigação de ser impessoal decorre da <b>moralidade</b> (doutrina Hely Lopes). Atenção: D afirma que eficiência está na CF — está correta também, mas C é a \"mais correta\" segundo o gabarito.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q11", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q11", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Publicação no Diário Oficial = <b>publicidade</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q12", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Q12", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Tratamento diferenciado a algumas pessoas = violação da <b>impessoalidade</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q1", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q1", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Todas corretas sobre poder de polícia: conceito, divisão (adm./judiciária), atributos, possibilidade de ser vinculado.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q2", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q2", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Poder para apurar infrações e punir servidores = <b>disciplinar</b>.", "repete": true, "repeteRef": "cobrado em Q7 e Q12.", "coment": []}, {"id": "M3-Q3", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q3", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Atributos do poder de polícia: EXCETO \"atividade positiva\" (poder de polícia impõe abstenções, não ações positivas).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q4", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q4", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Interdição pela vigilância sanitária = poder de polícia (ato repressivo concreto).", "repete": true, "repeteRef": "cobrado em Q11.", "coment": []}, {"id": "M3-Q5", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q5", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Poder \"regrado\" = <b>vinculado</b> (todos elementos fixados em lei, sem margem de apreciação).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q6", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q6", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Distribuir e escalonar funções + subordinação = <b>hierárquico</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q7", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q7", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Aplicar sanções por infrações funcionais = <b>disciplinar</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q8", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q8", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Poder regulamentar: expedir normas operacionais para fiel execução da lei (art. 84, IV CF). NÃO inova a ordem jurídica.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q9", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q9", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Controle de liberdades/direitos em razão do interesse público = <b>polícia</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q10", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q10", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Poder regulamentar = editar normas complementares à lei para fiel execução.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q11", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q11", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Interdição de estabelecimento privado = <b>polícia</b> (autoexecutoriedade).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q12", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Q12", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Advertência a servidor por chefia imediata = <b>disciplinar</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q1", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q1", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Ato discricionário pode ser apreciado judicialmente quanto à <b>legalidade</b> (não quanto ao mérito/conveniência/oportunidade).", "repete": true, "repeteRef": "distinção mérito x legalidade é recorrente.", "coment": []}, {"id": "M4-Q2", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q2", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Finalidade = efeito mediato (objetivo da lei); Motivo = pressuposto fato/direito; Forma = garantia jurídica formal.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q3", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "5 requisitos: forma, competência, finalidade, motivo e objeto. (FF.COM)", "repete": true, "repeteRef": "cobrado em Q4 e Q5.", "coment": []}, {"id": "M4-Q4", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Ambas verdadeiras mas a segunda (rol dos 5 elementos) NÃO justifica a primeira (poder de controle jurisdicional vem do art. 5º, XXXV CF).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q5", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q5", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Atributos do ato: EXCETO finalidade (finalidade é requisito/elemento, não atributo).", "repete": false, "repeteRef": "", "coment": ["<b>PEGADINHA CLÁSSICA</b>: finalidade é requisito; os atributos são PAIT."]}, {"id": "M4-Q6", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q6", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I=correta (autoexecutoriedade); II=falsa (motivo ≠ motivação).", "repete": true, "repeteRef": "distinção motivo/motivação cobrada.", "coment": []}, {"id": "M4-Q7", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q7", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Atos de gestão: sem prerrogativas de autoridade. Atos de expediente: SEM conteúdo decisório (II=falsa).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q8", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q8", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Contrato verbal de vigilância violou o requisito de <b>forma</b> (regra é forma escrita).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q9", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q9", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Características da competência: imprescritível + improrrogável.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q10", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q10", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Presunção de legitimidade é <b>relativa</b> (juris tantum) — admite prova em contrário; inverte ônus probatório.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q11", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q11", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Competência é <b>irrenunciável</b> (função pública em nome do interesse público indisponível).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q12", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Q12", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Ato perfeito e eficaz pode ser anulado (ilegalidade, ex tunc) OU revogado (inconveniência, ex nunc).", "repete": true, "repeteRef": "distinção revogação/anulação é o tema mais cobrado do módulo.", "coment": []}, {"id": "M5-Q1", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q1", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Assertiva III incorreta: Presidência e Ministérios são Adm. <b>Direta</b> (não Indireta).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q2", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q2", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Terceiro Setor: regime <b>predominantemente privado</b>, derrogado parcialmente pelo público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q3", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Pessoas privadas que atuam ao lado do Estado = <b>paraestatais</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q4", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q4", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "EP x SEM: forma jurídica + composição do capital + foro processual.", "repete": true, "repeteRef": "cobrado de forma indireta em outros enunciados.", "coment": []}, {"id": "M5-Q5", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q5", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Distribuição interna na mesma PJ = <b>desconcentração</b>.", "repete": true, "repeteRef": "distinção desconcentração/descentralização é fundamental.", "coment": []}, {"id": "M5-Q6", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q6", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Agências reguladoras se diferenciam pelo <b>mandato fixo + estabilidade dos dirigentes</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q7", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q7", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Qualificação dada a autarquia/fundação + contrato de gestão = <b>agência executiva</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q8", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q8", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "OS atua em ensino, pesquisa, desenvolvimento tecnológico, meio ambiente, cultura e saúde.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q9", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q9", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Pessoa jurídica criada por lei com titularidade do serviço = <b>descentralização por serviço</b> (outorga).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q10", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q10", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "OAB: entidade sui generis, dispensada de concurso público (STF, ADI 3.026).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q11", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q11", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Agências reguladoras = <b>autarquias sob regime especial</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q12", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Q12", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Secretarias de Estado = órgãos da Adm. <b>Direta</b> (desconcentração).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q1", "bloco": "MÓDULO 6 — Licitação", "num": "Q1", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Todas corretas: adjudicação (atribuição do objeto), técnica e preço para informática (lei 8.666), tomada de preços (definição art. 22 §2º).", "repete": false, "repeteRef": "", "coment": ["Atenção: questão ainda usa lei 8.666/93 — verificar contexto da prova."]}, {"id": "M6-Q2", "bloco": "MÓDULO 6 — Licitação", "num": "Q2", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Todas corretas sobre edital: convocação, vinculação, vedação de cláusulas direcionadas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q3", "bloco": "MÓDULO 6 — Licitação", "num": "Q3", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Dispensável: guerra (I) e licitação deserta anterior (II). Inexigível: notória especialização (IV). III está errada.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q4", "bloco": "MÓDULO 6 — Licitação", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "INCORRETO: não existe princípio do \"sigilo da licitação\" — publicidade é a regra. Somente propostas são sigilosas até abertura.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q5", "bloco": "MÓDULO 6 — Licitação", "num": "Q5", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Ampla publicidade e universalidade = <b>concorrência</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q6", "bloco": "MÓDULO 6 — Licitação", "num": "Q6", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Locação de imóvel pode dispensar licitação (art. 24, X lei 8.666 / art. 75 lei 14.133).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q7", "bloco": "MÓDULO 6 — Licitação", "num": "Q7", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I=correta (hierarquia de modalidades); II=falsa (descrição é do <b>leilão</b>, não do pregão).", "repete": false, "repeteRef": "", "coment": ["<b>PEGADINHA:</b> bens inservíveis = leilão; bens/serviços comuns = pregão."]}, {"id": "M6-Q8", "bloco": "MÓDULO 6 — Licitação", "num": "Q8", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Ambas corretas: cidadão pode impugnar edital; habilitação afere aptidão do licitante.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q9", "bloco": "MÓDULO 6 — Licitação", "num": "Q9", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Modalidades: leilão, concorrência, convite e concurso. Termos como \"menor preço\" são critérios de julgamento, não modalidades.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q10", "bloco": "MÓDULO 6 — Licitação", "num": "Q10", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Lei 8.666/93 = normas para licitação e contratos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q11", "bloco": "MÓDULO 6 — Licitação", "num": "Q11", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Concorrência para obras acima de R$1,5 milhão (lei 8.666).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q12", "bloco": "MÓDULO 6 — Licitação", "num": "Q12", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Alteração do objeto (limpeza→vigilância) viola <b>vinculação ao edital</b> e a obrigatoriedade de licitar.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q1", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q1", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Publicação de contratos = <b>resumidamente</b> no órgão de imprensa oficial.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q2", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q2", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Contrato de frota para retirar neve onde não há neve = nulo por inexistência de motivo (teoria dos motivos determinantes).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q3", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q3", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Todo ajuste Adm. Pública + particular = <b>contrato</b> (art. 2º, §único, lei 8.666).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q4", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q4", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "NÃO é característica: <b>liberdade de forma</b> (contrato adm. exige forma escrita e formalismo).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q5", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q5", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Adm. NÃO pode <b>descumprir condições do edital</b> mesmo tendo cláusulas exorbitantes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q6", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q6", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Corretas: I (imprevisão abrange fatos imprevisíveis ou de consequências incalculáveis) e II (eventos supervenientes autorizam revisão para manter equilíbrio).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q7", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q7", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Apenas I correta: cláusulas exorbitantes. II=falsa (contratos adm. são mutáveis). III=falsa (são contratos de adesão).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q8", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q8", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Ambas corretas: regra=escrito; exceção=verbal para pequenas compras de pronto pagamento.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q9", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q9", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Todas corretas: teoria da imprevisão, supremacia com cláusulas exorbitantes, presença dessas cláusulas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q10", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q10", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Acréscimos obrigatórios: <b>25%</b> (obras/serviços/compras) e <b>50%</b> (reforma edifícios/equipamentos).", "repete": false, "repeteRef": "", "coment": ["<b>PEGADINHA numérica</b> — cai muito: 25% e 50%."]}, {"id": "M7-Q11", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q11", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Adm. não entregou local + não emitiu ordens = <b>fato da Administração</b> (omissão direta do contratante).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q12", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Q12", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Rescisão <b>amigável</b> (consensual) é possível (art. 79, II lei 8.666 / art. 138, II lei 14.133).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q1", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q1", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Cargos públicos podem ser ocupados por estrangeiros (art. 37, I CF — EC 19/98).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q2", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q2", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Admite-se acumulação excepcional de cargo em comissão em regime de interinidade (Lei 8.112, art. 9º parágrafo único).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q3", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q3", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Art. 37, I CF literal: cargos acessíveis a brasileiros e estrangeiros na forma da lei.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q4", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Modalidades de aposentadoria: invalidez, compulsória (75 anos) e voluntária.", "repete": true, "repeteRef": "base constitucional art. 40 §1º CF.", "coment": []}, {"id": "M8-Q5", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q5", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Acumulação lícita: professor + técnico ou científico (art. 37, XVI, \"b\" CF).", "repete": true, "repeteRef": "cobrado em Q6.", "coment": []}, {"id": "M8-Q6", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q6", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Nenhuma das alternativas A a D está correta (proibição abrange SEM; sem exigência de correlação; greve por lei específica; subtetos distintos por Poder).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q7", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q7", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Provimento <b>originário</b> = <b>nomeação</b>. Outros (readaptação, recondução, reversão, promoção) são derivados.", "repete": true, "repeteRef": "cobrado em Q10.", "coment": []}, {"id": "M8-Q8", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q8", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I=correta (readaptação, art. 24 lei 8.112); II=falsa (vacância inclui também exoneração e demissão).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q9", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q9", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Gestores de negócio (enchentes, epidemias) = <b>particulares em colaboração com o Poder Público</b>.", "repete": true, "repeteRef": "cobrado em Q11 com mesários.", "coment": []}, {"id": "M8-Q10", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q10", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "<b>Transferência</b> NÃO é forma de provimento — declarada inconstitucional (Súm. Vinc. 43 STF).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q11", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q11", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Mesário = <b>particular em colaboração</b> (agente honorífico, munus público transitório).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q12", "bloco": "MÓDULO 8 — Servidor Público", "num": "Q12", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Primeira assertiva verdadeira (servidor é espécie de agente público); segunda falsa (agente público = função pública, não privada).", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "Qual o mnemônico dos princípios constitucionais expressos no art. 37, caput CF?", "v": "<b>LIMPE</b> — Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Razoabilidade e proporcionalidade NÃO constam expressamente."}, {"id": "c2", "f": "Qual a diferença entre o princípio da legalidade para o particular e para a Administração?", "v": "Particular faz tudo que a lei <b>não proíbe</b>. Administração só faz o que a lei <b>expressamente autoriza</b> (Hely Lopes Meirelles)."}, {"id": "c3", "f": "Quais são os atributos do ato administrativo? (mnemônico PAIT)", "v": "<b>P</b>resunção de legitimidade (juris tantum), <b>A</b>utoexecutoriedade, <b>I</b>mperatividade/coercibilidade, <b>T</b>ipicidade. Finalidade é <b>requisito</b>, não atributo."}, {"id": "c4", "f": "Quais são os 5 requisitos/elementos de validade do ato administrativo?", "v": "<b>FF.COM</b> — Forma, Finalidade, Competência (sujeito), Objeto (conteúdo), Motivo. Base: art. 2º, Lei 4.717/65."}, {"id": "c5", "f": "Qual a diferença entre revogação e anulação de ato administrativo?", "v": "<b>Revogação</b> = inconveniência/inoportunidade, efeitos <b>ex nunc</b> (a partir de agora), só pela Administração. <b>Anulação</b> = ilegalidade, efeitos <b>ex tunc</b> (retroativo), pela Adm. ou Judiciário."}, {"id": "c6", "f": "O que é a Teoria dos Motivos Determinantes?", "v": "Se a Administração indicou motivos para praticar o ato (mesmo desnecessário), fica vinculada a eles. Motivo falso ou inexistente = ato nulo, inclusive nos casos de exoneração ad nutum com motivo declarado."}, {"id": "c7", "f": "Quais são os atributos do poder de polícia?", "v": "<b>Discricionariedade</b> (regra; há atos vinculados como licença para construir), <b>Autoexecutoriedade</b> (exigibilidade + executoriedade) e <b>Coercibilidade</b>. Multa é exigível mas NÃO executória."}, {"id": "c8", "f": "Qual a diferença entre licença e autorização no poder de polícia?", "v": "<b>Licença</b> = ato vinculado, gera direito subjetivo (se preenchidos requisitos, não pode ser negada). <b>Autorização</b> = ato discricionário, pode ser negada por interesse público mesmo preenchidos os requisitos."}, {"id": "c9", "f": "Qual a diferença entre desconcentração e descentralização?", "v": "<b>Desconcentração</b> = distribuição interna de competências dentro da mesma PJ, mantendo hierarquia (ex: Ministérios, Secretarias). <b>Descentralização</b> = transferência para PJ distinta (Autarquias, EP, SEM, Fundações)."}, {"id": "c10", "f": "Quais as diferenças entre Empresa Pública e Sociedade de Economia Mista?", "v": "<b>EP</b> = capital 100% público, qualquer forma jurídica, foro na Justiça Federal (federal). <b>SEM</b> = capital misto (maioria votante pública), só S/A, foro na Justiça Estadual (federal). Ambas são PJ de direito privado."}, {"id": "c11", "f": "O que são agências reguladoras? Como diferem das autarquias comuns?", "v": "São <b>autarquias sob regime especial</b> com mandato fixo e estabilidade dos dirigentes (não exoneração ad nutum). Diferem das autarquias comuns exatamente por essa proteção contra ingerência política."}, {"id": "c12", "f": "Qual a natureza jurídica da OAB?", "v": "Entidade <b>sui generis</b> — não é autarquia, não integra a Adm. Indireta da União. Não precisa realizar concurso público para contratar. (STF, ADI 3.026/2006)"}, {"id": "c13", "f": "Quais as modalidades de licitação da Lei 14.133/2021?", "v": "<b>Pregão</b> (bens/serviços comuns), <b>Concorrência</b> (bens/serviços especiais + obras, qualquer valor), <b>Concurso</b> (trabalho técnico/artístico), <b>Leilão</b> (alienação de bens), <b>Diálogo Competitivo</b> (inovação tecnológica). Extintos: tomada de preços e convite."}, {"id": "c14", "f": "Qual a diferença entre dispensa e inexigibilidade de licitação?", "v": "<b>Dispensa</b> = há viabilidade de competição, mas a lei autoriza não licitar por razões de conveniência (ex.: emergência, guerra, valores baixos). <b>Inexigibilidade</b> = inviabilidade de competição (fornecedor exclusivo, artista consagrado, notória especialização)."}, {"id": "c15", "f": "O que são cláusulas exorbitantes nos contratos administrativos?", "v": "Prerrogativas especiais da Administração: modificação unilateral, extinção unilateral, fiscalização, aplicação de sanções e ocupação provisória de bens. Não se admite alteração unilateral das cláusulas <b>econômico-financeiras</b>."}, {"id": "c16", "f": "Quais os percentuais de acréscimos/supressões obrigatórios nos contratos adm.?", "v": "Até <b>25%</b> para obras, serviços ou compras. Até <b>50%</b> no caso de acréscimos para reformas de edifícios ou equipamentos. (art. 65, §1º lei 8.666 / art. 125 lei 14.133)"}, {"id": "c17", "f": "Quais as modalidades de aposentadoria do servidor público (art. 40 CF)?", "v": "<b>Invalidez permanente</b> (proventos proporcionais, salvo acidente/doença grave = integrais), <b>Compulsória</b> aos 75 anos (EC 88/2015), <b>Voluntária</b> (tempo de contribuição + idade)."}, {"id": "c18", "f": "Quais as acumulações lícitas de cargos públicos (art. 37, XVI CF)?", "v": "(1) 2 cargos de <b>professor</b>; (2) 1 cargo de <b>professor + 1 técnico ou científico</b>; (3) 2 cargos de profissional de <b>saúde</b> com profissão regulamentada. Exige compatibilidade de horários."}, {"id": "c19", "f": "Qual a diferença entre cargo em comissão e função de confiança?", "v": "<b>Cargo em comissão</b>: livre nomeação e exoneração (ad nutum), pode ser ocupado por qualquer pessoa (sem concurso). <b>Função de confiança</b>: exclusiva para <b>servidores de carreira</b>. Ambos para direção, chefia e assessoramento (art. 37, V CF)."}, {"id": "c20", "f": "Quando a absolvição penal do servidor repercute nas esferas administrativa e civil?", "v": "Somente quando a absolvição se basear na <b>inexistência do fato</b> ou na <b>negativa de autoria</b>. Absolvição por falta de provas ou outros fundamentos NÃO afasta a responsabilidade adm. e civil. (art. 125 Lei 8.112/90)"}], "cobertura": ["São 96 questões (8 módulos de 12), com gabarito e comentário. Enunciados e alternativas completas não vieram.", "A revisão usa a Lei 14.133/2021, mas várias questões do AVA ainda se baseiam na Lei 8.666/1993.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "card", "ref": "c20", "titulo": "Artigo da Lei 8.112 provavelmente errado", "texto": "A regra de que a absolvição criminal por inexistência do fato ou negativa de autoria afasta a responsabilidade administrativa está no art. 126 da Lei 8.112/90. O art. 125 trata da independência das instâncias."}, {"esc": "card", "ref": "c17", "titulo": "Regra de aposentadoria que mudou", "texto": "A EC 103/2019 passou a chamar a invalidez de incapacidade permanente e alterou o cálculo dos proventos (integrais, em regra, só em acidente de trabalho, doença profissional e doença do trabalho). A versão “proporcionais, salvo doença grave” é a regra antiga. Veja qual versão o AVA cobra."}, {"esc": "revisao", "ref": "r7", "titulo": "Regra de aposentadoria que mudou", "texto": "Mesma observação do flashcard sobre aposentadoria por invalidez: a EC 103/2019 mudou a regra. Veja qual versão o AVA cobra."}, {"esc": "revisao", "ref": "r5", "titulo": "Valores de dispensa desatualizados", "texto": "Os valores de R$ 100 mil e R$ 50 mil são os originais da lei. Desde 1º/01/2026, pelo Decreto 12.807/2025, são R$ 130.984,20 (obras e engenharia) e R$ 65.492,11 (demais serviços e compras). Para a prova, vale o que o AVA disser."}, {"esc": "questao", "ref": "M1-Q2", "titulo": "Gabarito do AVA diverge do comentário", "texto": "O arquivo diz que a plataforma marcava E, mas adota A pela doutrina. Se a prova seguir o gabarito do AVA, a resposta esperada pode ser outra. Confira qual vale."}, {"esc": "questao", "ref": "M6-Q1", "titulo": "Questão baseada na Lei 8.666/93", "texto": "A Lei 8.666/93 foi revogada pela Lei 14.133/21. O comentário usa a lei antiga. Siga o gabarito do AVA."}, {"esc": "questao", "ref": "M6-Q6", "titulo": "Questão baseada na Lei 8.666/93", "texto": "Cita o art. 24, X, da Lei 8.666. Na lei nova, a dispensa está no art. 75. Siga o gabarito do AVA."}, {"esc": "questao", "ref": "M6-Q9", "titulo": "Questão baseada na Lei 8.666/93", "texto": "Lista modalidades da lei antiga (convite etc.). A Lei 14.133 extinguiu convite e tomada de preços. Siga o gabarito do AVA."}, {"esc": "questao", "ref": "M6-Q11", "titulo": "Questão baseada na Lei 8.666/93", "texto": "O valor de R$ 1,5 milhão é da lei antiga. Siga o gabarito do AVA."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["18A1"]={"cod": "18A1", "revisao": [{"id": "r1", "titulo": "MÓDULO 1 — Noções Gerais / Atos de Comércio / Empresário", "prob": "media", "html": "<ul>\n<li><strong>Direito Comercial</strong> = direito privado regulador dos atos necessários às atividades dos comerciantes e dos atos legalmente considerados comerciais</li>\n<li><strong>Principais leis:</strong> CC/2002 (Lei 10.406), LSA (Lei 6.404/76), Lei do Cheque (7.357/85), LPI (9.279/96), LRE (11.101/05), LUG (Dec. 57.663), Lei da Duplicata (5.474/68), Estatuto ME/EPP (LC 123/06)</li>\n<li><strong>CC/2002 unificou</strong> obrigações civis e comerciais — inspirado no modelo italiano de 1942</li>\n<li><strong>Teorias DC:</strong> (1) Direito do Comerciante; (2) Direito dos Atos de Comércio; (3) Direito das Empresas; (4) Direito dos Comerciantes + Atos de Comércio (mais aceita classicamente)</li>\n<li><strong>Características DC:</strong> simplicidade, internacionalidade, rapidez, boa-fé, onerosidade</li>\n<li><strong>DC ≠ Direito Civil:</strong> imóveis e atividade agrícola = regime civil; títulos cambiários = sempre comerciais</li>\n</ul>"}, {"id": "r2", "titulo": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "prob": "alta", "html": "<ul>\n<li><strong>Empresário</strong> (art. 966 CC): quem exerce <em>profissionalmente</em> atividade econômica <em>organizada</em> para produção/circulação de bens ou serviços</li>\n<li><strong>Requisitos:</strong> profissionalismo (habitualidade, pessoalidade, especialidade), atividade econômica, organização (capital, mão de obra, insumos, tecnologia), produção/circulação</li>\n<li><strong>NÃO é empresário</strong> (art. 966 § único): profissão intelectual (científica, literária, artística) — salvo se for <em>elemento de empresa</em></li>\n<li><strong>Empresário Individual:</strong> responsabilidade <em>direta, pessoal e ilimitada</em> (sem separação patrimonial)</li>\n<li><strong>Sociedade Empresária:</strong> responsabilidade dos sócios <em>subsidiária</em> (art. 1.024 CC)</li>\n<li><strong>MEI:</strong> LC 128/08; faturamento até R$ 81 mil/ano; recolhe INSS 5% + ISS + ICMS; não pode ter sócio</li>\n<li><strong>Simples Nacional:</strong> LC 123/06 — ME (até R$360k) e EPP (até R$4,8M)</li>\n<li><strong>Registro:</strong> JUCEX (Junta Comercial) — funções: publicidade, autenticidade, segurança, eficácia</li>\n<li><strong>Nome empresarial:</strong> firma (usa nome dos sócios) ou denominação (fantasia + objeto)</li>\n</ul>"}, {"id": "r3", "titulo": "MÓDULO 3 — Estabelecimento Empresarial / Clientela", "prob": "media", "html": "<ul>\n<li><strong>Estabelecimento</strong> (art. 1.142 CC) = complexo de bens organizado para exercício da empresa</li>\n<li><strong>Aviamento</strong> = capacidade potencial de gerar lucros (intangível)</li>\n<li><strong>Clientela</strong> = conjunto de clientes que frequentam o estabelecimento</li>\n<li><strong>Trespasse</strong> = alienação do estabelecimento empresarial; prazo de 30 dias para credores impugnarem</li>\n<li><strong>No trespasse:</strong> alienante <em>não pode se restabelecer</em> como concorrente por 5 anos (art. 1.147 CC)</li>\n<li><strong>Ponto empresarial:</strong> direito à renovação da locação (ação renovatória) — requisitos: contrato por escrito; prazo mínimo 5 anos; ramo por mínimo 3 anos</li>\n<li><strong>Ação renovatória:</strong> proposta 1 ano antes e até 6 meses antes do término do contrato</li>\n</ul>"}, {"id": "r4", "titulo": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "prob": "alta", "html": "<ul>\n<li><strong>INPI</strong> = órgão responsável pelo registro</li>\n<li><strong>Marca:</strong> sinal distintivo visualmente perceptível; proteção por 10 anos (renováveis indefinidamente)</li>\n<li><strong>Marcas NÃO registráveis:</strong> brasões/emblemas oficiais; letras/números isolados sem forma distintiva; expressões contrárias à moral; siglas de órgãos públicos; sinais genéricos/descritivos; nomes civis de terceiros sem consentimento; obras artísticas protegidas por direito autoral</li>\n<li><strong>Patente de invenção:</strong> 20 anos do depósito | <strong>Modelo de utilidade:</strong> 15 anos</li>\n<li><strong>Desenho Industrial:</strong> 10 anos (renováveis até 25 anos)</li>\n<li><strong>Indicação Geográfica:</strong> Indicação de Procedência + Denominação de Origem</li>\n<li><strong>Crime de concorrência desleal:</strong> art. 195 LPI</li>\n</ul>"}, {"id": "r5", "titulo": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "prob": "media", "html": "<ul>\n<li><strong>Sociedade empresária</strong> (art. 982): tem por objeto atividade de empresário sujeita a registro</li>\n<li><strong>Sociedade simples</strong> = exercício de atividade intelectual</li>\n<li><strong>Princípios:</strong> contrato social plurilateral, personificação jurídica, affectio societatis</li>\n<li><strong>Desconsideração da personalidade jurídica</strong> (art. 50 CC): abuso/desvio de finalidade ou confusão patrimonial → incidente processual (art. 133 CPC)</li>\n<li><strong>Sociedade não personificada:</strong> em comum (sem registro) e em conta de participação</li>\n<li><strong>Contrato social:</strong> pluralidade de sócios, capital social, affectio societatis, participação em lucros e perdas</li>\n</ul>"}, {"id": "r6", "titulo": "MÓDULO 6 — Sociedades Empresárias — Espécies", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Responsabilidade</th>\n<th>Registro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sociedade em Comum</td>\n<td>ilimitada e solidária (todos)</td>\n<td>sem registro</td>\n</tr>\n<tr>\n<td>Conta de Participação</td>\n<td>sócio ostensivo ilimitada; oculto limitada à participação</td>\n<td>facultativo</td>\n</tr>\n<tr>\n<td>Sociedade Simples</td>\n<td>limitada ou ilimitada conforme contrato</td>\n<td>RCPJ</td>\n</tr>\n<tr>\n<td>Em Nome Coletivo</td>\n<td>todos respondem ilimitada e solidariamente</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Em Comandita Simples</td>\n<td>comanditado: ilimitada; comanditário: limitada à quota</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Ltda</td>\n<td>limitada ao valor das quotas</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>S/A</td>\n<td>limitada ao preço de emissão das ações</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Comandita por Ações</td>\n<td>diretores: ilimitada; demais: limitada</td>\n<td>JUCEX</td>\n</tr>\n</tbody>\n</table></div>"}, {"id": "r7", "titulo": "MÓDULO 7 — Sociedade Limitada", "prob": "alta", "html": "<ul>\n<li><strong>Lei:</strong> arts. 1.052–1.087 CC + LSA subsidiariamente</li>\n<li><strong>Capital:</strong> dividido em quotas; sócios respondem solidariamente pela integralização</li>\n<li><strong>Cessão de quotas:</strong> requer aprovação de sócios com ≥ 3/4 do capital (salvo contrato diferente)</li>\n<li><strong>Administração:</strong> sócio ou não sócio (pessoa física capaz)</li>\n<li><strong>Deliberações:</strong> maioria = mais da metade do capital social; unanimidade = mudança de objeto, fusão, dissolução</li>\n<li><strong>Reunião ou Assembleia:</strong> obrigatória quando &gt;10 sócios; anual para aprovar contas</li>\n<li><strong>Exclusão de sócio:</strong> por justa causa, votação de sócios com ≥ 1/2 do capital restante</li>\n<li><strong>Dissolução:</strong> judicial ou extrajudicial</li>\n</ul>"}, {"id": "r8", "titulo": "MÓDULO 8 — Sociedade Anônima (Lei 6.404/76)", "prob": "alta", "html": "<ul>\n<li><strong>Conceito:</strong> capital dividido em ações; responsabilidade limitada ao preço de emissão das ações subscritas</li>\n<li><strong>Sempre empresarial</strong> independentemente do objeto (art. 1.089 CC)</li>\n<li><strong>Companhia aberta:</strong> ações negociadas em bolsa/mercado; sujeita à CVM</li>\n<li><strong>Companhia fechada:</strong> ações não negociadas publicamente</li>\n<li><strong>Tipos de ações:</strong> ordinárias (direito a voto), preferenciais (privilégios econômicos, podem não ter voto), de gozo/fruição</li>\n<li><strong>Forma das ações:</strong> sempre nominativas (desde Lei 8.021/90; ações ao portador foram extintas)</li>\n<li><strong>Denominação:</strong> usa \"S.A.\" ou \"Companhia\" (não firma)</li>\n<li><strong>Órgãos:</strong> Assembleia Geral (soberana), Conselho de Administração (facultativo em fechada), Diretoria (obrigatória), Conselho Fiscal (facultativo)</li>\n<li><strong>Responsabilidade do acionista:</strong> limitada ao preço de emissão; não há subsidiária pelas obrigações sociais</li>\n</ul>"}], "top5": ["Conceito de empresário (art. 966 CC)", "Tipos de sociedade e responsabilidade dos sócios", "Sociedade Limitada (quotas, cessão, deliberações)", "Sociedade Anônima (ações, tipos, denominação)", "Propriedade Industrial (prazos de patente/marca)"], "questoes": [{"id": "M1-Q1", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q1", "tema": "história/evolução do DC", "enun": "", "gab": "E", "gabLabel": "", "html": "O DC surgiu na <b>Idade Média</b> com as corporações de comerciantes, não na Antiguidade romana (onde havia jus civile aplicado a todos).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q2", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q2", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Teoria do DC como direito dos atos de comércio (Código Napoleônico 1807) — caracteriza como comercial o ato pela sua natureza, não pela pessoa do praticante.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q3", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Característica do DC: <b>simplicidade</b> (desformalização), internacionalidade, rapidez e boa-fé são os traços marcantes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q4", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q4", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Autonomia do DC em relação ao DC Civil: regulam campos distintos — imóveis e agricultura = civil; títulos de crédito = sempre comercial.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q5", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q5", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Legislação básica: CC/2002 (Lei 10.406), LSA (6.404/76), Lei do Cheque (7.357/85), LPI (9.279/96), LRE (11.101/05).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q6", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q6", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Teoria mais aceita: DC como direito dos <b>comerciantes + atos de comércio</b> (inclui atos de não comerciantes).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q7", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q7", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "O Código Civil de 2002 <b>revogou</b> o Código Comercial de 1850 e unificou obrigações civis e comerciais, inspirado no modelo italiano de 1942.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q8", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q8", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Boa-fé no DC: posse de boa-fé de título ao portador presume propriedade — função legitimadora amplíssima (diferente do DC Civil).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q9", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q9", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "DC = ramo do <b>Direito Privado</b> (não público), embora contenha normas de Direito Público em certos institutos (falência, transporte).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q10", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q10", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Características do DC: onerosidade, internacionalidade, rapidez, simplicidade e boa-fé (5 características clássicas).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q11", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q11", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Teoria das empresas: DC como direito das empresas — fundamento na organização de capital e trabalho para produção/circulação.", "repete": true, "repeteRef": "conceito Q6", "coment": []}, {"id": "M1-Q12", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q12", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Codificação napoleônica de 1807 influenciou: Nápoles, Bélgica, São Domingos, e indiretamente o <b>Código Comercial Brasileiro de 1850</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q13", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q13", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Direito Econômico ≠ DC: DE é mais amplo, inclui intervenção estatal imperativa na economia; DC é ramo dentro do DE.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q14", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q14", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Direito dos Negócios (Hamel e Lagarde) = amplia o DC para além da circulação de mercadorias, abrange negócios em geral.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q15", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q15", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Art. 966 CC: empresário = quem exerce <b>profissionalmente</b> atividade econômica organizada para produção/circulação de bens ou serviços.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q16", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q16", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Teoria do DC como direito do comerciante: superada, pois não abrange atos comerciais praticados por não comerciantes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q17", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q17", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "CC/2002: Livro II — \"Do Direito de Empresa\" — reuniu o DC ao Código Civil, revogando o CC Comercial de 1850 na parte de 1ª parte.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q18", "bloco": "MÓDULO 1 — Noções Gerais / Atos de Comércio", "num": "Q18", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Unificação do Direito Privado: tentativa de Teixeira de Freitas (1867) → não aceita; Suíça (1936) e Itália (1942) realizaram parcialmente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q1", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q1", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "ME: receita bruta ≤ R$ 360.000/ano; EPP: R$ 360.001 a R$ 4.800.000/ano (LC 123/06 art. 3º). <b>Pegadinha:</b> muitas questões colocam R$ 400k — ERRADO.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q2", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q2", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Empresário casado pode alienar bens imóveis <b>do patrimônio da empresa</b> sem outorga conjugal (são bens empresariais, não pessoais).", "repete": true, "repeteRef": "Q16 conceito patrimonial", "coment": []}, {"id": "M2-Q3", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "EIRELI: patrimônio social responde pelas dívidas, MAS a separação patrimonial pode ser desconsiderada (art. 50 CC) — não é absoluta. <b>Pegadinha:</b> a alternativa B diz \"em qualquer situação\" → INCORRETA (que é o que a questão pede).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q4", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q4", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "EIRELI: nome deve conter \"EIRELI\" após a firma/denominação; capital mínimo = 100× maior salário mínimo; pessoa natural só pode ter <b>uma</b> EIRELI.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q5", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Registro de incapaz como sócio: permitido se não exercer administração + capital totalmente integralizado + assistido/representado conforme o caso.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q6", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q6", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Competência para MS contra ato do Presidente da Junta Comercial = <b>Justiça Federal</b> (função federal delegada). Todas as assertivas da questão estavam erradas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q7", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q7", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Empresário rural: inscrição na Junta Comercial é <b>facultativa</b> (art. 971 CC) e pode ser feita mesmo <b>após</b> início das atividades.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q8", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q8", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Empresário que se torna incapaz: pode continuar a empresa por representante ou assistido; Junta Comercial registra contratos envolvendo incapazes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q9", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q9", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Livros empresariais: fazem prova <b>contra</b> o empresário sempre; fazem prova <b>a favor</b> quando sem vícios e confirmados por outros subsídios.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q10", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q10", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Nome empresarial: <b>IV e V corretas</b> — o nome NÃO pode ser alienado; a sociedade em conta de participação NÃO tem firma nem denominação.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q11", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q11", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Nome empresarial: vedada a alienação (art. 1.164 CC); princípios: veracidade e novidade.", "repete": true, "repeteRef": "Q10", "coment": []}, {"id": "M2-Q12", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q12", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "ME ≤ R$360k; EPP até R$4,8M — atenção: a pegadinha dos R$400k e dos R$5M aparece em múltiplas questões.", "repete": true, "repeteRef": "Q1", "coment": []}, {"id": "M2-Q13", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q13", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Escrituração: obrigatória para todos os empresários; livro Diário é obrigatório; conservação por 10 anos mínimo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q14", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q14", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Simples Nacional: não se aplica a empresas com sócio no exterior, com atividade de banco, CNAE vedados, faturamento acima do limite.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q15", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q15", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Junta Comercial: funções de dar publicidade, autenticidade, segurança e eficácia aos atos jurídicos das empresas (art. 8º Lei 8.934/94).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q16", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q16", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Empresário individual: responsabilidade ilimitada, pessoal e direta; sócio de sociedade: subsidiária.", "repete": true, "repeteRef": "conceito Q2", "coment": []}, {"id": "M2-Q17", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q17", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "MEI: pode ter 1 empregado; fatura até R$81k/ano; recolhe INSS 5% + ISS/ICMS fixo; não pode ser sócio de outra empresa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q18", "bloco": "MÓDULO 2 — Empresário / Registro / Escrituração / Nome Empresarial", "num": "Q18", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Redesim: sistema integrado de abertura/fechamento de empresas; reduz burocracia; integra DREI, INSS, RFB e municípios.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q1", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q1", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Estabelecimento (art. 1.142 CC) = complexo de bens organizados para exercício da empresa. Inclui bens materiais e imateriais (ponto, clientela, nome).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q2", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q2", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Aviamento = aptidão/capacidade de gerar lucro. É atributo do estabelecimento, não do empresário.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q3", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "No trespasse: alienante fica proibido de se restabelecer como concorrente por <b>5 anos</b> (art. 1.147 CC), salvo autorização expressa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q4", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q4", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Trespasse: credores podem impugnar em <b>30 dias</b> após publicação. Antes da quitação das dívidas, o adquirente responde solidariamente com o alienante.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q5", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Clientela: conjunto de clientes que frequentam o estabelecimento — elemento imaterial integrante do estabelecimento.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q6", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q6", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Ponto empresarial: direito à locação do espaço; protegido pela Lei de Locações (Lei 8.245/91) — ação renovatória.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q7", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q7", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Ação renovatória: requisitos — contrato escrito; prazo mínimo 5 anos (pode ser soma de contratos); ramo mínimo 3 anos; proposta 1 ano antes e até 6 meses antes do término.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q8", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q8", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Penhor do estabelecimento: é possível; difere da hipoteca (imóveis) e da anticrese.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q9", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q9", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Créditos no trespasse: o adquirente assume os contratos vinculados ao estabelecimento, salvo estipulação contrária (art. 1.148 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q10", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q10", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Cláusula de não restabelecimento: 5 anos para alienação definitiva; vigência do contrato para cessão de uso. Limites: territorial e de atividade.", "repete": true, "repeteRef": "Q3", "coment": []}, {"id": "M3-Q11", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q11", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Bem de família do empresário: a moradia pode ser penhorada para dívidas da atividade empresarial contraídas no curso do negócio.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q12", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q12", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Estabelecimento eletrônico (ponto empresarial digital): também protegido, com regras adaptadas à Lei de Locações.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q13", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q13", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Contestação da ação renovatória: locador pode contestar alegando: retomada sincera para uso próprio; reforma substancial; proposta de terceiro melhor.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q14", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q14", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Nome empresarial no trespasse: adquirente pode usar nome do alienante com indicação de \"sucessor\" (art. 1.164 § único CC), se autorizado.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q15", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q15", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Improcedência da renovação: locador pode retomar para uso próprio ou de cônjuge/descendente desde que comprovada a sinceridade (art. 52 L8.245/91).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q16", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q16", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Ação de despejo: cabe após extinção do contrato de locação não residencial não renovada judicialmente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q17", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q17", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Estabelecimento = universalidade de fato ou de direito? Doutrina majoritária: <b>universalidade de fato</b> (bens reunidos pela vontade do empresário).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q18", "bloco": "MÓDULO 3 — Estabelecimento Empresarial", "num": "Q18", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Locação empresarial: prazo mínimo de 5 anos para dar direito à renovatória (pode ser por meio de contratos sucessivos).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q1", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q1", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Patente de invenção: 20 anos da data do depósito. <b>Modelo de utilidade:</b> 15 anos. Nunca confundir os prazos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q2", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q2", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Marcas não registráveis: brasões/emblemas oficiais; letras isoladas; expressão imoral; sigla de órgão público; sinal genérico/descritivo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q3", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Registro de marca no INPI: proteção por 10 anos, renováveis indefinidamente por períodos iguais.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q4", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q4", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Patente: requisitos de patenteabilidade — novidade, atividade inventiva e aplicação industrial. Descoberta ≠ invenção.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q5", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q5", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Indicação Geográfica: IP (Indicação de Procedência) = local com reputação; DO (Denominação de Origem) = local + qualidade/características ligadas ao meio.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q6", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q6", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Desenho industrial: 10 anos do depósito, prorrogável por 3 períodos de 5 anos → máximo 25 anos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q7", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q7", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Crime co
