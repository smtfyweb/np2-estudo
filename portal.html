<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo UNIP: provas de 3 e 4 de novembro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f2f4f2; --surface:#fff; --surface-2:#e9edea; --ink:#15211d; --muted:#5b6a64; --line:#d6ddd8;
  --brand:#0f4c45; --brand-ink:#fff; --brand-soft:#dcebe7;
  --alta:#b4540a; --alta-soft:#fbeadb; --media:#3b5f9a; --media-soft:#e3ebf7;
  --ok:#17744a; --ok-soft:#dff3e8; --err:#b3363b; --err-soft:#fae3e4;
  --warn:#8a5a00; --warn-soft:#fff3d6;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --read:'Source Serif 4',Georgia,'Times New Roman',serif; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513; --surface:#16201c; --surface-2:#1d2a25; --ink:#e6eeea; --muted:#93a39b; --line:#2a3832;
    --brand:#5fc0ae; --brand-ink:#08201b; --brand-soft:#17332e;
    --alta:#f0a15e; --alta-soft:#3a2614; --media:#8fb3ec; --media-soft:#1a2a45;
    --ok:#5fd39b; --ok-soft:#133323; --err:#f08a8e; --err-soft:#3b1a1c; --warn:#f0c76a; --warn-soft:#3a2d0c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#16201c; --surface-2:#1d2a25; --ink:#e6eeea; --muted:#93a39b; --line:#2a3832;
  --brand:#5fc0ae; --brand-ink:#08201b; --brand-soft:#17332e;
  --alta:#f0a15e; --alta-soft:#3a2614; --media:#8fb3ec; --media-soft:#1a2a45;
  --ok:#5fd39b; --ok-soft:#133323; --err:#f08a8e; --err-soft:#3b1a1c; --warn:#f0c76a; --warn-soft:#3a2d0c; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none}
.mark-sq{width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px}
.mark small{font-weight:500;color:var(--muted);font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
main{max-width:960px;margin:0 auto;padding:28px 20px 96px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
h3{font-size:15px;font-weight:600}
.lede{color:var(--muted);margin-top:6px;max-width:62ch}

/* home */
.next{margin:22px 0 8px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next .cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand);font-size:18px}
.day{margin-top:30px}
.day h2{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.day h2::after{content:"";flex:1;height:1px;background:var(--line)}
.slots{list-style:none}
.slot{display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding-bottom:10px}
.slot-time{font-variant-numeric:tabular-nums;font-weight:600;padding-top:15px;text-align:right}
.slot-card{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;border-left:4px solid var(--line);transition:border-color .15s}
.slot-card:hover{border-color:var(--brand);border-left-color:var(--brand)}
.slot-card.ready{border-left-color:var(--brand)}
.slot-name{font-weight:600;line-height:1.3}
.slot-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot-side{display:flex;align-items:center;gap:12px}
.bar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pronto{background:var(--brand-soft);color:var(--brand)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.alta{background:var(--alta-soft);color:var(--alta)}
.chip.media{background:var(--media-soft);color:var(--media)}
.foot-note{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;max-width:70ch}

/* disciplina */
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:14px;text-decoration:none;margin-bottom:14px}
.voltar:hover{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;align-items:center;color:var(--muted);font-size:14px}
.panels{display:grid;gap:8px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .15s;margin-bottom:3px}
.panel[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.panel-b{padding:2px 16px 14px;border-top:1px solid var(--line);font-size:14.5px}
.panel-b ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.panel-b li{padding-left:14px;position:relative}
.panel-b li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:2px;background:var(--muted)}
.panel.info{border-color:var(--media)}
.panel.info>summary{color:var(--media)}
.tabs{display:flex;gap:4px;margin:22px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab span{font-weight:500;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fbtn{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface);white-space:nowrap}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:170px;max-width:320px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:14px}
.spacer{flex:1}
.count{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}

/* top5 + conferir + pegadinha */
.top5{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.top5 ol{margin:8px 0 0 20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.conferir{margin-top:14px;padding:11px 14px;background:var(--media-soft);border-left:3px solid var(--media);border-radius:8px;font-size:14px;line-height:1.55;max-width:68ch}
.conferir b{display:block;color:var(--media);font-size:13.5px;margin-bottom:2px}
.pega{margin-top:14px;padding:12px 14px;background:var(--warn-soft);border-radius:8px}

/* revisão */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;border-left:4px solid var(--line)}
.topic[data-p="alta"]{border-left-color:var(--alta)}
.topic[data-p="media"]{border-left-color:var(--media)}
.topic summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.topic summary::-webkit-details-marker{display:none}
.topic summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .15s;flex-shrink:0;margin-bottom:3px}
.topic[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.topic-t{font-weight:600;line-height:1.3}
.topic.done .topic-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.topic-body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.rev{font-family:var(--read);font-size:17px;line-height:1.7;max-width:70ch}
.rev p{margin-top:12px}
.rev ul,.rev ol{margin-top:10px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.rev ul ul{margin-top:6px}
.rev li::marker{color:var(--brand)}
.rev h3,.rev h4{font-family:var(--ui);margin-top:16px}
.rev .pega{font-size:16px}
.rev code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;margin-top:14px;max-width:100%}
.rev table{border-collapse:collapse;font-family:var(--ui);font-size:14px;line-height:1.45;min-width:420px;width:100%}
.rev th{background:var(--surface-2);text-align:left;font-weight:600}
.rev th,.rev td{padding:8px 11px;border:1px solid var(--line);vertical-align:top}
.check{display:flex;align-items:center;gap:8px;margin-top:16px;font-weight:600;font-size:14px;cursor:pointer;width:max-content}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* questões */
.gh{font-size:15px;font-weight:600;margin:22px 0 10px;color:var(--muted)}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.qrow-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qn{font-weight:700;font-variant-numeric:tabular-nums}
.qtema{color:var(--muted);font-size:14px;flex:1;min-width:120px}
.gab{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
.gab b{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:15px}
.gab span{font-size:13px;color:var(--muted);font-weight:500}
.qenun{font-family:var(--read);font-size:16.5px;line-height:1.6;margin-top:10px;color:var(--muted);font-style:italic;max-width:70ch}
.qtxt{font-family:var(--read);font-size:17px;line-height:1.65;margin-top:8px;max-width:70ch}
.qcom{font-family:var(--read);font-size:16px;line-height:1.6;margin-top:6px;color:var(--muted);max-width:70ch}
.sint{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:8px}
.sint h3{margin-bottom:4px}
.sint p{font-family:var(--read);font-size:16.5px;line-height:1.65;max-width:70ch}

/* flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.fc-scene{perspective:1400px;max-width:660px;margin:0 auto}
.fc{position:relative;height:min(400px,60vh);min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer;width:100%;display:block;text-align:left}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:26px 26px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--brand-soft);border-color:transparent}
.face .lab{font-size:13.5px;font-weight:600;color:var(--muted)}
.face.back .lab{color:var(--brand)}
.face .txt{font-family:var(--read);font-size:21px;line-height:1.5;margin:auto 0;padding:10px 0;max-width:40ch}
.face.back .txt{font-size:19px}
.face .hint{font-size:13px;color:var(--muted)}
.fc-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.wrong{border-color:var(--err);color:var(--err)}
.btn.right{border-color:var(--ok);color:var(--ok)}
.fc-note{max-width:660px;margin:14px auto 0}
.fc-done{text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:660px;margin:0 auto}
.fc-done h3{font-size:20px;margin-bottom:6px}
.kbd{color:var(--muted);font-size:12.5px}
.empty{padding:30px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

@media (max-width:600px){
  h1{font-size:23px} main{padding:20px 16px 90px} .top-in{padding:0 16px}
  .slot{grid-template-columns:46px 1fr;gap:0 10px} .slot-time{font-size:14px}
  .slot-card{grid-template-columns:1fr} .slot-side{justify-content:flex-start}
  .kbd{display:none} .face .txt{font-size:19px} .face.back .txt{font-size:17.5px}
  .rev{font-size:16.5px} .qrow{padding:12px 13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.tabs,.toolbar,.check,.panels{display:none}.topic{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="mark" href="#home" aria-label="Início"><span class="mark-sq">U</span><span>Estudo UNIP <small>10º semestre</small></span></a>
    <button class="icon-btn" id="theme" aria-label="Alternar tema claro e escuro" title="Alternar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="app"></main>
<script>window.DADOS=window.DADOS||{};window.DADOS["D05E"]={"cod": "D05E", "revisao": [{"id": "r1", "titulo": "Gênero discursivo jurídico", "prob": "media", "html": "<ul>\n<li>Objetivo único: <strong>conquista de adesão</strong> do interlocutor</li>\n<li>Lugar de enunciação principal trabalhado: <strong>Tribunal do Júri</strong></li>\n<li>Referência teórica central: <strong>Pêcheux (1969)</strong> — formações imaginárias</li>\n</ul>"}, {"id": "r2", "titulo": "Formações imaginárias (Pêcheux)", "prob": "alta", "html": "<p>Relação triádica: <strong>Eu — OUTRO — Referente</strong></p>\n<p>As 6 imagens constitutivas do discurso:</p>\n<ul>\n<li>A imagem que o OUTRO tem de mim para eu lhe falar assim</li>\n<li>A imagem que tenho do OUTRO para lhe falar assim</li>\n<li>A imagem que tenho de mim para que ele me fale assim</li>\n<li>A imagem que tenho dele para que ele me fale assim</li>\n<li>A imagem que tenho <strong>do que</strong> lhe falo</li>\n<li>A imagem que ele tem <strong>do que</strong> me fala</li>\n</ul>\n<p><strong>LEITOR VIRTUAL:</strong> inserido no texto no próprio ato da escrita; é imaginário; pode ser <strong>cúmplice</strong> (adere à tese) ou <strong>adversário</strong> (fonte de contra-argumentos a antecipar).</p>"}, {"id": "r3", "titulo": "Tese primária e teses secundárias", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tese Primária</th>\n<th>Teses Secundárias</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ideia central, não pode ser abandonada</td>\n<td>Contra-argumentos trazidos pelo próprio enunciador</td>\n</tr>\n<tr>\n<td>Deve ser retomada constantemente</td>\n<td>Servem para fortalecer a tese primária</td>\n</tr>\n<tr>\n<td>O enunciador <strong>jamais</strong> se afasta dela</td>\n<td>São <strong>refutadas</strong> no espaço discursivo do próprio enunciador</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"As teses secundárias questionam a tese primária\" → <strong>FALSO.</strong> Elas reforçam ao serem refutadas dentro do texto do enunciador.</p>"}, {"id": "r4", "titulo": "Estrutura do texto argumentativo", "prob": "media", "html": "<p><strong>Introdução:</strong> Apresenta o tema/tese primária. Primeiro contato com interlocutores. Pode elogiar a responsabilidade da audiência. <strong>Conquista já começa aqui</strong> (pegadinha: \"na introdução não cabe conquista\" → <strong>FALSO</strong>).</p>\n<p><strong>Desenvolvimento:</strong> Etapa mais crucial. Embate tese primária × teses secundárias. Contra-argumentos são derrubados aqui. <strong>Risco de alimentar o oponente.</strong> Estado de alerta contínuo.</p>\n<p><strong>Conclusão:</strong> Retoma a tese primária já respaldada. Sujeito apresenta-se vitorioso. <strong>Não</strong> basta \"fechar\" sem retomar a tese primária (pegadinha frequente).</p>"}, {"id": "r5", "titulo": "Convencer, persuadir e dissuadir", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ato</th>\n<th>Audiência</th>\n<th>Mecanismo</th>\n<th>Posicionamento anterior</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Convencer</strong></td>\n<td>Universal (racional)</td>\n<td>Razão/lógica</td>\n<td>Interlocutor <strong>ainda não</strong> se posicionou</td>\n</tr>\n<tr>\n<td><strong>Persuadir</strong></td>\n<td>Particular/específica (leigos)</td>\n<td>Apelo emocional</td>\n<td>Interlocutor já tem posição; exige mudança</td>\n</tr>\n<tr>\n<td><strong>Dissuadir</strong></td>\n<td>Particular</td>\n<td>Argumentação sólida</td>\n<td>Mais complexo; mexe em valores pessoais</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Perelman (1982):</strong> persuasão → audiência específica/leigos. Convencer → audiência universal.</p>\n<p class=\"pega\"><strong>PEGADINHA frequentíssima:</strong> \"Apenas persuadir e dissuadir exigem mudança de posicionamento\" → <strong>VERDADE.</strong> Convencer atua sobre quem ainda não decidiu.</p>\n<p class=\"pega\"><strong>PEGADINHA:</strong> assertivas que dizem que esses três atos atuam \"tão somente\" na direção de UM dos sujeitos (apenas enunciador OU apenas interlocutor) → <strong>SEMPRE ERRADAS.</strong> Atuam nos valores de ambos.</p>"}, {"id": "r6", "titulo": "Lugares da argumentação (Perelman)", "prob": "alta", "html": "<p>Premissas gerais que reforçam adesão a valores:</p>\n<ul>\n<li><strong>Lugar da Quantidade:</strong> mais serve a mais pessoas/mais durável = mais valioso</li>\n<li><strong>Lugar da Qualidade:</strong> o raro, o único, o irreversível vale mais</li>\n<li><strong>Lugar da Pessoa:</strong> pessoas &gt; coisas (\"Primeiro as pessoas, depois as coisas!\")</li>\n<li><strong>Lugar do Existente:</strong> prefere-se o que já existe ao que ainda não existe</li>\n<li><strong>Lugar de Essência:</strong> valoriza representantes perfeitos de uma categoria (Ferrari = bom carro)</li>\n<li><strong>Lugar da Ordem:</strong> o anterior funda o posterior</li>\n</ul>\n<p><strong>O que caracteriza um auditório:</strong> não os valores que admite, mas <strong>como os hierarquiza.</strong></p>"}, {"id": "r7", "titulo": "Hierarquia de valores", "prob": "alta", "html": "<ul>\n<li>Não existe hierarquia <strong>perfeita e ideal válida para todos os tempos e lugares</strong> → assertiva I correta nos dois questionários</li>\n<li>Valores universais (verdade, bem, belo, afeto, sagrado) <strong>devem</strong> ser priorizados</li>\n<li>Valores lógicos (razão/verdade), éticos (justiça, liberdade), estéticos (beleza)</li>\n</ul>"}, {"id": "r8", "titulo": "Heterogeneidade discursiva", "prob": "media", "html": "<ul>\n<li><strong>Mostrada/Marcada:</strong> citação identificada com aspas, referência ao autor → forma marcada</li>\n<li><strong>Constitutiva/Não marcada:</strong> discurso do outro incorporado sem demarcação → ilusão de autoria</li>\n<li>Ambas servem ao percurso argumentativo no Tribunal do Júri</li>\n<li>A <strong>ilusão de origem</strong> faz o sujeito crer que é a origem do seu discurso</li>\n</ul>"}, {"id": "r9", "titulo": "Estratégias argumentativas", "prob": "media", "html": "<ul>\n<li><strong>Argumento de autoridade:</strong> citar fonte confiável; <strong>obrigatório</strong> identificar o autor</li>\n<li><strong>Exemplificação/Ilustração:</strong> fato real ou fictício; útil para teses teóricas; digressões <em>necessárias</em> são válidas (orientar antes e concluir depois); digressões desnecessárias = prejuízo</li>\n<li><strong>Causa e consequência:</strong> motivos + efeitos; cria efeito de lógica</li>\n<li><strong>ABNT no texto escrito:</strong> erros ortográficos na citação → acrescentar (sic); cortes na citação → reticências entre colchetes [...]; grifo inserido → \"(grifo nosso)\"; grifo original → \"(grifo do autor)\"</li>\n</ul>"}, {"id": "r10", "titulo": "Lógica jurídica e dialética", "prob": "media", "html": "<ul>\n<li><strong>Lógica formal:</strong> cuida das regras do pensamento racional</li>\n<li><strong>Lógica material:</strong> investiga adequação do raciocínio à realidade</li>\n<li><strong>Silogismo:</strong> dedução de conclusão a partir de premissas</li>\n<li><strong>Dialética:</strong> diálogo, oposição de ideias entre posições antagônicas</li>\n<li><strong>Siches (Recaséns Siches):</strong> defende a \"lógica do razoável\" — razão impregnada de pontos de vista estimativos e axiológicos, com ensinamentos da experiência humana</li>\n<li><strong>Robert Alexy:</strong> teoria da argumentação capaz de distinguir bons dos maus argumentos; busca coerência lógica, não incoerência</li>\n</ul>"}, {"id": "r11", "titulo": "Artigos de lei citados", "prob": "media", "html": "<ul>\n<li><strong>Art. 5º LINDB:</strong> juiz atenderá aos fins sociais (interpretação teleológica)</li>\n<li><strong>Art. 489 §1º CPC:</strong> fundamentação exauriente; proibição de paráfrase genérica</li>\n<li><strong>Art. 326 CPC:</strong> pedidos subsidiários/alternativos (teses primárias antes das subsidiárias)</li>\n<li><strong>Art. 330 §1º CPC:</strong> inépcia da petição inicial (falta pedido/causa de pedir; narração não gera conclusão; pedidos incompatíveis)</li>\n</ul>"}, {"id": "r12", "titulo": "Pegadinhas e erros clássicos", "prob": "alta", "html": "<ol>\n<li>\"Na introdução não cabe conquista dos interlocutores\" → <strong>FALSO</strong></li>\n<li>\"Na conclusão basta fechar sem retomar a tese primária\" → <strong>FALSO</strong></li>\n<li>\"Teses secundárias questionam a tese primária\" → <strong>FALSO</strong> (elas são refutadas para reforçá-la)</li>\n<li>\"Argumentação por antecipação causa equívocos\" → <strong>FALSO</strong> (só ajuda)</li>\n<li>\"Formações imaginárias não influenciam a conquista de adesão\" → <strong>FALSO</strong></li>\n<li>Assertivas com \"tão somente\", \"apenas\", \"não pode\" restringindo o alcance dos atos de convencer/persuadir → <strong>SEMPRE ERRADAS</strong></li>\n<li>\"Convencer, persuadir e dissuadir exigem todos mudança de posicionamento\" → <strong>FALSO</strong> (apenas persuadir e dissuadir)</li>\n<li>\"É impossível prever os argumentos do interlocutor\" → <strong>FALSO</strong> (formações imaginárias permitem prever e antecipar)</li>\n<li>\"Fontes duvidosas ainda conquistam credibilidade\" → <strong>FALSO</strong></li>\n<li>Orador deve se adaptar ao público, não o contrário → <strong>assertivas I e III corretas</strong> (adaptação ao repertório e condições intelectuais da audiência)</li>\n</ol>"}], "top5": ["<b>Formações imaginárias + leitor virtual (cúmplice/adversário)</b> — cobrado em todos os questionários", "<b>Tese primária × teses secundárias</b> — cobrado em todos os questionários", "<b>Convencer × persuadir × dissuadir + audiência universal/particular</b> — cobrado em todos os questionários", "<b>Lugares da argumentação + hierarquia de valores</b> — cobrado em ambas as unidades", "<b>Estratégias argumentativas + lógica jurídica/dialética</b> — cobrado na Unidade II"], "questoes": [{"id": "Q1-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q1", "tema": "Hierarquia de valores", "enun": "\"Não é possível se definir uma hierarquia perfeita e ideal válida para todos os tempos e lugares\" — qual assertiva está correta?", "gab": "A", "gabLabel": "Apenas I", "html": "Apenas a assertiva I está correta. A hierarquia de valores é relativa ao tempo, cultura e contexto. Valores universais <i>devem</i> ser priorizados (o que torna II e III falsas). Hierarquia ideal universal não existe.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q2-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q2", "tema": "Legitimidade e credibilidade", "enun": "Qual afirmativa sobre verossimilhança, legitimidade e transparência é correta?", "gab": "D", "gabLabel": "Apenas IV", "html": "Apenas a IV está correta: enunciação formal exige preservação da urbanidade. Fontes duvidosas destroem credibilidade (I falsa). Dosagem da informação exige atenção constante (II falsa). Exemplos forjados/fantasiosos geram falta de credibilidade (III falsa).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q3-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q3", "tema": "Atos de convencer/persuadir/dissuadir", "enun": "Qual(is) afirmativa(s) sobre os três atos é/são <b>incorreta(s)</b>?", "gab": "C", "gabLabel": "Apenas I, II e III", "html": "O enunciado pede as INCORRETAS. I, II e III restringem indevidamente os atos a \"apenas um dos sujeitos\" ou negam a atuação sobre formações imaginárias. A IV é a única correta: os atos atuam sobre formações ideológicas e imaginárias de ambos.", "repete": true, "repeteRef": "", "coment": []}, {"id": "Q4-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q4", "tema": "Ajuste à audiência", "enun": "Ao organizar palestra sobre organizações criminosas, o sujeito enunciador deve observar:", "gab": "E", "gabLabel": "Todas são corretas", "html": "Todas as assertivas expressam requisitos do ajuste ao interlocutor: calibrar nível de linguagem, evitar jargões incompreensíveis, garantir legitimidade das fontes e preservar urbanidade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q5-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q5", "tema": "Interação sujeito × interlocutor na elaboração", "enun": "Qual(is) assertiva(s) descreve(m) bem a interação durante a elaboração do texto?", "gab": "E", "gabLabel": "Apenas III e IV", "html": "III e IV descrevem o papel das formações imaginárias no planejamento (projetar o interlocutor virtual para antecipar contra-argumentos e calibrar vocabulário). I e II são falsas: a antecipação ocorre no planejamento, não só na introdução; o imaginário é suficiente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q6-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q6", "tema": "Leitor virtual", "enun": "O recurso do leitor virtual favorece quem?", "gab": "E", "gabLabel": "Apenas IV", "html": "Favorece tanto defesa quanto promotoria — é ferramenta universal. Ambos medem o grau de aceitabilidade de suas teses. As alternativas I, II e III restringem indevidamente a apenas uma das partes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q7-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q7", "tema": "Honestidade e argumento ético", "enun": "\"O sujeito deve construir percurso argumentativo com honestidade e transparência PORQUE se falhar, o percurso será manipulação.\"", "gab": "B", "gabLabel": "Ambas verdadeiras e a segunda justifica a primeira", "html": "A segunda assertiva estabelece o nexo causal: a ausência de honestidade degrada a argumentação em manipulação, justificando a necessidade expressa na primeira.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q8-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q8", "tema": "Desenvolvimento do texto argumentativo", "enun": "Qual(is) assertiva(s) sobre o desenvolvimento é/são correta(s)?", "gab": "D", "gabLabel": "Apenas III e IV", "html": "I é falsa: teses secundárias <i>reforçam</i> a primária ao serem refutadas (não a questionam). II é falsa: contra-argumentos são derrubados no desenvolvimento, não na conclusão. III e IV alertam corretamente para o risco de alimentar o oponente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q9-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q9", "tema": "Contra-argumentos no Tribunal do Júri", "enun": "É possível o sujeito enunciador se servir de contra-argumentos à sua própria proposta?", "gab": "B", "gabLabel": "Apenas II", "html": "Sim, é possível e razoável antecipar contra-argumentos para negociar com o interlocutor imaginário e conquistar a adesão. Apenas a assertiva II combina corretamente \"é possível\" com \"é razoável negociar\".", "repete": true, "repeteRef": "", "coment": []}, {"id": "Q10-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q10", "tema": "Valor da pessoa", "enun": "Assertivas sobre o valor do \"outro\" como pessoa no percurso argumentativo:", "gab": "D", "gabLabel": "Todas são corretas", "html": "Todas traduzem o princípio central da comunicação empática: respeitar o outro como pessoa humana. Desconsiderar a existência da audiência gera rejeição imediata.", "repete": true, "repeteRef": "", "coment": []}, {"id": "AT1-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT1", "tema": "Formações imaginárias e leitor virtual", "enun": "Qual alternativa é correta quanto às formações imaginárias?", "gab": "A", "gabLabel": "", "html": "O leitor virtual é constitutivo do próprio ato da escrita/fala e pode ser cúmplice ou adversário. As demais negam indevidamente a antecipação ou afirmam que a antecipação causa equívocos.", "repete": true, "repeteRef": "Q9-I tema", "coment": []}, {"id": "AT2-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT2", "tema": "Teses primárias e secundárias", "enun": "Qual afirmação sobre a conquista de adesão à tese primária é correta?", "gab": "A", "gabLabel": "", "html": "A tese primária é reafirmada com o auxílio estratégico das teses secundárias, que são refutadas no espaço discursivo do próprio enunciador.", "repete": true, "repeteRef": "Q8-I tema", "coment": []}, {"id": "AT3-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT3", "tema": "Convencer, persuadir, dissuadir", "enun": "Qual alternativa descreve melhor os três atos?", "gab": "B", "gabLabel": "", "html": "A persuasão opera sobre audiência específica/particular. O ato de persuadir exige conhecimento das singularidades da audiência endereçada (diferente do convencer que apela à razão universal).\n<i>Atenção: na Atividade Teleaula o gabarito é B (persuadir → audiência específica), enquanto no Questionário Unidade I a Q3 o gabarito é D (abrange os três atos). Questões diferentes, ler atentamente o enunciado.</i>", "repete": true, "repeteRef": "Q3-I tema", "coment": []}, {"id": "AT4-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT4", "tema": "Adaptação ao público", "enun": "Qual(is) assertiva(s) está(ão) correta(s): I (o enunciador se adapta ao público), II (o público se adapta ao enunciador), III (atentar ao repertório do público)?", "gab": "B", "gabLabel": "I e III", "html": "O enunciador deve adaptar-se ao público (I), não o contrário (II falsa). Atentar ao repertório da audiência é requisito da eficácia comunicativa (III correta).", "repete": true, "repeteRef": "", "coment": []}, {"id": "Q1-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q1", "tema": "Contra-argumentos no Júri", "enun": "Qual alternativa sobre o uso de contra-argumentos é correta?", "gab": "D", "gabLabel": "", "html": "É possível e razoável servir-se de contra-argumentos para negociar com o interlocutor imaginário e conquistar adesão. Alternativa D combina os dois elementos corretos.", "repete": true, "repeteRef": "Q9-I", "coment": []}, {"id": "Q2-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q2", "tema": "Ajuste ao júri na réplica de crime passional", "enun": "Qual(is) assertiva(s) sobre o promotor na réplica é/são correta(s)?", "gab": "B", "gabLabel": "Apenas I e IV", "html": "I: o promotor deve preparar os jurados para não absolver (não só para condenar). IV: deve antecipar os movimentos da defesa para blindar contra a sedução da tréplica. II e III incorretas porque descrevem estratégias ineficazes ou enganosas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q3-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q3", "tema": "Marca do texto argumentativo", "enun": "A conquista de adesão é imprescindível para o texto argumentativo jurídico?", "gab": "C", "gabLabel": "", "html": "Sim, é imprescindível para o texto argumentativo jurídico assim como para todos os gêneros discursivos. Alternativas que excluem o jurídico ou afirmam irrelevância estão erradas.", "repete": true, "repeteRef": "", "coment": []}, {"id": "Q4-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q4", "tema": "Verossimilhança e credibilidade", "enun": "Qual assertiva sobre legitimidade das informações é verdadeira?", "gab": "D", "gabLabel": "Apenas IV", "html": "Idêntica à Q2 do Questionário I: apenas a IV (urbanidade na enunciação formal) é verdadeira. I, II e III contêm erros sobre fontes duvidosas, dosagem da informação e exemplos forjados.", "repete": true, "repeteRef": "Q2-I", "coment": []}, {"id": "Q5-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q5", "tema": "Formações imaginárias e seleção de argumentos", "enun": "Qual(is) assertiva(s) sobre as formações imaginárias é/são correta(s)?", "gab": "A", "gabLabel": "Apenas I e II", "html": "I: os interlocutores são definidos pelo enunciador no ato da elaboração. II: essa projeção imaginária orienta a seleção de argumentos e contra-argumentos. III é falsa (formulação parcial); IV é falsa (nega o favorecimento).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q6-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q6", "tema": "Interação sujeito × interlocutor", "enun": "Qual(is) assertiva(s) melhor descreve(m) a interação durante a elaboração?", "gab": "E", "gabLabel": "Apenas III e IV", "html": "Idêntica à Q5-I: formações imaginárias orientam o planejamento discursivo para antecipar contra-argumentos e calibrar vocabulário.", "repete": true, "repeteRef": "Q5-I", "coment": []}, {"id": "Q7-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q7", "tema": "Atos de convencer/persuadir/dissuadir", "enun": "Qual(is) assertiva(s) sobre os três atos é/são coerente(s) com a teoria?", "gab": "E", "gabLabel": "Todas são incoerentes", "html": "Todas as assertivas usam restrições indevidas (\"não\", \"tão somente\", \"apenas\"). Os três atos atuam sobre formações ideológicas, imaginárias e discursivas de ambos os sujeitos. Nenhuma das quatro assertivas está correta.", "repete": true, "repeteRef": "Q3-I", "coment": []}, {"id": "Q8-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q8", "tema": "Processo de elaboração e os três atos", "enun": "Qual(is) assertiva(s) é/são correta(s)?", "gab": "B", "gabLabel": "Apenas I, III e IV", "html": "II é falsa: convencer exige esforço argumentativo sólido (apelo à razão). I, III e IV descrevem corretamente a natureza contínua do ajuste ao interlocutor e a complexidade ideológica da persuasão e da dissuasão.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q9-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q9", "tema": "Valor do \"outro\" como pessoa", "enun": "Assertivas sobre o valor do outro no percurso argumentativo:", "gab": "D", "gabLabel": "Todas são corretas", "html": "Idêntica à Q10-I: o respeito ao interlocutor como pessoa é pilar do ethos. Ignorar ou desvalorizar a audiência gera rejeição.", "repete": true, "repeteRef": "Q10-I", "coment": []}, {"id": "Q10-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q10", "tema": "Hierarquia de valores", "enun": "Qual assertiva sobre a hierarquia de valores está correta?", "gab": "A", "gabLabel": "Apenas I", "html": "Idêntica à Q1-I: apenas a assertiva I (não existe hierarquia perfeita universal) está correta.", "repete": true, "repeteRef": "Q1-I", "coment": []}, {"id": "AT1-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT1", "tema": "Dificuldade na hierarquia de valores", "enun": "Por que é difícil estabelecer hierarquia de valores?", "gab": "B", "gabLabel": "", "html": "A dificuldade reside na questão da objetividade versus subjetividade dos valores. Cada sujeito atravessa os valores com sua história e cultura, impedindo uma hierarquia objetiva fixa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT2-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT2", "tema": "Heterogeneidade discursiva no Júri", "enun": "Quais assertivas sobre heterogeneidade discursiva são corretas?", "gab": "E", "gabLabel": "Todas são corretas", "html": "Todas as assertivas (I a V) descrevem corretamente os mecanismos de polifonia: integração de vozes marcada (mostrada) e não marcada (constitutiva), ilusão de autoria, princípio de autoria e confirmação/refutação do discurso alheio.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT3-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT3", "tema": "Estratégias argumentativas", "enun": "Qual alternativa sobre estratégias argumentativas está correta?", "gab": "D", "gabLabel": "", "html": "Argumento de exemplificação: fatos reais/fictícios concretizam teses teóricas; digressões necessárias são válidas se orientadas antes e concluídas depois. A (autoridade dispensa referência → falso), B (citação dispensa identificação → falso), C (ABNT no oral → equivocado), E (Siches e lógica formal estão trocados → falso).", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT4-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT4", "tema": "Lógica jurídica e dialética", "enun": "Qual alternativa descreve corretamente a lógica jurídica?", "gab": "E", "gabLabel": "", "html": "A dialética é o diálogo entre posições antagônicas. Siches defende a \"lógica do razoável\" (razão impregnada de valorações axiológicas e experiência humana). A (lógica não cria verdade matemática), B (indução parte de dados particulares, não genéricos), C (lógica formal/material invertidas), D (Alexy busca coerência, não incoerência).", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "O que é o \"leitor virtual\" no discurso jurídico?", "v": "Leitor imaginário inserido no próprio ato da escrita/fala; pode ser <b>cúmplice</b> (adere à tese) ou <b>adversário</b> (fonte de objeções a antecipar). Nunca tem identidade real — é construído pelas formações imaginárias."}, {"id": "c2", "f": "Qual é a relação triádica das formações imaginárias segundo Pêcheux (1969)?", "v": "<b>Eu — OUTRO — Referente.</b> O enunciador projeta imagens de si, do interlocutor e do objeto do discurso para orientar toda a estrutura argumentativa."}, {"id": "c3", "f": "O que é a tese primária e de que ela o enunciador jamais pode se afastar?", "v": "É a ideia central do discurso, o ponto de vista principal. O enunciador deve retomá-la constantemente em diversas formas para fixá-la na mente dos interlocutores."}, {"id": "c4", "f": "Qual é a função das teses secundárias?", "v": "Trazer <b>contra-argumentos</b> para o espaço discursivo do enunciador e ser <b>refutadas por ele mesmo</b>, fortalecendo a tese primária. Não questionam — reforçam ao ser demolidas."}, {"id": "c5", "f": "Antecipar contra-argumentos prejudica ou beneficia o enunciador?", "v": "<b>Beneficia sempre.</b> Mostra domínio do assunto, enfraquece o oponente (que fica \"esvaziado de argumentos\" e \"de mãos atadas\") e demonstra ao interlocutor que o enunciador conhece os dois lados."}, {"id": "c6", "f": "Qual a diferença entre convencer e persuadir segundo Perelman?", "v": "<b>Convencer</b> → audiência universal, apelo à razão, interlocutor que ainda não se posicionou. <b>Persuadir</b> → audiência particular/específica (leigos), apelo emocional, requer mudança de posicionamento já assumido."}, {"id": "c7", "f": "Dissuadir é mais fácil ou mais difícil que persuadir? Por quê?", "v": "<b>Mais difícil.</b> Exige que o interlocutor abandone uma posição já tomada, o que toca em seus valores pessoais, gerando conflito ideológico e resistência interna."}, {"id": "c8", "f": "Assertivas que dizem que convencer/persuadir/dissuadir atuam \"tão somente\" na direção de um dos sujeitos estão corretas?", "v": "<b>Sempre erradas.</b> Os três atos atuam sobre formações ideológicas, imaginárias e discursivas de <b>ambos</b> — enunciador e interlocutor."}, {"id": "c9", "f": "No texto argumentativo, em qual etapa os contra-argumentos são derrubados?", "v": "No <b>desenvolvimento</b> — etapa mais crucial. A conclusão apenas retoma a tese primária já respaldada; não é o local de derrubar contra-argumentos."}, {"id": "c10", "f": "É correto afirmar que \"na introdução não cabe conquista dos interlocutores\"?", "v": "<b>Falso.</b> A conquista começa já na introdução: o enunciador pode elogiar a responsabilidade e a importância dos interlocutores, preparando terreno para a adesão."}, {"id": "c11", "f": "O que o \"lugar da pessoa\" valoriza na argumentação?", "v": "A superioridade daquilo ligado às <b>pessoas</b> sobre as coisas. Slogan: \"Primeiro as pessoas, depois as coisas.\" Ex: prometem-se melhores condições ao professor, não apenas construção de escolas."}, {"id": "c12", "f": "O que é o \"lugar do existente\" e como se aplica?", "v": "Prefere-se o que <b>já existe</b> ao que ainda não existe. Ex: o emprego atual vale mais na argumentação do que o emprego prometido para o futuro."}, {"id": "c13", "f": "O que caracteriza um auditório, segundo a teoria dos lugares da argumentação?", "v": "Não são os valores que ele admite, mas <b>como os hierarquiza.</b> A hierarquia varia por cultura, ideologia e história pessoal."}, {"id": "c14", "f": "É possível definir uma hierarquia de valores perfeita e universal?", "v": "<b>Não.</b> A hierarquia é relativa ao tempo, cultura e subjetividade. Assertiva I do Q1 (ambas unidades): \"Não é possível definir hierarquia perfeita válida para todos os tempos e lugares\" → CORRETA."}, {"id": "c15", "f": "O enunciador deve se adaptar ao público ou o público ao enunciador?", "v": "O <b>enunciador</b> se adapta ao público (assertivas I e III corretas). Não usar termos técnicos para quem não é da área; atentar ao repertório da audiência. A assertiva II (\"o público se adapta a nós\") é sempre falsa."}, {"id": "c16", "f": "O que é heterogeneidade discursiva mostrada vs. constitutiva?", "v": "<b>Mostrada/marcada:</b> discurso do outro identificado (aspas, referência ao autor). <b>Constitutiva/não marcada:</b> discurso do outro incorporado sem demarcação, criando a \"ilusão de autoria\"."}, {"id": "c17", "f": "O que é a \"ilusão de origem\" no discurso jurídico?", "v": "A crença do enunciador de que é a origem de seu próprio discurso, mesmo quando incorpora vozes alheias não marcadas. O sujeito \"reafirma sua onipotência\" ao demarcar ou não o discurso do outro."}, {"id": "c18", "f": "Qual é o conceito de dialética segundo o material?", "v": "Diálogo — oposição de ideias e razões entre posições inicialmente antagônicas. Difere da lógica formal dedutiva pura."}, {"id": "c19", "f": "O que Siches (Recaséns Siches) defende sobre a lógica jurídica?", "v": "A \"lógica do razoável\" (logica de lo razonable): razão impregnada de <b>pontos de vista estimativos, valorações axiológicas</b> e ensinamentos da experiência humana própria e coletiva — oposta à lógica formal pura."}, {"id": "c20", "f": "Quais são as causas de inépcia da petição inicial (Art. 330 §1º CPC)?", "v": "(1) Falta pedido ou causa de pedir; (2) pedido indeterminado; (3) da narração dos fatos não decorre logicamente a conclusão (quebra do encadeamento lógico-discursivo); (4) pedidos incompatíveis entre si."}], "cobertura": ["As videoaulas 3 e 4 de cada unidade não foram lidas uma a uma. O resumo presume que repetem o que já está nos slides e livros.", "Os arquivos de questões trazem tema, gabarito e comentário. Enunciados e alternativas completas não vieram.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "questao", "ref": "AT3-I", "titulo": "Gabarito possivelmente trocado", "texto": "O comentário diz que a Q3 do Questionário I tem gabarito D, mas a Q3-I está registrada como C neste mesmo material. Uma das duas informações está errada. Confira no AVA."}, {"esc": "questao", "ref": "Q3-I", "titulo": "Gabarito possivelmente trocado", "texto": "A Q3-I está como C aqui, mas o comentário da AT3-I a cita como D. Confira no AVA."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["803X"]={"cod": "803X", "revisao": [{"id": "r1", "titulo": "MÓDULO 1 — Meios de Solução de Conflitos", "prob": "alta", "html": "<p><strong>Autocomposição</strong> (solução pelas próprias partes):</p>\n<ul>\n<li><strong>Desistência</strong> = renúncia à pretensão</li>\n<li><strong>Submissão</strong> = renúncia à resistência</li>\n<li><strong>Transação</strong> = concessões recíprocas</li>\n<li>Modalidades: negociação (sem terceiro), conciliação, mediação</li>\n</ul>\n<p><strong>Distinção conciliação × mediação (art. 165 CPC):</strong></p>\n<ul>\n<li>Conciliação → sem vínculo anterior entre as partes; conciliador PODE sugerir soluções</li>\n<li>Mediação → com vínculo anterior; mediador NÃO sugere; restabelece o diálogo</li>\n</ul>\n<p><strong>Heterocomposição</strong> (terceiro decide): arbitragem + jurisdição</p>\n<p><strong>Arbitragem (Lei 9.307/96):</strong></p>\n<ul>\n<li>Só para direitos patrimoniais DISPONÍVEIS</li>\n<li>Sentença arbitral = título executivo judicial (art. 515, VII, CPC)</li>\n<li>Cláusula compromissória: prévia, para litígios futuros (art. 4º)</li>\n<li>Compromisso arbitral: submete litígio já existente (art. 9º) — pode ser judicial ou extrajudicial</li>\n</ul>\n<p><strong>Autotutela:</strong> crime — art. 345 CP (exercício arbitrário das próprias razões)</p>\n<ul>\n<li>Exceções legais: legítima defesa da posse (art. 1.210, §1º CC), legítima defesa/estado de necessidade (art. 23 CP)</li>\n</ul>"}, {"id": "r2", "titulo": "MÓDULO 2 — Direito Processual: Conceito, Autonomia, Divisão", "prob": "alta", "html": "<p><strong>Competência legislativa:</strong></p>\n<ul>\n<li>PRIVATIVA da União: direito processual (art. 22, I, CF)</li>\n<li>CONCORRENTE União/Estados/DF: <em>procedimentos</em> em matéria processual (art. 24, XI, CF)</li>\n<li>Se inexistir lei federal: Estado exerce competência legislativa plena (art. 24, §3º)</li>\n</ul>\n<p><strong>Medidas Provisórias NÃO podem versar sobre:</strong> direito penal + processual penal + processual civil (art. 62, §1º, I, \"b\", CF)</p>\n<p><strong>Fontes formais do direito processual:</strong> CF + leis federais (lei municipal NÃO é fonte)</p>\n<p><strong>Direito processual:</strong> ramo do direito PÚBLICO; autônomo, mas instrumental ao direito material</p>\n<p><strong>Divisão:</strong> processual civil / penal / trabalho / eleitoral / penal militar</p>\n<p><strong>Escopos do processo:</strong> pacificação (principal), educação, preservação da liberdade, respeito ao ordenamento, atuação da vontade concreta do direito</p>"}, {"id": "r3", "titulo": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "prob": "alta", "html": "<p><strong>Fontes (art. 4º LINDB):</strong> lei (primária) → analogia → costumes → princípios gerais de direito</p>\n<p><strong>Características da lei:</strong> generalidade, imperatividade, autorizamento, permanência, emanada por autoridade competente (\"relatividade\" NÃO é característica)</p>\n<p><strong>Analogia:</strong> <em>legis</em> = aplica norma similar ao caso omisso; <em>juris</em> = aplica o sistema jurídico geral</p>\n<p><strong>Costume:</strong> requisito subjetivo (crença de obrigatoriedade) + objetivo (constância do ato)</p>\n<p><strong>Métodos de interpretação</strong> (sem hierarquia entre eles):</p>\n<ul>\n<li>Gramatical/literal, lógica, sistemática, histórica, sociológica/teleológica</li>\n<li>Autêntica (legislador), doutrinária (doutores), jurisprudencial (juízes) — são DIFERENTES</li>\n<li>Declarativa, extensiva, restritiva, ab-rogante</li>\n</ul>\n<p><strong>Vacatio legis (art. 1º LINDB):</strong> 45 dias após publicação (não promulgação); 3 meses no exterior</p>\n<p><strong>Eficácia no tempo:</strong> teoria do isolamento dos atos processuais (art. 14 CPC) — lei nova aplica-se imediatamente aos processos em curso, respeitados os atos já praticados</p>\n<p><strong>Limites constitucionais à retroatividade (art. 5º, XXXVI, CF):</strong> direito adquirido + ato jurídico perfeito + coisa julgada (tríplice garantia)</p>\n<p><strong>Eficácia no espaço:</strong> princípio da territorialidade — lei processual brasileira rege a jurisdição civil, salvo tratados (art. 13 CPC)</p>"}, {"id": "r4", "titulo": "MÓDULO 4 — Princípios Constitucionais do Processo", "prob": "alta", "html": "<p><strong>Distinção regra × princípio:</strong> regra = tudo ou nada; princípio = ponderação, máxima aplicação possível. Conflito de princípios → ponderação (um cede, não é invalidado)</p>\n<p><strong>Principais princípios:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Princípio</th>\n<th>Base legal</th>\n<th>Essência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tutela constitucional</td>\n<td>Art. 1º CPC</td>\n<td>Processo subordinado à CF</td>\n</tr>\n<tr>\n<td>Inafastabilidade</td>\n<td>Art. 5º, XXXV CF + art. 3º CPC</td>\n<td>Lei não pode excluir lesão/ameaça do Judiciário</td>\n</tr>\n<tr>\n<td>Juiz natural</td>\n<td>Art. 5º, LIII e XXXVII CF</td>\n<td>Juiz pré-constituído; proíbe tribunal de exceção</td>\n</tr>\n<tr>\n<td>Devido processo legal</td>\n<td>Art. 5º, LIV CF</td>\n<td>Super princípio; gênero dos demais</td>\n</tr>\n<tr>\n<td>Contraditório e ampla defesa</td>\n<td>Art. 5º, LV CF + arts. 7º, 9º, 10 CPC</td>\n<td>Vedação de decisão surpresa (art. 10)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Devido processo legal</strong> = super princípio (gênero do qual os demais são espécies)</p>\n<p><strong>Garantias do juiz natural:</strong> vitaliciedade, inamovibilidade, irredutibilidade de vencimentos</p>"}, {"id": "r5", "titulo": "MÓDULO 5 — Princípios Informativos do Procedimento", "prob": "media", "html": "<ul>\n<li><strong>Oralidade:</strong> prevalência da comunicação oral; não exige atos orais — é faculdade; aplica-se à conciliação/mediação (art. 166 CPC)</li>\n<li><strong>Economia processual:</strong> máximo resultado com mínimo de atos; macro (evitar multiplicidade de processos) e micro (usar bem as ferramentas disponíveis)</li>\n<li><strong>Eventualidade/preclusão:</strong> atos processuais praticados no momento oportuno, de uma vez (art. 507 CPC); também chamado de concentração; deduzido e dedutível (art. 508 CPC)</li>\n</ul>"}, {"id": "r6", "titulo": "MÓDULO 6 — Jurisdição", "prob": "media", "html": "<p><strong>Conceito:</strong> poder/função/atividade de aplicar o direito a fato concreto, obtendo a justa composição da lide</p>\n<p><strong>Características:</strong></p>\n<ul>\n<li><strong>Substitutiva:</strong> Estado substitui as partes (imparcialidade)</li>\n<li><strong>Instrumental:</strong> torna efetivas as normas abstratas</li>\n<li><strong>Definitiva/imutável:</strong> coisa julgada; reserva de sentença (outros poderes não revisam)</li>\n<li><strong>Natureza declaratória:</strong> reconhece direitos preexistentes, não cria</li>\n<li><strong>Imperativa:</strong> obrigatoriedade de cumprir decisões (multa art. 77, §2º CPC; crime desobediência art. 330 CP)</li>\n</ul>\n<p><strong>Princípios da jurisdição:</strong></p>\n<ul>\n<li><strong>Inércia:</strong> <em>ne procedat judex ex officio</em> (art. 2º CPC) — processo começa por iniciativa da parte</li>\n<li><strong>Inevitabilidade:</strong> partes não podem afastar os efeitos</li>\n<li><strong>Indelegabilidade:</strong> juiz não delega (arbitragem não é delegação — fonte é a liberdade das partes)</li>\n<li><strong>Juiz natural, duplo grau, investidura, aderência ao território, inafastabilidade</strong></li>\n</ul>\n<p><strong>Espécies:</strong></p>\n<ul>\n<li>Por matéria: civil, penal, especial (trabalho, eleitoral, militar penal)</li>\n<li>Por grau: inferior (1ª instância), superior (recursal)</li>\n<li>Contenciosa (lide) × voluntária (administração de interesses privados, sem lide)</li>\n</ul>"}, {"id": "r7", "titulo": "MÓDULO 7 — Ação", "prob": "media", "html": "<p><strong>Teorias da ação:</strong></p>\n<ul>\n<li><strong>Civilista:</strong> actio = direito material (Roma); não há ação sem direito</li>\n<li><strong>Concreta (Wach):</strong> ação só existe se sentença for favorável</li>\n<li><strong>Potestativa (Chiovenda):</strong> direito contra o adversário (não contra o Estado)</li>\n<li><strong>Abstrata (Degenkolb):</strong> ação independe do direito material; basta interesse em abstrato</li>\n<li><strong>Eclética (Liebman):</strong> autônoma e abstrata, mas condicionada às <em>condições da ação</em>: possibilidade jurídica do pedido + interesse de agir + legitimidade</li>\n</ul>\n<p><strong>CPC atual:</strong> abandonou teoria eclética. Usa <strong>teoria da asserção</strong> — condições analisadas com base nas afirmações da petição inicial; legitimidade e interesse = pressupostos processuais; possibilidade jurídica = mérito</p>\n<p><strong>Condições da ação (análise pela asserção):</strong></p>\n<ul>\n<li>Legitimidade ad causam</li>\n<li>Interesse de agir (necessidade + adequação)</li>\n<li>Possibilidade jurídica do pedido (agora = questão de mérito)</li>\n</ul>"}, {"id": "r8", "titulo": "MÓDULO 8 — Competência", "prob": "alta", "html": "<p><strong>Competência = medida da jurisdição</strong></p>\n<p><strong>Critérios:</strong></p>\n<ul>\n<li>Objetivo: em razão da matéria, do valor, da pessoa</li>\n<li>Funcional: horizontal (mesmo grau) e vertical (graus diferentes)</li>\n<li>Territorial: domicílio do réu (regra geral, art. 46 CPC)</li>\n</ul>\n<p><strong>Competência absoluta:</strong> interesse público; pode ser arguida a qualquer tempo e de ofício; não prorroga</p>\n<ul>\n<li>Hipóteses: matéria, pessoa, funcional, territorial art. 47, §1º</li>\n</ul>\n<p><strong>Competência relativa:</strong> interesse privado; deve ser arguida na contestação (preliminar), sob pena de prorrogação; admite foro de eleição</p>\n<ul>\n<li>Hipóteses: valor da causa, território (regra geral)</li>\n</ul>\n<p><strong>Perpetuação da competência (art. 43 CPC):</strong> fixada no momento do registro/distribuição da petição inicial; exceções: supressão do órgão e alteração de competência absoluta</p>\n<p><strong>Regras de foro importantes:</strong></p>\n<ul>\n<li>Direito pessoal ou real sobre móveis: foro do domicílio do REU (art. 46)</li>\n<li>Direito real sobre IMÓVEIS: foro de situação da coisa (art. 47); competência ABSOLUTA para possessória imobiliária (art. 47, §2º)</li>\n<li>Herança: foro do domicílio do autor da herança (art. 48)</li>\n<li>Justiça Federal: quando intervém União, autarquias, fundações, EP federais, conselhos profissionais (art. 45) — exceção: falência, recuperação, acidente de trabalho, eleitoral, trabalhista</li>\n</ul>\n<p><strong>Juizados Especiais Estaduais:</strong> até 40 salários mínimos (competência relativa, opção do demandante)\n<strong>Juizados Especiais Federais:</strong> competência ABSOLUTA (art. 3º, §3º, Lei 10.259/01)</p>"}], "top5": ["distinção mediação×conciliação", "competência legislativa (art. 22 vs art. 24 CF)", "princípio do isolamento dos atos processuais", "devido processo legal como super princípio", "competência absoluta vs relativa"], "questoes": [{"id": "M1-Q1", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q1", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Negociação: as próprias partes, sem terceiro (autocomposição direta). Arbitragem só para direitos patrimoniais disponíveis; conciliação e mediação são distintas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q2", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q2", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Cláusula compromissória: convenção prévia e abstrata para submeter controvérsias futuras à arbitragem (art. 4º Lei 9.307/96). Não confundir com compromisso arbitral (litígio já existente).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q3", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q3", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Conciliação = aspecto objetivo do conflito; mediação = restabelecimento da comunicação e compreensão mútua.", "repete": true, "repeteRef": "conceito mediação×conciliação", "coment": []}, {"id": "M1-Q4", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q4", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Autotutela NÃO é mecanismo legalmente reconhecido (art. 345 CP). As demais (jurisdição, mediação, arbitragem, conciliação) são métodos legítimos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q5", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Desequilíbrio de poder em mediação pode resultar em violação de direitos da parte mais fraca. Mediador não sugere nem impõe soluções.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q6", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q6", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Os MASCs NÃO têm por finalidade \"garantir legitimidade dos ritos judiciais\". Objetivos reais: desafogar Judiciário, pacificação social, democratizar acesso, autocomposição.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q7", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q7", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "MASCs visam acesso à justiça de forma ágil e econômica por meio de acordo amigável.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q8", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q8", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Mediação exige equilíbrio de poder entre as partes (não desequilíbrio).", "repete": true, "repeteRef": "Q5", "coment": []}, {"id": "M1-Q9", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Mediação apoia-se nos paradigmas das ciências contemporâneas, aceita complexidade dos fenômenos interpessoais, sem verdades absolutas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q10", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q10", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "A característica essencial da mediação é a COMUNICAÇÃO (art. 165, §3º CPC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q11", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q11", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Arbitragem: heterocomposição privada com sentença vinculante, só direitos patrimoniais disponíveis.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q12", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q12", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Mediação: terceiro sem poder de decisão coercitivo que facilita o diálogo voluntário.", "repete": true, "repeteRef": "distinção mediação×arbitragem", "coment": []}, {"id": "M1-Q13", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q13", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Apenas II está correta. Desistência = renúncia à pretensão; submissão = renúncia à resistência; transação = concessões recíprocas. (Pegadinha clássica: I inverte submissão com transação)", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q14", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q14", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I e II corretas. Autotutela é crime (art. 345 CP). Legítima defesa da posse é autotutela legal (art. 1.210, §1º CC). Autotutela não é único meio.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q15", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q15", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "I e III corretas. Arbitragem tem previsão legal expressa (Lei 9.307/96), então II é falsa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q16", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q16", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Todas corretas. Negociação = comunicação persuasiva; conciliação = terceiro neutro, casos não complexos; mediação = terceiro neutro via comunicação.", "repete": true, "repeteRef": "distinções", "coment": []}, {"id": "M1-Q17", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q17", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Todas corretas. Submissão, desistência e transação são as três formas de autocomposição.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q18", "bloco": "MÓDULO 1 — Meios de Solução de Conflitos", "num": "Q18", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Todas erradas. Na heterocomposição HÁ terceiro; não é autotutela; arbitragem é privada, não é jurisdição estatal.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q1", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q1", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Art. 22, I, CF: competência privativa da União inclui direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q2", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q2", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "MP vedada para: direito penal + processual penal + processual civil (art. 62, §1º, I, \"b\", CF).", "repete": true, "repeteRef": "tema MP", "coment": []}, {"id": "M2-Q3", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "MP PODE tratar de direito econômico (se não reservado a lei complementar). Não pode: penal, processual penal, processual civil, eleitoral, direitos políticos.", "repete": true, "repeteRef": "", "coment": []}, {"id": "M2-Q4", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Fontes formais do direito processual: leis federais + CF. Lei municipal não é fonte (competência privativa da União — art. 22, I).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q5", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Direito processual civil pressupõe conflito intersubjetivo (ao menos 2 pessoas).", "repete": true, "repeteRef": "conceito de lide", "coment": []}, {"id": "M2-Q6", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q6", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Todas corretas: CPC sintonia com CF (art. 1º); direito processual autônomo; relaciona-se com outros ramos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q7", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q7", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Direito processual é autônomo E instrumental ao direito material (não dependente, mas serve a ele).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q8", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q8", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Todas erradas. I: \"autoridade competente\" (não policial). II: ninguém será privado SEM devido processo legal. III: garantido em processo judicial OU administrativo. [Pegadinha: todos os itens têm distorção sutil do art. 5º CF]", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q9", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Direito Material e Processual são autônomos; mas sem processo efetivo, o direito material vira ilusão. (não há dependência hierárquica, mas há instrumentalidade)", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q10", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q10", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Procedimentos em matéria processual = competência CONCORRENTE (art. 24, XI). A lei federal autorizativa seria incompatível pois os Estados já têm esse poder direto da CF.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q11", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q11", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Normas processuais (adjetivas): sistema de princípios e regras que regulam o processo, disciplinando atividade dos sujeitos processuais.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q12", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q12", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Direito processual é SEMPRE de direito público, pois envolve a jurisdição (poder soberano do Estado), mesmo que a lide seja privada.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q13", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q13", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "ERRADA: \"o processo civil não tem qualquer diálogo com o Direito Penal\". É falsa — dialoga (falso testemunho, coação processual etc.).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q14", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q14", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Todas erradas: cada opção traz equívoco conceitual sobre história e conceituação do direito processual.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q15", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q15", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Todas as normas citadas (arts. 1º, 4º, 7º, 9º CPC) retratam a relação direito processual × constitucional.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q16", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q16", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "No contexto específico de combater autotutela (não fazer justiça com as próprias mãos), escopo = preservação da liberdade. [Atenção: escopo \"principal\" em sentido amplo é pacificação, mas a questão contextualiza para preservação da liberdade]", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q17", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q17", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Escopos do processo: pacificação, educacional, preservação da liberdade, respeito ao ordenamento, atuação da vontade concreta do direito.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q18", "bloco": "MÓDULO 2 — Direito Processual", "num": "Q18", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Ramo que mais influencia o direito processual civil: Direito Constitucional (art. 1º CPC; norma fundamental).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q1", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q1", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "CPC adota teoria do <b>isolamento dos atos processuais</b> (art. 14): lei nova aplica imediatamente, respeitados atos já praticados. [Pegadinha: há três teorias — unidade processual, fases processuais e isolamento dos atos]", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q2", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q2", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "I e III corretas. II é falsa: buscar significado no conjunto do sistema = interpretação sistemática (não exegética/gramatical).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q3", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q3", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "INCORRETO: lei retroativa pode atingir efeitos pendentes/futuros de atos passados, desde que não viole direito adquirido, ato jurídico perfeito e coisa julgada.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q4", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Lei nova sobre o mesmo assunto pode coexistir com anterior sem revogar tacitamente (art. 2º, §2º LINDB).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q5", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q5", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "\"<i>Ubi eadem ratio, ibi eadem dispositio</i>\" = onde há mesma razão, aplica-se mesmo preceito = ANALOGIA.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q6", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q6", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Vacatio legis: 45 dias após PUBLICAÇÃO (não promulgação). Sem efeitos durante a vacatio.", "repete": true, "repeteRef": "art. 1º LINDB", "coment": []}, {"id": "M3-Q7", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q7", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Interpretação sistemática + teleológica = método moderno preferido (art. 5º LINDB + art. 8º CPC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q8", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q8", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Análise do significado técnico-jurídico dos vocábulos = interpretação LITERAL/gramatical.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q9", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Princípio \"nemo plus iuris\" = exemplo clássico de princípio geral de direito usado para integrar lacunas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q10", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q10", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Art. 4º LINDB: lei omissa → analogia, costumes, princípios gerais de direito. Equidade não integra esse rol literal.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q11", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q11", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Fonte primeira do Direito Processual Civil = Constituição Federal (art. 1º CPC).", "repete": true, "repeteRef": "Módulo 2", "coment": []}, {"id": "M3-Q12", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q12", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "\"Relatividade\" NÃO é característica da lei. As características são: generalidade, imperatividade, autorizamento, permanência, emanada por autoridade competente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q13", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q13", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Fonte primária = a Lei. Costume, analogia, doutrina, jurisprudência = fontes secundárias/meios de integração.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q14", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q14", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Analogia LEGIS: aplicação de norma específica de lei similar ao caso omisso. (vs. analogia JURIS = todo o sistema jurídico)", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q15", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q15", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Costume: subjetivo = crença de obrigatoriedade (<i>opinio iuris</i>); objetivo = constância do ato (<i>diuturnitas</i>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q16", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q16", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "ERRADA: interpretação jurisprudencial (juízes/tribunais) ≠ interpretação autêntica (legisladores). São feitas por pessoas DIFERENTES.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q17", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q17", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Princípio da territorialidade (art. 13 CPC): jurisdição civil regida pelas normas processuais brasileiras, salvo tratados e convenções.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q18", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia", "num": "Q18", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Limite constitucional à lei processual imediata: TRÍPLICE garantia = direito adquirido + ato jurídico perfeito + coisa julgada (art. 5º, XXXVI, CF). [Pegadinha: opção A falta \"coisa julgada\"; D falta \"direito adquirido\"]", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [{"titulo": "Módulo 4 — Princípios constitucionais", "html": "devido processo legal = super princípio (gênero). Contraditório inclui vedação de decisão surpresa (art. 10 CPC). Juiz natural proíbe tribunal de exceção (art. 5º, XXXVII CF). Inafastabilidade da jurisdição tem exceções (ex: exaurimento da instância desportiva, art. 217, §1º CF)."}, {"titulo": "Módulo 5 — Princípios do procedimento", "html": "oralidade não obriga atos orais; eventualidade/preclusão impede alegar depois o que devia ter alegado antes (art. 507-508 CPC); economia processual ≠ celeridade (é equilíbrio entre velocidade e eficiência)."}, {"titulo": "Módulo 6 — Jurisdição", "html": "característica substitutiva = imparcialidade. Arbitragem não é delegação de jurisdição. Jurisdição voluntária = administração de interesses privados, sem lide. Jurisdição é UNA, mas distribuída por critérios."}, {"titulo": "Módulo 7 — Ação", "html": "CPC/15 abandona teoria eclética; adota teoria da asserção. Legitimidade e interesse = pressupostos processuais. Possibilidade jurídica = questão de mérito. Ação é bilateralidade: tanto autor quanto réu exercem o direito de ação."}, {"titulo": "Módulo 8 — Competência", "html": "absoluta × relativa (pegadinha recorrente). Perpetuação da competência: art. 43 CPC. Ação real sobre imóveis = foro da situação da coisa (competência ABSOLUTA para possessória imobiliária). Juizados Especiais Estaduais = relativa; Federais = absoluta."}], "cards": [{"id": "c1", "f": "Quais são as três formas de autocomposição?", "v": "Desistência (renúncia à pretensão) | Submissão (renúncia à resistência) | Transação (concessões recíprocas)"}, {"id": "c2", "f": "Qual a diferença entre conciliação e mediação?", "v": "Conciliação → sem vínculo anterior, conciliador PODE sugerir; Mediação → com vínculo anterior, mediador NÃO sugere, apenas facilita o diálogo"}, {"id": "c3", "f": "Para quais direitos é cabível a arbitragem?", "v": "Apenas direitos patrimoniais DISPONÍVEIS (Lei 9.307/96, art. 1º)"}, {"id": "c4", "f": "Cláusula compromissória × compromisso arbitral: qual a diferença?", "v": "Cláusula compromissória = convenção prévia para litígios FUTUROS (art. 4º Lei 9.307/96) | Compromisso arbitral = submete litígio JÁ EXISTENTE (art. 9º)"}, {"id": "c5", "f": "A autotutela é legalmente reconhecida?", "v": "NÃO — é crime (art. 345 CP). Exceções legais: legítima defesa da posse (art. 1.210, §1º CC) e legítima defesa/estado de necessidade (art. 23 CP)"}, {"id": "c6", "f": "Competência para legislar sobre direito processual: privativa ou concorrente?", "v": "PRIVATIVA da União (art. 22, I, CF) para direito processual; CONCORRENTE para procedimentos em matéria processual (art. 24, XI, CF)"}, {"id": "c7", "f": "Medidas provisórias podem versar sobre direito processual civil?", "v": "NÃO — vedação expressa (art. 62, §1º, I, \"b\", CF). Também vedado: penal e processual penal"}, {"id": "c8", "f": "Qual teoria de eficácia temporal a lei processual adota (art. 14 CPC)?", "v": "Teoria do isolamento dos atos processuais — lei nova aplica imediatamente, respeitados os atos já praticados"}, {"id": "c9", "f": "Quais são os limites constitucionais à retroatividade da lei processual?", "v": "Tríplice garantia (art. 5º, XXXVI, CF): direito adquirido + ato jurídico perfeito + coisa julgada"}, {"id": "c10", "f": "Vacatio legis — prazo padrão e marco inicial?", "v": "45 dias contados da PUBLICAÇÃO (não da promulgação) — art. 1º LINDB; 3 meses no exterior"}, {"id": "c11", "f": "Ordem de integração de lacunas (art. 4º LINDB)?", "v": "Analogia → Costumes → Princípios gerais de direito (equidade NÃO está no rol literal)"}, {"id": "c12", "f": "Qual é o \"super princípio\" do processo civil?", "v": "Devido processo legal (art. 5º, LIV, CF) — gênero do qual contraditório, ampla defesa, juiz natural etc. são espécies"}, {"id": "c13", "f": "O que proíbe o princípio do juiz natural?", "v": "Tribunal de exceção (art. 5º, XXXVII, CF); garante juiz pré-constituído e imparcial (art. 5º, LIII, CF)"}, {"id": "c14", "f": "Qual característica da jurisdição justifica a imparcialidade do juiz?", "v": "Característica SUBSTITUTIVA — o Estado substitui as partes na resolução do conflito"}, {"id": "c15", "f": "O que é jurisdição voluntária?", "v": "Administração de interesses privados sem lide; não há partes, mas interessados; ex.: inventário consensual, interdição"}, {"id": "c16", "f": "Qual teoria da ação o CPC/2015 adota?", "v": "Teoria da ASSERÇÃO — condições da ação são analisadas com base nas afirmações da petição inicial; legitimidade e interesse = pressupostos processuais; possibilidade jurídica = mérito"}, {"id": "c17", "f": "Competência absoluta × relativa: principal diferença prática?", "v": "Absoluta = interesse público, pode ser arguida a qualquer tempo e de ofício, NÃO prorroga | Relativa = interesse privado, deve ser arguida na contestação, PRORROGA se não arguida; admite foro de eleição"}, {"id": "c
