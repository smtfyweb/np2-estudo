ntra propriedade industrial: art. 195 LPI — concorrência desleal. Inclui divulgar segredo industrial, imitar produto, usar marca alheia.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q8", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q8", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Marca coletiva: identifica produtos/serviços de membros de uma entidade. Marca de certificação: atesta conformidade com normas/especificações.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q9", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Colidência de marcas: para impedir registro = imitação/reprodução + mesma classe de produtos/serviços + risco de confusão ao consumidor (STJ: 3 requisitos).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q10", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q10", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Licença compulsória de patente: Estado pode conceder em caso de abuso de poder econômico, emergência nacional ou interesse público (art. 68 LPI).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q11", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q11", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Ação de nulidade de patente: proposta pelo INPI ou terceiro com interesse legítimo na <b>Justiça Federal</b>, durante toda a vigência da patente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q12", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q12", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Topografia de circuito integrado: proteção específica (art. 25 LPI); prazo 10 anos do registro ou 15 anos da criação. [Tema menos cobrado]", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q13", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q13", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Nome civil e marca: nome de terceiro só pode ser registrado como marca com consentimento do titular ou herdeiros.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q14", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q14", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Extinção da patente: vencimento do prazo, renúncia, caducidade (não exploração), falta de pagamento de anuidade ou nulidade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q15", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q15", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Uso da marca: obrigatório; caducidade da marca por falta de uso por 5 anos consecutivos após a concessão (art. 143 LPI).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q16", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q16", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Marca de alto renome: proteção em todos os ramos de atividade (não apenas na classe registrada) — reconhecida pelo INPI.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q17", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q17", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Segredo industrial: não tem prazo de proteção; protegido enquanto mantido em sigilo; não há registro público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q18", "bloco": "MÓDULO 4 — Propriedade Industrial (Lei 9.279/96)", "num": "Q18", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Proteção provisória: desde o depósito do pedido até a concessão — o titular pode cobrar indenização retroativa por uso indevido.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q1", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q1", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedade em comum (sem registro): <b>todos</b> respondem solidária e ilimitadamente; quem contratou perde o benefício de ordem (art. 990 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q2", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q2", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Cônjuges impedidos de constituir sociedade entre si: casados sob <b>comunhão universal</b> ou <b>separação obrigatória</b> (art. 977 CC).", "repete": true, "repeteRef": "nos flashcards", "coment": []}, {"id": "M5-Q3", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q3", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Personalidade jurídica: início com o <b>registro</b> (art. 985 CC). Sem registro = sociedade em comum (não personificada).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q4", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q4", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Sociedade em comum: bens sociais respondem por atos de qualquer sócio, salvo pacto limitativo conhecido pelo terceiro (art. 989 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q5", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q5", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Liquidante: deveres incluem ultimar negócios, realizar ativo, pagar passivo e partilhar o remanescente (art. 1.103 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q6", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q6", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Desconsideração da personalidade jurídica inversa: responsabiliza a <b>sociedade</b> por dívidas pessoais dos sócios (art. 50 §§ 2º e 3º CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q7", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q7", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Morte do sócio em sociedade simples: <b>resolução</b> em relação ao sócio (não dissolução total); liquidação da quota pelo balanço especial (art. 1.028 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q8", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q8", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedades não personificadas: em comum + em conta de participação. NÃO são: simples, cooperativa, em comandita.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q9", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Resolução da sociedade em relação ao sócio: morte (art. 1.028) + exclusão judicial por falta grave (art. 1.030) → não são causas de dissolução total.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q10", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q10", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Exclusão extrajudicial de sócio: votos de sócios com + de metade do capital social (excluindo o sócio excluído do cômputo).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q11", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q11", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Affectio societatis: elemento essencial do contrato social = intenção/vontade de cooperar para fins comuns.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q12", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q12", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Registro constitui a personalidade jurídica; sem ele, a sociedade é em comum, todos respondem solidária e ilimitadamente.", "repete": true, "repeteRef": "Q3", "coment": []}, {"id": "M5-Q13", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q13", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedade em conta de participação: sócio ostensivo assume obrigações; sócio participante (oculto) responde apenas entre si. Sem personalidade jurídica.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q14", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q14", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Contrato social plurilateral: todos os sócios participam; cada um tem obrigações com os demais e com a sociedade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q15", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q15", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Dissolução total vs. resolução parcial: dissolução = extinção da sociedade; resolução = saída de um sócio (sociedade continua).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q16", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q16", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Administração societária: o administrador obriga a sociedade nos limites dos poderes outorgados; excesso → responsabilidade pessoal.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q17", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q17", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedade simples: registro no RCPJ (Registro Civil de Pessoas Jurídicas); sociedade empresária: Junta Comercial.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q18", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Q18", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Incidente de desconsideração da personalidade jurídica (art. 133 CPC): instaurado pelo juiz ou a requerimento da parte; suspende o processo principal.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q1", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q1", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Sociedade em comum: sem registro; todos respondem solidária e ilimitadamente (art. 990 CC); prova da existência entre sócios = qualquer meio; para terceiros = qualquer meio também (art. 987).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q2", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q2", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Sociedade em conta de participação: sócio ostensivo responde com terceiros (obrigações em seu nome); sócio participante responde apenas entre si.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q3", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q3", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Sociedade simples: patrimônio social responde primeiro (art. 1.024); sócios respondem subsidiariamente se contrato não limitar.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q4", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q4", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Contrato social: elementos obrigatórios — nome e qualificação dos sócios, denominação, objeto, sede, capital social, prazo (art. 997 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q5", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Sociedade em nome coletivo: <b>todos</b> os sócios respondem ilimitada e solidariamente; apenas pessoas físicas como sócios.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q6", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q6", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Em comandita simples: comanditado (ilimitada) + comanditário (limitada à quota). Comanditário não pode praticar atos de gestão.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q7", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q7", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedade limitada: capital dividido em quotas; responsabilidade dos sócios limitada ao valor das quotas subscritas + solidária pela integralização.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q8", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q8", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Sociedade anônima: capital dividido em ações; responsabilidade limitada ao preço de emissão; sempre empresarial (art. 1.089 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q9", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Em comandita por ações: diretores respondem ilimitada e subsidiariamente; demais acionistas = limitada. Regida pela LSA (Lei 6.404/76).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q10", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q10", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Classificação das sociedades: por pessoas (relevância do sócio) vs. por capital (relevância do capital — como a S/A).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q11", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q11", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedade cooperativa: não é sociedade empresária nem simples stricto sensu — tem legislação própria; sobras ≠ lucro.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q12", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q12", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Sociedade anônima aberta: ações negociadas em bolsa/mercado; sujeita à CVM; obrigações de transparência mais rígidas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q13", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q13", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Sociedade por cotas de responsabilidade limitada: nome atual é \"sociedade limitada\" (CC/2002); cotas = quotas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q14", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q14", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Tipos societários pessoais: sociedade em comum, simples, em nome coletivo, em comandita simples. Sócio mais importante que o capital.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q15", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q15", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Sociedade simples: registro no RCPJ; pode adotar estrutura de qualquer tipo societário exceto anônima (art. 983 § único CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q16", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q16", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Dissolução total da sociedade: causas — término do prazo; consenso dos sócios; falta de pluralidade &gt;180 dias; extinção da autorização; anulação da constituição; falência; decisão judicial.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q17", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q17", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Sociedade de propósito específico (SPE): criada para projeto específico; extingue-se com a conclusão do objeto.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q18", "bloco": "MÓDULO 6 — Sociedades Empresárias — Espécies", "num": "Q18", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Empresa Individual de Responsabilidade Limitada (EIRELI): foi absorvida pela SLU (Sociedade Limitada Unipessoal) no CC/2002 com a Lei 14.195/21.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q1", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q1", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Quotas na Ltda: indivisíveis em relação à sociedade; sócios respondem solidariamente pela integralização (art. 1.052 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q2", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q2", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Cessão de quotas: requer aprovação de sócios com ≥ 3/4 do capital social, se contrato não dispuser diferente (art. 1.057 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q3", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q3", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Integralização de quotas: em dinheiro ou bens; <b>vedado</b> integralizar com prestação de serviços (art. 1.055 §2º CC). Diferente das cooperativas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q4", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Usufruto de quota: possível; nu-proprietário conserva direito à quota; usufrutuário tem direitos patrimoniais. Votação = definida em contrato.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q5", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q5", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Aumento de capital: deliberação de sócios que representem ≥ 3/4 do capital (quórum qualificado); sócios têm preferência na subscrição.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q6", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q6", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Administração da Ltda: pode ser exercida por sócio ou não sócio (pessoa física capaz); designado no contrato ou em ato separado.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q7", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q7", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Redução de capital: somente se não houver oposição de credores quirografários (prazo 90 dias para oposição — art. 1.084 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q8", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q8", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Responsabilidade do administrador Ltda: pelos atos praticados com culpa ou dolo no exercício das funções (art. 1.016 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q9", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q9", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Reunião de sócios: obrigatória quando mais de 10 sócios; anual para aprovar balanço e distribuir resultados (art. 1.072 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q10", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q10", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Exclusão extrajudicial de sócio: falta grave; votos de sócios representando + 50% do capital (excluindo o sócio acusado).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q11", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q11", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Dissolução da Ltda: parcial (exclusão/morte/retirada de sócio) ou total (art. 1.033 CC — decurso do prazo, falência, decisão judicial etc.).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q12", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q12", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Penhor de quota: possível; credor pignoratício não tem direito a voto, mas tem direito ao resultado.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q13", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q13", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "Sociedade de grande porte: obrigada a adotar contabilidade e auditoria como S/A (Lei 11.638/07 art. 3º) mesmo sendo Ltda.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q14", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q14", "tema": "", "enun": "", "gab": "E", "gabLabel": "", "html": "LSA aplicada subsidiariamente à Ltda quando o contrato social optar expressamente (art. 1.053 § único CC).", "repete": true, "repeteRef": "Q13", "coment": []}, {"id": "M7-Q15", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q15", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Penhora de quota: credor pode penhorar quota do sócio devedor; mas para liquidar, precisa aguardar a dissolução ou exercício de preferência pelos sócios.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q16", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q16", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Deliberações Ltda — quórum qualificado (3/4 capital): mudança de objeto, fusão, incorporação, cisão, transformação, dissolução.", "repete": true, "repeteRef": "nos flashcards", "coment": []}, {"id": "M7-Q17", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q17", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Administrador não sócio: possível; nomeado no contrato ou em ato separado; responsabilidade pelos atos de gestão.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q18", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Q18", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Condomínio de quota: quando quota pertence a mais de uma pessoa; direitos exercidos por representante comum (art. 1.056 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q1", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q1", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "S/A: capital dividido em ações; responsabilidade = limitada ao preço de emissão; sempre empresarial (arts. 1.088 e 1.089 CC).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q2", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q2", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Sistema legal da S/A: Lei 6.404/76 (LSA); Código Comercial regulou de 295 a 299; hoje = LSA + CC subsidiariamente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q3", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q3", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Histórico: origem nas associações navais medievais (colonna) e nas companhias holandesas do séc. XVII.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q4", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q4", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Características da S/A: capital em ações, responsabilidade limitada, livre negociabilidade de ações, denominação (não firma), sempre empresarial.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q5", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q5", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Objeto social: qualquer lícito e lucrativo; sempre empresarial independentemente do objeto — diferença da Ltda (pode ser simples se objeto intelectual).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q6", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q6", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Denominação: \"Sociedade Anônima\" ou \"S/A\" ou \"Companhia\"/\"Cia.\" — NÃO usa firma (nome de sócios). Cia. não pode ser usada no final da denominação.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q7", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q7", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Companhia aberta vs. fechada: aberta = ações negociadas em bolsa/mercado de balcão, sujeita à CVM; fechada = restrita a grupo de acionistas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q8", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q8", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Capital da S/A: sempre em moeda nacional; formado por qualquer espécie de bens avaliáveis em dinheiro; avaliação por 3 peritos ou empresa especializada.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q9", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q9", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Ações: ordinárias (voto), preferenciais (privilégios, podem não ter voto), de gozo/fruição (amortizadas com manutenção de direitos residuais).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q10", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q10", "tema": "", "enun": "", "gab": "B", "gabLabel": "", "html": "Forma das ações: sempre <b>nominativas</b> (desde Lei 8.021/90); ações ao portador e endossáveis foram extintas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q11", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q11", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Certificados de ações: emitidos só após cumpridas as formalidades legais; ações escriturais: mantidas em conta de depósito sem emissão de certificado.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q12", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q12", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Integralização das ações: pode ser parcelada conforme estatuto; acionista devedor de prestações sujeito a cobrança e juros moratórios.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q13", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q13", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Indivisibilidade: ação é indivisível em relação à companhia; condomínio de ação = representante comum exerce os direitos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q14", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q14", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Negociação de ações próprias: em regra, proibida; exceções: resgate/reembolso, compra com lucros/reservas (sem diminuir capital), doação.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q15", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q15", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Companhia não pode ter como único acionista pessoa jurídica nacional (exceto subsidiária integral — art. 251 LSA).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q16", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q16", "tema": "", "enun": "", "gab": "A", "gabLabel": "", "html": "Amortização: antecipação de valor que o acionista receberia na liquidação; total ou parcial; por sorteio se não abranger todas as ações.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q17", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q17", "tema": "", "enun": "", "gab": "D", "gabLabel": "", "html": "Reembolso: direito do acionista dissidente de receber o valor de suas ações quando deliberação modificar direitos essenciais.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q18", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Q18", "tema": "", "enun": "", "gab": "C", "gabLabel": "", "html": "Assembleia Geral: órgão soberano da S/A; AGO anual (4 meses após fim do exercício); AGE — quando necessário.", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "O que é empresário segundo o CC/2002?", "v": "Quem exerce profissionalmente atividade econômica organizada para produção ou circulação de bens ou serviços (art. 966 CC). Requisitos: profissionalismo, organização, atividade econômica.\n\n---"}, {"id": "c2", "f": "Qual o limite de faturamento do MEI, ME e EPP?", "v": "MEI: até R$ 81 mil/ano | ME: até R$ 360 mil/ano | EPP: R$ 360.001 a R$ 4.800.000/ano (LC 123/06).\n\n---"}, {"id": "c3", "f": "Qual o prazo da patente de invenção e do modelo de utilidade?", "v": "Patente de invenção: 20 anos do depósito. Modelo de utilidade: 15 anos do depósito (LPI 9.279/96).\n\n---"}, {"id": "c4", "f": "Por quanto tempo uma marca registrada no INPI é protegida?", "v": "10 anos da concessão, renováveis indefinidamente por períodos iguais de 10 anos.\n\n---"}, {"id": "c5", "f": "Qual o prazo do desenho industrial?", "v": "10 anos do depósito, prorrogável por 3 períodos de 5 anos → máximo 25 anos.\n\n---"}, {"id": "c6", "f": "O que diferencia sociedade empresária de sociedade simples?", "v": "Empresária: objeto = atividade de empresário (produção/circulação organizada), registro na Junta Comercial. Simples: atividade intelectual (científica, literária, artística), registro no RCPJ.\n\n---"}, {"id": "c7", "f": "Qual a diferença entre dissolução total e resolução parcial da sociedade?", "v": "Dissolução: extinção da sociedade. Resolução parcial: saída de um sócio (morte, exclusão, retirada) — a sociedade continua existindo.\n\n---"}, {"id": "c8", "f": "Quais cônjuges não podem ser sócios entre si?", "v": "Casados em comunhão universal de bens ou separação obrigatória de bens (art. 977 CC).\n\n---"}, {"id": "c9", "f": "Quando nasce a personalidade jurídica de uma sociedade?", "v": "Com o registro (art. 985 CC). Sem registro = sociedade em comum (não personificada), todos respondem solidária e ilimitadamente.\n\n---"}, {"id": "c10", "f": "O que é o trespasse e qual a restrição ao alienante?", "v": "Trespasse = alienação do estabelecimento empresarial. O alienante fica proibido de se restabelecer como concorrente por 5 anos (art. 1.147 CC), salvo autorização expressa.\n\n---"}, {"id": "c11", "f": "Quais os requisitos da ação renovatória de locação?", "v": "(1) Contrato escrito; (2) prazo mínimo de 5 anos (pode ser soma de contratos); (3) exploração do mesmo ramo por no mínimo 3 anos; (4) proposta formulada 1 ano antes e no máximo 6 meses antes do fim do contrato.\n\n---"}, {"id": "c12", "f": "Qual é a responsabilidade dos sócios na Sociedade Limitada?", "v": "Limitada ao valor das quotas subscritas, porém todos respondem solidariamente pela integralização total do capital (art. 1.052 CC).\n\n---"}, {"id": "c13", "f": "Que quórum é necessário para cessão de quotas na Ltda?", "v": "Aprovação de sócios representando pelo menos 3/4 do capital social, salvo disposição contrária no contrato.\n\n---"}, {"id": "c14", "f": "O que é a Sociedade Anônima e qual sua responsabilidade?", "v": "Capital dividido em ações; responsabilidade dos acionistas limitada ao preço de emissão das ações subscritas. Sempre empresarial (art. 1.089 CC).\n\n---"}, {"id": "c15", "f": "Qual a diferença entre S/A aberta e fechada?", "v": "Aberta: ações negociadas em bolsa ou mercado de balcão, sujeita à CVM. Fechada: ações restritas a grupo de acionistas, sem negociação pública.\n\n---"}, {"id": "c16", "f": "Que tipo de nome usa a S/A — firma ou denominação?", "v": "Denominação (inclui objeto + \"S/A\", \"Companhia\" ou \"Cia.\" — mas \"Cia.\" não pode ser usado ao final). Não usa firma (nome de sócios).\n\n---"}, {"id": "c17", "f": "Quais os tipos de ações de uma S/A?", "v": "Ordinárias (direito a voto), Preferenciais (privilégios econômicos, podem não ter voto) e De Gozo/Fruição (entregues a acionistas que tiveram suas ações amortizadas).\n\n---"}, {"id": "c18", "f": "Como uma marca pode ser cancelada por falta de uso?", "v": "Caducidade: se o titular não usar a marca por 5 anos consecutivos após a concessão, pode ser declarada caduca pelo INPI a pedido de terceiro com interesse legítimo (art. 143 LPI).\n\n---"}, {"id": "c19", "f": "O que é a desconsideração da personalidade jurídica inversa?", "v": "Responsabiliza a sociedade pelas dívidas pessoais de seus sócios (art. 50 §§ 2º e 3º CC), quando o sócio usa a pessoa jurídica para blindar patrimônio pessoal.\n\n---"}, {"id": "c20", "f": "Quais deliberações na Ltda exigem quórum de 3/4 do capital?", "v": "Mudança de objeto social, fusão, incorporação, cisão, transformação, dissolução e qualquer modificação do contrato que o exija. Cessar de quotas também requer 3/4 salvo disposição contrária."}], "cobertura": ["O próprio arquivo avisa: onde o texto completo da questão não foi extraído, o comentário se baseia no gabarito e no conteúdo do módulo. Parte dos comentários, portanto, é dedução e não texto do AVA.", "Os arquivos trazem gabarito e comentário. Enunciados e alternativas completas não vieram.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "revisao", "ref": "r7", "titulo": "Contradiz os flashcards", "texto": "O resumo diz que mudança de objeto, fusão e dissolução na Ltda exigem unanimidade. O flashcard 20 e a Q16 do Módulo 7 dizem 3/4 do capital, que é o que consta nos arts. 1.071 e 1.076 do CC. Confira no AVA."}, {"esc": "card", "ref": "c13", "titulo": "Cessão de quotas: regra mais precisa", "texto": "O art. 1.057 do CC permite a cessão a outro sócio sem consulta, e a estranho se não houver oposição de titulares de mais de 1/4 do capital. “Aprovação de 3/4” é uma simplificação. Veja como o AVA formula."}, {"esc": "questao", "ref": "M7-Q2", "titulo": "Cessão de quotas: regra mais precisa", "texto": "Mesma observação do flashcard 13 (art. 1.057 do CC)."}, {"esc": "card", "ref": "c20", "titulo": "Erro de digitação e mesma observação", "texto": "“Cessar de quotas” deve ser cessão de quotas. Para o quórum, veja a observação do flashcard 13."}, {"esc": "card", "ref": "c2", "titulo": "Limite do MEI", "texto": "O teto de R$ 81 mil segue vigente em 2026. Há notícia de lei sancionada que o eleva a R$ 110 mil em 2027 e R$ 140 mil em 2028. Para a prova de 2026, vale o R$ 81 mil."}, {"esc": "questao", "ref": "M2-Q3", "titulo": "EIRELI foi extinta", "texto": "A Lei 14.195/21 extinguiu a EIRELI e a transformou em sociedade limitada unipessoal (como diz a Q18 do Módulo 6). Questão histórica do AVA. Siga o gabarito."}, {"esc": "questao", "ref": "M2-Q4", "titulo": "EIRELI foi extinta", "texto": "As regras de nome e capital citadas valiam para a EIRELI, extinta pela Lei 14.195/21. Siga o gabarito do AVA."}, {"esc": "questao", "ref": "M4-Q12", "titulo": "Lei citada provavelmente errada", "texto": "A topografia de circuito integrado tem lei própria (Lei 11.484/2007), não o art. 25 da LPI. Tema de baixa prioridade."}, {"esc": "questao", "ref": "M8-Q15", "titulo": "Frase confusa", "texto": "A regra é: a companhia precisa de pelo menos dois acionistas, salvo a subsidiária integral, cujo único acionista é sociedade brasileira (art. 251 da LSA). O comentário está mal redigido."}]};</script><script>/* Estudo UNIP: portal de revisão. Dados em window.DADOS[COD] (gerados por build.py). */

];

const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } }
};
const prog = cod => Object.assign({rev:[], q:[], cards:{}}, store.get("p:" + cod, {}));
const saveProg = (cod, p) => store.set("p:" + cod, p);

const $ = s => document.querySelector(s);
const D = cod => (window.DADOS || {})[cod];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const plain = h => h.replace(/<[^>]+>/g, " ");
const dias = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const ts = p => new Date(p.dia + "T" + p.hora + ":00-03:00");
const fmtDia = iso => { const d = new Date(iso + "T12:00:00-03:00"), n = dias[d.getDay()];
  return `${n[0].toUpperCase() + n.slice(1)}${d.getDay() % 6 === 0 ? "" : "-feira"}, ${d.getDate()} de ${meses[d.getMonth()]}`; };

function pct(cod){
  const d = D(cod); if(!d) return 0;
  const p = prog(cod), total = d.revisao.length + d.questoes.length + d.cards.length;
  const feito = p.rev.length + p.q.length + Object.values(p.cards).filter(v => v === 1).length;
  return total ? Math.round(feito / total * 100) : 0;
}
const blocoLongo = b => b.replace(/^MÓDULO/, "Módulo").replace(/^UNIDADE (I+) — QUESTIONÁRIO/, "Unidade $1, questionário").replace(/^UNIDADE (I+) — ATIVIDADE TELEAULA/, "Unidade $1, teleaula");
const blocoCurto = b => { const m = b.match(/^MÓDULO (\d+)/); return m ? "Módulo " + m[1] : blocoLongo(b); };
const notasDe = (d, esc_, ref) => d.notas.filter(n => n.esc === esc_ && n.ref === ref);
const conferirHtml = ns => ns.map(n => `<div class="conferir"><b>Conferir: ${esc(n.titulo)}</b>${esc(n.texto)}</div>`).join("");

let S = {cod:null, tab:"revisao", filtro:"todos", bloco:"todos", soRepete:false, busca:"", open:new Set(), fila:null, flip:false};

/* ───────── home ───────── */
function countdown(){
  const agora = new Date();
  const prox = PROVAS.map(p => ({p, t:ts(p)})).filter(x => x.t > agora).sort((a, b) => a.t - b.t)[0];
  if(!prox) return `<div class="next"><span><b>Todas as provas foram realizadas.</b> Bom trabalho.</span></div>`;
  const ms = prox.t - agora, h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  const txt = h >= 48 ? `${Math.floor(h / 24)} dias` : `${h} h ${String(m).padStart(2, "0")} min`;
  return `<div class="next"><span>Próxima prova: <b>${esc(prox.p.nome)}</b>, às ${prox.p.hora}</span><span class="cd">em ${txt}</span></div>`;
}
function home(){
  const grupos = {};
  PROVAS.forEach(p => (grupos[p.dia] = grupos[p.dia] || []).push(p));
  let h = `<h1>Provas de 3 e 4 de novembro</h1>
  <p class="lede">As disciplinas na ordem em que você vai fazê-las. Abra uma para ver a revisão de véspera, as questões comentadas e os flashcards.</p>${countdown()}`;
  for(const dia in grupos){
    h += `<section class="day"><h2>${fmtDia(dia)}</h2><ol class="slots">`;
    grupos[dia].forEach(p => {
      const d = D(p.cod), x = pct(p.cod);
      h += `<li class="slot"><span class="slot-time">${p.hora}</span>
      <${d ? "a" : "div"} class="slot-card ${d ? "ready" : ""}" ${d ? `href="#${p.cod.toLowerCase()}-revisao"` : ""}>
        <span><span class="slot-name">${esc(p.nome)}</span><br><span class="slot-code">${p.cod}${d ? `, ${d.revisao.length} tópicos, ${d.questoes.length} questões, ${d.cards.length} flashcards` : ""}</span></span>
        <span class="slot-side">${d ? `<span class="chip pronto">Material recebido</span>` : `<span class="chip wait">Aguardando material</span>`}</span>
        ${d ? `<span class="bar" role="progressbar" aria-valuenow="${x}" aria-valuemin="0" aria-valuemax="100" aria-label="Seu progresso"><i style="width:${x}%"></i></span>` : ""}
      </${d ? "a" : "div"}></li>`;
    });
    h += `</ol></section>`;
  }
  h += `<p class="foot-note">Material de apoio montado a partir dos arquivos extraídos do AVA. Não substitui as aulas nem garante o que cairá na prova. Onde o material tem pontos duvidosos, eles aparecem em azul com o título “Conferir”.</p>`;
  $("#app").innerHTML = h;
}

/* ───────── disciplina ───────── */
function disciplina(slug, tab){
  const p = PROVAS.find(x => x.cod.toLowerCase() === slug), d = D(p.cod);
  const nConf = d.notas.length;
  $("#app").innerHTML = `<a class="voltar" href="#home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Todas as provas</a>
  <h1>${esc(p.nome)}</h1>
  <div class="meta"><span>${p.cod}</span><span>${fmtDia(p.dia)}, ${p.hora}</span><span class="chip wait" title="O material ainda não passou por conferência automática nem por auditoria independente.">Conferência pendente</span></div>
  <div class="panels">
    <details class="panel info"><summary>Pontos para conferir (${nConf})</summary><div class="panel-b"><ul>${
      nConf ? d.notas.map(n => `<li><b>${esc(n.titulo)}.</b> ${esc(n.texto)}</li>`).join("") : "<li>Nenhum ponto marcado.</li>"}</ul></div></details>
    <details class="panel"><summary>O que este material cobre e o que não cobre</summary><div class="panel-b"><ul>${d.cobertura.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div></details>
  </div>
  <div class="tabs" role="tablist">${[["revisao","Revisão de véspera",d.revisao.length],["questoes","Questões comentadas",d.questoes.length],["flashcards","Flashcards",d.cards.length]]
    .map(([k, l, n]) => `<button role="tab" class="tab" aria-selected="${tab === k}" data-tab="${k}">${l}<span>${n}</span></button>`).join("")}</div>
  <div id="pane"></div>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { location.hash = `${slug}-${b.dataset.tab}`; });
  ({revisao: () => revisao(p.cod), questoes: () => questoes(p.cod), flashcards: () => flashcards(p.cod)})[tab]();
}

/* ───────── revisão ───────── */
function revisao(cod){
  const d = D(cod), pr = prog(cod), q = norm(S.busca.trim());
  const lista = d.revisao.filter(t => (S.filtro === "todos" || t.prob === S.filtro) && (!q || norm(t.titulo + " " + plain(t.html)).includes(q)));
  let h = d.top5.length ? `<div class="top5"><h3>Temas que mais caem, segundo o resumo</h3><ol>${d.top5.map(t => `<li>${t}</li>`).join("")}</ol></div>` : "";
  h += `<div class="toolbar">${[["todos","Todos"],["alta","Prioridade alta"],["media","Prioridade média"]]
    .map(([k, l]) => `<button class="fbtn" data-f="${k}" aria-pressed="${S.filtro === k}">${l}</button>`).join("")}
    <input class="search" id="busca" type="search" placeholder="Buscar na revisão" value="${esc(S.busca)}" aria-label="Buscar na revisão">
    <span class="spacer"></span><span class="count">${pr.rev.length} de ${d.revisao.length} revisados</span></div>`;
  if(!lista.length) h += `<div class="empty">Nenhum tópico encontrado.</div>`;
  lista.forEach(t => {
    const feito = pr.rev.includes(t.id);
    h += `<details class="topic ${feito ? "done" : ""}" data-p="${t.prob}" data-id="${t.id}" ${(S.open.has(t.id) || q) ? "open" : ""}>
      <summary><span class="chip ${t.prob}">${t.prob === "alta" ? "Alta" : "Média"}</span><span class="topic-t">${esc(t.titulo)}</span></summary>
      <div class="topic-body"><div class="rev">${t.html}</div>${conferirHtml(notasDe(d, "revisao", t.id))}
        <label class="check"><input type="checkbox" data-rev="${t.id}" ${feito ? "checked" : ""}>Marcar como revisado</label></div></details>`;
  });
  $("#pane").innerHTML = h;
  document.querySelectorAll(".fbtn[data-f]").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; revisao(cod); });
  $("#busca").oninput = e => { S.busca = e.target.value; const pos = e.target.selectionStart; revisao(cod); const i = $("#busca"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll("details.topic").forEach(el => el.addEventListener("toggle", () => { el.open ? S.open.add(el.dataset.id) : S.open.delete(el.dataset.id); }));
  document.querySelectorAll("[data-rev]").forEach(c => c.onchange = () => {
    const p = prog(cod), id = c.dataset.rev;
    p.rev = c.checked ? [...new Set([...p.rev, id])] : p.rev.filter(x => x !== id);
    saveProg(cod, p); S.open.add(id); revisao(cod);
  });
}

/* ───────── questões ───────── */
function questoes(cod){
  const d = D(cod), pr = prog(cod), q = norm(S.busca.trim());
  const blocos = [...new Set(d.questoes.map(x => x.bloco))];
  const lista = d.questoes.filter(x => (S.bloco === "todos" || x.bloco === S.bloco) && (!S.soRepete || x.repete) &&
    (!q || norm([x.num, x.tema, x.enun, x.html, x.coment.join(" "), x.gab].join(" ").replace(/<[^>]+>/g, " ")).includes(q)));
  let h = `<div class="chips-scroll"><button class="fbtn" data-b="todos" aria-pressed="${S.bloco === "todos"}">Todos os blocos</button>${
    blocos.map(b => `<button class="fbtn" data-b="${esc(b)}" aria-pressed="${S.bloco === b}">${esc(blocoCurto(b))}</button>`).join("")}</div>
  <div class="toolbar"><button class="fbtn" id="repete" aria-pressed="${S.soRepete}" title="Questões que repetem um conceito já cobrado">Só as que se repetem</button>
    <input class="search" id="busca" type="search" placeholder="Buscar nas questões" value="${esc(S.busca)}" aria-label="Buscar nas questões">
    <span class="spacer"></span><span class="count">${lista.length} de ${d.questoes.length} questões, ${pr.q.length} revisadas</span></div>`;
  let atual = null;
  lista.forEach(x => {
    if(x.bloco !== atual){ atual = x.bloco; h += `<h3 class="gh">${esc(blocoLongo(atual))}</h3>`; }
    const ns = notasDe(d, "questao", x.id);
    h += `<article class="qrow"><div class="qrow-h"><span class="qn">${esc(x.num)}</span>${x.tema ? `<span class="qtema">${esc(x.tema)}</span>` : `<span class="qtema"></span>`}
      ${x.repete ? `<span class="chip media" title="${esc(x.repeteRef || "Repete um conceito já cobrado")}">Repete</span>` : ""}
      <span class="gab" aria-label="Gabarito ${x.gab}"><b>${x.gab}</b>${x.gabLabel ? `<span>${esc(x.gabLabel)}</span>` : ""}</span></div>
      ${x.enun ? `<p class="qenun">${x.enun}</p>` : ""}${x.html ? `<p class="qtxt">${x.html}</p>` : ""}
      ${x.coment.map(c => `<p class="qcom">${c}</p>`).join("")}${x.repeteRef ? `<p class="qcom">Repete: ${esc(x.repeteRef)}</p>` : ""}${conferirHtml(ns)}
      <label class="check"><input type="checkbox" data-q="${x.id}" ${pr.q.includes(x.id) ? "checked" : ""}>Revisei</label></article>`;
  });
  if(!lista.length) h += `<div class="empty">Nenhuma questão encontrada.</div>`;
  if(d.sinteses.length && S.bloco === "todos" && !S.soRepete && !q){
    h += `<h3 class="gh">Síntese dos módulos sem questões detalhadas</h3>` + d.sinteses.map(s => `<div class="sint"><h3>${esc(s.titulo)}</h3><p>${s.html}</p></div>`).join("");
  }
  $("#pane").innerHTML = h;
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { S.bloco = b.dataset.b; questoes(cod); });
  $("#repete").onclick = () => { S.soRepete = !S.soRepete; questoes(cod); };
  $("#busca").oninput = e => { S.busca = e.target.value; const pos = e.target.selectionStart; questoes(cod); const i = $("#busca"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-q]").forEach(c => c.onchange = () => {
    const p = prog(cod), id = c.dataset.q; const y = window.scrollY;
    p.q = c.checked ? [...new Set([...p.q, id])] : p.q.filter(z => z !== id); saveProg(cod, p);
    document.querySelector(".count").textContent = `${lista.length} de ${d.questoes.length} questões, ${p.q.length} revisadas`;
  });
}

/* ───────── flashcards ───────── */
function flashcards(cod){
  const d = D(cod), pr = prog(cod);
  if(!S.fila) S.fila = d.cards.filter(c => pr.cards[c.id] !== 1).map(c => c.id);
  const total = d.cards.length, sabidos = d.cards.filter(c => pr.cards[c.id] === 1).length;
  if(!S.fila.length){
    $("#pane").innerHTML = `<div class="fc-done"><h3>Baralho concluído</h3><p class="lede" style="margin:0 auto 16px">Você marcou ${sabidos} de ${total} cards como sabidos.</p><button class="btn main" id="reinicia">Recomeçar baralho</button></div>`;
    $("#reinicia").onclick = () => { const p = prog(cod); p.cards = {}; saveProg(cod, p); S.fila = null; S.flip = false; flashcards(cod); };
    return;
  }
  const c = d.cards.find(x => x.id === S.fila[0]), ns = notasDe(d, "card", c.id);
  $("#pane").innerHTML = `<div class="fc-top"><span>${sabidos} de ${total} sabidos, ${S.fila.length} na fila</span><span class="kbd">Espaço vira, seta esquerda errei, seta direita acertei</span></div>
  <div class="fc-scene"><button class="fc ${S.flip ? "flip" : ""}" id="fc" aria-label="Virar o card">
    <span class="face"><span class="lab">Pergunta</span><span class="txt">${c.f}</span><span class="hint">Toque para ver a resposta</span></span>
    <span class="face back"><span class="lab">Resposta</span><span class="txt">${c.v}</span><span class="hint">Você acertou?</span></span></button></div>
  <div class="fc-note" id="fcnote" ${S.flip ? "" : "hidden"}>${conferirHtml(ns)}</div>
  <div class="fc-actions"><button class="btn wrong" id="errei">Errei, repetir depois</button><button class="btn right" id="acertei">Acertei</button></div>`;
  $("#fc").onclick = () => { S.flip = !S.flip; $("#fc").classList.toggle("flip", S.flip); $("#fcnote").hidden = !S.flip; };
  $("#errei").onclick = () => marca(cod, 0);
  $("#acertei").onclick = () => marca(cod, 1);
}
function marca(cod, v){
  const p = prog(cod), id = S.fila.shift(); p.cards[id] = v; saveProg(cod, p);
  if(v === 0) S.fila.push(id);
  S.flip = false; flashcards(cod);
}

/* ───────── rotas, tema, teclado ───────── */
function route(){
  const h = location.hash.slice(1) || "home";
  const m = h.match(/^([a-z0-9]{4})-(revisao|questoes|flashcards)$/);
  if(m && D(m[1].toUpperCase())){
    if(S.cod !== m[1]){ S = Object.assign(S, {cod:m[1], filtro:"todos", bloco:"todos", soRepete:false, busca:"", fila:null, flip:false, open:new Set([D(m[1].toUpperCase()).revisao[0].id])}); }
    if(S.tab !== m[2]){ S.busca = ""; S.fila = null; S.flip = false; }
    S.tab = m[2]; disciplina(m[1], m[2]);
  } else { S.cod = null; home(); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(x => x.open = true));
document.addEventListener("keydown", e => {
  if(/INPUT|TEXTAREA/.test(e.target.tagName) || S.tab !== "flashcards" || !$("#fc")) return;
  if(e.key === " "){ e.preventDefault(); $("#fc").click(); }
  if(e.key === "ArrowLeft") $("#errei").click();
  if(e.key === "ArrowRight") $("#acertei").click();
});
$("#theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
};
setInterval(() => { if(!S.cod) home(); }, 60000);
route();
</script>
</body>
