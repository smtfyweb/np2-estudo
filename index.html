<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo UNIP: provas de 3 e 4 de novembro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f2f4f2; --surface:#fff; --surface-2:#e9edea; --ink:#15211d; --muted:#5b6a64; --line:#d6ddd8;
  --brand:#0f4c45; --brand-ink:#fff; --brand-soft:#dcebe7;
  --alta:#b4540a; --alta-soft:#fbeadb; --media:#3b5f9a; --media-soft:#e3ebf7;
  --ok:#17744a; --ok-soft:#dff3e8; --err:#b3363b; --err-soft:#fae3e4;
  --warn:#8a5a00; --warn-soft:#fff3d6;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --read:'Source Serif 4',Georgia,'Times New Roman',serif; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513; --surface:#16201c; --surface-2:#1d2a25; --ink:#e6eeea; --muted:#93a39b; --line:#2a3832;
    --brand:#5fc0ae; --brand-ink:#08201b; --brand-soft:#17332e;
    --alta:#f0a15e; --alta-soft:#3a2614; --media:#8fb3ec; --media-soft:#1a2a45;
    --ok:#5fd39b; --ok-soft:#133323; --err:#f08a8e; --err-soft:#3b1a1c; --warn:#f0c76a; --warn-soft:#3a2d0c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#16201c; --surface-2:#1d2a25; --ink:#e6eeea; --muted:#93a39b; --line:#2a3832;
  --brand:#5fc0ae; --brand-ink:#08201b; --brand-soft:#17332e;
  --alta:#f0a15e; --alta-soft:#3a2614; --media:#8fb3ec; --media-soft:#1a2a45;
  --ok:#5fd39b; --ok-soft:#133323; --err:#f08a8e; --err-soft:#3b1a1c; --warn:#f0c76a; --warn-soft:#3a2d0c; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none}
.mark-sq{width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px}
.mark small{font-weight:500;color:var(--muted);font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
main{max-width:960px;margin:0 auto;padding:28px 20px 96px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
h3{font-size:15px;font-weight:600}
.lede{color:var(--muted);margin-top:6px;max-width:62ch}

/* home */
.next{margin:22px 0 8px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next .cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand);font-size:18px}
.day{margin-top:30px}
.day h2{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.day h2::after{content:"";flex:1;height:1px;background:var(--line)}
.slots{list-style:none}
.slot{display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding-bottom:10px}
.slot-time{font-variant-numeric:tabular-nums;font-weight:600;padding-top:15px;text-align:right}
.slot-card{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;border-left:4px solid var(--line);transition:border-color .15s}
.slot-card:hover{border-color:var(--brand);border-left-color:var(--brand)}
.slot-card.ready{border-left-color:var(--brand)}
.slot-name{font-weight:600;line-height:1.3}
.slot-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot-side{display:flex;align-items:center;gap:12px}
.bar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pronto{background:var(--brand-soft);color:var(--brand)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.alta{background:var(--alta-soft);color:var(--alta)}
.chip.media{background:var(--media-soft);color:var(--media)}
.foot-note{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;max-width:70ch}

/* disciplina */
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:14px;text-decoration:none;margin-bottom:14px}
.voltar:hover{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;align-items:center;color:var(--muted);font-size:14px}
.panels{display:grid;gap:8px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .15s;margin-bottom:3px}
.panel[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.panel-b{padding:2px 16px 14px;border-top:1px solid var(--line);font-size:14.5px}
.panel-b ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.panel-b li{padding-left:14px;position:relative}
.panel-b li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:2px;background:var(--muted)}
.panel.info{border-color:var(--media)}
.panel.info>summary{color:var(--media)}
.tabs{display:flex;gap:4px;margin:22px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab span{font-weight:500;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fbtn{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface);white-space:nowrap}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:170px;max-width:320px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:14px}
.spacer{flex:1}
.count{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}

/* top5 + conferir + pegadinha */
.top5{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.top5 ol{margin:8px 0 0 20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.conferir{margin-top:14px;padding:11px 14px;background:var(--media-soft);border-left:3px solid var(--media);border-radius:8px;font-size:14px;line-height:1.55;max-width:68ch}
.conferir b{display:block;color:var(--media);font-size:13.5px;margin-bottom:2px}
.pega{margin-top:14px;padding:12px 14px;background:var(--warn-soft);border-radius:8px}

/* revisão */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;border-left:4px solid var(--line)}
.topic[data-p="alta"]{border-left-color:var(--alta)}
.topic[data-p="media"]{border-left-color:var(--media)}
.topic summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.topic summary::-webkit-details-marker{display:none}
.topic summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .15s;flex-shrink:0;margin-bottom:3px}
.topic[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.topic-t{font-weight:600;line-height:1.3}
.topic.done .topic-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.topic-body{padding:4px 18px 18px;border-top:1px solid var(--line)}
.rev{font-family:var(--read);font-size:17px;line-height:1.7;max-width:70ch}
.rev p{margin-top:12px}
.rev ul,.rev ol{margin-top:10px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.rev ul ul{margin-top:6px}
.rev li::marker{color:var(--brand)}
.rev h3,.rev h4{font-family:var(--ui);margin-top:16px}
.rev .pega{font-size:16px}
.rev code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;margin-top:14px;max-width:100%}
.rev table{border-collapse:collapse;font-family:var(--ui);font-size:14px;line-height:1.45;min-width:420px;width:100%}
.rev th{background:var(--surface-2);text-align:left;font-weight:600}
.rev th,.rev td{padding:8px 11px;border:1px solid var(--line);vertical-align:top}
.check{display:flex;align-items:center;gap:8px;margin-top:16px;font-weight:600;font-size:14px;cursor:pointer;width:max-content}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* questões */
.gh{font-size:15px;font-weight:600;margin:22px 0 10px;color:var(--muted)}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.qrow-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qn{font-weight:700;font-variant-numeric:tabular-nums}
.qtema{color:var(--muted);font-size:14px;flex:1;min-width:120px}
.gab{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
.gab b{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:15px}
.gab span{font-size:13px;color:var(--muted);font-weight:500}
.qenun{font-family:var(--read);font-size:16.5px;line-height:1.6;margin-top:10px;color:var(--muted);font-style:italic;max-width:70ch}
.qtxt{font-family:var(--read);font-size:17px;line-height:1.65;margin-top:8px;max-width:70ch}
.qcom{font-family:var(--read);font-size:16px;line-height:1.6;margin-top:6px;color:var(--muted);max-width:70ch}
.sint{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:8px}
.sint h3{margin-bottom:4px}
.sint p{font-family:var(--read);font-size:16.5px;line-height:1.65;max-width:70ch}

/* flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.fc-scene{perspective:1400px;max-width:660px;margin:0 auto}
.fc{position:relative;height:min(400px,60vh);min-height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);cursor:pointer;width:100%;display:block;text-align:left}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:26px 26px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--brand-soft);border-color:transparent}
.face .lab{font-size:13.5px;font-weight:600;color:var(--muted)}
.face.back .lab{color:var(--brand)}
.face .txt{font-family:var(--read);font-size:21px;line-height:1.5;margin:auto 0;padding:10px 0;max-width:40ch}
.face.back .txt{font-size:19px}
.face .hint{font-size:13px;color:var(--muted)}
.fc-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.wrong{border-color:var(--err);color:var(--err)}
.btn.right{border-color:var(--ok);color:var(--ok)}
.fc-note{max-width:660px;margin:14px auto 0}
.fc-done{text-align:center;padding:40px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:660px;margin:0 auto}
.fc-done h3{font-size:20px;margin-bottom:6px}
.kbd{color:var(--muted);font-size:12.5px}
.empty{padding:30px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

@media (max-width:600px){
  h1{font-size:23px} main{padding:20px 16px 90px} .top-in{padding:0 16px}
  .slot{grid-template-columns:46px 1fr;gap:0 10px} .slot-time{font-size:14px}
  .slot-card{grid-template-columns:1fr} .slot-side{justify-content:flex-start}
  .kbd{display:none} .face .txt{font-size:19px} .face.back .txt{font-size:17.5px}
  .rev{font-size:16.5px} .qrow{padding:12px 13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.tabs,.toolbar,.check,.panels{display:none}.topic{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="mark" href="#home" aria-label="Início"><span class="mark-sq">U</span><span>Estudo UNIP <small>10º semestre</small></span></a>
    <button class="icon-btn" id="theme" aria-label="Alternar tema claro e escuro" title="Alternar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="app"></main>
<script>window.DADOS=window.DADOS||{};window.DADOS["D05E"]={"cod": "D05E", "revisao": [{"id": "r1", "titulo": "Gênero discursivo jurídico", "prob": "media", "html": "<ul>\n<li>Objetivo único: <strong>conquista de adesão</strong> do interlocutor</li>\n<li>Lugar de enunciação principal trabalhado: <strong>Tribunal do Júri</strong></li>\n<li>Referência teórica central: <strong>Pêcheux (1969)</strong> — formações imaginárias</li>\n</ul>"}, {"id": "r2", "titulo": "Formações imaginárias (Pêcheux)", "prob": "alta", "html": "<p>Relação triádica: <strong>Eu — OUTRO — Referente</strong></p>\n<p>As 6 imagens constitutivas do discurso:</p>\n<ul>\n<li>A imagem que o OUTRO tem de mim para eu lhe falar assim</li>\n<li>A imagem que tenho do OUTRO para lhe falar assim</li>\n<li>A imagem que tenho de mim para que ele me fale assim</li>\n<li>A imagem que tenho dele para que ele me fale assim</li>\n<li>A imagem que tenho <strong>do que</strong> lhe falo</li>\n<li>A imagem que ele tem <strong>do que</strong> me fala</li>\n</ul>\n<p><strong>LEITOR VIRTUAL:</strong> inserido no texto no próprio ato da escrita; é imaginário; pode ser <strong>cúmplice</strong> (adere à tese) ou <strong>adversário</strong> (fonte de contra-argumentos a antecipar).</p>"}, {"id": "r3", "titulo": "Tese primária e teses secundárias", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tese Primária</th>\n<th>Teses Secundárias</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ideia central, não pode ser abandonada</td>\n<td>Contra-argumentos trazidos pelo próprio enunciador</td>\n</tr>\n<tr>\n<td>Deve ser retomada constantemente</td>\n<td>Servem para fortalecer a tese primária</td>\n</tr>\n<tr>\n<td>O enunciador <strong>jamais</strong> se afasta dela</td>\n<td>São <strong>refutadas</strong> no espaço discursivo do próprio enunciador</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"As teses secundárias questionam a tese primária\" → <strong>FALSO.</strong> Elas reforçam ao serem refutadas dentro do texto do enunciador.</p>"}, {"id": "r4", "titulo": "Estrutura do texto argumentativo", "prob": "media", "html": "<p><strong>Introdução:</strong> Apresenta o tema/tese primária. Primeiro contato com interlocutores. Pode elogiar a responsabilidade da audiência. <strong>Conquista já começa aqui</strong> (pegadinha: \"na introdução não cabe conquista\" → <strong>FALSO</strong>).</p>\n<p><strong>Desenvolvimento:</strong> Etapa mais crucial. Embate tese primária × teses secundárias. Contra-argumentos são derrubados aqui. <strong>Risco de alimentar o oponente.</strong> Estado de alerta contínuo.</p>\n<p><strong>Conclusão:</strong> Retoma a tese primária já respaldada. Sujeito apresenta-se vitorioso. <strong>Não</strong> basta \"fechar\" sem retomar a tese primária (pegadinha frequente).</p>"}, {"id": "r5", "titulo": "Convencer, persuadir e dissuadir", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ato</th>\n<th>Audiência</th>\n<th>Mecanismo</th>\n<th>Posicionamento anterior</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Convencer</strong></td>\n<td>Universal (racional)</td>\n<td>Razão/lógica</td>\n<td>Interlocutor <strong>ainda não</strong> se posicionou</td>\n</tr>\n<tr>\n<td><strong>Persuadir</strong></td>\n<td>Particular/específica (leigos)</td>\n<td>Apelo emocional</td>\n<td>Interlocutor já tem posição; exige mudança</td>\n</tr>\n<tr>\n<td><strong>Dissuadir</strong></td>\n<td>Particular</td>\n<td>Argumentação sólida</td>\n<td>Mais complexo; mexe em valores pessoais</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Perelman (1982):</strong> persuasão → audiência específica/leigos. Convencer → audiência universal.</p>\n<p class=\"pega\"><strong>PEGADINHA frequentíssima:</strong> \"Apenas persuadir e dissuadir exigem mudança de posicionamento\" → <strong>VERDADE.</strong> Convencer atua sobre quem ainda não decidiu.</p>\n<p class=\"pega\"><strong>PEGADINHA:</strong> assertivas que dizem que esses três atos atuam \"tão somente\" na direção de UM dos sujeitos (apenas enunciador OU apenas interlocutor) → <strong>SEMPRE ERRADAS.</strong> Atuam nos valores de ambos.</p>"}, {"id": "r6", "titulo": "Lugares da argumentação (Perelman)", "prob": "alta", "html": "<p>Premissas gerais que reforçam adesão a valores:</p>\n<ul>\n<li><strong>Lugar da Quantidade:</strong> mais serve a mais pessoas/mais durável = mais valioso</li>\n<li><strong>Lugar da Qualidade:</strong> o raro, o único, o irreversível vale mais</li>\n<li><strong>Lugar da Pessoa:</strong> pessoas &gt; coisas (\"Primeiro as pessoas, depois as coisas!\")</li>\n<li><strong>Lugar do Existente:</strong> prefere-se o que já existe ao que ainda não existe</li>\n<li><strong>Lugar de Essência:</strong> valoriza representantes perfeitos de uma categoria (Ferrari = bom carro)</li>\n<li><strong>Lugar da Ordem:</strong> o anterior funda o posterior</li>\n</ul>\n<p><strong>O que caracteriza um auditório:</strong> não os valores que admite, mas <strong>como os hierarquiza.</strong></p>"}, {"id": "r7", "titulo": "Hierarquia de valores", "prob": "alta", "html": "<ul>\n<li>Não existe hierarquia <strong>perfeita e ideal válida para todos os tempos e lugares</strong> → assertiva I correta nos dois questionários</li>\n<li>Valores universais (verdade, bem, belo, afeto, sagrado) <strong>devem</strong> ser priorizados</li>\n<li>Valores lógicos (razão/verdade), éticos (justiça, liberdade), estéticos (beleza)</li>\n</ul>"}, {"id": "r8", "titulo": "Heterogeneidade discursiva", "prob": "media", "html": "<ul>\n<li><strong>Mostrada/Marcada:</strong> citação identificada com aspas, referência ao autor → forma marcada</li>\n<li><strong>Constitutiva/Não marcada:</strong> discurso do outro incorporado sem demarcação → ilusão de autoria</li>\n<li>Ambas servem ao percurso argumentativo no Tribunal do Júri</li>\n<li>A <strong>ilusão de origem</strong> faz o sujeito crer que é a origem do seu discurso</li>\n</ul>"}, {"id": "r9", "titulo": "Estratégias argumentativas", "prob": "media", "html": "<ul>\n<li><strong>Argumento de autoridade:</strong> citar fonte confiável; <strong>obrigatório</strong> identificar o autor</li>\n<li><strong>Exemplificação/Ilustração:</strong> fato real ou fictício; útil para teses teóricas; digressões <em>necessárias</em> são válidas (orientar antes e concluir depois); digressões desnecessárias = prejuízo</li>\n<li><strong>Causa e consequência:</strong> motivos + efeitos; cria efeito de lógica</li>\n<li><strong>ABNT no texto escrito:</strong> erros ortográficos na citação → acrescentar (sic); cortes na citação → reticências entre colchetes [...]; grifo inserido → \"(grifo nosso)\"; grifo original → \"(grifo do autor)\"</li>\n</ul>"}, {"id": "r10", "titulo": "Lógica jurídica e dialética", "prob": "media", "html": "<ul>\n<li><strong>Lógica formal:</strong> cuida das regras do pensamento racional</li>\n<li><strong>Lógica material:</strong> investiga adequação do raciocínio à realidade</li>\n<li><strong>Silogismo:</strong> dedução de conclusão a partir de premissas</li>\n<li><strong>Dialética:</strong> diálogo, oposição de ideias entre posições antagônicas</li>\n<li><strong>Siches (Recaséns Siches):</strong> defende a \"lógica do razoável\" — razão impregnada de pontos de vista estimativos e axiológicos, com ensinamentos da experiência humana</li>\n<li><strong>Robert Alexy:</strong> teoria da argumentação capaz de distinguir bons dos maus argumentos; busca coerência lógica, não incoerência</li>\n</ul>"}, {"id": "r11", "titulo": "Artigos de lei citados", "prob": "media", "html": "<ul>\n<li><strong>Art. 5º LINDB:</strong> juiz atenderá aos fins sociais (interpretação teleológica)</li>\n<li><strong>Art. 489 §1º CPC:</strong> fundamentação exauriente; proibição de paráfrase genérica</li>\n<li><strong>Art. 326 CPC:</strong> pedidos subsidiários/alternativos (teses primárias antes das subsidiárias)</li>\n<li><strong>Art. 330 §1º CPC:</strong> inépcia da petição inicial (falta pedido/causa de pedir; narração não gera conclusão; pedidos incompatíveis)</li>\n</ul>"}, {"id": "r12", "titulo": "Pegadinhas e erros clássicos", "prob": "alta", "html": "<ol>\n<li>\"Na introdução não cabe conquista dos interlocutores\" → <strong>FALSO</strong></li>\n<li>\"Na conclusão basta fechar sem retomar a tese primária\" → <strong>FALSO</strong></li>\n<li>\"Teses secundárias questionam a tese primária\" → <strong>FALSO</strong> (elas são refutadas para reforçá-la)</li>\n<li>\"Argumentação por antecipação causa equívocos\" → <strong>FALSO</strong> (só ajuda)</li>\n<li>\"Formações imaginárias não influenciam a conquista de adesão\" → <strong>FALSO</strong></li>\n<li>Assertivas com \"tão somente\", \"apenas\", \"não pode\" restringindo o alcance dos atos de convencer/persuadir → <strong>SEMPRE ERRADAS</strong></li>\n<li>\"Convencer, persuadir e dissuadir exigem todos mudança de posicionamento\" → <strong>FALSO</strong> (apenas persuadir e dissuadir)</li>\n<li>\"É impossível prever os argumentos do interlocutor\" → <strong>FALSO</strong> (formações imaginárias permitem prever e antecipar)</li>\n<li>\"Fontes duvidosas ainda conquistam credibilidade\" → <strong>FALSO</strong></li>\n<li>Orador deve se adaptar ao público, não o contrário → <strong>assertivas I e III corretas</strong> (adaptação ao repertório e condições intelectuais da audiência)</li>\n</ol>"}], "top5": ["<b>Formações imaginárias + leitor virtual (cúmplice/adversário)</b> — cobrado em todos os questionários", "<b>Tese primária × teses secundárias</b> — cobrado em todos os questionários", "<b>Convencer × persuadir × dissuadir + audiência universal/particular</b> — cobrado em todos os questionários", "<b>Lugares da argumentação + hierarquia de valores</b> — cobrado em ambas as unidades", "<b>Estratégias argumentativas + lógica jurídica/dialética</b> — cobrado na Unidade II"], "questoes": [{"id": "Q1-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q1", "tema": "Hierarquia de valores", "enun": "Com relação aos valores, assinale a alternativa correta.\n\nI) Não é possível se definir uma hierarquia perfeita e ideal válida para todos os tempos e todos os lugares.\nII) Os valores universais, que não devem ser priorizados, são os que atendem às necessidades da pessoa humana.\nIII) Os valores universais, que devem ser priorizados, não são os que atendem às necessidades da pessoa humana.\nIV) É possível se definir uma hierarquia perfeita e ideal, válida para todos os tempos e todos os lugares.", "gab": "A", "gabLabel": "Apenas I", "html": "Apenas I está correta. Hierarquia de valores é relativa ao tempo, cultura e contexto. Valores universais <i>devem</i> ser priorizados (II e III falsas). Hierarquia ideal universal não existe (IV falsa).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q2-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q2", "tema": "Legitimidade e credibilidade", "enun": "Quanto às informações verossímeis, à legitimidade e à transparência do texto, podemos afirmar que:\n\nI) A legitimidade das informações é geradora de credibilidade. Uma informação que se fundamenta em fonte duvidosa é capaz de conquistar credibilidade e adesão dos interlocutores.\nII) A quantidade de informação merece bem pouca atenção por parte do sujeito enunciador para que a palestra não corra o risco de ser informativa.\nIII) Referência a situações um pouco fantásticas em relação à realidade não gera falta de credibilidade por parte dos interlocutores.\nIV) A enunciação de uma palestra é formal. Deve-se avaliar os mecanismos de manutenção de harmonia entre sujeito e interlocutores para que se preserve a urbanidade.", "gab": "D", "gabLabel": "Apenas IV", "html": "Apenas IV é verdadeira. Fontes duvidosas (I falsa) e exemplos fantasiosos (III falsa) destroem credibilidade. Dosagem da informação exige atenção (II falsa). Preservar urbanidade na enunciação formal é correto (IV verdadeira).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q3-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q3", "tema": "Atos de convencer/persuadir/dissuadir", "enun": "Com relação aos atos de convencer, persuadir e dissuadir, assinale a(s) afirmativa(s) <b>incorreta(s)</b>.\n\nI) Os três atos não se caracterizam por atuarem na direção dos valores constitutivos das formações ideológicas e imaginárias dos interlocutores endereçados.\nII) Caracterizam-se por atuarem, tão somente, na direção dos valores constitutivos das formações ideológicas do sujeito enunciador.\nIII) Caracterizam-se por atuar, tão somente, na direção dos valores constitutivos das formações discursivas dos interlocutores endereçados.\nIV) Caracterizam-se por atuarem na direção dos valores constitutivos das formações ideológicas e imaginárias dos interlocutores e do sujeito enunciador.", "gab": "C", "gabLabel": "Apenas I, II e III", "html": "O enunciado pede as INCORRETAS. IV é a única correta: os atos atuam sobre formações ideológicas e imaginárias de ambos os sujeitos. I, II e III restringem ou negam indevidamente essa atuação.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q4-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q4", "tema": "Ajuste à audiência", "enun": "Considerando a necessidade de o sujeito enunciador se ajustar à audiência ao organizar palestra sobre organizações criminosas, deve observar:\n\nI) Não só o conhecimento, mas o nível de conhecimento dos interlocutores sobre o assunto.\nII) Não deve falar acima do conhecimento para evitar desligamento, nem muito abaixo para não entediar.\nIII) Não deve se ater a termos muito específicos do jargão jurídico ou gíria do crime que a audiência não compartilhe.\nIV) Precisa dar legitimidade às informações e preservar a harmonia com seus interlocutores (urbanidade).", "gab": "E", "gabLabel": "Todas são corretas", "html": "Todas expressam requisitos do ajuste ao interlocutor: calibrar nível de linguagem, evitar jargões incompreensíveis, garantir legitimidade e preservar urbanidade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q5-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q5", "tema": "Interação sujeito × interlocutor na elaboração", "enun": "Assinale a alternativa que der a melhor explicação da interação entre sujeito e interlocutor na elaboração do texto.\n\nI) No momento da elaboração, o sujeito não precisa interagir com o interlocutor para antecipar contra-argumentos, pois poderá fazê-lo durante a introdução.\nII) A interação somente se realiza quando o sujeito demonstra ter real conhecimento do interlocutor; apenas o imaginário não é suficiente.\nIII) No planejamento, sujeito interage com o interlocutor a partir das formações imaginárias e escolhe mecanismos para esclarecer aspectos de difícil compreensão.\nIV) No planejamento, o sujeito interage pelo imaginário e encontra mecanismos para refutar possíveis contra-argumentos, pode escolher mecanismos quanto ao uso de vocabulário específico.", "gab": "E", "gabLabel": "Apenas III e IV", "html": "III e IV descrevem corretamente o papel das formações imaginárias no planejamento. I é falsa (antecipação ocorre no planejamento, não só na introdução). II é falsa (o imaginário é suficiente).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q6-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q6", "tema": "Leitor virtual", "enun": "Com relação à utilização do recurso do leitor virtual, é correto afirmar:\n\nI) Favorece, tão somente, a promotoria, tendo em vista que o sujeito não se fundamenta no grau de aceitabilidade das propostas.\nII) Favorece, tão somente, a defesa, tendo em vista que o sujeito não se fundamenta no grau de aceitabilidade das propostas.\nIII) Favorece, tão somente, o interlocutor, tendo em vista que o sujeito, seja defensor ou promotor, se fundamenta no grau de aceitabilidade.\nIV) Favorece tanto a defesa como a promotoria, tendo em vista que ambos se fundamentam no grau de aceitabilidade das propostas.", "gab": "E", "gabLabel": "Apenas IV", "html": "O leitor virtual é ferramenta universal — ambos (defesa e promotoria) mensuram o grau de aceitabilidade de suas teses. I, II e III restringem indevidamente a apenas uma das partes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q7-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q7", "tema": "Honestidade e argumento ético", "enun": "Considere as assertivas seguintes:\n\nI) Quando o sujeito enunciador elabora o texto, seja escrito ou oral, deve construir seu percurso argumentativo com honestidade e transparência.\nPORQUE\nII) Se falhar nesse aspecto, o percurso argumentativo será um processo de manipulação. Portanto, há que selecionar com consciência as fontes ou o argumento ético para que sua pesquisa tenha credibilidade.", "gab": "B", "gabLabel": "Ambas verdadeiras e a segunda justifica a primeira", "html": "A ausência de honestidade degrada a argumentação em manipulação, justificando a necessidade da primeira assertiva. Nexo causal confirmado.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q8-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q8", "tema": "Desenvolvimento do texto argumentativo", "enun": "Quanto à importância do desenvolvimento na estrutura geral de um texto argumentativo:\n\nI) O desenvolvimento é importante para a conquista de adesão porque é nesse momento que as teses secundárias se consolidam ao questionarem a tese primária.\nII) É correto afirmar que é na conclusão que derrubamos os contra-argumentos de modo mais eficiente e definitivo.\nIII) No desenvolvimento podemos refutar contra-argumentos, mas também podemos alimentar nosso oponente, o que exige cuidado redobrado.\nIV) Trata-se de um estado de alerta contínuo, porque o sujeito também corre o risco de alimentar seu oponente nesse mesmo espaço discursivo.", "gab": "D", "gabLabel": "Apenas III e IV", "html": "I falsa: teses secundárias <i>sustentam</i> a primária, não a questionam. II falsa: contra-argumentos são derrubados no desenvolvimento, não na conclusão. III e IV corretas sobre os riscos do percurso argumentativo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q9-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q9", "tema": "Contra-argumentos no Tribunal do Júri", "enun": "Com relação às técnicas utilizadas para a elaboração de textos no procedimento do Tribunal do Júri:\n\nI) Não é possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista não ser razoável negociar com seu interlocutor imaginário.\nII) É possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista ser razoável negociar com seu interlocutor imaginário de modo a buscar a adesão.\nIII) Não é possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista ser razoável negociar com seu interlocutor imaginário.\nIV) É possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista não ser razoável negociar com seu interlocutor imaginário.", "gab": "B", "gabLabel": "Apenas II", "html": "É possível e razoável antecipar contra-argumentos para negociar com o interlocutor imaginário e conquistar adesão. Apenas II combina corretamente \"é possível\" com \"é razoável negociar\".", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q10-I", "bloco": "UNIDADE I — QUESTIONÁRIO", "num": "Q10", "tema": "Valor da pessoa", "enun": "Com relação aos valores, assinale a alternativa correta.\n\nI) Na hierarquia a ser constituída no percurso argumentativo, é prioritário o valor da pessoa; o valor do \"outro\" enquanto \"pessoa\" deve ser relevado sempre.\nII) Não se pode prescindir do \"outro\" na construção do percurso argumentativo, pois ele vai ocupar um lugar primordial em qualquer escala.\nIII) Nada pior para o ser humano que se perceber inexistente para aquele que a ele se dirige. Tende a reagir com a mesma indiferença.\nIV) Quando o interlocutor não se sente valorizado pelo sujeito enunciador, reage contrariamente aos interesses do próprio sujeito enunciador.", "gab": "D", "gabLabel": "Todas são corretas", "html": "Todas traduzem o princípio central da comunicação empática: respeitar o outro como pessoa humana. Desconsiderar a audiência gera rejeição imediata.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT1-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT1", "tema": "Formações imaginárias e leitor virtual", "enun": "Considerando a importância das formações imaginárias na construção do percurso argumentativo do discurso jurídico, assinale a alternativa correta:\n\na. Há um leitor virtual inserido no texto, é constitutivo no próprio ato da escrita ou da fala. Tanto pode ser um \"cúmplice\" quanto um \"adversário\" do sujeito enunciador.\nb. O sujeito não deve se valer de argumentos que colocam em cheque o valor dos argumentos que questionam a tese primária. Deve se fundamentar apenas nos argumentos que fortalecem a tese primária.\nc. O sujeito enunciador não poderá prever argumentos que sustentarão as teses de seu interlocutor, derrubando-os antes mesmo de serem apresentadas.\nd. A argumentação por antecipação sempre pode causar equívocos muito prejudiciais à tese do sujeito enunciador.\ne. No percurso argumentativo, as relações das formações imaginárias não exercem influência no processo de conquista de adesão.", "gab": "A", "gabLabel": "", "html": "O leitor virtual é constitutivo do próprio ato da escrita/fala e pode ser cúmplice ou adversário. As demais negam indevidamente a antecipação ou afirmam que ela causa equívocos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT2-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT2", "tema": "Teses primárias e secundárias", "enun": "Quanto às teses primárias e secundárias e o modo como o sujeito enunciador deve trabalhar a conquista de adesão:\n\na. A consolidação da tese primária se confirma com a ajuda de teses secundárias, escolhidas estrategicamente para reforçar a tese primária. As teses secundárias devem ser refutadas pelo sujeito enunciador em seu próprio espaço discursivo.\nb. No desenvolvimento, temos o enfrentamento das teses primárias em embate entre elas, sendo que a mais forte vencerá.\nc. Na introdução, não cabe a conquista em relação aos interlocutores. A conquista pessoal do interlocutor não é relevante para a conquista de adesão à tese primária.\nd. Na conclusão, deve-se retomar a tese primária e demonstrar o que se aprendeu a respeito dos lados frágeis dela.\ne. Na conclusão, basta que o sujeito feche o percurso argumentativo sem que retome a tese primária.", "gab": "A", "gabLabel": "", "html": "A tese primária é reafirmada com o auxílio estratégico das teses secundárias, que são refutadas no espaço discursivo do próprio enunciador.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT3-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT3", "tema": "Convencer, persuadir, dissuadir", "enun": "Como podemos entender o processo de convencer, persuadir e dissuadir em relação à audiência particular e universal?\n\na. O ato de convencer está voltado para um interlocutor que ainda não se posicionou frente à proposta, mas que deverá validá-la a partir de seus critérios.\nb. O ato de persuadir permite compreender que toda audiência é específica, porque certos interlocutores têm um perfil que os distingue dos demais, em função de suas particularidades perante o sujeito e as condições de produção.\nc. O ato de dissuadir se realiza a partir dos valores constitutivos da formação ideológica e das formações discursivas de determinados interlocutores, buscando a adesão para impedir o bloqueio de pré-julgamentos.\nd. Os atos de convencer, persuadir e dissuadir caracterizam-se por atuar na direção dos valores constitutivos das formações ideológicas e discursivas dos interlocutores. Entre eles, persuadir e dissuadir requerem mudança de posicionamento.\ne. O ato de persuadir se realiza a partir dos valores constitutivos da formação ideológica dos interlocutores, buscando a adesão a despeito do conflito ideológico.", "gab": "B", "gabLabel": "", "html": "A persuasão opera sobre audiência específica/particular. O ato de persuadir exige conhecimento das singularidades da audiência endereçada. A Q3 do Questionário I e esta são questões distintas com enunciados diferentes — ambos os gabaritos estão corretos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT4-I", "bloco": "UNIDADE I — ATIVIDADE TELEAULA", "num": "AT4", "tema": "Adaptação ao público", "enun": "Considere as assertivas e assinale a alternativa com apenas as corretas:\n\nI. Somos nós que temos de nos adaptar às condições intelectuais e sociais daqueles que nos ouvem, e não o contrário.\nII. São aqueles que nos ouvem que têm de se adaptar às nossas condições intelectuais.\nIII. Ao proferir um discurso, devemos nos atentar ao repertório do público que nos ouve.", "gab": "B", "gabLabel": "I e III", "html": "O enunciador deve adaptar-se ao público (I), não o contrário (II falsa). Atentar ao repertório da audiência é requisito da eficácia comunicativa (III correta).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q1-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q1", "tema": "Contra-argumentos no Júri", "enun": "Com relação ao uso eficaz de contra-argumentos como estratégia no Tribunal do Júri:\n\na. Não é possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista não ser razoável negociar com seu interlocutor imaginário.\nb. Não é possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista ser razoável negociar com seu interlocutor imaginário.\nc. É possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista não ser razoável negociar com seu interlocutor imaginário.\nd. É possível que o sujeito se sirva de um contra-argumento à sua proposta, tendo em vista ser razoável negociar com seu interlocutor imaginário de modo a buscar adesão.\ne. É possível que o sujeito se valha de argumentos favoráveis à proposta do oponente, tendo em vista não ser razoável confrontar com seu interlocutor imaginário.", "gab": "D", "gabLabel": "", "html": "A antecipação de contra-argumentos permite desarmar as objeções da parte adversa antes de serem enunciadas, negociando com os preconceitos ou dúvidas no imaginário dos jurados.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q2-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q2", "tema": "Ajuste ao júri na réplica de crime passional", "enun": "Considerando a necessidade de o sujeito/promotor se ajustar à audiência de jurados na réplica sobre crime passional com requintes de crueldade:\n\nI) O conhecimento que os jurados detêm pode não ser suficiente para levá-los a aderir à tese da condenação. O promotor deve preparar os jurados para não apenas condenar, mas, sobretudo, para não absolver.\nII) O conhecimento que os jurados detêm pode ser suficiente para levá-los à condenação. Por vezes, a réplica monótona confunde os jurados, levando-os a aderir à tese da defesa.\nIII) O conhecimento dos jurados, somado ao que lhes é exposto na réplica, pode confundi-los. Esse emaranhado de detalhes poderá levá-los à tese da defesa, porque o medo de condenar injustamente sempre assombra.\nIV) O conhecimento dos jurados pode ser suficiente para levá-los à condenação. Contudo, na réplica, o promotor precisa antecipar possíveis movimentos da defesa para que os jurados não caiam na sedução da tréplica.", "gab": "B", "gabLabel": "Apenas I e IV", "html": "I: promotor deve preparar os jurados para não absolver. IV: deve antecipar movimentos da defesa para blindar contra a tréplica. II e III incorretas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q3-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q3", "tema": "Marca do texto argumentativo", "enun": "Com relação à marca que caracteriza todo texto argumentativo:\n\na. O texto argumentativo sempre possui uma marca essencial, que é a da conquista de adesão, salvo os jurídicos.\nb. O texto argumentativo não possui uma marca essencial, salvo os jurídicos, cuja marca é a conquista de adesão.\nc. A conquista da adesão do interlocutor é imprescindível para o texto argumentativo jurídico, assim como é para todos os gêneros discursivos.\nd. A conquista da adesão do interlocutor é irrelevante para o texto argumentativo jurídico.\ne. A conquista da adesão do interlocutor não é imprescindível para o texto argumentativo jurídico, assim como é para todos os gêneros discursivos.", "gab": "C", "gabLabel": "", "html": "A conquista de adesão é imprescindível para o texto argumentativo jurídico e para todos os gêneros discursivos. As demais excluem o jurídico ou afirmam irrelevância.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q4-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q4", "tema": "Verossimilhança e credibilidade", "enun": "Quanto às informações verossímeis, à legitimidade e à transparência para garantia da credibilidade:\n\nI) A legitimidade é geradora de credibilidade. Uma informação de fonte duvidosa é capaz de conquistar credibilidade e adesão.\nII) A quantidade de informação merece bem pouca atenção para que a palestra não corra o risco de ser muito informativa.\nIII) Referências a situações fantasiosas não chegam a gerar falta de credibilidade; interlocutores ainda compreenderão mesmo com exemplos forjados.\nIV) Em enunciação formal, como palestra, é preciso garantir harmonia entre sujeito e interlocutores. Deve-se avaliar mecanismos de manutenção da urbanidade.", "gab": "D", "gabLabel": "Apenas IV", "html": "Somente IV é verdadeira. Fontes duvidosas e fatos forjados minam a credibilidade (I e III falsas). A dosagem deve ser cuidadosamente gerida (II falsa). Urbanidade garante ambiente propício ao discurso (IV verdadeira).", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q5-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q5", "tema": "Formações imaginárias e seleção de argumentos", "enun": "Considere as assertivas a seguir:\n\nI) A partir das formações imaginárias, os interlocutores são definidos pelo sujeito enunciador no próprio ato da elaboração do texto escrito ou oral.\nII) As formações imaginárias permitem ao sujeito selecionar argumentos e contra-argumentos que podem levar os interlocutores a aderirem às propostas, porque os interlocutores são previamente determinados no imaginário do sujeito.\nIII) As formações imaginárias propiciam ao sujeito selecionar argumentos capazes de conquistar adesão.\nIV) As formações imaginárias não favorecem o percurso argumentativo do sujeito na busca de adesão às propostas que defende.", "gab": "A", "gabLabel": "Apenas I e II", "html": "I e II definem como os interlocutores são projetados no ato de elaboração (I) e como essa determinação prévia orienta a seleção de argumentos e contra-argumentos (II). III é formulação parcial; IV nega o favorecimento.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q6-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q6", "tema": "Interação sujeito × interlocutor", "enun": "Assinale a alternativa que der a melhor explicação da interação entre sujeito e interlocutor na elaboração do texto.\n\nI) No momento da elaboração, o sujeito não precisa interagir com o interlocutor para antecipar possíveis contra-argumentos, pois poderá fazê-lo durante a introdução.\nII) A interação somente se realiza quando o sujeito demonstra ter real conhecimento do interlocutor; apenas o imaginário não é suficiente.\nIII) No planejamento, o sujeito interage com o interlocutor a partir das formações imaginárias e escolhe mecanismos para esclarecer aspectos de difícil compreensão.\nIV) No planejamento, o sujeito interage pelo imaginário e encontra mecanismos para refutar possíveis contra-argumentos, podendo escolher mecanismos quanto ao uso de vocabulário específico.", "gab": "E", "gabLabel": "Apenas III e IV", "html": "Formações imaginárias orientam o planejamento discursivo para antecipar contra-argumentos e calibrar vocabulário. I e II falsas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q7-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q7", "tema": "Atos de convencer/persuadir/dissuadir", "enun": "Com relação aos atos de convencer, persuadir e dissuadir, assinale a alternativa que apresente coerência com os aspectos teóricos:\n\nI) Os três atos não se caracterizam por atuarem na direção dos valores constitutivos das formações imaginárias dos interlocutores endereçados.\nII) Caracterizam-se por atuarem, tão somente, na direção dos valores constitutivos apenas das formações imaginárias do sujeito enunciador.\nIII) Caracterizam-se por atuar, tão somente, na direção dos valores constitutivos apenas da memória dos interlocutores endereçados.\nIV) Caracterizam-se por atuarem na direção dos valores constitutivos das formações imaginárias e da memória apenas do sujeito enunciador.\n\na. Apenas I e II são coerentes.\nb. Apenas II e III são coerentes.\nc. Apenas I, II e III são coerentes.\nd. Apenas II é coerente.\ne. Todas as assertivas são incoerentes com a teoria.", "gab": "E", "gabLabel": "Todas são incoerentes", "html": "Todas usam restrições incorretas (\"não\", \"tão somente\", \"apenas\"). Os três atos atuam sobre formações ideológicas, imaginárias e discursivas de <i>ambos</i> os sujeitos. Nenhuma está correta.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q8-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q8", "tema": "Processo de elaboração e os três atos", "enun": "Considere as assertivas e assinale a alternativa com apenas as corretas:\n\nI) Quando da elaboração do texto, o sujeito já começa a trabalhar os ajustes para conquistar seu interlocutor e obter adesão. Este processo se estende ao longo de todo percurso, incluindo o fechamento.\nII) O ato de convencer não demanda qualquer esforço por parte do sujeito porque o interlocutor ainda não se posicionou a favor de uma proposta.\nIII) O ato de persuadir precisa trabalhar para fazer o interlocutor desistir da posição assumida anteriormente para aderir à tese do sujeito, o que muito lhe exige em função de conflitos ideológicos.\nIV) O ato de dissuadir revela-se o mais complexo porque, ao desistir do posicionamento anterior, o interlocutor põe em cheque seus valores ideológicos e conflita com suas formações imaginárias.", "gab": "B", "gabLabel": "Apenas I, III e IV", "html": "II é falsa: convencer exige notável esforço argumentativo calcado na razão. I, III e IV descrevem corretamente a natureza contínua do ajuste e a complexidade da persuasão e dissuasão.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q9-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q9", "tema": "Valor do \"outro\" como pessoa", "enun": "Com relação aos valores, assinale a alternativa correta.\n\nI) Na hierarquia a ser constituída no percurso argumentativo, é prioritário o valor da pessoa; o valor do \"outro\" enquanto \"pessoa\" deve ser relevado sempre.\nII) Não se pode prescindir do \"outro\" na construção do percurso argumentativo, pois ele vai ocupar um lugar primordial em qualquer escala.\nIII) Nada pior para o ser humano que se perceber inexistente para aquele que a ele se dirige. Tende a reagir com a mesma indiferença.\nIV) Quando o interlocutor não se sente valorizado pelo sujeito enunciador, reage contrariamente aos interesses do próprio sujeito enunciador.", "gab": "D", "gabLabel": "Todas são corretas", "html": "O respeito irrestrito ao \"outro\" como pessoa humana é pilar do ethos. Desconsiderar a audiência resulta em atrito discursivo e rejeição imediata das teses.", "repete": false, "repeteRef": "", "coment": []}, {"id": "Q10-II", "bloco": "UNIDADE II — QUESTIONÁRIO", "num": "Q10", "tema": "Hierarquia de valores", "enun": "Com relação aos valores, assinale a alternativa correta.\n\nI) Não é possível se definir uma hierarquia perfeita e ideal válida para todos os tempos e todos os lugares.\nII) Os valores universais, que não devem ser priorizados, são os que atendem às necessidades da pessoa humana.\nIII) Os valores universais, que devem ser priorizados, não são os que atendem às necessidades da pessoa humana.\nIV) É possível se definir uma hierarquia perfeita e ideal, válida para todos os tempos e todos os lugares.", "gab": "A", "gabLabel": "Apenas I", "html": "Hierarquia de valores é mutável, dependente do tempo, cultura e contexto. Não existe tábua estática válida universalmente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT1-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT1", "tema": "Dificuldade na hierarquia de valores", "enun": "Com relação à dificuldade na hierarquia dos valores, assinale a alternativa correta:\n\na. Não há dificuldades para o estabelecimento da hierarquia de valores, em função da objetividade que eles apresentam.\nb. Uma das dificuldades encontradas para o estabelecimento da hierarquia de valores consiste na questão da sua objetividade ou subjetividade.\nc. Caso os valores sejam objetivos, é correto dizer que a sua hierarquia seria estabelecida de acordo com cada ser humano.\nd. Caso os valores sejam subjetivos, é correto dizer que a sua hierarquia deriva deles e não está atrelada à cultura.\ne. Os valores podem ser classificados como objetivos, apesar de o sujeito atravessá-los com a sua história, quando os elenca.", "gab": "B", "gabLabel": "", "html": "O grande entrave para a hierarquia estática de valores reside no embate entre suposta objetividade e inevitável subjetividade humana atravessada pela história e cultura de cada grupo social.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT2-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT2", "tema": "Heterogeneidade discursiva no Júri", "enun": "Assinale a alternativa correta quanto ao uso da heterogeneidade discursiva no gênero discursivo jurídico no Tribunal do Júri:\n\nI. A retórica pode ser trabalhada pela heterogeneidade discursiva, possibilitando maiores mecanismos para a estrutura argumentativa, na medida em que convida outras vozes que se completam ou contradizem em um mesmo espaço discursivo.\nII. É pelo recurso da heterogeneidade discursiva que o sujeito concretiza a sua ilusão de origem, ao inscrever o outro em seu fio discursivo, reafirmando-se enquanto senhor do discurso.\nIII. A heterogeneidade discursiva mostrada (forma marcada) ou constitutiva (forma não marcada) pode ser entendida como resultado de um acordo imaginário entre o sujeito e seu leitor virtual, a partir das formações imaginárias.\nIV. Ao apresentar-se ao seu interlocutor virtual, o sujeito reafirma não só a ilusão de origem, como também a sua onipotência. Demonstra ser conhecedor das normas éticas (princípio de autoria), o que lhe permite proceder a apagamentos que o fazem crer que é a origem do seu discurso.\nV. O sujeito se entende no direito de confirmar ou refutar o dizer do outro. Acredita que se submete ao princípio de autoria, porque defende que o outro possa ter dito o que ele não repete, mas também diz.", "gab": "E", "gabLabel": "Todas são corretas", "html": "Todas as assertivas traçam síntese teórica completa da polifonia e heterogeneidade discursiva no Tribunal do Júri. O enunciado jurídico integra outras vozes de forma marcada e constitutiva, sob a ilusão de autoria e controle da enunciação.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT3-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT3", "tema": "Estratégias argumentativas", "enun": "No tocante às estratégias argumentativas, assinale a alternativa correta:\n\na. Argumento de autoridade: recorre-se à citação de fonte confiável. Há que se identificar o autor do argumento, porque o valor do argumento dispensa a referência à autoridade que lhe confere legitimidade.\nb. Citação literal ou não literal: não exige a identificação do autor para enfatizar a legitimidade que empresta ao argumento.\nc. No texto escrito e oral, são exigidas as normas da ABNT: negrito/sublinhado (grifo nosso), reticências entre parênteses (...) para quebra de citação, (SIC) para erros ortográficos na citação.\nd. Argumento de exemplificação ou ilustração: fato (real ou fictício) eficaz para teses teóricas. Digressões necessárias são válidas se orientadas antes e concluídas depois. Digressões desnecessárias geram sérios problemas de compreensão.\ne. Argumento de causa e consequência: o enunciador pode recorrer a motivos (causas) e efeitos (consequências) para conquistar adesão, desde que verifique o efeito de lógica instaurado.", "gab": "D", "gabLabel": "", "html": "Argumento de exemplificação concretiza teses teóricas através de fatos reais ou fictícios. Digressões necessárias e orientadas ajudam a clarear o texto. Alternativas a, b e c contêm erros teóricos ou aplicação indevida de normas escritas ao discurso oral.", "repete": false, "repeteRef": "", "coment": []}, {"id": "AT4-II", "bloco": "UNIDADE II — ATIVIDADE TELEAULA", "num": "AT4", "tema": "Lógica jurídica e dialética", "enun": "Assinale a alternativa que corresponde à lógica jurídica:\n\na. A lógica é um ramo da Filosofia que cuida das regras do pensamento racional para criar a verdade. A aprendizagem da lógica pode garantir que o pensamento chegue a conhecimentos verdadeiros.\nb. Os argumentos dividem-se em dedutivos (conclusão inferida de duas premissas) e indutivos (infere-se verdade a partir de dados genéricos, suficientemente numerados).\nc. A lógica formal não se dedica à estrutura do pensamento; a lógica material investiga a adequação do raciocínio à realidade.\nd. Robert Alexy pretendeu formular teoria da argumentação de forma analítica, desejando provar a incoerência lógica ao discurso jurídico para evitar que decisões cheguem a absurdos.\ne. O conceito característico da dialética é o diálogo, ou seja, a oposição de ideias e razões entre posições antagônicas. Siches defende o emprego da \"lógica do razoável\" — razão impregnada de pontos de vista estimativos, critérios de valorização, pautas axiológicas e ensinamentos da experiência.", "gab": "E", "gabLabel": "", "html": "A dialética é o diálogo entre posições antagônicas. Siches defende a \"lógica do razoável\" (razão impregnada de valorações axiológicas e experiência humana) — não a lógica formal como afirma incorretamente o enunciado da alternativa e.", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "O que é o \"leitor virtual\" no discurso jurídico?", "v": "Leitor imaginário inserido no próprio ato da escrita/fala; pode ser <b>cúmplice</b> (adere à tese) ou <b>adversário</b> (fonte de objeções a antecipar). Nunca tem identidade real — é construído pelas formações imaginárias."}, {"id": "c2", "f": "Qual é a relação triádica das formações imaginárias segundo Pêcheux (1969)?", "v": "<b>Eu — OUTRO — Referente.</b> O enunciador projeta imagens de si, do interlocutor e do objeto do discurso para orientar toda a estrutura argumentativa."}, {"id": "c3", "f": "O que é a tese primária e de que ela o enunciador jamais pode se afastar?", "v": "É a ideia central do discurso, o ponto de vista principal. O enunciador deve retomá-la constantemente em diversas formas para fixá-la na mente dos interlocutores."}, {"id": "c4", "f": "Qual é a função das teses secundárias?", "v": "Trazer <b>contra-argumentos</b> para o espaço discursivo do enunciador e ser <b>refutadas por ele mesmo</b>, fortalecendo a tese primária. Não questionam — reforçam ao ser demolidas."}, {"id": "c5", "f": "Antecipar contra-argumentos prejudica ou beneficia o enunciador?", "v": "<b>Beneficia sempre.</b> Mostra domínio do assunto, enfraquece o oponente (que fica \"esvaziado de argumentos\" e \"de mãos atadas\") e demonstra ao interlocutor que o enunciador conhece os dois lados."}, {"id": "c6", "f": "Qual a diferença entre convencer e persuadir segundo Perelman?", "v": "<b>Convencer</b> → audiência universal, apelo à razão, interlocutor que ainda não se posicionou. <b>Persuadir</b> → audiência particular/específica (leigos), apelo emocional, requer mudança de posicionamento já assumido."}, {"id": "c7", "f": "Dissuadir é mais fácil ou mais difícil que persuadir? Por quê?", "v": "<b>Mais difícil.</b> Exige que o interlocutor abandone uma posição já tomada, o que toca em seus valores pessoais, gerando conflito ideológico e resistência interna."}, {"id": "c8", "f": "Assertivas que dizem que convencer/persuadir/dissuadir atuam \"tão somente\" na direção de um dos sujeitos estão corretas?", "v": "<b>Sempre erradas.</b> Os três atos atuam sobre formações ideológicas, imaginárias e discursivas de <b>ambos</b> — enunciador e interlocutor."}, {"id": "c9", "f": "No texto argumentativo, em qual etapa os contra-argumentos são derrubados?", "v": "No <b>desenvolvimento</b> — etapa mais crucial. A conclusão apenas retoma a tese primária já respaldada; não é o local de derrubar contra-argumentos."}, {"id": "c10", "f": "É correto afirmar que \"na introdução não cabe conquista dos interlocutores\"?", "v": "<b>Falso.</b> A conquista começa já na introdução: o enunciador pode elogiar a responsabilidade e a importância dos interlocutores, preparando terreno para a adesão."}, {"id": "c11", "f": "O que o \"lugar da pessoa\" valoriza na argumentação?", "v": "A superioridade daquilo ligado às <b>pessoas</b> sobre as coisas. Slogan: \"Primeiro as pessoas, depois as coisas.\" Ex: prometem-se melhores condições ao professor, não apenas construção de escolas."}, {"id": "c12", "f": "O que é o \"lugar do existente\" e como se aplica?", "v": "Prefere-se o que <b>já existe</b> ao que ainda não existe. Ex: o emprego atual vale mais na argumentação do que o emprego prometido para o futuro."}, {"id": "c13", "f": "O que caracteriza um auditório, segundo a teoria dos lugares da argumentação?", "v": "Não são os valores que ele admite, mas <b>como os hierarquiza.</b> A hierarquia varia por cultura, ideologia e história pessoal."}, {"id": "c14", "f": "É possível definir uma hierarquia de valores perfeita e universal?", "v": "<b>Não.</b> A hierarquia é relativa ao tempo, cultura e subjetividade. Assertiva I do Q1 (ambas unidades): \"Não é possível definir hierarquia perfeita válida para todos os tempos e lugares\" → CORRETA."}, {"id": "c15", "f": "O enunciador deve se adaptar ao público ou o público ao enunciador?", "v": "O <b>enunciador</b> se adapta ao público (assertivas I e III corretas). Não usar termos técnicos para quem não é da área; atentar ao repertório da audiência. A assertiva II (\"o público se adapta a nós\") é sempre falsa."}, {"id": "c16", "f": "O que é heterogeneidade discursiva mostrada vs. constitutiva?", "v": "<b>Mostrada/marcada:</b> discurso do outro identificado (aspas, referência ao autor). <b>Constitutiva/não marcada:</b> discurso do outro incorporado sem demarcação, criando a \"ilusão de autoria\"."}, {"id": "c17", "f": "O que é a \"ilusão de origem\" no discurso jurídico?", "v": "A crença do enunciador de que é a origem de seu próprio discurso, mesmo quando incorpora vozes alheias não marcadas. O sujeito \"reafirma sua onipotência\" ao demarcar ou não o discurso do outro."}, {"id": "c18", "f": "Qual é o conceito de dialética segundo o material?", "v": "Diálogo — oposição de ideias e razões entre posições inicialmente antagônicas. Difere da lógica formal dedutiva pura."}, {"id": "c19", "f": "O que Siches (Recaséns Siches) defende sobre a lógica jurídica?", "v": "A \"lógica do razoável\" (logica de lo razonable): razão impregnada de <b>pontos de vista estimativos, valorações axiológicas</b> e ensinamentos da experiência humana própria e coletiva — oposta à lógica formal pura."}, {"id": "c20", "f": "Quais são as causas de inépcia da petição inicial (Art. 330 §1º CPC)?", "v": "(1) Falta pedido ou causa de pedir; (2) pedido indeterminado; (3) da narração dos fatos não decorre logicamente a conclusão (quebra do encadeamento lógico-discursivo); (4) pedidos incompatíveis entre si."}], "cobertura": ["As videoaulas 3 e 4 de cada unidade não foram lidas uma a uma. O resumo presume que repetem o que já está nos slides e livros.", "Os arquivos de questões trazem tema, gabarito e comentário. Enunciados e alternativas completas não vieram.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": []};</script><script>window.DADOS=window.DADOS||{};window.DADOS["803X"]={"cod": "803X", "revisao": [{"id": "r1", "titulo": "MEIOS DE SOLUÇÃO DE CONFLITOS", "prob": "alta", "html": "<p><strong>Autocomposição</strong> — as próprias partes resolvem:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Modalidade</th>\n<th>Definição</th>\n<th>Tem terceiro?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Desistência</strong></td>\n<td>Renúncia à <strong>pretensão</strong></td>\n<td>Não</td>\n</tr>\n<tr>\n<td><strong>Submissão</strong></td>\n<td>Renúncia à <strong>resistência</strong></td>\n<td>Não</td>\n</tr>\n<tr>\n<td><strong>Transação</strong></td>\n<td><strong>Concessões recíprocas</strong></td>\n<td>Não</td>\n</tr>\n<tr>\n<td>Negociação</td>\n<td>Comunicação direta</td>\n<td>Não</td>\n</tr>\n<tr>\n<td>Conciliação</td>\n<td>Terceiro pode <strong>sugerir</strong></td>\n<td>Sim (neutro)</td>\n</tr>\n<tr>\n<td>Mediação</td>\n<td>Terceiro <strong>não sugere</strong>; restaura diálogo</td>\n<td>Sim (neutro)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA clássica:</strong> \"Submissão = renúncia à pretensão\" → <strong>FALSO.</strong> Submissão = renúncia à <strong>resistência</strong>. Quem renuncia à pretensão é a desistência.</p>\n<p><strong>Heterocomposição</strong> — terceiro decide: <strong>arbitragem</strong> + <strong>jurisdição estatal</strong></p>"}, {"id": "r2", "titulo": "CONCILIAÇÃO × MEDIAÇÃO (art. 165 CPC)", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Conciliação</th>\n<th>Mediação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Vínculo anterior</td>\n<td><strong>Sem</strong> vínculo</td>\n<td><strong>Com</strong> vínculo</td>\n</tr>\n<tr>\n<td>Papel do terceiro</td>\n<td>Pode <strong>sugerir</strong> soluções</td>\n<td><strong>Não</strong> sugere; facilita comunicação</td>\n</tr>\n<tr>\n<td>Foco</td>\n<td>Aspecto objetivo do conflito</td>\n<td>Restabelecimento da comunicação</td>\n</tr>\n<tr>\n<td>Característica essencial</td>\n<td>Acordo</td>\n<td><strong>Comunicação</strong> (art. 165, §3º)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"Mediador sugere soluções\" → <strong>FALSO.</strong> Isso é papel do conciliador.</p>\n<p><strong>Mediação exige equilíbrio de poder</strong> entre as partes. Desequilíbrio pode violar direitos da parte mais fraca.</p>"}, {"id": "r3", "titulo": "ARBITRAGEM (Lei 9.307/96)", "prob": "alta", "html": "<ul>\n<li>Somente para direitos <strong>patrimoniais disponíveis</strong></li>\n<li>Sentença arbitral = título executivo <strong>judicial</strong> (art. 515, VII, CPC)</li>\n<li><strong>Cláusula compromissória</strong> (art. 4º): prévia, para litígios <strong>futuros</strong> (abstrata)</li>\n<li><strong>Compromisso arbitral</strong> (art. 9º): submete litígio <strong>já existente</strong> (pode ser judicial ou extrajudicial)</li>\n<li>Arbitragem <strong>não</strong> é delegação de jurisdição — fonte é a autonomia das partes</li>\n<li>MASCs <strong>não</strong> têm por finalidade \"garantir legitimidade dos ritos judiciais\" — finalidade real: desafogar Judiciário, pacificação social, acesso à justiça</li>\n</ul>\n<p><strong>Autotutela:</strong> crime — art. 345 CP (exercício arbitrário das próprias razões)</p>\n<ul>\n<li>Exceções: legítima defesa da posse (art. 1.210, §1º CC); legítima defesa/estado de necessidade (art. 23 CP)</li>\n</ul>"}, {"id": "r4", "titulo": "COMPETÊNCIA LEGISLATIVA (art. 22 × art. 24 CF)", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Art. 22, I CF</th>\n<th>Art. 24, XI CF</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tipo</td>\n<td><strong>Privativa</strong> da União</td>\n<td><strong>Concorrente</strong> União/Estados/DF</td>\n</tr>\n<tr>\n<td>Objeto</td>\n<td>Direito <strong>processual</strong></td>\n<td><strong>Procedimentos</strong> em matéria processual</td>\n</tr>\n<tr>\n<td>Se lei federal inexistir</td>\n<td>—</td>\n<td>Estado exerce competência <strong>plena</strong> (art. 24, §3º)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"Lei municipal é fonte do direito processual\" → <strong>FALSO.</strong> Fontes formais: CF + leis federais.</p>\n<p><strong>MP NÃO pode versar sobre:</strong> direito penal + processual penal + processual civil (art. 62, §1º, I, \"b\", CF)\n<strong>MP PODE</strong> tratar de direito econômico (se não reservado à lei complementar).</p>"}, {"id": "r5", "titulo": "FONTES E INTERPRETAÇÃO (art. 4º LINDB)", "prob": "media", "html": "<p><strong>Hierarquia de integração:</strong> lei → analogia → costumes → princípios gerais de direito\n<em>(equidade não integra o rol literal do art. 4º LINDB)</em></p>\n<p><strong>Características da lei</strong> (cobrado em questão):\ngeneralidade | imperatividade | autorizamento | permanência | emanada por autoridade competente\n→ <strong>\"relatividade\" NÃO é característica</strong> da lei.</p>\n<p><strong>Analogia:</strong> <em>legis</em> = aplica norma específica similar; <em>juris</em> = aplica o sistema jurídico geral\n(<em>ubi eadem ratio, ibi eadem dispositio</em> = onde há mesma razão, aplica-se mesmo preceito)</p>\n<p><strong>Costume:</strong> subjetivo (<em>opinio iuris</em> = crença de obrigatoriedade) + objetivo (<em>diuturnitas</em> = constância do ato)</p>\n<p><strong>Métodos de interpretação</strong> — sem hierarquia entre eles:\ngramatical | lógica | sistemática | histórica | sociológica/teleológica (art. 5º LINDB + art. 8º CPC)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Quem interpreta</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Autêntica</strong></td>\n<td>Legislador</td>\n</tr>\n<tr>\n<td><strong>Doutrinária</strong></td>\n<td>Doutrinadores</td>\n</tr>\n<tr>\n<td><strong>Jurisprudencial</strong></td>\n<td>Juízes/Tribunais</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"Interpretação jurisprudencial = interpretação autêntica\" → <strong>FALSO.</strong> São feitas por pessoas <strong>diferentes</strong>.</p>\n<p><strong>Vacatio legis (art. 1º LINDB):</strong> 45 dias após <strong>publicação</strong> (não promulgação); 3 meses no exterior</p>\n<p><strong>Eficácia temporal — três teorias</strong> (cobrada em questão):</p>\n<ol>\n<li>Unidade processual — lei nova não se aplica ao processo em curso</li>\n<li>Fases processuais — lei nova aplica a fases não iniciadas</li>\n<li><strong>Isolamento dos atos processuais</strong> (art. 14 CPC) — <strong>adotada pelo CPC</strong> — lei nova aplica-se imediatamente, <strong>respeitados os atos já praticados</strong></li>\n</ol>\n<p><strong>Limites constitucionais (art. 5º, XXXVI CF) — tríplice garantia:</strong>\ndireito adquirido + ato jurídico perfeito + coisa julgada\n<strong>PEGADINHA:</strong> alternativas que omitem <strong>um</strong> dos três elementos → sempre erradas.</p>"}, {"id": "r6", "titulo": "PRINCÍPIOS CONSTITUCIONAIS DO PROCESSO", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Princípio</th>\n<th>Base legal</th>\n<th>Essência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tutela constitucional</td>\n<td>Art. 1º CPC</td>\n<td>Processo subordinado à CF</td>\n</tr>\n<tr>\n<td><strong>Inafastabilidade</strong></td>\n<td>Art. 5º, XXXV CF + art. 3º CPC</td>\n<td>Lei não pode excluir lesão/ameaça do Judiciário</td>\n</tr>\n<tr>\n<td>Juiz natural</td>\n<td>Art. 5º, LIII e XXXVII CF</td>\n<td>Juiz pré-constituído; proíbe tribunal de exceção</td>\n</tr>\n<tr>\n<td><strong>Devido processo legal</strong></td>\n<td>Art. 5º, LIV CF</td>\n<td><strong>Super princípio; gênero dos demais</strong></td>\n</tr>\n<tr>\n<td>Contraditório e ampla defesa</td>\n<td>Art. 5º, LV CF + arts. 7º, 9º, 10 CPC</td>\n<td>Vedação de decisão surpresa (art. 10)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Devido processo legal = super princípio</strong> (gênero do qual os demais são espécies)</p>\n<p><strong>Inafastabilidade tem exceção:</strong> exaurimento da instância desportiva (art. 217, §1º CF)</p>\n<p><strong>Garantias do juiz natural:</strong> vitaliciedade | inamovibilidade | irredutibilidade de vencimentos</p>\n<p><strong>Distinção regra × princípio:</strong> regra = tudo ou nada; princípio = ponderação, máxima aplicação possível. Conflito de princípios → ponderação (um <strong>cede</strong>, não é invalidado).</p>"}, {"id": "r7", "titulo": "PRINCÍPIOS DO PROCEDIMENTO", "prob": "media", "html": "<ul>\n<li><strong>Oralidade:</strong> prevalência da comunicação oral; não exige atos orais — é faculdade; aplica-se à conciliação/mediação (art. 166 CPC)</li>\n<li><strong>Economia processual:</strong> máximo resultado com mínimo de atos; <strong>≠ celeridade</strong> (é equilíbrio entre velocidade e eficiência)</li>\n<li><strong>Eventualidade/preclusão (art. 507-508 CPC):</strong> atos praticados no momento oportuno, de uma vez; deduzido e dedutível</li>\n</ul>"}, {"id": "r8", "titulo": "JURISDIÇÃO", "prob": "alta", "html": "<p><strong>Características:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Característica</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Substitutiva</strong></td>\n<td>Estado substitui as partes — imparcialidade</td>\n</tr>\n<tr>\n<td><strong>Definitiva</strong></td>\n<td>Coisa julgada; outros poderes não revisam</td>\n</tr>\n<tr>\n<td><strong>Natureza declaratória</strong></td>\n<td>Reconhece direitos preexistentes, não cria</td>\n</tr>\n<tr>\n<td><strong>Imperativa</strong></td>\n<td>Multa (art. 77, §2º CPC); crime desobediência (art. 330 CP)</td>\n</tr>\n<tr>\n<td><strong>Indelegabilidade</strong></td>\n<td>Juiz não delega</td>\n</tr>\n<tr>\n<td><strong>Inércia</strong></td>\n<td><em>ne procedat judex ex officio</em> (art. 2º CPC)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Jurisdição é UNA</strong> — distribuída por critérios, não dividida.\n<strong>Jurisdição voluntária</strong> = administração de interesses privados, sem lide.</p>"}, {"id": "r9", "titulo": "TEORIAS DA AÇÃO", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Teoria</th>\n<th>Autor</th>\n<th>Essência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Civilista</td>\n<td>Roma</td>\n<td>Ação = direito material; sem direito, sem ação</td>\n</tr>\n<tr>\n<td>Concreta (Wach)</td>\n<td>Wach</td>\n<td>Ação só existe se sentença favorável</td>\n</tr>\n<tr>\n<td>Potestativa</td>\n<td>Chiovenda</td>\n<td>Direito contra o adversário</td>\n</tr>\n<tr>\n<td>Abstrata</td>\n<td>Degenkolb</td>\n<td>Independe do direito material</td>\n</tr>\n<tr>\n<td><strong>Eclética</strong></td>\n<td>Liebman</td>\n<td>Autônoma + abstrata + condicionada às condições da ação</td>\n</tr>\n<tr>\n<td><strong>Asserção</strong></td>\n<td>CPC/2015</td>\n<td>Condições analisadas <strong>pelas afirmações da inicial</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>CPC/2015 abandonou a teoria eclética</strong> → adota <strong>teoria da asserção</strong></p>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"Legitimidade e interesse de agir são condições da ação\" → No CPC atual são <strong>pressupostos processuais</strong>. Possibilidade jurídica do pedido = questão de <strong>mérito</strong>.</p>"}, {"id": "r10", "titulo": "PRESSUPOSTOS PROCESSUAIS", "prob": "media", "html": "<p><strong>Classificação dos pressupostos processuais:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Categoria</th>\n<th>Subclasse</th>\n<th>Exemplos</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Subjetivos</strong></td>\n<td>Do juiz</td>\n<td>Investidura, competência, imparcialidade</td>\n</tr>\n<tr>\n<td><strong>Subjetivos</strong></td>\n<td>Das partes</td>\n<td>Capacidade de ser parte, capacidade processual, capacidade postulatória</td>\n</tr>\n<tr>\n<td><strong>Objetivos intrínsecos</strong></td>\n<td>Validade dos atos</td>\n<td>Petição inicial apta, citação válida</td>\n</tr>\n<tr>\n<td><strong>Objetivos intrínsecos</strong></td>\n<td>Legitimidade das partes</td>\n<td>Ad causam (ordinária × extraordinária)</td>\n</tr>\n<tr>\n<td><strong>Objetivos intrínsecos</strong></td>\n<td>Interesse de agir</td>\n<td>Necessidade + adequação + utilidade</td>\n</tr>\n<tr>\n<td><strong>Objetivos extrínsecos</strong></td>\n<td>Negativos</td>\n<td>Inexistência de litispendência, coisa julgada, perempção, convenção de arbitragem</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Legitimidade ordinária × extraordinária:</strong></p>\n<ul>\n<li><strong>Ordinária:</strong> parte defende interesse próprio em nome próprio (regra geral)</li>\n<li><strong>Extraordinária (substituição processual):</strong> parte defende interesse alheio em nome próprio — exige autorização legal (ex.: MP na ação civil pública)</li>\n</ul>\n<p><strong>Interesse de agir</strong> = trinômio: necessidade (sem o processo não há tutela) + adequação (via correta) + utilidade (resultado prático possível)</p>\n<p><strong>Possibilidade jurídica do pedido</strong> = no CPC/2015 não é mais condição da ação; passa a ser questão de <strong>mérito</strong> (ou preliminar de mérito — improcedência liminar).</p>"}, {"id": "r11", "titulo": "COMPETÊNCIA ABSOLUTA × RELATIVA", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Absoluta</th>\n<th>Relativa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Interesse</td>\n<td>Público</td>\n<td>Privado</td>\n</tr>\n<tr>\n<td>Arguição</td>\n<td>Qualquer tempo, <strong>de ofício</strong></td>\n<td><strong>Contestação</strong> (preliminar), sob pena de prorrogação</td>\n</tr>\n<tr>\n<td>Prorroga?</td>\n<td><strong>Não</strong></td>\n<td><strong>Sim</strong> (se não arguida)</td>\n</tr>\n<tr>\n<td>Foro de eleição</td>\n<td>Não admite</td>\n<td>Admite</td>\n</tr>\n<tr>\n<td>Hipóteses</td>\n<td>Matéria, pessoa, funcional, art. 47 §1º</td>\n<td>Valor da causa, território (regra geral)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Regras de foro:</strong></p>\n<ul>\n<li>Direito pessoal/real sobre <strong>móveis</strong>: domicílio do <strong>réu</strong> (art. 46)</li>\n<li>Direito real sobre <strong>imóveis</strong>: situação da coisa (art. 47) — possessória imobiliária = <strong>absoluta</strong> (art. 47, §2º)</li>\n<li><strong>Herança</strong>: domicílio do autor da herança (art. 48)</li>\n<li><strong>Juizados Estaduais:</strong> até 40 SM — competência <strong>relativa</strong> (opção do demandante)</li>\n<li><strong>Juizados Federais:</strong> competência <strong>absoluta</strong> (art. 3º, §3º, Lei 10.259/01)</li>\n</ul>\n<p><strong>Perpetuação da competência (art. 43 CPC):</strong> fixada no registro/distribuição da inicial\n— exceções: supressão do órgão; alteração de competência <strong>absoluta</strong></p>"}, {"id": "r12", "titulo": "PEGADINHAS — LISTA CONSOLIDADA", "prob": "media", "html": "<ol>\n<li>\"Submissão = renúncia à pretensão\" → <strong>FALSO</strong> (submissão = resistência; pretensão = desistência)</li>\n<li>\"Mediador pode sugerir soluções\" → <strong>FALSO</strong> (só o conciliador pode sugerir)</li>\n<li>\"Autotutela é mecanismo legalmente reconhecido\" → <strong>FALSO</strong> (é crime, art. 345 CP)</li>\n<li>\"Arbitragem é delegação de jurisdição\" → <strong>FALSO</strong> (fonte é autonomia das partes)</li>\n<li>\"Lei municipal é fonte do direito processual\" → <strong>FALSO</strong> (competência privativa da União, art. 22, I CF)</li>\n<li>\"Procedimentos = competência privativa da União\" → <strong>FALSO</strong> (procedimentos = competência concorrente, art. 24, XI)</li>\n<li>\"MP pode dispor sobre direito processual civil\" → <strong>FALSO</strong> (art. 62, §1º, I, \"b\")</li>\n<li>\"Relatividade é característica da lei\" → <strong>FALSO</strong></li>\n<li>\"Inter
