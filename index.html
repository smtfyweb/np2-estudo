diência não será realizada se qualquer das partes, ainda que isoladamente, de maneira expressa ou tácita, manifestar seu desinteresse na composição consensual.\nB) As partes devem estar acompanhadas por seus advogados ou defensores públicos, podendo constituir representantes, por meio de procuração específica, com poderes para negociar e transigir.\nC) A intimação do autor para essa audiência será realizada pessoalmente, por via postal, ou, se incabível, por mandado a ser cumprido pelo Oficial de Justiça.\nD) Se houver desinteresse na autocomposição, o autor deverá apontá-la na petição inicial, cabendo ao réu fazê-lo por ocasião de sua contestação, necessariamente.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 334, § 9º e § 10, do CPC/15, as partes devem estar acompanhadas por seus advogados ou defensores públicos, sendo-lhes facultado constituir representante por meio de procuração específica, com poderes para negociar e transigir..","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q4","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.4","tema":"","enun":"Sobre a audiência de conciliação e mediação e a contestação:\n\nA) O réu poderá oferecer contestação, por petição, no prazo de 30 (trinta) dias.\nB) O ônus da impugnação especificada dos fatos se aplica ao defensor público, ao advogado dativo e ao curador especial.\nC) A intimação do autor para a audiência de conciliação e mediação será feita na pessoa de seu advogado.\nD) A audiência de conciliação ou de mediação não pode realizar-se por meio eletrônico, nos termos da lei.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 334, § 3º, do CPC/15, a intimação do autor para a audiência de conciliação e mediação será feita na pessoa de seu advogado..","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q5","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.5","tema":"","enun":"Na contestação, incumbe ao réu, antes de discutir o mérito (em preliminar), alegar:\n\nA) a inexistência ou nulidade da citação.\nB) a litispendência, mas não pode alegar, em preliminar, a coisa julgada.\nC) somente a nulidade da citação, mas não pode alegar a inexistência da citação.\nD) a coisa julgada, mas não pode alegar, a inépcia da inicial.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 337, I, do CPC/15, incumbe ao réu, antes de discutir o mérito, alegar preliminarmente na contestação a inexistência ou a nulidade da citação..","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q6","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.6","tema":"","enun":"São matérias que o juiz pode conhecer de ofício e a qualquer tempo e grau de jurisdição, enquanto não ocorrer o trânsito em julgado:\n\nA) Legitimidade das partes\nB) Perempção\nC) Interesse de agir\nD) incompetência absoluta e relativa\nE) todas estão corretas.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- As matérias de ordem pública processual constantes do art. 337 (como legitimidade, interesse de agir, perempção e incompetência absoluta) devem ser conhecidas de ofício pelo juiz em qualquer tempo e grau de jurisdição, enquanto não ocorrer o trânsito em julgado (art. 337, § 5º c/c art.","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q7","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.7","tema":"","enun":"Aponte a afirmativa correta:\n\nI – o réu pode alegar na contestação ser parte ilegítima, indicando a parte que deve integrar o polo passivo da demanda, e sobre tal pedido pode o autor se manifestar e autorizar a substituição;  \nII – com a citação válida do réu forma-se a relação jurídica processual;  \nIII – a citação por hora certa exige para a devida validade que o oficial de justiça tenha procurado o réu, por no mínimo duas vezes, sem o encontrar, além da suspeita de que o réu está se ocultando.\n\nA) todos os itens são falsos.\nB) todos os itens são verdadeiros.\nC) somente o item I é verdadeiro.\nD) somente o item II é verdadeiro.\nE) somente o item III é verdadeiro.","gab":"B","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q8","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.8","tema":"","enun":"Aponte a afirmativa correta:\n\nI – a desistência da ação principal ou mesmo a sua extinção acarreta também a extinção da reconvenção;  \nII – a reconvenção tem natureza jurídica de ação;  \nIII – a exceção de incompetência relativa não pode ser apresentada na contestação.\n\nA) todos os itens são falsos.\nB) todos os itens são verdadeiros.\nC) somente o item I é verdadeiro.\nD) somente o item II é verdadeiro.\nE) somente o item III é verdadeiro.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q9","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.9","tema":"","enun":"Aponte a afirmativa correta:\n\nI – a reconvenção não pode ser apresentada sem a contestação;  \nII – a contestação deve ser apresentada, no procedimento comum, no prazo de 10 dias úteis;\n\nA) todos os itens são falsos.\nB) todos os itens são verdadeiros.\nC) somente o item I é verdadeiro.\nD) somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q10","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.10","tema":"","enun":"As tutelas requeridas ao Poder Judiciário podem ter caráter definitivo ou provisório. No que diz respeito à tutela provisória de urgência, é correto afirmar que:\n\nA) a tutela antecipada e a de evidência são suas espécies.\nB) quando requerida em caráter incidental, exige o pagamento de custas.\nC) a sua efetivação observará as normas referentes ao cumprimento definitivo da sentença.\nD) pode ser concedida liminarmente ou após justificação prévia.\nE) quando antecedente, como regra, será requerida ao juiz do foro do domicílio do autor.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 300, § 2º, do CPC/15, a tutela de urgência pode ser concedida liminarmente ou após justificação prévia..","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q11","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.11","tema":"","enun":"Distribuída a ação, Antônia (autora) é intimada para a audiência de conciliação na pessoa de seu advogado. Explicado o objetivo desse ato pelo advogado, Antônia informa que se recusa a participar da audiência, porque não tem qualquer possibilidade de conciliação com Romero (réu).\n\nSobre a audiência de conciliação ou de mediação, com base no Código de Processo Civil, assinale a alternativa CORRETA:\n\nA) Romero deverá ser citado para apresentar defesa com, pelo menos, 15 (quinze) dias de antecedência.\nB) A audiência não será realizada, uma vez que Antônia manifestou expressamente seu desinteresse pela conciliação.\nC) Ainda que ambas as partes manifestem desinteresse na conciliação, quando a matéria não admitir autocomposição, a audiência de conciliação ocorrerá normalmente.\nD) O não comparecimento injustificado de Antonia é considerado ato atentatório à dignidade da justiça, sob pena de multa.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p>- A audiência de conciliação só deixa de ser realizada se AMBAS as partes manifestarem expressamente desinteresse na autocomposição (art. 334, § 4º, I). A ausência injustificada de qualquer das partes é considerada ato atentatório à dignidade da justiça e sancionada com multa de até 2% sobre o valor da causa (art.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q12","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.12","tema":"","enun":"Maria ajuizou ação em face da José, sem mencionar, na inicial, se pretendia ou não realizar audiência de conciliação ou mediação. Assim, O juiz designou a referida audiência, dando ciência às partes. O réu informou ter interesse na realização de tal audiência, enquanto Maria, devidamente intimada, quedou-se silente. Chegado o dia da audiência de conciliação, apenas José, o réu, compareceu.\n\nA respeito do caso narrado, assinale a opção que apresenta possível consequência ser suportada por Maria:\n\nA) não existem consequências previstas na legislação pela ausência da autora à audiência de conciliação ou mediação.\nB) caso não compareça, nem apresente justificativa pela ausência, Maria será multada em até 2% da vantagem econômica pretendida ou do valor da causa.\nC) diante da ausência da autora à audiência de conciliação ou mediação, o processo deverá ser extinto.\nD) diante da ausência da autora à audiência de conciliação ou mediação, as alegações apresentadas pelo réu na contestação serão consideradas verdadeiras.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p>- Conforme o art. 334, § 8º, do CPC/15, o não comparecimento injustificado do autor ou do réu à audiência de conciliação é considerado ato atentatório à dignidade da justiça e será punido com multa de até dois por cento da vantagem econômica pretendida ou do valor da causa, revertida em favor da União ou do Estado..</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q13","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.13","tema":"","enun":"São modalidades de tutela: \n\nI - da urgência;  \nII - da evidência;  \nIII - antecedente;  \nIV - incidental.  \n\nDe acordo com o Código de Processo Civil, a estabilização da tutela provisória se aplica às tutelas previstas nos itens:\n\nA) I, II e III, apenas.\nB) I, II, III e IV.\nC) II e IV, apenas.\nD) I e III, apenas.\nE) II, III e IV, apenas.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 304 do CPC/15, o instituto da estabilização da tutela provisória aplica-se exclusivamente à tutela antecipada requerida em caráter antecedente (modalidade de urgência antecedente)..","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q14","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.14","tema":"","enun":"O arquiteto Fernando ajuizou ação exclusivamente em face de Daniela, sua cliente, buscando a cobrança de valores que não teriam sido pagos no âmbito de um contrato de reforma de apartamento.\n\nDaniela, devidamente citada, deixou de oferecer contestação, mas, em litisconsórcio com seu marido José, apresentou reconvenção em peça autônoma, buscando indenização por danos morais em face de Fernando e sua empresa, sob o argumento de que estes, após a conclusão das obras de reforma, expuseram, em site próprio, fotos do interior do imóvel dos reconvintes sem que tivessem autorização para tanto.\n\nDiante dessa situação hipotética, assinale a afirmativa correta.\n\nA) Como Daniela deixou de contestar a ação, ela e seu marido não poderiam ter apresentado reconvenção, devendo ter ajuizado ação autônoma para buscar a indenização pretendida.\nB) A reconvenção deverá ser processada, a despeito de Daniela não ter contestado a ação originária, na medida em que o réu pode propor reconvenção independentemente de oferecer contestação.\nC) A reconvenção não poderá ser processada, na medida em que não é lícito a Daniela propor reconvenção em litisconsórcio com seu marido, que é um terceiro que não faz parte da ação originária.\nD) A reconvenção não poderá ser processada, na medida em que não é lícito a Daniela incluir no polo passivo da reconvenção a empresa de Fernando, que é um terceiro que não faz parte da ação originária.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p>- Nos termos do art. 343, § 6º, do CPC/15, o réu pode propor reconvenção independentemente de oferecer contestação. Ademais, o § 3º permite a reconvenção proposta em litisconsórcio com terceiro (o marido) e o § 4º autoriza a inclusão de terceiro no polo passivo da reconvenção (a empresa de Fernando)..</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q1","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.1","tema":"","enun":"A presunção de veracidade decorrente da revelia processual é:\n\nA) absoluta em matéria patrimonial e relativa quando se referir a direitos indisponíveis.\nB) absoluta e diz respeito à matéria de fato e de direito.\nC) relativa e diz respeito somente à matéria de direito.\nD) absoluta, mas diz respeito apenas à matéria de direito.\nE) relativa e diz respeito somente à matéria fática.","gab":"E","gabLabel":"","html":"<p>- Nos termos do art. 344 do CPC/15, se o réu não contestar a ação, será considerado revel e presumir-se-ão verdadeiras as alegações de fato formuladas pelo autor.</p><p>Trata-se de presunção relativa (<i>iuris tantum</i>), que recai exclusivamente sobre a matéria fática, cabendo ao magistrado o enquadramento jurídico dos fatos..</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q2","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.2","tema":"","enun":"Sobre a revelia, é INCORRETO afirmar:\n\nA) Os prazos contra o revel que não tenha patrono nos autos fluirão da data de publicação do ato decisório no órgão oficial.\nB) O revel poderá intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar.\nC) Ao réu revel é lícita a produção de provas contrapostas às alegações do autor, desde que se faça representar nos autos a tempo de praticar os atos processuais indispensáveis a essa produção.\nD) Não presumir-se-ão verdadeiras as alegações de fato formuladas pelo autor se o litígio versar sobre direitos disponíveis.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A alternativa D é a incorreta pretendida. Nos termos do art. 345, II, do CPC/15, a revelia NÃO produz o efeito de presunção de veracidade se o litígio versar sobre direitos <i>INDISPONÍVEIS</i>.","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q3","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.3","tema":"","enun":"Gabriel, pessoa capaz, foi revel em ação na qual Marcelo formulou pedido de condenação. Gabriel não possui patrono nos autos. Em razão da revelia:\n\nA) se Gabriel vier a intervir no processo, o Juiz deverá dar nova oportunidade para apresentação de contestação.\nB) o pedido de Marcelo será necessariamente acolhido, pois a revelia induz presunção absoluta de veracidade dos fatos afirmados na inicial.\nC) o Juiz deverá nomear curador especial para Gabriel, o qual poderá contestar por negativa geral, invertendo-se o ônus da prova.\nD) o Juiz determinará a intimação pessoal de Gabriel a fim de que compareça nos autos, sob pena de confesso.\nE) os prazos, em relação a Gabriel, correrão independentemente de intimação, a partir da publicação de cada ato decisório.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme preceitua o art. 346 do CPC/15, os prazos contra o revel que não tenha patrono nos autos fluirão da data de publicação do ato decisório no órgão oficial..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q4","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.4","tema":"","enun":"De acordo com a legislação processual civil, se o réu não contestar a ação, será considerado revel e presumir-se-ão verdadeiras as alegações de fato formulados pelo autor. Sobre o instituto da revelia, indique qual das assertivas abaixo apresenta informação verídica:\n\nA) Depois da decretação da revelia, ao réu revel não é permitida a produção de provas.\nB) Não ocorre o efeito material da revelia quando as alegações de fato formuladas pelo autor forem inverossímeis ou estiverem em contradição com prova constante dos autos.\nC) A não apresentação de resposta tem como necessária consequência a decretação da revelia e a procedência do pleito autoral.\nD) Decretada a revelia, o juiz deve julgar antecipadamente os pedidos, sendo desnecessária produção probatória.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 345, IV, do CPC/15, o efeito material da revelia (presunção de veracidade) não ocorre se as alegações de fato formuladas pelo autor forem inverossímeis ou estiverem em contradição com prova constante dos autos..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q5","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.5","tema":"","enun":"O Ministério Público, na qualidade de substituto processual, ajuizou uma ação de investigação de paternidade em face de Carlos, na defesa dos interesses do infante Daniel, que é incapaz. Carlos, regularmente citado, não compareceu à audiência de mediação que fora determinada e sequer apresentou contestação no prazo legal.\n\nNesse cenário, é correto afirmar que:\n\nA) Carlos se tornou revel e haverá presunção de veracidade da paternidade afirmada pelo Ministério Público.\nB) Carlos se tornou revel, mas não haverá presunção de veracidade, por se tratar de direito indisponível.\nC) Carlos não se tornou revel, por ser ação interposta pelo Ministério Público.\nD) não haverá revelia, e o Ministério Público terá o ônus de produzir prova da paternidade afirmada.\nE) o processo terá que ser extinto, pois o Ministério Público não tem legitimidade extraordinária para a causa.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A revelia decorre objetivamente da falta de contestação no prazo legal. No entanto, por se tratar de ação de investigação de paternidade (direito indisponível relativo ao estado da pessoa), aplica-se a ressalva do art. 345, II, do CPC/15, afastando-se o efeito material da presunção de veracidade..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q6","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.6","tema":"","enun":"Rodolfo ajuizou ação contra Felipe, versando o litígio sobre direito indisponível. Devidamente citado, o réu não ofereceu contestação no prazo legal, tornando-se revel. Nesse caso, a revelia:\n\nA) impõe que o pedido seja julgado procedente.\nB) torna precluso o direito de produzir provas.\nC) veda a interposição de recurso contra a sentença.\nD) impede o réu de intervir no processo, salvo na fase de cumprimento de sentença.\nE) não enseja a presunção da veracidade das alegações de fato formuladas pelo autor.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 345, II, do CPC/15, a revelia não produz o efeito de presunção de veracidade dos fatos se o litígio versar sobre direitos indisponíveis..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q7","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.7","tema":"","enun":"Em razão de problemas técnicos no sistema informatizado, a contestação apresentada pelo réu no processo eletrônico não foi juntada aos autos e, posteriormente, foi registrado o andamento de decurso do prazo para esse ato processual de defesa.\n\nAcerca das consequências decorrentes do referido problema técnico, é correto afirmar que, nessa situação hipotética:\n\nA) extingue-se o direito de praticar o ato processual de defesa e produzem-se os efeitos da revelia.\nB) não se extingue o direito de praticar o ato processual de defesa, mas se produzem os efeitos da revelia.\nC) caracteriza-se hipótese de justa causa, cabendo ao juiz permitir ao réu a prática do ato no prazo que lhe estipular.\nD) não está configurada hipótese de justa causa, mas não se converte o réu em revel.\nE) não se verifica hipótese de justa causa, mas se produzem os efeitos da revelia.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme disposto no parágrafo único do art. 197 do CPC/15, a indisponibilidade ou falha técnica do sistema eletrônico configura justa causa, devendo o magistrado permitir a prática do ato processual pela parte prejudicada no prazo estipulado..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q8","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.8","tema":"","enun":"Os prazos contra o revel que não tenha patrono nos autos fluirão da data:\n\nA) da juntada do edital nos autos.\nB) de publicação do ato decisório no órgão oficial.\nC) da expedição do edital.\nD) da intimação por hora certa.\nE) de disponibilização do ato decisório no órgão oficial.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Literalidade do art. 346, <i>caput</i>, do CPC/15: \"Os prazos contra o revel que não tenha patrono nos autos fluirão da data de publicação do ato decisório no órgão oficial.\".","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q9","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.9","tema":"","enun":"É correto afirmar sobre a revelia:\n\nA) Por se tratar de direito indisponível da parte, os efeitos da revelia somente poderão ser declarados quando houver requerimento formal da parte adversa.\nB) As alegações de fato formuladas pelo autor que estiverem em contradição com prova constante dos autos não se presumem verdadeiras.\nC) Ouvida a parte contrária, o revel que intervir nos autos terá restabelecido os prazos de defesa já expirados.\nD) O revel que não tenha patrono nos autos deverá ser intimado pessoalmente dos atos processuais praticados pelo juízo.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 345, IV, do CPC/15, a revelia não produz o efeito da presunção de veracidade se as alegações de fato formuladas pelo autor estiverem em contradição com prova constante dos autos..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q10","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.10","tema":"","enun":"A respeito dos efeitos da revelia, assinale a alternativa INCORRETA:\n\nA) contra o revel que não tenha patrono nos autos, correrão os prazos independentemente de intimação, a partir da publicação de cada ato decisório.\nB) o revel poderá intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar.\nC) reputar-se-ão verdadeiros os fatos afirmados pelo autor se o réu não contestar a ação, inclusive se a petição inicial não estiver acompanhada de instrumento que a lei considere indispensável à prova do ato.\nD) ao réu revel será lícita a produção de provas, contrapostas às alegações do autor, desde que se faça representar nos autos a tempo de praticar os atos processuais indispensáveis a essa produção.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A alternativa C é incorreta porque o art. 345, III, do CPC/15 expressamente afasta o efeito da presunção de veracidade da revelia quando a petição inicial não estiver acompanhada de instrumento que a lei considere indispensável à prova do ato..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q11","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.11","tema":"","enun":"Acerca dos efeitos da revelia, assinale a alternativa INCORRETA.\n\nA) seus efeitos, em nenhuma hipótese, podem ser excluídos, dada sua gravidade.\nB) os efeitos da revelia não ocorrerão se os fatos alegados pelo autor versar sobre direitos indisponíveis.\nC) não ocorrerão os efeitos da revelia se, havendo pluralidade de réus, algum deles contestar a ação.\nD) O revel poderá intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A alternativa A é incorreta porque o art. 345 do CPC/15 enumera hipóteses taxativas nas quais os efeitos materiais da revelia são devidamente excluídos..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q12","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.12","tema":"","enun":"A inércia do réu frente à realização de sua citação, acerca de um determinada ação que lhe foi proposta, gera o surgimento do designado fenômeno da revelia. No que tange à revelia, temos que:\n\nA) na sua ocorrência presumir-se-ão verdadeiras as alegações de fato e de direito formuladas pelo autor.\nB) o revel poderá intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar.\nC) gera efeitos, havendo pluralidade de réus, ainda que algum deles conteste a ação.\nD) gera efeitos, se o litígio versar sobre direito indisponíveis.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme dispõe o parágrafo único do art. 346 do CPC/15, o revel poderá intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar..","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q13","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.13","tema":"","enun":"Com base no Código de Processo Civil, se o réu não contestar a ação, será considerado revel e presumir-se-ão verdadeiras as alegações de fato formuladas pelo autor. Entretanto, a revelia não produzirá o efeito mencionado quando:\n\nI – havendo pluralidade de réus, algum deles contestar a ação.  \nII – o litígio versar sobre direitos disponíveis.  \nIII – a petição inicial não estiver acompanhada de instrumento que a lei considere indispensável à prova do ato.  \nIV – as alegações de fato formuladas pelo autor estiverem em consonância com prova constante dos autos.  \n\nA alternativa que contempla todas as afirmações CORRETAS é a seguinte:\n\nA) II e III.\nB) III e IV.\nC) I e III.\nD) I, II, III e IV.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q14","bloco":"MÓDULO 3 — REVELIA E RECONHECIMENTO DA PROCEDÊNCIA DO PEDIDO","num":"Ex.14","tema":"","enun":"Se o réu revel sofrer os efeitos da revelia (presunção de veracidade dos fatos narrados na inicial) e não houver requerimento de prova, o juiz:\n\nA) julgará antecipadamente o pedido, proferindo sentença com resolução de mérito;\nB) julgará antecipadamente o pedido, proferindo sentença sem resolução de mérito;\nC) designará audiência de conciliação e mediação;\nD) de ofício determinará a produção de prova;\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 355, II, do CPC/15, o juiz julgará antecipadamente o pedido, proferindo sentença com resolução de mérito, quando ocorrer o efeito da revelia previsto no art. 344 e não houver requerimento de prova..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q1","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.1","tema":"","enun":"Em relação ao procedimento comum tratado no Código de Processo Civil, analise as assertivas a seguir:\n\nI. O juiz julgará antecipadamente o pedido, proferindo sentença com resolução de mérito, quando não houver necessidade de produção de outras provas.  \nII. Na fase de saneamento e organização do processo, se a causa apresentar complexidade em matéria de fato ou de direito, deverá o juiz designar audiência para que o saneamento seja feito em cooperação com as partes, oportunidade em que o juiz, se for o caso, convidará as partes a esclarecer suas alegações.  \nIII. O negócio jurídico processual homologado vincula as partes e o juiz.  \n\nQuais estão corretas?\n\nA) Apenas II.\nB) Apenas III.\nC) Apenas I e II.\nD) Apenas II e III.\nE) I, II e III.","gab":"E","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q2","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.2","tema":"","enun":"Considerando o caso narrado (aditamento do pedido após a citação e apresentação de contestação pelo réu), assinale a afirmativa correta.\n\nA) É possível o aditamento, uma vez que, até o saneamento do processo, é permitido alterar ou aditar o pedido sem o consentimento do réu.\nB) Não é possível o aditamento, uma vez que o réu foi citado e apresentou contestação.\nC) É possível o aditamento, eis que, até o saneamento do processo, é permitido aditar ou alterar o pedido, desde que com o consentimento do réu.\nD) É possível o aditamento, porquanto, até a prolação da sentença, é permitido alterar ou aditar o pedido, desde que não haja recusa do réu.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 329, II, do CPC/15, até o saneamento do processo é permitido aditar ou alterar o pedido e a causa de pedir, desde que haja o consentimento do réu, assegurado o contraditório..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q3","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.3","tema":"","enun":"Uma vez proposta uma demanda, relativamente à sua modificação, o Código de Processo Civil estabelece que o autor poderá:\n\nA) até a citação, somente aditar o pedido, mediante o consentimento do réu.\nB) até a citação, aditar ou alterar a causa de pedir, mediante o consentimento do réu.\nC) até o saneamento do processo, aditar ou alterar o pedido e a causa de pedir, com consentimento do réu, assegurado o contraditório.\nD) após o saneamento do processo, aditar ou alterar o pedido e a causa de pedir, com consentimento judicial.\nE) até o saneamento do processo, aditar ou alterar a causa de pedir, sem o consentimento do réu.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 329, II, do CPC/15, a alteração ou o aditamento do pedido ou da causa de pedir após a citação e até o saneamento do processo exige o consentimento do réu..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q4","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.4","tema":"","enun":"O saneamento do processo é proferido pelo magistrado, porém, as partes podem colaborar, pedindo esclarecimentos ou ajustes:\n\nA) no prazo de cinco dias, primeiro para o autor e em seguida para o réu.\nB) no prazo comum de cinco dias, findo o qual a decisão se torna estável.\nC) até o começo da instrução.\nD) caso tenha sido determinada perícia, até o oferecimento de quesitos.\nE) até a audiência de saneamento feito em cooperação com as partes.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 357, § 1º, do CPC/15, realizado o saneamento, as partes têm o direito de pedir esclarecimentos ou solicitar ajustes no prazo comum de 5 (cinco) dias, findo o qual a decisão se torna estável..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q5","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.5","tema":"","enun":"No despacho saneador o juiz poderá realizar os seguintes atos, EXCETO:\n\nA) Definir a distribuição do ônus probatório.\nB) Designar audiência de instrução.\nC) Resolver questões processuais pendentes.\nD) Delimitar as questões de direito controversas.\nE) Avaliar o mérito, mesmo nos casos complexos, isso nas hipóteses em que entender viável com vistas ao princípio da celeridade processual.","gab":"E","gabLabel":"","html":"<p>- A decisão de saneamento (art. 357 do CPC/15) tem por escopo organizar o processo e preparar a instrução probatória. O juiz não pode julgar antecipadamente o mérito em causas complexas que exijam a produção de provas sob a justificativa de celeridade, sob pena de violar o devido processo legal e o contraditório..</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q6","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.6","tema":"","enun":"O juiz julgará antecipadamente o pedido, proferindo sentença com resolução de mérito, quando:\n\nA) não houver necessidade de produção de outras provas.\nB) não for requerido o depoimento pessoal de qualquer das partes.\nC) as testemunhas arroladas pelas partes não comparecerem na audiência.\nD) o perito judicial se recusar a prestar esclarecimento em audiência.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 355, I, do CPC/15, o juiz julgará antecipadamente o pedido, proferindo sentença com resolução de mérito, quando não houver necessidade de produção de outras provas..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q7","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.7","tema":"","enun":"Um advogado, com estudos apurados em torno das regras do CPC, resolve entrar em contato com o patrono da parte adversa de um processo em que atua. Sua intenção é tentar um saneamento compartilhado do processo.\n\nDiante disso, acerca das situações que autorizam a prática de negócios jurídicos processuais, assinale a afirmativa correta:\n\nA) As partes poderão apresentar ao juiz a delimitação consensual das questões de fato e de direito da demanda litigiosa.\nB) As partes não poderão, na fase de saneamento, definir a inversão consensual do ônus probatório, uma vez que a regra sobre produção de provas é matéria de ordem pública.\nC) As partes poderão abrir mão do princípio do contraditório consensualmente de forma integral, em prol do princípio da duração razoável do processo.\nD) As partes poderão afastar a audiência de instrução e julgamento, mesmo se houver provas orais a serem produzidas no feito e que sejam essenciais à solução da controvérsia.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 357, § 2º, do CPC/15, é lícito às partes celebrar negócio jurídico processual para apresentar ao juiz a delimitação consensual das questões de fato e de direito sobre as quais recairá a atividade probatória..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q8","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.8","tema":"","enun":"Sobre o julgamento antecipado parcial do mérito, à luz do Código de Processo Civil:\n\nA) a decisão que julgar parcialmente o mérito poderá reconhecer a existência de obrigação líquida, vedado o reconhecimento da obrigação ilíquida.\nB) a liquidação e o cumprimento da decisão que julgar parcialmente o mérito poderão ser processados em autos suplementares, somente a requerimento da parte.\nC) a decisão que julgar parcialmente o mérito é impugnável através de recurso de apelação.\nD) A parte poderá liquidar ou executar, desde logo, a obrigação reconhecida na decisão que julgar parcialmente o mérito, independentemente de caução, ainda que haja recurso contra esse interposto.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 356, § 2º, do CPC/15, a parte poderá liquidar ou executar desde logo a obrigação reconhecida na decisão que julgar parcialmente o mérito, independentemente de caução, ainda que haja recurso contra ela interposto..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q9","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.9","tema":"","enun":"Em razão da realização de obras públicas de infraestrutura em sua rua, que envolveram o manejo de retroescavadeiras e britadeiras, a residência de Daiana acabou sofrendo algumas avarias. Daiana ingressou com ação judicial em face do ente que promoveu as obras, a fim de que este realizasse os reparos necessários em sua residência. Citado o réu, este apresentou a contestação. Contudo, antes do saneamento do processo, diante do mal estar que vivenciou, Daiana consultou seu advogado a respeito da possibilidade de, na mesma ação, adicionar pedido de condenação em danos morais. Considerando o caso narrado, assinale a afirmativa correta.\n\nA) É possível o aditamento, uma vez que, até o saneamento do processo, é permitido alterar ou aditar o pedido sem o consentimento do réu.\nB) Não é possível o aditamento, uma vez que o réu foi citado e apresentou contestação.\nC) É possível o aditamento, eis que, até o saneamento do processo, é permitido aditar ou alterar o pedido, desde que com o consentimento do réu.\nD) É possível o aditamento, porquanto, até a prolação da sentença, é permitido alterar ou aditar o pedido, desde que não haja recusa do réu.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme preceitua o art. 329, II, do CPC/15, a alteração ou o aditamento do pedido até a fase de saneamento do processo depende do consentimento expresso do réu regularmente citado..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q10","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.10","tema":"","enun":"Acerca da decisão de saneamento e de organização do processo, assinale a alternativa correta.\n\nA) O representante do Ministério Público deverá apresentar o próprio parecer, sob pena de preclusão consumativa.\nB) Nos casos em que for determinada a produção de prova testemunhal, o juiz fixará prazo de 20 dias para que as partes apresentem rol de testemunha.\nC) O juiz deverá designar dia e hora para a realização da audiência de instrução e julgamento.\nD) O juiz deverá delimitar as questões de fato sobre as quais recairá a atividade probatória, especificando os meios de prova admitidos.\nE) Não cabe pedido de esclarecimentos da decisão que sanear o processo.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 357, II, do CPC/15, incumbe ao juiz, em decisão de saneamento e organização do processo, delimitar as questões de fato sobre as quais recairá a atividade probatória, especificando os meios de prova admitidos..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q11","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.11","tema":"","enun":"Assinale a alternativa INCORRETA sobre saneamento e organização do processo:\n\nA) Caso tenha sido determinada a produção de prova testemunhal, o juiz fixará prazo comum não superior a 15 (quinze) dias para que as partes apresentem rol de testemunhas.\nB) O número de testemunhas arroladas não pode ser superior a 10 (dez), sendo 3 (três), no máximo, para a prova de cada fato. O juiz poderá limitar o número de testemunhas levando em conta a complexidade da causa e dos fatos individualmente considerados.\nC) Não ocorrendo a extinção do processo, o julgamento antecipado do mérito e o julgamento antecipado parcial do mérito, deverá o juiz, em decisão de saneamento e de organização do processo, delimitar as questões de direito sobre as quais recairá a atividade probatória, especificando os meios de prova admitidos.\nD) Se a causa apresentar complexidade em matéria de fato ou de direito, deverá o juiz designar audiência para que o saneamento seja feito em cooperação com as partes, oportunidade em que o juiz, se for o caso, convidará as partes a integrar ou esclarecer suas alegações.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A alternativa C é a incorreta pois confunde os conceitos do art. 357 do CPC/15: a atividade probatória recai sobre as questões de <i>FATO</i> (inciso II), enquanto as questões de <i>DIREITO</i> são delimitadas por serem relevantes para a decisão do mérito (inciso IV)..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q12","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.12","tema":"","enun":"Em relação ao julgamento antecipado parcial do mérito, é CORRETO afirmar que:\n\nA) a decisão judicial que julga parcialmente o mérito é impugnada por meio de apelação.\nB) se houver trânsito em julgado da decisão que tenha julgado parcialmente o mérito, a execução será provisória, tornando-se definitiva somente com o julgamento integral da causa.\nC) a decisão que julgar parcialmente o mérito poderá reconhecer a existência de obrigação líquida, vedado o reconhecimento da obrigação ilíquida.\nD) a parte poderá executar desde logo a obrigação reconhecida na decisão que julgar parcialmente o mérito, devendo, em regra, prestar caução no caso de recurso contra essa decisão pendente de julgamento.\nE) a liquidação e o cumprimento da decisão que julgar parcialmente o mérito poderão ser processados em autos suplementares, a requerimento da parte ou a critério do juiz.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Literalidade do art. 356, § 3º, do CPC/15: \"A liquidação e o cumprimento da decisão que julgar parcialmente o mérito poderão ser processados em autos suplementares, a requerimento da parte ou a critério do juiz.\".","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q13","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.13","tema":"","enun":"Não ocorrendo nenhuma das hipóteses de extinção do processo, julgamento antecipado do mérito ou julgamento antecipado parcial do mérito, deverá o juiz, em decisão de saneamento e de organização do processo:\n\nA) delimitar as questões de direito relevantes para a decisão do mérito.\nB) resolver as questões de direito material pendentes, se houver.\nC) delimitar as questões de direito sobre as quais recairá a atividade probatória, especificando os meios de prova admitidos.\nD) definir a distribuição do ônus da prova, sendo tal ônus do autor quanto à existência de fato impeditivo, modificativo ou extintivo, e do réu quanto ao fato constitutivo do seu direito.\nE) designar, obrigatoriamente a audiência de instrução e julgamento.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 357, IV, do CPC/15, não ocorrendo extinção ou julgamento antecipado, o juiz delimitará as questões de direito relevantes para a decisão do mérito..","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q14","bloco":"MÓDULO 4 — FASE DE SANEAMENTO DO PROCESSO","num":"Ex.14","tema":"","enun":"O juiz determinará a oitiva do autor no prazo de 15 (quinze) dias, permitindo-lhe a produção de prova, se o réu alegar:\n\nI – inexistência ou nulidade de citação  \nII – coisa não julgada  \nIII – indevida concessão do benefício de gratuidade de justiça  \n\nEstão corretas apenas:\n\nA) I e II\nB) II\nC) III\nD) I e III\nE) todas estão corretas","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 351 do CPC/15, se o réu alegar qualquer das matérias preliminares enumeradas no art. 337 do CPC/15, o juiz determinará a oitiva do autor no prazo de 15 (quinze) dias (réplica), permitindo-lhe a produção de prova..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q1","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.1","tema":"","enun":"De acordo com o Código de Processo Civil, é correto afirmar:\n\nA) A parte, que alegar direito municipal, estadual, federal, estrangeiro ou consuetudinário, provar-lhe-á o teor e a vigência, independentemente de determinação judicial.\nB) A parte, que alegar direito municipal, estadual, federal, estrangeiro ou consuetudinário, provar-lhe-á o teor e a vigência, se assim o determinar o juiz.\nC) O ônus da prova incumbe ao réu, quanto à existência de fato impeditivo, modificativo ou extintivo do seu direito.\nD) O ônus da prova incumbe ao autor, quanto ao fato constitutivo do seu direito.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q2","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.2","tema":"","enun":"O Código de Processo Civil estabelece que, em regra, compete ao autor o ônus da prova quanto aos fatos constitutivos do seu direito, e ao réu, por outro lado, quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor. Entretanto, o ônus da prova poderá ser distribuído de modo diverso por:\n\nA) convenção das partes, desde que celebrada posteriormente ao ajuizamento da ação.\nB) convenção das partes, desde que celebrada anteriormente ao ajuizamento da ação.\nC) convenção das partes, celebrada antes ou durante o processo.\nD) decisão do juiz, mas não por convenção das partes.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 373, § 3º, do CPC/15, a distribuição diversa do ônus da prova também pode ocorrer por convenção das partes, celebrada antes ou durante o processo..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q3","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.3","tema":"","enun":"As partes têm o direito de empregar todos os meios legais, bem como os moralmente legítimos, ainda que não especificados no diploma processual, para provar a verdade dos fatos em que se funda o pedido ou a defesa e influir de maneira eficaz na convicção do juiz. A respeito das provas e seu regime jurídico no Código de Processo Civil, assinale a alternativa correta:\n\nA) A distribuição diversa do ônus da prova pode ocorrer por convenção das partes desde que celebrada antes do início do processo.\nB) A parte que alegar direito municipal provar-lhe-á no mesmo ato o teor e a vigência, sob pena de não conhecimento da alegação.\nC) As partes têm o direito de empregar todos os meios legais, bem como os moralmente legítimos, ainda que não especificados no CPC, para provar a verdade dos fatos em que se funda o pedido ou a defesa e influir eficazmente na convicção do juiz.\nD) Os fatos notórios dependem de provas.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme preceitua o art. 369 do CPC/15, são admitidos no processo civil todos os meios de prova legais, bem como os moralmente legítimos, ainda que atípicos..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q4","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.4","tema":"","enun":"Sobre a distribuição diversa do ônus da prova que pode ocorrer por convenção das partes, assinale a alternativa correta:\n\nA) A convenção não poderá ser celebrada antes do processo.\nB) Não poderá ocorrer quando tornar excessivamente difícil a uma parte o exercício do direito.\nC) Poderá ocorrer inclusive quando recair sobre direito indisponível da parte.\nD) A convenção somente poderá ser celebrada durante o processo.\nE) Não poderá ocorrer quando recair sobre direito disponível da parte.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 373, § 3º, II, do CPC/15, a convenção das partes sobre a distribuição do ônus da prova é nula quando tornar excessivamente difícil a uma das partes o exercício do direito (vedação da prova diabólica)..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q5","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.5","tema":"","enun":"Sobre a fase probatória no processo civil, assinale a alternativa correta:\n\nA) O juiz indeferirá, em decisão fundamentada, as diligências inúteis ou meramente protelatórias.\nB) O ônus da prova quanto à existência de fato impeditivo, modificativo ou extintivo do direito incumbe como regra, ao autor.\nC) O juiz somente apreciará a prova constante dos autos, que tenha sido promovida por autor e réu, e não precisa indicar na decisão as razões da formação de seu convencimento.\nD) Dependem de provas os fatos afirmados por uma parte e confessados pela parte contrária.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 370, parágrafo único, do CPC/15, o juiz indeferirá, em decisão fundamentada, as diligências inúteis ou meramente protelatórias..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q6","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.6","tema":"","enun":"Considere a seguinte situação hipotética:  \nTratam os autos de ação anulatória ajuizada por Maria da Silva em face do Município de Contagem, com o objetivo de reconhecer a nulidade da pena de demissão que lhe foi aplicada em processo administrativo disciplinar. Na fase instrutória, a autora requereu a juntada de prova extraída de outro processo, consistente em depoimento prestado por testemunha.  \n\nNesse caso, caberá ao juiz competente:\n\nA) admitir a utilização da prova emprestada na condição de depoimento, atribuindo-lhe idêntico valor a ela outorgado no processo originário e, se assim entender pertinente, não abrir vista em seguida para o Município.\nB) recusar a utilização da prova emprestada, independentemente da oitiva do Município, restando demonstrado que não existe identidade de partes em ambos os processos.\nC) admitir a utilização do depoimento na condição de indício, independentemente da oitiva do Município, pois, nesse caso, há presunção iuris tantum de que a prova trasladada de outro processo possui valor inferior ao outorgado a ela no processo originário.\nD) admitir, se assim entender pertinente, a utilização da prova emprestada na condição de documento, atribuindo-lhe o valor que considerar adequado, após manifestação do Município.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p>- Conforme preceitua o art. 372 do CPC/15, o juiz poderá admitir a utilização de prova produzida em outro processo (prova emprestada, ingressando sob a forma documental), atribuindo-lhe o valor que considerar adequado, desde que observado o contraditório mediante a prévia manifestação da parte contrária..</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q7","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.7","tema":"","enun":"Em relação à prova, considere:\n\nI. O juiz poderá admitir a utilização de prova produzida em outro processo, atribuindo-lhe o valor que considerar adequado, observado o contraditório; a isso denomina-se prova emprestada.  \nII. Caberá ao juiz, de ofício ou a requerimento da parte, determinar as provas necessárias ao julgamento do mérito, indeferindo, em decisão fundamentada, as diligências inúteis ou meramente protelatórias.  \nIII. São meios de prova: a ata notarial, o depoimento pessoal, a confissão, a exibição de documento ou coisa, a prova documental, a prova testemunhal, a prova pericial e a inspeção judicial.  \n\nEstá correto o que se afirma APENAS:\n\nA) I e II\nB) I e III\nC) I\nD) I, II e III\nE) III","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q8","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.8","tema":"","enun":"Quanto às provas, a legislação competente sobre a matéria estabelece:\n\nA) Se não forem notórios, dependem de prova os fatos afirmados por uma parte e confessados pela parte contrária.\nB) As únicas provas que se admitem nos processos judiciais são as previstas expressamente em lei.\nC) Não pode ser admitida a prova produzida em outro processo por ferir o contraditório e a ampla defesa.\nD) O ônus da prova é sempre o estabelecido na lei processual, não se podendo convencioná-lo de outro modo por acordo das partes.\nE) Caberá ao juiz, de ofício ou a requerimento da parte, determinar as provas necessárias ao julgamento do mérito, indeferindo em decisão fundamentada as diligências inúteis ou meramente protelatórias.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Transcrição exata do art. 370, <i>caput</i> e parágrafo único, do CPC/15, consagrando o princípio inquisitivo no âmbito probatório..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q9","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.9","tema":"","enun":"Acerca das provas no processo civil, assinale a afirmativa correta:\n\nA) O ônus da prova incumbe ao réu quanto aos fatos constitutivos do direito.\nB) Não dependem de prova os fatos notórios, mas precisam ser provados os afirmados por uma parte e confessados pela parte contrária.\nC) Não cabe a prova de direito, mas apenas das alegações fáticas.\nD) O juiz poderá admitir a utilização de prova produzida em outro processo, atribuindo-lhe o valor que considerar adequado, observado o contraditório.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 372 do CPC/15, é perfeitamente admitida a prova emprestada no processo civil, desde que respeitado o contraditório..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q10","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.10","tema":"","enun":"Não dependem de prova os fatos:\n\nA) que se demonstrarem com a juntada de documentos.\nB) que sejam admitidos no processo como incontroversos.\nC) que tornarem excessivamente difícil a uma parte o exercício do direito.\nD) sobre os quais haja prévio conhecimento.\nE) que recaírem sobre direito indisponível da parte.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 374, III, do CPC/15, não dependem de prova os fatos admitidos no processo como incontroversos..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q11","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.11","tema":"","enun":"Quanto à teoria geral da prova, assinale a alternativa correta:\n\nA) As partes têm o direito de empregar todos os meios legais, bem como os moralmente legítimos, ainda que não especificados no Código de Processo Civil, para provar a verdade dos fatos.\nB) O juiz não poderá admitir a utilização de prova produzida em outro processo, sob pena de ofensa ao princípio do contraditório.\nC) A alegação de direito municipal, estadual, estrangeiro ou consuetudinário independe de prova, tendo em vista o princípio de que o juiz conhece o direito.\nD) O juiz não poderá determinar, de ofício, as provas necessárias ao julgamento do mérito, em atenção ao princípio da inércia da jurisdição.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Literalidade do art. 369 do CPC/15, garantindo a atipicidade dos meios de prova no direito processual civil brasileiro..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q12","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.12","tema":"","enun":"Com relação ao direito probatório, assinale a alternativa correta:\n\nA) A parte que requereu a produção de determinada prova poderá requerer sua desconsideração ou desentranhamento, caso lhe seja desfavorável.\nB) O juiz só poderá admitir a utilização de prova produzida em outro processo em caso de convenção processual.\nC) A parte que alegar direito municipal, estadual, estrangeiro ou consuetudinário provar-lhe-á o teor e a vigência independentemente de determinação judicial.\nD) Incumbe ao terceiro, em relação a qualquer causa, exibir coisa ou documento que esteja em seu poder.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 380, II, do CPC/15, incumbe ao terceiro, em relação a qualquer causa, exibir coisa ou documento que esteja em seu poder..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q13","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.13","tema":"","enun":"Assinale a alternativa INCORRETA:\n\nA) A legislação processual civil adota a possibilidade de aplicação da teoria da distribuição dinâmica do ônus da prova.\nB) O juiz não pode aplicar as regras de experiência comum subministradas pela observação do que ordinariamente acontece.\nC) As partes podem convencionar a distribuição diversa do ônus da prova, desde que não envolva direito indisponível e não torne excessivamente difícil o exercício do direito por uma delas.\nD) Não dependem de provas os fatos admitidos no processo como incontroversos.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A alternativa B é incorreta porque o art. 375 do CPC/15 prevê expressamente que o juiz aplicará as regras de experiência comum subministradas pela observação do que ordinariamente acontece..","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q14","bloco":"MÓDULO 5 — DAS PROVAS","num":"Ex.14","tema":"","enun":"O ônus da prova, que constitui uma faculdade posta à disposição das partes para alcançar o resultado desejado no processo, sustenta-se nos seguintes princípios:\n\nI. Indeclinabilidade da jurisdição  \nII. Princípio dispositivo  \nIII. Persuasão racional na apreciação da prova  \n\nEstão corretas apenas:\n\nA) I\nB) II\nC) II e III\nD) III\nE) todas estão corretas","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A teoria do ônus da prova fundamenta-se na indeclinabilidade da prestação jurisdicional (o juiz deve julgar), no princípio dispositivo (ônus de alegação e provocação das partes) e na persuasão racional (valoração motivada do acervo probatório)..","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q1","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.1","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A ordem das provas na audiência de instrução e julgamento é a seguinte: depoimento pessoal das partes, esclarecimentos dos peritos e/ou assistente técnicos, oitiva de testemunhas e alegações finais.  \nII – Admite-se a substituição das alegações finais orais pela apresentação de memoriais.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q2","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.2","tema":"","enun":"Aponte a afirmativa correta:\n\nI – O réu poderá assistir livremente o depoimento pessoal do autor.  \nII – Não se admite que o autor ouça o depoimento pessoal do autor.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"B","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q3","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.3","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Pode o juiz preliminarmente formular as perguntas às partes e também às testemunhas.  \nII – Após o depoimento pessoal, inicia-se o depoimento das testemunhas arroladas pelo réu.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q4","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.4","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Após o depoimento pessoal, inicia-se o depoimento das testemunhas arroladas pelo autor.  \nII – O réu não poderá assistir livremente o depoimento pessoal do autor.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"B","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q5","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.5","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Atualmente admite-se que as perguntas sejam formuladas diretamente às testemunhas.  \nII – A audiência de instrução e julgamento em regra é contínua, podendo ser excepcional e justificadamente cindida.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q6","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.6","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Não se admite que as perguntas sejam formuladas diretamente às testemunhas.  \nII – A ordem das provas na audiência de instrução é a seguinte: esclarecimentos dos peritos e/ou assistentes técnicos, depoimento pessoal das partes (autor e réu), oitiva das testemunhas arroladas pelas partes (autor e réu).\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q7","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.7","tema":"","enun":"Serão ouvidos como prova em audiência na seguinte ordem:\n\nA) Perito e assistentes técnicos; depoimentos pessoais, primeiro do autor e depois do réu; testemunhas arroladas pelo autor e pelo réu.\nB) Depoimentos pessoais, primeiro do autor e depois do réu; testemunhas arroladas pelo autor e pelo réu; perito e assistentes técnicos.\nC) Perito e assistentes técnicos; testemunhas arroladas pelo autor e pelo réu; depoimentos pessoais, primeiro do autor e depois do réu.\nD) Depoimentos pessoais, primeiro do autor e depois do réu; perito e assistentes técnicos; testemunhas arroladas pelo autor e pelo réu.\nE) Testemunhas arroladas pelo autor e pelo réu; perito e assistentes técnicos; depoimentos pessoais, primeiro do autor e depois do réu.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Literalidade da ordem estabelecida no art. 361 do CPC/15..","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q8","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.8","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Toda prova oral será colhida na audiência de instrução e julgamento, sem qualquer tipo de exceção.  \nII – Nem toda prova oral será colhida na audiência de instrução e julgamento, havendo exceções a essa regra.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme preceitua o art. 453 do CPC/15, haverá oitiva fora da AIJ nas hipóteses de antecipação de prova, testemunha enferma/idosa ou inquirida por carta precatória/rogatória..","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q9","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.9","tema":"","enun":"Aponte a afirmativa correta:\n\nI – O magistrado, para manter a ordem na audiência, pode inclusive requisitar a presença de força policial.  \nII – Havendo a composição entre as partes, o processo será extinto sem resolução do mérito, nos termos do artigo 485 do CPC.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q10","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.10","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Não se admite a substituição das alegações finais orais pela apresentação de memoriais.  \nII – Havendo a composição entre as partes, o processo será extinto com resolução do mérito, nos termos do artigo 487 do CPC.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q11","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.11","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Toda audiência de instrução e julgamento será pública, ou seja, não há exceções a essa regra.  \nII – As audiências realizadas em processos que correm em segredo de justiça não são públicas.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 368 do CPC/15, a audiência será pública, ressalvadas as hipóteses de segredo de justiça (art. 189 do CPC/15)..","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q12","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.12","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A ordem das provas na audiência de instrução é a seguinte: conciliação, esclarecimentos dos peritos e/ou assistentes técnicos, depoimento pessoal das partes (autor e réu), oitiva das testemunhas arroladas pelas partes (autor e réu).  \nII – A ordem das provas na audiência de instrução é a seguinte: pregão inicial, conciliação, esclarecimentos dos peritos e/ou assistentes técnicos, depoimento pessoal das partes (autor e réu), oitiva das testemunhas arroladas pelas partes (autor e réu).\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"B","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q13","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.13","tema":"","enun":"A audiência de instrução e julgamento poderá ser adiada:\n\nA) Todas as vezes que qualquer uma das partes solicitar.\nB) Apenas quando houver requerimento da parte autora.\nC) Por convenção das partes.\nD) Quando o Ministério Público requerer a extinção do processo.\nE) A pedido de terceiro interessado que pretende ingressar no processo.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 362, I, do CPC/15, a audiência poderá ser adiada por convenção das partes..","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q14","bloco":"MÓDULO 6 — AUDIÊNCIA DE INSTRUÇÃO E JULGAMENTO","num":"Ex.14","tema":"","enun":"Sobre a audiência de instrução e julgamento, considere as assertivas:\n\nI. A audiência poderá ser integralmente gravada em imagem e em áudio, em meio digital ou analógico, desde que assegure o rápido acesso das partes e dos órgãos julgadores, observada a legislação específica.  \nII. A gravação da audiência pode ser realizada diretamente por qualquer das partes, independentemente de autorização judicial.  \nIII. A audiência é una e contínua, podendo ser excepcional e justificadamente cindida na ausência de perito ou de testemunha, desde que haja concordância das partes.  \n\nEstão corretas apenas:\n\nA) I e III\nB) I e II\nC) II e III\nD) I\nE) Todas estão corretas.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q1","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.1","tema":"","enun":"Maria comprou um apartamento da empresa Moradia S/A e constatou, logo após sua mudança, que havia algumas infiltrações e problemas nas instalações elétricas. Maria consultou seu advogado, que sugeriu o ajuizamento de ação de produção antecipada de prova, com o objetivo de realizar uma perícia no imóvel, inclusive com o objetivo de decidir se ajuizaria, posteriormente, ação para reparação dos prejuízos. Diante desse contexto, assinale a afirmativa correta:\n\nA) A produção antecipada de provas é cabível, porque visa a obter prévio conhecimento dos fatos e da situação do imóvel, para justificar ou evitar o ajuizamento de ação de reparação dos prejuízos.\nB) A produção antecipada de provas é obrigatória, uma vez que Maria não poderia ingressar diretamente com ação para reparação dos prejuízos.\nC) A produção antecipada de provas é incabível, porque apenas pode ser ajuizada quando há urgência ou risco de que a verificação dos fatos venha a se tornar impossível posteriormente, o que não foi demonstrado na hipótese concreta.\nD) A produção antecipada de provas é incabível, vez que o seu ajuizamento apenas pode ocorrer mediante pedido conjunto de Maria e da empresa Moradia S/A.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q2","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.2","tema":"","enun":"Segundo disposições do Código de Processo Civil sobre o direito probatório:\n\nA) As partes podem, independentemente da natureza do direito em disputa, antes ou durante o processo, convencionar a forma de distribuição do ônus da prova de forma diversa da estabelecida pela lei, desde que sejam capazes para a celebração do negócio jurídico processual.\nB) Há a possibilidade de produção antecipada da prova desde que haja fundado receio de que venha a tornar-se impossível ou muito difícil a verificação de certos fatos na pendência da ação.\nC) O juízo estadual não tem competência para produção antecipada de prova requerida em face da União, de entidade autárquica ou de empresa pública federal se, na localidade, não houver vara federal.\nD) Não será admitted a produção antecipada da prova nos casos em que a prova a ser produzida seja suscetível de viabilizar a autocomposição ou outro meio adequado de solução de conflito.\nE) n.d.a.","gab":"B","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q3","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.3","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Cabe à parte requerer o depoimento pessoal da outra, ou seja, o autor requer o depoimento do réu e vice-versa.  \nII – Aquele que compareça à audiência de instrução e julgamento para depoimento pessoal e se recusa injustificadamente a depor sofrerá a pena de confissão.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q4","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.4","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Admite-se a videoconferência para a colheita do depoimento pessoal das partes.  \nII – Aquele que compareça à audiência de instrução e julgamento para depoimento pessoal e emprega evasivas nas respostas sofrerá a pena de confissão.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q5","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.5","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A confissão é a declaração que uma parte faz da verdade dos fatos que, ao mesmo tempo, lhe são desfavoráveis e favoráveis ao adversário.  \nII – O fato objeto da confissão é aquele fato próprio, favorável ao adversário e desfavorável ao confitente.\n\nA) Todos são falsos.\nB) Todos são verdadeiros.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"B","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q6","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.6","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A confissão de uma parte poderá, dependendo das circunstâncias, prejudicar o interesse do outro litisconsorte.  \nII – Aquele que compareça à audiência de instrução e julgamento para depoimento pessoal e justificadamente se recusa a depor não sofrerá a pena de confissão.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q7","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.7","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Admite-se o requerimento para a exibição de documento ou coisa em poder de terceiro.  \nII – Exibição de documento requerida contra terceiro será instaurada como uma lide incidental.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q8","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.8","tema":"","enun":"Aponte a afirmativa correta:\n\nI – O documento público pode ser desconstituído por decisão judicial e não tem força probatória absoluta.  \nII – Não se admite o questionamento da força probatória do documento público, já que esta é absoluta.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q9","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.9","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Os documentos particulares são aqueles em que não existe a interferência de agente público.  \nII – A arguição de falsidade somente pode ser alegada na contestação ou na réplica.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q10","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.10","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Em regra, cabe ao autor produzir a prova documental na inicial e o réu na contestação.  \nII – A ata notarial trata-se de documento público lavrado por tabelião público, que goza de fé pública e que atesta a existência ou o modo de existir de algum fato.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q11","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.11","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Permite-se a juntada a qualquer tempo de documento, desde que seja novo, ou seja, que faça prova de fatos ocorridos depois dos articulados ou para contrapô-los aos que foram produzidos nos autos.  \nII – A falsidade material é em regra aquela a ser discutida no incidente de arguição de falsidade documental.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q12","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.12","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A confissão é, em regra, irrevogável e indivisível.  \nII – O interrogatório e o depoimento pessoal da parte são realizados do mesmo modo, ou seja, com base nas mesmas regras processuais e procedimentais.\n\nA) Todos são verdadeiros.\nB) Todos são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q13","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.13","tema":"","enun":"No que se refere à produção de provas, assinale a alternativa correta:\n\nA) A existência de determinado fato pode ser documentada mediante ata notarial lavrada pelo tabelião.\nB) Cabe à parte requerer o depoimento pessoal de seu opositor, não podendo o juiz determinar, de ofício, tal providência.\nC) A confissão judicial faz prova contra o confitente e contra os litisconsortes, se o teor da confissão os atingir.\nD) Quando necessária a exibição de documento ou coisa que estiver em poder de terceiro, o juiz mandará citá-lo para que responda no prazo de 5 (cinco) dias.\nE) A produção antecipada da prova será admitida nos casos em que, a prova a ser produzida não seja suscetível de viabilizar a autocomposição ou outro meio adequado de solution de conflito.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q14","bloco":"MÓDULO 7 — PROVA DOCUMENTAL. PRODUÇÃO ANTECIPADA DE PROVA. DEPOIMENTO PESSOAL. CONFISSÃO","num":"Ex.14","tema":"","enun":"Em relação à força probante dos documentos, assinale a alternativa correta:\n\nI – O documento público faz prova não só da sua formação, mas também dos fatos que o escrivão, o chefe de secretaria, o tabelião ou o servidor declarar que ocorreram em sua presença.  \nII – O documento feito por oficial público incompetente ou sem a observância das formalidades legais, sendo subscrito pelas partes, tem a mesma eficácia probatória do documento particular.  \nIII – As declarações constantes do documento particular escrito e assinado ou somente assinado presumem-se verdadeiras em relação ao signatário.\n\nA) Todas estão corretas.\nB) Apenas I e II.\nC) Apenas II e III.\nD) Apenas III.\nE) Apenas II.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q1","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.1","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A inspeção judicial pode ser deferida de ofício pelo magistrado.  \nII – O objetivo da inspeção é esclarecer o magistrado sobre fato que interessa à causa, ou seja, fato relevante ao julgamento do pedido.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q2","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.2","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A inspeção judicial não pode ser determinada após requerimento da parte.  \nII – O indício é uma etapa intermediária que serve para a formação da presunção.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verd
