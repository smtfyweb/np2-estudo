adeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q3","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.3","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A testemunha é um terceiro, alheio ao processo, e cuja função é a de esclarecer os fatos debatidos na demanda.  \nII – Admite-se incondicionalmente a produção da prova testemunhal, ou seja, não há restrições ao seu objeto.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q4","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.4","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Somente pode ser testemunha a pessoa física.  \nII – Admite-se que o juiz ouça as testemunhas menores, impedidas ou suspeitas, que deporão sem o compromisso de dizer a verdade.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q5","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.5","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A testemunha, ao comparecer em juízo, presta um serviço público.  \nII – Não se admite que a testemunha se escuse de depor sobre determinados fatos, já que presta o devido serviço público.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q6","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.6","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Em geral a testemunha presta o depoimento na sede do juízo, ressalvadas as exceções legais.  \nII – A testemunha pode ser intimada pelo próprio advogado da parte.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q7","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.7","tema":"","enun":"Aponte a afirmativa correta:\n\nI – A testemunha não pode ser intimada pelo próprio advogado da parte.  \nII – A parte pode se comprometer a levar a testemunha à audiência, independentemente de intimação.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q8","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.8","tema":"","enun":"Aponte a afirmativa correta:\n\nI – As testemunhas arroladas pelo autor serão ouvidas em primeiro lugar.  \nII – A testemunha, antes de depor, presta o compromisso de dizer a verdade, sob pena de ser processada pelo crime de falso testemunho.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q9","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.9","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Antes do depoimento da testemunha, esta poderá ser contraditada, oportunidade em que deverá ser demonstrado que a mesma não pode depor, por algum motivo disposto em lei.  \nII – Os advogados das partes podem, atualmente, formular as perguntas diretamente às testemunhas.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q10","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.10","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Os advogados das partes não podem, atualmente, formular as perguntas diretamente às testemunhas.  \nII – Admite-se a nomeação de mais de um perito, caso a perícia seja, por exemplo, complexa.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q11","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.11","tema":"","enun":"Aponte a afirmativa correta:\n\nI – O perito se sujeita às regras de impedimento e suspeição, o que não ocorre com os assistentes técnicos das partes.  \nII – As partes podem apresentar impugnação/questionamento ao laudo pericial, no prazo de 15 dias.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q12","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.12","tema":"","enun":"Aponte a afirmativa correta:\n\nI – Pode ser determinada a realização de segunda perícia que não substituirá a primeira.  \nII – O juiz deve informar às partes, o dia, hora e local em que será realizada a perícia.\n\nA) Todos os itens são verdadeiros.\nB) Todos os itens são falsos.\nC) Somente o item I é verdadeiro.\nD) Somente o item II é verdadeiro.\nE) n.d.a.","gab":"A","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q13","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.13","tema":"","enun":"As presunções são classificadas da seguinte forma:\n\n- Presunção relativa (“juris tantum”)  \n- Presunção absoluta (“jure et de jure”)  \n- Presunção legal  \n\nEstão corretas apenas:\n\nA) Todas estão corretas.\nB) I e II\nC) I e III\nD) II e III\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Classificação doutrinária e legal das presunções exposta expressamente nas linhas 84 a 90 do Módulo 8 do curso..","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q14","bloco":"MÓDULO 8 — PROVA TESTEMUNHAL. PROVA PERICIAL. INSPEÇÃO JUDICIAL","num":"Ex.14","tema":"","enun":"A respeito da produção da prova testemunhal, assinale a alternativa correta:\n\nI – Ao início da inquirição, a testemunha prestará o compromisso de dizer a verdade do que souber e lhe for perguntado.  \nII – O juiz advertirá à testemunha que incorre em sanção penal quem faz afirmação falsa, cala ou oculta a verdade.  \nIII – O depoimento poderá ser documentado por meio de gravação.\n\nA) Apenas I e II\nB) Apenas II e III\nC) Apenas I\nD) Apenas II\nE) Todas estão corretas.","gab":"E","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]}],"sinteses":[],"cards":[{"id":"c1","f":"Quais são os tipos de carta processual e o que diferencia cada uma?","v":"Ordem: tribunal → juízo inferior (hierarquia). Precatória: entre juízos de igual hierarquia. Rogatória: entre países. Arbitral: juízo arbitral → juízo estatal."},{"id":"c2","f":"Quais são os 4 efeitos da citação válida (art. 240 CPC)?","v":"<ol><li>Induz litispendência</li><li>torna a coisa litigiosa</li><li>constitui o devedor em mora</li><li>interrompe a prescrição retroativamente à data da propositura da ação.</li></ol>"},{"id":"c3","f":"Quando NÃO é possível fazer a citação pelo correio?","v":"Incapaz, pessoa de direito público, ação de estado e local sem entrega domiciliar de correspondência (art. 247 CPC). Nesses casos = por mandado (oficial de justiça)."},{"id":"c4","f":"Quais os requisitos da citação com hora certa?","v":"(1) Duas tentativas frustradas de citar o réu; (2) fundada suspeita de que se oculta para evitar a citação. Intima familiar/vizinho; retorna no dia seguinte; réu ausente = dado por citado. Revel → curador especial."},{"id":"c5","f":"Como se conta o prazo quando a intimação é feita pelo Diário Eletrônico?","v":"Disponibilização (D) → Publicação = 1º dia útil após D → Início do prazo = 1º dia útil após publicação. Exemplo: disponibilizado quinta → publicado sexta → prazo começa segunda."},{"id":"c6","f":"Qual o prazo de contestação para o réu comum? E para a Fazenda Pública?","v":"Réu comum: 15 dias. Fazenda Pública, MP, Defensoria: 30 dias (em dobro, art. 183 CPC). Litisconsortes com advogados distintos: também 30 dias (art. 229 CPC)."},{"id":"c7","f":"O que é o princípio da eventualidade na contestação?","v":"O réu deve alegar TODA a matéria de defesa na contestação (art. 336 CPC), mesmo argumentos contraditórios. Não pode guardar argumentos para depois — haverá preclusão."},{"id":"c8","f":"Quando a revelia NÃO produz presunção de veracidade?","v":"<ol><li>Pluralidade de réus e ao menos um contestou</li><li>petição inicial não acompanhada do instrumento que a lei considera essencial ao ato.</li></ol>"},{"id":"c9","f":"Quais são os elementos obrigatórios de uma sentença (art. 489 CPC)?","v":"Relatório (descrição do processo), fundamentação (análise das questões — obrigatória, art. 93 IX CF) e dispositivo (o comando — parte vinculante). Sentença sem fundamentação = nula."},{"id":"c10","f":"Qual a diferença entre coisa julgada formal e material?","v":"Formal: preclusão máxima — decisão insuscetível de recurso no mesmo processo. Material: imutabilidade do comando sentencial fora do processo (art. 502 CPC) — bloqueia nova ação."},{"id":"c11","f":"Qual o prazo e a competência para ação rescisória?","v":"Prazo: 2 anos do trânsito em julgado. Competência: tribunal que proferiu a decisão rescindenda (não o juízo de 1º grau). Casos: prevaricação do juiz, violação manifesta de norma, prova falsa, fato novo, litispendência/CJ não alegada."},{"id":"c12","f":"Quando cabe agravo de instrumento?","v":"Contra decisões interlocutórias específicas do rol taxativo do art. 1.015 CPC (ex: tutelas provisórias, rejeição de convenção de arbitragem, exibição de documento, incompetência relativa). Prazo: 15 dias."},{"id":"c13","f":"Quais os requisitos da tutela de urgência?","v":"Fumus boni iuris (probabilidade do direito) + periculum in mora (perigo de dano ou risco ao resultado útil do processo). Pode ser antecipada (satisfativa) ou cautelar (assecuratória)."},{"id":"c14","f":"O que é tutela de evidência e quando prescinde de urgência?","v":"Tutela de evidência (art. 311 CPC) não exige urgência. Cabe quando: abuso do direito de defesa; pedido com prova documental + tese em julgamento repetitivo; pedido reipersecutório com prova documental; PI instruída com prova suficiente + defesa fraca do réu."},{"id":"c15","f":"O que é a estabilização da tutela antecipada antecedente?","v":"Se a tutela antecipada for concedida em caráter antecedente e o réu não recorrer em 15 dias, a tutela estabiliza e o processo é extinto. A parte pode rever em até 2 anos por ação autônoma."},{"id":"c16","f":"Qual o prazo e a multa no cumprimento de sentença por quantia certa?","v":"Intimação do devedor para pagar em 15 dias (art. 523 CPC). Não pagou → multa de 10% + honorários de 10% sobre o valor da condenação (automático, sem nova intimação)."},{"id":"c17","f":"Qual a ordem de preferência legal na penhora (art. 835 CPC)?","v":"1º dinheiro/depósito/aplicação → 2º títulos públicos → 3º títulos privados/créditos → 4º veículos → 5º imóveis → 6º semoventes → 7º navios/aeronaves → 8º bens móveis → 9º ações de S/A."},{"id":"c18","f":"Quando é vedada a citação por edital e quando ela é cabível?","v":"Edital é subsidiária (esgotados todos os outros meios). Cabe quando: réu em lugar incerto/não sabido; ignorado, incerto ou inacessível. Vedada como primeira opção. Revel citado por edital = curador especial nomeado."},{"id":"c19","f":"Qual a diferença entre conciliador e mediador?","v":"Conciliador: partes sem relacionamento prévio; pode propor soluções; indicado para litígios esporádicos (ex: acidentes de trânsito). Mediador: partes com relacionamento preexistente; facilita a comunicação; não propõe soluções (ex: conflitos familiares, vizinhança)."},{"id":"c20","f":"Quais são as hipóteses em que a reconvenção subsiste mesmo com extinção da ação principal?","v":"A reconvenção é autônoma: subsiste se o reconvinte desistir da ação principal, ou se o processo for extinto por falta de pressupostos processuais (art. 343, §2º CPC). Segue tramitação independente."}],"cobertura":["São 112 questões (8 módulos de 14), com enunciado completo, alternativas e gabarito fundamentado.","Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."],"notas":[]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["21A1"]={"cod":"21A1","revisao":[{"id":"r1","titulo":"GERAÇÕES DOS DIREITOS FUNDAMENTAIS","prob":"alta","html":"<p>As gerações (ou dimensões) organizam a evolução histórica dos direitos: cada uma representa um momento em que novas reivindicações passaram a ser reconhecidas. A banca adora <strong>inverter</strong> as gerações.</p>\n<ul>\n<li><strong>1ª Geração</strong> — direitos individuais/civis; prestações <em>negativas</em> (Estado não faz); liberdade de locomoção, vida, expressão.</li>\n<li><strong>2ª Geração</strong> — direitos sociais, econômicos e culturais; prestações <em>positivas</em> (Estado faz).</li>\n<li><strong>3ª Geração</strong> — solidariedade/fraternidade; direitos difusos; meio ambiente, paz, desenvolvimento.</li>\n</ul>\n<div class=\"pega\"><strong>Atenção — como cai na prova:</strong> 1ª ≠ social; 2ª ≠ liberdade individual. A questão 5 do Módulo 1 inverte e marca como errado.</div>"},{"id":"r2","titulo":"CARACTERÍSTICAS DOS DIREITOS FUNDAMENTAIS","prob":"alta","html":"<p>Os direitos fundamentais têm características específicas que os diferenciam de outros direitos. A mais cobrada em prova é a <strong>relatividade</strong> — eles não são absolutos.</p>\n<ul>\n<li>imprescritíveis, inalienáveis, invioláveis, universais, efetivos, concorrentes, <strong>relativos</strong> (não absolutos).</li>\n</ul>\n<div class=\"pega\"><strong>Atenção — como cai na prova:</strong> são <em>relativos</em>, não absolutos. São <em>imprescritíveis</em>, não prescritíveis.</div>"},{"id":"r3","titulo":"NATUREZA JURÍDICA","prob":"alta","html":"<p>Os direitos fundamentais são normas constitucionais com aplicação imediata. O rol do Título II é <em>exemplificativo</em>, não exaustivo — isso derruba questões que afirmam o contrário.</p>\n<ul>\n<li>Normas constitucionais positivas; aplicação imediata (art. 5º, §1º CF).</li>\n<li>Rol do Título II = <strong>exemplificativo</strong> (art. 5º, §2º CF — cláusula de abertura).</li>\n</ul>"},{"id":"r4","titulo":"TRATADOS INTERNACIONAIS — EC 45/2004","prob":"alta","html":"<p>Dois regimes distintos dependendo de <em>quando</em> o tratado foi aprovado e de <em>como</em>: com quórum qualificado (emenda) ou não. Cada caminho tem um status diferente na hierarquia normativa.</p>\n<ul>\n<li><strong>Status constitucional</strong>: aprovado em <strong>2 turnos</strong>, <strong>3/5</strong> dos votos de ambas as casas (art. 5º, §3º CF).</li>\n<li><strong>Status supralegal</strong>: tratados de DH aprovados <em>antes</em> da EC 45/04 → acima da lei, abaixo da CF.</li>\n<li><strong>Marco histórico</strong>: DUDH — 10 de dezembro de 1948, Paris.</li>\n<li><strong>Prisão depositário infiel</strong>: SV 25 — ilícita em qualquer modalidade; Pacto San José Costa Rica (supralegal) derrogou normas ordinárias.</li>\n<li>Dignidade da pessoa humana = <strong>fundamento</strong> da RFB (art. 1º, III CF), não apenas direito fundamental.</li>\n</ul>"},{"id":"r5","titulo":"DIREITO À VIDA","prob":"alta","html":"<p>O direito à vida é a base de todos os outros. A banca testa conhecimento sobre as <strong>exceções</strong>: quando a Constituição ou o STF admitem sua restrição.</p>\n<ul>\n<li>Pena de morte: vedada, <em>salvo guerra declarada</em> (art. 5º, XLVII, \"a\" CF). Cláusula pétrea — nem EC pode abolir.</li>\n<li>Aborto legal: necessário (risco de vida da gestante) + sentimental (estupro) — art. 128, I e II CP.</li>\n<li>Feto anencéfalo: STF permite interrupção (ADPF 54).</li>\n<li>Eutanásia: <strong>não permitida</strong>; configura homicídio (art. 121 CP) ou auxílio ao suicídio (art. 122 CP).</li>\n</ul>"},{"id":"r6","titulo":"PRINCÍPIO DA IGUALDADE","prob":"media","html":"<p>O princípio da igualdade não é simples: ele vincula o legislador, o intérprete e o particular. As questões testam situações que parecem violar a igualdade mas são constitucionalmente válidas — e vice-versa.</p>\n<ul>\n<li>Tríplice finalidade: limitadora ao legislador, ao intérprete/autoridade pública, ao particular.</li>\n<li>Limite de idade em concurso: só legítimo quando justificado pela natureza das atribuições (Súmula 683 STF).</li>\n<li>União homoafetiva: STF reconheceu como entidade familiar (ADI 4277/ADPF 132) — princípio da igualdade + não discriminação (art. 3º, IV CF).</li>\n</ul>"},{"id":"r7","titulo":"DIREITO DE LIBERDADE (art. 5º CF)","prob":"media","html":"<p>As liberdades do art. 5º têm <strong>limites constitucionais expressos</strong>. Liberdade de profissão, por exemplo, pode ser restringida por lei (eficácia contida). A banca cobra os limites, não as liberdades em si.</p>\n<ul>\n<li><strong>Manifestação do pensamento</strong> (IV): livre; vedado anonimato.</li>\n<li><strong>Expressão intelectual/artística</strong> (IX): livre, sem censura.</li>\n<li><strong>Sigilo da fonte</strong> (XIV): jornalista não pode ser obrigado a revelar por lei ordinária.</li>\n<li><strong>Liberdade de profissão</strong> (XIII): norma de <em>eficácia contida</em>; lei pode restringir (ex: Exame de Ordem — constitucional).</li>\n<li><strong>Crença/convicção</strong>: privação de direitos só se invocar para eximir-se de obrigação a todos imposta E recusar prestação alternativa (art. 5º, VIII CF).</li>\n<li><strong>Propriedade</strong>: garantida; deve atender função social. Descumprimento → desapropriação-sanção (não há indenização no art. 243 CF — culturas ilegais).</li>\n</ul>"},{"id":"r8","titulo":"NACIONALIDADE","prob":"media","html":"<p>Brasileiro nato nunca é extraditado. Naturalizado pode ser em dois casos específicos. Os cargos privativos de nato têm um rol fechado — decorar é inevitável.</p>\n<ul>\n<li><strong>Brasileiro NATO</strong>: ius solis (regra) + exceções ius sanguinis. Filho de brasileiro no exterior a serviço do Brasil = NATO independente de condições.</li>\n<li><strong>Naturalização</strong>: língua portuguesa = 1 ano + idoneidade moral; demais = 15 anos + sem condenação penal.</li>\n<li><strong>Extradição</strong>: brasileiro NATO nunca; naturalizado pode (crime comum antes da naturalização ou tráfico).</li>\n<li><strong>Cargos privativos de nato</strong> (art. 12, §3º): Pres./VP República, Pres. Câmara, Pres. Senado, Min. STF, carreira diplomática, oficial Forças Armadas, Min. Estado Defesa.</li>\n<li><strong>Perda da nacionalidade</strong>: cancelamento naturalização (sentença) ou aquisição voluntária de outra.</li>\n</ul>"},{"id":"r9","titulo":"DIREITOS SOCIAIS (art. 6º CF)","prob":"media","html":"<p>Direitos sociais exigem ação positiva do Estado. A 'reserva do possível' não pode ser usada para negar o <em>mínimo existencial</em> — esse é o ponto mais cobrado.</p>\n<ul>\n<li>Rol: educação, saúde, alimentação, trabalho, moradia, <strong>transporte</strong>, lazer, segurança, previdência social, proteção maternidade/infância, assistência desamparados.</li>\n<li><strong>Reserva do possível ≠ mínimo existencial</strong>: o Judiciário pode intervir para garantir mínimo existencial (ex: vaga em creche).</li>\n</ul>"},{"id":"r10","titulo":"DIREITOS POLÍTICOS","prob":"media","html":"<p>Voto obrigatório tem faixa etária precisa. O analfabeto pode votar (facultativo). Perda e suspensão dos direitos políticos têm causas diferentes e a banca mistura as duas categorias.</p>\n<ul>\n<li>Voto <strong>obrigatório</strong>: 18 a 70 anos. <strong>Facultativo</strong>: 16-18, analfabeto, maiores de 70.</li>\n<li>Idades mínimas: 35 (Pres/VP/Senador), 30 (Gov/VGov), 21 (Dep Fed/Est, Prefeito), 18 (Vereador).</li>\n<li><strong>Perda</strong> dos direitos políticos: cancelamento naturalização; recusa obrigação imposta + prestação alternativa; perda da nacionalidade.</li>\n<li><strong>Suspensão</strong>: incapacidade civil absoluta; condenação criminal transitada em julgado; improbidade administrativa.</li>\n<li><strong>Plebiscito</strong> = antes do ato (consulta prévia). <strong>Referendo</strong> = depois do ato (ratificação).</li>\n<li>Iniciativa popular federal: 1% eleitorado, mínimo 5 estados, 0,3% eleitores em cada.</li>\n</ul>\n<div class=\"pega\"><strong>Atenção — como cai na prova:</strong> analfabeto = alistamento e voto <em>facultativos</em> (não obrigatórios, não proibidos).</div>"},{"id":"r11","titulo":"REMÉDIOS CONSTITUCIONAIS","prob":"media","html":"<p>Cada remédio constitucional protege um bem jurídico específico. A banca apresenta uma situação e pede qual remédio cabe — decorar o objeto de cada um evita confusão.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Remédio</th>\n<th>Protege</th>\n<th>Prazo</th>\n<th>Sujeito ativo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HC</strong></td>\n<td>liberdade de locomoção</td>\n<td>—</td>\n<td>qualquer pessoa (sem capacidade postulatória)</td>\n</tr>\n<tr>\n<td><strong>MS</strong></td>\n<td>direito líquido e certo (não HC/HD)</td>\n<td>120 dias</td>\n<td>pessoa física ou jurídica</td>\n</tr>\n<tr>\n<td><strong>MI</strong></td>\n<td>direito constitucional sem norma regulamentadora</td>\n<td>—</td>\n<td>qualquer pessoa</td>\n</tr>\n<tr>\n<td><strong>HD</strong></td>\n<td>acesso/retificação de dados em órgãos públicos</td>\n<td>—</td>\n<td>qualquer pessoa</td>\n</tr>\n<tr>\n<td><strong>AP</strong></td>\n<td>patrimônio público, moralidade, meio ambiente, histórico/cultural</td>\n<td>—</td>\n<td><strong>cidadão</strong> (nato ou naturalizado com direitos políticos)</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>PEGADINHA HC vs HD vs MS</strong>: dado fiscal exposto publicamente → MS (direito líquido e certo à intimidade), não HD (HD serve para <em>acessar/retificar</em> dados, não para tirá-los do domínio público).</li>\n<li><strong>MI vs HD</strong>: retificação de dados = <strong>HD</strong> (art. 5º, LXXII). Ausência de norma regulamentadora = <strong>MI</strong>.</li>\n<li>MS não cabe: ato com recurso administrativo com efeito suspensivo; decisão judicial com recurso suspensivo; decisão transitada em julgado.</li>\n<li>Ação Popular: só <em>cidadão</em> (não estrangeiro, não PJ, não com direitos suspensos).</li>\n</ul>"},{"id":"r12","titulo":"PROTEÇÃO INTERNACIONAL","prob":"media","html":"<p>O sistema internacional de proteção tem dois planos (global e regional) e dois órgãos interamericanos com funções distintas: Comissão (recomenda, não condena) e Corte (condena).</p>\n<ul>\n<li><strong>Plano global</strong>: ONU (tratados ONU). <strong>Plano regional</strong>: organizações geográficas (OEA, UE, UA).</li>\n<li>Comissão Interamericana: sede Washington; 7 membros; mandato 4 anos; <strong>sem poder jurisdicional</strong> (função = recomendações, relatórios, encaminhar à Corte).</li>\n<li>Corte Interamericana: <strong>tem</strong> poder jurisdicional; 7 juízes; Brasil reconheceu competência a partir de 10/12/1998.</li>\n<li>TPI: criado pelo Estatuto de Roma (1998, em vigor 2002); 4 crimes: genocídio, crimes contra humanidade, crimes de guerra, crime de agressão; só pessoa física; Brasil ratificou jun/2002.</li>\n</ul>\n<div class=\"pega\"><strong>Atenção — como cai na prova:</strong> são <em>dois</em> planos (global e regional), não três. Questão 1 do Módulo 8 afirma três = FALSO.</div>\n<div class=\"pega\"><strong>Atenção — como cai na prova:</strong> condenar Estado a pagar compensação = função da <strong>Corte</strong>, não da Comissão.</div>"}],"top5":[],"questoes":[{"id":"M1-Q1","bloco":"MÓDULO 1 — Direitos Humanos Fundamentais: Conceito, Características e Gerações","num":"Ex.1","tema":"","enun":"A Carta Magna de 1988 prevê em seu Título II, Capítulos I ao V, artigos 5º ao 17, os Direitos e Garantias Fundamentais, de forma que, os demais direitos previstos no corpo da Constituição não podem ser considerados como fundamentais,\n\nPORQUE\n\nO Título II da CF/88 apresenta um rol exaustivo de direitos fundamentais não podendo ser interpretado de forma ampliada.\n\nAssinale a alternativa correta:\n\nA) as duas assertivas são falsas.\nB) a primeira assertiva é falsa e a segunda é verdadeira.\nC) a primeira assertiva é verdadeira e a segunda é falsa.\nD) as duas assertivas são verdadeiras e a segunda justifica a primeira.\nE) as duas assertivas são verdadeiras e a segunda não justifica a primeira.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p><p>O Título II não é rol exaustivo — o art. 5º, § 2º (cláusula de abertura) admite outros direitos implícitos. Além disso, direitos fundamentais espalhados pelo corpo da CF (ex.: art. 150, art. 226) também são reconhecidos como fundamentais.</p><p>Ambas as assertivas são falsas.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q2","bloco":"MÓDULO 1 — Direitos Humanos Fundamentais: Conceito, Características e Gerações","num":"Ex.2","tema":"","enun":"Podemos dizer que a 3ª Geração de Direitos Fundamentais projeta o conceito humanitário como resultante da harmonização dos valores humanos, individuais e coletivos, com os valores sócioculturais e econômicos. É o homem numa dimensão universalizante, sendo consagrados os direitos ao desenvolvimento, à paz, ao meio ambiente, ao consumo, à comunicação. É na terceira geração de direitos fundamentais que se cultuam denominados direitos difusos.\n\nO legislador constituinte preocupou-se com as questões relativas ao direito do consumidor, o colocando como direito fundamental previsto no art. 5º, inciso XXXII da CF que dispõe: o Estado promoverá, na forma da lei, a defesa do consumidor.\n\nDe acordo com o dispositivo constitucional, assinale a alternativa correta:\n\nI – Trata-se de norma de eficácia plena nos termos do art. 5º, §1º da CF/88, já que as normas definidoras dos direitos fundamentais têm aplicação imediata.\nII – Trata-se de norma de eficácia contida, cuja lei posterior deverá restringir seu campo de atuação, limitando alguns dos direitos do consumidor constitucionalmente assegurados.\nIII – Trata-se de norma de eficácia limitada, não tendo, portanto, o condão de produzir todos os seus efeitos, precisando de uma lei integrativa infraconstitucional para ampliar seu campo de atuação.\n\nA) todas estão corretas.\nB) somente I é correta.\nC) somente II é correta.\nD) somente III é correta.\nE) todas estão incorretas.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O art. 5º, XXXII (defesa do consumidor) dependeu de lei integrativa — o Código de Defesa do Consumidor (Lei 8.078/90) — para produzir seus efeitos plenos, caracterizando norma de eficácia limitada (3ª Geração/Dimensão de Direitos = direitos difusos e coletivos).","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q3","bloco":"MÓDULO 1 — Direitos Humanos Fundamentais: Conceito, Características e Gerações","num":"Ex.3","tema":"","enun":"A relatividade é uma das características dos Direitos Fundamentais\n\nPORQUE\n\nA universalidade dos Direitos fundamentais pressupõe o seu direcionamento a todos os indivíduos, independentemente de sua nacionalidade, sexo, raça, credo ou convicção político-filosófica.\n\nAssinale a alternativa CORRETA:\n\nA) as duas assertivas são falsas.\nB) a primeira assertiva é falsa e a segunda é verdadeira.\nC) a primeira assertiva é verdadeira e a segunda é falsa.\nD) as duas assertivas são verdadeiras e a segunda não justifica a primeira.\nE) as duas assertivas são verdadeiras e a segunda justifica a primeira.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Os direitos fundamentais não são absolutos — sua relatividade (limitabilidade) é característica reconhecida. A universalidade também é correta (direcionamento a todos). Contudo, a universalidade não serve de fundamento para a relatividade — são características independentes entre si.","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q4","bloco":"MÓDULO 1 — Direitos Humanos Fundamentais: Conceito, Características e Gerações","num":"Ex.4","tema":"","enun":"Qual a natureza jurídica das normas de direitos humanos fundamentais?\n\nA) direitos civis.\nB) direitos internacionais.\nC) direitos constitucionais.\nD) direitos privados.\nE) direitos indisponíveis.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>As normas que definem os direitos e garantias fundamentais têm aplicação imediata (art. 5º, § 1º, CF/88), possuindo natureza jurídica de normas constitucionais positivadas — portanto, direitos constitucionais.","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q5","bloco":"MÓDULO 1 — Direitos Humanos Fundamentais: Conceito, Características e Gerações","num":"Ex.5","tema":"","enun":"Julgue os seguintes itens:\n\nI - os denominados direitos de primeira geração compreendem os direitos sociais, enquanto os de segunda geração identificam-se com as liberdades negativas.\nII - entende-se que os direitos fundamentais são absolutos, invioláveis e inalienáveis, porém, renunciáveis e prescritíveis.\n\nAssinale a alternativa correta:\n\nA) as duas assertivas são falsas.\nB) as duas assertivas são verdadeiras.\nC) somente I é verdadeira.\nD) somente II é verdadeira.\nE) as duas assertivas são verdadeiras e a segunda justifica primeira.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p><p>Ambas são falsas.</p><p>A assertiva I inverteu as gerações: 1ª Geração = liberdades negativas (civis/políticas); 2ª Geração = direitos sociais/prestacionais.</p><p>A assertiva II erra ao afirmar que direitos fundamentais são absolutos (são relativos) e prescritíveis (são imprescritíveis).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q6","bloco":"MÓDULO 1 — Direitos Humanos Fundamentais: Conceito, Características e Gerações","num":"Ex.6","tema":"","enun":"Dentre os deveres individuais e coletivos, a Constituição Federal assegura o direito:\n\nA) à saúde.\nB) ao meio ambiente ecologicamente equilibrado.\nC) de liberdade de expressão.\nD) à educação.\nE) ao Progresso.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Conforme o art. 5º, IX, da CF/88, é livre a expressão da atividade intelectual, artística, científica e de comunicação, inserida no Capítulo I (Direitos e Deveres Individuais e Coletivos). Saúde, educação e meio ambiente pertencem a outros capítulos/títulos.","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q1","bloco":"MÓDULO 2 — Tratados Internacionais de Direitos Humanos e Dignidade da Pessoa Humana","num":"Ex.1","tema":"","enun":"De acordo com o texto vigente da Constituição Federal e a jurisprudência do Supremo Tribunal Federal sobre os Tratados Internacionais, é correto afirmar que:\n\nA) todos os tratados internacionais firmados pelo Brasil ingressam no ordenamento jurídico brasileiro como normas de hierarquia constitucional.\nB) todos os tratados internacionais firmados pelo Brasil ingressam no ordenamento jurídico como normas infraconstitucionais.\nC) os tratados internacionais firmados pelo Brasil sobre direitos humanos podem ingressar no ordenamento jurídico brasileiro com hierarquia de emendas constitucionais.\nD) o procedimento de aprovação, pelas Casas do Congresso Nacional, dos tratados internacionais sobre direitos humanos é irrelevante para caracterizar sua hierarquia normativa.\nE) os tratados internacionais firmados pelo Brasil não podem versar sobre normas materialmente constitucionais.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Conforme o art. 5º, § 3º da CF/88 (EC 45/2004) e jurisprudência do STF (RE 466.343): tratados de DH aprovados em dois turnos por 3/5 em cada Casa = status de EC; se aprovados pelo rito ordinário = status supralegal (acima das leis, abaixo da CF).","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q2","bloco":"MÓDULO 2 — Tratados Internacionais de Direitos Humanos e Dignidade da Pessoa Humana","num":"Ex.2","tema":"","enun":"[Ementa do HC 87.585 TO — STF — Depositário Infiel]\n\nA subscrição pelo Brasil do Pacto de São José da Costa Rica, limitando a prisão civil por dívida ao descumprimento inescusável de prestação alimentícia, implicou a derrogação das normas estritamente legais referentes à prisão do depositário infiel.\n\nCom base no texto acima assinale a alternativa correta:\n\nA) a ementa refere-se ao direito supralegal de liberdade de locomoção, o qual, por ser absoluto, não pode ser violado, cabendo como remédio constitucional para reparar a ilegalidade a impetração de Habeas-Corpus, não sendo possível a prisão do depositário infiel.\nB) a ementa refere-se ao status supralegal conferido ao Pacto de São José da Costa Rica, razão pelo qual não haverá prisão civil ao depositário infiel, somente subsistindo a prisão civil por dívida relativa ao descumprimento inescusável de prestação alimentícia.\nC) o rol do artigo 5º da CF/88 é exaustivo, não admitindo os Tratados Internacionais como fontes dos direitos humanos fundamentais.\nD) a ementa reconhece a supremacia da CF/88 em relação aos Tratados Internacionais, aplicando-se a prisão do depositário infiel.\nE) trata-se de prisão penal sujeita aos critérios constitucionais do art. 5º, LXI.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O STF reconheceu o status supralegal do Pacto de San José da Costa Rica, pacificando a inaplicabilidade da prisão civil do depositário infiel (Súmula Vinculante 25). A única prisão civil subsistente é a do devedor de alimentos.","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q3","bloco":"MÓDULO 2 — Tratados Internacionais de Direitos Humanos e Dignidade da Pessoa Humana","num":"Ex.3","tema":"","enun":"Podemos indicar como marco histórico da mais importante conquista em direitos humanos fundamentais em diplomas internacionais:\n\nA) Convenção Americana sobre Direitos Humanos - Pacto de São José da Costa Rica.\nB) Declaração e Programa de Ação de Viena.\nC) Declaração de Pequim.\nD) Pacto Internacional dos Direitos Econômicos, Sociais e Culturais.\nE) Declaração Universal dos Direitos do Homem.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A Declaração Universal dos Direitos Humanos (DUDH), adotada pela Assembleia Geral da ONU em 10 de dezembro de 1948, representa o grande marco histórico da proteção global e universal dos direitos humanos.","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q4","bloco":"MÓDULO 2 — Tratados Internacionais de Direitos Humanos e Dignidade da Pessoa Humana","num":"Ex.4","tema":"","enun":"Para incorporação do Tratado Internacional que verse sobre direitos humanos com o status de Emenda Constitucional em nosso ordenamento jurídico será necessário o quórum:\n\nA) de maioria absoluta dos membros de ambas as casas do Congresso Nacional.\nB) de maioria simples dos membros de ambas as casas do Congresso Nacional.\nC) de maioria qualificada de dois terços dos votos dos membros de ambas as casas do Congresso Nacional.\nD) qualificado de três quintos dos votos dos respectivos membros de ambas as casas do Congresso Nacional.\nE) qualificado em dois turnos de três quintos dos votos dos respectivos membros de ambas as casas do Congresso Nacional.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, § 3º, CF/88 (EC 45/2004): aprovação em cada Casa do Congresso Nacional, em <b>dois turnos</b>, por <b>três quintos</b> dos votos dos respectivos membros — mesmo quórum exigido para aprovação de Emenda Constitucional.","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q5","bloco":"MÓDULO 2 — Tratados Internacionais de Direitos Humanos e Dignidade da Pessoa Humana","num":"Ex.5","tema":"","enun":"Tendo em vista que a dignidade da pessoa humana não está expressa no caput do art. 5º da CF/88, pode-se afirmar:\n\nA) que ela é um direito fundamental como qualquer outro.\nB) que ela é um direito fundamental de eficácia menor em relação aos demais direitos fundamentais.\nC) que ela é um dos fundamentos da República Federativa do Brasil.\nD) que ela autoriza a supressão da vida nos crimes hediondos como extorsão mediante sequestro.\nE) que ela situa-se entre os direitos à vida e à liberdade.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A Dignidade da Pessoa Humana é fundamento da República Federativa do Brasil, expressamente proclamada no art. 1º, III, da CF/88 — não é apenas um direito fundamental, mas o valor-fonte de todo o ordenamento constitucional.","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q6","bloco":"MÓDULO 2 — Tratados Internacionais de Direitos Humanos e Dignidade da Pessoa Humana","num":"Ex.6","tema":"","enun":"Julgue os seguintes itens:\n\nI - Ante o choque das atrocidades cometidas contra a humanidade durante a Segunda Guerra Mundial, a proteção à dignidade da pessoa humana passou a figurar em documentos internacionais como a Declaração Universal de Direitos Humanos (1948), o Pacto Internacional dos Direitos Civis e Políticos (1966) e o Pacto Internacional dos Direitos Econômicos, Sociais e Culturais (1966).\nII - A prisão civil no ordenamento jurídico brasileiro, de acordo com a Convenção Americana de Direitos Humanos, é lícita no caso do devedor de alimentos e ilícita no caso do depositário infiel, salvo se for decorrente de alienação fiduciária.\n\nA) as duas assertivas estão corretas.\nB) as duas assertivas estão incorretas.\nC) somente I é correta.\nD) somente II é correta.\nE) as duas assertivas são corretas e a segunda justifica a primeira.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Assertiva I correta: descreve o papel histórico dos diplomas pós-Segunda Guerra. Assertiva II incorreta: a Súmula Vinculante 25 do STF estabeleceu a ilicitude da prisão civil do depositário infiel em <b>qualquer</b> modalidade, inclusive alienação fiduciária.","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q1","bloco":"MÓDULO 3 — Direito à Vida, Eutanásia, Igualdade","num":"Ex.1","tema":"","enun":"Assinale a alternativa correta:\n\nA) a pena de morte não pode ser aplicada no Brasil, em nenhuma hipótese.\nB) a pena de morte pode ser introduzida no Brasil por meio de Emenda Constitucional.\nC) a pena de morte pode ser aplicada em caso de guerra declarada.\nD) a pena de morte pode ser introduzida em processo de revisão constitucional.\nE) por não haver previsão constitucional sobre a matéria, a pena de morte deve ser tratada exclusivamente pela legislação ordinária.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, XLVII, \"a\", CF/88: não haverá penas de morte, <b>salvo em caso de guerra declarada</b>, nos termos do art. 84, XIX. Trata-se de cláusula pétrea — não pode ser eliminada nem por EC.","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q2","bloco":"MÓDULO 3 — Direito à Vida, Eutanásia, Igualdade","num":"Ex.2","tema":"","enun":"[Platão, Thomas Morus e Binding/Hoche sobre eutanásia]\n\nAssinale a alternativa CORRETA:\n\nI - A eutanásia, amplamente contemplada em nosso ordenamento jurídico, pode ser considerada como morte piedosa, realizada a pedido do próprio doente, ante a sua incurabilidade e sofrimento insuportável.\nII – Tendo em vista que o direito à vida é um direito fundamental e, portanto, relativo, poderá sofrer restrição. O praticante da eutanásia não poderá ser processado ou condenado à pena, em razão do princípio da dignidade da pessoa humana previsto no artigo 1º da CF/88.\nIII – Por não ser reconhecida em nosso ordenamento jurídico, a prática da eutanásia constitui crime contra a vida, devendo seu praticante ser punido nos termos da lei.\n\nA) todas estão corretas.\nB) todas estão incorretas.\nC) somente I é correta.\nD) somente II é correta.\nE) somente III é correta.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A eutanásia não é permitida pelo ordenamento jurídico brasileiro, configurando crime de homicídio (art. 121 CP) ou auxílio ao suicídio (art. 122 CP). I é falsa (não é contemplada); II é falsa (relatividade não afasta a punição).","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q3","bloco":"MÓDULO 3 — Direito à Vida, Eutanásia, Igualdade","num":"Ex.3","tema":"","enun":"Um em cada 500 adolescentes brasileiros vai ser morto até os 19 anos, revela estudo (IHA).\n\nSendo a vida um bem jurídico de grande relevância, assinale a alternativa correta:\n\nA) Os direitos fundamentais têm como fonte exclusiva a legislação infraconstitucional.\nB) a soberania popular não pode ser respeitada diante da vontade política da Nação que pode mitigar certos direitos fundamentais.\nC) Os direitos fundamentais têm como característica a relatividade. Em sendo assim, considerando-se a vida como direito fundamental relativo, há situações em que ele poderá ser violado conforme a pesquisa acima, no que toca à permissão aos homicídios.\nD) Trata-se de direito fundamental de 2º Geração impondo por parte do Estado uma prestação positiva no sentido de garantir a efetivação desse direito.\nE) nenhuma das alternativas anteriores.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Nenhuma das assertivas A–D apresenta fundamentação jurídica aceitável. A relatividade dos direitos fundamentais não autoriza homicídios; o direito à vida é 1ª Geração (liberdade negativa), não 2ª; e a fonte primária dos direitos fundamentais é a Constituição, não a legislação infraconstitucional.","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q4","bloco":"MÓDULO 3 — Direito à Vida, Eutanásia, Igualdade","num":"Ex.4","tema":"","enun":"De acordo com entendimento predominante do STF, a interrupção da gravidez de fetos anencéfalos:\n\nA) configura aborto sentimental acolhido pelo Direito.\nB) configura aborto necessário, pois há sempre risco de vida da gestante.\nC) é permitida por lei.\nD) é proibida, pois o direito à vida não pode ser violado.\nE) é permitida pois o direito à vida de um feto sabidamente inviável não poderia se sobrepor ao direito à dignidade humana da gestante.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O STF, na ADPF 54 (Rel. Min. Marco Aurélio), firmou a constitucionalidade da interrupção da gestação no caso de feto anencéfalo, por não se tratar de aborto (feto sem viabilidade de vida extrauterina), ponderando a dignidade da gestante.","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q5","bloco":"MÓDULO 3 — Direito à Vida, Eutanásia, Igualdade","num":"Ex.5","tema":"","enun":"O reconhecimento de iguais direitos aos homossexuais e a igual valoração jurídica das relações afetivas e eróticas entre pessoas do mesmo sexo:\n\nA) dependem de modificação constitucional através de manifestação do Poder Constituinte Derivado.\nB) ferem o princípio democrático e a regra da maioria, já que o Direito deve privilegiar a moral da maioria.\nC) decorrem do sistema constitucional de direitos e garantias fundamentais, que proíbe quaisquer formas de discriminação e garante a dignidade da pessoa humana.\nD) estão sujeitos à evolução social e cultural da sociedade em que vivemos.\nE) necessitam de legislação infraconstitucional para efetivação, pois as normas constitucionais incidentes são de eficácia limitada.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Na ADI 4277 e ADPF 132, o STF reconheceu a união entre pessoas do mesmo sexo como entidade familiar (união estável), com base no princípio da igualdade (art. 5º, caput) e da não discriminação (art. 3º, IV, CF/88).","repete":false,"repeteRef":"","coment":[]},{"id":"M3-Q6","bloco":"MÓDULO 3 — Direito à Vida, Eutanásia, Igualdade","num":"Ex.6","tema":"","enun":"Sérpico Souza Cruz, 49 anos, advogado desde 1986, teve inscrição negada para concurso da Magistratura que previa idade máxima de 45 anos.\n\nPodemos dizer que o dispositivo constante do edital:\n\nA) violou princípio da inafastabilidade do Poder Judiciário previsto no artigo 5º, XXXV da CF.\nB) violou princípio da inércia da jurisdição previsto no art. 2º do CPC.\nC) violou princípio da igualdade previsto no art. 5º caput da CF/88 e artigo 7º, XXX.\nD) violou princípio da legalidade previsto no art. 5º, II da CF.\nE) não violou nenhum princípio já que é da essência do cargo de juiz de direito a limitação de idade.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Nos termos da Súmula 683 do STF, a limitação de idade em concurso público só se legitima quando justificada pela natureza das atribuições do cargo. A Magistratura não comporta tal justificativa, tornando a restrição violadora do princípio da igualdade (art. 5º, caput c/c art. 7º, XXX, CF/88).","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q1","bloco":"MÓDULO 4 — Liberdades Individuais: Expressão, Profissão, Propriedade","num":"Ex.1","tema":"","enun":"Constitui embaraço à plena liberdade de informação dos meios de comunicação:\n\nA) o exercício do direito de resposta, proporcional ao agravo.\nB) o ressarcimento pelos danos morais causados por informação que violou a vida privada.\nC) dispositivo de lei ordinária que obrigue a revelação da fonte das informações veiculadas por jornalistas.\nD) condenação judicial de jornalista que, em matéria assinada, pratica o crime de calúnia contra alguém.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, XIV, CF/88: é resguardado o sigilo da fonte, quando necessário ao exercício profissional. Lei ordinária que obrigue o jornalista a revelar a fonte viola frontalmente essa garantia constitucional e embaraça a liberdade de informação.","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q2","bloco":"MÓDULO 4 — Liberdades Individuais: Expressão, Profissão, Propriedade","num":"Ex.2","tema":"","enun":"Pessoa que se exime de prestar serviço militar, alegando motivo de crença religiosa e se recusa a prestar serviços alternativos:\n\nA) é privado de seus direitos sociais.\nB) é privado do status de cidadão e dos direitos dele decorrentes.\nC) tem seus direitos e garantias individuais suspensos.\nD) não pode ser privado de nada, porque a Constituição prevê a liberdade de credo religioso.\nE) n.d.a","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, VIII, CF/88: ninguém será privado de direitos por motivo de crença religiosa, salvo se a invocar para eximir-se de obrigação legal a todos imposta <b>e recusar-se a cumprir prestação alternativa</b> — nesse caso perde o status de cidadão.","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q3","bloco":"MÓDULO 4 — Liberdades Individuais: Expressão, Profissão, Propriedade","num":"Ex.3","tema":"","enun":"Conforme entendimento do STF com base no princípio da vedação do anonimato, os escritos apócrifos não podem justificar, por si sós, desde que isoladamente considerados, a imediata instauração da persecução criminal\n\nPORQUE\n\nVigora no ordenamento jurídico brasileiro a liberdade de manifestação do pensamento, de forma que, mesmo quando produzidos pelo acusado, ou ainda, quando constituírem eles próprios o corpo de delito não poderão ser considerados em virtude da proteção constitucional.\n\nA) as duas assertivas são falsas.\nB) a primeira assertiva é falsa e a segunda é verdadeira.\nC) a primeira assertiva é verdadeira e a segunda é falsa.\nD) as duas assertivas são verdadeiras e a segunda não justifica a primeira.\nE) as duas assertivas são verdadeiras e a segunda justifica a primeira.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, IV, CF/88: é livre a manifestação do pensamento, sendo <b>vedado o anonimato</b>. A primeira assertiva é correta (escritos apócrifos não justificam sozinhos a persecução). A segunda é falsa: quando constituem o corpo de delito, podem ser considerados.","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q4","bloco":"MÓDULO 4 — Liberdades Individuais: Expressão, Profissão, Propriedade","num":"Ex.4","tema":"","enun":"A CF/88 assegura em seu corpo a liberdade de profissão\n\nPORQUE\n\nTratando-se de trabalho, ofício ou profissão lícitos, não poderá haver, em qualquer hipótese, óbice que cause embaraço à liberdade de profissão.\n\nA) as duas assertivas são falsas.\nB) a primeira assertiva é falsa e a segunda é verdadeira.\nC) a primeira assertiva é verdadeira e a segunda é falsa.\nD) as duas assertivas são verdadeiras e a segunda justifica a primeira.\nE) as duas assertivas são verdadeiras e a segunda não justifica a primeira.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, XIII, CF/88: é livre o exercício de qualquer trabalho, ofício ou profissão, <b>atendidas as qualificações profissionais que a lei estabelecer</b> (norma de eficácia contida). A primeira é correta; a segunda é falsa pois a lei pode impor requisitos.","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q5","bloco":"MÓDULO 4 — Liberdades Individuais: Expressão, Profissão, Propriedade","num":"Ex.5","tema":"","enun":"Hermenegildo Palha, formado em Direito em 2009, pleiteou inscrição direta na OAB sem realizar o Exame de Ordem, alegando o art. 5º, XIII.\n\n[Questão avalia qual assertiva sobre o exame de ordem é verdadeira entre I, II e III — somente III é correta: a exigência do exame de ordem é legítima restrição legal à liberdade de profissão]\n\nA) todas as assertivas são falsas.\nB) somente I é verdadeira.\nC) somente II é verdadeira.\nD) somente III é verdadeira.\nE) somente I é falsa.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A exigência do exame de ordem pela OAB foi julgada constitucional pelo STF (RE 603.583), configurando restrição legítima estabelecida por lei federal (Lei 8.906/94) à liberdade de profissão do art. 5º, XIII (norma de eficácia contida).","repete":false,"repeteRef":"","coment":[]},{"id":"M4-Q6","bloco":"MÓDULO 4 — Liberdades Individuais: Expressão, Profissão, Propriedade","num":"Ex.6","tema":"","enun":"O artigo 5º da CF/88 assegura o direito de propriedade, a qual deverá atender à sua função social. Caso a propriedade não atenda à sua função social poderá ocorrer:\n\nA) desapropriação por necessidade pública.\nB) desapropriação por utilidade pública.\nC) multa.\nD) desapropriação-sanção.\nE) nada poderá ser aplicado por ser a propriedade um direito fundamental absoluto.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, XXII e XXIII, CF/88: o direito de propriedade é assegurado mas deve atender à função social. O descumprimento desta acarreta a <b>desapropriação-sanção</b> (art. 182, §4º e art. 184 da CF/88), com pagamento em títulos da dívida pública.","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q1","bloco":"MÓDULO 5 — Nacionalidade","num":"Ex.1","tema":"","enun":"Pablo nasceu em Buenos Aires. Seu pai é o embaixador brasileiro na Argentina e sua mãe é de nacionalidade argentina.\n\nA) poderá naturalizar-se brasileiro após residir no Brasil por mais de 15 anos ininterruptos e não tiver condenação penal.\nB) poderá naturalizar-se brasileiro após a maioridade se residir no Brasil por um ano e desde que requeira a nacionalidade brasileira.\nC) será considerado brasileiro nato desde que venha residir no Brasil até os vinte e um anos e opte, após a maioridade, pela nacionalidade brasileira.\nD) será considerado brasileiro nato desde que venha residir no Brasil a qualquer tempo e opte pela nacionalidade brasileira.\nE) é brasileiro nato, independentemente de quaisquer condições.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 12, I, 'b', CF/88: é brasileiro nato quem nasce no estrangeiro de pai <b>ou</b> mãe brasileira, desde que qualquer deles esteja a <b>serviço da República Federativa do Brasil</b> (pai de Pablo é embaixador = serviço diplomático).","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q2","bloco":"MÓDULO 5 — Nacionalidade","num":"Ex.2","tema":"","enun":"Maria, funcionária da Petrobras, foi enviada grávida à Itália para tratar de assuntos profissionais. Deu à luz prematuramente a Mário em Roma. Esse filho será:\n\nA) apátrida.\nB) estrangeiro.\nC) brasileiro nato.\nD) brasileiro naturalizado.\nE) italiano, podendo optar pela nacionalidade brasileira após a maioridade.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 12, I, 'c', CF/88: o nascido no estrangeiro de pai ou mãe brasileira é nato se for registrado em repartição brasileira competente <b>ou</b> vier a residir no Brasil e optar pela nacionalidade após a maioridade. A Petrobras é empresa estatal — há registro em repartição competente.","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q3","bloco":"MÓDULO 5 — Nacionalidade","num":"Ex.3","tema":"","enun":"De acordo com a CF/88 pode ser extraditado o brasileiro naturalizado, em caso de crime comum, praticado anteriormente à naturalização ou de comprovado envolvimento em tráfico ilícito de entorpecente e drogas afins. Portanto, a afirmação acima está:\n\nA) incorreta, porque o brasileiro nato também pode ser extraditado.\nB) totalmente incompatível com o que dispõe a CF/88.\nC) incorreta, porque a prática do crime comum não autoriza a extradição.\nD) totalmente compatível com o que dispõe a CF/88 no capítulo dos Direitos e Deveres Individuais e Coletivos.\nE) totalmente incorreta porque somente o brasileiro nato pode ser extraditado.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, LI, CF/88: nenhum brasileiro será extraditado, <b>salvo o naturalizado</b>, em caso de crime comum praticado <b>antes da naturalização</b> ou de comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei.","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q4","bloco":"MÓDULO 5 — Nacionalidade","num":"Ex.4","tema":"","enun":"Aos portugueses com residência permanente no Brasil, se houver reciprocidade em favor de brasileiros, serão atribuídos os direitos inerentes aos:\n\nA) brasileiros natos.\nB) brasileiros naturalizados.\nC) estrangeiros residentes.\nD) estrangeiros não residentes.\nE) aos apátridas.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 12, § 1º, CF/88: aos portugueses com residência permanente no País, se houver reciprocidade em favor de brasileiros, serão atribuídos os direitos inerentes ao <b>brasileiro</b> (quase-nacionalidade / igualdade de direitos com brasileiros naturalizados, salvo os privativos de nato).","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q5","bloco":"MÓDULO 5 — Nacionalidade","num":"Ex.5","tema":"","enun":"É privativo de brasileiro nato, dentre outros, o cargo de:\n\nA) Oficial das Forças Armadas.\nB) Ministro dos Tribunais Superiores.\nC) Senador.\nD) Deputado Federal.\nE) Ministro de Estado da Fazenda.","gab":"A","gabLabel":"","html":"<p>Art. 12, § 3º, CF/88: são privativos de brasileiro nato os cargos de: I - Presidente e Vice-Presidente da República; II - Presidente da Câmara dos Deputados; III - Presidente do Senado Federal; IV - Ministro do STF; V - da carreira diplomática; <b>VI - de oficial das Forças Armadas</b>; VII - de Ministro de Estado da Defesa.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M5-Q6","bloco":"MÓDULO 5 — Nacionalidade","num":"Ex.6","tema":"","enun":"Sobre o reconhecimento da nacionalidade brasileira, é correto afirmar:\n\nA) A aquisição da nacionalidade ocorre pelo critério Ius solis, de modo que qualquer pessoa nascida no território brasileiro terá a nacionalidade primária imposta, independentemente de sua vontade.\nB) Não pode haver distinção entre brasileiros natos e naturalizados, inclusive para efeitos das condições de elegibilidade.\nC) O brasileiro naturalizado pode ser extraditado somente em caso de comprovado envolvimento em tráfico de entorpecentes e drogas afins.\nD) O cancelamento da naturalização em virtude de atividade nociva ao interesse nacional por sentença judicial leva à declaração da perda da nacionalidade brasileira.\nE) Brasileiros natos ou pessoas jurídicas constituídas sob as leis brasileiras são os únicos com direito a concessão de empresa jornalística ou de radiodifusão.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 12, § 4º, CF/88: a perda da nacionalidade brasileira ocorre, entre outros casos, pelo <b>cancelamento da naturalização por sentença judicial</b> transitada em julgado, em virtude de atividade nociva ao interesse nacional.","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q1","bloco":"MÓDULO 6 — Direitos Políticos e Sociais","num":"Ex.1","tema":"","enun":"A CF/88 estabelece que todo poder emana do povo, que o exerce mediante representantes eleitos, ou diretamente, por meio do:\n\nA) referendo, habeas-corpus e da ação popular.\nB) referendo, da ação popular e do plebiscito.\nC) mandado de injunção e da iniciativa popular.\nD) plebiscito, do referendo e da iniciativa popular.\nE) mandado de segurança e ação popular.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 1º, parágrafo único c/c art. 14, I, II e III, CF/88: o poder emana do povo e é exercido diretamente por meio do <b>plebiscito, do referendo e da iniciativa popular</b> — os três instrumentos de democracia direta previstos na Constituição.","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q2","bloco":"MÓDULO 6 — Direitos Políticos e Sociais","num":"Ex.2","tema":"","enun":"A perda dos direitos políticos se dará no seguinte caso:\n\nA) improbidade administrativa.\nB) cancelamento da naturalização, por sentença transitada em julgado.\nC) condenação criminal transitada em julgado, enquanto durarem seus efeitos.\nD) incapacidade civil absoluta.\nE) n.d.a","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 15, CF/88: o cancelamento da naturalização por sentença gera <b>PERDA</b> dos direitos políticos (art. 15, I). As demais hipóteses (improbidade, condenação criminal, incapacidade civil) geram <b>SUSPENSÃO</b> (art. 15, II, III e II).","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q3","bloco":"MÓDULO 6 — Direitos Políticos e Sociais","num":"Ex.3","tema":"","enun":"No tocante aos Direitos Políticos, considere as assertivas:\n\nI - O alistamento eleitoral é obrigatório para o analfabeto.\nII - O voto é obrigatório para o analfabeto.\nIII - Os conscritos não podem alistar-se como eleitores durante o período do serviço militar obrigatório.\nIV - Os analfabetos são inelegíveis.\nV - É condição de elegibilidade, na forma da lei, a idade mínima de dezoito anos para vereador.\n\nEstá incorreto o que consta apenas em:\n\nA) I e II.\nB) I, III e IV.\nC) II, IV, e V.\nD) III, IV e V.\nE) I, II, III e V.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 14, § 1º, II, 'a', CF/88: para o analfabeto, o alistamento eleitoral <b>e</b> o voto são <b>facultativos</b> — portanto I e II estão incorretas. As demais (III, IV, V) estão corretas nos termos do art. 14, § 2º e § 3º.","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q4","bloco":"MÓDULO 6 — Direitos Políticos e Sociais","num":"Ex.4","tema":"","enun":"Em uma cidade, diversas mães não conseguem vaga em creche municipal para seus filhos. O Defensor Público deve:\n\nA) orientar as mães a procurarem o serviço de assistência social do Município.\nB) informar que é possível a propositura de ação civil pública e encaminhar as mães para o Ministério Público.\nC) orientar as mães a se organizarem e a denunciarem na Ouvidoria Municipal.\nD) ajuizar ação judicial com base no direito à educação que compreende o atendimento em creche e pré-escola, pois a \"reserva do possível\" não pode ser oponível à realização do \"mínimo existencial\".\nE) fazer o encaminhamento às Assistência Social.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O direito à educação em creche/pré-escola (art. 208, IV, CF/88) é prestação estatal impositiva do mínimo existencial. O STF pacificou (RE 1.008.166) que a \"reserva do possível\" não pode ser oposta pelo Estado quando há omissão na garantia do mínimo existencial.","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q5","bloco":"MÓDULO 6 — Direitos Políticos e Sociais","num":"Ex.5","tema":"","enun":"Constituem direitos sociais previstos na Constituição da República, exceto:\n\nA) alimentação.\nB) atividade sexual.\nC) proteção à maternidade.\nD) trabalho.\nE) previdência social.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 6º, CF/88: são direitos sociais a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, a assistência aos desamparados. Atividade sexual não consta.","repete":false,"repeteRef":"","coment":[]},{"id":"M6-Q6","bloco":"MÓDULO 6 — Direitos Políticos e Sociais","num":"Ex.6","tema":"","enun":"São direitos sociais de acordo com a CF/88:\n\nA) a educação, a saúde, a proteção à maternidade e à infância.\nB) o trabalho, a previdência social, a anistia e o salário família.\nC) a moradia, o lazer, a segurança e o habeas corpus.\nD) o salário mínimo, as férias e a assistência aos desamparados.\nE) a eutanásia e a redução da maioridade penal.","gab":"A","gabLabel":"","html":"<p>Art. 6º, CF/88: educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, <b>proteção à maternidade e à infância</b>, assistência aos desamparados.</p><p>A alternativa A reúne itens expressamente listados no art. 6º. Anistia, habeas corpus, salário mínimo e férias pertencem a outros dispositivos.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q1","bloco":"MÓDULO 7 — Remédios Constitucionais","num":"Ex.1","tema":"","enun":"Diretor de sociedade de economia mista da qual o Município participa pratica ato lesivo ao patrimônio da empresa. A anulação do ato pode ser pleiteada:\n\nA) em ação popular proposta por qualquer pessoa residente no País.\nB) em ação popular proposta por qualquer cidadão.\nC) apenas pelos que foram prejudicados pelo ato.\nD) em Mandado de Segurança impetrado por qualquer pessoa residente no Município.\nE) Em Mandado de Injunção impetrado por qualquer pessoa.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, LXXIII, CF/88: qualquer <b>cidadão</b> (não qualquer pessoa) é parte legítima para propor ação popular que vise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe. Cidadão = titular de direitos políticos.","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q2","bloco":"MÓDULO 7 — Remédios Constitucionais","num":"Ex.2","tema":"","enun":"Um cidadão descobre que seus dados da declaração do IR encontram-se disponíveis para todos os internautas no site da Receita Federal. Para retirar os dados daquela página, pode ingressar em juízo com:\n\nA) mandado de segurança.\nB) habeas data.\nC) mandado de injunção.\nD) ação popular.\nE) habeas-corpus.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A retirada da publicação indevida de dados fiscais constitui tutela para cessar ato ilegal de autoridade que viola direito líquido e certo à intimidade e ao sigilo fiscal (art. 5º, LXIX, CF/88) — cabível <b>Mandado de Segurança</b> (conforme gabarito oficial UNIP).","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q3","bloco":"MÓDULO 7 — Remédios Constitucionais","num":"Ex.3","tema":"","enun":"A Reforma Administrativa determinou que a fixação do subsídio dos ministros do STF será realizada por lei de iniciativa conjunta. Não tendo esta lei sido promulgada, a inércia das autoridades responsáveis:\n\nA) não poderá ser suprida pelo mandado de injunção.\nB) poderá ser suprida por mandado de injunção, medida hábil a instrumentar o exercício de direitos decorrentes da ausência de norma regulamentadora.\nC) poderá ser suprida por meio de ação direta de inconstitucionalidade por omissão, a ser proposta por qualquer servidor público prejudicado.\nD) poderá ser objeto de ação declaratória de constitucionalidade.\nE) poderá ser suprida por meio de Mandado de Segurança por tratar-se de direito líquido e ainda incerto.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, LXXI, CF/88: concede-se mandado de injunção sempre que a <b>falta de norma regulamentadora</b> torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania.","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q4","bloco":"MÓDULO 7 — Remédios Constitucionais","num":"Ex.4","tema":"","enun":"Ao direito à probidade da administração pública a Constituição Federal consagra uma garantia:\n\nA) habeas corpus.\nB) habeas data.\nC) ação popular.\nD) mandado de injunção.\nE) mandado de segurança.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, LXXIII, CF/88: a <b>ação popular</b> é o remédio constitucional vocacionado à proteção da moralidade e probidade administrativas contra atos lesivos ao patrimônio público.","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q5","bloco":"MÓDULO 7 — Remédios Constitucionais","num":"Ex.5","tema":"","enun":"O Presidente de uma Associação de Amigos de Bairro foi detido por Delegado de Polícia durante manifestação contrária à decisão do Executivo, sob alegação de incitação ao crime e desacato. Com vistas ao desfazimento do ato da autoridade policial, seria possível a impetração de:\n\nA) habeas data.\nB) ação popular.\nC) mandado de segurança.\nD) habeas corpus.\nE) mandado de injunção.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 5º, LXVIII, CF/88: conceder-se-á <b>habeas corpus</b> sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção, por ilegalidade ou abuso de poder.","repete":false,"repeteRef":"","coment":[]},{"id":"M7-Q6","bloco":"MÓDULO 7 — Remédios Constitucionais","num":"Ex.6","tema":"","enun":"Julgue os seguintes itens:\n\nI - Caberá mandado de segurança, dentre outras hipóteses, contra ilegalidade ou abuso de poder praticado por agente de pessoa jurídica no exercício de atribuições do Poder Público.\nII - Conceder-se-á mandado de injunção para a retificação de dados, quando não se prefira fazê-lo, na ausência de norma regulamentar, por processo sigiloso, judicial ou administrativo.\n\nA) as duas assertivas são corretas.\nB) as duas assertivas são falsas.\nC) somente I é correta.\nD) somente II é correta.\nE) as duas assertivas são corretas e a segunda não justifica a primeira.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Assertiva I correta: reproduz o art. 5º, LXIX, CF/88 (cabimento de MS contra ato de agente no exercício de atribuições públicas). Assertiva II incorreta: a retificação de dados pessoais em bancos públicos é tutelada por <b>habeas data</b> (art. 5º, LXXII, \"b\"), não por mandado de injunção.","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q1","bloco":"MÓDULO 8 — Sistema Internacional de Proteção aos Direitos Humanos","num":"Ex.1","tema":"","enun":"Analise as assertivas abaixo:\n\nI - A proteção dos direitos humanos no âmbito internacional se divide em três planos, quais sejam, global, regional e setorial.\nII - O Plano global de proteção internacional dos direitos humanos considera os tratados aprovados no âmbito das Nações Unidas e de suas instituições.\n\nAssinale a alternativa correta:\n\nA) I e II são falsas.\nB) somente I é correta.\nC) somente II é correta.\nD) I e II são verdadeiras e a segunda justifica a primeira.\nE) I e II são verdadeiras e a segunda não justifica a primeira.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>De acordo com o conteúdo do Módulo 8, a proteção internacional dos DH se divide em <b>dois</b> planos (global e regional) — tornando I falsa. II é verdadeira: o plano global abrange os tratados aprovados no âmbito das Nações Unidas e suas instituições especializadas.","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q2","bloco":"MÓDULO 8 — Sistema Internacional de Proteção aos Direitos Humanos","num":"Ex.2","tema":"","enun":"O Plano regional de proteção aos direitos humanos no âmbito internacional é exercido por organizações internacionais de limitação geográfica, quais sejam:\n\nA) Organização das Nações Unidas e Mercosul.\nB) Mercosul e Mercado Comum Europeu.\nC) Brics - Brasil, Rússia, Índia, China e África do Sul.\nD) Mercado Comum Europeu e ONU.\nE) União Europeia, União Africana e Organização dos Estados Americanos.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Os sistemas regionais de proteção aos direitos humanos são representados pela <b>Organização dos Estados Americanos</b> (Sistema Interamericano), pela <b>União Europeia</b> (Sistema Europeu) e pela <b>União Africana</b> (Sistema Africano).","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q3","bloco":"MÓDULO 8 — Sistema Internacional de Proteção aos Direitos Humanos","num":"Ex.3","tema":"","enun":"__________ teve sua criação ao final da 2ª Guerra Mundial (1945) com os objetivos de promover a paz e o respeito aos direitos humanos e às liberdades fundamentais para todos, sem distinção de raça, sexo, língua ou religião.\n\nEstamos falando:\n\nA) da ONU.\nB) da Corte Interamericana.\nC) do Tribunal Penal Internacional.\nD) do Estatuto de Roma.\nE) do Pacto de San José da Costa Rica.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A <b>Organização das Nações Unidas (ONU)</b> foi criada em 1945, ao término da Segunda Guerra Mundial, com o propósito primordial de assegurar a paz internacional e o respeito universal aos direitos humanos, conforme sua Carta fundacional.","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q4","bloco":"MÓDULO 8 — Sistema Internacional de Proteção aos Direitos Humanos","num":"Ex.4","tema":"","enun":"O Sistema Interamericano de Proteção aos Direitos Humanos é formado:\n\nA) pela Convenção Americana sobre os Direitos Humanos (Pacto de San José da Costa Rica).\nB) pela Comissão Interamericana de Direitos Humanos e pela Corte Interamericana de Direitos Humanos.\nC) exclusivamente pela Corte Interamericana de Direitos Humanos.\nD) pelo Estatuto de Roma.\nE) pelo Tribunal Penal Internacional.","gab":"B","gabLabel":"","html":"<p>O Sistema Interamericano de Proteção aos DH é integrado por <b>dois órgãos</b>: a <b>Comissão Interamericana de Direitos Humanos</b> (função consultiva, investigativa e de promoção) e a <b>Corte Interamericana de Direitos Humanos</b> (função jurisdicional contenciosa e consultiva), ambos previstos no Pacto de San José da Costa Rica.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M8-Q5","bloco":"MÓDULO 8 — Sistema Internacional de Proteção aos Direitos Humanos","num":"Ex.5","tema":"","enun":"Assinale a alternativa que não contém uma função da Comissão Interamericana de Direitos Humanos:\n\nA) formular recomendações aos Estados sobre o cumprimento dos direitos humanos.\nB) solicitar informações aos Estados sobre o cumprimento de direitos e garantias.\nC) resolver consultas dos Estados sobre direitos humanos.\nD) apresentar um relatório anual à Assembleia da OEA.\nE) condenar o Estado ao pagamento de compensação à vítima.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Condenar o Estado ao pagamento de compensação é função da <b>Corte Interamericana</b> (competência jurisdicional condenatória). A Comissão tem atribuições consultivas, de promoção, investigação e relatórios — não possui competência jurisdicional decisória direta.","repete":false,"repeteRef":"","coment":[]}],"sinteses":[],"cards":[{"id":"c1","f":"Quais são as três gerações dos direitos fundamentais e seus conteúdos principais?","v":"<ul><li>1ª = individuais/liberdades negativas (Estado não faz)</li><li>2ª = sociais/prestações positivas (Estado faz)</li><li>3ª = solidariedade/difusos (meio ambiente, paz).</li></ul>"},{"id":"c2","f":"Os direitos fundamentais são absolutos? Quais características possuem?","v":"Não são absolutos — são <i>relativos</i>. Também são: imprescritíveis, inalienáveis, invioláveis, universais, efetivos, concorrentes."},{"id":"c3","f":"O rol de direitos fundamentais do Título II da CF/88 é exaustivo ou exemplificativo?","v":"Exemplificativo (art. 5º, §2º — cláusula de abertura). Outros direitos fora do Título II também podem ser fundamentais."},{"id":"c4","f":"Qual o quórum para tratado de DH ter status de Emenda Constitucional (EC 45/2004)?","v":"Aprovação em <b>dois turnos</b>, por <b>três quintos</b> dos votos dos membros de ambas as casas do Congresso Nacional."},{"id":"c5","f":"Qual o status dos tratados de DH incorporados ANTES da EC 45/2004?","v":"Status de <b>supralegalidade</b> — acima das leis ordinárias, abaixo da CF. Ex: Pacto San José da Costa Rica."},{"id":"c6","f":"Qual o marco histórico da proteção internacional dos direitos humanos?","v":"Declaração Universal dos Direitos do Homem, assinada em Paris em <b>10 de dezembro de 1948</b>."},{"id":"c7","f":"A dignidade da pessoa humana é um direito fundamental ou um fundamento da República?","v":"<b>Fundamento</b> da República Federativa do Brasil (art. 1º, III CF), não mero direito fundamental."},{"id":"c8","f":"A pena de morte é admitida no Brasil? Em que caso?","v":"Vedada em regra; admitida apenas em <b>caso de guerra declarada</b> (art. 5º, XLVII, \"a\" CF). Cláusula pétrea — nem EC pode extingui-la ou ampliá-la em tempo de paz."},{"id":"c9","f":"A eutanásia é permitida no ordenamento jurídico brasileiro?","v":"Não. Configura <b>homicídio</b> (art. 121 CP) ou auxílio ao suicídio (art. 122 CP). Não está prevista em lei."},{"id":"c10","f":"Limitação de idade em concurso público: quando é legítima?","v":"Somente quando justificada pela <b>natureza das atribuições do cargo</b> (Súmula 683 STF). Limite genérico = inconstitucional (viola art. 5º, caput e art. 7º, XXX CF)."},{"id":"c11","f":"A liberdade de profissão (art. 5º, XIII CF) é norma de que eficácia?","v":"<b>Eficácia contida</b> — lei infraconstitucional pode restringir, fixando condições/requisitos (ex: Exame de Ordem, constitucional conforme STF)."},{"id":"c12","f":"Quem é brasileiro nato segundo a CF/88? (critérios)","v":"(a) nascido no Brasil, salvo pais estrangeiros a serviço do país deles; (b) nascido no exterior, pais brasileiros a serviço do Brasil; (c) nascido no exterior, pais brasileiros, com registro em repartição ou residência no Brasil + opção após maioridade."},{"id":"c13","f":"Cite os 7 cargos privativos de brasileiro nato (art. 12, §3º CF).","v":"Presidente e VP da República; Presidente da Câmara; Presidente do Senado; Ministro do STF; carreira diplomática; oficial das Forças Armadas; Ministro de Estado da Defesa."},{"id":"c14","f":"O brasileiro naturalizado pode ser extraditado? Em quais casos?","v":"<ol><li>crime comum praticado <b>antes</b> da naturalização</li><li>comprovado envolvimento em tráfico de entorpecentes. Brasileiro nato: <b>nunca</b>.</li></ol>"},{"id":"c15","f":"Cite os direitos sociais do art. 6º CF (rol completo).","v":"Educação, saúde, alimentação, trabalho, moradia, <b>transporte</b>, lazer, segurança, previdência social, proteção à maternidade e à infância, assistência aos desamparados."},{"id":"c16","f":"Diferença entre PERDA e SUSPENSÃO dos direitos políticos.","v":"<b>Perda</b>: cancelamento da naturalização; recusa de obrigação imposta + prestação alternativa; perda da nacionalidade. <b>Suspensão</b>: incapacidade civil absoluta; condenação criminal transitada em julgado; improbidade administrativa."},{"id":"c17","f":"O analfabeto tem alistamento eleitoral e voto obrigatórios?","v":"Não — ambos são <b>facultativos</b> para o analfabeto (art. 14, §1º, II, 'a' CF). O analfabeto é inelegível."},{"id":"c18","f":"Qual remédio constitucional protege dados expostos indevidamente ao público (não retificação)?","v":"<b>Mandado de Segurança</b> (direito líquido e certo à intimidade — ato ilegal da autoridade). Habeas Data serve apenas para <i>acessar/retificar</i> dados em banco de dados de órgão público."},{"id":"c19","f":"Quem pode propor Ação Popular?","v":"Somente <b>cidadão</b> (brasileiro nato ou naturalizado em pleno gozo dos direitos políticos, com título de eleitor). Excluem-se estrangeiros, pessoas jurídicas e quem tem direitos políticos suspensos/perdidos."},{"id":"c20","f":"Qual a diferença entre Comissão Interamericana e Corte Interamericana de Direitos Humanos?","v":"<b>Comissão</b>: sem poder jurisdicional; sede Washington; 7 membros / 4 anos; faz recomendações e encaminha casos à Corte. <b>Corte</b>: tem poder jurisdicional; pode condenar Estado a pagar compensação; Brasil aceitou competência a partir de 10/12/1998. e"}],"cobertura":["São 47 questões distribuídas em 12 módulos, com enunciado completo e gabarito fundamentado.","Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."],"notas":[]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["D55B"]={"cod":"D55B","revisao":
