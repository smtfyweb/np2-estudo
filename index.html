s do Processo", "num": "Ex.17", "tema": "", "enun": "Não existe um padrão absoluto para princípios. Igualmente, nenhum princípio é absoluto e sempre se verá confrontado por outros princípios que podem, naquela ocasião, levar a afastar temporariamente sua incidência. Todavia, existe um princípio que é o ponto de partida de todo o Processo Civil brasileiro e que determina a forma de ver todo o ordenamento jurídico responsabilizando-se pela coerência do ordenamento jurídico e, acima de tudo, pela preservação dos Direitos e Garantias Fundamentais. Dos exemplos abaixo, qual deles retrata corretamente esse princípio:\n\nA) O Princípio da Inafastabilidade da Jurisdição;\nB) O Princípio do Juiz Natural;\nC) O Princípio da Ampla Defesa e da Celeridade Processual;\nD) O Princípio da Tutela Constitucional do Processo (Supremacia da Constituição);\nE) O Princípio da Isonomia;", "gab": "D", "gabLabel": "", "html": "A Tutela Constitucional do Processo (Supremacia da CF) constitui a norma-matriz de todo o direito processual (Item 4.1 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q18", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.18", "tema": "", "enun": "Chega ao seu escritório Joãozinho. Ele lhe mostra um extrato da conta bancária em que apresenta a existência de uma penhora online (BACENJUD), ou seja, por ordem de um Juiz de Direito todos os valores existentes em sua conta foram penhorados para pagar uma dívida. Joãozinho, porém, explica que jamais contraira dívida alguma e que nunca fora citado, intimado ou comunicado sobre a existência de qualquer processo. Você, na consulta, descobre que existia um processo contra ele, mas que em momento algum o Juiz ordenou a citação de Joãozinho, sentenciando, condenando e executando todo o processo sem ouvir uma única vez o Joãozinho. Nesse cenário, quais princípios foram violados pelo Juiz:\n\nA) O Princípio da Ampla Defesa e do Contraditório;\nB) O Princípio da Isonomia;\nC) O Princípio do Devido Processo Legal;\nD) Todas as anteriores estão corretas;\nE) Todas as anteriores estão erradas;", "gab": "D", "gabLabel": "", "html": "A ausência de citação e a expropriação sumária sem contraditório desrespeitam frontalmente o devido processo legal, a ampla defesa, o contraditório e a isonomia processual (Item 4.4 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q19", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.19", "tema": "", "enun": "O Art. 5º. [...] LVI estabelece que \"são inadmissíveis, no processo, as provas obtidas por meios ilícitos;\". Trata-se do princípio da vedação da utilização das provas ilícitas que, por muito tempo, foi entendida como absoluta, ou seja, que em nenhuma ocasião poderá prevalecer o uso de provas ilícitas. No entanto, vem ganhando força uma corrente interemediária que se levanta com o contraponto da proporcionalidade. Essa corrente entende que existem justificativas - inerentes à inexistência de força absoluta dos princípios - que permitam o uso da prova ilícita para preservar outro direito fundamental que sem aquela prova ilícita seria ofendido. Qual é a exceção utilizada como exemplo pela corrente acima:\n\nA) De acordo com o art. 369, do CPC15, as provas além de lícitas precisam ser também moralmente legítimas, então, a única exceção plausível é a utilização por outrem de dados obtidos em aparelho celular sem autorização do dono do celular ou determinação judicial...\nB) A prova obtida ilicitamente que sirva para inocentar uma pessoa de uma condenação penal.\nC) Colheita de DNA sem autorização da parte ou judicial para investigation de paternidade.\nD) Não existem exceções.\nE) O princípio da vedação da prova ilícita é extremamente flexível...", "gab": "B", "gabLabel": "", "html": "Exemplo clássico doutrinário da aplicação do princípio da proporcionalidade <i>pro reo</i> para ponderar a inviolabilidade de prova ilícita em prol do direito fundamental à liberdade (Item 4.6 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q20", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.20", "tema": "", "enun": "Sun Tzu em A Arte da Guerra defendeu que uma guerra longa demais é ruim para todas as partes envolvidas. Transportando a mensagem em analogia para o processo civil (espaço em que as partes debatem suas posições sobre um determinado direito), essa mensagem de Sun Tzu representa qual princípio constitucional:\n\nA) Economia Processual;\nB) Duplo grau de jurisdição;\nC) Razoável Duração do Processo;\nD) Juiz Natural;\nE) Todas estão corretas;", "gab": "C", "gabLabel": "", "html": "Transcrição exata da lição trazida no Item 4.12 do Módulo 4 a respeito do Princípio da Razoável Duração do Processo (art. 5º, LXXVIII, CF/88).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q1", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.1", "tema": "", "enun": "São princípios informativos do processo civil:\n\nA) economia processual, oralidade e da cooperação.\nB) individualização da pena, duração razoável do processo, livre investigação das provas.\nC) presunção de inocência, direito ao juiz natural, inércia.\nD) domínio do fato, vedação à prova ilícita, contraditório e ampla defesa.\nE) anualidade, motivação das decisões judiciais, isonomia processual.", "gab": "A", "gabLabel": "", "html": "Os princípios da economia processual, oralidade e cooperação constituem vetores informativos do procedimento previstos na legislação infraconstitucional (Itens 5.1, 5.2 e 5.6 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q2", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.2", "tema": "", "enun": "Como regra geral no CPC antigo, o juiz que colheu prova oral em audiência fica vinculado ao julgamento do processo. Esta norma referia-se ao princípio da:\n\nA) persuasão racional.\nB) adstrição ou congruência.\nC) isonomia processual.\nD) concentração dos atos processuais.\nE) identidade física do juiz.", "gab": "E", "gabLabel": "", "html": "Trata-se do Princípio da Identidade Física do Juiz (antigo art. 132 do CPC/73, mitigado no CPC/15), exposto no Item 5.4 do Módulo 5.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q3", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.3", "tema": "", "enun": "Em matéria de defesa, entende-se por princípio da eventualidade:\n\nA) o dever do réu de alegar, na contestação, toda a matéria que lhe aproveita, sob pena de preclusão.\nB) a faculdade do réu de apresentar reconvenção em substituição à contestação.\nC) a prerrogativa do réu de não ser compelido a produzir prova contra si.\nD) a garantia do exercício do contraditório, caso o autor apresente novos documentos, na fase de instrução processual.\nE) n.d.a.", "gab": "A", "gabLabel": "", "html": "Conforme o art. 336 do CPC/15 e o Item 5.3 do Módulo 5, o princípio da eventualidade (concentração da defesa) exige a alegação de toda a matéria de defesa na contestação.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q4", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.4", "tema": "", "enun": "Compete ao réu alegar, na contestação, toda a matéria de defesa, expondo as razões de fato e de direito, com que impugna o pedido do autor e especificando as provas que pretende produzir. Esse enunciado legal concerne ao princípio;\n\nA) constitucional da produção da prova lícita.\nB) processual da livre investigação probatória.\nC) processual da eventualidade.\nD) constitucional da isonomia.\nE) processual da adstrição ou congruência.", "gab": "C", "gabLabel": "", "html": "Literalidade do art. 336 do CPC/15, que expressa o Princípio Processual da Eventualidade (Item 5.3 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q5", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.5", "tema": "", "enun": "Pelo princípio da eventualidade, deve o:\n\nA) réu comportar-se de modo leal no processo, salvo eventual contraposição à má-fé processual do autor.\nB) juiz aproveitar os atos processuais, ainda que praticados por forma equivocada, se atingiram sua finalidade e não houve prejuízo à parte adversa.\nC) juiz fundamentar cada tópico da sentença, para a hipótese de interposição de eventual recurso de apelação.\nD) juiz ater-se ao pedido formulado, ao proferir sentença, salvo eventual matéria aferível de ofício.\nE) réu alegar toda a defesa que tiver contra o autor, na contestação, de forma especificada.", "gab": "E", "gabLabel": "", "html": "O princípio da eventualidade impõe ao réu a dedução de todas as suas razões defensivas, de forma especificada e simultânea, no momento da contestação (Item 5.3 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q6", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.6", "tema": "", "enun": "O Código de Processo Civil prevê que o comparecimento espontâneo do réu aos autos supre a falta de sua citação. Nessa norma vislumbra-se o princípio processual:\n\nA) da economia.\nB) da eventualidade.\nC) da congruência ou adstrição.\nD) da persuasão racional.\nE) do livre convencimento do juiz.", "gab": "A", "gabLabel": "", "html": "O suprimento da citação pelo comparecimento espontâneo (art. 239, § 1º, do CPC/15) atende ao Princípio da Economia Processual, evitando atos repetitivos inúteis (Item 5.2 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q7", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.7", "tema": "", "enun": "Em relação aos princípios fundamentais do processo civil, o:\n\nA) pelo princípio da oralidade todos os atos processuais devem ser praticados de forma oral.\nB) da eventualidade é o que determina ao réu a interposição de reconvenção ou de pedido contraposto.\nC) da congruência é o que determina ao autor que só cumule pedidos coerentes entre si.\nD) inquisitivo é o que dá às partes a liberdade de instauração e impulso processuais.\nE) da demanda é o que determina que nenhum juiz prestará a tutela jurisdicional senão quando requerida pela parte.", "gab": "E", "gabLabel": "", "html": "Conforme o art. 2º do CPC/15 e o Item 5.7 do Módulo 5, o princípio da demanda (ou dispositivo/inércia da jurisdição) estabelece que a atuação do juiz depende de prévia provocação da parte.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q8", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.8", "tema": "", "enun": "São Princípios Constitucionais do Processo Civil:\nI. Princípio da Inafastabilidade da Jurisdição.\nII. Princípio do Juiz Natural.\nIII. Princípio da Inadmissibilidade de Provas Ilícitas.\nIV. Princípio da Fundamentação das decisões.\nV. Princípio da Celeridade Processual.\n\nA) II e III estão incorretas.\nB) III, IV e V estão incorretas.\nC) Apenas I, II e III estão corretas.\nD) Todas estão corretas.\nE) Todas estão erradas.", "gab": "D", "gabLabel": "", "html": "Todos os itens de I a V têm assento na Constituição Federal de 1988 (art. 5º, XXXV, XXXVII, LVI, LXXVIII e art. 93, IX).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q9", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.9", "tema": "", "enun": "Segundo o art. 5°, inciso XXXV, da Constituição Federal, a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito. Esta regra consagra o princípio:\n\nA) da indelegabilidade da jurisdição;\nB) da inafastabilidade da jurisdição;\nC) do juiz natural;\nD) da inevitabilidade da jurisdição;\nE) da indeclinabilidade.", "gab": "B", "gabLabel": "", "html": "Expressa o Princípio da Inafastabilidade da Jurisdição ou Acesso à Justiça (art. 5º, XXXV, CF/88; Item 4.2 do Módulo 4 e remissão no Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q10", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.10", "tema": "", "enun": "O princípio geral do processo que atribui às partes toda a iniciativa, seja na instauração do processo, seja no seu impulso, é o princípio:\n\nA) do devido processo legal.\nB) inquisitivo.\nC) dispositivo.\nD) da eventualidade.\nE) da verdade real.", "gab": "C", "gabLabel": "", "html": "O princípio dispositivo (ou da iniciativa da parte) determina que a jurisdição é inerte e depende de provocação do interessado (art. 2º do CPC/15).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q11", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.11", "tema": "", "enun": "O artigo 6º do CPC aponta que “todos os sujeitos do processo devem cooperar entre si para que se obtenha, em tempo razoável, decisão de mérito justa e efetiva.” Tal dispositivo legal aponta para o princípio\n\nA) da economia.\nB) da oralidade.\nC) da cooperação.\nD) da publicidade.\nE) da identidade física do juiz.", "gab": "C", "gabLabel": "", "html": "O art. 6º do CPC/15 positivou expressamente o Princípio da Cooperação entre todos os sujeitos do processo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q12", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.12", "tema": "", "enun": "Acerca dos princípios do procedimento e do processo civil, assinale a alternativa correta.\n\nA) A eventualidade constitui exemplo de princípio constitucional do processo civil.\nB) A oralidade constitui exemplo de princípio informador e fundamental inerente à jurisdição.\nC) Consoante os postulados do princípio do dispositivo, o réu, na contestação, de uma só vez, deve formular as defesas de que dispõe.\nD) O duplo grau de jurisdição constitui exemplo de princípio relativo ao procedimento.\nE) O direito da parte de participar do contraditório pode ser alcançado pela preclusão.", "gab": "E", "gabLabel": "", "html": "O contraditório é um direito fundamental processual, mas seu exercício pelas partes sujeita-se a prazos fatais; o não exercício na oportunidade própria enseja a preclusão temporal ou consumativa (Item 5.3 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q13", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.13", "tema": "", "enun": "Joãozinho e Mariazinha fizeram um acordo no processo com fundamento no art. 190, do CPC15, estabelecendo, entre outros pontos, que Joãozinho pagará à Mariazinha o valor de R$ 10.000,00 (Dez mil reais) em 10 (dez) parcelas de R$ 1.000,00 (Hum mil reais). No entanto, chegado o dia do pagamento da primeira parcela (que se daria apenas cinco dias depois de protocolado o acordo), Joãozinho viu-se sem o dinheiro que prometeu pagar e, para protelar, resolveu recorrer da decisão que Homologou o acordo, ou seja, da decisão que julgou válido o acordo, e interpôs o Recurso de Apelação alegando que o prazo fixado para pagamento era muito curto. Além de ter seu recurso não conhecido, Joãozinho foi condenado a pagar uma multa. Com vistas desse quadro, quais dos princípios abaixo retratam corretamente o princípio de Joãozinho violou:\n\nA) A Boa-fé e da Cooperação;\nB) Da Eventualidade e do Duplo grau de jurisdição;\nC) Da Primazia do mérito e da Oralidade;\nD) Da identidade Física do Juiz e do Dispositivo;\nE) Do Inquisitivo e da Preclusão;", "gab": "A", "gabLabel": "", "html": "Ao recorrer da homologação de um acordo firmado por ele próprio com a finalidade de postergar a obrigação, a parte adota comportamento contraditório (<i>venire contra factum proprium</i>), violando os princípios da Boa-Fé e da Cooperação (arts. 5º e 6º do CPC/15; Itens 5.5 e 5.6 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q14", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.14", "tema": "", "enun": "Quais dos brocardos abaixo não retrata o princípio da boa-fé:\n\nA) Venire contra factum proprium;\nB) Suppressio;\nC) Surrectio;\nD) Pacta Sunt Servanda;\nE) Tu quoque;", "gab": "D", "gabLabel": "", "html": "Conforme expressamente elencado no Item 5.5 do Módulo 5, as figuras desdobradas da boa-fé objetiva incluem <i>venire contra factum proprium</i>, <i>suppressio</i>, <i>surrectio</i> e <i>tu quoque</i>. O brocardo <i>pacta sunt servanda</i> (força obrigatória dos contratos) é vetor contratual tradicional, não uma vertente específica da boa-fé objetiva processual.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q15", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.15", "tema": "", "enun": "Joãozinho firmara um contrato com Mariazinha para que ela realizasse, mediante pagamento em dinheiro, a pintura de uma quadro de família. No entanto, Mariazinha nunca entregou o quadro mesmo recebendo o valor devido e, por isso, Joãozinho viu-se obrigado a acionar a Mariazinha no Poder Judiciário cobrando a devolução do dinheiro ou a entrega do serviço contratado. No entanto, infelizmente, por um lapso e por Mariazinha ter um nome muito comum no Brasil, na qualificação acabou errando a digitação no número de CPF da Mariazinha e acabou chamando para o processo pessoa que nunca viu. Citada, essa Maria erroneamente incluída informou o erro de Joãozinho e solicitou ao juiz que a retirasse do processo e chamasse a Mariazinha correta que foi prontamente deferido pelo juiz conforme determina o art. 338, Parágrafo Único do CPC15. Qual princípio do processo civil retrata corretamente o evento acima:\n\nA) Duplo Grau de Jurisdição;\nB) Ampla Defesa e Contraditório;\nC) Devido Processo Legal;\nD) Razoável Duração do Processo;\nE) Primazia do Mérito;", "gab": "E", "gabLabel": "", "html": "A retificação do polo passivo (art. 338 do CPC/15) para evitar a extinção sem resolução do mérito é aplicação direta do Princípio da Primazia da Decisão de Mérito (Item 5.8 do Módulo 5).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q16", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.16", "tema": "", "enun": "No Código de Processo Civil revogado (de 1973) havia o art. 132 que dizia \"O juiz, titular ou substituto, que concluir a audiência julgará a lide, salvo se estiver convocado, licenciado, afastado por qualquer motivo, promovido ou aposentado, casos em que passará os autos ao seu sucessor\", complementando em seu parágrafo único que \"Em qualquer hipótese, o juiz que proferir a sentença, se entender necessário, poderá mandar repetir as provas já produzidas\". Tal dispositivo não foi replicado no Novo CPC15, fazendo-se crer que os princípios aí protegidos tivessem sido excluídos definitivamente do Novo Código. No entanto, o art. 366, do Novo CPC15 dispôs que: \"Encerrado o debate ou oferecidas as razões finais, o juiz proferirá sentença em audiência ou no prazo de 30 (trinta) dias\" demonstrando, finalmente, que não houve uma revogação ou exclusão total, mas apenas uma mitigação de tais princípios. Sobre quais princípios falam o enunciado acima:\n\nA) Da Cooperação e Boa-fé;\nB) Da mihi factum dabo tibi ius;\nC) Da Oralidade e Identidade Física do Juiz;\nD) Dormientibus non sucurrit ius;\nE) Todas as anteriores estão erradas;", "gab": "C", "gabLabel": "", "html": "Transcrição das fundamentações dos Itens 5.1 e 5.4 do Módulo 5, demonstrando a preservação mitigada do Princípio da Oralidade e do Subprincípio da Identidade Física do Juiz no CPC/15.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q17", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.17", "tema": "", "enun": "Nada dura para sempre e o tempo é um bem precioso tanto para a parte, como para o Poder Judiciário e, por isso, é necessário que o processo mantenha uma marcha para frente e evite-se regressos inúteis ou resultantes de má-condução anterior, como, por exemplo, a necessidade de fazer nova sentença porque a primeira estava contaminada por vício de falta de citação. Dois princípios informativos do processo civil são fundamentais para a interpretação do Código de Processo Civil nesse sentido, quais são:\n\nA) O Princípio do Dispositivo e do Inquisitivo, sendo lícito ao Juiz instaurar o processo de ofício para agilizar;\nB) O Princípio da Ampla Defesa e do Devido Processo Legal, permitindo ao Juiz e as Partes retirarem parte do processo que julgarem inúteis como o Direito de Interpor Embargos de Declaração;\nC) Suppressio e Surrectio, uma vez que a boa-fé e a cooperação impõe uma marcha sempre para frente do processo;\nD) Os Princípios da Eventualidade e da Economia, pois o primeiro impõe que o processo siga sempre para frente evitando retorno desnecessários e o segundo impõe o dever de que os atos praticados sejam realizados de maneira correta e adequada para não ser necessário refazê-los;\nE) Todas as anteriores estão corretas;", "gab": "D", "gabLabel": "", "html": "Transcrição exata da lição trazida nos Itens 5.2 e 5.3 do Módulo 5 acerca do princípio da eventualidade (marcha para a frente) e da economia processual (máxima eficiência sem refazimento desnecessário).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q18", "bloco": "MÓDULO 5 — Princípios Informativos do Procedimento", "num": "Ex.18", "tema": "", "enun": "O CPC15 em seu artigo 2º determinou que \"O processo começa por iniciativa da parte e se desenvolve por impulso oficial, salvo as exceções previstas em lei\". O referido artigo refere-se a quais princípios:\n\nA) Lealdade e boa-fé;\nB) Dispositivo e Inquisitivo;\nC) Duplo Grau de Jurisdição e Razoável Duração do Processo;\nD) Dispositivo e Primazia do Mérito;\nE) Inquisitivo e Identidade Física do Juiz;", "gab": "B", "gabLabel": "", "html": "O art. 2º do CPC/15 sintetiza a convivência entre o Princípio Dispositivo (iniciativa da parte para instaurar o processo) e o Princípio Inquisitivo (impulso oficial promovido pelo juiz) - Item 5.7 do Módulo 5.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q1", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.1", "tema": "", "enun": "São duas as espécies de jurisdição civil. Uma contenciosa; outra voluntária. A diferença entre jurisdição civil contenciosa e voluntária é:\n\nI - que a contenciosa não implica propriamente um ato de julgar e a voluntária implica uma decisão;\n\nII - que, na voluntária, a intervenção do juiz tem por escopo julgar a contenda, impedindo que as partes façam justiça com as próprias mãos, enquanto que a contenciosa, também chamada de jurisdição graciosa, a intervenção do juiz garante, com a sua assistência, ou com a sua autorização, legitimidade de um ato de interesse privado;\n\nIII - que a jurisdição civil contenciosa implica numa decisão, quanto que a jurisdição civil voluntária não implica propriamente um ato de julgar ou de decidir;\n\nIV - que se subtende na contenciosa a não pré-existência de um litígio, ao contrário da voluntária que abrange uma contenda;\n\nV - decidir é próprio da jurisdição contenciosa, porquanto os atos decisórios, por intermédio dos quais a lide é encerrada, caracteriza a essência da jurisdição voluntária.\n\nAssinale a alternativa correta:\n\nA) Nenhuma das alternativas anteriores está correta;\nB) somente uma das alternativas está correta;\nC) somente duas alternativas estão corretas;\nD) somente três alternativas estão corretas;\nE) todas as alternativas estão corretas.", "gab": "B", "gabLabel": "", "html": "Apenas o item III está correto. A jurisdição contenciosa pressupõe lide (pretensão resistida) e busca a justa composição do conflito por meio de provimento decisório (sentença de mérito), ao passo que a jurisdição voluntária constitui administração pública de interesses privados executada pelo Judiciário (gestão de negócios jurídicos), na qual o juiz não resolve contenda nem exerce juízo de subsunção punitivo ou declaratório no sentido clássico de lide (Item 84 a 111 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q2", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.2", "tema": "", "enun": "As chamadas funções do Estado são justamente as tarefas ou atribuições fundamentais que o Estado tem de executar para realizar os seus fins. Foi Montesquieu quem melhor sistematizou a chamada “repartição dos poderes” estatais. Nossa Constituição Federal usa a palavra “poder” com o sentido de função, de forma que, por exemplo, onde está escrito “o Poder Legislativo” deve-se ler a função legislativa. O poder que emana do Estado é uno; as funções e os órgãos são distintos, ou seja, a separação dos poderes é uma técnica para distribuir funções distintas entre órgãos relativamente separados.\n\nNesse sentido, temos que a jurisdição (Poder Judiciário, que ao lado do Poder legislativo e Poder Executivo contemplam as funções estatais) é justamente a função estatal que tem a finalidade de garantir a eficácia do direito em última instância no caso concreto, ou seja, a atuação terminal do direito exercida, preponderantemente, pelos órgãos do Poder Judiciário, independentes e imparciais, compondo conflitos de interesses mediante a aplicação da lei através do devido processo legal.\n\nCabe ao Poder Judiciário, sem a possibilidade de transferir essa função para qualquer outro poder estatal, a função de compor definitivamente a lide. Entretanto, os órgãos jurisdicionais são, por sua própria índole inertes, ou seja, para atuação dos órgãos, necessária a devida provocação do interessado. Isso porque aos interessados, salvo expressa previsão legal, não é possível a resolução dos conflitos (lide) por eles mesmos, ou seja, o Judiciário é chamado a atuar, em lugar das partes, para que se ponha fim ao respectivo conflito, resultando na paz social. Aliás, o artigo 126 do Diploma Processual Civil Brasileiro determina que “o juiz não se exime de sentenciar ou despachar, alegando lacuna ou obscuridade da lei.”\n\nO texto em questão faz referência a vários princípios e características fundamentais da Jurisdição. São eles:\n\nA) inércia, inevitabilidade e substitutividade;\nB) inércia, indeclinabilidade e delegabilidade.\nC) inércia, insubstitutividade e inevitabilidade.\nD) Inércia, substituvidade e declinabilidade .\nE) nenhuma das alternativas anteriores.", "gab": "A", "gabLabel": "", "html": "O texto alude expressamente: 1) à inércia (\"os órgãos jurisdicionais são por sua própria índole inertes\"); 2) à substitutividade (\"o Judiciário é chamado a atuar em lugar das partes\"); e 3) à inevitabilidade/indeclinabilidade (\"sujeição imperativa das partes à composição do conflito\"). Ver Itens 42, 55 e 56 do Módulo 6.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q3", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.3", "tema": "", "enun": "Leia o texto abaixo com atenção e responda a questão a seguir:\n\nEm seu sentido próprio, a jurisdição compete apenas aos órgãos do Poder Judiciário, embora em direito administrativo também se fale em \"jurisdição administrativa\", bem como em \"jurisdição\" simplesmente como o limite da competência administrativa de um órgão público.\n\nDo ponto de vista da teoria da separação dos poderes, a jurisdição é a função precípua do Poder Judiciário, sendo-lhe acrescida, em alguns sistemas jurídicos nacionais, a função do controle de constitucionalidade.\n\nComo regra, a função jurisdicional é exercida somente diante de casos concretos de conflitos de interesses, quando provocada pelos interessados.\n\nNo sentido coloquial, a palavra jurisdição designa o território (estado ou província, município, região, país, países-membros etc.) sobre o qual este poder é exercido por determinada autoridade ou Juízo.\n\nO tema da jurisdição é objeto de estudo das disciplinas de direito constitucional, direito internacional privado, direito processual e direito administrativo, dentre outras.\n\nSobre jurisdição, assinale a resposta incorreta:\n\nA) A jurisdição é monopólio estatal. Entretanto, podem os interessados optar por meio não estatal de exercício da jurisdição, capaz de por fim à lide.\nB) A arbitragem, nos conflitos a ela submetidos por deliberação dos interessados, constitui exercício delegado da jurisdição, por isso se insere no conjunto dos meios para a solução da lide.\nC) A arbitragem, expressamente prevista em lei, não implica violação ao princípio da inafastabilidade do controle jurisdicional (CF, art. 5°, inc. XXXV).\nD) Na jurisdição voluntária, ao contrário da contenciosa, não há partes, porque não há controvérsia, antagonismos ou conflitos de interesses, apenas “interessados”.\nE) A jurisdição civil, contenciosa e voluntária é exercida somente pelo Poder Judiciário.", "gab": "E", "gabLabel": "", "html": "A afirmativa E é incorreta (devendo ser a opção assinalada) pois a jurisdição civil não é exercida exclusivamente pelo Poder Judiciário. A jurisdição voluntária também pode ser exercida extrajudicialmente em serventias notariais e de registro (cartórios de notas, como no divórcio, separação e inventário consensuais extrajudiciais - Lei nº 11.441/07 e arts. 610, § 1º e 733 do CPC/15), além da própria arbitragem (Lei nº 9.307/96 e art. 3º, § 1º do CPC/15), que ostenta natureza jurisdicional não...", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q4", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.4", "tema": "", "enun": "“A lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito”. Tal dispositivo consagra o princípio:\n\nA) do juiz natural;\nB) do remédio da jurisdição;\nC) da tutela jurisdicional;\nD) da isonomia perante a lei.\nE) inércia da jurisdição;", "gab": "C", "gabLabel": "", "html": "O art. 5º, XXXV, da Constituição Federal consagra o Princípio da Inafastabilidade do Controle Jurisdicional (ou Princípio do Direito à Tutela Jurisdicional), assegurando que o Poder Judiciário apreciará qualquer lesão ou ameaça a direito (Item 62 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q5", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.5", "tema": "", "enun": "A jurisdição, como poder ou função estatal, é una e abrange todos os litígios que se possam instaurar em torno de quaisquer assuntos de direito. A diferença de matéria jurídica a ser manipulada pelos juízes, na composição dos litígios, conduz à necessidade prática da especialização não só dos julgadores, como das próprias leis que regulam a atividade jurisdicional. Desta forma, o que não couber na jurisdição penal e nas jurisdições especiais, cabe a:\n\nA) jurisdição civil.\nB) jurisdição ordinária.\nC) jurisdição privada.\nD) jurisdição voluntária.\nE) jurisdição especial.", "gab": "A", "gabLabel": "", "html": "A jurisdição civil é definida por exclusão (ou residualidade): abrange todas as causas e litígios de natureza não penal que não estejam submetidos às jurisdições especiais (Trabalhista, Eleitoral e Militar). Ver Item 74 do Módulo 6.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q6", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.6", "tema": "", "enun": "É o poder, função ou atividade de aplicar o direito a um fato concreto, pelos órgãos públicos destinados a tal, obtendo a justa composição da lide. Poder, porque é a manifestação do poder estatal, porque atua cogentemente (manifestação de força) como manifestação de potestade do estado e o faz definitivamente em face das partes em conflito; função, porque cumpre a finalidade de fazer valer a ordem jurídica posta em dúvida em virtude de uma pretensão resistida; e atividade, porque consiste numa série de atos e manifestações externas de declaração de direitos e de concretização de obrigações consagradas num título. Trata-se:\n\nA) ação.\nB) processo.\nC) jurisdição.\nD) competência.\nE) nenhuma das anteriores.", "gab": "C", "gabLabel": "", "html": "O conceito transcrito no enunciado reproduz ipsis litteris a lição clássica de Vicente Greco Filho sobre a Jurisdição em seus três aspectos basilares: Poder, Função e Atividade (Item 8 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q7", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.7", "tema": "", "enun": "Este princípio corresponde à limitação da própria soberania nacional ao território do país. A jurisdição pressupõe um território em que ela é exercida. Os magistrados só têm autoridade nos limites territoriais do Estado. Além disso, como os juízes são muitos no mesmo País, distribuídos em comarcas (Justiças Estaduais) ou seções judiciárias (Justiça Federal), também se infere daí que cada juiz só exerce a sua autoridade nos limites do território sujeito por lei à sua jurisdição. Assim, por exemplo, o STF e o STJ exerce a jurisdição sobre todo o país, o Tribunal de Justiça de cada Estado-membro sobre o território deste. Atos fora do território em que o juiz exerce a jurisdição depende da cooperação do juiz do lugar (carta precatória e rogatória). Neste pensamento, o princípio da jurisdição é:\n\nA) da investidura.\nB) da inafastabilidade.\nC) da inevitabilidade.\nD) da aderência ao território.\nE) do duplo grau de jurisdição.", "gab": "D", "gabLabel": "", "html": "O Princípio da Aderência ao Território (ou Territorialidade) estabelece que os magistrados apenas possuem autoridade e poder de império dentro dos limites territoriais fixados por lei (Item 61 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q8", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.8", "tema": "", "enun": "Em relação à jurisdição, considere os seguintes princípios e características:\n\nI. As únicas soluções possíveis para a lide são por meio da jurisdição e pelos mecanismos alternativos da auto composição e da arbitragem.\n\nII. Pelo princípio da indeclinabilidade, a prestação jurisdicional não é discricionária e sim obrigatória para o Estado.\n\nIII. Pelo princípio da inevitabilidade, tem-se que a jurisdição é atividade pública que cria um estado de sujeição às partes do processo.\n\nIV. Nenhum juiz prestará a tutela jurisdicional senão quando a parte ou o interessado a requerer, nos casos e forma legais, é enunciado relativo ao princípio da indelegabilidade das atribuições típicas e refere-se à jurisdição contenciosa e voluntária.\n\nEstá correto o que se afirma apenas em:\n\nA) I e IV.\nB) II e III.\nC) I, II e III.\nD) I, II e IV.\nE) III e IV.", "gab": "B", "gabLabel": "", "html": "- I é incorreta: a autotutela permanece como meio excepcional admitido por lei (ex: desforço inconteste na posse, legítima defesa).   - II é correta: a indeclinabilidade obriga o Estado-juiz a prestar a tutela jurisdicional quando provocado.   - III é correta: a inevitabilidade vincula as partes ao império do processo independentemente de sua concordância.   - IV é incorreta: o brocardo refere-se ao princípio da inércia, e não da indelegabilidade. Ver Itens 55, 56 e 62 do Módulo 6.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q9", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.9", "tema": "", "enun": "Assinale a alternativa correta acerca da jurisdição e de sua natureza, seus princípios e suas características:\n\nA) A jurisdição, atividade de poder decorrente da soberania, é una, mas seu exercício é fragmentado pela distribuição de competências a diversos órgãos judiciais. O ordenamento brasileiro admite, assim, a justaposição de competências, mas não de diferentes jurisdições.\nB) A atividade jurisdicional submete as demais funções estatais ao seu controle. A jurisdição mesma, porém, é controlada, via de regra, pela própria jurisdição, apenas admitindo-se excepcionalmente o seu controle externo pela administração e pelo Legislativo.\nC) A realização do direito objetivo é traço caracterizador da jurisdição, sufficiently apto a distingui-la das demais atividades estatais.\nD) A jurisdição é atividade criativa, visto que o julgador pensa até o final o que foi pensado antes pelo legislador, cabendo ao juiz-intérprete produzir a norma jurídica individualizada por meio de processo hermenêutico e linguístico que, a rigor, não conhece limites.\nE) O juiz natural é princípio jurisdicional que visa a resguardar a imparcialidade e que pode ser desmembrado em tripla significação: no plano da fonte, cabe à lei instituir o juiz e fixar-lhe a competência; no plano temporal, juiz e competência devem preexistir ao tempo do caso concreto objeto do processo a ser submetido à apreciação; e no plano da competência, a lei, anterior, deve prever taxativamente a competência, excluindo juízos ad hoc ou de exceção.", "gab": "E", "gabLabel": "", "html": "O princípio do Juiz Natural (art. 5º, XXXVII e LIII da CF/88) ostenta tríplice dimensão: reserva legal para criação de órgãos judiciários, anterioridade da regra de competência em relação ao fato litigioso e proibição de juízos ou tribunais de exceção (ad hoc). Ver Item 58 do Módulo 6.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q10", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.10", "tema": "", "enun": "Em relação à jurisdição, examine os enunciados seguintes:\n\nI. Pelo princípio da aderência, os juízes e tribunais exercem a atividade jurisdicional apenas no território nacional, repartida essa atividade entre os juízes, de acordo com as regras de determinação de competência. \n\nII. Como nenhum juiz prestará a tutela jurisdicional senão quando a parte ou o interessado a requerer, em consequência nenhum procedimento judicial pode ser iniciado de ofício pelo juiz, sem exceção. \n\nIII. O princípio da congruência, decorrência própria do princípio dispositivo, não incide no tocante às questões de ordem pública, que o juiz deve examinar de ofício, por incidência do princípio inquisitório.\n\nEstá correto o que se afirma apenas em:\n\nA) I e III.\nB) I e II.\nC) II e III.\nD) I.\nE) II.", "gab": "A", "gabLabel": "", "html": "- I é verdadeira: Princípio da aderência ao território (Item 61).   - II é falsa: Existem exceções expressas em lei à inércia inicial do juiz (ex: inventário, arrecadação de bens vagos, restauração de autos). Item 55 do Módulo 6.   - III é verdadeira: Matérias de ordem pública (ex: condições da ação, pressupostos processuais) são cognoscíveis de ofício via princípio inquisitório.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q11", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.11", "tema": "", "enun": "Em se tratando da Lei Processual Civil, a jurisdição é exercida em todo o território nacional conforme os dispositivos legais. Com relação à jurisdição voluntária e à contenciosa civil, assinale a alternativa que apresenta quem a exerce em todo o território nacional:\n\nA) A jurisdição voluntária é exercida pelo Ministério Público Federal.\nB) A jurisdição contenciosa é exercida pelo Juiz de Paz.\nC) Ambas são exercidas pelo Ministério Público Estadual.\nD) A jurisdição contenciosa e voluntária é exercida pelos juízes.\nE) n.d.a.", "gab": "D", "gabLabel": "", "html": "Art. 16 do CPC/15: <i>\"A jurisdição civil, contenciosa e voluntária, é exercida pelos juízes e pelos tribunais em todo o território nacional, conforme as disposições deste Código\"</i>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q12", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.12", "tema": "", "enun": "A propósito da jurisdição, assinale a alternativa incorreta, considerando as proposições abaixo:\n\nA) A jurisdição, como manifestação da soberania do Estado, é una e indivisível. Porém, levando em conta particularidades que impõem a repartição das atribuições jurisdicionais entre diferentes órgãos, bem como o aspecto de sua abordagem e outras peculiaridades, a doutrina costuma admitir sua classificação por espécies;\nB) Ao classificar a jurisdição, quanto ao objeto, em penal e civil, a doutrina atribui a esta última, em sentido amplo, todas as lides não penais;\nC) Por “jurisdição comum” entende-se todas as “justiças”, com exceção das chamadas “justiças especiais”, que são: a Trabalhista, A Militar e a Eleitoral;\nD) Na jurisdição voluntária, ao contrário da contenciosa, não há partes, porque não há controvérsia, antagonismos ou conflitos de interesses, apenas “interessados”;\nE) todas as alternativas acima contêm afirmações não verdadeiras.", "gab": "E", "gabLabel": "", "html": "As proposições A, B, C e D são absolutamente corretas e verdadeiras do ponto de vista doutrinário e normativo (Itens 67 a 111 do Módulo 6). Como o enunciado solicita assinalar a alternativa incorreta, a afirmativa E (\"todas as alternativas acima contêm afirmações não verdadeiras\") é a única proposição falsa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q13", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.13", "tema": "", "enun": "Caio ajuizou ação de reparação de perdas e danos em face da Fazenda Pública do Estado de São Paulo na 3ª Vara da Fazenda Pública da Capital. Após o devido processo legal a ação foi julgada procedente e a Fazenda Pública foi condenada a pagar uma indenização milionária. A Fazenda Pública recorreu ao Tribunal de Justiça que manteve a decisão de primeira instância. Ocorre que a decisão do tribunal já transitou em julgado. Sabendo-se que dessa decisão aplica-se a chamada “reserva de sentença”, pode-se dizer que ela está ligada à seguinte característica da jurisdição:\n\nA) Substitutiva ou secundária.\nB) Imperatividade.\nC) Instrumental.\nD) Natureza declaratória.\nE) Definitiva e imutável.", "gab": "E", "gabLabel": "", "html": "A característica da jurisdição de ser definitiva e imutável manifesta-se através da coisa julgada material e do princípio da <i>reserva de sentença</i>, impedindo a reapreciação do litígio por outro Poder estatal ou no próprio âmbito jurisdicional (Item 44 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q14", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.14", "tema": "", "enun": "Glauco ajuizou ação em face de Roberto perante a 8ª Vara Cível da Comarca do Rio de Janeiro. Roberto foi citado para comparecer à audiência de conciliação. Não houve autocomposição e Roberto contestou o feito. Após a contestação houve a necessidade de se fazer prova pericial na Comarca de Santos, no Estado de São Paulo. Nessa hipótese, o juiz da 8ª Vara Cível da Comarca do Rio de Janeiro não poderá praticar o ato na Comarca de Santos pelo princípio da:\n\nA) Investidura.\nB) Aderência ao território.\nC) Inafastabilidade da jurisdição.\nD) Indelegabilidade da jurisdição.\nE) Inércia da jurisdição.", "gab": "B", "gabLabel": "", "html": "Pelo Princípio da Aderência ao Território, o magistrado exerce seus poderes estritamente dentro da comarca/seção judiciária correspondente. Para praticar atos instrutórios ou probatórios fora da sua circunscrição territorial, depende da expedição de carta precatória ao juízo local (Item 61 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q15", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.15", "tema": "", "enun": "João ajuizou determinada ação em face de Marcos perante a 7ª Vara Cível da Comarca de São Paulo. Marcos foi citado para comparecer à audiência de conciliação. Não houve autocomposição e Marcos contestou a ação e uma das alegações foi que não há previsão legal sobre a pretensão apresentada por João. Após a instrução processual, com a colheita de provas orais, o juiz, em vez de proferir sentença, deixou de decidir alegando lacuna da lei. Essa situação violou o seguinte princípio:\n\nA) Da inércia da jurisdição.\nB) Da inevitabilidade da jurisdição.\nC) Do juiz natural.\nD) Da inafastabilidade da jurisdição.\nE) Da investidura.", "gab": "D", "gabLabel": "", "html": "Violação direta ao Princípio da Inafastabilidade do Controle Jurisdicional (ou Indeclinabilidade). O art. 140 do CPC/15 (antigo art. 126 do CPC/73) veda expressamente a recusa de julgar alegando lacuna ou obscuridade da lei (<i>non liquet</i>). Ver Item 62 do Módulo 6.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q16", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.16", "tema": "", "enun": "A Associação Esportiva Madureira celebrou contrato com a Construtora Constrói Tudo S/A para a construção do seu novo estádio de futebol. Em uma das cláusulas contratuais, há a previsão da convenção de arbitragem para a solução de qualquer litígio decorrente da execução do contrato. Ocorre, porém, que houve inexecução do contrato por uma das partes. Sobre a convenção de arbitragem é correto afirmar que:\n\nA) A solução do litígio deve ser dirigida apenas ao Poder Judiciário, uma vez que a jurisdição é monopólio estatal.\nB) A solução do litígio pode ser dirigida ao juízo arbitral, uma vez que se trata de direito disponível ou patrimonial.\nC) A solução do litígio deve ser dirigida apenas ao Poder Judiciário, uma vez que não cabe a arbitragem quando os envolvidos forem pessoas jurídicas.\nD) A solução do litígio poder ser dirigida ao juízo arbitral, uma vez que se trata de direito indisponível ou não patrimonial.\nE) Nenhuma das anteriores está correta.", "gab": "B", "gabLabel": "", "html": "Nos termos da Lei nº 9.307/96 (Lei de Arbitragem) e do art. 3º, § 1º, do CPC/15, as pessoas capazes podem pactuar arbitragem para dirimir litígios relativos a direitos patrimoniais disponíveis (Item 115 a 128 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q17", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.17", "tema": "", "enun": "Marcelo recebeu autuação do Departamento de Trânsito por ter ultrapassado o semáforo vermelho. Ele recorreu do auto de infração, multa e perda de pontos na carteira de habilitação. Para tanto, utilizou-se do chamado “processo administrativo” junto ao órgão competente, onde teve a oportunidade de se utilizar do contraditório e ampla defesa. Ao final, o auto de infração foi mantido. Marcelo recorreu até a última instância do órgão administrativo que manteve a decisão. Nessa situação hipotética, é possível aferir-se que:\n\nA) Marcelo poderá acionar o Poder Judiciário para questionar a decisão do órgão administrativo, em razão do princípio da inafastabilidade da jurisdição.\nB) Marcelo não poderá acionar o Poder Judiciário para questionar a decisão do órgão administrativo, tendo em vista que ele teve oportunidade de se utilizar do contraditório e ampla defesa no “processo administrativo”.\nC) Marcelo poder acionar o juízo arbitral para questionar a decisão do órgão administrativo, uma vez que se trata de direito disponível e patrimonial.\nD) Marcelo poderá acionar o Poder Judiciário para questionar a decisão do órgão administrativo, mas só no tocante ao procedimento utilizado pela Administração Pública e não no mérito da decisão.\nE) Todas as alternativas anteriores estão incorretas.", "gab": "A", "gabLabel": "", "html": "No sistema da jurisdição única ou unidade de jurisdição adotado no Brasil (art. 5º, XXXV da CF/88), os atos e decisões administrativas não fazem coisa julgada material e não impedem a apreciação jurisdicional pelo Poder Judiciário (Item 133 a 142 do Módulo 6).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q18", "bloco": "MÓDULO 6 — Jurisdição — Conceito, Objetivos, Características, Princípios e Espécies", "num": "Ex.18", "tema": "", "enun": "A Empresa ABC S/A ajuizou pedido de recuperação judicial perante a 1ª Vara de Recuperação Judicial e Falência do Mato Grosso. No curso do processo, o juiz convolou a recuperação judicial em falência, pois a empresa não cumpriu com os requisitos legais. A transformação da recuperação judicial da empresa em falência decretada pelo juiz é exceção ao princípio:\n\nA) Do juiz natural.\nB) Da inevitabilidade da jurisdição.\nC) Da inércia da jurisdição.\nD) Da investidura.\nE) Da inafastabilidade da jurisdição.", "gab": "C", "gabLabel": "", "html": "A convolação da recuperação judicial em falência de ofício pelo magistrado (conforme expressamente citado no Item 55 do Módulo 6) constitui uma das exceções legais à regra geral da inércia da jurisdição (<i>ne procedat iudex ex officio</i>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q1", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.1", "tema": "", "enun": "A ação, como direito público e subjetivo de invocar a prestação jurisdicional, independente de ser favorável ou não, ao postulante, é de natureza:\n\nA) Concreta;\nB) Abstrata;\nC) Mista;\nD) Privada;\nE) Nenhuma das alternativas esta correta.", "gab": "B", "gabLabel": "", "html": "De acordo com a Teoria Abstrata da Ação (Degenkolb e Plósz), acolhida pelo ordenamento jurídico pátrio, a ação é um direito público, subjetivo, autônomo e abstrato de exigir do Estado a prestação da tutela jurisdicional, existindo independentemente da procedência ou improcedência do pedido formulado (Item 72 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q2", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.2", "tema": "", "enun": "As ações condenatórias:\n\nA) São as que conferem ao vencedor o poder de pedir a seu favor, o cumprimento da decisão judicial;\nB) São aquelas nas quais o interesse do autor limita-se à afirmação da existência ou inexistência de uma relação jurídica;\nC) São as que visam a realização coativa de um direito legalmente certo;\nD) São as que, sem se limitarem à simples declaração de um direito e sem estatuir uma condenação do réu ao cumprimento de uma prestação, criam, modificam ou extinguem um direito ou uma relação jurídica.\nE) Nenhuma das alternativas anteriores", "gab": "A", "gabLabel": "", "html": "As ações condenatórias visam à obtenção de um provimento que imponha ao réu o cumprimento de uma prestação (dar, fazer, não fazer ou pagar quantia). A sentença condenatória constitui título executivo judicial, conferindo ao autor vitorioso a faculdade de requerer o cumprimento forçado da decisão (CPC, art. 515, I; Item 153 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q3", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.3", "tema": "", "enun": "O princípio “ne procedat judex ex oficio” significa dizer que:\n\nA) o juiz é impedido de conhecer das condições da ação, sem provocação da parte.\nB) os pressupostos processuais devem ser, sempre, arguidos pelos interessados.\nC) O juiz só prestará a tutela jurisdicional quando provocado pela parte ou o interessado, nos casos e na forma legais.\nD) O juiz não deve declarar, de ofício, a incompetência absoluta.\nE) Tratando-se de direitos patrimoniais, o juiz pode, de ofício, declarar a prescrição.", "gab": "C", "gabLabel": "", "html": "O brocardo <i>ne procedat iudex ex officio</i> consagra o Princípio da Inércia da Jurisdição, reproduzido no art. 2º do CPC/15 (\"O processo começa por iniciativa da parte e se desenvolve por impulso oficial, salvo as exceções previstas em lei\"), exigindo provocação prévia do interessado (Item 18 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q4", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.4", "tema": "", "enun": "O direito de ação se prende ao direito material. O direito de ação nada mais era do que o próprio direito substantivo reagindo contra a sua violação. Assim, a ação era simples capítulo do direito civil, não se distinguindo o direito de ação do direito subjetivo material. Daí não há ação sem direito; não há direito sem ação; a ação segue a mesma natureza do direito.\n\nEste pensamento embasou a teoria:\n\nA) o direito de ação autônomo e abstrato.\nB) civilista ou imanentista.\nC) do direito de ação autônomo e concreto.\nD) do direito de ação puro.\nE) do direito de ação real.", "gab": "B", "gabLabel": "", "html": "Trata-se da Teoria Civilista ou Imanentista da ação (formulada pelo Direito Romano e por Savigny), que concebia a ação como o próprio direito material em estado de defesa ou reação contra sua violação (<i>actio nihil aliud est quam ius persequendi in iudicio quod sibi debeatur</i>), sem autonomia conceitual (Item 51 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q5", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.5", "tema": "", "enun": "São requisitos necessários, conexos à pretensão formulada pelo autor, para que o Estado-Juiz dê por legítimo o exercício do direito de ação, com a justa composição da lide (se atendidos os pressupostos processuais). A ação deve preencher para que se profira uma decisão de mérito e para que o direito de ação exista. Tal referência fala das condições da ação/pressupostos processuais, definidas como:\n\nA) partes, objeto e causa de pedir.\nB) partes com legitimação ordinária, pedido imediato e causa de pedir.\nC) legitimidade de partes e interesse de agir.\nD) legitimidade de partes, possibilidade jurídica real do pedido e necessidade de agir.\nE) partes com legitimação extraordinária e interesse de agir, representado pela necessidade e adequação.", "gab": "C", "gabLabel": "", "html": "No CPC/15 (art. 17), o rol das condições da ação foi reduzido ao binômio legitimidade das partes e interesse de agir (<i>legitimatio ad causam</i> e interesse processual), tendo a possibilidade jurídica do pedido sido deslocada para o exame de mérito (Itens 103 e 119 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q6", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.6", "tema": "", "enun": "Quanto à ação e à jurisdição no direito processual civil, é correto afirmar:\n\nA) Preenchidas ou não as condições da ação, o juiz sempre deverá dizer quem tem razão, ao proferir uma sentença de procedência ou improcedência.\nB) A jurisdição é inerte, precisando que o autor ou interessado tome a iniciativa de movimentá-la, o que se faz por meio do direito de ação, exercido contra o Estado, em face da parte adversa.\nC) A jurisdição, entre nós, exercida por meio da ação, é um direito subjetivo privado exercido contra o adversário e coordenado pelo Estado.\nD) A existência do direito de ação é condicionada à ocorrência do próprio direito material postulado.\nE) Tanto o direito de acesso à justiça como o direito de ação em sentido estrito são incondicionados, devendo o juiz apreciar necessariamente o mérito da causa.", "gab": "B", "gabLabel": "", "html": "A função jurisdicional é caracterizada pela inércia inicial. O direito de ação é um direito subjetivo público exercido contra o Estado-juiz (para requerer a prestação da tutela jurisdicional) e direcionado em face do réu (Item 18 e 22 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q7", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.7", "tema": "", "enun": "A respeito da jurisdição e da ação, assinale a opção correta.\n\nA) Segundo a teoria da asserção, as condições da ação devem ser verificadas conforme as afirmações do autor, antes de produzidas as provas.\nB) Dado o princípio da indeclinabilidade, o juiz não pode delegar a jurisdição a outra pessoa.\nC) Conforme a doutrina majoritária, a mediação está inserida na atividade jurisdicional.\nD) De acordo com a teoria clássica da ação, desenvolvida por Friedrich Savigny, a ação é o direito a uma sentença favorável.\nE) Na teoria concretista, defendida por Adolf Wach, não se reconhece a autonomia do direito de ação.", "gab": "A", "gabLabel": "", "html": "A Teoria da Asserção (<i>prospective analysis</i>), encampada pela jurisprudência do Superior Tribunal de Justiça (STJ), estabelece que as condições da ação devem ser aferidas abstratamente a partir das afirmações prestadas pelo autor na petição inicial (<i>in status assertionis</i>), sem aprofundamento probatório (Itens 78 a 87 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q8", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.8", "tema": "", "enun": "Se estiverem ausentes a legitimidade de parte e o interesse de agir, mas o réu nada alegar em contestação, o juiz deve:\n\nA) conhecer da matéria de ofício.\nB) dar ao processo curso normal, em razão da preclusão.\nC) conhecer da matéria de ofício, desde que ainda não tenha ocorrido audiência de instrução, e extinguir o processo com resolução de mérito.\nD) conhecer da matéria, em qualquer grau de jurisdição, mas apenas se a matéria foi alegada pelo réu no curso do processo, extinguindo-o sem resolução de mérito.\nE) conhecer da matéria de ofício, em qualquer grau de jurisdição, e extinguir o processo com resolução de mérito.", "gab": "A", "gabLabel": "", "html": "As condições da ação (legitimidade e interesse processual) constituem matérias de ordem pública, devendo o juiz examiná-las de ofício, em qualquer tempo e grau de jurisdição, enquanto não ocorrer o trânsito em julgado (CPC, art. 337, XI, § 5º c/c art. 485, VI e § 3º; Item 133 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q9", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.9", "tema": "", "enun": "Alexandre contratou a empresa “Serviços em sua casa Ltda.” para realização de reparos em sua residência. Por solicitação da empresa, adiantou o valor de R$ 1.000,00, mas esta não prestou o serviço nem devolveu o dinheiro. A fim de reaver o montante, Alexandre houve por bem ajuizar ação. Contudo, imaginando que a “Serviços em sua casa Ltda.” não teria bens, intentou a ação contra o sócio-gerente da empresa. A ação foi julgada improcedente e Alexandre interpôs recurso. De acordo com o Código de Processo Civil, o Tribunal deverá:\n\nA) extinguir o processo, sem resolução de mérito, apenas se, em contestação, Alexandre tiver suscitado preliminar de ilegitimidade de parte.\nB) processar e julgar o recurso, pois as condições da ação são cognoscíveis apenas até a sentença.\nC) processar e julgar o recurso, por ser vedada a reformatio in pejus.\nD) extinguir o processo sem resolução do mérito, de ofício, por ilegitimidade de parte.\nE) extinguir o processo, sem resolução de mérito, apenas se, na resposta ao recurso, Alexandre suscitar ilegitimidade de parte.", "gab": "D", "gabLabel": "", "html": "A personalidade jurídica da sociedade empresária não se confunde com a da pessoa física de seu sócio-gerente. Como a ilegitimidade passiva <i>ad causam</i> é matéria cognoscível de ofício a qualquer tempo pelo magistrado ou tribunal (CPC, art. 485, VI, § 3º), o Tribunal deve decretar de ofício a extinção do processo sem resolução do mérito (Item 127 e 133 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q10", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.10", "tema": "", "enun": "Segundo José de Albuquerque Rocha, em sua obra intitulada “Teoria Geral do Processo”, a doutrina reconhece vários critérios de classificação das ações, sendo que, o critério prevalente, é aquele que se funda na espécie de provimento requerido pelo autor ao juiz. Por este critério, as ações são classificadas em ações de conhecimento, ações de execução e ações cautelares. As primeiras são aquelas que tendem a provocar um juízo, ou seja, um julgamento sobre a situação jurídica afirmada pelo autor; já as segundas visam justamente pedir ao Estado a realização prática de meios coativos do comando contido na sentença ou em outro documento que a lei reconheça a eficácia executiva; e finalmente, as terceiras visam assegurar e garantir o eficaz desenvolvimento e o profícuo resultado de outra demanda. As ações de conhecimento, por sua vez, se dividem em ações condenatórias, ações declaratórias e ações constitutivas. Se “A” afirma ser titular de direito a indenização, em razão de dano que lhe tenha sido causado por “B”, por exemplo, em razão de um acidente de trânsito ou acidente de trabalho:\n\nA) o meio para obtenção de provimento jurisdicional que resolva essa lide será a ação de conhecimento, onde as partes têm a oportunidade ampla de produção de provas;\nB) o meio para obtenção de provimento jurisdicional que resolva essa lide será a ação de execução, onde as partes têm a oportunidade ampla para coativamente fazer valer seu direito;\nC) o meio para obtenção de provimento jurisdicional que resolva essa lide será a ação cautelar, onde as partes têm a oportunidade de preservar desde logo, o resultado prático de uma demanda;\nD) o caminho adequado para obter um resultado prático para a lide não se dá por meio da ação;\nE) nenhuma das alternativas anteriores.", "gab": "A", "gabLabel": "", "html": "Diante da alegação de ocorrência de ato ilícito causador de dano sem título executivo prévio, há incerteza fático-jurídica, exigindo-se a propositura de ação de conhecimento (cognição) para que o magistrado colha as provas, defina o direito e profira sentença de mérito (Item 145 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q11", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.11", "tema": "", "enun": "As ações declaratórias:\n\nA) São as que conferem ao vencedor o poder de pedir a seu favor, a execução judicial;\nB) Sãoquelas nas quais o interesse do demandante limita-se à afirmação da existência ou inexistência de uma relação jurídica;\nC) São as que visam a realização coativa de um direito legalmente certo;\nD) São as que, sem se limitarem à simples declaração de um direito e sem estatuir uma condenação do demandado ao cumprimento de uma prestação, criam, modificam ou extinguem um direito ou uma relação jurídica.\nE) Nenhuma das alternativas anteriores.", "gab": "B", "gabLabel": "", "html": "O escopo primórdio da ação meramente declaratória é afastar a dúvida objetiva, limitando-se a declarar a existência ou a inexistência de uma relação jurídica, ou a falsidade/autenticidade de documento (CPC, art. 19; Item 152 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q12", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.12", "tema": "", "enun": "As ações de execução:\n\nA) São as que o demandante pede a condenação do demandado para pagar quantia certa;\nB) Sãoquelas nas quais o interesse do autor limita-se à afirmação da existência ou inexistência de uma relação jurídica;\nC) São as que visam a realização coativa de um direito legalmente certo;\nD) São as que, sem se limitarem à simples declaração de um direito e sem estatuir uma condenação do réu ao cumprimento de uma prestação, criam, modificam ou extinguem um direito ou uma relação jurídica.\nE) Nenhuma das alternativas anteriores.", "gab": "C", "gabLabel": "", "html": "As ações de execução têm por finalidade a satisfação coativa da prestação estampada em título executivo (judicial ou extrajudicial) dotado de certeza, liquidez e exigibilidade (CPC, art. 783; Item 161 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q13", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.13", "tema": "", "enun": "Marcos trafegava com o seu automóvel pela av. Paulista quando foi violentamente abalroado pelo automóvel dirigido por Carlos, que ultrapassou o semáforo vermelho. Ambos não tínham seguro. Como Carlos se recusou a pagar o conserto do automóvel de Marcos que ficou em R$ 30.000,00 (trinta mil reais), esse ajuizou ação de perdas e danos materiais em face de Carlos perante a 15ª Vara Cível da Comarca da Capital. Em relação à ação de conhecimento, essa demanda de perdas e danos materiais é classificada como:\n\nA) ação meramente declaratória.\nB) ação condenatória.\nC) ação constitutiva.\nD) ação mandamental.\nE) ação executiva “lato sensu”.", "gab": "B", "gabLabel": "", "html": "A pretensão indenizatória decorrente de responsabilidade civil extracontratual por acidente de trânsito postula a imposição de um dever de pagar (sanção pecuniária), caracterizando ação de conhecimento de natureza condenatória (Item 153 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q14", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.14", "tema": "", "enun": "Marcos celebrou contrato de empréstimo com João, no valor de R$ 40.000,00 (quarenta mil reais), com vencimento em 60 (sessenta) dias. O contrato foi assinado por duas testemunhas. Decorrido o prazo de 60 (sessenta) dias, João não pagou a dívida no vencimento, tornando-se inadimplente. Nessa hipótese, Marcos poderá ajuizar:\n\nA) ação de conhecimento meramente declaratória.\nB) ação de conhecimento constitutiva.\nC) ação executiva.\nD) ação urgente.\nE) ação de conhecimento mandamental.", "gab": "C", "gabLabel": "", "html": "O contrato particular assinado pelo devedor e por duas testemunhas integra o rol dos títulos executivos extrajudiciais (CPC, art. 784, III). Havendo título executivo hígido, o credor dispõe diretamente da via da ação executiva para a satisfação do seu crédito (Item 161 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q15", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.15", "tema": "", "enun": "Maria teve um relacionamento amoroso com Marcos em janeiro de 2018. Nove meses depois teve um filho, Roberto. Maria procurou Marcos para que ele assumisse o filho, mas Marcos negou ser o pai. Inconformada, Maria procurou advogado que ajuizou ação de investigação de paternidade cumulada com alimentos. A ação tem Maria como autora e Marcos como réu. Nessa hipótese:\n\nA) a ação será extinta sem resolução do mérito, uma vez que falta a legitimidade para a causa.\nB) a ação será julgada procedente, se durante o devido processo legal houver prova da paternidade.\nC) a ação será extinta sem resolução do mérito, uma vez que falta o interesse processual.\nD) a ação será julgada improcedente, uma vez que a ação deveria ter sido ajuizada por Roberto.\nE) nenhuma das alternativas anteriores está correta.", "gab": "A", "gabLabel": "", "html": "O titular do direito subjetivo de propor a ação de investigação de paternidade é o próprio filho (Roberto), devendo a mãe figurar no processo apenas como sua representante legal. Proposta a demanda em nome próprio da genitora (Maria), resta configurada a ilegitimidade ativa <i>ad causam</i> (CPC, art. 18), ensejando a extinção do processo sem resolução do mérito (CPC, art. 485, VI; Item 127 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q16", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.16", "tema": "", "enun": "Pedro locou um imóvel para Wilson, com valor de aluguel de R$ 3.000,00 (três mil reais) mensais, e vencimento todo dia 30 de cada mês. O prazo da locação é por tempo indeterminado. Wilson sempre pagou em dia os aluguéis. Ocorre, porém, que Pedro ficou sabendo que Wilson perdeu e emprego e está em dificuldades financeiras. Antes de chegar o vencimento do aluguel no dia 30, Pedro contratou um advogado que ajuizou ação de despejo por falta de pagamento no dia 15 do mesmo mês. Nessa hipótese:\n\nA) o juiz julgará procedente a ação, porque o locatário não pagará o aluguel.\nB) o juiz extinguirá a ação sem resolução do mérito, porque falta a legitimidade ativa.\nC) o juiz extinguirá a ação sem resolução do mérito, porque falta a legitimidade passiva.\nD) o juiz extinguirá a ação sem resolução do mérito, porque falta o interesse-necessidade.\nE) o juiz extinguirá a ação sem resolução do mérito, porque falta o interesse-adequação.", "gab": "D", "gabLabel": "", "html": "O interesse de agir desdobra-se no binômio necessidade-adequação. Ausente o inadimplemento na data do ajuizamento (visto que a obrigação ainda não havia vencido), o autor não possui necessidade da tutela jurisdicional regressiva/repressiva, acarretando a extinção do processo sem resolução do mérito por carência de interesse-necessidade (CPC, art. 485, VI; Item 125 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q17", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.17", "tema": "", "enun": "João locou um imóvel para Marcos, com valor de aluguel de R$ 5.000,00 (cinco mil reais) mensais, e vencimento todo dia 30 de cada mês. O prazo da locação é por tempo indeterminado. Marcos já está morando no imóvel locado há mais de cinco anos. A filha de João, Maria, pretende morar no imóvel locado e, por essa razão, João contratou um advogado que ajuizou ação de reintegração de posse para retomar o imóvel em face de Marcos. Nessa hipótese:\n\nA) o juiz extinguirá a ação sem resolução do mérito, porque falta a legitimidade ativa.\nB) o juiz extinguirá a ação sem resolução do mérito, porque falta a legitimidade passiva.\nC) o juiz extinguirá a ação sem resolução do mérito, porque falta o interesse-necessidade.\nD) o juiz extinguirá a ação sem resolução do mérito, porque falta o interesse-adequação.\nE) o juiz julgará procedente a ação, porque é direito do locador a retomada do imóvel para uso de sua filha.", "gab": "D", "gabLabel": "", "html": "Segundo o art. 5º da Lei nº 8.245/91 (Lei de Locações), a ação cabível para o locador reaver o imóvel locado é exclusivamente a ação de despejo. O ajuizamento de ação possessória (reintegração de posse) revela inaptidão da via eleita, gerando a carência de ação por ausência do interesse-adequação (CPC, art. 485, VI; Item 125 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q18", "bloco": "MÓDULO 7 — Ação — Conceito, Natureza Jurídica, Condições e Classificação", "num": "Ex.18", "tema": "", "enun": "Caio, menor impúbere, ajuizou ação de investigação de paternidade em face de Roberto perante a 7ª Vara da Família da Comarca de São Paulo. A sua pretensão é comprovar que Roberto é seu pai. Em relação à ação de investigação de paternidade, ela é classificada como:\n\nA) ação meramente declaratória.\nB) ação condenatória.\nC) ação constitutiva.\nD) ação mandamental.\nE) ação executiva “lato sensu”.", "gab": "A", "gabLabel": "", "html": "A ação de investigação de paternidade possui natureza meramente declaratória, pois seu objetivo exclusivo é a eliminação da incerteza jurídica sobre o estado de filiação, declarando a existência da relação jurídica pré-existente de parentesco (CPC, art. 19, I; Item 152 do Módulo 7).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q1", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.1", "tema": "", "enun": "No que se refere à competência:\n\nA) é ela determinada no momento em que a ação é proposta, como regra, mostrando-se irrelevantes as modificações do estado de fato ou de direito ocorridas posteriormente.\nB) cabe à autoridade judiciária estrangeira proceder a inventário e partilha de bens, mesmo que situados no Brasil, se o autor da herança for estrangeiro e houver residido fora do território nacional.\nC) a ação fundada em direito pessoal e a ação fundada em direito real sobre bens móveis serão, em regra, propostas no foro do domicílio do autor.\nD) sendo incerto ou desconhecido o domicílio do réu, será ele demandado na capital do Estado da federação em que houvera residido com endereço certo.\nE) a territorial é absoluta e levanta-se por meio de preliminar na defesa apresentada pelo réu.", "gab": "A", "gabLabel": "", "html": "Consagra-se o princípio da <i>perpetuatio jurisdictionis</i> (estabilidade da competência), insculpido no art. 43 do CPC/15: a competência é fixada no momento do registro ou distribuição da petição inicial, sendo irrelevantes as alterações posteriores do estado de fato ou de direito (salvo extirpação do órgão judiciário ou modificação de competência absoluta). A partilha de bens situados no Brasil é de competência exclusiva da jurisdição nacional (CPC, art. 23, II) e as ações pessoais são proposta...", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q2", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.2", "tema": "", "enun": "A competência:\n\nA) territorial diz respeito ao valor e à matéria.\nB) não se prorroga, tratando-se de questão cogente e indisponível.\nC) em razão do valor e do território, poderá modificar-se pela conexão ou continência.\nD) em razão da matéria é derrogável por convenção das partes, se disponível o direito sobre o qual se litiga.\nE) não pode em nenhuma hipótese ser declinada de ofício pelo juiz, se relativa.", "gab": "C", "gabLabel": "", "html": "As competências territorial e pelo valor da causa possuem natureza relativa e tutelam interesse privado, podendo ser modificadas por conexão ou continência (CPC, art. 54) ou prorrogadas caso o réu não alegue a incompetência em preliminar de contestação (CPC, art. 65). A incompetência em razão da matéria é absoluta e inderrogável (CPC, art. 62) (Itens 34, 35 e 167 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q3", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.3", "tema": "", "enun": "Quanto à competência:\n\nA) como regra, quando territorial, pode ser declinada de ofício pelo juiz, sem necessidade de provocação da parte.\nB) de modo geral, são relevantes as modificações do estado de fato ou de direito ocorridas posteriormente à propositura da demanda.\nC) é determinada no momento da propositura da demanda.\nD) a autoridade judiciária brasileira a tem concorrente para conhecer de ações relativas a imóveis situados no país.\nE) em razão do valor e da função, em primeiro grau, é regida pelas normas de organização judiciária.", "gab": "C", "gabLabel": "", "html": "A competência é fixada no momento da propositura da petição inicial (registro ou distribuição), nos termos do art. 43 do CPC/15. A competência territorial é em regra relativa e não pode ser declarada de ofício pelo juiz (Súmula 33 do STJ), e as ações sobre imóveis situados no Brasil submetem-se à competência internacional exclusiva (CPC, art. 23, I) (Itens 39, 41 e 43 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q4", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.4", "tema": "", "enun": "No tocante à competência:\n\nA) ocorrendo em separado ações conexas perante juízes que têm a mesma competência territorial, considera-se prevento aquele que saneou o feito em primeiro lugar.\nB) a conexão de causas é matéria de ordem privada, dependendo de requerimento da parte para ser conhecida pelo juiz.\nC) para a ação em que se pedem alimentos, é competente o foro do domicílio ou da residência do alimentante.\nD) quando decorrer da matéria e do território poderá modificar-se pela conexão ou continência.\nE) como regra normativa, nas ações de reparação do dano sofrido em razão de delito ou acidente de veículos, será competente o foro do domicílio do autor ou do local do fato.", "gab": "E", "gabLabel": "", "html": "Nos termos expressos do art. 53, V, do CPC/15, é competente o foro do domicílio do autor ou do local do fato para a ação de reparação de dano sofrido em razão de delito ou acidente de veículos. A prevenção de juízos dá-se pelo registro ou distribuição (CPC, art. 59) e o foro alimentares é o do domicílio do alimentando (CPC, art. 53, II) (Itens 105, 127 e 187 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q5", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.5", "tema": "", "enun": "Quanto à competência:\n\nA) se reconhecida a incompetência absoluta, o processo será extinto, sem resolução do mérito.\nB) sua estabilidade se dá com a propositura da ação.\nC) da decisão que reconhecer a incompetência relativa, não cabe recurso, por ausência de gravame às partes.\nD) como regra geral, são relevantes as modificações do estado de fato ou de direito ocorridas posteriormente à determinação da competência.\nE) as ações fundadas em direito real sobre móveis devem ser propostas em regra no foro da situação da coisa, no momento da propositura.", "gab": "B", "gabLabel": "", "html": "A estabilidade/perpetuação da competência consolida-se com a propositura da petição inicial (CPC, art. 43). Ao acolher a incompetência (seja absoluta ou relativa), o juiz não extingue o processo, mas remete os autos ao juízo competente (CPC, art. 64, § 3º) (Itens 39, 43 e 219 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q6", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.6", "tema": "", "enun": "Quanto à competência, é correto afirmar:\n\nA) As mudanças de domicílio do réu, depois de ajuizada a demanda, não alteram a competência, já estabilizada com a propositura da ação.\nB) Sendo incerto ou desconhecido o domicílio do réu, ele será demandado no foro de seu último domicílio.\nC) A ação fundada em direito pessoal e a ação fundada em direito real sobre bens móveis serão propostas, em regra, no foro do domicílio do autor.\nD) A competência é determinada no momento em que a ação é proposta; são, porém, relevantes, como regra geral, as modificações do estado de fato ou de direito ocorridas posteriormente.\nE) A ação intentada perante tribunal estrangeiro induz litispendência, obstando a que a autoridade judiciária brasileira conheça da mesma causa e das que lhe são conexas.", "gab": "A", "gabLabel": "", "html": "Pelo princípio da <i>perpetuatio jurisdictionis</i> (CPC, art. 43), a alteração superveniente no domicílio das partes não modifica a competência já estabelecida. As ações pendentes no exterior não induzem litispendência perante a jurisdição brasileira (CPC, art. 24) (Itens 39, 41 e 43 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q7", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.7", "tema": "", "enun": "A respeito da competência, é correto afirmar que:\n\nA) o foro do domicílio do credor é competente para a ação de anulação de títulos extraviados ou destruídos.\nB) a competência é determinada no momento em que ocorre a citação válida do réu.\nC) a ação fundada em direito real sobre bens móveis serão propostas, em regra, no foro da situação da coisa.\nD) a ação em que o incapaz for réu se processará no foro do domicílio do autor.\nE) compete à autoridade judiciária brasileira, com exclusão de qualquer outra, conhecer das ações relativas a imóveis situados no Brasil.", "gab": "E", "gabLabel": "", "html": "O art. 23, I, do CPC/15 estatui a competência internacional exclusiva da autoridade judiciária brasileira para conhecer de ações relativas a imóveis situados no território nacional. A ação em que o incapaz é réu corre no domicílio de seu representante/assistente (CPC, art. 50) e a competência se
