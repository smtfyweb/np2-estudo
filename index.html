regime jurídico especial, tal entidade fica dispensada de realizar concurso público para admissão de pessoal\":\n\nA) Ordem dos Advogados do Brasil\nB) Agência Executiva\nC) Associação Pública\nD) Empresa pública\nE) Sociedade de Economia Mista", "gab": "A", "gabLabel": "", "html": "O STF (ADI nº 3.026/DF) decidiu que a <b>OAB</b> possui natureza jurídica <i>sui generis</i> de serviço público independente, não integrante da Administração Indireta, estando isenta da obrigação de realizar concurso público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q11", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.11", "tema": "", "enun": "As agências reguladoras têm natureza jurídica de:\n\nA) autarquias sob regime especial\nB) órgãos da Administração direta\nC) empresas públicas\nD) órgãos do Tribunal de Contas da União\nE) entidades privadas", "gab": "A", "gabLabel": "", "html": "As Agências Reguladoras são entes descentralizados da Administração Indireta com natureza jurídica de <b>autarquias sob regime especial</b>, dotadas de independência decisória e poder regulatório normativo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q12", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.12", "tema": "", "enun": "Sobre organização da administração pública, assinale os órgãos que integram a administração direta:\n\nA) Tribunais Regionais do Trabalho\nB) Organizações Sociais\nC) Fundações criadas por lei\nD) Secretarias de Estado\nE) N.D.A.", "gab": "D", "gabLabel": "", "html": "As <b>Secretarias de Estado</b> são órgãos públicos despersonalizados frutos de desconcentração administrativa, compondo a estrutura interna da Administração Pública <b>Direta</b> do Estado-membro.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q1", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.1", "tema": "", "enun": "Relativamente à licitação, podemos dizer que:\n\nI - A adjudicação é ato pelo qual se atribui o objeto da licitação ao proponente que haja apresentado a melhor proposta.\nII - O tipo de licitação de técnica e preço será obrigatoriamente utilizado quando o objeto da licitação for a contratação de bens e serviços de informática.\nIII - Tomada de preços é a modalidade de licitação entre interessados devidamente cadastrados ou que atenderem a todas as condições exigidas para cadastramento até o terceiro dia anterior à data do recebimento das propostas.\n\nÉ correto que:\n\nA) apenas a afirmação I está correta.\nB) apenas as afirmações I e II estão corretas.\nC) apenas as afirmações I e III estão corretas.\nD) todas as afirmações estão corretas.\nE) todas as afirmações estão incorretas.", "gab": "D", "gabLabel": "", "html": "Todas as assertivas são corretas: I — adjudicação (art. 43, VI da Lei 8.666/93); II — técnica e preço obrigatório para TI (art. 45, § 4º da Lei 8.666/93); III — conceito de tomada de preços (art. 22, § 2º da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q2", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.2", "tema": "", "enun": "Considerando as afirmações:\nI. Edital é o meio pelo qual os interessados tomam conhecimento da licitação, sendo convidados para dela participar.\nII. O edital da licitação deve ser rigorosamente cumprido, estando a administração vinculada ao que nele está contido.\nIII. O edital não pode conter especificações exageradas que levem a privilegiar algum concorrente.\n\nÉ correto afirmar que:\n\nA) todas as afirmações estão corretas.\nB) todas as afirmações estão incorretas.\nC) apenas a afirmação I está correta.\nD) apenas as afirmações I e II estão corretas.\nE) apenas as afirmações I e III estão corretas.", "gab": "A", "gabLabel": "", "html": "Todas as assertivas são corretas. O edital é a \"lei interna da licitação\", expressando os princípios da publicidade, vinculação ao instrumento convocatório e impessoalidade/competitividade (vedadas cláusulas discriminatórias — art. 3º, § 1º, I da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q3", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.3", "tema": "", "enun": "A licitação é dispensável nas seguintes hipóteses:\nI. guerra ou grave perturbação da ordem;\nII. desinteresse pela licitação anterior;\nIII. venda de bem imóvel para outro órgão da Administração Pública, independentemente de qualquer outro requisito;\nIV. contratação de serviços técnicos de gerenciamento de obras, com profissionais de notória especialização.\n\nEstá correto o que se afirma APENAS em:\n\nA) I e II\nB) I e III\nC) II e III\nD) II e IV\nE) III e IV", "gab": "A", "gabLabel": "", "html": "I e II constituem hipóteses de <b>licitação dispensável</b> (art. 24, III e V da Lei 8.666/93). A assertiva III omite requisitos legais; a IV trata de <b>inexigibilidade</b> por notória especialização (art. 25, II da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q4", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.4", "tema": "", "enun": "Com relação aos princípios básicos da licitação, é INCORRETO afirmar que a lei contempla o seguinte princípio:\n\nA) da vinculação ao instrumento convocatório.\nB) da isonomia\nC) do julgamento objetivo\nD) do sigilo da licitação, dos seus atos e decisões.\nE) da adjudicação compulsória", "gab": "D", "gabLabel": "", "html": "Por força do Princípio da Publicidade (CF/88, art. 37, caput) e do art. 3º da Lei 8.666/93, os atos da licitação são públicos. O sigilo restringe-se exclusivamente ao conteúdo das propostas até a data de sua abertura formal — não há \"sigilo da licitação\".", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q5", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.5", "tema": "", "enun": "Ampla publicidade e universalidade são características ínsitas à seguinte modalidade de licitação:\n\nA) Convite\nB) Concorrência\nC) Tomada de Preços\nD) Leilão\nE) Concurso", "gab": "B", "gabLabel": "", "html": "A <b>Concorrência</b> é a modalidade de maior amplitude e universalidade, aberta a quaisquer interessados que comprovem os requisitos mínimos de qualificação exigidos no edital (art. 22, § 1º da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q6", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.6", "tema": "", "enun": "A locação de imóvel, para nele funcionar determinado serviço público, será uma modalidade de contratação que:\n\nA) depende de prévia licitação, em qualquer caso\nB) pode dispensar a licitação, nos casos previstos em lei\nC) não exige licitação, nos casos previstos em lei\nD) prescinde de licitação em qualquer caso\nE) N.D.A.", "gab": "B", "gabLabel": "", "html": "A locação de imóvel destinado ao atendimento das finalidades precípuas da Administração é hipótese de <b>licitação dispensável</b> (art. 24, X da Lei nº 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q7", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.7", "tema": "", "enun": "Considerando as assertivas sobre licitação:\nI. Quando for cabível a concorrência não se pode realizar nem a tomada de preços e nem o convite.\nII. O pregão é modalidade de licitação entre quaisquer interessados para venda de bens móveis inservíveis para a Administração ou de produtos apreendidos ou penhorados.\n\nA) I e II estão corretas\nB) I e II estão incorretas\nC) I é correta e a II é incorreta\nD) I é incorreta e a II é correta\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "A assertiva I é correta (obrigatoriedade da Concorrência exclui modalidades menores). A assertiva II é incorreta: a descrição refere-se ao <b>Leilão</b> (art. 22, § 5º da Lei 8.666/93), e não ao Pregão (destinado a bens e serviços comuns).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q8", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.8", "tema": "", "enun": "De acordo com as assertivas:\nI. A lei de licitações possibilita a qualquer cidadão, e também ao licitante, o direito de impugnar o edital de licitação.\nII. A habilitação ou qualificação destina-se à análise da aptidão ou capacidade do licitante em executar o objeto do futuro contrato.\n\nA) I e II estão incorretas\nB) I e II estão corretas\nC) I é correta e a II é incorreta\nD) I é incorreta e a II é correta\nE) N.D.A", "gab": "B", "gabLabel": "", "html": "Ambas são verdadeiras. O edital pode ser impugnado por qualquer cidadão ou licitante (art. 41, §§ 1º e 2º da Lei 8.666/93). A habilitação afere a aptidão jurídica, técnica e econômico-financeira do concorrente.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q9", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.9", "tema": "", "enun": "Assinale a alternativa que apresenta somente modalidades de licitação conforme o previsto na legislação:\n\nA) leilão, concorrência, convite e concurso\nB) tomada de preços, maior lance ou oferta, melhor técnica e convite\nC) menor preço, melhor técnica e preço, leilão e concorrência\nD) convite, tomada de preços, leilão e maior lance ou oferta\nE) melhor técnica, concorrência, menor preço e tomada de preços", "gab": "A", "gabLabel": "", "html": "Leilão, Concorrência, Convite e Concurso são <b>modalidades</b> de licitação (art. 22 da Lei 8.666/93). \"Menor preço\", \"melhor técnica\" e \"maior lance\" são <i>critérios/tipos de julgamento</i>, não modalidades.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q10", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.10", "tema": "", "enun": "A lei nº 8.666/93 trata de:\n\nA) normas para licitação e contratos da Administração Pública\nB) normas para contratação de pessoal e Administração Pública\nC) normas para prestação de serviços da Administração Pública\nD) normas para definição de produtos da Administração Pública\nE) normas para contratação de serviços de publicidade", "gab": "A", "gabLabel": "", "html": "O art. 1º da Lei nº 8.666/93 estabelece expressamente que o diploma disciplina as \"normas gerais sobre licitações e contratos administrativos pertinentes a obras, serviços, inclusive de publicidade, compras, alienações e locações no âmbito dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios\".", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q11", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.11", "tema": "", "enun": "Da Lei nº 8.666/93, é correto afirmar que:\n\nA) as obras, serviços e compras de grande vulto são aquelas cujo valor estimado seja superior a 5 (cinco) vezes o limite estabelecido na alínea c do inciso I do artigo 23\nB) é admitida a modalidade concorrência para obra de valor acima de R$ 1.500.000,00 (um milhão e quinhentos mil reais)\nC) na licitação, a modalidade de Concorrência não exige que, na fase inicial de habilitação preliminar, os interessados comprovem possuir os requisitos mínimos de qualificação exigidos para execução de seu objeto\nD) existindo na praça mais de três possíveis interessados, dispensa-se a formalidade do convite, quando existirem cadastrados não convidados nas últimas licitações, admitindo-se o contrato direto.\nE) N.D.A", "gab": "B", "gabLabel": "", "html": "Conforme o art. 23, inciso I, alínea \"c\", da Lei nº 8.666/93, a Concorrência é obrigatória para obras e serviços de engenharia de valor superior a <b>R$ 1.500.000,00</b> (um milhão e quinhentos mil reais).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q12", "bloco": "MÓDULO 6 — Licitação", "num": "Ex.12", "tema": "", "enun": "Após regular procedimento licitatório e celebrado o contrato, poderá ser alterado o objeto do contrato de prestação de serviços de limpeza para serviço de vigilância, caso a contratada seja empresa especializada também em vigilância e o Poder Público alegue que o interesse público exige a alteração?\n\nA) sim, porque se trata de ato discricionário\nB) sim, pelo poder da Administração de alteração unilateral dos contratos\nC) não, porque se trata de serviços técnico especializado\nD) não, pelo princípio da vinculação do edital\nE) N.D.A", "gab": "D", "gabLabel": "", "html": "É vedada a alteração substancial do objeto (substituir limpeza por vigilância), pois violaria o <b>Princípio da Vinculação ao Edital</b> e da isonomia, burlando a exigência constitucional de licitação para o novo objeto (art. 37, XXI da CF/88 e art. 3º da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q1", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.1", "tema": "", "enun": "Em razão da observância do princípio da publicidade, os contratos administrativos devem ser publicados:\n\nA) integralmente, no órgão da imprensa oficial;\nB) integralmente, no Boletim Interno do órgão respectivo;\nC) resumidamente, na imprensa oficial e em jornal de circulação oficial;\nD) resumidamente, no órgão da imprensa oficial;\nE) resumidamente, na imprensa oficial e, integralmente, no Boletim Interno do órgão competente.", "gab": "D", "gabLabel": "", "html": "Nos termos do art. 61, parágrafo único, da Lei nº 8.666/93, a publicação <b>resumida</b> do instrumento contratual no órgão da imprensa oficial é condição indispensável para a sua eficácia jurídica.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q2", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.2", "tema": "", "enun": "O Secretário de Defesa Civil contrata, após licitação, a compra de uma frota de veículos especializados em retirar neve das estradas. Esse contrato é:\n\nA) Irrevogável, porque obedeceu ao princípio da licitação;\nB) revogável, porque o Estado não está obrigado a cumprir os contratos que celebra com particulares;\nC) só pode ser desfeito por determinação legislativa;\nD) só pode ser desconstituído por ordem judicial;\nE) é nulo por inexistência de motivos", "gab": "E", "gabLabel": "", "html": "Pela <b>Teoria dos Motivos Determinantes</b>, a validade do ato/contrato vincula-se aos motivos invocados. A aquisição de frota para remoção de neve em local sem incidência do fenômeno caracteriza ausência/falsidade absoluta do motivo de fato, tornando o ajuste nulo de pleno direito.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q3", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.3", "tema": "", "enun": "Para os fins da Lei nº 8.666/93, a todo e qualquer ajuste entre órgãos ou entidades da Administração Pública e particulares, em que haja um acordo de vontades para a formação de vínculo e a estipulação de obrigações recíprocas, seja qual for a denominação utilizada, dá-se o nome de:\n\nA) contrato\nB) ato administrativo\nC) projeto executório\nD) fato administrativo\nE) procedimento licitatório", "gab": "A", "gabLabel": "", "html": "Conceito extraído literalmente do art. 2º, parágrafo único, da Lei nº 8.666/93: todo ajuste entre a Administração e particulares com obrigações recíprocas é denominado <b>contrato</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q4", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.4", "tema": "", "enun": "Não é característica do contrato administrativo:\n\nA) presença de cláusulas exorbitantes\nB) liberdade de forma\nC) mutabilidade\nD) finalidade pública\nE) N.D.A.", "gab": "B", "gabLabel": "", "html": "Os contratos administrativos exigem <b>formalismo estrito e forma escrita obrigatória</b> (art. 60 da Lei 8.666/93). A \"liberdade de forma\" é típica do direito privado e não se aplica ao regime de direito público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q5", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.5", "tema": "", "enun": "Nos contratos administrativos regidos pela Lei n. 8.666/93, a Administração Pública dispõe de certas prerrogativas especiais, mas mesmo assim não pode:\n\nA) aplicar sanções;\nB) descumprir condições do edital;\nC) modificá-los;\nD) ocupar bens do contratado;\nE) rescindi-los.", "gab": "B", "gabLabel": "", "html": "Muito embora a Administração detenha cláusulas exorbitantes, ela se submete rigidamente ao <b>Princípio da Vinculação ao Instrumento Convocatório/Edital</b> (art. 3º e 41 da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q6", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.6", "tema": "", "enun": "Em matéria de contratos administrativos considere:\nI. É pressuposto de aplicabilidade da teoria da imprevisão, dentre outros, uma interferência previsível, mas de consequências incalculáveis.\nII. Eventos supervenientes e imprevisíveis que possam influir sobre qualquer dos aspectos pactuados autorizam a revisão do contrato.\nIII. O fato do príncipe se confunde com o fato da Administração, visto que incidindo diretamente sobre o contrato sempre suspendem sua execução.\nIV. O cumprimento do contrato ocorre simplesmente com a conclusão da obra ou do serviço, caso em que as partes ficam desoneradas de suas responsabilidades.\n\nNesses casos são corretos SOMENTE:\n\nA) I e III\nB) I e II\nC) III e IV\nD) I, II e IV\nE) II, III e IV", "gab": "B", "gabLabel": "", "html": "I é correta (Teoria da Imprevisão abrange fatos de consequências incalculáveis). II é correta (eventos imprevisíveis autorizam revisão — art. 65, II, \"d\" da Lei 8.666/93). III e IV são incorretas: o Fato do Príncipe difere do Fato da Administração, e a conclusão da obra não desonera de responsabilidade por vícios.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q7", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.7", "tema": "", "enun": "O Contrato Administrativo tem como característica:\nI. a presença de cláusulas exorbitantes;\nII. a imutabilidade;\nIII. a incompatibilidade total com a natureza do contrato de adesão.\n\nÉ correto afirmar que:\n\nA) apenas I está correto\nB) apenas II está correta\nC) apenas a III está correto\nD) I, II e III estão corretas\nE) nenhuma afirmativa está correta", "gab": "A", "gabLabel": "", "html": "Assertiva I é correta (cláusulas exorbitantes são marca do contrato administrativo). Assertiva II é incorreta (o contrato é <b>mutável</b> unilateralmente). Assertiva III é incorreta (o contrato administrativo é essencialmente um <b>contrato de adesão</b>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q8", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.8", "tema": "", "enun": "Analise as assertivas:\nI. Como regra os contratos administrativos devem ter a forma escrita.\nII. A lei de licitação admite importante exceção à regra dos contratos escritos, autorizando a celebração de contrato verbal para pequenas compras de pronto pagamento feitas em regime de adiantamento.\n\nA) I e II estão incorretas\nB) I e II estão corretas\nC) I está correta e a II está incorreta\nD) I está incorreta é a II está correta\nE) N.D.A", "gab": "B", "gabLabel": "", "html": "Ambas são verdadeiras. A regra geral é o contrato escrito (art. 60, caput, da Lei 8.666/93). Exceção: contrato verbal para pequenas compras de pronto pagamento (art. 60, parágrafo único da Lei 8.666/93).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q9", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.9", "tema": "", "enun": "Considerando as afirmações:\nI. Teoria da imprevisão (cláusula rebus sic stantibus) é aplicável excepcionalmente no contrato administrativo.\nII. No contrato administrativo, a Administração aparece com prerrogativas que garantem a sua posição de supremacia sobre o particular; vem expressas por meio das cláusulas exorbitantes.\nIII. O contrato administrativo tem como característica a presença de cláusulas exorbitantes.\n\nÉ correto o que se afirma:\n\nA) I, II e III\nB) I e II\nC) I e III\nD) II e III\nE) N.D.A", "gab": "A", "gabLabel": "", "html": "Todas as assertivas são verdadeiras. A Teoria da Imprevisão assegura a restauração do equilíbrio financeiro diante de eventos supervenientes, enquanto a supremacia do interesse público manifesta-se através das cláusulas exorbitantes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q10", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.10", "tema": "", "enun": "A lei n. 8.666/93 assevera que o contratado é obrigado a aceitar acréscimos e supressões nas obras, serviços ou compras, bem como na reforma de edifício ou equipamento. Assinale o percentual de acréscimo ou supressão obrigatório respectivamente:\n\nA) 25% e 50%\nB) 25% e 75%\nC) 50% e 25%\nD) 50% e 75%\nE) 50% e 50%", "gab": "A", "gabLabel": "", "html": "O art. 65, § 1º, da Lei nº 8.666/93 obriga o contratado a aceitar alterações de até <b>25%</b> para obras, serviços ou compras, e de até <b>50%</b> para acréscimos em reformas de edifícios ou equipamentos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q11", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.11", "tema": "", "enun": "O governo contratou empresa para construção de sede de secretaria. A empresa não pôde começar no prazo porque a Administração Pública não entregou o local da obra e não expediu as ordens de serviço necessárias. A empresa está isenta de sanções por força de:\n\nA) fato do príncipe\nB) fato da administração\nC) álea econômica\nD) álea ordinária ou empresarial\nE) álea procedimental", "gab": "B", "gabLabel": "", "html": "O <b>Fato da Administração</b> configura-se pela ação ou omissão direta do órgão contratante (não liberação do local, não emissão de ordens de serviço) que inviabiliza ou retarda o cumprimento regular do contrato, eximindo o contratado de penalidades.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q12", "bloco": "MÓDULO 7 — Contratos Administrativos", "num": "Ex.12", "tema": "", "enun": "Relativamente aos contratos administrativos, é correto afirmar que:\n\nA) Não há possibilidade de invocação da exceção do contrato não cumprido pelo contratado.\nB) É vedada em qualquer hipótese a contratação verbal\nC) É obrigatória a prestação de garantia de execução do contrato pelo contratado\nD) É possível a rescisão amigável.\nE) N.D.A.", "gab": "D", "gabLabel": "", "html": "A rescisão amigável (extinção consensual) é expressamente prevista no art. 79, II, da Lei nº 8.666/93, ocorrendo por acordo das partes quando houver conveniência para a Administração Pública.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q1", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.1", "tema": "", "enun": "No que tange às regras da Constituição Federal de 1988 sobre a Administração Pública, é correto afirmar:\n\nA) não está vedada a equiparação de remuneração de pessoal do serviço público.\nB) o acréscimo pecuniário percebido pelo servidor deve ser computado para fim de concessão de acréscimos ulteriores.\nC) a Administração Pública pode, mesmo antes de findar o prazo de validade de um concurso, realizar um novo concurso e convocar os aprovados neste antes dos aprovados naquele.\nD) os cargos públicos, em tese, podem ser ocupados por estrangeiros.\nE) N.D.A.", "gab": "D", "gabLabel": "", "html": "Nos termos do art. 37, I, da CF/88, os cargos, empregos e funções públicas são acessíveis aos brasileiros e <b>também aos estrangeiros, na forma da lei</b> (redação dada pela EC nº 19/98). As demais alternativas contrariam regras expressas do art. 37.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q2", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.2", "tema": "", "enun": "Sobre a acumulação de cargos públicos, assinale a opção correta.\n\nA) admite-se, excepcionalmente, que o servidor tenha exercício simultâneo em mais de um cargo em comissão.\nB) a proibição de acumular não se estende a funções em estatais vinculadas a outro ente da Federação, desde que haja compatibilidade de horários.\nC) via de regra, o servidor pode ser remunerado pela participação em órgãos de deliberação coletiva.\nD) a legislação pátria não admite que o servidor que acumule dois cargos efetivos possa investir-se de cargo de provimento em comissão.\nE) como regra, a proibição de acumular não se estende à acumulação de proventos de inatividade com a percepção de vencimentos na ativa.", "gab": "A", "gabLabel": "", "html": "Nos termos do art. 9º, parágrafo único, e do art. 119 da Lei nº 8.112/90, admite-se <b>excepcionalmente</b> que o servidor em cargo em comissão seja designado para exercer <b>interinamente</b> outro cargo de confiança, optando pela remuneração de um deles.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q3", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.3", "tema": "", "enun": "Integra o regime constitucional dos servidores públicos a regra segundo a qual:\n\nA) as funções de confiança, exercidas exclusivamente por indivíduos que não ocupem cargo efetivo, e os cargos em comissão destinam-se apenas às atribuições de direção, chefia e assessoramento.\nB) é garantido ao servidor público civil o direito à livre associação sindical, mediante autorização, em cada caso, da pessoa da Administração a que se vincule.\nC) os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos estabelecidos em lei, assim como aos estrangeiros, na forma da lei.\nD) a investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas, de provas e títulos, ou de títulos.\nE) o prazo de validade do concurso público será de até quatro anos, prorrogável uma vez, por igual período.", "gab": "C", "gabLabel": "", "html": "Transcrição literal do art. 37, I, da Constituição Federal. As demais alternativas contêm erros: A (funções de confiança são exclusivas de servidores de carreira — art. 37, V); B (associação sindical independe de autorização — art. 37, VI); D (não existe concurso só de títulos — art. 37, II); E (o prazo é de até dois anos — art. 37, III).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q4", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.4", "tema": "", "enun": "As modalidades de aposentadoria no serviço público são:\n\nA) inatividade remunerada, forma e direito de afastamento\nB) formal, por inatividade e voluntária\nC) por invalidez, formal e inatividade remunerada\nD) por invalidez, compulsória e voluntária\nE) compulsória, inatividade remunerada e direito de afastamento", "gab": "D", "gabLabel": "", "html": "Nos termos do art. 40, § 1º, da CF/88, o regime próprio de previdência prevê: aposentadoria por <b>incapacidade permanente</b> (invalidez), <b>compulsória</b> (aos 75 anos de idade) e <b>voluntária</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q5", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.5", "tema": "", "enun": "Entre as opções, é vedada a acumulação remunerada de cargos públicos, EXCETO quando houver compatibilidade de horários de:\n\nA) dois cargos de técnico\nB) dois cargos de engenheiro\nC) um cargo de administrador com outro técnico\nD) um cargo de professor com outro técnico ou científico\nE) um cargo de auxiliar administrativo com outro técnico ou científico", "gab": "D", "gabLabel": "", "html": "O art. 37, XVI, \"b\", da Constituição Federal autoriza a acumulação remunerada de <b>um cargo de professor com outro técnico ou científico</b>, quando houver compatibilidade de horários. As demais não se enquadram nas exceções constitucionais taxativas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q6", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.6", "tema": "", "enun": "Quanto aos Servidores Públicos, assinale a resposta correta:\n\nA) a proibição de acumular estende-se a empregos e funções e abrange Autarquias, Empresas Públicas e Fundações, exceção feita às Sociedades de Economia Mista;\nB) a Constituição Federal de 1988 proíbe a acumulação remunerada de cargos públicos, exceto quando houver compatibilidade de horário e correlação de matéria;\nC) a Constituição reconhece, aos servidores públicos, direito à livre associação sindical e o direito de greve, este último a ser exercido nos termos e limites definidos em lei complementar;\nD) no âmbito dos Estados e do Distrito Federal, a remuneração e o subsídio dos membros dos Poderes Executivo, Legislativo e Judiciário não poderão exceder o subsídio mensal do Governador;\nE) N.D.A", "gab": "E", "gabLabel": "", "html": "Todas as alternativas A a D contêm erros: A (a proibição abrange sim as SEM — art. 37, XVII, CF); B (a CF não exige correlação de matéria); C (o direito de greve é exercido nos termos de <b>lei específica</b>, não lei complementar — art. 37, VII); D (os subtetos estaduais são distintos por Poder após a EC 41/03). Portanto, N.D.A.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q7", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.7", "tema": "", "enun": "Marque a alternativa que apresenta forma de provimento originário de servidor público civil:\n\nA) Nomeação\nB) readaptação\nC) remoção\nD) ascensão\nE) N.D.A", "gab": "A", "gabLabel": "", "html": "A <b>nomeação</b> é a única forma originária de provimento de cargo público. Readaptação, recondução, reversão, reintegração, aproveitamento e promoção são formas derivadas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q8", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.8", "tema": "", "enun": "De acordo com a Lei nº 8.112/90, considere as assertivas:\nI. Readaptação é uma espécie de transferência efetuada a fim de prover o servidor em cargo mais compatível com a superveniente limitação de sua capacidade física ou mental, conforme apurado em inspeção médica.\nII. São hipóteses de vacância segundo a Lei nº 8.112/90 apenas a: promoção, readaptação, aposentadoria, posse em outro cargo inacumulável e o falecimento.\n\nA) I e II estão corretas\nB) I e II estão incorretas\nC) I está correta e a II está incorreta\nD) I está incorreta e a II está correta\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "A assertiva I é correta (definição exata do art. 24 da Lei nº 8.112/90). A assertiva II é incorreta: o rol de vacância do art. 33 abrange <b>também</b> a <b>exoneração</b> e a <b>demissão</b>, além das 5 hipóteses citadas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q9", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.9", "tema": "", "enun": "Os denominados \"gestores de negócio\", ou seja, aqueles que espontaneamente assumem determinada função pública em momento de emergência, como epidemia, incêndio, enchente, etc, são considerados:\n\nA) agentes políticos\nB) servidores públicos temporários\nC) militares\nD) particulares em colaboração com o Poder Público\nE) cargo em comissão", "gab": "D", "gabLabel": "", "html": "Os gestores de negócios que atuam em situações de calamidade/emergência enquadram-se na categoria dos <b>particulares em colaboração com o Poder Público</b> (agentes honoríficos/transitórios).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q10", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.10", "tema": "", "enun": "Assinale a opção que não constitui forma de provimento de cargo público, nos termos da Lei n. 8.112/90:\n\nA) promoção\nB) readaptação\nC) transferência\nD) aproveitamento\nE) recondução", "gab": "C", "gabLabel": "", "html": "A <b>transferência</b> (assim como a ascensão) foi declarada inconstitucional pela Súmula Vinculante nº 43 do STF e revogada da Lei nº 8.112/90.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q11", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.11", "tema": "", "enun": "Mesário convocado para as eleições gerais pode ser classificado como:\n\nA) empregado público\nB) agente temporário\nC) particular em colaboração com a Administração Pública\nD) agente político\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "O mesário convocado é agente público honorífico incumbido de munus público transitório, enquadrando-se na categoria de <b>particular em colaboração com a Administração Pública</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q12", "bloco": "MÓDULO 8 — Servidor Público", "num": "Ex.12", "tema": "", "enun": "Podemos dizer que o servidor público é espécie do gênero agente público\nPORQUE\nO agente público é toda pessoa física incumbida de uma função pública ou privada, seja em caráter transitório ou definitivo, e ainda com ou sem remuneração.\n\nA) as duas assertivas são falsas.\nB) a primeira assertiva é falsa e a segunda é verdadeira.\nC) a primeira assertiva é verdadeira e a segunda é falsa.\nD) as duas assertivas são verdadeiras e a segunda justifica a primeira.\nE) as duas assertivas são verdadeiras e a segunda não justifica a primeira.", "gab": "C", "gabLabel": "", "html": "A primeira assertiva é verdadeira (servidor público é espécie de agente público). A segunda é falsa porque agente público é toda pessoa incumbida de <b>função pública</b> — não função privada (que é o critério diferenciador).", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "Qual o mnemônico dos princípios constitucionais expressos no art. 37, caput CF?", "v": "<b>LIMPE</b> — Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Razoabilidade e proporcionalidade NÃO constam expressamente."}, {"id": "c2", "f": "Qual a diferença entre o princípio da legalidade para o particular e para a Administração?", "v": "Particular faz tudo que a lei <b>não proíbe</b>. Administração só faz o que a lei <b>expressamente autoriza</b> (Hely Lopes Meirelles)."}, {"id": "c3", "f": "Quais são os atributos do ato administrativo? (mnemônico PAIT)", "v": "<b>P</b>resunção de legitimidade (juris tantum), <b>A</b>utoexecutoriedade, <b>I</b>mperatividade/coercibilidade, <b>T</b>ipicidade. Finalidade é <b>requisito</b>, não atributo."}, {"id": "c4", "f": "Quais são os 5 requisitos/elementos de validade do ato administrativo?", "v": "<b>FF.COM</b> — Forma, Finalidade, Competência (sujeito), Objeto (conteúdo), Motivo. Base: art. 2º, Lei 4.717/65."}, {"id": "c5", "f": "Qual a diferença entre revogação e anulação de ato administrativo?", "v": "<b>Revogação</b> = inconveniência/inoportunidade, efeitos <b>ex nunc</b> (a partir de agora), só pela Administração. <b>Anulação</b> = ilegalidade, efeitos <b>ex tunc</b> (retroativo), pela Adm. ou Judiciário."}, {"id": "c6", "f": "O que é a Teoria dos Motivos Determinantes?", "v": "Se a Administração indicou motivos para praticar o ato (mesmo desnecessário), fica vinculada a eles. Motivo falso ou inexistente = ato nulo, inclusive nos casos de exoneração ad nutum com motivo declarado."}, {"id": "c7", "f": "Quais são os atributos do poder de polícia?", "v": "<b>Discricionariedade</b> (regra; há atos vinculados como licença para construir), <b>Autoexecutoriedade</b> (exigibilidade + executoriedade) e <b>Coercibilidade</b>. Multa é exigível mas NÃO executória."}, {"id": "c8", "f": "Qual a diferença entre licença e autorização no poder de polícia?", "v": "<b>Licença</b> = ato vinculado, gera direito subjetivo (se preenchidos requisitos, não pode ser negada). <b>Autorização</b> = ato discricionário, pode ser negada por interesse público mesmo preenchidos os requisitos."}, {"id": "c9", "f": "Qual a diferença entre desconcentração e descentralização?", "v": "<b>Desconcentração</b> = distribuição interna de competências dentro da mesma PJ, mantendo hierarquia (ex: Ministérios, Secretarias). <b>Descentralização</b> = transferência para PJ distinta (Autarquias, EP, SEM, Fundações)."}, {"id": "c10", "f": "Quais as diferenças entre Empresa Pública e Sociedade de Economia Mista?", "v": "<b>EP</b> = capital 100% público, qualquer forma jurídica, foro na Justiça Federal (federal). <b>SEM</b> = capital misto (maioria votante pública), só S/A, foro na Justiça Estadual (federal). Ambas são PJ de direito privado."}, {"id": "c11", "f": "O que são agências reguladoras? Como diferem das autarquias comuns?", "v": "São <b>autarquias sob regime especial</b> com mandato fixo e estabilidade dos dirigentes (não exoneração ad nutum). Diferem das autarquias comuns exatamente por essa proteção contra ingerência política."}, {"id": "c12", "f": "Qual a natureza jurídica da OAB?", "v": "Entidade <b>sui generis</b> — não é autarquia, não integra a Adm. Indireta da União. Não precisa realizar concurso público para contratar. (STF, ADI 3.026/2006)"}, {"id": "c13", "f": "Quais as modalidades de licitação da Lei 14.133/2021?", "v": "<b>Pregão</b> (bens/serviços comuns), <b>Concorrência</b> (bens/serviços especiais + obras, qualquer valor), <b>Concurso</b> (trabalho técnico/artístico), <b>Leilão</b> (alienação de bens), <b>Diálogo Competitivo</b> (inovação tecnológica). Extintos: tomada de preços e convite."}, {"id": "c14", "f": "Qual a diferença entre dispensa e inexigibilidade de licitação?", "v": "<b>Dispensa</b> = há viabilidade de competição, mas a lei autoriza não licitar por razões de conveniência (ex.: emergência, guerra, valores baixos). <b>Inexigibilidade</b> = inviabilidade de competição (fornecedor exclusivo, artista consagrado, notória especialização)."}, {"id": "c15", "f": "O que são cláusulas exorbitantes nos contratos administrativos?", "v": "Prerrogativas especiais da Administração: modificação unilateral, extinção unilateral, fiscalização, aplicação de sanções e ocupação provisória de bens. Não se admite alteração unilateral das cláusulas <b>econômico-financeiras</b>."}, {"id": "c16", "f": "Quais os percentuais de acréscimos/supressões obrigatórios nos contratos adm.?", "v": "Até <b>25%</b> para obras, serviços ou compras. Até <b>50%</b> no caso de acréscimos para reformas de edifícios ou equipamentos. (art. 65, §1º lei 8.666 / art. 125 lei 14.133)"}, {"id": "c17", "f": "Quais as modalidades de aposentadoria do servidor público (art. 40 CF)?", "v": "<b>Invalidez permanente</b> (proventos proporcionais, salvo acidente/doença grave = integrais), <b>Compulsória</b> aos 75 anos (EC 88/2015), <b>Voluntária</b> (tempo de contribuição + idade)."}, {"id": "c18", "f": "Quais as acumulações lícitas de cargos públicos (art. 37, XVI CF)?", "v": "(1) 2 cargos de <b>professor</b>; (2) 1 cargo de <b>professor + 1 técnico ou científico</b>; (3) 2 cargos de profissional de <b>saúde</b> com profissão regulamentada. Exige compatibilidade de horários."}, {"id": "c19", "f": "Qual a diferença entre cargo em comissão e função de confiança?", "v": "<b>Cargo em comissão</b>: livre nomeação e exoneração (ad nutum), pode ser ocupado por qualquer pessoa (sem concurso). <b>Função de confiança</b>: exclusiva para <b>servidores de carreira</b>. Ambos para direção, chefia e assessoramento (art. 37, V CF)."}, {"id": "c20", "f": "Quando a absolvição penal do servidor repercute nas esferas administrativa e civil?", "v": "Somente quando a absolvição se basear na <b>inexistência do fato</b> ou na <b>negativa de autoria</b>. Absolvição por falta de provas ou outros fundamentos NÃO afasta a responsabilidade adm. e civil. (art. 125 Lei 8.112/90)"}], "cobertura": ["São 96 questões (8 módulos de 12), com enunciado completo, alternativas e gabarito fundamentado.", "A revisão usa a Lei 14.133/2021, mas várias questões do AVA ainda se baseiam na Lei 8.666/1993.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "card", "ref": "c20", "titulo": "Artigo da Lei 8.112 provavelmente errado", "texto": "A regra de que a absolvição criminal por inexistência do fato ou negativa de autoria afasta a responsabilidade administrativa está no art. 126 da Lei 8.112/90. O art. 125 trata da independência das instâncias."}, {"esc": "card", "ref": "c17", "titulo": "Regra de aposentadoria que mudou", "texto": "A EC 103/2019 passou a chamar a invalidez de incapacidade permanente e alterou o cálculo dos proventos (integrais, em regra, só em acidente de trabalho, doença profissional e doença do trabalho). A versão “proporcionais, salvo doença grave” é a regra antiga. Veja qual versão o AVA cobra."}, {"esc": "revisao", "ref": "r7", "titulo": "Regra de aposentadoria que mudou", "texto": "Mesma observação do flashcard sobre aposentadoria por invalidez: a EC 103/2019 mudou a regra. Veja qual versão o AVA cobra."}, {"esc": "revisao", "ref": "r5", "titulo": "Valores de dispensa desatualizados", "texto": "Os valores de R$ 100 mil e R$ 50 mil são os originais da lei. Desde 1º/01/2026, pelo Decreto 12.807/2025, são R$ 130.984,20 (obras e engenharia) e R$ 65.492,11 (demais serviços e compras). Para a prova, vale o que o AVA disser."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["18A1"]={"cod": "18A1", "revisao": [{"id": "r1", "titulo": "DIREITO COMERCIAL — NOÇÕES GERAIS", "prob": "media", "html": "<ul>\n<li><strong>Direito Comercial</strong> = direito privado regulador dos atos necessários às atividades dos comerciantes e dos atos legalmente considerados comerciais</li>\n<li><strong>Surgiu na Idade Média</strong> (corporações de comerciantes) — <strong>NÃO na Roma Antiga</strong> (lá havia o jus civile para todos)</li>\n<li><strong>CC/2002</strong> unificou obrigações civis e comerciais — inspirado no modelo <strong>italiano de 1942</strong>; revogou o Código Comercial de 1850 (1ª parte)</li>\n</ul>\n<p><strong>Teorias do DC:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Teoria</th>\n<th>Fundamento</th>\n<th>Status</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Direito do Comerciante</td>\n<td>Pessoa do comerciante</td>\n<td>Superada</td>\n</tr>\n<tr>\n<td>Direito dos Atos de Comércio</td>\n<td>Natureza do ato (Cód. Napoleônico 1807)</td>\n<td>Superada</td>\n</tr>\n<tr>\n<td>Direito das Empresas</td>\n<td>Organização capital + trabalho</td>\n<td>Atual</td>\n</tr>\n<tr>\n<td>Comerciantes + Atos de Comércio</td>\n<td>Misto</td>\n<td>Mais aceita classicamente</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Características do DC:</strong> simplicidade, internacionalidade, rapidez, boa-fé, onerosidade</p>\n<p><strong>DC ≠ Direito Civil:</strong> imóveis e atividade agrícola = civil | títulos cambiários = sempre comercial</p>\n<p><strong>Principais leis:</strong> CC/2002 (Lei 10.406), LSA (Lei 6.404/76), Lei do Cheque (7.357/85), LPI (9.279/96), LRE (11.101/05), Estatuto ME/EPP (LC 123/06)</p>"}, {"id": "r2", "titulo": "EMPRESÁRIO (art. 966 CC)", "prob": "alta", "html": "<p><strong>Conceito:</strong> quem exerce <em>profissionalmente</em> atividade econômica <em>organizada</em> para produção/circulação de bens ou serviços</p>\n<p><strong>Requisitos:</strong> profissionalismo (habitualidade + pessoalidade + especialidade) + atividade econômica + organização + produção/circulação</p>\n<p><strong>NÃO é empresário</strong> (art. 966 § único): profissão intelectual (científica, literária, artística) — <strong>salvo</strong> se for <em>elemento de empresa</em></p>\n<p><strong>Empresário rural:</strong> registro na Junta Comercial é <strong>FACULTATIVO</strong> (art. 971 CC) e pode ser feito <strong>após</strong> o início das atividades</p>\n<p><strong>Comparativo de portes (LC 123/06 art. 3º):</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Porte</th>\n<th>Receita bruta anual</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>MEI</td>\n<td>até R$ 81 mil</td>\n</tr>\n<tr>\n<td>ME (Microempresa)</td>\n<td>até R$ 360.000</td>\n</tr>\n<tr>\n<td>EPP (Emp. Peq. Porte)</td>\n<td>R$ 360.001 a R$ 4.800.000</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>MEI (LC 128/08):</strong> 1 empregado permitido; recolhe INSS 5% + ISS/ICMS fixo; não pode ser sócio de outra empresa; não pode ter sócio</p>"}, {"id": "r3", "titulo": "TIPOS DE PESSOA JURÍDICA EMPRESARIAL", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Responsabilidade</th>\n<th>Capital mínimo</th>\n<th>Registro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Empresário Individual</td>\n<td>Ilimitada, pessoal e direta</td>\n<td>—</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>SLU (ex-EIRELI)</td>\n<td>Limitada ao capital</td>\n<td>100× maior salário mínimo</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Sociedade Ltda</td>\n<td>Limitada ao valor das quotas</td>\n<td>—</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Sociedade Anônima</td>\n<td>Limitada ao preço de emissão</td>\n<td>—</td>\n<td>JUCEX</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Nome empresarial:</strong></p>\n<ul>\n<li>Firma = usa nome dos sócios</li>\n<li>Denominação = fantasia + objeto social</li>\n<li><strong>NÃO pode ser alienado</strong> (art. 1.164 CC) — princípios: veracidade e novidade</li>\n<li>Sociedade em conta de participação <strong>NÃO tem</strong> firma nem denominação</li>\n</ul>\n<p><strong>Registro — JUCEX (Lei 8.934/94):</strong> publicidade, autenticidade, segurança, eficácia</p>"}, {"id": "r4", "titulo": "ESTABELECIMENTO EMPRESARIAL (art. 1.142 CC)", "prob": "alta", "html": "<ul>\n<li><strong>Estabelecimento</strong> = complexo de bens (materiais e imateriais) organizado para exercício da empresa; universalidade <strong>de fato</strong></li>\n<li><strong>Aviamento</strong> = aptidão/capacidade potencial de gerar lucros (intangível, atributo do estabelecimento, não do empresário)</li>\n<li><strong>Clientela</strong> = conjunto de clientes que frequentam o estabelecimento (elemento imaterial)</li>\n</ul>\n<p><strong>Trespasse (alienação do estabelecimento):</strong></p>\n<ul>\n<li>Credores podem impugnar em <strong>30 dias</strong> após publicação</li>\n<li>Alienante não pode se restabelecer como concorrente por <strong>5 anos</strong> (art. 1.147 CC)</li>\n<li>Adquirente assume contratos vinculados, salvo estipulação contrária (art. 1.148 CC)</li>\n<li>Adquirente responde solidariamente com alienante antes da quitação das dívidas</li>\n</ul>\n<p><strong>Ação renovatória (ponto empresarial):</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Requisito</th>\n<th>Detalhe</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Contrato por escrito</td>\n<td>Obrigatório</td>\n</tr>\n<tr>\n<td>Prazo mínimo</td>\n<td>5 anos (pode ser soma de contratos)</td>\n</tr>\n<tr>\n<td>Ramo mínimo</td>\n<td>3 anos</td>\n</tr>\n<tr>\n<td>Quando propor</td>\n<td>1 ano antes e até 6 meses antes do término</td>\n</tr>\n</tbody>\n</table></div>"}, {"id": "r5", "titulo": "PROPRIEDADE INDUSTRIAL (Lei 9.279/96) — INPI", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Prazo de proteção</th>\n<th>Renovável?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Patente de invenção</td>\n<td>20 anos do depósito</td>\n<td>Não</td>\n</tr>\n<tr>\n<td>Modelo de utilidade</td>\n<td>15 anos do depósito</td>\n<td>Não</td>\n</tr>\n<tr>\n<td>Desenho industrial</td>\n<td>10 anos do depósito</td>\n<td>Sim, 3× de 5 anos → máx. 25 anos</td>\n</tr>\n<tr>\n<td>Marca</td>\n<td>10 anos do registro</td>\n<td>Sim, indefinidamente</td>\n</tr>\n<tr>\n<td>Segredo industrial</td>\n<td>Sem prazo</td>\n<td>— (protegido enquanto em sigilo)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Marcas NÃO registráveis:</strong> brasões/emblemas oficiais; letras/números isolados sem forma distintiva; expressões contrárias à moral; siglas de órgãos públicos; sinais genéricos/descritivos; nomes civis de terceiros sem consentimento; obras artísticas protegidas por direito autoral</p>\n<p><strong>Indicação Geográfica:</strong> IP (Indicação de Procedência = local com reputação) vs. DO (Denominação de Origem = local + qualidade ligada ao meio)</p>\n<p><strong>Caducidade de marca:</strong> falta de uso por <strong>5 anos consecutivos</strong> após a concessão (art. 143 LPI)</p>\n<p><strong>Marca de alto renome:</strong> proteção em <strong>todos</strong> os ramos de atividade (reconhecida pelo INPI)</p>\n<p><strong>Crime de concorrência desleal:</strong> art. 195 LPI</p>"}, {"id": "r6", "titulo": "TEORIA GERAL DAS SOCIEDADES", "prob": "alta", "html": "<p><strong>Sociedade empresária</strong> (art. 982): objeto = atividade de empresário sujeita a registro | <strong>Sociedade simples</strong> = atividade intelectual → registro no RCPJ (NÃO na Junta Comercial)</p>\n<p><strong>Personalidade jurídica:</strong> começa com o <strong>registro</strong> (art. 985 CC)</p>\n<p><strong>Cônjuges impedidos de se associar entre si (art. 977 CC):</strong> regime de <strong>comunhão universal</strong> OU <strong>separação obrigatória</strong> de bens</p>\n<p><strong>Desconsideração da PJ (art. 50 CC):</strong> abuso/desvio de finalidade ou confusão patrimonial → incidente processual (art. 133 CPC)</p>\n<p><strong>Desconsideração inversa:</strong> responsabiliza a <strong>sociedade</strong> por dívidas pessoais dos sócios (art. 50 §§ 2º e 3º CC)</p>\n<p><strong>Sociedades não personificadas:</strong> em comum (sem registro) e em conta de participação</p>"}, {"id": "r7", "titulo": "ESPÉCIES DE SOCIEDADE", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Responsabilidade dos sócios</th>\n<th>Sócios</th>\n<th>Registro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Em Comum</td>\n<td>Solidária e ilimitada (todos)</td>\n<td>Qualquer</td>\n<td>Sem registro</td>\n</tr>\n<tr>\n<td>Conta de Participação</td>\n<td>Ostensivo: ilimitada; oculto: limitada</td>\n<td>Qualquer</td>\n<td>Facultativo</td>\n</tr>\n<tr>\n<td>Simples</td>\n<td>Subsidiária (conforme contrato)</td>\n<td>Qualquer</td>\n<td>RCPJ</td>\n</tr>\n<tr>\n<td>Em Nome Coletivo</td>\n<td>Ilimitada e solidária (todos)</td>\n<td>Só pessoa física</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Em Comandita Simples</td>\n<td>Comanditado: ilimitada; comanditário: limitada</td>\n<td>Misto</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td><strong>Ltda</strong></td>\n<td><strong>Limitada ao valor das quotas</strong></td>\n<td>Qualquer</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td><strong>S/A</strong></td>\n<td><strong>Limitada ao preço de emissão</strong></td>\n<td>Qualquer</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Comandita por Ações</td>\n<td>Diretores: ilimitada; demais: limitada</td>\n<td>Qualquer</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Cooperativa</td>\n<td>Legislação própria; sobras ≠ lucro</td>\n<td>—</td>\n<td>RCPJ</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Dissolução:</strong> total (extinção da sociedade) ≠ resolução parcial (saída de sócio — sociedade continua)</p>"}, {"id": "r8", "titulo": "SOCIEDADE LIMITADA (arts. 1.052–1.087 CC)", "prob": "alta", "html": "<ul>\n<li>Capital dividido em <strong>quotas</strong>; integralização em dinheiro ou bens — <strong>VEDADO</strong> integralizar com prestação de serviços (art. 1.055 §2º CC)</li>\n<li>Sócios respondem <strong>solidariamente</strong> pela integralização do capital</li>\n<li>Cessão de quotas: aprovação de sócios com <strong>≥ 3/4 do capital</strong> (salvo contrato diferente — art. 1.057 CC)</li>\n<li>Administração: sócio ou não sócio (pessoa física capaz)</li>\n</ul>\n<p><strong>Quórum qualificado (3/4 do capital):</strong> mudança de objeto, fusão, incorporação, cisão, transformação, dissolução, aumento de capital, cessão de quotas</p>\n<p><strong>Quórum maioria simples (&gt;50% do capital):</strong> exclusão de sócio, eleição de administrador</p>\n<p><strong>Reunião obrigatória:</strong> quando &gt;10 sócios; anual para aprovar contas (art. 1.072 CC)</p>\n<p><strong>Redução de capital:</strong> somente se não houver oposição de credores quirografários — prazo 90 dias para oposição (art. 1.084 CC)</p>\n<p><strong>Exclusão extrajudicial de sócio:</strong> falta grave; votos de sócios com &gt;50% do capital (excluindo o sócio acusado do cômputo)</p>"}, {"id": "r9", "titulo": "SOCIEDADE ANÔNIMA (Lei 6.404/76)", "prob": "media", "html": "<ul>\n<li>Capital dividido em <strong>ações</strong>; responsabilidade = limitada ao preço de emissão</li>\n<li><strong>Sempre empresarial</strong> independentemente do objeto (art. 1.089 CC)</li>\n<li>Denominação: \"S.A.\" ou \"Companhia\" — <strong>NÃO usa firma</strong> | \"Cia.\" <strong>não pode</strong> ser usada no <strong>final</strong> da denominação</li>\n<li>Ações: sempre <strong>nominativas</strong> (ações ao portador extintas desde Lei 8.021/90)</li>\n</ul>\n<p><strong>Tipos de ações:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Direito a voto</th>\n<th>Outras características</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ordinárias</td>\n<td>Sim</td>\n<td>Direitos básicos</td>\n</tr>\n<tr>\n<td>Preferenciais</td>\n<td>Pode não ter</td>\n<td>Privilégios econômicos</td>\n</tr>\n<tr>\n<td>De gozo/fruição</td>\n<td>Residual</td>\n<td>Amortizadas, mantém direitos residuais</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Aberta vs. fechada:</strong></p>\n<ul>\n<li>Aberta: ações em bolsa/mercado; sujeita à CVM; maior transparência</li>\n<li>Fechada: restrita a grupo de acionistas; não sujeita à CVM</li>\n</ul>\n<p><strong>Órgãos:</strong></p>\n<ul>\n<li>Assembleia Geral (soberana): AGO anual (até 4 meses após fim do exercício) + AGE quando necessário</li>\n<li>Conselho de Administração: <strong>facultativo</strong> em fechada, <strong>obrigatório</strong> em aberta e de capital autorizado</li>\n<li>Diretoria: <strong>obrigatória</strong></li>\n<li>Conselho Fiscal: facultativo</li>\n</ul>\n<p><strong>Subsidiária integral:</strong> único acionista pode ser pessoa jurídica (exceção à regra de pluralidade)</p>"}, {"id": "r10", "titulo": "PEGADINHAS / ERROS CLÁSSICOS", "prob": "media", "html": "<ol>\n<li><strong>DC surgiu na Roma Antiga</strong> → <strong>FALSO.</strong> Surgiu na <strong>Idade Média</strong> com as corporações de comerciantes.</li>\n<li><strong>ME tem receita bruta até R$400k</strong> → <strong>FALSO.</strong> ME = até <strong>R$360k</strong>; EPP = até <strong>R$4,8M</strong> (LC 123/06 art. 3º).</li>\n<li><strong>Nome empresarial pode ser alienado</strong> → <strong>FALSO.</strong> É intransmissível (art. 1.164 CC).</li>\n<li><strong>EIRELI ainda existe</strong> → <strong>FALSO.</strong> Foi absorvida pela <strong>SLU</strong> (Lei 14.195/21).</li>\n<li><strong>Empresário rural obrigatoriamente se registra antes de iniciar</strong> → <strong>FALSO.</strong> Registro é <strong>facultativo</strong> e pode ser feito após o início (art. 971 CC).</li>\n<li><strong>Integralizar quota com prestação de serviços é permitido na Ltda</strong> → <strong>FALSO.</strong> Vedado expressamente (art. 1.055 §2º CC).</li>\n<li><strong>Cônjuges só são impedidos de se associar em comunhão universal</strong> → <strong>FALSO.</strong> Também na <strong>separação obrigatória</strong> (art. 977 CC).</li>\n<li><strong>Patente de invenção = 15 anos</strong> → <strong>FALSO.</strong> Invenção = <strong>20 anos</strong>; Modelo de utilidade = <strong>15 anos</strong>.</li>\n<li><strong>Marca = proteção por 20 anos</strong> → <strong>FALSO.</strong> Marca = <strong>10 anos</strong> renováveis indefinidamente.</li>\n<li><strong>\"Cia.\" pode aparecer no final da denominação</strong> → <strong>FALSO.</strong> Só no início ou meio (\"Cia. das Letras\" ✓; \"Letras Cia.\" ✗).</li>\n<li><strong>Desconsideração da PJ sempre responsabiliza os sócios</strong> → <strong>FALSO.</strong> Desconsideração <strong>inversa</strong> responsabiliza a <strong>sociedade</strong> pelas dívidas pessoais do sócio.</li>\n<li><strong>Sociedade simples se registra na Junta Comercial</strong> → <strong>FALSO.</strong> Sociedade simples = <strong>RCPJ</strong>; empresária = JUCEX.</li>\n<li><strong>Quórum de cessão de quotas é 50%</strong> → <strong>FALSO.</strong> Cessão = <strong>3/4 do capital</strong> (art. 1.057 CC).</li>\n<li><strong>S/A pode ter firma</strong> → <strong>FALSO.</strong> S/A usa <strong>denominação</strong>, nunca firma.</li>\n<li><strong>Caducidade da marca = 3 anos sem uso</strong> → <strong>FALSO.</strong> Caducidade por falta de uso = <strong>5 anos consecutivos</strong> (art. 143 LPI).</li>\n</ol>"}], "top5": ["<b>Conceito de empresário (art. 966 CC)</b> — cobrado em todos os módulos, inclusive via exclusão (intelectual ≠ empresário)", "<b>Limites ME/EPP e MEI</b> — pegadinha clássica dos valores (R$360k, R$4,8M, R$81k)", "<b>Prazos de Propriedade Industrial</b> — patente 20/15 anos, marca 10 renováveis, desenho 10/25", "<b>Tipos de sociedade e responsabilidade</b> — tabela de espécies cobrada diretamente", "<b>Sociedade Limitada</b> — quórum 3/4 para cessão de quotas + vedação de integralização por serviço"], "questoes": [{"id": "M1-Q1", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.1", "tema": "", "enun": "Situação hipotética: Nunes e Almeida são amigos de infância e, após um longo período de dificuldades financeiras, resolveram unir seus talentos para restauração de obras de arte e assim, mesmo que com módicas quantias, conseguir o sustento mínimo de suas famílias. Considerando caso narrado e as normas constantes no Código Civil Brasileiro de 2002.Acerca do direito de empresa, marque alternativa correta:\n\nA) O exercício da atividade empresarial independe do registro em órgão competente para se constituir. O registro, pois, não é constitutivo, porém é ato considerado obrigatório para todo empresário após o início de suas atividades empresariais.\nB) Nunes e Almeida, mesmo que não possuam devido registro de sua atividade na junta comercial do estado em que a realizar, serão considerados empresários uma vez que a atividade seja desenvolvida com habitualidade e fim lucrativo.\nC) Nunes e Almeida serão considerados empresários a partir do momento que efetuarem o registro no Departamento Nacional de Registro de Comércio - DNRC do estado em que desenvolvem sua atividade de restauração de obras de arte.\nD) Como as quantias arrecadadas pelos dois amigos são módicas e ficam restritas ao sustento das famílias, a atividade desenvolvida por eles não poderá ser caracterizada como empresária em razão da ausência de requisito essencial, qual seja: lucro.\nE) Nunes e Almeida não serão considerados empresários, pois a atividade desenvolvida pelos amigos é artística e, portanto, não há caracterização de elemento de empresa. Tal reunião de esforços comuns terá natureza jurídica de sociedade simples, não sendo alcançada pelo direito empresarial brasileiro.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q2", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.2", "tema": "", "enun": "Considerando o atual estágio do direito comercial (ou empresarial) brasileiro, assinale a opção correta.\n\nA) O Código Civil de 2002 revogou totalmente o Código Comercial de 1850.\nB) A Constituição da República estabelece a competência privativa da União para legislar sobre direito comercial (ou empresarial).\nC) O Código Civil de 2002, assim como o Código Comercial de 1850, adotou a teoria da empresa.\nD) O Código Civil de 2002 não revogou a antiga legislação sobre sociedades por quotas de responsabilidade limitada.\nE) O Código Civil de 2002, assim como o Código Comercial de 1850, adotou a teoria dos Atos de Comércio.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q3", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.3", "tema": "", "enun": "O engenheiro agrônomo Zacarias é proprietário de quatro fazendas onde ele realiza, em nome próprio, a exploração de culturas de soja e milho, bem como criação intensiva de gado. A atividade em todas as fazendas é voltada para exportação, com emprego intenso de tecnologia e insumos de alto custo. Zacarias não está registrado na Junta Comercial.\nCom base nessas informações, é correto afirmar que:\n\nA) Zacarias, por exercer empresa em caráter profissional, é considerado empresário independentemente de ter ou não registro na Junta Comercial.\nB) Zacarias, mesmo que exerça uma empresa, não será considerado empresário pelo fato de não ter realizado seu registro na Junta Comercial.\nC) Zacarias não pode ser registrado como empresário, porque, sendo engenheiro agrônomo, exerce profissão intelectual de natureza científica, com auxílio de colaboradores.\nD) Zacarias é um empresário de fato, por não ter realizado seu registro na Junta Comercial antes do início de sua atividade, descumprindo obrigação legal.\nE) Zacarias, considerado empresário pelo Ministério da Agricultura, pois este exige o Cadastro Nacional da Pessoa Jurídica (CNPJ) para autorizar a exportação de soja e milho.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q4", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.4", "tema": "", "enun": "Considerando a evolução histórica do direito empresarial, assinale a opção correta\n\nA) A teoria dos atos de comércio foi adotada, inicialmente, nas feiras medievais da Europa pelas corporações de comerciantes que então se formaram.\nB) A edição do Código Francês de 1807 é considerada o marco inicial do direito comercial no mundo\nC) Considera-se o marco inicial do direito comercial brasileiro a lei de abertura dos portos, em 1808, por determinação do rei Dom João VI.\nD) É de origem francesa a teoria da empresa, adotada pelo atual Código Civil brasileiro.\nE) O direito romano apresentou um corpo systematizado de normas sobre atividade comercial.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q5", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.5", "tema": "", "enun": "Os preponentes são responsáveis pelos atos de quaisquer prepostos, praticados nos seus estabelecimentos\n\nA) e relativos à atividade da empresa, desde que autorizados por escrito.\nB) mesmo que não sejam relativos à atividade da empresa ou que não tenham sido autorizados por escrito.\nC) e relativos à atividade da empresa, ainda que não autorizados por escrito.\nD) ou fora deles, desde que relativos à atividade da empresa, ainda que não autorizados por escrito.\nE) ou fora deles, ainda que não relativos à atividade da empresa ou que não autorizados por escrito.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q6", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.6", "tema": "", "enun": "Assinale a alternativa incorreta.\n\nA) O ramo da atividade comercial apresenta características ligadas à sua onerosidade, posição cosmopolita, menor informalismo possível.\nB) Nos primeiros tempos o Direito Comercial foi como que uma decorrência das transações econômicas de indivíduos que tinham por profissão fazer circular as mercadorias.\nC) Pode, com segurança, afirmar que houve um Direito Comercial na mais remota antiguidade.\nD) Apesar de guerreiros por excelência, os romanos conheceram o comércio. A sua prática, contudo, não era exercitada diretamente pelos nascidos em Roma e sim por intermédio dos escravos. Os estrangeiros que mercadejavam em Roma eram regidos pelo jus gentium, com normas diversas do jus civile, e as suas questões resolvidas pelo pretor peregrinus.\nE) O Direito Comercial como um conjunto de normas jurídicas especiais, diversas do Direito Civil, para regular as atividades profissionais dos comerciantes, tem a sua origem na Idade Média. Desenvolvendo-se o comércio marítimo no Mediterrâneo, as cidades que ficavam situadas à beira-mar tornaram-se centros comerciais importantes e poderosos.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q7", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.7", "tema": "", "enun": "Quanto aos prepostos, é correto afirmar:\n\nA) Gerente é o preposto, permanente ou temporário, no exercício da sede da empresa, cujos poderes se estendem sobre suas filiais ou sucursais.\nB) O preposto não pode, sem autorização escrita, fazer-se substituir no desempenho da preposição, sob pena de os sócios da empresa responderem solidariamente pelas obrigações contraídas e o preposto responder subsidiariamente pelos atos do substituto.\nC) Salvo autorização expressa ou assentimento tácito, o preposto não poderá negociar por conta própria ou de terceiro, nem participar, direta ou indiretamente, de operação do mesmo gênero da que lhe foi atribuída, sob pena de responder por perdas e danos materiais e morais.\nD) Quando a lei não exigir poderes especiais, considera-se o gerente autorizado a praticar todos os atos necessários ao exercício dos poderes que lhe foram outorgados e, na falta de estipulação diversa, consideram-se solidários os poderes conferidos a dois ou mais gerentes.\nE) As limitações contidas aos poderes outorgados ao gerente serão sempre ineficazes em relação às pessoas com quem ela tratar.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q8", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.8", "tema": "", "enun": "A proteção do nome comercial do empresário no território nacional depende de inscrição :\n\nA) na Junta Comercial do Estado em que se localiza o seu estabelecimento principal.\nB) na Junta Comercial de todos os Estados da Federação, independentemente da existência de estabelecimento.\nC) na Junta Comercial de todos os Estados da Federação em que se localizarem seus estabelecimentos.\nD) na Junta Comercial do Estado do local do seu estabelecimento principal e de inscrição do empresário no Departamento Nacional de Registro do Comércio.\nE) no Departamento Nacional de Registro de Comércio.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q9", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.9", "tema": "", "enun": "Considerando-se as noções sobre o nome empresarial, assinale a opção que representa a sequência correta das afirmativas:\nI- O nome empresarial é gênero do qual são espécies firma e denominação;\nII- O nome empresarial e firma são espécies do gênero denominação;\nIII- O nome empresarial e a denominação são espécies do gênero firma;\n\nA) I-verdadeira; II-falsa; III-falsa;\nB) I-verdadeira; II-verdadeira; III-falsa;\nC) I-falsa; II-verdadeira; III-falsa;\nD) I-falsa; II-falsa; III-verdadeira.\nE) Todas são verdadeiras", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q10", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.10", "tema": "", "enun": "Maria, Antonia, Joana e Cristina desejam formar uma sociedade na qual apenas Maria e Antonia figurem como sócias de responsabilidade ilimitada. Com relação ao nome empresarial, de acordo com o Código Civil, a sociedade operará sob\n\nA) firma, que deverá designar o objeto da sociedade, sendo obrigatório nela figurar o nome de todos os sócios.\nB) denominação, que deverá designar o objeto da sociedade, sendo permitido nela figurar o nome de um ou mais sócios, bastando, para formá-la, aditar ao nome de qualquer um deles a expressão “ltda\".\nC) firma, na qual somente poderão figurar os nomes dos sócios de responsabilidade ilimitada, bastando, para formá-la, aditar ao nome de um deles a expressão “e companhia” ou sua abreviatura.\nD) denominação, na qual somente poderão figurar os nomes dos sócios de responsabilidade ilimitada, bastando, para formá-la, aditar ao nome de um deles a expressão “e companhia” ou sua abreviatura.\nE) denominação, na qual poderão figurar os nomes de qualquer um dos sócios, bastando, para formá-la, aditar ao nome de um deles a expressão “e companhia” ou sua abreviatura.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q11", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.11", "tema": "", "enun": "Assinale a alternativa correta em relação aos conceitos de empresa e empresário no Direito Empresarial.\n\nA) Empresa é a sociedade com ou sem personalidade jurídica; empresário é o sócio da empresa, pessoa natural ou jurídica com responsabilidade limitada ao valor das quotas integralizadas.\nB) Empresa é qualquer atividade econômica destinada à produção de bens; empresário é a pessoa natural que exerce profissionalmente a empresa e tenha receita bruta anual de até R$ 100.000,00 (cem mil reais).\nC) Empresa é a atividade econômica organizada para a produção e/ou a circulação de bens e de serviços; empresário é o titular da empresa, quem a exerce em caráter profissional.\nD) Empresa é a repetição profissional dos atos de comércio ou mercancia; empresário é a pessoa natural ou jurídica que pratica de modo habitual tais atos de comércio.\nE) A empresa a parte do Direito Privado que tem principalmente por objeto fazer circular as mercadorias no exercício do comércio", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q12", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.12", "tema": "", "enun": "Sobre a disciplina dos prepostos no Livro do Direito de Empresa do Código Civil, assinale a opção INCORRETA\n\nA) Considera-se o gerente autorizado a praticar todos os atos necessários ao exercício dos poderes que lhe foram outorgados, mesmo quando a lei exigir poderes especiais.\nB) Em regra, considera-se perfeita a entrega de papéis, bens ou valores ao preposto, encarregado pelo preponente, se os recebeu sem protesto.\nC) O preposto não pode, sem autorização escrita, fazer-se substituir no desempenho da preposição, sob pena de responder, pessoalmente, pelos atos do substituto e pelas obrigações por ele contraídas\nD) O gerente pode estar em juízo em nome do preponente, pelas obrigações resultantes do exercício da sua função.\nE) Na falta de estipulação diversa, consideram-se solidários os poderes conferidos a dois ou mais gerentes.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q13", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.13", "tema": "", "enun": "Alfredo Chaves exerce, em caráter profissional, atividade intelectual de natureza literária, com a colaboração de auxiliares. O exercício da profissão constitui elemento de empresa. Não há registro da atividade por parte de Alfredo Chaves em nenhum órgão público. Com base nessas informações e nas disposições do Código Civil, assinale a afirmativa correta.\n\nA) Alfredo Chaves não é empresário, porque exerce atividade intelectual de natureza literária.\nB) Alfredo Chaves não é empresário, porque não possui registro em nenhum órgão público.\nC) Alfredo Chaves é empresário, independentemente da falta de inscrição na Junta Comercial.\nD) Alfredo Chaves é empresário, porque exerce atividade não organizada em caráter profissional.\nE) Alfredo Chaves é empresário, porque exerce atividade intelectual", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q14", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.14", "tema": "", "enun": "Rosana e Carolina pretendem reunir esforços para empreender uma atividade econômica, constituindo uma Empresa Individual de Responsabilidade Limitada (EIRELI).\nEssa iniciativa será possível se observada a seguinte condição:\n\nA) Rosana poderá indicar Carolina como administradora, mas somente poderá figurar em uma única empresa dessa modalidade.\nB) Rosana e Carolina poderão ser coproprietárias de todas as quotas, mas estas serão indivisíveis em relação a EIRELI, salvo para efeito de transferência.\nC) não será cabível a desconsideração da personalidade jurídica da EIRELI, diante da limitação de responsabilidade de Carolina ao valor do capital social.\nD) a remuneração decorrente da cessão de direitos patrimoniais de autor, de que sejam detentoras tanto Rosana quanto Carolina, vinculados à atividade profissional de ambas, poderá ser atribuída à EIRELI constituída para a prestação de serviços.\nE) n.d.a", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q15", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.15", "tema": "", "enun": "Quais dos elementos indicados a seguir são considerados indispensáveis para a existência de uma empresa?\n\nA) Lucro, sociedade e aviamento.\nB) Produção racional, comercialização dos produtos e função social.\nC) Eficiência, registro no órgão competente e estabilidade.\nD) Atividade, empresário e estabelecimento.\nE) n.d.a", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q16", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.16", "tema": "", "enun": "Em relação ao Direito de Empresa, analise as seguintes afirmativas:\nI - Os conceitos de empresa e empresário não se confundem, pois enquanto a primeira é a atividade econômica organizada para a produção ou a circulação de bens ou serviços, o segundo é aquele que exerce a atividade econômica organizada profissionalmente. A empresa pode ser exercida por meio do empresário individual ou por sociedade empresária. Desta forma, a empresa não se confunde com a pessoa natural inscrita no Cadastro de Pessoas Físicas (CPF), nem com a pessoa jurídica registrada no Cadastro Nacional de Pessoas Jurídicas (CNPJ).\nII - A empresa é o empresário individual ou a sociedade empresária que realiza atividade econômica organizada, registrada no Cadastro de Pessoas Físicas (CPF) ou no Cadastro Nacional de Pessoas Jurídicas (CNPJ).\nIII - Celebram contrato de sociedade as pessoas que reciprocamente se obrigam a contribuir, com bens ou serviços, para o exercício de atividade econômica e a partilha, entre si, dos resultados.\nIV - Quem exerce a atividade empresarial é o empresário, seja ele individual ou na forma societária, que não se confunde com a figura do sócio, que é uma das partes que detém qualquer fração, ou a mesmo a totalidade, do capital social da entidade societária.\nAssinale a alternativa CORRETA:\n\nA) Apenas a assertiva II está incorreta.\nB) Apenas a assertiva III está correta.\nC) Apenas a assertiva IV está correta.\nD) Apenas a assertiva I está incorreta.\nE) Todas as assertivas estão corretas.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q17", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.17", "tema": "", "enun": "Os preponentes são responsáveis pelos atos de quaisquer prepostos, praticados nos seus estabelecimentos\n\nA) e relativos à atividade da empresa, desde que autorizados por escrito.\nB) mesmo que não sejam relativos à atividade da empresa ou que não tenham sido autorizados por escrito.\nC) e relativos à atividade da empresa, ainda que não autorizados por escrito.\nD) ou fora deles, desde que relativos à atividade da empresa, ainda que não autorizados por escrito.\nE) ou fora deles, ainda que não relativos à atividade da empresa ou que não autorizados por escrito.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q18", "bloco": "MÓDULO 1 — Noções Gerais, Atos de Comércio, Dos Comerciantes ou Empresários e Auxiliares dos comerciantes. Preposição.", "num": "Ex.18", "tema": "", "enun": "Quanto aos princípios que norteiam a formação do nome empresarial, é correto afirmar que a regra que exige que o nome de empresário deve distinguir-se de qualquer outro já inscrito no mesmo registro (art. 1.163 do Código Civil) constitui exemplo do princípio:\n\nA) Novidade.\nB) Ubiquidade\nC) Alteridade\nD) Primariedade\nE) Veracidade", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q1", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.1", "tema": "", "enun": "Para os efeitos da Lei Complementar no 123/2006, consideram-se microempresas ou empresas de pequeno porte, a sociedade empresária, a sociedade simples, a empresa individual de responsabilidade limitada e o empresário a que se refere o artigo 966 do Código Civil em vigor, devidamente registrados no Registro de Empresas Mercantis ou no Registro Civil de Pessoas Jurídicas, conforme o caso, desde que:\n\nA) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 400.000,00 (quatrocentos mil reais); no caso de empresa de pequeno porte, aufira receita bruta superior a R$ 400.000,00 (quatrocentos mil reais) e igual ou inferior a R$ 4.800.000,00 (quatro milhões e oitocentos mil reais).\nB) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 360.000,00 (trezentos e sessenta mil reais); no caso de empresa de pequeno porte aufira receita bruta superior a R$ 360.000,00 (trezentos e sessenta mil reais) e igual ou inferior a R$ 4.800.000,00 (quatro milhões e oitocentos mil reais).\nC) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 380.000,00 (trezentos e oitenta mil reais); no caso de empresa de pequeno porte, aufira receita bruta superior a R$ 380.000,00 (trezentos e oitenta mil reais) e igual ou inferior a R$ 4.800.000,00 (quatro milhões e oitocentos mil reais).\nD) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 360.000,00 (trezentos e sessenta mil reais); no caso de empresa de pequeno porte, aufira receita bruta superior a R$ 360.000,00 (trezentos e sessenta mil reais) e igual ou inferior a R$ 5.000.000,00 (cinco milhões de reais).\nE) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 400.000,00 (quatrocentos mil reais); no caso de empresa de pequeno porte aufira receita bruta superior a R$ 400.000,00 (quatrocentos mil reais) e igual ou inferior a R$ 5.000.000,00 (cinco milhões de reais).", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q2", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.2", "tema": "", "enun": "Com relação ao empresário e aos prepostos, assinale a opção correta de acordo com a legislação pertinente.\n\nA) A inscrição do empresário na junta comercial é requisito para a sua caracterização.\nB) A lei prevê cobrança de multa do incapaz que exercer diretamente atividade própria de empresário.\nC) O gerente de empresa poderá delegar poderes de representação, uma vez que as prerrogativas a ele conferidas, embora pessoais, são transferíveis\nD) No exercício de suas funções, os prepostos são pessoalmente responsáveis, perante terceiros, pelos atos culposos.\nE) O empresário casado pode alienar os bens imóveis que integram o patrimônio da empresa sem outorga conjugal.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q3", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.3", "tema": "", "enun": "Relativamente à EIRELI (empresa individual de responsabilidade limitada), assinale a alternativa incorreta:\n\nA) A pessoa natural que constituir emp
