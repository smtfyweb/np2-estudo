estabeleça distribuição desproporcional à participação de cada um no capital social.\nIII. A falta de pluralidade dos sócios ensejará a dissolução da sociedade, no prazo de cento e oitenta dias, desde que haja previsão contratual quanto ao prazo.\nIV. São cláusulas essenciais ao contrato social: tipo societário; objeto social; capital social; responsabilidade dos sócios; qualificação dos sócios; nomeação de administrador; nome empresarial; sede e foro; prazo de duração.  Assinale a alternativa correta.\n\nA) Todas as assertivas são verdadeiras.\nB) As assertivas I, II e IV são verdadeiras.\nC) As assertivas II e III não são verdadeiras.\nD) Apenas as assertivas I e III são verdadeiras.\nE) Nenhuma das alternativas.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q18", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.18", "tema": "", "enun": "No estudo dos Atos Constitutivos das Sociedades, podemos afirmar que:\n\nA) A Capacidade é elemento específico do Contrato Social;\nB) A Pluralidade de Sócios é elemento Comum do Contrato Social;\nC) A Sociedade Empresária pode ter sócios que contribuam com Prestação de Serviços;\nD) A Constituição de Sociedades Empresariais pode dispensar a existência do Capital Social;\nE) A Participação nos Resultados é elemento específico do Contrato Social.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q1", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.1", "tema": "", "enun": "Em relação à sociedade em comum, é correto afirmar:\n\nA) Se os bens da sociedade não lhe cobrirem as dívidas, respondem os sócios pelo saldo, na proporção em que participem das perdas sociais.\nB) Todos os sócios respondem solidariamente pela integralização do capital social.\nC) A responsabilidade de cada sócio é restrita ao valor de suas quotas.\nD) Não há solidariedade entre os sócios pelas dívidas sociais.\nE) É excluído do benefício de ordem, previsto no Código Civil, aquele sócio que contratou pela sociedade.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q2", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.2", "tema": "", "enun": "Mariana, Januária e Cristina decidiram constituir uma sociedade em conta de participação, sendo a primeira sócia ostensiva e as demais sócias participantes. Sobre o caso apresentado, de acordo com as disposições do Código Civil, assinale a opção correta:\n\nA) É vedada a participação de mais de um sócio ostensivo na sociedade em conta de participação; logo, as demais sócias não poderão ter a qualidade de sócio ostensivo.\nB) As sócias participantes Januária e Cristina poderão fiscalizar a gestão dos negócios sociais pela sócia ostensiva Mariana.\nC) A sociedade em conta de participação deverá adotar como nome empresarial firma social, da qual deverá fazer parte a sócia ostensiva.\nD) A sociedade somente poderá existir se o contrato não estiver inscrito em qualquer registro, pois é uma sociedade não personificada.\nE) Nenhuma das alternativas acima.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q3", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.3", "tema": "", "enun": "João e Paulo, empresários, constituíram uma sociedade em conta de participação para atuação no mercado imobiliário. Ajustaram que João seria o sócio ostensivo e Paulo o sócio participante, cada qual contribuindo com R$ 50.000,00 (cinquenta mil reais) para a consecução do objeto social. Nesse caso:\n\nA) sem prejuízo do direito de fiscalizar a gestão dos negócios sociais, Paulo não poderá tomar parte nas relações de João com terceiros, sob pena de responder subsidiariamente pelas obrigações em que intervier.\nB) na omissão do contrato social, João poderá admitir novo sócio sem o consentimento expresso de Paulo.\nC) a inscrição do contrato social no Registro do Comércio confere personalidade jurídica à sociedade em conta de participação.\nD) a falência de João acarreta a dissolução da sociedade e a liquidação da respectiva conta, cujo saldo constituirá crédito quirografário, porém, falindo Paulo, o contrato social fica sujeito às normas que regulam os efeitos da falência nos contratos bilaterais do falido.\nE) a contribuição de Paulo constitui, com a de João, patrimônio especial, objeto da conta de participação relativa aos negócios sociais e a especialização patrimonial produz efeitos tanto em relação aos sócios, quanto em relação a terceiros.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q4", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.4", "tema": "", "enun": "Em relação à sociedade em nome coletivo, assinale a proposição correta:\n\nA) Na sociedade em nome coletivo podem tomar parte pessoas físicas e jurídicas, respondendo todos os sócios, solidária e ilimitadamente pelas obrigações sociais.\nB) Na sociedade em nome coletivo os sócios não podem eximir-se da responsabilidade perante terceiros; igualmente, não podem limitar, no contrato social, entre si a responsabilidade de cada um.\nC) O credor particular de sócio não pode, antes de dissolver a sociedade em nome coletivo, pretender a liquidação da cota do devedor.\nD) A administração da sociedade em nome coletivo compete a todos os sócios, bem assim o uso da firma, posto que todos possuem os necessários poderes, que é a sua característica.\nE) Nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q5", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.5", "tema": "", "enun": "A respeito das sociedades previstas no Código Civil, assinale a opção correta:\n\nA) Na sociedade em comandita simples, os sócios comanditários são obrigados apenas pelo valor de suas quotas.\nB) Na sociedade em conta de participação, obrigam-se todos os sócios perante terceiros com quem a sociedade contrata.\nC) A sociedade em nome coletivo pode contar, entre seus sócios, com outra sociedade.\nD) Na sociedade em comandita por ações, o acionista diretor não tem direito ao benefício de ordem, respondendo solidariamente com a sociedade pelas obrigações sociais.\nE) A sociedade simples deve ser registrada no registro público de empresas.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q6", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.6", "tema": "", "enun": "As sociedades empresárias regulares, no Direito Brasileiro, podem adotar os seguintes tipos:\n\nA) sociedade em nome coletivo, sociedade em comandita por ações, sociedade limitada, sociedade de propósito específico, sociedade por ações.\nB) sociedade em nome coletivo, sociedade em comum, sociedade cooperativa, sociedade limitada, sociedade por ações.\nC) sociedade em nome coletivo, sociedade em comandita simples e comandita por ações, sociedade limitada, sociedade por ações.\nD) sociedade simples, sociedade em nome coletivo, sociedade em comandita simples e por ações, sociedade limitada, sociedade por ações.\nE) Nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q7", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.7", "tema": "", "enun": "Em uma sociedade em nome coletivo, sem prejuízo da responsabilidade perante terceiro, os sócios podem limitar entre si a responsabilidade de cada um:\n\nA) no ato constitutivo, ou por convenção posterior aprovada pela maioria dos sócios.\nB) no ato constitutivo, ou por convenção posterior aprovada por dois terços dos sócios.\nC) no ato constitutivo, ou por unânime convenção posterior.\nD) somente se houver alteração no tipo de sociedade.\nE) somente no ato constitutivo.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q8", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.8", "tema": "", "enun": "Na _____________________, a atividade constitutiva do objeto social é exercida unicamente pelo sócio ostensivo, em seu nome individual e sob sua própria e exclusiva responsabilidade, participando os demais dos resultados correspondentes. Assinale a alternativa que preenche corretamente a lacuna.\n\nA) sociedade em nome coletivo.\nB) sociedade cooperativa.\nC) sociedade em comandita simples.\nD) sociedade em conta de participação\nE) sociedade em comum.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q9", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.9", "tema": "", "enun": "No que concerne às sociedades simples, não é correto afirmar que:\n\nA) Ela adquire personalidade jurídica com a inscrição de seus atos constitutivos no registro próprio, em até trinta dias subsequentes à sua constituição;\nB) Pessoas jurídicas podem ser sócias em sociedades simples;\nC) As obrigações dos sócios começam imediatamente com o contrato, sendo vedada a designação de data diversa;\nD) A cláusula que exclua um sócio de participar de lucros e perdas é considerada nula.\nE) Na omissão do contrato social, a administração da sociedade compete separadamente a cada um dos sócios.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q10", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.10", "tema": "", "enun": "Uma das causas pela qual se dissolve a sociedade é a falta de pluralidade de sócios. A lei civil, contudo, admite a unipessoalidade temporária, caso em que poderá a sociedade ser reconstituída, pelo prazo de:\n\nA) 60 dias.\nB) 30 dias.\nC) 180 dias.\nD) 90 dias.\nE) nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q11", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.11", "tema": "", "enun": "Assinale a opção correta acerca do direito societário:\n\nA) A sociedade em nome coletivo será constituída por pessoas físicas ou jurídicas e a responsabilidade de cada sócio é restrita ao valor de suas quotas.\nB) A sociedade anônima será considerada simples ou empresária, conforme a atividade desenvolvida.\nC) A sociedade controladora é titular de direitos de sócio que lhe assegurem preponderância nas deliberações sociais e o poder de eleger a maioria dos administradores da sociedade controlada.\nD) As sociedades limitadas adquirem personalidade jurídica no momento em que todos os sócios assinam o contrato social, devidamente elaborado e discutido em assembleia geral.\nE) Dissolve-se uma sociedade empresária sempre que à falta de pluralidade de sócios, esta não seja reconstituída no prazo de sessenta dias.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q12", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.12", "tema": "", "enun": "A respeito das sociedades previstas no Código Civil, assinale a opção correta:\n\nA) Na sociedade em comandita simples, os sócios comanditários são obrigados apenas pelo valor de suas quotas.\nB) Na sociedade em conta de participação, obrigam-se todos os sócios perante terceiros com quem a sociedade contrata.\nC) A sociedade em nome coletivo pode contar, entre seus sócios, com outra sociedade.\nD) Na sociedade em comandita por ações, o acionista diretor não tem direito ao benefício de ordem, respondendo solidariamente com a sociedade pelas obrigações sociais.\nE) A sociedade simples deve ser registrada no registro público de empresas.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q13", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.13", "tema": "", "enun": "É INCORRETO afirmar:\n\nA) Nas sociedades limitadas, o contrato social restringe a responsabilidade dos sócios ao valor de suas contribuições ou à soma do capital social.\nB) Sociedade de capital fixo cujo capital é determinado e estável e só pode ser modificado por alteração do contrato.\nC) A sociedade em conta de participação, em razão de sua estrutura econômica é reputada sociedade de capitais.\nD) As sociedades irregulares denominadas \"em comum\" pelo Código Civil, são sociedades não personificadas.\nE) As sociedades ilimitadas são aquelas em que todos os sócios assumem responsabilidade ilimitada e solidária relativamente às obrigações.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q14", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.14", "tema": "", "enun": "NÃO são empresárias:\n\nA) as sociedades cooperativas.\nB) as sociedades por ações que tenham por objeto a prestação de serviços.\nC) quaisquer sociedades limitadas.\nD) apenas as sociedades não personificadas.\nE) as sociedades em nome coletivo, qualquer que seja o seu objeto.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q15", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.15", "tema": "", "enun": "Em relação aos diversos tipos de sociedade, assinale a opção correta:\n\nA) A sociedade em comum é uma sociedade contratual que está em fase de organização.\nB) Servidor público pode compor o quadro social de sociedade em comandita simples, desde que na condição de sócio comanditado.\nC) A fusão e a incorporação de sociedade anônima passaram a ser reguladas pelas normas do novo Código Civil, tendo sido revogados os respectivos artigos da Lei de Sociedades Anônimas.\nD) Não foi recepcionada pelo novo Código Civil a sociedade de capital e indústria, não sendo mais permitida a contribuição de sócio apenas em trabalho próprio.\nE) A sociedade limitada rege-se supletivamente pelas normas da sociedade simples, se assim estiver estipulado no contrato social.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q16", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.16", "tema": "", "enun": "Nas sociedades em nome coletivo,\n\nA) os sócios podem ser pessoas físicas ou jurídicas.\nB) o falecimento de sócio implica a liquidação das quotas do falecido, caso o contrato social seja omisso a tal respeito.\nC) a administração pode competir a sócio ou a terceiro designado pelos sócios.\nD) os sócios respondem, de forma subsidiária e limitada à integralização de suas quotas, pelas obrigações sociais.\nE) a sociedade pode utilizar como nome empresarial de uma denominação.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q17", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.17", "tema": "", "enun": "Com relação à Sociedade não personificada, nos termos do Código Civil, afirma-se:\nI- Enquanto não inscritos os atos constitutivos, reger-se-á a sociedade, exceto por ações em organização, pelo disposto neste Capítulo, observadas, subsidiariamente e no que com ele forem compatíveis, as normas da sociedade simples.\nII- Os sócios, nas relações entre si ou com terceiros, podem provar a existência da sociedade, por documento escrito ou acordo tácito, mas os terceiros podem prová-la de qualquer modo.\nIII- Os bens e dívidas sociais constituem patrimônio especial, do qual os sócios são titulares em comum.\nIV- Os bens sociais respondem pelos atos de gestão praticados por qualquer dos sócios, salvo pacto expresso limitativo de poderes, que somente terá eficácia contra o terceiro que o conheça ou deva conhecer.\nV- Todos os sócios respondem subsidiária, solidária e ilimitadamente pelas obrigações sociais, admitido o benefício de ordem, previsto.\nAssinale a alternativa que indica as informações certas.\n\nA) I, III e IV.\nB) II, IV e V.\nC) II, III e IV.\nD) I, III e V.\nE) III, IV e V.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M6-Q18", "bloco": "MÓDULO 6 — Sociedades Empresárias – Espécies", "num": "Ex.18", "tema": "", "enun": "A propósito da sociedade em conta de participação, assinale a opção incorreta.\n\nA) O contrato da sociedade em conta de participação produz efeito somente entre os sócios, e a eventual inscrição de seu instrumento em qualquer registro não confere personalidade jurídica à sociedade.\nB) A contribuição do sócio participante constitui, com a do sócio ostensivo, patrimônio especial, objeto da conta de participação relativa aos negócios sociais.\nC) A falência do sócio ostensivo acarreta a dissolução da sociedade e a liquidação da respectiva conta, cujo saldo constituirá crédito quirografário.\nD) Salvo estipulação em contrário, o sócio ostensivo não pode admitir novo sócio sem o consentimento expresso dos demais.\nE) Os sócios, nas relações entre si ou com terceiros, somente por escrito podem provar a existência da sociedade em conta de participação, mas os terceiros podem prová-la de qualquer modo.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q1", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.1", "tema": "", "enun": "A deliberação dos sócios que visem modificar o contrato social nas sociedades limitadas serão tomadas, em regra:\n\nA) por 1/4 do capital social;\nB) por  2/4 do capital social;\nC) por 3/4 do capital social;\nD) pela totalidade do capital social.\nE) Nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q2", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.2", "tema": "", "enun": "Nas sociedades limitadas com onze ou mais sócios, é obrigatória a realização de assembleia para deliberação sobre as seguintes matérias indicadas no Código Civil brasileiro, exceto:\n\nA) modificação do contrato social;\nB) destituição de administradores;\nC) incorporação, fusão e dissolução da sociedade;\nD) dispensa de empregados;\nE) nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q3", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.3", "tema": "", "enun": "Quanto às quotas da sociedade limitada, é incorreto afirmar:\n\nA) são penhoráveis, desde que autorizados no contrato social;\nB) podem ser de valor igual ou desigual;\nC) representam parcela do capital social;\nD) podem ser objeto de condomínio.\nE) Nenhuma das alternativas acima.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q4", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.4", "tema": "", "enun": "Nas sociedades limitadas, com relação à formação do capital social e sua divisão em quotas, assinale a assertiva incorreta:\n\nA) o capital social divide-se em quotas, iguais e desiguais, cabendo uma ou diversos a cada sócio;\nB) no caso de condomínio de quota, os direitos a ela inerentes somente podem ser exercidos pelos condôminos representantes ou pelo inventariante do espólio do sócio falecido.\nC) pela exata estimação de bens conferidos ao capital social respondem solidariamente todos os sócios, até o prazo de 5 anos da data do registro da sociedade;\nD) para a formação do capital social é permitida contribuição que consista em prestação de serviços.\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q5", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.5", "tema": "", "enun": "Na omissão do contrato social, a cessão de quotas entre sócios de uma sociedade limitada:\n\nA) é livre;\nB) depende da aprovação de metade dos sócios presentes em reunião;\nC) depende da aprovação de metade do capital social;\nD) depende da aprovação de 3/4 do capital social.\nE) Nenhuma das alternativas acima.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q6", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.6", "tema": "", "enun": "Se todas as cotas de uma sociedade limitada forem adquiridas por um único sócio, essa sociedade:\n\nA) dissolve-se imediatamente;\nB) extingue-se de pleno direito, pois a legislação brasileira não admite a figura da sociedade unipessoal.\nC) pode subsistir sem a pluralidade de sócios por até 180 dias.\nD) automaticamente transformada;\nE) Nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q7", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.7", "tema": "", "enun": "Em relação à sociedade limitada, é correto afirmar:\n\nA) É regida por estatuto social.\nB) Cada sócio responde exclusivamente pela integralização de suas quotas.\nC) Na omissão do contrato, o sócio pode ceder sua quota, total ou parcialmente, a estranho independentemente da anuência dos demais sócios.\nD) Incapaz pode ser sócio quotista, desde que não exerça a Administração da sociedade, o capital social esteja totalmente integralizado e seja assistido ou representado na forma do Código Civil.\nE) A omissão da palavra \"limitada\" no nome empresarial determina a responsabilidade solidária e ilimitada de todos os sócios quotistas.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q8", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.8", "tema": "", "enun": "Sobre a sociedade de responsabilidade limitada, é correto afirmar que:\n\nA) os sócios responderão solidariamente pelo que faltar para integralizar o capital social.\nB) ela pode não usar razão social, somente a denominação social, seguida da designação LTDA.\nC) se aplicam às sociedades limitadas subsidiariamente as regras da sociedade em comandita por ações.\nD) tem o capital subscrito por pelo menos um dos sócios e a responsabilidade dos sócios vai até o limite do capital social.\nE) Nenhuma das alternativas acima.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q9", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.9", "tema": "", "enun": "A respeito da sociedade limitada, assinale a opção correta:\n\nA) O capital, depois de integralizado, só poderá ser reduzido, com a correspondente modificação do contrato, na hipótese de mostrar-se excessivo em relação ao objeto da sociedade.\nB) Os administradores - diretores - da sociedade limitada podem ser sócios ou não, mas devem ser, sempre, designados no contrato social.\nC) Um credor, individualmente, não pode exigir de um dos sócios da sociedade limitada o dever de integralizar o capital social antes da decretação da falência.\nD) A expulsão de sócio minoritário, ainda que cumpridor de seus deveres, pode ser imposta discricionariamente pela maioria societária.\nE) As deliberações dos sócios quanto à estratégia geral dos negócios da sociedade devem ser tomadas em reunião ou assembleia regularmente convocada e reduzidas a termo.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q10", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.10", "tema": "", "enun": "Com relação ao regime jurídico da sociedade limitada, assinale a alternativa INCORRETA:\n\nA) Não estando as quotas totalmente integralizadas, a responsabilidade dos sócios em relação à sociedade é subsidiária, ou seja, em primeiro lugar são os bens da própria sociedade que devem suportar as obrigações por ela assumidas. No entanto, sendo estes insuficientes, os sócios serão solidariamente responsabilizados pela integralização do capital social.\nB) Ao exercer o direito de recesso, fundado na modificação do contrato social, o sócio dissidente, cujas quotas serão liquidadas com base na situação patrimonial da sociedade, à data da resolução, fica eximido da responsabilidade pelas obrigações sociais anteriores.\nC) O contrato social da sociedade limitada constitui título executivo extrajudicial contra o sócio remisso para o pagamento do valor devido pela integralização de suas quotas.\nD) A sociedade limitada não se dissolverá, pela falta de pluralidade de sócios, quando o sócio remanescente requerer, no Registro Público de Empresas Mercantis, a transformação do registro da sociedade para empresário individual ou para Empresa Individual de Responsabilidade Limitada - EIRELI.\nE) Nenhuma das alternativas acima.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q11", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.11", "tema": "", "enun": "Na sociedade limitada;\n\nA) as deliberações serão tomadas por maioria de votos, contados segundo o número de sócios, independentemente de seu comparecimento em assembleia.\nB) o sócio, admitido em sociedade já constituída, não se exime das dívidas anteriores à admissão.\nC) no silêncio do contrato, os administradores podem praticar todos os atos pertinentes à gestão, inclusive quanto à oneração ou à venda de bens imóveis.\nD) são revogáveis os poderes do sócio investido na administração por cláusula expressa do contrato social, inclusive por justa causa, independentemente de reconhecimento judicial, desde que assim decida a maioria absoluta dos sócios.\nE) os sócios não respondem solidariamente pelo valor estimativo dos bens utilizados para integralização do capital social.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q12", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.12", "tema": "", "enun": "0 sócio ou administrador da sociedade limitada responderá pessoalmente perante a sociedade e/ou terceiros com seu patrimônio pessoal pelas obrigações que contrair. Em relação às condições para que isso ocorra, aponte a alternativa correta:\n\nA) Somente nas ocasiões em que não houver integralizado o valor do capital social e nos limites dele\nB) Somente se agirem com excesso de mandato.\nC) Entre outras situações, quando usarem indevidamente a firma ou dela abusarem ou quando deliberarem contra preceitos legais ou contratuais ou infringirem o contrato social.\nD) Quando agirem com excesso em relação aos terceiros independentemente da limitação de poderes estar inscrita ou averbada no registro próprio da sociedade.\nE) Somente se realizarem operações que sabem, ou deveriam saber, ser contrárias à vontade da minoria", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q13", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.13", "tema": "", "enun": "Em relação à sociedade limitada, assinale a opção correta.\n\nA) O contrato social, por possuir regramento próprio, não poderá prever a regência supletiva da sociedade limitada pelas normas da sociedade anônima.\nB) Somente se autorizado expressamente no contrato, o sócio pode ceder sua quota, total ou parcialmente, a quem seja sócio, independentemente de audiência dos outros, ou a estranho, sendo que, nessa situação, não poderá haver oposição de titulares de mais de um quarto do capital social.\nC) A administração da empresa atribuída no contrato a todos os sócios se estende de pleno direito aos que posteriormente adquiram essa qualidade.\nD) Não é assegurado aos sócios minoritários o direito de eleger, separadamente, membro do conselho fiscal e respectivo suplente, independentemente do capital social que representam.\nE) Em uma sociedade limitada, a responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q14", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.14", "tema": "", "enun": "Acerca das sociedades limitadas, assinale a opção correta.\n\nA) As deliberações societárias sobre as modificações no contrato social devem ocorrer em reunião ou em assembleia nos casos em que o número de sócios seja superior a dez.\nB) É vedada a propriedade de uma quota societária sob a forma de condomínio entre pessoas físicas e jurídicas.\nC) A administração da sociedade, caso atribuída, no contrato social, a todos os sócios, deverá estender-se automaticamente aos que posteriormente adquirirem essa qualidade.\nD) Não é permitido a nomeação de administrador que não seja sócio.\nE) O conselho fiscal, caso esteja previsto no contrato social, deverá ser composto de três ou mais membros e respectivos suplentes, sócios ou não, residentes no Brasil e eleitos em assembleia anual.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q15", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.15", "tema": "", "enun": "O administrador das sociedades limitadas pode ser nomeado no contrato social ou por ato separado. Uma das consequências dessa distinção é que o administrador nomeado em contrato:\n\nA) deve ser sócio;\nB) tem poderes irrevogáveis;\nC) depende de \"quorum\" previsto no contrato ou na lei.\nD) prescinde de autorização dos sócios para a prática de atos;\nE) Nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q16", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.16", "tema": "", "enun": "A sociedade limitada;\n\nA) deve adotar nome ou expressão de fantasia, seguida da expressão \"limitada\".\nB) só pode adotar denominação seguida da palavra final \"limitada\".\nC) só pode adotar firma social, seguida da palavra final \"limitada\".\nD) pode adotar firma ou denominação, integradas pela palavra final \"limitada\" ou a sua abreviatura.\nE) pode adotar firma e denominação, integradas pela palavra final \"limitada\" ou a sua abreviatura.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q17", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.17", "tema": "", "enun": "Em relação à diminuição do capital social de uma sociedade limitada, podemos afirmar que:\n\nA) Salvo expressa previsão no contrato social, não pode a sociedade reduzir o capital.\nB) A redução somente se tornará eficaz se não for impugnada no prazo de 90 (noventa) dias, contados da data da publicação da ata de assembléia que aprovou a redução.\nC) A redução do capital social pode ser feita sem modificação do contrato.\nD) O capital social não pode ser reduzido, mesmo após integralizado, salvo se houver perdas irreparáveis para a sociedade.\nE) Não há nenhuma alternativa correta.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M7-Q18", "bloco": "MÓDULO 7 — Sociedade Limitada", "num": "Ex.18", "tema": "", "enun": "Os dez sócios que detém o capital social de determinada empresa limitada pretendem promover a fusão com outra empresa. Nessa situação, em conformidade com o Código Civil:\n\nA) não há necessidade de reunião ou assembleia para a tomada de decisão, se todos os sócios decidirem por escrito;\nB) a decisão deve ser tomada em assembleia;\nC) a assembleia ou a reunião destinada à discussão do assunto só pode ser instalada com a presença de todos os detentores do capital social;\nD) a assembleia ou a reunião destinada à deliberação sobre a matéria vincula os sócios que não estiverem presentes.\nE) Nenhuma das alternativas acima.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q1", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.1", "tema": "", "enun": "**\nNa sociedade dividida em ações é possível:\n\nA) ter o capital dividido em ações e a responsabilidade dos acionistas ser limitada ao preço de emissão de ações subscritas ou adquiridas.\nB) privar o acionista de participar dos lucros sociais;\nC) criar ações ao portador.\nD) fixar o capital social expressa em moeda estrangeira.\nE) Nenhuma das alternativas acima.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q2", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.2", "tema": "", "enun": "**\nNa lei da sociedade por ações, o voto múltiplo é:\n\nA) uma espécie lícita de voto plural;\nB) uma forma de voto que possibilita votar as ações gravadas com usufruto;\nC) uma forma de voto que viabiliza o voto das ações empenhadas e alienadas fiduciariamente.\nD) uma forma de voto facultada aos acionistas minoritários na eleição dos conselheiros de administração de uma sociedade anônima.\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q3", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.3", "tema": "", "enun": "**\nOs valores mobiliários que não representem parcelas do capital social e que conferem a seu titular direito de participação nos lucros da sociedade anônima denominam-se:\n\nA) bônus de subscrição;\nB) debêntures;\nC) warrants;\nD) partes beneficiárias;\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q4", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.4", "tema": "", "enun": "**\nO mercado de capitais primário:\n\nA) abrange operação de compra e venda de ação, ou seja, negociação feita pelo dano de uma participação societária;\nB) não admite emissão pública de valores mobiliários, nem sua alienação;\nC) visa à alienação de uma ação, transferindo-a do patrimônio do primeiro acionista para o do segundo;\nD) compreende as operações de subscrição de ações e de outros valores mobiliários.\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q5", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.5", "tema": "", "enun": "**\nDiferentemente das demais sociedades por ações, aquelas que exercem atividade autorizada de instituição financeira devem:\n\nA) possuir conselho de administração;\nB) ser de capital aberto;\nC) distribuir obrigatoriamente dividendo mínimo aos seus acionistas, consistentes em 50% do lucro líquido do exercício;\nD) ter integralizado, no momento da constituição, 50% de seu capital inicial em moeda corrente;\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q6", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.6", "tema": "", "enun": "**\nA sociedade por ações será considerada \"aberta\" se:\n\nA) não tiver restrições estatutárias ao ingresso de novos acionistas;\nB) suas ações foram negociadas em bolsa de valores;\nC) seus estatutos garantirem dividendos mínimos obrigatórios aos preferenciais;\nD) seus atos constitutivos estiverem devidamente arquivados na junta comercial local;\nE) investir no mínimo 40% de seus ativos em mercado de capitais.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q7", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.7", "tema": "", "enun": "**\nNão é direito essencial do acionista:\n\nA) a participação nos lucros sociais;\nB) a participação no acervo da sociedade em caso de liquidação;\nC) a preferência na subscrição de novas ações;\nD) voto em assembleia geral;\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q8", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.8", "tema": "", "enun": "**\nNos termos da Lei nº 6.404/1976, a representação da companhia é privativa:\n\nA) dos conselheiros administrativos e diretores em conjunto.\nB) dos membros do Conselho de Administração.\nC) dos diretores.\nD) da diretoria\nE) Nenhuma das alternativas anteriores.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q9", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.9", "tema": "", "enun": "**\nAssinale a opção correta em relação à sociedade anônima:\n\nA) Enquanto não forem inscritos os atos constitutivos da sociedade por ações que esteja em processo de instituição, esta reger-se-á pelas regras da sociedade em comum, observadas subsidiariamente as regras da sociedade simples.\nB) As normas que regem a sociedade anônima não são aplicáveis às sociedades limitadas.\nC) A incorporação de imóveis para a formação do capital social de sociedades anônimas não exige escritura pública.\nD) A companhia será aberta ou fechada, conforme suas ações estejam ou não admitidas à negociação na Comissão de Valores Mobiliários.\nE) As companhias abertas podem ser constituídas antes que seu capital social tenha sido integralmente subscrito, pois se admite reserva limitada de ações para futura negociação como complemento à subscrição.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q10", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.10", "tema": "", "enun": "**\nNas sociedades anônimas:\n\nA) a redução do capital social da companhia só será possível se a assembleia geral definir a necessidade de se pleitear sua recuperação judicial, em face de sucessivos prejuízos financeiros havidos e comprovados.\nB) a constituição da companhia depende de subscrição, pelo menos por duas pessoas, de todas as ações em que se divide o capital social fixado no estatuto; em regra, de realização, como entrada, de dez por cento, no mínimo, do preço de emissão das ações subscritas em dinheiro; e de depósito, no Banco do Brasil, ou em outro estabelecimento bancário autorizado pela Comissão de Valores Mobiliários, da parte do capital realizado em dinheiro.\nC) a constituição da companhia por subscrição pública não depende de prévio registro da emissão na Comissão de Valores Mobiliários, mas a subscrição somente poderá ser efetuada com a intermediação de instituição financeira.\nD) o administrador é pessoalmente responsável, no âmbito civil, pelas obrigações que contrair em nome da sociedade anônima, ainda que em virtude de ato regular de gestão, não tendo porém responsabilidade criminal senão em casos de dolo ou culpa.\nE) o capital social da companhia só poderá ser aumentado por deliberação de assembleia geral, ordinária ou extraordinária, convocada especialmente para esta finalidade, visando à correção da expressão monetária do seu valor.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q11", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.11", "tema": "", "enun": "**\nLeandro, Alcides e Inácio pretendem investir recursos oriundos de investimentos no mercado de capitais para constituir uma companhia fechada por subscrição particular do capital. A sociedade será administrada por Inácio e sua irmã, que não será sócia.\nConsiderando-se o tipo societário e a responsabilidade legal dos sócios a ele inerente, assinale a afirmativa correta.\n\nA) Leandro, Alcides e Inácio responderão limitadamente até o preço de emissão das ações por eles subscritas.\nB) Leandro, Alcides e Inácio responderão limitadamente até o valor das quotas por eles subscritas, mas solidariamente pela integralização do capital.\nC) Leandro, Alcides e Inácio responderão ilimitada, solidária e subsidiariamente pelas obrigações sociais.\nD) Leandro e Alcides responderão limitadamente até o preço de emissão das ações por eles subscritas, e Inácio, como administrador, ilimitada e subsidiaramente, pelas obrigações sociais.\nE) Leandro, Alcides e Inácio responderão ilimitadamente pois a companhia é fechada por subscrição ao particular do capital.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q12", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.12", "tema": "", "enun": "**\nAssinale a resposta correta:\n\nA) a companhia terá o capital dividido em ações, e a responsabilidade dos acionistas será sempre limitada;\nB) a sociedade anônima não pode ter fim lucrativo\nC) a contribuição do sócio para o capital social na limitada pode consistir em prestação de serviços;\nD) na sociedade limitada, a responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social;\nE) Nenhuma das alternativas acima.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q13", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.13", "tema": "", "enun": "**\nNo tocante às sociedades anônimas é correto afirmar:\n\nA) A companhia ou sociedade anônima terá o capital dividido em ações, e a responsabilidade solidária dos sócios ou acionistas será limitada ao valor total do capital social integralizado.\nB) Pode ser objeto da sociedade anônima qualquer empresa, de fim lucrativo ou não, desde que não contrário à lei, à ordem pública e aos bons costumes.\nC) O estatuto fixará o número das ações em que se divide o capital social, estabelecendo obrigatoriamente seu valor nominal.\nD) O administrador não é pessoalmente responsável pelas obrigações que contrair em nome da sociedade e em virtude de ato regular de gestão; responde, porém, civilmente, pelos prejuízos que causar, quando proceder, dentro de suas atribuições ou poderes, com culpa ou dolo, bem como com violação da lei ou do estatuto social.\nE) O estatuto social e a assembleia geral não podem privar o acionista de participar dos lucros sociais, embora possam privá-lo de participar do acervo da companhia, em caso de liquidação.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q14", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.14", "tema": "", "enun": "**\nNo que concerne às Sociedades Anônimas, aponte a alternativa correta:\n\nA) Os diretores devem respeitar os limites e termos do mandato e serão, necessariamente, acionistas da companhia.\nB) Os administradores são responsáveis pelo cumprimento das metas e objetivos da sociedade e responderão perante a sociedade e terceiros somente se agirem com abuso de poder.\nC) Os órgãos de administração e controle social são estruturalmente congregados em três, quais sejam: (1) a assembleia, que é órgão de deliberação e expressa a vontade da sociedade; (2) a diretoria e/ou conselho de administração, que é órgão de execução e realiza a vontade social; e (3) o conselho fiscal, que é órgão fiscalizador, de controle e fiscalização sobre a execução da vontade social.\nD) Os administradores apenas responderão individualmente, não havendo previsão legal para eventual aplicação de responsabilidade solidária; a responsabilidade de cada um deve ser apurada na esfera individual e por ação própria.\nE) O Conselho Fiscal somente existirá nas companhias de capital aberto, não possuindo função relevante.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q15", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.15", "tema": "", "enun": "**\nEm relação à sociedade anônima é correto afirmar que:\n\nA) a companhia pode adquirir as próprias ações para permanência em tesouraria.\nB) a ação é divisível em relação à companhia.\nC) a gestão dos administradores não pode ser garantida pelas próprias ações da companhia.\nD) a transferência das ações nominativas opera-se por endosso em preto.\nE) as ações podem ser nominativas, endossáveis e ao portador.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q16", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.16", "tema": "", "enun": "**\nNa sociedade por ações é possível:\n\nA) Ter o capital dividido em ações e a responsabilidade dos acionistas ser limitada ao preço de emissão das ações subscritas ou adquiridas;\nB) Privar o acionista de participar dos lucros sociais;\nC) Criar ações ao portador;\nD) Fixar o capital social expresso em moeda estrangeira.\nE) É vedado a emissão de ações preferenciais.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q17", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.17", "tema": "", "enun": "**\nA sociedade por ações;\n\nA) Pode ser simples ou empresária, dependendo de seu objeto social;\nB) Não é simples e tampouco empresária. Trata-se de um terceiro tipo societário sui generis, previsto em lei especial;\nC) Será sempre simples, com capital social dividido em ações e responsabilidade dos sócios limitada ao preço de emissão.\nD) Independentemente de seu objeto é sempre considerada empresária.\nE) Nao há nenhuma alternativa correta.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q18", "bloco": "MÓDULO 8 — Sociedade Anônima", "num": "Ex.18", "tema": "", "enun": "**\nConsideram-se ações em circulação no mercado;\n\nA) Todas as ações da companhia aberta;\nB) Todas as ações ordinárias e preferenciais;\nC) Todas as ações da companhia aberta, com exceção das de propriedade do acionista controlador, de diretores e conselheiros e das em tesouraria;\nD) Todas as ações ordinárias e preferenciais, com exceção das destinadas à formação de reserva de capital.\nE) Todas as ações ao portador.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "O que é empresário segundo o CC/2002?", "v": "Quem exerce profissionalmente atividade econômica organizada para produção ou circulação de bens ou serviços (art. 966 CC). Requisitos: profissionalismo, organização, atividade econômica.\n\n---"}, {"id": "c2", "f": "Qual o limite de faturamento do MEI, ME e EPP?", "v": "MEI: até R$ 81 mil/ano | ME: até R$ 360 mil/ano | EPP: R$ 360.001 a R$ 4.800.000/ano (LC 123/06).\n\n---"}, {"id": "c3", "f": "Qual o prazo da patente de invenção e do modelo de utilidade?", "v": "Patente de invenção: 20 anos do depósito. Modelo de utilidade: 15 anos do depósito (LPI 9.279/96).\n\n---"}, {"id": "c4", "f": "Por quanto tempo uma marca registrada no INPI é protegida?", "v": "10 anos da concessão, renováveis indefinidamente por períodos iguais de 10 anos.\n\n---"}, {"id": "c5", "f": "Qual o prazo do desenho industrial?", "v": "10 anos do depósito, prorrogável por 3 períodos de 5 anos → máximo 25 anos.\n\n---"}, {"id": "c6", "f": "O que diferencia sociedade empresária de sociedade simples?", "v": "Empresária: objeto = atividade de empresário (produção/circulação organizada), registro na Junta Comercial. Simples: atividade intelectual (científica, literária, artística), registro no RCPJ.\n\n---"}, {"id": "c7", "f": "Qual a diferença entre dissolução total e resolução parcial da sociedade?", "v": "Dissolução: extinção da sociedade. Resolução parcial: saída de um sócio (morte, exclusão, retirada) — a sociedade continua existindo.\n\n---"}, {"id": "c8", "f": "Quais cônjuges não podem ser sócios entre si?", "v": "Casados em comunhão universal de bens ou separação obrigatória de bens (art. 977 CC).\n\n---"}, {"id": "c9", "f": "Quando nasce a personalidade jurídica de uma sociedade?", "v": "Com o registro (art. 985 CC). Sem registro = sociedade em comum (não personificada), todos respondem solidária e ilimitadamente.\n\n---"}, {"id": "c10", "f": "O que é o trespasse e qual a restrição ao alienante?", "v": "Trespasse = alienação do estabelecimento empresarial. O alienante fica proibido de se restabelecer como concorrente por 5 anos (art. 1.147 CC), salvo autorização expressa.\n\n---"}, {"id": "c11", "f": "Quais os requisitos da ação renovatória de locação?", "v": "(1) Contrato escrito; (2) prazo mínimo de 5 anos (pode ser soma de contratos); (3) exploração do mesmo ramo por no mínimo 3 anos; (4) proposta formulada 1 ano antes e no máximo 6 meses antes do fim do contrato.\n\n---"}, {"id": "c12", "f": "Qual é a responsabilidade dos sócios na Sociedade Limitada?", "v": "Limitada ao valor das quotas subscritas, porém todos respondem solidariamente pela integralização total do capital (art. 1.052 CC).\n\n---"}, {"id": "c13", "f": "Que quórum é necessário para cessão de quotas na Ltda?", "v": "Aprovação de sócios representando pelo menos 3/4 do capital social, salvo disposição contrária no contrato.\n\n---"}, {"id": "c14", "f": "O que é a Sociedade Anônima e qual sua responsabilidade?", "v": "Capital dividido em ações; responsabilidade dos acionistas limitada ao preço de emissão das ações subscritas. Sempre empresarial (art. 1.089 CC).\n\n---"}, {"id": "c15", "f": "Qual a diferença entre S/A aberta e fechada?", "v": "Aberta: ações negociadas em bolsa ou mercado de balcão, sujeita à CVM. Fechada: ações restritas a grupo de acionistas, sem negociação pública.\n\n---"}, {"id": "c16", "f": "Que tipo de nome usa a S/A — firma ou denominação?", "v": "Denominação (inclui objeto + \"S/A\", \"Companhia\" ou \"Cia.\" — mas \"Cia.\" não pode ser usado ao final). Não usa firma (nome de sócios).\n\n---"}, {"id": "c17", "f": "Quais os tipos de ações de uma S/A?", "v": "Ordinárias (direito a voto), Preferenciais (privilégios econômicos, podem não ter voto) e De Gozo/Fruição (entregues a acionistas que tiveram suas ações amortizadas).\n\n---"}, {"id": "c18", "f": "Como uma marca pode ser cancelada por falta de uso?", "v": "Caducidade: se o titular não usar a marca por 5 anos consecutivos após a concessão, pode ser declarada caduca pelo INPI a pedido de terceiro com interesse legítimo (art. 143 LPI).\n\n---"}, {"id": "c19", "f": "O que é a desconsideração da personalidade jurídica inversa?", "v": "Responsabiliza a sociedade pelas dívidas pessoais de seus sócios (art. 50 §§ 2º e 3º CC), quando o sócio usa a pessoa jurídica para blindar patrimônio pessoal.\n\n---"}, {"id": "c20", "f": "Quais deliberações na Ltda exigem quórum de 3/4 do capital?", "v": "Mudança de objeto social, fusão, incorporação, cisão, transformação, dissolução e qualquer modificação do contrato que o exija. Cessar de quotas também requer 3/4 salvo disposição contrária."}], "cobertura": ["São 144 questões (8 módulos de 18), com enunciado completo, alternativas e gabarito fundamentado.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "revisao", "ref": "r7", "titulo": "Contradiz os flashcards", "texto": "O resumo diz que mudança de objeto, fusão e dissolução na Ltda exigem unanimidade. O flashcard 20 e a Q16 do Módulo 7 dizem 3/4 do capital, que é o que consta nos arts. 1.071 e 1.076 do CC. Confira no AVA."}, {"esc": "card", "ref": "c13", "titulo": "Cessão de quotas: regra mais precisa", "texto": "O art. 1.057 do CC permite a cessão a outro sócio sem consulta, e a estranho se não houver oposição de titulares de mais de 1/4 do capital. “Aprovação de 3/4” é uma simplificação. Veja como o AVA formula."}, {"esc": "card", "ref": "c20", "titulo": "Cessão de quotas: regra mais precisa", "texto": "Para o quórum de cessão de quotas, veja a observação do flashcard 13 (art. 1.057 do CC)."}, {"esc": "card", "ref": "c2", "titulo": "Limite do MEI", "texto": "O teto de R$ 81 mil segue vigente em 2026. Há notícia de lei sancionada que o eleva a R$ 110 mil em 2027 e R$ 140 mil em 2028. Para a prova de 2026, vale o R$ 81 mil."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["18A7"]={"cod":"18A7","revisao":[{"id":"r1","titulo":"MÓDULO 1 — Atos de Comunicação Processual","prob":"alta","html":"<p>Os atos de comunicação movimentam o processo. Citação e intimação têm finalidades e regimes diferentes. A forma errada de citação gera nulidade — mas nem toda nulidade é sanável.</p>\n\n<ul>\n<li><strong>Tipos de Carta:</strong> ordem (tribunal → juízo inferior/subordinação); precatória (entre juízos); rogatória (entre países); arbitral (juízo arbitral).</li>\n<li><strong>Citação</strong> (art. 238 CPC): ato de convocação do réu/executado/interessado para integrar a relação processual.</li>\n<li><strong>Modalidades de citação:</strong> correio (prioritária); mandado (oficial de justiça); hora certa (tentou 2 vezes + suspeita de ocultação); pelo escrivão; por edital (subsidiária — esgotados outros meios); eletrônica.</li>\n<li><strong>Citação NÃO feita por correio:</strong> incapaz; pessoa de direito público; ação de estado; local sem entrega domiciliar.</li>\n<li><strong>Efeitos da citação válida</strong> (art. 240 CPC): induz litispendência; torna coisa litigiosa; constitui devedor em mora; interrompe prescrição retroativamente à propositura (S. 106 STJ: demora da Justiça não prejudica o autor).</li>\n<li><strong>Citação com hora certa:</strong> 2 tentativas + suspeita de ocultação → intima familiar/vizinho; dia seguinte comparece e cita ou dá por citado; revel = curador especial.</li>\n<li><strong>Citação por edital:</strong> réu em local incerto; cita por publicação. Revel = curador especial.</li>\n<li><strong>Intimação</strong> (art. 269): ciência dos atos. Preferencial = eletrônica. Diário eletrônico: disponibilização → publicação (1º dia útil seguinte) → início do prazo (1º dia útil seguinte à publicação).</li>\n</ul>"},{"id":"r2","titulo":"MÓDULO 2 — Petição Inicial / Formação do Processo","prob":"alta","html":"<p>A petição inicial é o ato inaugural. Se faltar algum dos requisitos do art. 319 CPC, o juiz primeiro manda emendar (15 dias) antes de indeferir. Improcedência liminar dispensa citação do réu.</p>\n\n<ul>\n<li><strong>Requisitos da PI</strong> (art. 319): juízo; partes; fatos e fundamentos jurídicos; pedido + causa de pedir; valor da causa; provas; opção pelo julgamento antecipado da lide.</li>\n<li><strong>Indeferimento da PI</strong> (art. 330): inepta; parte ilegítima; autor carece de interesse; vedada por lei.</li>\n<li><strong>Inépcia da PI</strong> (art. 330, §1º):** sem pedido/causa de pedir; pedido ininteligível/contraditório; pedir + causa de pedir incompatíveis; pluralidade de pedidos incompatíveis.</li>\n<li><strong>Emenda à PI</strong> (art. 321): juiz dá prazo de 15 dias antes de indeferir; se não emendar → indeferimento.</li>\n<li><strong>Improcedência liminar</strong> (art. 332): juiz pode julgar improcedente sem citar réu quando pedido contrariar: jurisprudência vinculante do STF, acórdão em IRDR/IAC, súmula STJ/STF, enunciado de recurso repetitivo.</li>\n<li><strong>Distribuição</strong> (art. 284): livre — aleatória; necessária — competência fixada por lei (ex: ação rescisória vai ao tribunal que proferiu a decisão).</li>\n</ul>"},{"id":"r3","titulo":"MÓDULO 3 — Resposta do Réu / Revelia","prob":"alta","html":"<p>A contestação é o momento de defesa total. O princípio da eventualidade obriga o réu a alegar tudo na contestação mesmo que contraditório. A revelia presume verdadeiros os fatos — com exceções importantes.</p>\n\n<ul>\n<li><strong>Prazo de contestação:</strong> 15 dias (regra); Fazenda Pública/MP = 30 dias (em dobro — art. 183 CPC); litisconsortes com procuradores distintos = 30 dias.</li>\n<li><strong>Contestação</strong> (art. 336): réu alega toda a matéria de defesa. Princípio da eventualidade: tudo na contestação, mesmo alegações contraditórias.</li>\n<li><strong>Defesas processuais vs mérito:</strong> preliminares (art. 337) — inexistência/nulidade da citação, incompetência, coisa julgada etc. → se acolhidas = extinção sem resolução de mérito. Mérito → resolve com ou sem procedência.</li>\n<li><strong>Reconvenção</strong> (art. 343): pedido do réu contra o autor, no mesmo processo; prazo = contestação (simultâneo); subsiste mesmo que reconvinte desista da ação principal.</li>\n<li><strong>Revelia</strong> (art. 344): réu não contesta; efeitos: (a) presumem-se verdadeiros os fatos alegados pelo autor; (b) o processo flui em sua ausência. Revelia NÃO produz efeito se: pluralidade de réus e outro contestou; direito indisponível; petição inicial não acompanhada de instrumento que lei exige.</li>\n</ul>"},{"id":"r4","titulo":"MÓDULO 4 — Audiência de Conciliação e Instrução","prob":"alta","html":"<p>A audiência de conciliação é obrigatória quando o direito é disponível e pelo menos uma das partes não manifesta desinteresse. Conciliador ≠ mediador: a diferença está na relação prévia entre as partes.</p>\n\n<ul>\n<li><strong>Audiência de conciliação/mediação</strong> (art. 334): obrigatória quando a petição não indicar desinteresse e o direito for disponível; em até 30 dias da decisão de saneamento; pode ser telepresencial.</li>\n<li><strong>Dispensada se:</strong> ambas as partes manifestarem desinteresse; direito indisponível.</li>\n<li><strong>Conciliador vs Mediador:</strong> conciliador = partes sem relação anterior (propõe soluções); mediador = partes com relacionamento prévio (facilita comunicação, não propõe).</li>\n<li><strong>Audiência de instrução e julgamento</strong> (art. 358): após saneamento; oitiva de testemunhas e partes; debate oral; sentença na própria audiência ou em 30 dias.</li>\n<li><strong>Saneamento e organização</strong> (art. 357): resolve questões processuais; delimita questões de fato e de direito; distribui ônus da prova; lista provas e testemunhas.</li>\n<li><strong>Ônus da prova</strong> (art. 373): autor = fatos constitutivos do direito; réu = fatos impeditivos, modificativos ou extintivos. Pode ser invertido por convenção ou por decisão judicial (distribuição dinâmica — art. 373, §1º).</li>\n</ul>"},{"id":"r5","titulo":"MÓDULO 5 — Sentença e Coisa Julgada","prob":"alta","html":"<p>A sentença tem estrutura obrigatória: relatório, fundamentação e dispositivo. Decisão sem fundamentação é nula (CF art. 93, IX). A coisa julgada material só recai sobre o <em>dispositivo</em>.</p>\n\n<ul>\n<li><strong>Sentença</strong> (art. 489): elementos — relatório, fundamentação (obrigatória, arts. 93, IX CF e 489 §1º), dispositivo (parte vinculante).</li>\n<li><strong>Sentença NÃO fundamentada</strong> (art. 489, §1º): limitar-se a indicar ato normativo sem aplicar; usar conceito jurídico indeterminado sem definir; citar precedente sem identificar fundamento determinante; invocar \"jurisprudência\" sem citar precedentes; desconsiderar argumento sem explicar.</li>\n<li><strong>Coisa julgada formal:</strong> decisão insuscetível de recurso no mesmo processo (preclusão máxima). <strong>Coisa julgada material:</strong> imutabilidade do comando sentencial fora do processo (art. 502 CPC).</li>\n<li><strong>Limites objetivos da CJ:</strong> extensão ao dispositivo (não à fundamentação). <strong>Limites subjetivos:</strong> inter partes (regra geral).</li>\n<li><strong>Ação Rescisória</strong> (art. 966): cabe em 2 anos do trânsito em julgado; proposta no tribunal que proferiu a decisão; casos = prevaricação/corrução/munus; violação manifesta de norma; prova falsa; inepta; dolo da parte; ofensa à coisa julgada; erro de fato.</li>\n</ul>"},{"id":"r6","titulo":"MÓDULO 6 — Recursos","prob":"alta","html":"<p>Os recursos obedecem princípios rígidos. Taxatividade = só cabe o que a lei prevê. Non reformatio in pejus = tribunal não pode piorar a situação do único recorrente.</p>\n\n<ul>\n<li><strong>Princípios recursais:</strong> taxatividade (só os previstos em lei); singularidade/unicidade (um ato → um recurso); fungibilidade (recurso errado → aplica regra do correto se dúvida objetiva); dialeticidade (motivado, impugna fundamentos da decisão); non reformatio in pejus (tribunal não pode piorar situação do recorrente).</li>\n<li><strong>Apelação</strong> (art. 1.009): recurso contra sentença; prazo 15 dias; distribuída no tribunal; cabe contrarrazões (15 dias). <strong>Efeito suspensivo:</strong> regra (exceto: alimentos provisórios, execução provisória).</li>\n<li><strong>Agravo de instrumento</strong> (art. 1.015): recurso contra decisões interlocutórias não impugnavelmente por apelação; prazo 15 dias; rol taxativo (art. 1.015 CPC) + interpretação extensiva STJ.</li>\n<li><strong>Embargos de declaração</strong> (art. 1.022): obscuridade, contradição, omissão ou erro material; prazo 5 dias; suspendem (não interrompem exceto quando acolhidos) o prazo de outros recursos.</li>\n<li><strong>RE e REsp:</strong> RE (STF) = questão constitucional; REsp (STJ) = questão de lei federal. Ambos sem efeito suspensivo como regra; exigem repercussão geral (RE) ou prequestionamento (ambos).</li>\n</ul>"},{"id":"r7","titulo":"MÓDULO 7 — Cumprimento de Sentença","prob":"media","html":"<p>O cumprimento de sentença segue rito próprio. Se o devedor não paga em 15 dias, incide multa de 10% + honorários de 10%. A penhora tem ordem de preferência — dinheiro é sempre o primeiro.</p>\n\n<ul>\n<li><strong>Cumprimento de sentença</strong> (art. 513): início mediante requerimento ou de ofício (alimentos). Intimação do devedor para cumprir em 15 dias.</li>\n<li><strong>Multa coercitiva</strong> (art. 523, §1º): devedor não paga em 15 dias → multa de 10% + honorários de 10%.</li>\n<li><strong>Cumprimento provisório</strong> (art. 520): antes do trânsito em julgado; requerido pelo exequente; corre por conta e risco do credor.</li>\n<li><strong>Impugnação ao cumprimento</strong> (art. 525): prazo 15 dias; alegações = falta/nulidade de citação, ilegitimidade de parte, inexigibilidade do título, penhora incorreta, excesso de execução.</li>\n<li><strong>Penhora:</strong> recai sobre bens do devedor; ordem preferencial (art. 835): dinheiro &gt; créditos e investimentos &gt; veículos &gt; bens imóveis &gt; semoventes &gt; navios/aeronaves &gt; bens móveis &gt; direitos aquisitivos de imóveis &gt; ações de S/A.</li>\n</ul>"},{"id":"r8","titulo":"MÓDULO 8 — Tutelas Provisórias","prob":"media","html":"<p>Tutela de urgência exige fumus boni iuris + periculum in mora. Tutela de evidência <em>independe</em> de urgência — essa distinção é a mais cobrada em prova.</p>\n\n<ul>\n<li><strong>Tutela provisória</strong> (art. 294): de urgência (cautelar ou antecipada) ou de evidência.</li>\n<li><strong>Tutela de urgência antecipada</strong> (art. 300): fumus boni iuris (probabilidade do direito) + periculum in mora (perigo de dano ou risco ao resultado útil do processo). Pode ser liminar (sem ouvir parte contrária).</li>\n<li><strong>Tutela cautelar</strong> (art. 301): assegura resultado útil do processo; não satisfaz o direito (preserva). Ex: arresto, sequestro, arrolamento.</li>\n<li><strong>Tutela de evidência</strong> (art. 311): independe de urgência. Cabe quando: abuso de defesa/propósito protelatório; pedido fundado em prova documental + tese firmada em julgamento de casos repetitivos; pedido reipersecutório + prova documental adequada; petição inicial instruída com prova suficiente + a contestação for baseada apenas em argumento fraco.</li>\n<li><strong>Estabilização da tutela antecipada</strong> (art. 304): se concedida em caráter antecedente e réu não recorrer em 15 dias → estabiliza; processo extingue. Pode ser revista em 2 anos por ação autônoma.</li>\n</ul>"}],"top5":["Modalidades de citação (requisitos hora certa, edital, correio)","Efeitos da citação (4 efeitos)","Contestação + revelia (efeitos e exceções)","Sentença (elementos, fundamentação)","Coisa julgada (formal vs material)","Tutela de urgência (requisitos fumus + periculum)","Tutela de evidência (independe de urgência)"],"questoes":[{"id":"M1-Q1","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.1","tema":"","enun":"A citação:\n\nA) Com exceção das microempresas e das empresas de pequeno porte, as empresas públicas e privadas são obrigadas a manter cadastro nos sistemas de processo em autos eletrônicos, para efeito de recebimento de citações e intimações, as quais serão efetuadas preferencialmente por esse meio.\nB) Na ação de usucapião de imóvel, os confinantes serão citados pelo correio, exceto quando tiver por objeto unidade autônoma de prédio em condomínio, caso em que tal citação é dispensada.\nC) A citação será feita pelo correio para qualquer comarca do país, exceto quando o citando for capaz.\nD) A citação não poderá ser feita em qualquer lugar em que se encontre o réu, o executado ou o interessado.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 246, § 1º, do CPC/15, com exceção das microempresas e das empresas de pequeno porte, as empresas públicas e privadas são obrigadas a manter cadastro nos sistemas de processo em autos eletrônicos para efeito de recebimento de citações e intimações..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q2","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.2","tema":"","enun":"Sobre as citações é INCORRETO afirmar que:\n\nA) Nos condomínios edilícios ou nos loteamentos com controle de acesso, será válida a entrega do mandado a funcionário da portaria responsável pelo recebimento de correspondência, que, entretanto, poderá recusar o recebimento, se declarar, por escrito, sob as penas da lei, que o destinatário da correspondência está ausente.\nB) A citação ordenada por juiz incompetente constitui em mora o devedor.\nC) Citação é o ato pelo qual se dá ciência a alguém dos atos e dos termos da sentença.\nD) O comparecimento espontâneo do réu ou do executado supre a falta ou a nulidade da citação, fluindo a partir desta data o prazo para apresentação de contestação ou de embargos à execução.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A alternativa C traz a afirmação incorreta pretendida. Nos termos do art. 238 do CPC/15, a citação é o ato pelo qual se convoca o réu, o executado ou o interessado para integrar a relação jurídica processual.","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q3","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.3","tema":"","enun":"A citação será feita:\n\nA) pelo correio, por edital, por oficial de justiça, pelo escrivão ou chefe de secretaria, se o citando comparecer em cartório, por edital e por meio eletrônico.\nB) apenas por oficial de justiça.\nC) onde se encontre o réu, até mesmo se este estiver em culto religioso.\nD) de doente mesmo enquanto estiver grave o seu estado.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 246 do CPC/15, a citação será feita por meio eletrônico, pelo correio, por oficial de justiça, pelo escrivão ou chefe de secretaria (se o citando comparecer em cartório) ou por edital..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q4","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.4","tema":"","enun":"Citação é o ato pelo qual são convocados o réu, o executado ou o interessado para integrar a relação processual. A sua falta no processo:\n\nA) acarreta a nulidade do processo, não podendo ser convalidada.\nB) pode ser suprida pelo comparecimento espontâneo do réu ou do executado.\nC) acarreta a improcedência do pedido.\nD) acarreta a extinção do processo sem julgamento do mérito.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 239, § 1º, do CPC/15, o comparecimento espontâneo do réu ou do executado supre a falta ou a nulidade da citação, fluindo a partir dessa data o prazo para apresentação de resposta..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q5","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.5","tema":"","enun":"Salvo disposição em contrário, os prazos serão contados:\n\nA) excluindo o dia do começo e incluindo o dia do vencimento.\nB) incluindo o dia do começo e excluindo o dia do vencimento.\nC) no primeiro dia seguinte ao da disponibilização da informação no Diário da Justiça eletrônico.\nD) no primeiro dia que seguir ao da publicação.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 224 do CPC/15, salvo disposição em contrário, os prazos serão contados excluindo o dia do começo e incluindo o do vencimento..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q6","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.6","tema":"","enun":"Não se fará a citação, salvo para evitar o perecimento do direito:\n\nA) de quem estiver participando de ato de culto familiar.\nB) de cônjuge, de companheiro ou de qualquer parente do morto, consanguíneo ou afim, em linha reta ou na linha colateral em segundo grau, no dia do falecimento e nos 4 (quatro) dias seguintes.\nC) de noivos, nos 5 (cinco) primeiros dias seguintes ao casamento.\nD) de doente, enquanto grave o seu estado.\nE) n.d.a.","gab":"D","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 244, I, do CPC/15, não se fará a citação, salvo para evitar o perecimento do direito, de doente enquanto grave o seu estado..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q7","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.7","tema":"","enun":"São modalidades de citação ficta:\n\nA) a citação por via postal e a citação por edital.\nB) a citação com hora certa e a citação por edital.\nC) a citação por oficial de justiça e a citação por meio eletrônico.\nD) a citação com hora certa e a citação por oficial de justiça.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- No direito processual civil brasileiro, as modalidades de citação ficta (presumida) são a citação por hora certa (art. 252 do CPC) e a citação por edital (art. 256 do CPC)..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q8","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.8","tema":"","enun":"Em relação aos itens abaixo:\n\nI. A citação será feita pelo correio, para qualquer comarca do País, inclusive nas ações de estado, quando for ré pessoa incapaz e quando for ré pessoa de direito público.  \nII. Intimação é o ato pelo qual se dá ciência a alguém dos atos e dos termos do processo.  \nIII. Se inviável a intimação por meio eletrônico e não houver na localidade publicação em órgão oficial, incumbirá ao escrivão ou chefe de secretaria intimar de todos os atos do processo os advogados das partes: pessoalmente, se tiverem domicílio na sede do juízo; por carta registrada, com aviso de recebimento, quando forem domiciliados fora do juízo.\n\nA) Todos os itens estão corretos.\nB) Apenas o item I e III estão corretos.\nC) Apenas os itens II e III estão corretos.\nD) Todos os itens estão incorretos.\nE) n.d.a.","gab":"C","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q9","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.9","tema":"","enun":"É correto afirmar:\n\nA) Para a validade do processo é indispensável a citação do réu ou do executado, inclusive nas hipóteses de indeferimento da petição inicial ou de improcedência liminar do pedido.\nB) Sendo o citando pessoa jurídica, será válida a entrega do mandado a pessoa com poderes de gerência geral ou de administração ou, ainda, a funcionário responsável pelo recebimento de correspondências.\nC) Quando, por 2 (duas) vezes, o oficial de justiça houver procurado o citando em seu domicílio ou residência sem o encontrar, deverá, havendo suspeita de ocultação, intimar somente pessoa da família de que, no dia útil imediato, voltará a fim de efetuar a citação, na hora que designar.\nD) A citação será feita pelo correio para qualquer comarca do país, inclusive quando o citando for pessoa de direito público.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- O art. 248, § 2º, do CPC/15 prevê expressamente que, sendo o citando pessoa jurídica, será válida a entrega do mandado a pessoa com poderes de gerência geral ou de administração ou a funcionário responsável pelo recebimento de correspondências..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q10","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.10","tema":"","enun":"A citação será feita pelo correio, exceto:\n\nA) quando o réu for pessoa de direito privado.\nB) quando o réu não for pessoa de direito público.\nC) quando o réu residir em local não atendido pela entrega domiciliar de correspondência.\nD) quando o réu for capaz.\nE) n.d.a.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 247, V, do CPC/15, a citação não será feita pelo correio quando o citando residir em local não atendido pela entrega domiciliar de correspondência..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q11","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.11","tema":"","enun":"Conforme a determinação do Código de Processo Civil, a citação por hora certa ocorrerá:\n\nA) se frustrada a citação pelo correio por duas vezes, sem devolução do AR (Aviso de Recebimento).\nB) quando, por duas vezes, o oficial de justiça houver procurado o réu em seu domicílio ou residência, sem o encontrar, e houver suspeita de ocultação.\nC) sem exigência de confirmação por carta ou telegrama por parte do escrivão ou chefe da secretaria.\nD) quando o réu não for encontrado, depois de procurado por duas vezes no seu local de trabalho pelo oficial de justiça, havendo suspeita de ocultação.\nE) n.d.a.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 252 do CPC/15, a citação por hora certa dar-se-á quando, por 2 (duas) vezes, o oficial de justiça houver procurado o citando em seu domicílio ou residência sem o encontrar e houver suspeita de ocultação..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q12","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.12","tema":"","enun":"O juiz e os auxiliares da justiça de uma localidade não têm competência para praticar diligências em comarcas diferentes das que estão lotados. Nesse contexto, pode ser necessário, por exemplo, solicitar a avaliação de bens passíveis de penhora que estejam em localidade diferente daquela em que corre o processo. Em situações como essa, expede-se ato de comunicação processual entre órgãos do Poder Judiciário, de modo a respeitarem os limites territoriais de competência das comarcas.\n\nTal ato de comunicação processual denomina-se:\n\nA) carta precatória.\nB) carta rogatória.\nC) carta de mandado.\nD) carta de autorização.\nE) carta de ordem.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- A carta precatória é o instrumento de cooperação interjurisdicional para que juízes de comarcas de mesma hierarquia pratiquem atos processuais fora dos limites territoriais de sua jurisdição (art. 260 do CPC/15)..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q13","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.13","tema":"","enun":"João, em razão da existência de foro de eleição, ajuizou em Teresina, execução de título extrajudicial em face de José residente em Roma, na Itália, em local conhecido. A citação de José se fará através de:\n\nA) carta de ordem.\nB) carta rogatória.\nC) carta precatória.\nD) carta arbitral.\nE) edital.","gab":"B","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Nos termos do art. 260, II, do CPC/15, a carta rogatória é expedida para que órgão jurisdicional estrangeiro pratique ato processual no exterior..","repete":false,"repeteRef":"","coment":[]},{"id":"M1-Q14","bloco":"MÓDULO 1 — ATOS DE COMUNICAÇÃO PROCESSUAL","num":"Ex.14","tema":"","enun":"A respeito da comunicação dos atos processuais, assinale a alternativa INCORRETA.\n\nA) É possível que, nos condomínios edilícios ou nos loteamentos com controle de acesso, o mandado de citação seja entregue a funcionário da portaria responsável pelo recebimento de correspondência, que, entretanto, poderá recusar o recebimento, se declarar, por escrito, sob as penas da lei, que o destinatário da correspondência está ausente.\nB) Para a validade do processo é indispensável a citação do réu ou do executado, ressalvadas as hipóteses de indeferimento da petição inicial ou de improcedência liminar do pedido.\nC) A citação poderá ser feita em qualquer lugar em que se encontre o réu, o executado ou o interessado.\nD) Será expedida carta arbitral, para que órgão do Poder Judiciário pratique ou determine o cumprimento, na área de sua competência territorial, de ato objeto de pedido de cooperação judiciária formulado por juízo arbitral, inclusive os que importem efetivação de tutela provisória.\nE) n.d.a.","gab":"D","gabLabel":"","html":"","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q1","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.1","tema":"","enun":"Em virtude de acidente sofrido nas dependências da loja da operadora de celular Fale Mais S/A, Luana ajuizou ação em face da empresa em questão, buscando indenização por danos materiais e morais, com a concessão de tutela de urgência para o pagamento imediato de despesas médicas. Os aspectos fáticos de suas alegações foram comprovados por meio de documentos, sendo certo que sua tese jurídica encontra respaldo em julgamento de incidente de resolução de demandas repetitivas.\n\nSobre o caso, assinale a afirmativa correta:\n\nA) Será possível a concessão da tutela da evidência, podendo ser dispensada, para tanto, a prévia oitiva da ré.\nB) A concessão da tutela de urgência poderá ser liminar e independerá da demonstração de perigo de dano ou de risco ao resultado útil do processo.\nC) A tutela antecipada que for concedida em caráter incidental torna-se estável se, da decisão que a conceder, não for interposto o respectivo recurso, levando à extinção do processo.\nD) Concedida a tutela de urgência ou da evidência, somente poderá ser revogada até o fim da instrução processual.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p>- Nos termos do art. 311, II, e parágrafo único do CPC/15, a tutela da evidência será concedida independentemente da demonstração de perigo de dano ou de risco ao resultado útil do processo quando as alegações de fato puderem ser comprovadas apenas documentalmente e houver tese firmada em julgamento de casos repetitivos ou em súmula vinculante, hipótese em que o juiz poderá decidir liminarmente..</p>","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q2","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.2","tema":"","enun":"A tutela que é concedida independentemente da demonstração de perigo de dano ou de risco ao resultado útil do processo no qual fica caracterizado o abuso do direito de defesa ou o manifesto propósito protelatório da parte é denominada:\n\nA) Tutela de evidência.\nB) Tutela antecipada requerida em caráter antecedente.\nC) Tutela cautelar requerida em caráter antecedente.\nD) A tutela provisória requerida em caráter incidental.\nE) n.d.a.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>- Conforme o art. 311, I, do CPC/15, a tutela de evidência será concedida, independentemente da demonstração de perigo de dano ou de risco ao resultado útil do processo, quando ficar caracterizado o abuso do direito de defesa ou o manifesto propósito protelatório da parte..","repete":false,"repeteRef":"","coment":[]},{"id":"M2-Q3","bloco":"MÓDULO 2 — NOÇÕES INTRODUTÓRIAS DE TUTELA PROVISÓRIA. AUDIÊNCIA DE CONCILIAÇÃO E MEDIAÇÃO","num":"Ex.3","tema":"","enun":"Em relação à audiência de conciliação ou de mediação, é correto afirmar:\n\nA) A au
