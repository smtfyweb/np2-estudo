[{"id":"r1","titulo":"UNIDADE I — Teorias Psicológicas, Psicopatologia e Testemunho","prob":"alta","html":"<p>A Psicanálise explica o comportamento humano a partir do aparelho psíquico. No contexto jurídico, interessa especialmente os <strong>mecanismos de defesa</strong> — a banca pede distingui-los entre si.</p>\n<h3>Psicanálise (Freud)</h3>\n<ul>\n<li>\n<p><strong>Aparelho psíquico (2ª Tópica):</strong> Id (princípio do prazer) / Ego (princípio da realidade) / Superego (moral, leis, valores)</p>\n</li>\n<li>\n<p><strong>Ego</strong> equilibra Id e Superego</p>\n</li>\n<li><strong>Mecanismos de defesa</strong> → diminuem angústia por distorção momentânea da realidade</li>\n</ul>\n<h4>Mecanismos de defesa — distinguir:</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mecanismo</th>\n<th>Definição</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Racionalização</strong></td>\n<td>justificativa lógica/intelectual para conduta inaceitável</td>\n</tr>\n<tr>\n<td><strong>Projeção</strong></td>\n<td>expulsa qualidades/sentimentos internos e atribui a outro</td>\n</tr>\n<tr>\n<td><strong>Idealização</strong></td>\n<td>exaltação e engrandecimento psíquico do objeto (≠ projeção)</td>\n</tr>\n<tr>\n<td><strong>Repressão/Recalque</strong></td>\n<td>conteúdo insuportável expulso da consciência</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> III da Q1 diz \"na projeção o objeto é exaltado\" → ERRADO, isso é idealização.</p>\n<h3>Behaviorismo (Skinner)</h3>\n<ul>\n<li><strong>Reforço positivo</strong> = aumenta probabilidade da resposta que <strong>o produz</strong> (recompensa)</li>\n<li><strong>Reforço negativo</strong> = aumenta probabilidade da resposta que o atenua/elimina (fuga/evitação)</li>\n<li><strong>Extinção</strong> = resposta deixa de ser reforçada</li>\n</ul>\n<p class=\"pega\"><strong>PEGADINHA:</strong> Reforço negativo ≠ punição. Ambos são operantes.</p>\n<h3>Gestalt</h3>\n<ul>\n<li>O todo é <strong>diferente</strong> (não igual) à soma das partes</li>\n<li>Estudou <strong>ilusões de óptica</strong> e relação figura/fundo (oscila conforme relevância)</li>\n<li><strong>NÃO</strong> estudou mecanismos de defesa (isso é Psicanálise)</li>\n</ul>\n<h3>Psicologia do Testemunho</h3>\n<ul>\n<li><strong>Primeira aproximação</strong> Psicologia × Direito: século XIX com <strong>Psicologia do Testemunho</strong></li>\n<li><strong>1985</strong>: criação do cargo de psicólogo jurídico no Brasil (TJSP)</li>\n<li><strong>Testemunho espontâneo</strong> = relato menos deformado, mais vivo e puro (sem indução de perguntas)</li>\n<li><strong>Interrogatório</strong> = pode criar falsa memória / lacuna</li>\n</ul>\n<h3>Psicopatologia — Funções psíquicas alteradas</h3>\n<ul>\n<li><strong>Orientação</strong> = capacidade de situar-se no tempo, espaço e em si mesmo; desorientação = incapacidade de se situar</li>\n<li><strong>Neurose</strong> → tem consciência dos atos, dificuldade de controle</li>\n<li><strong>Psicose</strong> → perde noção da realidade, ausência de consciência dos atos</li>\n<li><strong>Transtorno bipolar</strong> = fases alternadas de euforia e melancolia</li>\n<li><strong>Perversão</strong> = busca satisfação sexual além dos limites da \"normalidade\"</li>\n</ul>\n<h3>Áreas de atuação do psicólogo jurídico</h3>\n<ul>\n<li><strong>Infância e Juventude:</strong> adoção, Conselho Tutelar, crianças abrigadas</li>\n<li><strong>Penitenciária:</strong> recluso, egressos, agentes de segurança</li>\n<li><strong>Vitimologia:</strong> violência doméstica, vítimas e familiares</li>\n<li><strong>Psicologia forense</strong> = aplicação no âmbito de processo/procedimento no <strong>foro</strong></li>\n</ul>\n<h3>Vitimologia — tipologia</h3>\n<ul>\n<li><strong>Vítima mais culpada que o infrator</strong> = aquela que provoca e incita o autor do crime</li>\n</ul>"},{"id":"r2","titulo":"UNIDADE II — Família, Infância e Adolescência","prob":"alta","html":"<p>O CC/2002 reformou o direito de família. A banca testa a distinção entre tipos de guarda e o papel do psicólogo como <strong>perito</strong> na adoção. Alienação parental e medidas socioeducativas do ECA são pontos frequentes.</p>\n<h3>Família e Código Civil 2002</h3>\n<ul>\n<li><strong>Pátrio poder → Poder familiar</strong> (CC/2002, igualdade dos cônjuges)</li>\n<li><strong>Família monoparental</strong> = reconhecida pela CF/88 art. 226 §4º = um dos pais + filhos</li>\n<li><strong>Alienação parental</strong> = expressamente <strong>proibida</strong> (Lei 12.318/2010), é abuso moral</li>\n</ul>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"Alienação parental é permitida\" → ERRADO (Q6-U2 e AT2-Q1).</p>\n<h3>Guarda — distinguir:</h3>\n<ul>\n<li><strong>Guarda única/exclusiva</strong> = conferida a um genitor (insatisfatória modernamente)</li>\n<li><strong>Guarda alternada</strong> = alternância da custódia em períodos pré-determinados</li>\n<li><strong>Guarda compartilhada</strong> = ambos dividem responsabilidade e decisões</li>\n</ul>\n<h3>Adoção</h3>\n<ul>\n<li>Psicólogo = <strong>perito judicial</strong>, assessora a Justiça da Infância e Juventude</li>\n<li>Inclui <strong>aproximação gradual</strong> com pretendentes + estágio de convivência</li>\n<li>TJSP distribui roteiro com itens/critérios para estudo psicossocial</li>\n</ul>\n<h3>ECA e Adolescente Infrator</h3>\n<ul>\n<li>Menores de 18 = <strong>inimputáveis</strong> penalmente</li>\n<li><strong>Medidas socioeducativas</strong> (não penas): meio aberto (advertência, PSC, LA) e privativas de liberdade (semiliberdade, internação)</li>\n<li><strong>Adolescência pelo ECA</strong> = 12 a 18 anos (não 15)</li>\n<li>Maioria dos infratores = história de carências e privações</li>\n</ul>\n<h3>Pedofilia</h3>\n<ul>\n<li><strong>Diagnóstico clínico</strong> (patologia psiquiátrica) — ≠ abuso sexual (conduta)</li>\n<li>Nem todo pedófilo comete abuso; nem todo abusador é pedófilo clinicamente</li>\n<li>Não há redução de pena pelo diagnóstico</li>\n</ul>\n<h3>Lei Maria da Penha (Lei 11.340/2006)</h3>\n<ul>\n<li>Garante atendimento por <strong>equipe multidisciplinar</strong></li>\n<li>Abrange violência física, psicológica, verbal, patrimonial e sexual (não só física)</li>\n<li>Afastamento do lar = imposto ao <strong>agressor</strong> (não à mulher)</li>\n</ul>\n<h3>Assédio Moral — fases (Leymann)</h3>\n<ol>\n<li>Fase de conflito</li>\n<li><strong>Fase de estigmatização</strong> = assédio propriamente dito, longa duração</li>\n<li>Fase de intervenção da empresa</li>\n<li>Fase da marginalização</li>\n</ol>"},{"id":"r3","titulo":"UNIDADE III — Criminologia, Execução Penal, Perícia e Mediação","prob":"media","html":"<p>A Unidade III reúne criminologia, perícia e métodos extrajudiciais. Ponto mais cobrado: na mediação o psicólogo pode ser árbitro, mediador ou conciliador — mas <strong>não</strong> juiz. As três concepções criminológicas (causalista, multifatorial, crítica) também caem com frequência.</p>\n<h3>Criminologia — concepções evolutivas</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Concepção</th>\n<th>Característica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Causalista</strong></td>\n<td>relação determinista causa→efeito no crime</td>\n</tr>\n<tr>\n<td><strong>Multifatorial</strong></td>\n<td>múltiplos fatores sem determinismo único; sem predisposição interna</td>\n</tr>\n<tr>\n<td><strong>Crítica</strong></td>\n<td>questiona por que certas condutas são criminalizadas e outras não</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> \"a evolução criminológica percorre apenas duas concepções\" → ERRADO, são três (Q6-U3).</p>\n<h3>Tipos de delinquência</h3>\n<ul>\n<li><strong>Delinquência ocasional</strong> = indivíduo ajustado que reage a estímulo externo</li>\n<li><strong>Delinquência neurótica</strong> = conflito interno inconsciente</li>\n<li><strong>Delinquência psicótica</strong> = perda de noção da realidade</li>\n</ul>\n<h3>Execução Penal — Foucault</h3>\n<ul>\n<li>Prisão = principal pena moderna</li>\n<li>CTC (Comissão Técnica de Classificação) emite laudos de <strong>diagnóstico E prognóstico</strong> (não só diagnóstico)</li>\n<li>Na Antiguidade/Idade Média: trabalho <strong>desvalorizado</strong></li>\n</ul>\n<h3>Perícia Psicológica (CPC art. 145)</h3>\n<ul>\n<li>Avalia aspectos emocionais e psicológicos</li>\n<li>Psicólogo relata <strong>somente o necessário</strong> para o esclarecimento do caso (sigilo + ética)</li>\n<li>Laudo: linguagem clara e acessível (não rebuscada)</li>\n<li>Subsidia: interdição, suprimento de idade, capacidade de consentir, adoção</li>\n</ul>\n<h3>Métodos extrajudiciais de solução de conflitos</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Característica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Mediação</strong></td>\n<td>autocompositivo, não adversarial, ganha-ganha, célere, econômico</td>\n</tr>\n<tr>\n<td><strong>Arbitragem</strong></td>\n<td>árbitro escolhido pelas partes decide (hetercompositivo)</td>\n</tr>\n<tr>\n<td><strong>Conciliação</strong></td>\n<td>conciliador propõe solução</td>\n</tr>\n<tr>\n<td><strong>Julgamento</strong></td>\n<td>método mais tradicional, estatal</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Mediação: aplicabilidade ampla, <strong>qualquer contexto</strong> de conflito</li>\n<li><strong>Não adversarial</strong> = mediação. <strong>Adversarial</strong> = processo judicial tradicional</li>\n<li>Psicólogo pode atuar como: <strong>árbitro, mediador e conciliador</strong> (NÃO como juiz)</li>\n<li>Conteúdo <strong>manifesto</strong> = Direito; conteúdo <strong>latente</strong> = Psicologia</li>\n</ul>"}],"top5":["Mecanismos de defesa (distinguir racionalização/projeção/idealização)","Ego×Id×Superego","Mediação (não adversarial / ganha-ganha / árbitro≠juiz)","Inimputabilidade do adolescente + medidas socioeducativas","Adoção (papel do psicólogo como perito assessor)"],"questoes":[{"id":"Q1-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q1","tema":"Mecanismos de defesa (Psicanálise)","enun":"Freud, fundador da Psicanálise, trouxe uma contribuição importante que diz respeito ao que ele denominou de mecanismos de defesa. Analise as seguintes afirmações:\n\nI. Os mecanismos de defesa são responsáveis por diminuir a angústia provocada pelos conflitos internos.\nII. Na racionalização, a pessoa busca apresentar uma explicação coerente e lógica para um comportamento.\nIII. Na projeção, o objeto é exaltado e engrandecido psiquicamente.\n\nQual das alternativas está correta?\n\na) I está correta.\nb) I e II estão corretas.\nc) II e III estão corretas.\nd) I e III estão corretas.\ne) I, II e III estão corretas.","gab":"B","gabLabel":"I e II estão corretas","html":"<p>I é correta: mecanismos de defesa diminuem a angústia dos conflitos internos (Livro-Texto, Item 1.1). II é correta: racionalização = explicação lógica e moralmente aceitável para um comportamento. III é incorreta: o engrandecimento psíquico do objeto é <b>idealização</b>, não projeção; na projeção, sentimentos internos são atribuídos a outra pessoa.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q2-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q2","tema":"Reforço positivo (Behaviorismo/Skinner)","enun":"O Behaviorismo, representado principalmente por Skinner, trouxe o conceito de comportamento operante: para cada resposta há um estímulo correspondente. Nesse sentido, como é entendido o reforço positivo?\n\na) É aquele que independe da aprendizagem.\nb) Aumenta a probabilidade da ocorrência da resposta que o atenue ou o elimine.\nc) Aumenta a probabilidade da ocorrência da resposta que o produz.\nd) É conhecido como o procedimento no qual uma resposta deixa abruptamente de ser reforçada.\ne) É um procedimento em que os estímulos aversivos estão separados por um intervalo de tempo que previne que o indivíduo execute um comportamento.","gab":"C","gabLabel":"Aumenta a probabilidade da ocorrência da resposta que o produz","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O reforço positivo atua como recompensa, aumentando a frequência da resposta que o produz (ex.: delação premiada). A alternativa B descreve o <b>reforço negativo</b> (fuga/evitação) e a D refere-se à <b>extinção</b> (Livro-Texto, Item 1.2).","repete":false,"repeteRef":"","coment":[]},{"id":"Q3-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q3","tema":"Gestalt e percepção","enun":"A Gestalt entendida como a teoria da \"forma\" tem como objetivo explicar como percebemos a nós mesmos, as outras pessoas e o ambiente. Assinale a alternativa correta:\n\na) O todo de uma percepção é igual à soma das partes.\nb) A percepção de algo ou de alguém não interfere na compreensão do comportamento humano.\nc) A Gestalt se interessou em estudar os mecanismos de defesa.\nd) Para a Gestalt, a relação figura e fundo não pode oscilar de acordo com o que é salientado como relevante pelo psiquismo humano.\ne) A Gestalt estudou o fenômeno denominado de ilusão de óptica.","gab":"E","gabLabel":"A Gestalt estudou o fenômeno denominado de ilusão de óptica","html":"<p>O todo é <b>diferente</b> (não igual) à soma das partes (A falsa). Mecanismos de defesa são tema da Psicanálise, não da Gestalt (C falsa). A relação figura-fundo <b>pode</b> oscilar (D falsa). A Gestalt dedicou estudos à percepção visual e às ilusões de óptica — imagens que enganam a visão (Livro-Texto, Item 1.3).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q4-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q4","tema":"Racionalização (Psicanálise)","enun":"Freud postula a existência de uma agressividade inata no homem. Segundo o autor, os mecanismos de defesa surgem para evitar o desprazer. Como se denomina o mecanismo em que o indivíduo constrói uma argumentação intelectualmente convincente para justificar estados \"deformados\" da consciência?\n\na) Repressão.\nb) Regressão.\nc) Projeção.\nd) Racionalização.\ne) Identificação.","gab":"D","gabLabel":"Racionalização","html":"<p>A <b>racionalização</b> é o mecanismo de defesa pelo qual o indivíduo elabora justificativas lógicas e moralmente aceitáveis para condutas ou pensamentos que, de outra forma, causariam angústia (Livro-Texto, Item 1.1). Repressão = barrar o acesso ao consciente; Projeção = atribuir ao outro; Regressão = retorno a etapa anterior do desenvolvimento.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q5-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q5","tema":"Id, Ego e Superego","enun":"Freud construiu a estrutura da mente, entre elas uma estrutura que equilibra as exigências do Id e do superego. Estamos falando do:\n\na) Id.\nb) Ego.\nc) Superego.\nd) Recalque.\ne) Pré-inconsciente.","gab":"B","gabLabel":"Ego","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Na Segunda Tópica freudiana: o <b>Id</b> é guiado pelo princípio do prazer (sem controle moral); o <b>Superego</b> representa a moral e a lei internalizada; o <b>Ego</b> é guiado pelo princípio da realidade, harmonizando Id e Superego perante o mundo externo (Livro-Texto, Item 1.1 e Slides 10/11).","repete":false,"repeteRef":"","coment":[]},{"id":"Q6-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q6","tema":"Direito e Psicologia","enun":"Quando comparamos o Direito e a Psicologia é possível observarmos diversas características. Assinale a alternativa correta:\n\na) Cada uma das ciências compartilha um objeto de estudo diferenciado.\nb) Diferentemente do Direito, a psicologia jurídica não se ocupa do comportamento de todas as pessoas que participam da questão processual.\nc) A primeira aproximação entre o Direito e a Psicologia ocorreu no século XIX, com a psicologia do delinquente juvenil.\nd) Não é possível perceber correspondências entre as duas ciências.\ne) A psicologia jurídica busca entender o homem e seu comportamento concomitantemente aos aspectos legais para que uma conduta seja classificada e julgada no sistema jurídico.","gab":"E","gabLabel":"","html":"<p>Direito e Psicologia compartilham o mesmo objeto de estudo: o homem e seu comportamento (Livro-Texto, Introdução). A primeira aproximação histórica se deu através da <b>Psicologia do Testemunho</b> (final séc. XIX), não da psicologia do delinquente juvenil (C falsa).</p><p>A alternativa E descreve com precisão a convergência disciplinar.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q7-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q7","tema":"Áreas de atuação do psicólogo jurídico","enun":"Analise as seguintes afirmações em relação às áreas de atuação da psicologia jurídica:\n\nI. Na área da infância e da juventude, a psicologia jurídica engloba, por exemplo, a adoção, o Conselho Tutelar, a intervenção junto a crianças abrigadas.\nII. Na área do trabalho, a psicologia jurídica se insere nas questões do crime e do criminoso.\nIII. Na área da psicologia penitenciária, a psicologia jurídica engloba apenas alternativas como intervenção junto ao recluso e aos egressos, por exemplo.\nIV. Na área de vitimologia, abrange aspectos de violência doméstica, atendimento a vítimas de violência e seus familiares.","gab":"B","gabLabel":"I, II, III e IV estão corretas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A banca considerou todas corretas. O gabarito oficial registrado no AVA é B — adotar para fins de prova.","repete":false,"repeteRef":"","coment":[]},{"id":"Q8-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q8","tema":"Psicologia Forense","enun":"A Psicologia Jurídica corresponde a toda aplicação do saber psicológico às questões relacionadas ao Direito. Analise as afirmações e assinale a alternativa correta:\n\nI. A psicologia forense é entendida como a aplicação no âmbito de um processo ou procedimento em andamento no foro.\nII. A psicologia jurídica teve início no Brasil em 1980, no Tribunal de Justiça de São Paulo, quando um grupo de voluntários passou a orientar pessoas encaminhadas do Serviço Social.\nIII. A criminologia estuda os aspectos psíquicos dos juízes.\nIV. A psicologia jurídica não pode atuar na área de mediação, pois essa é tarefa dos assistentes sociais.\n\na) III e IV estão corretas.\nb) I está correta.\nc) II e III estão corretas.\nd) I e II estão corretas.\ne) I, II, III e IV estão corretas.","gab":"B","gabLabel":"I está correta","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>I é correta: psicologia forense = âmbito de processo em andamento no foro (Livro-Texto, l. 164).\n<ul><li><b>II</b> <b style=\"color:var(--err)\">falsa</b>: o cargo de psicólogo jurídico no TJSP foi criado em <b>1985</b>, não 1980.</li><li><b>III</b> <b style=\"color:var(--err)\">falsa</b>: Criminologia estuda o criminoso e a infração.</li><li><b>IV</b> <b style=\"color:var(--err)\">falsa</b>: o psicólogo atua ativamente em mediação.</li></ul>","repete":false,"repeteRef":"","coment":[]},{"id":"Q9-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q9","tema":"Orientação (função psíquica)","enun":"Os transtornos psico-orgânicos podem ocasionar várias alterações patológicas. Uma alteração diz respeito à dificuldade de uma pessoa não conseguir se situar quanto a si mesmo e quanto ao tempo e ao espaço. Essa alteração se relaciona com:\n\na) Atenção.\nb) Memória.\nc) Consciência.\nd) Ego.\ne) Orientação.","gab":"E","gabLabel":"Orientação","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A <b>orientação</b> é a capacidade de situar-se no tempo (temporal), no espaço (espacial) e em relação a si mesmo (autopsíquica). Sua perda configura desorientação — alteração distinta de memória ou atenção (Livro-Texto, Unidade I, Item 3.1).","repete":false,"repeteRef":"","coment":[]},{"id":"Q10-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q10","tema":"Testemunho espontâneo","enun":"O que é correto afirmar sobre o testemunho espontâneo, estudado na área da psicologia do testemunho?\n\na) Representa o resultado do conflito entre o que o indivíduo sabe de um lado e o que as perguntas que se lhe dirigem tendem a fazê-lo saber.\nb) Apresenta um relato menos deformado, mais vivo e puro.\nc) A pergunta pode fazer o indivíduo sentir a existência de uma lacuna em sua memória.\nd) É se expor voluntariamente à respectiva punição.\ne) O testemunho espontâneo não é aceito legalmente.","gab":"B","gabLabel":"Apresenta um relato menos deformado, mais vivo e puro","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O <b>testemunho espontâneo</b> é prestado sem a indução de perguntas, sendo mais puro e menos sujeito a falsas memórias. As alternativas A e C referem-se aos efeitos do <b>interrogatório</b> sobre o testemunho induzido (Livro-Texto, Item 4.1 e Slide 35).","repete":false,"repeteRef":"","coment":[]},{"id":"AT1-I","bloco":"UNIDADE I — ATIVIDADE TELEAULA","num":"AT1","tema":"Ego, Id e Superego","enun":"Freud, fundador da Psicanálise, afirma que o nosso aparelho psíquico é constituído por 3 estruturas. Assinale a estrutura que equilibra as exigências do Id e do superego:\n\na) Id.\nb) Ego.\nc) Superego.\nd) Recalque.\ne) Pré-inconsciente.","gab":"B","gabLabel":"Ego","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O <b>Ego</b> opera sob o princípio da realidade para conciliar as exigências primitivas do <b>Id</b> (princípio do prazer) com as imposições morais do <b>Superego</b> (Livro-Texto, Item 1.1 e Slides 10/11).","repete":false,"repeteRef":"","coment":[]},{"id":"AT2-I","bloco":"UNIDADE I — ATIVIDADE TELEAULA","num":"AT2","tema":"Áreas de atuação — Infância e Juventude","enun":"São várias as áreas de atuação do psicólogo jurídico. Assinale a alternativa correta que engloba exemplo(s) de ação(ões) na área da Infância e da Juventude:\n\na) Separações e partilha de bens.\nb) Formação de juízes.\nc) Adoção, Conselho Tutelar, intervenção junto às crianças abrigadas.\nd) Trabalho junto aos agentes de segurança nos presídios.\ne) Condições de trabalho.","gab":"C","gabLabel":"Adoção, Conselho Tutelar, intervenção junto às crianças abrigadas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p><p>Intervenções no âmbito do Direito da Infância e da Juventude abrangem adoção, destituição do poder familiar, medidas socioeducativas, Conselhos Tutelares e instituições de acolhimento (Livro-Texto, Seção 2 e Slides 21/22).</p><p>A opção D pertence à Psicologia Penitenciária; E ao Direito do Trabalho.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"AT3-I","bloco":"UNIDADE I — ATIVIDADE TELEAULA","num":"AT3","tema":"Neurose, psicose e perversão","enun":"O uso do termo \"doença mental\" é utilizado pela legislação brasileira. Analise as afirmações e assinale a alternativa correta:\n\nI. Quem sofre de neurose não tem a consciência de seus atos;\nII. No chamado transtorno bipolar, a pessoa vive fases alternadas de euforia e melancolia;\nIII. Na perversão, o indivíduo busca a satisfação sexual além dos limites da \"normalidade\".\n\na) Apenas a afirmação I está correta.\nb) Apenas a afirmação II está correta.\nc) Apenas as afirmações I e II estão corretas.\nd) Apenas as afirmações II e III estão corretas.\ne) As afirmações I, II e III estão corretas.","gab":"D","gabLabel":"Apenas II e III estão corretas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>I é <b>incorreta</b>: na neurose o indivíduo <b>tem consciência</b> dos atos (quem perde a consciência da realidade é o <b>psicótico</b>). II é correta: bipolar = alternância euforia/melancolia (Slide 26). III é correta: perversão = satisfação sexual além dos padrões normativos (Slide 27).","repete":false,"repeteRef":"","coment":[]},{"id":"AT4-I","bloco":"UNIDADE I — ATIVIDADE TELEAULA","num":"AT4","tema":"Vitimologia: tipologia da vítima","enun":"A Vitimologia é o estudo da influência da vítima na ocorrência de um delito. Como é denominada a vítima que provoca e incita o autor do crime?\n\na) Vítima unicamente culpada.\nb) Vítima mais culpada que o infrator.\nc) Vítima voluntária ou tão culpada quanto o infrator.\nd) Vítima de culpabilidade menor ou por ignorância.\ne) Vítima completamente inocente.","gab":"B","gabLabel":"Vítima mais culpada que o infrator","html":"<p>Na tipologia vitimológica adotada pela disciplina, a vítima que instiga, provoca ou incita a conduta do agressor é classificada como <b>\"Vítima mais culpada que o infrator\"</b> — categoria distinta da \"vítima unicamente culpada\" (que elimina por completo a culpa do agente) (Livro-Texto, Item 4.2 e Slides 37-39).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q1-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q1","tema":"Lei Maria da Penha","enun":"A violência doméstica costuma ter um ciclo: discussão, agressão, queixa, arrependimento, sedução, conciliação e retirada da queixa. Em 2006, foi promulgada a Lei Maria da Penha. O que é correto afirmar sobre esta lei?\n\na) Lei que protege crianças e adolescentes em contexto de perigo.\nb) A lei tem como principal finalidade retirar a mulher imediatamente do seu lar.\nc) Trata especificamente da agressão física cometida contra a mulher.\nd) Garante, entre outras medidas, o atendimento por equipe multidisciplinar à mulher que sofreu violência.\ne) É a lei que traz uma série de medidas como impedir que aconteçam agressões contra mulheres, cometidas por qualquer pessoa.","gab":"D","gabLabel":"Garante atendimento por equipe multidisciplinar","html":"<p>A Lei nº 11.340/2006 garante à mulher em situação de violência doméstica atendimento multidisciplinar (psicólogos, assistentes sociais, saúde). O afastamento do lar é imposto ao <b>agressor</b> (não à vítima). A lei abrange violência física, psicológica, verbal, patrimonial e sexual (Livro-Texto, Item 5.1 e Slide 14).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q2-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q2","tema":"ECA e medidas socioeducativas","enun":"De acordo com o ECA, quando se analisa a delinquência infantil ou juvenil, a ideia da função repressiva cede à da cidadania da criança e do adolescente. Neste sentido, podemos afirmar que é correto:\n\na) A criança pode ser punida, dependendo de sua idade.\nb) À criança aplica-se medidas penais.\nc) A criança não pode ser punida, aplicando-se medidas socioeducativas.\nd) Ao adolescente aplicam-se medidas protetivas, porém, somente em alguns casos.\ne) À criança não se aplica medida alguma.","gab":"C","gabLabel":"A criança não pode ser punida, aplicando-se medidas socioeducativas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Menores de 18 anos são penalmente <b>inimputáveis</b> — não há penas criminais. A criança (até 12 anos incompletos) fica sujeita a medidas de <b>proteção</b>; o adolescente (12-18 anos), a medidas <b>socioeducativas</b> (Livro-Texto, Item 6.3).","repete":false,"repeteRef":"","coment":[]},{"id":"Q3-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q3","tema":"Adolescência e ato infracional","enun":"Com relação à Adolescência e Ato Infracional, assinale a alternativa correta.\n\na) Pelo ECA, a adolescência compreende o período de 12 a 15 anos de idade.\nb) Crianças e adolescentes devem ser cuidados somente pela família.\nc) Infratores adolescentes de classe média podem ter tido uma educação em que os pais não os preservaram do medo e da frustração.\nd) A maioria dos infratores possui uma história de carências e privações.\ne) O adolescente que pratica um ato infracional é imputável e não fica impune.","gab":"D","gabLabel":"A maioria dos infratores possui uma história de carências e privações","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O ato infracional juvenil fundamenta-se predominantemente em exclusão social, vulnerabilidades e privações familiares/materiais (Livro-Texto, Item 6.3 e Slides 52/53). A adolescência vai dos 12 aos <b>18</b> anos (não 15). O adolescente é <b>inimputável</b>.","repete":false,"repeteRef":"","coment":[]},{"id":"Q4-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q4","tema":"Família e Constituição Federal","enun":"De acordo com a Constituição Federal de 1988, artigos 226 e seguintes, desenha-se uma nova família sob a proteção da lei. A partir dela, o que é correto afirmar?\n\na) A família biparental não é reconhecida pela Constituição, porque se trata de uma família de homossexuais.\nb) A família monoparental é reconhecida pela Constituição. Ela é constituída por um dos pais e seus filhos.\nc) A união estável heteroafetiva é a união originada pelo casamento entre homossexuais.\nd) A união estável homoafetiva é a união de vida entre duas pessoas do mesmo sexo não reconhecida por uma lei especial.\ne) Atualmente, o poder familiar não pressupõe a igualdade dos cônjuges.","gab":"B","gabLabel":"A família monoparental é reconhecida pela Constituição","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O art. 226, § 4º da CF/88 reconhece expressamente a <b>família monoparental</b> como entidade familiar: comunidade formada por qualquer um dos pais e seus descendentes (Livro-Texto, Item 5 e Slide 4).","repete":false,"repeteRef":"","coment":[]},{"id":"Q5-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q5","tema":"Psicólogo na adoção","enun":"Assinale a alternativa correta com relação à adoção e aos aspectos psicológicos do processo:\n\na) A inserção da criança em uma família dificulta a reconstrução de sua identidade.\nb) A destituição do poder familiar constitui-se como medida não necessária para proteger a criança e o adolescente.\nc) A atuação do psicólogo, nos casos de adoção, equivale ao perito judicial visando assessorar a Justiça da Infância e da Juventude.\nd) A adoção deve ser concedida quando oferecer vantagens, principalmente, aos adotantes.\ne) A fantasia do filho perfeito não interfere no processo de adoção, pois trata-se de uma fantasia.","gab":"C","gabLabel":"A atuação do psicólogo equivale ao perito judicial visando assessorar a Justiça","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O psicólogo jurídico integra a equipe interprofissional do Juizado da Infância e da Juventude, desempenhando papel <b>avaliativo e pericial</b> para assessorar o magistrado nas decisões sobre adoção — sempre priorizando o melhor interesse da criança (Livro-Texto, Item 6.1 e Slides 39, 44/45).","repete":false,"repeteRef":"","coment":[]},{"id":"Q6-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q6","tema":"Poder familiar e alienação parental","enun":"O Código Civil de 2002 pressupõe a igualdade dos cônjuges na responsabilidade de criação dos filhos. Neste sentido, é correto afirmar que:\n\na) O pátrio poder dá lugar ao poder familiar.\nb) A alienação parental é um fato esperado e permitido.\nc) O novo código não prevê a manutenção do vínculo entre pais e filhos.\nd) A alienação parental é entendida como o ato de afastar o filho apenas do pai.\ne) A família só pode ser biparental.","gab":"A","gabLabel":"O pátrio poder dá lugar ao poder familiar","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Com o CC/2002 e a CF/88, a concepção patriarcal do \"pátrio poder\" foi substituída pelo <b>poder familiar</b>, pautado na igualdade entre cônjuges. A alienação parental é <b>proibida por lei</b> (Lei nº 12.318/2010), não \"esperada e permitida\" (Livro-Texto, Item 5 e Slides 5, 12/13).","repete":false,"repeteRef":"","coment":[]},{"id":"Q7-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q7","tema":"Pedofilia e abuso sexual","enun":"Assinale a alternativa correta com relação à pedofilia e abuso sexual:\n\na) Não há a possibilidade de diferenciarmos a pedofilia de abuso sexual.\nb) A Pedofilia é um diagnóstico clínico.\nc) A pessoa que abusa sexualmente de menores de idade é inimputável.\nd) Todo pedófilo é um abusador sexual.\ne) O Código Penal e o ECA preveem redução de pena para o pedófilo abusador.","gab":"B","gabLabel":"A Pedofilia é um diagnóstico clínico","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Pedofilia é uma <b>patologia/transtorno psiquiátrico</b> (diagnóstico clínico). Nem todo pedófilo pratica abuso, assim como nem todo abusador tem o diagnóstico de pedofilia. O CP e o ECA não preveem redução de pena por esse diagnóstico (Livro-Texto, Item 6.2 e Slide 47).","repete":false,"repeteRef":"","coment":[]},{"id":"Q8-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q8","tema":"Tipos de guarda","enun":"Analise as assertivas abaixo:\n\nI - A guarda única ou exclusiva passou a ser considerada insatisfatória para atender às necessidades e aos interesses dos pais e, principalmente, dos filhos.\nII - A guarda alternada é aquela conferida exclusivamente a um dos genitores.\nIII - Na guarda compartilhada ambos os genitores dividem a responsabilidade pela tomada de decisões relacionadas aos filhos, tendo os mesmos direitos e obrigações.\n\na) Todas as assertivas estão corretas.\nb) Todas as assertivas estão incorretas.\nc) Somente a assertiva I é correta.\nd) As assertivas I e II estão corretas.\ne) As assertivas I e III estão corretas.","gab":"E","gabLabel":"I e III estão corretas","html":"<p>I é correta: guarda única tornou-se insatisfatória (Slide 8). II é <b>incorreta</b>: guarda alternada é a que alterna a custódia em períodos pré-determinados; a conferida a um só é a guarda <i>única</i>. III é correta: guarda compartilhada = direitos e deveres iguais para ambos os genitores (Slide 10).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q9-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q9","tema":"Equipe interprofissional na adoção","enun":"O ECA obriga a existência de uma Equipe Interprofissional composta de assistentes sociais e psicólogos nos processos de adoção. Qual das alternativas abaixo é correta?\n\na) Descreve, por exemplo, os requisitos necessários apenas aos adotantes.\nb) A atuação do psicólogo não contempla, por exemplo, entrevistas devolutivas e um trabalho de acompanhamento.\nc) O trabalho inclui a aproximação gradual com os pretendentes à adoção.\nd) A atuação dos profissionais é concebida como dispondo de um caráter punitivo.\ne) Não pode prever intervenções mais diretivas.","gab":"C","gabLabel":"O trabalho inclui a aproximação gradual com os pretendentes à adoção","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O acompanhamento inclui o processo de <b>aproximação gradual</b> entre os pretendentes habilitados e a criança/adolescente, além do estágio de convivência supervisionado — sempre com caráter orientativo, não punitivo (Livro-Texto, Item 6.1 e Slide 40).","repete":false,"repeteRef":"","coment":[]},{"id":"Q10-II","bloco":"UNIDADE II — QUESTIONÁRIO","num":"Q10","tema":"Roteiro do TJSP para adoção","enun":"Uma das atribuições do psicólogo judiciário é avaliar os pretendentes à adoção. Analise as afirmações e assinale a alternativa correta.\n\nI. O Tribunal de Justiça de São Paulo distribui, em todas as Comarcas do Estado, um roteiro contendo sugestões e uma relação de itens e critérios a serem contemplados no estudo psicossocial dos pretendentes à adoção.\nPORQUE\nII. Há posturas e utilização de abordagens teóricas diferenciadas dos psicólogos devido à formação profissional, para a avaliação dos pretendentes à adoção.\n\na) As afirmações I e II são corretas, e a afirmação II justifica a afirmação I.\nb) A afirmação I é correta e a afirmação II é incorreta.\nc) A afirmação I é incorreta e a afirmação II é correta.\nd) Ambas as afirmações são incorretas.\ne) As afirmações I e II são corretas, mas a afirmação II não justifica a afirmação I.","gab":"A","gabLabel":"I e II corretas, e II justifica I","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O TJSP distribui roteiro norteador justamente porque cada psicólogo traz referenciais teóricos heterogêneos de sua formação — o roteiro estabelece parâmetros comuns. A diversidade de abordagens (II) é exatamente o motivo do roteiro (I) (Livro-Texto, Item 6.1 e Slide 41).","repete":false,"repeteRef":"","coment":[]},{"id":"AT1-II","bloco":"UNIDADE II — ATIVIDADE TELEAULA","num":"AT1","tema":"Alienação parental","enun":"O Código Civil de 2002 pressupõe a igualdade dos cônjuges. Assinale o que é <b>incorreto</b> afirmar:\n\na) O pátrio poder dá lugar ao poder familiar.\nb) A alienação parental é permitida.\nc) O novo código prevê a manutenção do vínculo entre os pais e os filhos.\nd) O código proíbe o ato de afastar o filho da mãe ou do pai.\ne) A família pode ser biparental ou monoparental.","gab":"B","gabLabel":"A alienação parental é permitida — incorreta, conforme solicitado","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A alienação parental é <b>expressamente proibida e sancionada</b> pela Lei nº 12.318/2010 — constitui abuso moral e violação dos direitos fundamentais do menor (Livro-Texto, Item 5 e Slides 11-13). As demais alternativas são verdadeiras.","repete":false,"repeteRef":"","coment":[]},{"id":"AT2-II","bloco":"UNIDADE II — ATIVIDADE TELEAULA","num":"AT2","tema":"Medidas socioeducativas (ECA)","enun":"De acordo com o ECA, o adolescente que pratica um ato infracional é inimputável. Assinale a alternativa correta:\n\na) O adolescente não é responsabilizado por uma legislação especial.\nb) O adolescente deve ser punido como qualquer infrator.\nc) Os menores de 18 anos são imputáveis.\nd) Dentre as medidas socioeducativas, encontra-se a não privativa de liberdade.\ne) Não há medidas privativas de liberdade.","gab":"D","gabLabel":"Dentre as medidas socioeducativas, encontra-se a não privativa de liberdade","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p><p>O art. 112 do ECA divide as medidas em: <b>não privativas de liberdade</b> (advertência, reparação do dano, PSC, liberdade assistida) e <b>privativas de liberdade</b> (semiliberdade e internação).</p><p>Ambas as categorias existem (Livro-Texto, Item 6.3 e Slides 51, 55/56).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"AT3-II","bloco":"UNIDADE II — ATIVIDADE TELEAULA","num":"AT3","tema":"Fases do assédio moral","enun":"Assédio moral é um fenômeno social e mundial. Sabe-se que o processo de assédio passa por 4 fases. Assinale a fase em que ocorre o assédio propriamente dito e tem uma grande duração:\n\na) Fase da marginalização.\nb) Fase da intervenção da empresa.\nc) Fase de conflito.\nd) Fase do assédio sexual.\ne) Fase de estigmatização.","gab":"E","gabLabel":"Fase de estigmatização","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A <b>fase de estigmatização</b> (ou fase de <i>mobbing</i>) é caracterizada pelo assédio propriamente dito: humilhação, ridicularização e isolamento social contínuos, de longa duração (teoria de Leymann — Livro-Texto, Item 5.3 e Slides 24, 28/29).","repete":false,"repeteRef":"","coment":[]},{"id":"AT4-II","bloco":"UNIDADE II — ATIVIDADE TELEAULA","num":"AT4","tema":"Psicólogo na adoção","enun":"Assinale a alternativa correta com relação à adoção:\n\na) A inserção da criança em uma família dificulta a reconstrução de sua identidade.\nb) A destituição do poder familiar não é necessária para proteger as crianças em risco.\nc) A atuação do psicólogo assessora a Justiça.\nd) A adoção deve ser concedida quando oferecer uma vantagem, apenas, aos adotantes.\ne) A fantasia do filho perfeito não interfere no processo de adoção.","gab":"C","gabLabel":"A atuação do psicólogo assessora a Justiça","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O psicólogo jurídico realiza estudos psicossociais e pareceres para <b>assessorar o magistrado</b> nas decisões de adoção, priorizando o melhor interesse da criança/adolescente (Livro-Texto, Item 6.1 e Slides 39, 44/45).","repete":false,"repeteRef":"","coment":[]},{"id":"Q1-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q1","tema":"Mediação","enun":"A mediação está prevista na legislação brasileira para a solução de conflitos, fazendo uso de métodos extrajudiciais. Qual alternativa é correta?\n\na) É um método menos econômico.\nb) Faz uso do método denominado autocompositivo, cujo foco é ganha/perde.\nc) A aplicabilidade da mediação abrange todo e qualquer contexto de convivência capaz de produzir conflitos.\nd) Método extrajudicial que demanda muito mais tempo.\ne) Método autocompositivo e foco no caráter adversarial.","gab":"C","gabLabel":"A aplicabilidade abrange todo e qualquer contexto de convivência","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A mediação é extrajudicial, autocompositiva, célere, econômica e de caráter <b>não adversarial</b> (foco: ganha-ganha). Sua aplicabilidade é ampla: conflitos familiares, comunitários, laborais e qualquer relação de convivência (Livro-Texto, Item 8.2 e Slides 35-38).","repete":false,"repeteRef":"","coment":[]},{"id":"Q2-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q2","tema":"Psicologia na execução penal","enun":"A psicologia jurídica na execução penal faz algumas indagações. Analise as afirmações:\n\nI. O conceito de crime varia no tempo e no espaço; o que foi crime outrora hoje não é mais, resultando na aplicação de novas penas.\nII. Durante boa parte da Antiguidade e da Idade Média, o trabalho era desvalorizado.\nIII. Espera-se que, nas prisões, as \"classes perigosas\" introjetem a disciplina para que possam viver novamente em sociedade.\nIV. A CTC (Comissão Técnica de Classificação) emite laudos que permitem apenas diagnosticar o preso quando ele ingressa no presídio.\n\na) I, II e III estão corretas.\nb) II e IV estão corretas.\nc) I e III estão corretas.\nd) I está correta.\ne) I, II, III e IV estão corretas.","gab":"A","gabLabel":"I, II e III estão corretas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>I, II e III são corretas (Slides 8-11). IV é <b>incorreta</b>: a CTC elabora laudos de diagnóstico <b>e prognóstico</b> para a ressocialização, não apenas diagnóstico no ingresso (Livro-Texto, Item 7.1 e Slide 11).","repete":false,"repeteRef":"","coment":[]},{"id":"Q3-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q3","tema":"Métodos extrajudiciais","enun":"A legislação brasileira prevê, para a solução de conflitos, a utilização de métodos extrajudiciais. Analise as afirmações:\n\nI. Os métodos extrajudiciais não objetivam a exclusão ou a superação do sistema jurídico tradicional.\nII. O julgamento é o método mais tradicional.\nIII. Na arbitragem, a decisão do conflito cabe a um terceiro, o árbitro que é escolhido pelas partes.\n\na) I, II e III estão corretas.\nb) I está correta.\nc) I e II estão corretas.\nd) I e III estão corretas.\ne) II e III estão corretas.","gab":"A","gabLabel":"I, II e III estão corretas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Todas são verdadeiras. Os métodos extrajudiciais complementam (não excluem) o Judiciário. O julgamento por sentença estatal é o método mais tradicional. Na arbitragem, um especialista neutro (árbitro) escolhido pelas partes decide o litígio (Livro-Texto, Item 8.2 e Slides 35/36).","repete":false,"repeteRef":"","coment":[]},{"id":"Q4-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q4","tema":"Criminologia crítica","enun":"A criminologia é a ciência que se ocupa do crime, da criminalidade, da vítima, do criminoso e de sua ressocialização. Assinale a alternativa que diz respeito à concepção que questiona acerca das razões pelas quais determinadas condutas são consideradas criminosas enquanto que outras não:\n\na) Concepção causalista.\nb) Concepção igualitária.\nc) Concepção multifatorial.\nd) Concepção dualista.\ne) Concepção criminologia crítica.","gab":"E","gabLabel":"Concepção criminologia crítica","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A <b>Criminologia Crítica</b> problematiza e questiona as razões sociais e políticas pelas quais certas condutas e grupos são criminalizados pelo Estado enquanto outros não o são — opondo-se aos paradigmas tradicionais (Livro-Texto, Item 7.1 e Slide 17).","repete":false,"repeteRef":"","coment":[]},{"id":"Q5-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q5","tema":"Foucault e a prisão","enun":"Com relação à psicologia jurídica na execução penal, é correto afirmar:\n\na) Para Foucault, a prisão é a principal pena aplicada aos que cometem crimes.\nb) Na Idade Média, o trabalho era valorizado.\nc) A prisão não era um meio de marginalização.\nd) Com o advento da sociedade do trabalho, começou-se a desvalorizar quem trabalhasse.\ne) O conceito de crime e pena não foi se modificando com o decorrer da história.","gab":"A","gabLabel":"Para Foucault, a prisão é a principal pena aplicada","html":"<p>Segundo Foucault (Livro-Texto, Item 7.1 e Slides de Aula), na sociedade moderna a <b>prisão</b> tornou-se a pena hegemônica e o principal instrumento disciplinar do Estado. Na Idade Média o trabalho era <b>desvalorizado</b> (B falsa), e o conceito de crime <b>se modifica</b> historicamente (E falsa).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q6-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q6","tema":"Concepções criminológicas","enun":"A criminologia se originou na segunda metade do século XIX. Analise as afirmações:\n\nI. Há uma evolução do pensamento criminológico que percorre apenas duas concepções: a causalista e a multifatorial.\nII. Para a concepção multifatorial não se pressupõe nenhuma condição interna de predisposição ao crime.\nIII. Na concepção causalista entende-se que não há uma relação entre causa e efeito entre a conduta criminosa e o que a originou.\n\na) I é correta.\nb) II e III estão corretas.\nc) I e II estão corretas.\nd) II está correta.\ne) I, II e III estão corretas.","gab":"D","gabLabel":"II está correta","html":"<p>I é <b>incorreta</b>: há três concepções — causalista, multifatorial e <b>crítica</b> (Slide 17). II é <b>correta</b>: a multifatorial não estabelece determinismo biológico. III é <b>incorreta</b>: na concepção causalista <b>há</b> relação direta de causa e efeito entre o fator gerador e o ato criminoso.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q7-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q7","tema":"Perícia psicológica e CPC","enun":"O Código de Processo Civil indica, em seu art. 145, que o juiz será auxiliado por um perito quando as provas dependerem de conhecimento específico e especializado. Nesse sentido, é correto afirmar:\n\na) Não é necessário que o perito tenha conhecimentos teóricos sobre áreas afins, pois nesse caso importam apenas conhecimentos jurídicos.\nb) O psicólogo deverá tomar as precauções para relatar somente o necessário para o esclarecimento do caso.\nc) O psicólogo não subsidia a interdição.\nd) A perícia deve analisar fatos e pessoas, enfocando somente os aspectos emocionais das relações.\ne) Não cabe ao psicólogo subsidiar decisões relacionadas a casos de suprimento de idade e capacidade para consentir.","gab":"B","gabLabel":"O psicólogo deverá relatar somente o necessário para o esclarecimento do caso","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>O Código de Ética do Psicólogo (Art. 23, § 1º) exige rigor ético e sigilo: o laudo pericial deve restringir-se aos dados estritamente necessários ao esclarecimento da demanda judicial, sem expor informações além do essencial (Livro-Texto, Item 8.1 e Slide 30).","repete":false,"repeteRef":"","coment":[]},{"id":"Q8-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q8","tema":"Mediação de conflitos familiares","enun":"A mediação de conflitos é uma das atividades valorizadas na atualidade. Analise as afirmações:\n\nI. Por meio da mediação é possível considerar os elementos objetivos e afetivos dos conflitos, ultrapassando as questões jurídicas e possibilitando uma visão abrangente, com vistas a uma solução satisfatória para todos.\nII. A mediação de divórcio para casais com filhos procura servir apenas aos interesses do genitor considerado pelo advogado o guardião legal mais adequado.\nIII. A dinâmica emocional do conflito envolve conteúdos manifestos (material dos operadores do Direito) e conteúdos latentes (material dos profissionais da Psicologia).\n\na) I, II e III estão corretas.\nb) I está correta.\nc) I e II estão corretas.\nd) I e III estão corretas.\ne) II e III estão corretas.","gab":"D","gabLabel":"I e III estão corretas","html":"<p>I é correta: a mediação engloba dimensão objetiva e subjetiva do conflito. II é <b>incorreta</b>: a mediação é imparcial e busca benefício mútuo (<i>ganha-ganha</i>), rejeitando favorecimento unilateral. III é correta: operadores do Direito = conteúdo manifesto; psicólogo = conteúdo latente (Livro-Texto, Item 8.2 e Slides 35-38).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q9-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q9","tema":"Psicólogos em composição de conflitos","enun":"A morosidade da Justiça impulsiona métodos extrajudiciais. Profissionais formados em Psicologia podem atuar no campo da composição de conflitos familiares como:\n\na) Árbitros, mediadores, conciliadores e juízes.\nb) Juízes, mediadores e árbitros.\nc) Árbitros, mediadores e conciliadores.\nd) Mediadores e juízes.\ne) Árbitros e juízes.","gab":"C","gabLabel":"Árbitros, mediadores e conciliadores","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Psicólogos podem atuar como <b>árbitros</b>, <b>mediadores</b> ou <b>conciliadores</b>. A função de <b>Juiz</b> é privativa de bacharéis em Direito mediante concurso público — não pode ser exercida por psicólogos (Livro-Texto, Item 8.2 e Slides 35-38).","repete":false,"repeteRef":"","coment":[]},{"id":"Q10-III","bloco":"UNIDADE III — QUESTIONÁRIO","num":"Q10","tema":"Criminalidade e etiologia","enun":"Ao longo dos anos, a criminalidade tem se tornado uma preocupação social e mundial. Analise as afirmações:\n\nI. Observa-se uma multiplicidade e classificações relacionadas ao crime.\nII. As medidas corretivas, independentemente da teoria escolhida, visam à recuperação do agente e à prevenção da reincidência.\nIII. O ponto de partida da classificação etiológica mostra que, quando ocorre o ato criminoso, o agente responde a estímulos que derivam do meio interno ou externo.\n\na) I e III estão corretas.\nb) II e III estão corretas.\nc) I e II estão corretas.\nd) I está correta.\ne) I, II e III estão corretas.","gab":"E","gabLabel":"I, II e III estão corretas","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Todas as três assertivas reproduzem com exatidão a introdução teórica do estudo da criminalidade (Livro-Texto, Item 7.1, linhas 15-64 e Slides 2-4). Multiplicidade de classificações, finalidade ressocializadora das medidas e resposta a estímulos internos/externos são pilares da criminologia.","repete":false,"repeteRef":"","coment":[]},{"id":"AT1-III","bloco":"UNIDADE III — ATIVIDADE TELEAULA","num":"AT1","tema":"Delinquência ocasional","enun":"Como é denominado o delito que se refere a um indivíduo ajustado que o pratica mediante um estímulo externo?\n\na) Delito doloso.\nb) Delito culposo.\nc) Delinquência ocasional.\nd) Delinquência psicótica.\ne) Delinquência neurótica.","gab":"C","gabLabel":"Delinquência ocasional","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A <b>delinquência ocasional</b> caracteriza-se pelo ato infracional praticado por um indivíduo habitualmente ajustado e cumpridor das leis, que reage transitoriamente a um forte estímulo ou desencadeador externo (Livro-Texto, Item 7.1 e Slides 6, 15/16).","repete":false,"repeteRef":"","coment":[]},{"id":"AT2-III","bloco":"UNIDADE III — ATIVIDADE TELEAULA","num":"AT2","tema":"Concepção multifatorial","enun":"Como é denominada a concepção criminológica que leva em consideração diversos fatores que influenciariam o surgimento de um ato criminoso?\n\na) Crítica.\nb) Causalista.\nc) Diferencial.\nd) Multifatorial.\ne) Unilateral.","gab":"D","gabLabel":"Multifatorial","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A <b>concepção multifatorial</b> entende que a conduta criminosa não decorre de uma causa única determinista, mas de uma conjugação complexa de múltiplos fatores biológicos, psicológicos e sociais (Livro-Texto, Item 7.1 e Slides 17, 25/26).","repete":false,"repeteRef":"","coment":[]},{"id":"AT3-III","bloco":"UNIDADE III — ATIVIDADE TELEAULA","num":"AT3","tema":"Perícia psicológica","enun":"Assinale o que é correto afirmar sobre a perícia psicológica.\n\na) Ela avalia os aspectos emocionais e psicológicos de um indivíduo.\nb) Não está interessada em aprofundar a estrutura dinâmica da personalidade.\nc) O laudo só se torna importante para o psicólogo.\nd) A maturidade mental do indivíduo não necessita de avaliação.\ne) O psicólogo deve elaborar o laudo utilizando uma linguagem rebuscada.","gab":"A","gabLabel":"Ela avalia os aspectos emocionais e psicológicos de um indivíduo","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A perícia psicológica tem por objetivo investigar a estrutura dinâmica da personalidade, a maturidade mental, o nível intelectual e os aspectos emocionais do sujeito para orientar decisões judiciais por meio de laudo claro, conciso e acessível — não rebuscado (Livro-Texto, Item 8.1 e Slides 27-34).","repete":false,"repeteRef":"","coment":[]},{"id":"AT4-III","bloco":"UNIDADE III — ATIVIDADE TELEAULA","num":"AT4","tema":"Mediação: caráter adversarial","enun":"A mediação está prevista pela legislação brasileira. Qual das alternativas abaixo é <b>incorreta</b>?\n\na) É um método econômico.\nb) Seu foco é o resultado ganha/ganha.\nc) Sua aplicação é solucionar conflitos.\nd) É um método extrajudicial.\ne) Tem caráter adversarial.","gab":"E","gabLabel":"Tem caráter adversarial — incorreta, conforme solicitado","html":"<p>Ao contrário do processo judicial litigioso, a mediação é expressamente <b>não adversarial</b> — baseia-se na reconstrução do diálogo entre as partes para alcançar solução consensual de benefício mútuo (<i>ganha-ganha</i>). As demais alternativas (econômica, extrajudicial, foco em solução) são verdadeiras (Livro-Texto, Item 8.2 e Slides 38-40).</p>","repete":false,"repeteRef":"","coment":[]}],"sinteses":[],"cards":[{"id":"c1","f":"Qual estrutura da personalidade (Freud) equilibra Id e Superego?","v":"Ego — trabalha pelo princípio da realidade, conciliando os impulsos do Id (prazer) com as exigências do Superego (moral). Os mecanismos de defesa reduzem a angústia do Ego."},{"id":"c2","f":"O que é racionalização como mecanismo de defesa?","v":"Construção de argumentação intelectual para justificar estados \"deformados\" da consciência ou condutas inaceitáveis — o indivíduo cria uma explicação lógica e coerente para o que sente/faz."},{"id":"c3","f":"O que é projeção e o que a diferencia da idealização?","v":"Projeção: atribuição de qualidades ou intenções próprias a outro (ex: \"não sou eu que odeio, é ele que me odeia\"). Idealização: exaltação de um objeto/pessoa além da realidade — são mecanismos distintos."},{"id":"c4","f":"O que é reforço positivo no behaviorismo de Skinner?","v":"Estímulo que, quando apresentado após uma resposta, aumenta a probabilidade de que essa resposta se repita. Diferente do reforço negativo (remoção de estímulo aversivo para aumentar resposta)."},{"id":"c5","f":"Qual foi a primeira área de aproximação entre Psicologia e Direito?","v":"Psicologia do Testemunho (final do séc. XIX). Objeto comum de estudo de ambas as ciências: o homem e seu comportamento. Psicologia Jurídica busca entender o homem nos contextos legais."},{"id":"c6","f":"Quais são as principais áreas de atuação do psicólogo jurídico?","v":"Infância e Juventude (adoção, Conselho Tutelar, abrigos), Direito de Família (guarda, divórcio), Psicologia Penitenciária/Forense (laudos, triagem), Mediação de Conflitos. Psicologia forense = atuação no foro."},{"id":"c7","f":"O que é testemunho espontâneo e por que é importante?","v":"Relato dado sem perguntas indutoras ou interrogatório — apresenta descrição menos deformada, mais viva e pura dos fatos. O interrogatório introduz sugestões e pode distorcer a memória da testemunha."},{"id":"c8","f":"Neurose vs Psicose — qual perde a consciência dos atos?","v":"Neurose: o indivíduo tem consciência dos seus atos e sofre com os conflitos. Psicose (ex: esquizofrenia): perde o contato com a realidade, sem consciência da doença. Bipolar = alternância euforia/melancolia."},{"id":"c9","f":"O que a Lei Maria da Penha (11.340/2006) garante?","v":"Atendimento por equipe multidisciplinar (incluindo psicólogo). Afasta o agressor do lar (não a mulher). Aplica-se à violência física, psicológica, sexual, patrimonial e moral. Criou os JVDFMs."},{"id":"c10","f":"O que o ECA estabelece para o adolescente infrator?","v":"Adolescente (12-18 anos) = inimputável. Não se aplicam penas criminais, mas medidas socioeducativas: desde advertência (meio aberto) até internação (privativa de liberdade — ultima ratio). Criança (&lt; 12 anos): apenas medidas protetivas."},{"id":"c11","f":"Qual o papel do psicólogo jurídico nos casos de adoção?","v":"Atua como perito judicial — assessora a Justiça da Infância e da Juventude. Realiza aproximação gradual dos pretendentes com a criança, estágio de convivência, e emite laudo visando o melhor interesse da criança."},{"id":"c12","f":"O que é guarda compartilhada e o que a diferencia da guarda alternada?","v":"Compartilhada: ambos os pais participam das decisões sobre a criança (responsabilidade conjunta) — a criança pode ter residência fixa com um. Alternada: a criança mora alternadamente com cada pai em períodos definidos."},{"id":"c13","f":"O que é alienação parental e qual sua situação legal?","v":"Alienação parental = tentativa de um genitor de manipular a criança contra o outro genitor. É <b>proibida</b> pela Lei 12.318/2010. Penalidades incluem inversão de guarda, multa e, em casos graves, suspensão do poder familiar."},{"id":"c14","f":"Qual a diferença entre pedofilia e abuso sexual infantil?","v":"Pedofilia é um diagnóstico clínico (transtorno de preferência sexual — DSM/CID). Nem todo pedófilo abusa sexualmente de crianças; nem todo abusador de crianças é pedófilo. O diagnóstico não reduz a pena criminal."},{"id":"c15","f":"O que é mediação de conflitos e como difere da conciliação e arbitragem?","v":"Mediação: facilitação do diálogo por terceiro imparcial; partes constroem solução (ganha-ganha). Conciliação: conciliador pode propor soluções. Arbitragem: árbitro escolhido pelas partes decide (vinculante). Todos são métodos extrajudiciais — não excluem o Judiciário."},{"id":"c16","f":"Quais as fases do assédio moral segundo Leymann?","v":"<ol><li>Conflito inicial</li><li>intervenção da organização</li><li>expulsão do trabalho</li><li>sequelas físicas e psíquicas. Fase de maior duração = estigmatização.</li></ol>"},{"id":"c17","f":"O que é a criminologia crítica e como difere da causalista?","v":"Criminologia crítica: questiona por que certas condutas são criminalizadas e outras não (criminalização seletiva / poder). Causalista: busca relação causa-efeito para o crime. Multifatorial: múltiplos fatores sem determinismo."},{"id":"c18","f":"O que Foucault afirmou sobre a prisão?","v":"A prisão é a principal pena moderna (hegemônica) — substitui o suplício do corpo (punição pública medieval). O sistema prisional classifica, observa e normaliza os sujeitos (sociedade disciplinar). Foucault: <i>Vigiar e Punir</i>."},{"id":"c19","f":"Qual é o papel do psicólogo na execução penal (CTC)?","v":"A Comissão Técnica de Classificação emite laudos de diagnóstico <b>E prognóstico</b> (não só diagnóstico). O psicólogo subsidia decisões de progressão de regime, livramento condicional e reintegração social."},{"id":"c20","f":"Qual é o objeto da Psicologia Jurídica vs Psicologia Forense?","v":"Psicologia Jurídica: estudo mais amplo do comportamento humano no contexto legal (família, criança, mediação). Psicologia Forense: atuação dentro do foro (tribunal), com elaboração de laudos e perícias judiciais. Psicologia Forense é subcampo da Jurídica."}],"cobertura":["São 30 questões (2 unidades + atividades teleaula), com enunciado completo e gabarito fundamentado.","Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."],"notas":[]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["D982"]={"cod":"D982","revisao":[{"id":"r1","titulo":"PARTE GERAL DO CÓDIGO CIVIL — ESTRUTURA","prob":"alta","html":"<p>A Parte Geral do CC/2002 tem 3 livros. As bancas confundem os livros da Parte Geral com os da Parte Especial (Família, Sucessões, Obrigações). Atenção ao rol correto.</p>\n<ul>\n<li><strong>3 livros da Parte Geral:</strong> Das Pessoas (arts. 1–78) | Dos Bens (arts. 79–103) | Dos Fatos Jurídicos (arts. 104–232)</li>\n<li>Parte Especial contém: Obrigações, Contratos, Empresa, Família, Sucessões — <strong>não confundir com Parte Geral</strong></li>\n</ul>"},{"id":"r2","titulo":"FATO JURÍDICO","prob":"alta","html":"<ul>\n<li><strong>Conceito:</strong> evento da natureza <strong>ou</strong> da atividade humana capaz de criar, modificar, transferir ou extinguir direito</li>\n<li><strong>Negócio jurídico:</strong> decorre de <strong>atividade humana voluntária</strong> (autonomia privada) — pegadinha: NÃO decorre da natureza</li>\n<li><strong>Plano do negócio jurídico:</strong> Existência → Validade → Eficácia</li>\n<li><strong>Requisitos de validade (art. 104 CC):</strong> agente capaz + objeto lícito/possível/determinável + forma prescrita ou não defesa em lei</li>\n<li><strong>Acidentes do negócio jurídico:</strong> Condição | Termo | Encargo</li>\n<li><strong>Nulidade absoluta vs. relativa:</strong> distinção pelo interesse público/privado e possibilidade de ratificação</li>\n</ul>"},{"id":"r3","titulo":"LEI DO INQUILINATO (Lei 8.245/1991 + Lei 12.112/2009)","prob":"alta","html":"<p>O fiador assume risco. Quando a situação do inquilino muda (divórcio, etc.), a lei dá ao fiador o direito de se exonerar — mas com prazo e responsabilidade residual. Os prazos são o que a banca cobra.</p>\n<p>Alimentos são de ordem pública — não se renuncia, não se compensa, não se penhora. A característica que a banca mais erra é <strong>imutabilidade</strong> — alimentos são <em>mutáveis</em>.</p>\n<ul>\n<li><strong>Fiador no divórcio dos inquilinos:</strong> é comunicado e pode pedir <strong>exoneração em 30 dias</strong>; permanece responsável por <strong>120 dias</strong> após notificação do locador</li>\n<li><strong>Casos de exoneração do fiador:</strong> divórcio | dissolução união estável | prorrogação do contrato</li>\n<li><strong>Causas para exigir nova garantia (art. 40):</strong> morte, recuperação judicial, falência, interdição, ausência, insolvência, exoneração do fiador — <strong>NÃO inclui inadimplência do locatário</strong></li>\n<li><strong>Prazo para nova garantia:</strong> 30 dias após notificação</li>\n<li><strong>Purgação da mora:</strong> 15 dias para depósito; complemento em 10 dias se insuficiente; requisito: 24 meses sem uso do benefício</li>\n<li><strong>Caução:</strong> 6 a 12 vezes o valor do aluguel (antes era 12 a 24×)</li>\n<li><strong>Dispensa de multa:</strong> locatário transferido pelo empregador, com comunicação ao locador com <strong>30 dias de antecedência mínima</strong></li>\n</ul>"},{"id":"r4","titulo":"DIREITO DE FAMÍLIA — FILIAÇÃO E ALIMENTOS","prob":"alta","html":"<p>Alimentos são de ordem pública — não se renuncia, não se compensa, não se penhora. A característica que a banca mais erra é <strong>imutabilidade</strong> — alimentos são <em>mutáveis</em>.</p>\n<p>Bancos respondem <em>objetivamente</em> pelos danos causados, mesmo por atos de terceiros (fortuito interno). A Súmula 479 do STJ é o ponto mais cobrado.</p>\n<ul>\n<li><strong>Estado de filiação (art. 27 ECA):</strong> personalíssimo + indisponível + imprescritível; exercível contra pais <strong>ou seus herdeiros</strong></li>\n<li><strong>Filiação socioafetiva:</strong> ao lado da biológica e jurídica — STF RE 898.060/SC (multiparentalidade)</li>\n<li><strong>Presunção de paternidade na reprodução assistida (art. 1.597 CC):</strong> homóloga = presume paternidade <strong>mesmo se marido falecido</strong>; heteróloga = presume com autorização prévia</li>\n<li><strong>Alimentos:</strong> interesse <strong>público</strong> (não privado) — normas de ordem pública; irrenunciáveis, incompensáveis, impenhoráveis</li>\n<li><strong>Característica que NÃO é da obrigação alimentar:</strong> imutabilidade — é <strong>mutável</strong> (art. 1.699 CC)</li>\n<li><strong>Características da obrigação alimentar:</strong> transmissibilidade | divisibilidade | condicionalidade | reciprocidade</li>\n</ul>"},{"id":"r5","titulo":"RESPONSABILIDADE CIVIL DAS INSTITUIÇÕES BANCÁRIAS","prob":"alta","html":"<p>Bancos respondem <em>objetivamente</em> pelos danos causados, mesmo por atos de terceiros (fortuito interno). A Súmula 479 do STJ é o ponto mais cobrado.</p>\n<ul>\n<li><strong>Natureza:</strong> objetiva — CDC art. 14 + STJ Súmula 297</li>\n<li><strong>Súmula 297 STJ:</strong> CDC é aplicável às instituições financeiras</li>\n<li><strong>Súmula 479 STJ:</strong> \"As instituições financeiras respondem objetivamente pelos danos gerados por fortuito interno relativo a fraudes e delitos praticados por terceiros no âmbito de operações bancárias.\"</li>\n<li><strong>Excludentes:</strong> defeito inexiste | culpa exclusiva do consumidor/cliente</li>\n<li><strong>Cheque falso:</strong> banco responde; ressalva: culpa exclusiva ou concorrente do correntista (Súmula 28 STF)</li>\n</ul>"},{"id":"r6","titulo":"ALIENAÇÃO FIDUCIÁRIA DE BEM IMÓVEL (Lei 9.514/1997)","prob":"media","html":"<p>Na alienação fiduciária de imóvel o devedor mantém a posse direta mas transfere a propriedade resolúvel ao credor. No inadimplemento, o processo é extrajudicial e tem prazos precisos.</p>\n<ul>\n<li><strong>Conceito (art. 22):</strong> \"negócio jurídico pelo qual o devedor, ou fiduciante, com o escopo de garantia, contrata a transferência ao credor, ou fiduciário, da propriedade resolúvel de coisa imóvel\"</li>\n<li><strong>Registro:</strong> natureza constitutiva; desmembra posse em direta (fiduciante) e indireta (fiduciário)</li>\n<li><strong>Inadimplemento:</strong> intimação no CRI para purgação em <strong>15 dias</strong> → sem pagamento: consolidação da propriedade ao credor → leilão extrajudicial em <strong>30 dias</strong></li>\n<li><strong>Quitação:</strong> credor entrega termo em 30 dias; quitação cancela o registro; sem novo ato de disposição; sem fato gerador de tributo</li>\n</ul>"},{"id":"r7","titulo":"INVENTÁRIO EXTRAJUDICIAL","prob":"media","html":"<ul>\n<li>Realiza-se por <strong>escritura pública</strong> que <strong>dispensa homologação judicial</strong> (art. 610, §1º CPC)</li>\n</ul>"}],"top5":[],"questoes":[{"id":"Q1-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q1","tema":"Estrutura da Parte Geral do Código Civil","enun":"A Parte Geral do Código Civil é dividida em três livros. Esses três livros são:\n\na) Das Pessoas, Dos Bens e Dos Fatos Jurídicos.\nb) Dos Fatos Jurídicos, Dos Negócios Jurídicos e Das Condições.\nc) Das Obrigações, Dos Contratos e Do Direito de Família.\nd) Das Pessoas, Dos Bens e Do Direito das Sucessões.\ne) Das Pessoas, Do Direito Empresarial e Do Direito de Família.","gab":"A","gabLabel":"Das Pessoas, Dos Bens e Dos Fatos Jurídicos","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>A Parte Geral do CC/2002 divide-se em: Livro I (Das Pessoas — arts. 1º a 78), Livro II (Dos Bens — arts. 79 a 103) e Livro III (Dos Fatos Jurídicos — arts. 104 a 232). As demais alternativas inserem livros da Parte Especial (Obrigações, Contratos, Empresa, Família, Sucessões).","repete":false,"repeteRef":"","coment":[]},{"id":"Q2-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q2","tema":"Conceito de fato jurídico","enun":"Quanto aos fatos jurídicos, é correto afirmar que:\n\na) não têm relevância jurídica.\nb) não são disciplinados pela lei.\nc) são tratados na Parte Especial do Código Civil.\nd) são espécies de negócio jurídico.\ne) são eventos decorrentes da natureza ou da atividade humana capazes de criar, modificar, transferir ou extinguir direito.","gab":"E","gabLabel":"","html":"<p>Fato jurídico em sentido amplo é todo acontecimento natural ou humano que produz efeitos na esfera jurídica (cria, modifica, transfere, resguarda ou extingue relações jurídicas). Os negócios jurídicos são espécie de fato jurídico — não o contrário (D falsa). Tratados na Parte Geral, arts. 104 e ss. do CC (C falsa).</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q3-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q3","tema":"Negócio jurídico (questão pede o INCORRETO)","enun":"Quanto ao conceito de negócio jurídico, é <b>incorreto</b> afirmar que:\n\na) é ato decorrente da atividade humana.\nb) não decorre da atividade humana, mas da natureza.\nc) é ato de vontade destinado à produção de um resultado.\nd) é meio para a realização da autonomia privada.\ne) tem o escopo de criar, modificar, transferir ou extinguir direito.","gab":"B","gabLabel":"alternativa INCORRETA","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p><p>O negócio jurídico decorre necessariamente de conduta humana voluntária (autonomia privada).</p><p>Dizer que decorre da natureza seria confundi-lo com fato jurídico natural (em sentido estrito), como nascimento ou morte — esses não são negócios jurídicos.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q4-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q4","tema":"Fiador e divórcio dos inquilinos","enun":"Caso ocorra o divórcio dos inquilinos, é correto afirmar que o fiador:\n\na) é comunicado para optar pela sua exoneração.\nb) deve continuar garantindo a locação até o final do contrato.\nc) deve ser comunicado, mas não pode requerer a sua exoneração.\nd) deve obrigatoriamente ser substituído por outro fiador.\ne) deve ser obrigatoriamente substituído por seguro-fiança ou caução.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Conforme art. 12, § 2º da Lei de Locação (Lei nº 8.245/1991, com redação da Lei nº 12.112/2009): comunicado da sub-rogação, o fiador pode requerer exoneração no prazo de 30 dias do recebimento da comunicação, permanecendo responsável pelos 120 dias seguintes à notificação do locador.","repete":false,"repeteRef":"","coment":[]},{"id":"Q5-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q5","tema":"Causas de exigência de nova garantia (questão pede o que NÃO pode ser causa)","enun":"Assinale a alternativa que <b>não</b> pode ser considerada causa de exigência de nova garantia por parte do locador:\n\na) Morte do fiador.\nb) Falência do fiador.\nc) Recuperação judicial do fiador.\nd) Insolvência do fiador.\ne) Inadimplência por parte do locatário.","gab":"E","gabLabel":"","html":"<p>O art. 40 da Lei de Locação lista taxativamente as hipóteses que autorizam nova garantia: morte, falência, recuperação judicial, interdição, ausência ou insolvência do fiador. A inadimplência do locatário é infração contratual que enseja despejo por falta de pagamento, mas não autoriza exigir nova garantia.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q6-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q6","tema":"Reconhecimento do estado de filiação (ECA)","enun":"O reconhecimento do estado de filiação, de acordo com o Estatuto da Criança e do Adolescente, é direito:\n\na) personalíssimo, indisponível e imprescritível, podendo ser exercitado contra os pais ou seus herdeiros, sem qualquer restrição, observado o segredo de justiça.\nb) personalíssimo, indisponível e imprescritível, podendo ser exercitado somente contra os pais.\nc) disponível e prescritível.\nd) disponível e imprescritível, podendo ser exercitado contra os pais ou seus herdeiros, sem qualquer restrição, observado o segredo de justiça.\ne) indisponível e imprescritível, podendo ser exercitado somente contra herdeiros do suposto pai.","gab":"A","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 27 do ECA (Lei nº 8.069/1990): o reconhecimento do estado de filiação é personalíssimo, indisponível e imprescritível, podendo ser exercido contra os pais ou seus herdeiros (investigação post mortem), sem qualquer restrição, com segredo de justiça.","repete":false,"repeteRef":"","coment":[]},{"id":"Q7-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q7","tema":"Presunção de paternidade na reprodução assistida","enun":"Quanto à presunção de paternidade, em caso de reprodução humana assistida, é correto afirmar que:\n\na) não ocorre na reprodução humana assistida.\nb) somente ocorre na reprodução humana assistida homóloga.\nc) somente ocorre na reprodução humana assistida heteróloga.\nd) não ocorre em caso de embriões excedentários.\ne) ocorre na fecundação homóloga, mesmo que falecido o marido.","gab":"E","gabLabel":"","html":"<p>Art. 1.597, III do CC: presumem-se concebidos na constância do casamento os filhos havidos a qualquer tempo na reprodução assistida homóloga (material genético dos próprios cônjuges), mesmo que falecido o marido (post mortem). A reprodução heteróloga (inc. V) também presume paternidade, desde que com autorização prévia escrita do cônjuge.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q8-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q8","tema":"Tipos de filiação","enun":"Assinale a alternativa correta quanto à filiação.\n\na) Não pode decorrer da relação afetiva.\nb) Somente pode ser biológica.\nc) Somente pode ocorrer na reprodução humana assistida.\nd) Somente decorre da relação socioafetiva.\ne) Ao lado da filiação biológica e jurídica temos a relação paterno-filial decorrente do vínculo de afeto, afiliação social.","gab":"E","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p>Art. 1.593 do CC e STF (RE 898.060/SC, Tema 622): a filiação abrange a origem biológica, os vínculos jurídicos (adoção) e os vínculos socioafetivos. O STF consagrou a multiparentalidade — é possível ter dois pais ou duas mães no registro.","repete":false,"repeteRef":"","coment":[]},{"id":"Q9-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q9","tema":"Natureza dos alimentos","enun":"Quanto aos alimentos, assinale a alternativa correta.\n\na) São de interesse particular, não envolvem interesse público.\nb) Têm por objetivo somente proporcionar a compra de proteínas, frutas e legumes em favor do credor.\nc) São de interesse público.\nd) São tratados por normas de ordem privada.\ne) Os particulares podem convencionar em sentido contrário à lei em matéria de alimentos, pois o interesse é privado.","gab":"C","gabLabel":"","html":"<p style=\"color:var(--muted);font-size:14px;margin-bottom:4px\"><em>Raciocínio:</em></p><p>Arts. 1.694 e ss. do CC: embora regulados pelo Direito de Família, os alimentos envolvem normas de ordem pública (interesse público na subsistência digna).</p><p>Por isso são irrenunciáveis, incompensáveis e impenhoráveis — os particulares não podem convencionar em contrário.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"Q10-I","bloco":"UNIDADE I — QUESTIONÁRIO","num":"Q10","tema":"Características da obrigação alimentar (questão pede o que NÃO é característica)","enun":"Assinale a alternativa que <b>não</b> trata de uma das características da obrigação alimentar:\n\na) Transmissibilidade.\nb) Divisibilidade.\nc) Condicionalidade.\nd) Reciprocidade.\ne) Imutabilidade.","gab":"E","gabLabel":"Imutabilidade NÃO é característica","html":"<p>A obrigação alimentar é caracterizada pela <b>mutabilidade</b> (não imutabilidade): o valor pode ser alterado — majorado, reduzido ou extinto — a qualquer tempo se houver modificação na situação financeira do devedor ou na necessidade do credor (arts. 1.694, § 1º e 1.699 do CC). As demais — transmissibilidade, divisibilidade, condicionalidade e reciprocidade — são características reais da obrigação alimentar.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"AT1-I","bloco":"UNIDADE I — ATIVIDADE TELEAULA","num":"AT1","tema":"Responsabilidade civil dos bancos","enun":"Assinale a alternativa correta quanto à responsabilidade civil das instituições bancárias:\n\na) Trata-se de responsabilidade civil objetiva, aplicando-se o Código de Defesa do Consumidor.\nb) Não se aplica o Código de Defesa do Consumidor.\nc) A responsabilidade civil é subjetiva.\nd) A responsabilidade civil é sempre extracontratual.\ne) Não há como se aplicar a responsabilidade civil, somente a responsabilidade penal.","gab":"A","gabLabel":"","html":"<p>Art. 14 c/c art. 3º, § 2º do CDC (Lei nº 8.078/90) e Súmula 297 do STJ: as instituições financeiras prestam serviços sujeitos ao CDC e respondem objetivamente (independentemente de culpa) pelos defeitos na prestação de seus serviços. Não há que se falar em responsabilidade subjetiva ou exclusivamente penal.</p>","repete":false,"repeteRef":"","coment":[]},{"id":"AT2-I","bloco":"UNIDADE I — ATIVIDADE TELEAULA","num":"AT2","tema":"Inventário extrajudicial","enun":"Quanto ao inventário extrajudicial, assinale a alternativa correta:\n\na) Não depende de advogado.\nb) Pode ser feito somente no cartório de registro imobiliário.\nc) Deve ser feito quando os herdeiros são menores de idade.\nd) Não pode ser feito quando há consentimento entre os herdeiros.\ne) Realiza-se por escritura pública que dispensa homologação judicial.","gab":"E","gabLabel":"","html":"<p>Art. 610, § 1º do CPC (Lei nº 13.105/2015): a partilha extrajudicial amigável é lavrada por escritura pública em Tabelionato de Notas, dispensando homologação judicial. É exigida a assistência de advogado (não \"sem advogado\"), somente é cabível quando todos os herdeiros são maiores e capazes e há consenso.</p>","repete":false,"repeteRef":"","coment":[]}],"sinteses":[],"cards":[{"id":"c1","f":"Quais são os 3 livros da Parte Geral do Código Civil?","v":"<ul><li>Das Pessoas (arts. 1–78)</li><li>Dos Bens (arts. 79–103)</li><li>Dos Fatos Jurídicos (arts. 104–232)</li></ul>"},{"id":"c2","f":"O negócio jurídico decorre da natureza ou da atividade humana?","v":"Da atividade humana voluntária (autonomia privada). O que decorre da natureza é fato jurídico estrito."},{"id":"c3","f":"Quais os 3 planos do negócio jurídico?","v":"Existência → Validade → Eficácia."},{"id":"c4","f":"Quais os requisitos de validade do negócio jurídico (art. 104 CC)?","v":"Agente capaz + objeto lícito/possível/determinável + forma prescrita ou não defesa em lei."},{"id":"c5","f":"Quais são os acidentes do negócio jurídico?","v":"Condição, Termo e Encargo."},{"id":"c6","f":"No divórcio dos inquilinos, em quantos dias o fiador pode pedir exoneração?","v":"30 dias a contar do recebimento da comunicação. Permanece responsável por 120 dias após notificação do locador."},{"id":"c7","f":"A inadimplência do locatário autoriza o locador a exigir nova garantia?","v":"Não. O art. 40 da Lei 8.245/1991 é taxativo: morte, falência, recuperação judicial, interdição, ausência ou insolvência do fiador."},{"id":"c8","f":"Qual o prazo para purgação da mora na locação?","v":"15 dias para depósito judicial; se insufi
