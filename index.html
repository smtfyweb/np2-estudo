fixa na distribuição/registro (CPC, art. 43) (Itens 41, 85 e 139 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q8", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.8", "tema": "", "enun": "No tocante à competência, é correto afirmar:\n\nA) Se houver dois ou mais réus, com diferentes domicílios, a ação será proposta no foro de domicílio do autor.\nB) O foro de domicílio do inventariante é o competente para o inventário e o arrolamento do autor da herança, quando o óbito tenha ocorrido no estrangeiro.\nC) A ação fundada em direito pessoal e a ação fundada em direito real sobre bens móveis serão propostas, em regra, no foro do domicílio do réu; sendo incerto ou desconhecido esse domicílio, ele será demandado onde for encontrado ou no foro do domicílio do autor.\nD) Nas ações fundadas em direito real sobre imóveis é competente o foro do domicílio do proprietário do bem, ou, discricionariamente ao autor, no foro de domicílio ou de eleição, irrestritamente.\nE) Quando o réu não tiver domicílio nem residência no Brasil, a ação será proposta na Capital do Estado de domicílio do autor.", "gab": "C", "gabLabel": "", "html": "A alternativa C reproduz com precisão a regra geral de competência contida no art. 46, <i>caput</i> e § 2º, do CPC/15. Havendo pluralidade de réus com diferentes domicílios, a demanda pode ser proposta no foro de qualquer deles, à escolha do autor (CPC, art. 46, § 4º) (Itens 55, 59 e 63 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q9", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.9", "tema": "", "enun": "Em relação à competência é correto afirmar:\n\nA) A ação em que o incapaz for réu se processará no foro do domicílio do autor.\nB) As ações em que o ausente for réu correm no foro de seu último domicílio, que é também o competente para a arrecadação, o inventário, a partilha e o cumprimento de disposição testamentárias.\nC) Nas ações fundadas em direito real sobre imóveis, é competente o foro do domicílio do réu, como regra.\nD) Tendo mais de um domicílio, o réu será demandado no foro mais próximo ao domicílio do autor.\nE) Quando o réu não tiver domicílio nem residência no Brasil, a ação deve ser proposta necessariamente no foro da Capital do Estado em que reside o autor.", "gab": "B", "gabLabel": "", "html": "Disposição literal do art. 49 do CPC/15: \"A ação em que o ausente for réu será proposta no foro de seu último domicílio, também competente para a arrecadação, o inventário, a partilha e o cumprimento de disposições testamentárias.\" (Itens 83 e 143 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q10", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.10", "tema": "", "enun": "A competência:\n\nA) é inderrogável por convenção das partes, seja relativa ou absoluta.\nB) é sempre do foro do fornecedor, nas ações de responsabilidade civil do fornecedor.\nC) se relativa, pode ser arguida em qualquer fase processual, de acordo com o Código de Processo Civil.\nD) é alterada pela conexão, mesmo que um dos processos já tenha sido sentenciado.\nE) quando alterada em razão da matéria, acarreta a nulidade dos atos decisórios.", "gab": "E", "gabLabel": "", "html": "A competência em razão da matéria tem natureza absoluta e cogente (CPC, art. 62). A incompetência absoluta invalida os atos decisórios proferidos pelo juízo incompetente (cabendo ao juízo competente ratificá-los ou anulá-los - CPC, art. 64, § 4º). Além disso, não há reunião de processos por conexão se um deles já houver sido sentenciado (CPC, art. 55, § 1º; Súmula 235 do STJ) (Itens 33, 171 e 221 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q11", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.11", "tema": "", "enun": "No que se refere à competência:\n\nA) a territorial é absoluta e só levanta-se por meio de preliminar na defesa apresentada pelo réu.\nB) é ela determinada no momento em que a ação é proposta, como regra, mostrando-se irrelevantes as modificações do estado de fato ou de direito ocorridas posteriormente.\nC) cabe à autoridade judiciária estrangeira proceder a inventário e partilha de bens, mesmo que situados no Brasil, se o autor da herança for estrangeiro e houver residido fora do território nacional.\nD) a ação fundada em direito pessoal e a ação fundada em direito real sobre bens móveis serão, em regra, propostas no foro do domicílio do autor.\nE) sendo incerto ou desconhecido o domicílio do réu, será ele demandado na capital do Estado da federação em que houvera residido com endereço certo.", "gab": "B", "gabLabel": "", "html": "Reitera-se a aplicação da regra geral da <i>perpetuatio jurisdictionis</i> estatuída no art. 43 do CPC/15. A competência territorial é em regra relativa (salvo art. 47, § 1º) e a partilha de imóveis nacionais submete-se à jurisdição exclusiva brasileira (CPC, art. 23, II) (Itens 39, 41 e 43 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q12", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.12", "tema": "", "enun": "Sr. Z promove ação de cobrança em face de Srª Q, postulando a quantia de cem mil reais. O processo é distribuído para a Vara da Comarca X, domicílio do credor. Srª Q não alegou a incompetência relativa em preliminar na contestação. Nesse caso descrito, nos termos das regras processuais, ocorre a denominada:\n\nA) prorrogação de competência.\nB) vinculação de competência.\nC) extinção de competência.\nD) declaração de competência.\nE) suspensão de competência.", "gab": "A", "gabLabel": "", "html": "A ação de cobrança possui competência territorial relativa (foro do domicílio do réu - CPC, art. 46). Não alegada a incompetência relativa pelo réu em preliminar de contestação (CPC, art. 64), opera-se a preclusão e o fenômeno da prorrogação da competência, tornando o juízo originariamente incompetente pleno e competente para o julgamento da causa (CPC, art. 65; Item 223 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q13", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.13", "tema": "", "enun": "Caio, domiciliado em São Paulo, ajuizou ação de cobrança em face de Marcos, domiciliado em Santos, perante a 1ª Vara Cível da Comarca de São Paulo. O fundamento para a cobrança é um contrato escrito, que não tem força de título executivo extrajudicial, e não há cláusula de eleição de foro. Nessa hipótese:\n\nA) o demandado deverá alegar a incompetência absoluta do juízo da 1ª Vara Cível da Comarca de São Paulo por meio de preliminar de mérito na contestação.\nB) o demandado deverá alegar a incompetência relativa do juízo da 1ª Vara Cível da Comarca de São Paulo por meio de preliminar de mérito na contestação.\nC) o demandado poderá alegar a incompetência relativa do juízo da 1ª Vara Cível da Comarca de São Paulo em qualquer fase processual.\nD) o juiz deverá decidir de ofício sobre a incompetência relativa.\nE) o demandado poderá alegar a incompetência relativa do juízo da 1ª Vara Cível da Comarca de São Paulo no momento da interposição do recurso de apelação.", "gab": "B", "gabLabel": "", "html": "Trata-se de ação fundada em direito pessoal cujo foro competente é o domicílio do réu (Santos/SP, art. 46 do CPC/15). Proposta a ação no domicílio do autor (São Paulo/SP), a incompetência territorial é relativa, devendo o réu alegá-la em preliminar na contestação (CPC, art. 64, <i>caput</i>, c/c art. 337, II), sob pena de prorrogação (Itens 35, 55 e 213 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q14", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.14", "tema": "", "enun": "Pedro, domiciliado em São Paulo, possui um sítio em Presidente Prudente e periodicamente viaja para o local. Em uma de suas últimas visitas ao local constatou que o seu vizinho, Marcos, que é domiciliado em Campinas, invadiu parte do seu terreno e construiu um barraco. Inconformado, Pedro contratou um advogado para ajuizar ação de reintegração de posse. Nessa hipótese:\n\nA) a ação poderá ser proposta no foro de domicílio do demandado (Campinas).\nB) a ação poderá ser proposta tanto no foro de domicílio do demandante (São Paulo), como no domicílio do demandado (Campinas).\nC) a ação poderá ser proposta no foro de domicílio do demandante (São Paulo).\nD) a ação deverá ser proposta no foro onde o imóvel se encontra (Presidente Prudente).\nE) a ação poderá ser proposta tanto no foro onde o imóvel se encontra (Presidente Prudente), como no domicílio do demandado (Campinas).", "gab": "D", "gabLabel": "", "html": "Tratando-se de ação possessória imobiliária (<i>reintegração de posse</i>), incide a regra peremptória do art. 47, § 2º, do CPC/15: \"A ação possessória imobiliária será proposta no foro de situação da coisa, cujo juízo tem competência absoluta.\" Portanto, a ação deve tramitar obrigatoriamente na Comarca de Presidente Prudente/SP (<i>forum rei sitae</i>) (Itens 67, 71 e 139 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q15", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.15", "tema": "", "enun": "Marta ajuizou ação de alimentos em face de seu marido João perante a 1ª Vara da Família da Comarca do Rio de Janeiro. João, por sua vez, ajuizou ação de divórcio perante a 5ª Vara da Família da Comarca do Rio de Janeiro. Nessa ação de divórcio, João pede a dissolução do casamento, a fixação de alimentos para a mulher e a partilha de bens. Sabendo-se que a ação de divórcio foi ajuizada em primeiro lugar, pode-se dizer que:\n\nA) como é hipótese de continência, a ação contida (ação de alimentos) será extinta sem resolução de mérito.\nB) como é hipótese de continência, as duas ações serão reunidas, sendo o juízo prevento o da 5ª Vara da Família da Comarca do Rio de Janeiro.\nC) como é hipótese de continência, as duas ações serão reunidas, sendo o juízo prevento o da 1ª Vara da Família da Comarca do Rio de Janeiro.\nD) como é hipótese de conexão, as duas ações serão reunidas, sendo o juízo prevento o da 5ª Vara da Família da Comarca do Rio de Janeiro.\nE) como é hipótese de conexão, as duas ações serão reunidas, sendo o juízo prevento o da 1ª Vara da Família da Comarca do Rio de Janeiro.", "gab": "A", "gabLabel": "", "html": "Verifica-se a continência (CPC, art. 56) quando houver identidade de partes e causa de pedir, mas o pedido de uma das ações (divórcio c/c alimentos e partilha), por ser mais amplo, abrange o da outra (ação isolada de alimentos). Proposta a ação continente (<i>divórcio</i>) em primeiro lugar, a ação contida (<i>alimentos</i>) ajuizada posteriormente será extinta sem resolução de mérito por perda superveniente de objeto/litispendência parcial, nos termos do art. 57 do CPC/15 (Itens 181, 183 e 209 do Módu...", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q16", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.16", "tema": "", "enun": "Miranda, domiciliado em São Paulo, ajuizou ação de reparação de perdas e danos em face da União perante a 1ª Vara Cível da Comarca de São Paulo. Nessa hipótese:\n\nA) a incompetência da 1ª Vara Cível é absoluta em razão da matéria.\nB) a incompetência da 1ª Vara Cível é relativa em razão da matéria.\nC) a incompetência da 1ª Vara Cível é absoluta em razão da função.\nD) a incompetência da 1ª Vara Cível é absoluta em razão do território.\nE) a incompetência da 1ª Vara Cível é absoluta em razão da pessoa.", "gab": "E", "gabLabel": "", "html": "A competência da Justiça Federal para processar e julgar causas em que a União figure na qualidade de ré é fixada em razão da pessoa (<i>ratione personae</i>), fundamentada no art. 109, I, da Constituição Federal. Trata-se de competência absoluta e inderrogável, tornando a Vara Cível Estadual absolutamente incompetente por razão da pessoa envolvida (Itens 26, 33 e 45 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q17", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.17", "tema": "", "enun": "Marcos, domiciliado em São Caetano do Sul na região metropolitana de São Paulo, celebrou contrato de empréstimo com a Empresa ABC Ltda. que tem filial em São Caetano do Sul e a sua matriz fica em São Paulo. No contrato havia uma cláusula elegendo o foro da Capital de São Paulo para resolver as questões do contrato. Pode-se dizer que:\n\nA) a eleição de foro produz efeito, uma vez que consta no instrumento escrito.\nB) a eleição de foro não obriga os herdeiros e sucessores das partes.\nC) a eleição de foro, nessa hipótese é abusiva e deve ser declarada pelo juiz.\nD) a eleição de foro não é cabível em razão do território e do valor da causa.\nE) nenhuma das alternativas anteriores está correta.", "gab": "A", "gabLabel": "", "html": "Conforme o art. 63, § 1º, do CPC/15, a eleição de foro produz plenos efeitos jurídicos quando constar de instrumento escrito e aludir expressamente a determinado negócio jurídico. Inexistindo abusividade flagrante ou prejuízo desproporcional ao direito de defesa (dada a contiguidade geográfica entre os municípios), a cláusula contratual é válida e vincula os contratantes (Itens 35, 195 e 197 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M8-Q18", "bloco": "MÓDULO 8 — Competência — Conceito, Critérios, Cooperação Internacional e Nacional", "num": "Ex.18", "tema": "", "enun": "Carlos, domiciliado no Rio de Janeiro, ajuizou ação de direito pessoal em face de Wilson, domiciliado em Porto Alegre, perante a 7ª Vara Cível da Comarca do Rio de Janeiro. Wilson foi citado para apresentar contestação. Assinale a alternativa correta:\n\nA) Wilson poderá alegar a incompetência do juízo da 7ª Vara Cível a qualquer tempo, antes do pronunciamento da sentença.\nB) Wilson poderá alegar a incompetência do juízo da 7ª Vara Cível até a instrução processual.\nC) Wilson poderá alegar a incompetência do juízo da 7ª Vara Cível a qualquer tempo, seja na primeira instância, seja na segunda instância.\nD) Wilson poderá alegar a incompetência do juízo da 7ª Vara Cível até a fase de saneamento do processo.\nE) nenhuma das alternativas anteriores está correta.", "gab": "E", "gabLabel": "", "html": "Tratando-se de ação de direito pessoal, a competência territorial é relativa (CPC, art. 46). Por conseguinte, incumbe ao réu argui-la obrigatoriamente como preliminar de contestação (CPC, art. 64, <i>caput</i>, c/c art. 337, II), sob pena de preclusão e prorrogação da competência (CPC, art. 65). Nenhuma das alternativas de A a D indica o prazo correto da defesa (contestação), tornando correta a alternativa E (Itens 35, 213 e 223 do Módulo 8).", "repete": false, "repeteRef": "", "coment": []}], "sinteses": [], "cards": [{"id": "c1", "f": "Quais são as três formas de autocomposição?", "v": "Desistência (renúncia à pretensão) | Submissão (renúncia à resistência) | Transação (concessões recíprocas)"}, {"id": "c2", "f": "Qual a diferença entre conciliação e mediação?", "v": "Conciliação → sem vínculo anterior, conciliador PODE sugerir; Mediação → com vínculo anterior, mediador NÃO sugere, apenas facilita o diálogo"}, {"id": "c3", "f": "Para quais direitos é cabível a arbitragem?", "v": "Apenas direitos patrimoniais DISPONÍVEIS (Lei 9.307/96, art. 1º)"}, {"id": "c4", "f": "Cláusula compromissória × compromisso arbitral: qual a diferença?", "v": "Cláusula compromissória = convenção prévia para litígios FUTUROS (art. 4º Lei 9.307/96) | Compromisso arbitral = submete litígio JÁ EXISTENTE (art. 9º)"}, {"id": "c5", "f": "A autotutela é legalmente reconhecida?", "v": "NÃO — é crime (art. 345 CP). Exceções legais: legítima defesa da posse (art. 1.210, §1º CC) e legítima defesa/estado de necessidade (art. 23 CP)"}, {"id": "c6", "f": "Competência para legislar sobre direito processual: privativa ou concorrente?", "v": "PRIVATIVA da União (art. 22, I, CF) para direito processual; CONCORRENTE para procedimentos em matéria processual (art. 24, XI, CF)"}, {"id": "c7", "f": "Medidas provisórias podem versar sobre direito processual civil?", "v": "NÃO — vedação expressa (art. 62, §1º, I, \"b\", CF). Também vedado: penal e processual penal"}, {"id": "c8", "f": "Qual teoria de eficácia temporal a lei processual adota (art. 14 CPC)?", "v": "Teoria do isolamento dos atos processuais — lei nova aplica imediatamente, respeitados os atos já praticados"}, {"id": "c9", "f": "Quais são os limites constitucionais à retroatividade da lei processual?", "v": "Tríplice garantia (art. 5º, XXXVI, CF): direito adquirido + ato jurídico perfeito + coisa julgada"}, {"id": "c10", "f": "Vacatio legis — prazo padrão e marco inicial?", "v": "45 dias contados da PUBLICAÇÃO (não da promulgação) — art. 1º LINDB; 3 meses no exterior"}, {"id": "c11", "f": "Ordem de integração de lacunas (art. 4º LINDB)?", "v": "Analogia → Costumes → Princípios gerais de direito (equidade NÃO está no rol literal)"}, {"id": "c12", "f": "Qual é o \"super princípio\" do processo civil?", "v": "Devido processo legal (art. 5º, LIV, CF) — gênero do qual contraditório, ampla defesa, juiz natural etc. são espécies"}, {"id": "c13", "f": "O que proíbe o princípio do juiz natural?", "v": "Tribunal de exceção (art. 5º, XXXVII, CF); garante juiz pré-constituído e imparcial (art. 5º, LIII, CF)"}, {"id": "c14", "f": "Qual característica da jurisdição justifica a imparcialidade do juiz?", "v": "Característica SUBSTITUTIVA — o Estado substitui as partes na resolução do conflito"}, {"id": "c15", "f": "O que é jurisdição voluntária?", "v": "Administração de interesses privados sem lide; não há partes, mas interessados; ex.: inventário consensual, interdição"}, {"id": "c16", "f": "Qual teoria da ação o CPC/2015 adota?", "v": "Teoria da ASSERÇÃO — condições da ação são analisadas com base nas afirmações da petição inicial; legitimidade e interesse = pressupostos processuais; possibilidade jurídica = mérito"}, {"id": "c17", "f": "Competência absoluta × relativa: principal diferença prática?", "v": "Absoluta = interesse público, pode ser arguida a qualquer tempo e de ofício, NÃO prorroga | Relativa = interesse privado, deve ser arguida na contestação, PRORROGA se não arguida; admite foro de eleição"}, {"id": "c18", "f": "O que é perpetuação da competência (perpetuatio jurisdictionis)?", "v": "Competência fixada no momento do registro/distribuição da petição inicial (art. 43 CPC). Exceções: supressão do órgão ou alteração de competência ABSOLUTA"}, {"id": "c19", "f": "Ação real sobre imóvel: qual o foro competente e que tipo de competência é?", "v": "Foro da situação da coisa (art. 47 CPC); para ação possessória imobiliária é competência ABSOLUTA (art. 47, §2º)"}, {"id": "c20", "f": "Juizados Especiais Estaduais × Federais: competência relativa ou absoluta?", "v": "Estaduais = relativa (opção do demandante até 40 SM) | Federais = ABSOLUTA (art. 3º, §3º, Lei 10.259/01)"}], "cobertura": ["São 146 questões (8 módulos), com enunciado completo, alternativas e gabarito fundamentado.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "revisao", "ref": "r7", "titulo": "Ponto em que a doutrina diverge", "texto": "O material trata legitimidade e interesse como “pressupostos processuais” e diz que o CPC abandonou a teoria eclética. Muitos autores veem legitimidade e interesse como requisitos de admissibilidade do mérito (art. 17 e art. 485, VI, do CPC), e a possibilidade jurídica do pedido deixou de ser condição. Em prova objetiva, siga a formulação do AVA."}, {"esc": "card", "ref": "c16", "titulo": "Ponto em que a doutrina diverge", "texto": "Mesmo ponto do Módulo 7: classificar legitimidade e interesse como “pressupostos processuais” é uma leitura do material. Siga o AVA."}, {"esc": "revisao", "ref": "r8", "titulo": "Artigo citado fora do lugar", "texto": "Na lista de competência absoluta aparece “territorial art. 47, §1º”. O §1º trata da opção do autor em certos casos. A competência absoluta da possessória imobiliária está no §2º, como no flashcard."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["883X"]={"cod": "883X", "revisao": [{"id": "r1", "titulo": "Princípios da Administração (LIMPE)", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Sigla</th>\n<th>Princípio</th>\n<th>Essência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L</strong></td>\n<td>Legalidade</td>\n<td>Adm. só faz o que a lei AUTORIZA (≠ particular: faz o que a lei não proíbe)</td>\n</tr>\n<tr>\n<td><strong>I</strong></td>\n<td>Impessoalidade</td>\n<td>Igualdade, sem favoritismo; atos imputados ao Estado, não ao agente (Teoria do Órgão)</td>\n</tr>\n<tr>\n<td><strong>M</strong></td>\n<td>Moralidade</td>\n<td>Agir com ética, boa-fé, lealdade, probidade</td>\n</tr>\n<tr>\n<td><strong>P</strong></td>\n<td>Publicidade</td>\n<td>Divulgação oficial obrigatória; regra é transparência, exceção é sigilo (segurança / intimidade)</td>\n</tr>\n<tr>\n<td><strong>E</strong></td>\n<td>Eficiência</td>\n<td>Rapidez + perfeição + rendimento (acrescido pela EC 19/98)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> Razoabilidade e proporcionalidade NÃO constam expressamente no art. 37 — são princípios implícitos.</p>\n<p><strong>Supraprincípios (Celso A. Bandeira de Mello):</strong> supremacia do interesse público + indisponibilidade do interesse público.</p>\n<p><strong>Princípios infraconstitucionais:</strong> presunção de legitimidade, continuidade, autotutela (Súm. 473 STF), motivação, razoabilidade, hierarquia.</p>"}, {"id": "r2", "titulo": "Poderes administrativos", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Poder</th>\n<th>Finalidade</th>\n<th>Espécies/Destaque</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Normativo</strong></td>\n<td>Atos gerais e abstratos (regulamento, portaria, resolução)</td>\n<td>Regulamento executivo (regra no BR) vs. autônomo (EC 32/2001, art. 84, VI)</td>\n</tr>\n<tr>\n<td><strong>Hierárquico</strong></td>\n<td>Subordinação entre órgãos da mesma PJ</td>\n<td>Delegar, avocar, punir, rever atos; NÃO existe no Judiciário/Legislativo em suas funções típicas</td>\n</tr>\n<tr>\n<td><strong>Disciplinar</strong></td>\n<td>Punir servidores e contratados</td>\n<td>Decorre do hierárquico; omissão = condescendência criminosa (CP, art. 320)</td>\n</tr>\n<tr>\n<td><strong>Polícia</strong></td>\n<td>Limitar liberdade/propriedade em prol do coletivo</td>\n<td>Atributos: <strong>discricionariedade, autoexecutoriedade, coercibilidade</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Atributos do Poder de Polícia:</strong></p>\n<ul>\n<li>Discricionariedade (regra), mas há atos vinculados (ex: licença para construir)</li>\n<li>Autoexecutoriedade = exigibilidade (meios indiretos) + executoriedade (meios diretos)</li>\n<li>Multa é exigível mas NÃO é executória (cobrança depende de execução fiscal)</li>\n</ul>\n<p><strong>Licença vs. Autorização:</strong></p>\n<ul>\n<li>Licença = vinculado, gera direito subjetivo</li>\n<li>Autorização = discricionário, atende interesse do particular</li>\n</ul>"}, {"id": "r3", "titulo": "Atos administrativos", "prob": "alta", "html": "<p><strong>Requisitos/Elementos — FF.COM:</strong></p>\n<ul>\n<li><strong>F</strong>orma (regra: escrita)</li>\n<li><strong>F</strong>inalidade (interesse público; no sentido restrito: fim especificado na lei)</li>\n<li><strong>C</strong>ompetência/Sujeito (vinculado, irrenunciável, imprescritível, improrrogável)</li>\n<li><strong>O</strong>bjeto (conteúdo; pode ser vinculado ou discricionário)</li>\n<li><strong>M</strong>otivo (pressuposto de fato e direito; ≠ motivação = exposição dos motivos)</li>\n</ul>\n<p><strong>Atributos — PAIT:</strong></p>\n<ul>\n<li>Presunção de legitimidade (juris tantum — relativa; inverte ônus da prova)</li>\n<li>Autoexecutoriedade</li>\n<li>Imperatividade/coercibilidade</li>\n<li>Tipicidade</li>\n</ul>\n<p><strong>Discricionariedade reside normalmente em:</strong> motivo + objeto.</p>\n<p><strong>Teoria dos Motivos Determinantes:</strong> se a Adm. indicou motivo (mesmo desnecessário), fica vinculada a ele. Se o motivo for falso/inexistente → ato nulo.</p>\n<p><strong>Extinção dos atos:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Revogação</th>\n<th>Anulação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Causa</td>\n<td>Inconveniência/inoportunidade</td>\n<td>Ilegalidade</td>\n</tr>\n<tr>\n<td>Efeito</td>\n<td>ex nunc (a partir de agora)</td>\n<td>ex tunc (retroativo)</td>\n</tr>\n<tr>\n<td>Quem</td>\n<td>Só Administração</td>\n<td>Adm. + Judiciário</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>NÃO podem ser revogados:</strong> atos vinculados, atos que esgotaram efeitos, atos que geraram direito adquirido.</p>"}, {"id": "r4", "titulo": "Organização administrativa", "prob": "alta", "html": "<p><strong>Concentração/Desconcentração</strong> — dentro da mesma PJ (hierarquia):</p>\n<ul>\n<li>Desconcentração: distribuição interna (Ministérios, Secretarias, Delegacias)</li>\n</ul>\n<p><strong>Centralização/Descentralização</strong> — entre PJs distintas:</p>\n<ul>\n<li>Descentralização por serviço (outorga): lei cria entidade com titularidade do serviço</li>\n<li>Adm. Indireta: Autarquia, Fundação, Empresa Pública, Sociedade de Economia Mista</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Entidade</th>\n<th>Natureza</th>\n<th>Criação</th>\n<th>Capital</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Autarquia</td>\n<td>Direito Público</td>\n<td>Lei específica</td>\n<td>Público</td>\n</tr>\n<tr>\n<td>Fundação pública</td>\n<td>Público ou Privado</td>\n<td>Lei específica (dir. púb.) / autorização (dir. priv.)</td>\n<td>Público</td>\n</tr>\n<tr>\n<td>Empresa Pública</td>\n<td>Direito Privado</td>\n<td>Autorização legislativa</td>\n<td>100% público; qualquer forma</td>\n</tr>\n<tr>\n<td>Soc. Economia Mista</td>\n<td>Direito Privado</td>\n<td>Autorização legislativa</td>\n<td>Misto; só S/A</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Diferenças EP x SEM:</strong> forma jurídica + capital + foro processual (EP federal = JF; SEM federal = JE).</p>\n<p><strong>Agência Reguladora:</strong> autarquia de regime especial — dirigentes com <strong>mandato fixo + estabilidade</strong> (não exoneração ad nutum).</p>\n<p><strong>Agência Executiva:</strong> qualificação dada a autarquia/fundação que celebra contrato de gestão — não é nova entidade (ex.: INMETRO).</p>\n<p><strong>OAB:</strong> entidade sui generis — NÃO é autarquia; não precisa de concurso público.</p>\n<p><strong>Terceiro Setor:</strong> direito privado, sem fins lucrativos, fora da Adm.</p>\n<ul>\n<li>Sistema S (SESI, SENAI, SEBRAE): parafiscalidade + Tribunal de Contas</li>\n<li>OS (Lei 9.637/98): contrato de gestão; saúde, ensino, pesquisa, meio ambiente, cultura</li>\n<li>OSCIP (Lei 9.790/99): termo de parceria</li>\n</ul>"}, {"id": "r5", "titulo": "Licitação (Lei 14.133/2021)", "prob": "media", "html": "<p><strong>Modalidades (nova lei):</strong> pregão, concorrência, concurso, leilão, diálogo competitivo.\n(Extintas: tomada de preços e convite)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Modalidade</th>\n<th>Objeto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pregão</td>\n<td>Bens e serviços comuns (menor preço ou maior desconto)</td>\n</tr>\n<tr>\n<td>Concorrência</td>\n<td>Bens/serviços especiais + obras de engenharia, qualquer valor</td>\n</tr>\n<tr>\n<td>Concurso</td>\n<td>Trabalho técnico/científico/artístico; critério: melhor técnica</td>\n</tr>\n<tr>\n<td>Leilão</td>\n<td>Alienação de bens imóveis ou móveis inservíveis (maior lance)</td>\n</tr>\n<tr>\n<td>Diálogo Competitivo</td>\n<td>Inovação tecnológica; necessidade não atendida pelo mercado</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Contratação direta:</strong></p>\n<ul>\n<li><strong>Dispensa:</strong> viabilidade de competição, mas lei autoriza não licitar (ex.: guerra, emergência, valores baixos R$100k obras / R$50k outros)</li>\n<li><strong>Inexigibilidade:</strong> inviabilidade de competição (fornecedor exclusivo, artista consagrado, serviço técnico especializado de notória especialização — exceto publicidade)</li>\n</ul>\n<p><strong>Princípio da vinculação ao edital:</strong> edital é a \"lei interna da licitação\" — nem a Adm. pode dele se afastar.</p>"}, {"id": "r6", "titulo": "Contratos administrativos", "prob": "media", "html": "<p><strong>Cláusulas exorbitantes (art. 104, Lei 14.133/21):</strong></p>\n<ol>\n<li>Modificação unilateral</li>\n<li>Extinção unilateral</li>\n<li>Fiscalização</li>\n<li>Aplicação de sanções</li>\n<li>Ocupação provisória de bens</li>\n</ol>\n<p><strong>Equilíbrio econômico-financeiro:</strong> direito do contratado (art. 37, XXI, CF) — rebus sic stantibus / teoria da imprevisão.</p>\n<p><strong>Fato do Príncipe:</strong> medida geral do Estado que onera indiretamente o contrato.\n<strong>Fato da Administração:</strong> ação/omissão direta do contratante que prejudica a execução.</p>\n<p><strong>Acréscimos/supressões obrigatórios:</strong> até 25% (obras/serviços/compras) e 50% (reforma de edifícios/equipamentos).</p>\n<p><strong>Rescisão:</strong> unilateral (Adm.), consensual ou judicial/arbitral.</p>"}, {"id": "r7", "titulo": "Servidor público", "prob": "alta", "html": "<p><strong>Classificação de agentes públicos:</strong></p>\n<ul>\n<li>Agentes políticos (chefes do Executivo, parlamentares, magistrados, MP)</li>\n<li>Servidores estatutários (cargo público, regime estatutário — Lei 8.112/90)</li>\n<li>Empregados públicos (emprego público, CLT — EP e SEM)</li>\n<li>Contratados temporários (art. 37, IX CF — sem concurso, processo seletivo simplificado)</li>\n<li>Particulares em colaboração (mesários = honoríficos; concessionários = delegados; gestores de negócio)</li>\n</ul>\n<p><strong>Cargo em comissão x Função de confiança:</strong></p>\n<ul>\n<li>Comissão: livre nomeação E exoneração (ad nutum), sem concurso</li>\n<li>Função de confiança: SOMENTE para servidores de carreira</li>\n</ul>\n<p><strong>Estabilidade:</strong> 3 anos de estágio probatório. Perde o cargo por: sentença judicial, PAD, avaliação de desempenho ou redução de despesas (LRF).</p>\n<p><strong>Vitaliciedade (magistrados, MP, TCU):</strong> estágio de 2 anos; perde só por sentença judicial.</p>\n<p><strong>Aposentadoria (art. 40, CF):</strong></p>\n<ul>\n<li>Invalidez permanente (proventos proporcionais, salvo acidente/doença grave)</li>\n<li>Compulsória: 75 anos</li>\n<li>Voluntária: requisitos de tempo/contribuição</li>\n</ul>\n<p><strong>Acumulação lícita (art. 37, XVI, CF):</strong></p>\n<ul>\n<li>2 cargos de professor</li>\n<li>1 professor + 1 técnico/científico</li>\n<li>2 cargos de profissional de saúde com profissão regulamentada</li>\n</ul>\n<p><strong>Concurso público:</strong> validade até 2 anos, prorrogável 1x por igual período. NÃO existe concurso só de títulos.</p>\n<p><strong>Responsabilidade do servidor:</strong> civil + penal + administrativa (independentes). Absolvição penal por inexistência do fato ou negativa de autoria afasta responsabilidade adm. e civil.</p>"}], "top5": ["<b>Princípios LIMPE</b> — art. 37, distinção implícito/explícito, aplicação prática", "<b>Atos administrativos</b> — requisitos FF.COM, atributos PAIT, revogação x anulação, teoria dos motivos determinantes", "<b>Poderes administrativos</b> — poder de polícia (atributos), disciplinar x hierárquico, normativo", "<b>Organização administrativa</b> — diferenças EP x SEM, agências reguladoras, desconcentração x descentralização", "<b>Servidor público</b> — estabilidade, acumulação de cargos, cargo em comissão x função de confiança, tipos de aposentadoria"], "questoes": [{"id": "M1-Q1", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.1", "tema": "", "enun": "Acerca do sistema administrativo brasileiro, é correto afirmar que:\n\nA) Adota-se o sistema de jurisdição mediante o contencioso administrativo, excludente da atuação judicial.\nB) O sistema de jurisdição dúplice, vigente no Brasil, permite a simultaneidade da atuação do contencioso administrativo e atuação judicial.\nC) Embora existente decisão administrativa sobre determinado tema, esta é passível de apreciação judicial.\nD) As decisões administrativas não estão sujeitas a reexame recursal, devendo ser revistas pela via judicial.\nE) Baseia-se no sistema administrativo jurisdicional, em vigor no Brasil, no sistema francês.", "gab": "C", "gabLabel": "", "html": "O Brasil adota o Sistema de Jurisdição Única (Sistema Inglês), consagrado pelo art. 5º, XXXV, da CF/88 (\"a lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito\"). Decisões administrativas não possuem força de coisa julgada material e podem ser submetidas a controle judicial a qualquer tempo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q2", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.2", "tema": "", "enun": "A primordial fonte formal do Direito Administrativo no Brasil é:\n\nA) a lei\nB) a doutrina\nC) a jurisprudência\nD) os costumes\nE) o vade mecum", "gab": "A", "gabLabel": "", "html": "Sob o Princípio da Legalidade (CF/88, art. 37, caput, e art. 5º, II), a <b>lei</b> é a fonte primária por excelência, sendo a única capaz de criar obrigações de fazer ou não fazer. Doutrina, jurisprudência e costumes são fontes secundárias/subsidiárias.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q3", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.3", "tema": "", "enun": "Em seu sentido subjetivo, o estudo da Administração Pública abrange:\n\nA) a atividade administrativa;\nB) o poder de polícia administrativa;\nC) as entidades e os órgãos que exercem a função administrativa;\nD) o serviço público;\nE) a intervenção do Estado nas atividades privadas.", "gab": "C", "gabLabel": "", "html": "A Administração Pública em sentido <b>subjetivo/formal/orgânico</b> compreende os sujeitos: entidades, órgãos e agentes públicos que desempenham a função administrativa. O sentido <b>objetivo/material</b> abrange a atividade em si (polícia, serviço público, fomento e intervenção).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q4", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.4", "tema": "", "enun": "O Direito Administrativo destaca que o Estado é constituído por três elementos originários e indissociáveis, que são:\n\nA) Povo, nação e governabilidade.\nB) Povo, território e Estado.\nC) Povo, território e governo soberano.\nD) Povo, soberania e Estado.\nE) governo soberano, organização do Estado e atos administrativos.", "gab": "C", "gabLabel": "", "html": "O Estado é a pessoa jurídica de direito público territorial soberana constituída por três elementos indissociáveis: <b>Povo</b> (elemento humano), <b>Território</b> (base física) e <b>Governo Soberano</b> (elemento condutor/de poder).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q5", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.5", "tema": "", "enun": "Se o Direito Administrativo for conceituado como:\nI. O sistema dos princípios jurídicos que regulam a atividade do Estado para o cumprimento de seus fins.\nII. O conjunto de normas que regem as relações entre a Administração e os administrados.\nIII. O conjunto de princípios que regem a Administração Pública.\n\nSeu fundamento repousa nos critérios denominados, respectivamente:\n\nA) das relações jurídicas, da administração pública e da atividade jurídica ou social do Estado;\nB) negativo ou residual, da atividade jurídica ou social do Estado e teleológico;\nC) do serviço público, do Poder Executivo e residual ou negativo.\nD) da Administração Pública, do serviço público e do Poder Executivo.\nE) teleológico, das relações jurídicas e da administração pública.", "gab": "E", "gabLabel": "", "html": "I — <b>Critério Teleológico</b> (fins do Estado); II — <b>Critério das Relações Jurídicas</b> (relação autoridade/cidadão); III — <b>Critério da Administração Pública</b> (regramento do aparelho estatal).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q6", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.6", "tema": "", "enun": "Considerando o Regime Jurídico Administrativo é correto afirmar que:\n\nA) as controvérsias em matéria administrativa, decididas pelo órgão executor, fazem coisa julgada material;\nB) no Brasil, a Jurisdição é dual.\nC) a adoção, pelo Brasil, do sistema de Jurisdição una, afasta a possibilidade de se reconhecer administrativamente de qualquer lesão ou ameaça a direito;\nD) é permitida a criação de tribunais com competência administrativa;\nE) N.D.A", "gab": "D", "gabLabel": "", "html": "É legítima a criação de órgãos e tribunais com competência administrativa (CARF, TIT/SP, Conselhos de Contribuintes). Contudo, por vigorar a Jurisdição Única (CF/88, art. 5º, XXXV), suas decisões não produzem coisa julgada material e podem ser revistas pelo Judiciário.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q7", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.7", "tema": "", "enun": "A Administração Pública, em sentido objetivo, no exercício da função administrativa, engloba as seguintes atividades, exceto:\n\nA) Polícia Administrativa;\nB) Serviço Público;\nC) Elaboração legislativa, com caráter inovador;\nD) Fomento a atividades privadas de interesse público.\nE) Intervenção no domínio econômico.", "gab": "C", "gabLabel": "", "html": "A função administrativa abrange Polícia Administrativa, Serviço Público, Fomento e Intervenção no domínio econômico. A elaboração legislativa com caráter inovador primário constitui <b>função legislativa típica</b>, não função administrativa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q8", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.8", "tema": "", "enun": "A Administração Pública, em sentido objetivo, abrange as atividades exercidas pelas pessoas jurídicas, órgãos e agentes incumbidos de atender concretamente às necessidades coletivas; corresponde à função administrativa, atribuída preferencialmente aos órgãos do Poder Executivo.\nASSIM\nA Administração Pública abrange o fomento, a polícia administrativa e o serviço público.\n\nA) as duas afirmações estão corretas.\nB) as duas afirmações estão incorretas.\nC) a primeira afirmação está correta e a segunda afirmação esta incorreta.\nD) a primeira afirmação está incorreta e a segunda afirmação está correta.\nE) as duas alternativas estão corretas e a segunda complementa a primeira.", "gab": "E", "gabLabel": "", "html": "Ambas as proposições são juridicamente corretas e correlacionadas: a primeira define o conceito funcional/objetivo da Administração Pública; a segunda desdobra sua abrangência prática no fomento, polícia administrativa, serviço público e intervenção.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q9", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.9", "tema": "", "enun": "Considere as assertivas:\nI. O direito administrativo, por ser um dos ramos do direito público, disciplina não somente a atividade administrativa do Poder Executivo, mas também a do Poder Legislativo e do Judiciário.\nII. A primordial fonte formal do Direito Administrativo no Brasil é a jurisprudência.\n\nA) I e II estão corretas\nB) I e II estão incorretas\nC) I está correta e a II está incorreta\nD) I está incorreta e II está correta\nE) N.d.A", "gab": "C", "gabLabel": "", "html": "A assertiva I é verdadeira (o Direito Administrativo disciplina a função administrativa tipicamente exercida pelo Executivo e atipicamente pelo Legislativo e Judiciário). A assertiva II é falsa (a fonte primária é a <b>lei</b>, não a jurisprudência, que é fonte secundária).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q10", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.10", "tema": "", "enun": "Analise os itens a seguir e aponte a alternativa correta:\nI. No direito, as fontes são os fatos jurídicos de onde nascem as normas. As fontes jurídicas podem ser de dois tipos: primárias e secundárias.\nII. No Direito Administrativo, a lei e a doutrina constituem fontes primárias na medida em que as demais fontes (secundárias) estão a ela subordinadas.\n\nA) I e II estão corretas\nB) I e II estão incorretas\nC) I está correta e a II está incorreta\nD) I está incorreta e a II está correta\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "O item I é verdadeiro (conceituação genérica de fontes). O item II é falso porque a doutrina é fonte <b>secundária</b> (subsidiária); apenas a <b>lei</b> é fonte primária no Direito Administrativo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q11", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.11", "tema": "", "enun": "Assinale a alternativa incorreta:\n\nA) A lei é o único veículo habilitado para criar diretamente deveres e proibições, obrigações de fazer ou não fazer, no Direito Administrativo.\nB) A doutrina não cria diretamente a norma, mas esclarece o sentido e o alcance das regras jurídicas conduzindo o modo como os operadores do direito devem compreender as determinações legais.\nC) A jurisprudência, entendida como reiteradas decisões dos tribunais sobre determinado tema, não tem a força cogente de uma norma criada pelo legislador, mas influencia decisivamente a maneira como as regras passam a ser entendidas.\nD) Os costumes são práticas reiteradas da autoridade administrativa capazes de estabelecer padrões obrigatórios de comportamentos. Ao serem repetidos constantemente, criam o hábito de os administrados esperarem aquele modo de agir.\nE) N.D.A", "gab": "E", "gabLabel": "", "html": "As alternativas A, B, C e D descrevem com exatidão os papéis da Lei (fonte primária), Doutrina, Jurisprudência e Costumes (fontes secundárias). Como nenhuma contém erro, a opção \"Nenhuma das Anteriores\" é a correta.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q12", "bloco": "MÓDULO 1 — Noções Gerais de Direito Administrativo", "num": "Ex.12", "tema": "", "enun": "Dois são os sistemas de controle das atividades administrativas: o sistema de jurisdição una e o sistema do contencioso administrativo.\nLOGO,\nNo sistema de jurisdição una há a participação da função jurisdicional entre o poder Judiciário e tribunais administrativos.\n\nA) I e II estão corretas\nB) I está correta e a II está incorreta\nC) I está correta a II está incorreta\nD) I está incorreta e a II está correta\nE) Ambas estão corretas e a II complementa a I", "gab": "B", "gabLabel": "", "html": "A primeira premissa é verdadeira (existem os dois modelos mundiais de controle administrativo). A segunda premissa é falsa porque a partilha da jurisdição com Tribunais Administrativos caracteriza o <b>Sistema do Contencioso Administrativo (Sistema Francês)</b>, e NÃO o Sistema de Jurisdição Una adotado pelo Brasil (CF/88, art. 5º, XXXV).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q1", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.1", "tema": "", "enun": "O princípio básico que objetiva aferir a compatibilidade entre os meios e os fins, de modo a evitar restrições desnecessárias ou abusivas por parte da Administração Pública, com lesões aos direitos fundamentais, denomina-se:\n\nA) motivação;\nB) razoabilidade;\nC) impessoalidade;\nD) coercibilidade;\nE) imperatividade;", "gab": "B", "gabLabel": "", "html": "O princípio da <b>razoabilidade</b> impõe moderação, racionalidade e adequação estrita entre os meios e fins de interesse público, proibindo excessos ou restrições abusivas a direitos fundamentais. É princípio infraconstitucional implícito na CF/88.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q2", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.2", "tema": "", "enun": "Na hipótese de Prefeito que delibera desapropriar área de seu desafeto para edificar hospital municipal, verifica-se, do ponto de vista material, ofensa ao seguinte princípio da Administração Pública:\n\nA) motivação;\nB) moralidade;\nC) legalidade;\nD) devido processo legal;\nE) Inalienabilidade dos bens públicos.", "gab": "B", "gabLabel": "", "html": "A desapropriação motivada por inimizade pessoal contraria frontalmente a boa-fé, a lealdade e a honestidade, configurando violação ao <b>princípio da moralidade administrativa</b> (CF/88, art. 37, caput) e desvio de finalidade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q3", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.3", "tema": "", "enun": "Sobre os princípios que regem a administração pública, é incorreto afirmar que:\n\nA) o princípio da moralidade exige que o administrador se paute por conceitos éticos;\nB) corolário do princípio da igualdade é a vedação de se estabelecer diferenças em razão de sede ou domicílio dos licitantes;\nC) o princípio da supremacia do interesse público decorre da posição privilegiada dos órgãos e entes públicos encarregados da preservação do interesse público;\nD) em decorrência do princípio da hierarquia, que é restrito às funções administrativas e não aplicável às funções tipicamente legislativas e judiciais, a Administração Pública possui a prerrogativa de avocar atribuições, e também de rever os atos dos subordinados;\nE) A Constituição Federal prevê, expressamente, os princípios da legalidade, publicidade, impessoalidade, moralidade, eficiência e razoabilidade.", "gab": "E", "gabLabel": "", "html": "A alternativa E é incorreta: o rol expresso do art. 37, caput, da CF/88 contém apenas <b>Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência</b> (LIMPE). A razoabilidade é princípio implícito, não figurando no rol expresso.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q4", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.4", "tema": "", "enun": "Com relação aos princípios constitucionais da Administração Pública, está em conformidade com a:\n\nA) moralidade o ato administrativo praticado por agente público em favorecimento próprio, desde que revestido de legalidade.\nB) eficiência a prestação de serviço público que satisfaça em parte às necessidades dos administrados, desde que realizados com rapidez e prontidão;\nC) publicidade o sigilo imprescindível à segurança da sociedade e do Estado ou o indispensável à defesa da intimidade;\nD) impessoalidade a violação da ordem cronológica dos precatórios para o pagamento dos créditos de natureza comum;\nE) legalidade a inobservância a quaisquer atos normativos que não sejam lei em sentido estrito e provindos de autoridades administrativas.", "gab": "C", "gabLabel": "", "html": "A regra constitucional é a transparência, mas o próprio texto da CF/88 (art. 5º, X e XXXIII) autoriza o sigilo quando imprescindível à segurança da sociedade e do Estado ou à defesa da intimidade, em conformidade com o <b>princípio da publicidade</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q5", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.5", "tema": "", "enun": "Acerca dos princípios de Direito Administrativo, assinale a alternativa correta.\n\nA) o rol dos princípios elencados pela Constituição não é exaustivo, tanto que existem os chamados \"princípios implícitos\".\nB) o princípio da legalidade é uma das poucas previsões constitucionais que se relaciona à possibilidade de existir tirania e autoritarismo dos membros do Poder Executivo.\nC) o princípio da moralidade se aplica apenas aos entes da administração pública indireta.\nD) a moralidade e a razoabilidade são exemplos de princípios administrativos sem previsão expressa.\nE) A Constituição Federal prevê, expressamente, os princípios da legalidade, publicidade, impessoalidade, moralidade, eficiência e proporcionalidade.", "gab": "A", "gabLabel": "", "html": "O rol do art. 37, caput, da CF/88 não é taxativo, convivendo harmoniosamente com princípios implícitos reconhecidos pela doutrina e jurisprudência (razoabilidade, proporcionalidade, autotutela, motivação, segurança jurídica etc.).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q6", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.6", "tema": "", "enun": "Pedro foi aprovado em concurso público e nomeado. Logo depois, a Administração Pública, analisando com mais detalhe a documentação, chega à conclusão de que os documentos apresentados eram falsos e torna sem efeito a sua aprovação e nomeação. Assinale a alternativa que apresenta o princípio aplicado nesse caso.\n\nA) heterocomposição;\nB) segurança jurídica;\nC) tutela;\nD) autotutela;\nE) motivação.", "gab": "D", "gabLabel": "", "html": "Pelo <b>princípio da autotutela</b>, a Administração Pública tem o dever-poder de controlar a legalidade de seus próprios atos, devendo anular aqueles eivados de vícios de ilegitimidade ou falsidade, conforme a Súmula 473 do STF.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q7", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.7", "tema": "", "enun": "Há uma notícia sobre o uso indevido de cartões de crédito corporativos por agentes políticos em supermercados, free shops, restaurantes e saques em caixas eletrônicos. Cuida-se de evidente desrespeito ao princípio da:\n\nA) tutela;\nB) continuidade;\nC) impessoalidade;\nD) proporcionalidade;\nE) eficiência.", "gab": "C", "gabLabel": "", "html": "A utilização de recursos públicos para satisfazer despesas pessoais viola frontalmente o <b>princípio da impessoalidade</b>, que impõe o dever de imparcialidade e a persecução exclusiva do interesse público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q8", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.8", "tema": "", "enun": "A vedação à Administração Pública de, por meio de mero ato administrativo, conceder direitos, criar obrigações ou impor proibições, vincula-se a:\n\nA) legalidade\nB) moralidade\nC) impessoalidade\nD) hierarquia\nE) eficiência", "gab": "A", "gabLabel": "", "html": "Sob o <b>princípio da legalidade</b> (CF/88, art. 5º, II, e art. 37, caput), a Administração só pode agir quando autorizada por lei em sentido formal; atos administrativos infralegais não podem criar originariamente proibições, deveres ou direitos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q9", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.9", "tema": "", "enun": "O princípio constitucional que impõe à Administração Pública direta e indireta a busca pela qualidade e aperfeiçoamento na prestação de seus serviços, e o princípio estabelecendo que todos têm direito de receber dos órgãos públicos, de regra, informações de seu interesse, dizem respeito, respectivamente, a:\n\nA) impessoalidade e razoabilidade\nB) presunção de legitimidade e a moralidade administrativa\nC) eficiência e a publicidade\nD) publicidade e a proporcionalidade\nE) imperatividade e a especialidade", "gab": "C", "gabLabel": "", "html": "O dever de prestar serviços com qualidade e máximo rendimento refere-se ao <b>princípio da eficiência</b> (EC 19/98). O direito do cidadão de obter informações dos órgãos estatais refere-se ao <b>princípio da publicidade</b> (CF/88, art. 5º, XXXIII, e art. 37, caput).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q10", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.10", "tema": "", "enun": "Consoante aos princípios da administração pública, assinale a opção correta:\n\nA) de acordo com o princípio da publicidade, toda e qualquer atividade administrativa deve ser autorizada por lei.\nB) dado o princípio da legalidade, deve o administrador público pautar sua conduta por preceitos éticos.\nC) a obrigação de a Administração Pública ser impessoal decorre do princípio da moralidade.\nD) a eficiência constitui princípio administrativo previsto na Constituição Federal.\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "Conforme a doutrina de Hely Lopes Meirelles, a obrigação de atuação impessoal e objetiva está entrelaçada com os postulados éticos de probidade que emanam do <b>princípio da moralidade administrativa</b>, exigindo agir exclusivamente pela finalidade pública.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q11", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.11", "tema": "", "enun": "A veiculação do ato praticado pela Administração Pública no Diário Oficial do Estado, com objetivo de divulgar fatos e ações praticados no âmbito da Administração Pública, atende ao seguinte princípio da Administração:\n\nA) eficiência\nB) moralidade\nC) supremacia do interesse público\nD) publicidade\nE) impessoalidade", "gab": "D", "gabLabel": "", "html": "A veiculação em órgão oficial de imprensa atende ao <b>princípio da publicidade</b>, requisito de eficácia e transparência dos atos públicos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q12", "bloco": "MÓDULO 2 — Princípios da Administração Pública", "num": "Ex.12", "tema": "", "enun": "Paulo, delegado de polícia, atendia com presteza e gentileza apenas algumas pessoas na cidade na qual exercia seu mister. Paulo feria o seguinte princípio da administração pública:\n\nA) eficiência\nB) moralidade\nC) supremacia do interesse público\nD) publicidade\nE) impessoalidade", "gab": "E", "gabLabel": "", "html": "A conduta de dispensar tratamento privilegiado e cortesia seletiva a determinadas pessoas em detrimento da coletividade viola o <b>princípio da impessoalidade</b>, que veda favoritismos ou discriminações na prestação do serviço público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q1", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.1", "tema": "", "enun": "Considerando o poder de polícia, podemos dizer que:\n\nI. O poder de polícia é a atividade do Estado consistente em limitar o exercício dos direitos individuais em benefício do interesse público.\nII. O poder de polícia que o Estado exerce pode incidir em duas áreas de atuação estatal: na administrativa e na judiciária.\nIII. São atributos do poder de polícia a discricionariedade, a auto-executoriedade e a coercibilidade.\nIV. O poder de polícia tanto pode ser discricionário como vinculado.\n\nEstá correto o que se afirma:\n\nA) I e III\nB) II e IV\nC) I, II, III e IV\nD) II, III e IV\nE) I, III e IV", "gab": "C", "gabLabel": "", "html": "Todas as quatro assertivas são corretas: I — conceito de poder de polícia (CTN, art. 78); II — divisão em Polícia Administrativa e Judiciária; III — atributos clássicos; IV — possibilidade de atuação discricionária (regra) ou vinculada (ex: licença para construir).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q2", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.2", "tema": "", "enun": "O poder que cabe à Administração Pública para apurar infrações e aplicar penalidades aos servidores públicos e demais pessoas sujeitas à disciplina administrativa, é:\n\nA) o poder de polícia\nB) o poder regulamentar\nC) o poder vinculado\nD) o poder disciplinar\nE) o poder discricionário", "gab": "D", "gabLabel": "", "html": "O <b>poder disciplinar</b> é a faculdade da Administração para apurar infrações e impor penalidades funcionais a seus servidores e demais particulares submetidos a relação jurídica de sujeição especial/disciplina interna.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q3", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.3", "tema": "", "enun": "São atributos do poder de polícia, exceto:\n\nA) Discricionariedade;\nB) Exigibilidade;\nC) Executoriedade;\nD) Atividade positiva;\nE) Coercibilidade.", "gab": "D", "gabLabel": "", "html": "Os atributos do poder de polícia são a <b>discricionariedade, autoexecutoriedade</b> (exigibilidade + executoriedade) e a <b>coercibilidade</b>. A \"atividade positiva\" não é atributo — o poder de polícia impõe precipuamente obrigações de abstenção (de não fazer ou tolerar).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q4", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.4", "tema": "", "enun": "É manifestação típica do poder de polícia da Administração Pública a:\n\nA) prisão em flagrante de um criminoso;\nB) interdição de estabelecimento comercial por agentes da vigilância sanitária;\nC) criação de uma taxa decorrente de ação de fiscalização;\nD) aplicação de pena a servidor público;\nE) vigilância exercida sobre o patrimônio público.", "gab": "B", "gabLabel": "", "html": "A interdição de estabelecimento comercial insalubre ou irregular por agentes da vigilância sanitária é ato repressivo concreto característico do <b>poder de polícia administrativa</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q5", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.5", "tema": "", "enun": "Poder regrado é aquele que o direito positivo confere à Administração Pública para a prática de ato de sua competência, determinando os elementos e requisitos necessários à sua formalização. Na hipótese, o texto está discorrendo sobre o poder:\n\nA) de polícia;\nB) discricionário;\nC) regulamentar;\nD) vinculado;\nE) disciplinar;", "gab": "D", "gabLabel": "", "html": "O poder regrado é a denominação do <b>poder vinculado</b>, hipótese na qual o legislador estabelece previamente todos os elementos e requisitos do ato sem conferir margem de valoração subjetiva ou conveniência ao administrador.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q6", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.6", "tema": "", "enun": "___________ é o de que dispõe o Executivo para distribuir e escalonar as funções de seus órgãos, ordenar e rever a atuação de seus agentes, estabelecendo a relação de subordinação entre os servidores do seu quadro de pessoal. Assinale a alternativa que completa o espaço adequadamente.\n\nA) poder disciplinar\nB) poder regulamentar\nC) poder de polícia\nD) poder hierárquico\nE) poder discricionário", "gab": "D", "gabLabel": "", "html": "O <b>poder hierárquico</b> é a prerrogativa que estrutura, escala e coordena órgãos e agentes em relação de subordinação, decorrendo daí as atribuições de dar ordens, fiscalizar, anular, revogar, delegar e avocar competências.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q7", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.7", "tema": "", "enun": "A faculdade que dispõe a Administração Pública de aplicar sanções relativas a infrações funcionais de seus servidores caracteriza o poder:\n\nA) disciplinar\nB) de liderança\nC) autocrático\nD) público\nE) de complementação", "gab": "A", "gabLabel": "", "html": "A aplicação de penalidades decorrentes do descumprimento de deveres e infrações funcionais expressa o exercício direto do <b>poder disciplinar</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q8", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.8", "tema": "", "enun": "É característica própria do Poder Regulamentar da Administração Pública:\n\nA) impor obrigação de fazer ou de não fazer\nB) possibilitar a inovação na ordem jurídica\nC) ser expedido com a estrita finalidade de produzir as disposições operacionais uniformizadoras necessárias à execução da lei\nD) ser ato geral, concreto, de competência privativa do Poder Legislativo.\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "O <b>poder regulamentar</b> destina-se à expedição de atos normativos secundários (regulamentos/decretos) para explicitar a lei e fornecer regramento operacional para sua fiel execução (CF/88, art. 84, IV), sem inovar primariamente no ordenamento.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q9", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.9", "tema": "", "enun": "O poder que se refere ao controle estatal dos interesses e atividades dos particulares, limitando ou disciplinando direitos, interesses ou liberdades individuais, em razão do interesse público é o:\n\nA) arbitrário\nB) regulamentar\nC) hierárquico\nD) de polícia\nE) disciplinar", "gab": "D", "gabLabel": "", "html": "Trata-se do conceito clássico de <b>poder de polícia</b> (Hely Lopes Meirelles): condicionamento da liberdade e da propriedade privada em atenção às exigências da coletividade e da supremacia do interesse público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q10", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.10", "tema": "", "enun": "O poder regulamentar da Administração consiste em:\n\nA) impor restrições à atuação de particulares, em benefício da coletividade, nos limites da lei\nB) controlar a atividade de órgãos inferiores, dando ordem a subordinados e verificando a legalidade dos atos praticados\nC) editar normas complementares à lei, para sua fiel execução\nD) organizar a atividade administrativa, inclusive com a avocação de competências e criação de órgãos\nE) apurar infrações e aplicar penalidades aos servidores públicos e particulares que contratam com a Administração", "gab": "C", "gabLabel": "", "html": "O poder regulamentar consiste na competência conferida ao Chefe do Executivo para expedir decretos e regulamentos que veiculem normas complementares necessárias à fiel execução da lei (CF/88, art. 84, IV).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q11", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.11", "tema": "", "enun": "A interdição de estabelecimento comercial privado por autoridade administrativa constitui exemplo do poder:\n\nA) disciplinar\nB) regulamentar\nC) normativo\nD) hierárquico\nE) de polícia", "gab": "E", "gabLabel": "", "html": "A interdição imediata de estabelecimento privado que descumpra normas sanitárias ou de segurança é modalidade de ato repressivo concreto amparado no <b>poder de polícia</b>, munido do atributo da autoexecutoriedade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q12", "bloco": "MÓDULO 3 — Poderes da Administração Pública", "num": "Ex.12", "tema": "", "enun": "A aplicação da penalidade de advertência a servidor público infrator, por sua chefia imediata, é ato administrativo que expressa manifestação do poder:\n\nA) disciplinar\nB) hierárquico\nC) regulamentar\nD) de polícia\nE) vinculado", "gab": "A", "gabLabel": "", "html": "A imposição da pena de advertência por parte do superior hierárquico ao subordinado decorre do exercício do <b>poder disciplinar</b> da Administração Pública.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q1", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.1", "tema": "", "enun": "O ato administrativo praticado no exercício da competência discricionária:\n\nA) pode ser revogado pelo Judiciário ou Legislativo quando inadequado ou inoportuno;\nB) não é possível de controle judicial, administrativo ou legislativo\nC) pode ser apreciado judicialmente, desde que sobre o mérito.\nD) não goza do atributo da presunção de legitimidade.\nE) pode ser passível de apreciação judicial quanto aos aspectos de legalidade", "gab": "E", "gabLabel": "", "html": "O Poder Judiciário não aprecia o mérito administrativo (juízo de conveniência/oportunidade) dos atos discricionários para revogá-los. Porém, é plenamente passível de controle judicial a verificação da <b>legalidade</b> do ato.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q2", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.2", "tema": "", "enun": "Complete as lacunas:\n\n_____________ é o efeito mediato do ato, o objetivo decorrente do interesse coletivo indicado pela lei, buscado pela Administração.\n_____________ é pressuposto de fato e direito que leva a Administração a praticar o ato.\nA _____________ é um aspecto formal que constitui garantia jurídica para o administrado e para a Administração, possibilitando o controle do ato.\n\nA) MOTIVO - OBJETO - COMPETÊNCIA\nB) FINALIDADE - OBJETO - COMPETÊNCIA\nC) OBJETO - FINALIDADE - FORMA\nD) FINALIDADE - MOTIVO - FORMA\nE) FORMA - MOTIVO - OBJETO", "gab": "D", "gabLabel": "", "html": "A <b>finalidade</b> é o efeito mediato e objetivo de interesse público previsto em lei; o <b>motivo</b> é o pressuposto de fato e de direito que fundamenta a prática do ato; e a <b>forma</b> é o modo de exteriorização que assegura controle jurídico.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q3", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.3", "tema": "", "enun": "São requisitos de validade do ato administrativo:\n\nA) competência, conveniência, finalidade, motivo e objeto\nB) forma, competência, finalidade, motivo e objeto.\nC) imperatividade, competência, legitimidade, motivo e objeto.\nD) forma, competência, finalidade, oportunidade e objeto\nE) autoexecutoriedade, forma, competência, finalidade e objeto.", "gab": "B", "gabLabel": "", "html": "Os 5 elementos/requisitos essenciais de validade do ato administrativo são: <b>Competência (Sujeito), Finalidade, Forma, Motivo e Objeto</b> (mnemônico FF.COM/COFIFOMO — art. 2º da Lei nº 4.717/1965).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q4", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.4", "tema": "", "enun": "O Poder Judiciário pode exercer o controle dos atos administrativos, quer no que tange à conformidade dos elementos vinculados com a lei (controle de legalidade stricto sensu) quer no que toca à compatibilidade dos elementos discricionários com os princípios constitucionalmente expressos (controle da legalidade lato sensu), decretando sua nulidade, se necessário.\nPORQUE\nSão elementos do ato administrativo o sujeito, a forma, o objeto, o motivo e a finalidade.\n\nA) A primeira afirmativa é falsa e a segunda verdadeira.\nB) A segunda afirmativa é falsa e a primeira verdadeira.\nC) As duas afirmativas são verdadeiras e a segunda justifica a primeira.\nD) As duas afirmativas são verdadeiras, mas a segunda não justifica a primeira.\nE) As duas afirmativas são falsas.", "gab": "D", "gabLabel": "", "html": "Ambas as premissas são isoladamente verdadeiras. Porém, o simples rol dos 5 elementos do ato não é a causa/justificativa legal do poder de controle jurisdicional, o qual decorre do princípio constitucional da inafastabilidade da tutela jurisdicional (CF/88, art. 5º, XXXV).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q5", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.5", "tema": "", "enun": "São atributos do ato administrativo, exceto:\n\nA) Presunção de legitimidade\nB) Finalidade\nC) Imperatividade\nD) Autoexecutoriedade\nE) Tipicidade", "gab": "B", "gabLabel": "", "html": "Os atributos (características) do ato administrativo são: Presunção de legitimidade, Imperatividade, Autoexecutoriedade e Tipicidade (mnemônico PAIT). A <b>finalidade</b> é <b>requisito/elemento</b> de validade, não atributo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q6", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.6", "tema": "", "enun": "Considere as assertivas:\nI. Pela autoexecutoriedade a administração põe em prática seus atos utilizando meios coercitivos próprios.\nII. No tocante aos requisitos do ato administrativo pode-se afirmar que motivo e motivação são expressões sinônimas.\n\nA) I e II estão corretas\nB) I e II estão incorretas\nC) I está correta e II está incorreta\nD) I está incorreta e II está correta\nE) N.D.A.", "gab": "C", "gabLabel": "", "html": "A assertiva I é correta (autoexecutoriedade permite execução direta pela Administração). A assertiva II é incorreta: <b>motivo</b> (pressuposto de fato e direito) distingue-se da <b>motivação</b> (exposição escrita dos motivos).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q7", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.7", "tema": "", "enun": "No tocante aos atos administrativos, considere as assertivas:\nI. Os atos de gestão são os praticados pela Administração sem prerrogativas de autoridade visando gerir seus bens e seus serviços, como qualquer pessoa o faz.\nII. Os atos de expediente são os que têm conteúdo decisório.\n\nA) I e II estão corretas\nB) I e II estão incorretas\nC) I está incorreta e II está correta\nD) I está correta e a II está incorreta\nE) N.d.A", "gab": "D", "gabLabel": "", "html": "A assertiva I é correta (atos de gestão sem prerrogativa de império). A assertiva II é incorreta: os atos de expediente são <b>destituídos</b> de conteúdo decisório, servindo para o andamento rotineiro de requerimentos e processos internos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q8", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.8", "tema": "", "enun": "Na hipótese de uma autarquia realizar um contrato verbal com uma empresa prestadora de serviços de vigilância, pode-se dizer que foi ferido o seguinte requisito do ato administrativo:\n\nA) competência\nB) finalidade\nC) forma\nD) motivo\nE) objeto", "gab": "C", "gabLabel": "", "html": "A regra geral no Direito Administrativo é a forma escrita para atos e contratos. A celebração de contrato verbal viola o requisito da <b>forma</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q9", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.9", "tema": "", "enun": "Assinale a alternativa que apresenta duas características da competência do ato administrativo:\n\nA) hierarquia e finalidade\nB) imprescritível e improrrogável\nC) limitabilidade e hierarquia\nD) imperatividade e finalidade\nE) modificável e prescritível", "gab": "B", "gabLabel": "", "html": "A competência administrativa é <b>imprescritível</b> (não se extingue pelo não uso) e <b>improrrogável</b> (a ausência de contestação não transfere nem convalida a incompetência). É também irrenunciável e de exercício obrigatório.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q10", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.10", "tema": "", "enun": "A presunção de legitimidade dos atos administrativos:\n\nA) é relativa, podendo ser afastada em hipóteses de existência de vício\nB) recobre apenas algumas categorias de atos administrativos\nC) impõe ao agente público a prova de que o ato praticado é válido\nD) impede que o Poder Judiciário possa apreciar a validade\nE) N.D.A", "gab": "A", "gabLabel": "", "html": "A presunção de legitimidade e veracidade dos atos administrativos é <b>relativa (<i>juris tantum</i>)</b>: o ato se presume válido até prova em contrário, produzindo o efeito de inverter o ônus probatório em favor da Administração Pública.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q11", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.11", "tema": "", "enun": "Sendo um dos requisitos do ato administrativo, a competência é:\n\nA) modificável pela vontade das partes\nB) transferível\nC) irrenunciável\nD) prescritível\nE) de exercício facultativo", "gab": "C", "gabLabel": "", "html": "A competência administrativa é <b>irrenunciável</b> porque constitui uma função pública gerida em nome e benefício do interesse público indisponível.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q12", "bloco": "MÓDULO 4 — Atos Administrativos", "num": "Ex.12", "tema": "", "enun": "Quanto à extinção do ato administrativo, é correto afirmar que:\n\nA) o ato administrativo praticado por agente incompetente deve ser revogado\nB) a revogação só incide sobre ato administrativo vinculado\nC) um ato administrativo perfeito e eficaz pode ser anulado ou revogado, conforme o caso\nD) a anulação do ato administrativo opera efeitos ex nunc\nE) N.D.A", "gab": "C", "gabLabel": "", "html": "Um ato perfeito e eficaz pode ser <b>anulado</b> (vício de ilegalidade, efeitos <i>ex tunc</i>) ou <b>revogado</b> (inconveniência/inoportunidade, ato discricionário, efeitos <i>ex nunc</i>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q1", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.1", "tema": "", "enun": "Considere as assertivas:\nI. Empresas públicas e sociedades de economia mista dependem, para a sua criação, de autorização legislativa, que deve ser específica, vedada a autorização genérica.\nII. As autarquias, as fundações públicas, as sociedades de economia mista e as empresas públicas integram a Administração Indireta.\nIII. A Presidência da República e os Ministérios são órgãos integrantes da Administração Federal Indireta.\n\nÉ correto afirmar que:\n\nA) todas as assertivas estão incorretas.\nB) somente a assertiva III está incorreta.\nC) somente as assertivas I e III estão incorretas.\nD) somente as assertivas I e II estão incorretas.\nE) todas as assertivas estão corretas.", "gab": "B", "gabLabel": "", "html": "As assertivas I e II são corretas (CF/88, art. 37, XIX e Decreto-Lei 200/67). A assertiva III é incorreta: a Presidência da República e os Ministérios integram a Administração Pública <b>Direta</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q2", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.2", "tema": "", "enun": "As pessoas jurídicas que integram o chamado Terceiro Setor têm regime jurídico:\n\nA) de direito público.\nB) de direito privado.\nC) predominantemente de direito público, parcialmente derrogado por normas de direito privado.\nD) predominantemente de direito privado, parcialmente derrogado por normas de direito público.\nE) de direito público ou de direito privado, conforme a pessoa jurídica.", "gab": "D", "gabLabel": "", "html": "Entidades do Terceiro Setor (OS, OSCIP, Sistema S) são pessoas jurídicas privadas sem fins lucrativos com regime <b>predominantemente de direito privado</b>, derrogado parcialmente por normas de direito público quando gerem verbas públicas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q3", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.3", "tema": "", "enun": "Pessoas jurídicas de direito privado que, por lei, são autorizadas a prestar serviços ou realizar atividades de interesse coletivo ou público, mas não exclusivos do Estado, dizem respeito a entidades:\n\nA) estatais.\nB) paraestatais.\nC) autárquicas.\nD) fundacionais.\nE) empresariais.", "gab": "B", "gabLabel": "", "html": "As entidades <b>paraestatais</b> (entes de cooperação/Terceiro Setor) são pessoas jurídicas privadas que atuam ao lado do Estado executando atividades de interesse social não exclusivas do setor público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q4", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.4", "tema": "", "enun": "São traços distintos entre empresa pública e sociedade de economia mista:\n\nA) forma jurídica; composição do capital e foro processual\nB) foro processual; forma de criação e objeto\nC) composição de capital; regime jurídico e forma de criação\nD) objeto, forma jurídica e regime jurídico\nE) regime jurídico, objeto e foro processual.", "gab": "A", "gabLabel": "", "html": "EP e SEM distinguem-se por: <b>Forma jurídica</b> (EP admite qualquer forma; SEM é obrigatoriamente S/A), <b>Composição do capital</b> (EP tem capital 100% público; SEM tem capital misto) e <b>Foro processual</b> (EP federal → Justiça Federal; SEM → Justiça Estadual).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q5", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.5", "tema": "", "enun": "A técnica de organização e distribuição interna de competências entre vários órgãos despersonalizados dentro de uma mesma pessoa jurídica e que tem por base a hierarquia denomina-se:\n\nA) descentralização\nB) desconcentração\nC) outorga\nD) delegação\nE) coordenação", "gab": "B", "gabLabel": "", "html": "A <b>desconcentração</b> é a distribuição interna de competências no âmbito da mesma pessoa jurídica, criando órgãos despersonalizados e subordinados hierarquicamente. A descentralização distribui competências para pessoas jurídicas distintas.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q6", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.6", "tema": "", "enun": "As Agências Reguladoras (ANATEL, ANEEL, ANP, etc.) são definidas com a natureza jurídica de autarquias especiais, diferenciando-se das autarquias não especiais:\n\nA) pela autonomia financeira\nB) pela sua independência administrativa\nC) pela ausência de subordinação hierárquica\nD) pelo mandato fixo e estabilidade de seus dirigentes\nE) N.D.A", "gab": "D", "gabLabel": "", "html": "As Agências Reguladoras distinguem-se das autarquias comuns por conferirem aos seus dirigentes <b>mandato fixo com termo certo e estabilidade contra exoneração imotivada (<i>ad nutum</i>)</b>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q7", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.7", "tema": "", "enun": "No rol abaixo, assinale aquela que pode ser conceituada como resultado da qualificação que se atribuiu a uma autarquia ou fundação pública, cujo objeto institucional seja uma atividade exclusiva de Estado, com o propósito de dotá-la de maior autonomia gerencial:\n\nA) agência reguladora\nB) organização social\nC) serviço social autônomo\nD) agência executiva\nE) organização da sociedade civil de interesse público", "gab": "D", "gabLabel": "", "html": "A <b>Agência Executiva</b> é um status/qualificação (não nova pessoa jurídica) conferido por decreto presidencial a autarquias ou fundações que celebrem contrato de gestão para ampliação de sua autonomia gerencial, orçamentária e financeira (Lei 9.649/98).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q8", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.8", "tema": "", "enun": "As organizações sociais têm como característica, entre outras:\n\nA) atuar também nas áreas de ensino, pesquisa científica e desenvolvimento tecnológico\nB) o vínculo jurídico com o Poder Público por meio do contrato de parceria;\nC) criação por decreto do Chefe do Executivo\nD) ser pessoa jurídica de direito privado, podendo ter fins lucrativos\nE) n.d.a", "gab": "A", "gabLabel": "", "html": "As Organizações Sociais (OS), disciplinadas pela Lei nº 9.637/1998, atuam nas áreas de <b>ensino, pesquisa científica, desenvolvimento tecnológico, proteção ao meio ambiente, cultura e saúde</b>. Vinculam-se ao Poder Público por contrato de gestão (não parceria).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q9", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.9", "tema": "", "enun": "Quando uma pessoa jurídica de direito público ou privado é criada por lei, cabendo-lhe a titularidade e a execução de determinado serviço público, a hipótese é de:\n\nA) concentração\nB) centralização\nC) desestatização\nD) descentralização por serviço\nE) N.D.A", "gab": "D", "gabLabel": "", "html": "A <b>descentralização por serviço</b> (funcional ou por outorga) ocorre quando o Estado edita lei específica criando entidade da Administração Indireta e outorgando-lhe a titularidade e a execução do serviço público.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q10", "bloco": "MÓDULO 5 — Organização Administrativa", "num": "Ex.10", "tema": "", "enun": "\"Em razão de estar sob o
