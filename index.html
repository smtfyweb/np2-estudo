resa individual de responsabilidade limitada somente poderá figurar em uma única empresa dessa modalidade.\nB) Somente o patrimônio social da empresa responderá pelas dívidas da empresa individual de responsabilidade limitada, não se confundindo em qualquer situação com o patrimônio da pessoa natural que a constitui, conforme descrito em sua declaração anual de bens entregue ao órgão competente.\nC) A empresa individual de responsabilidade limitada também poderá resultar da concentração das quotas de outra modalidade societária num único sócio, independentemente das razões que motivaram tal concentração.\nD) Poderá ser atribuída à empresa individual de responsabilidade limitada constituída para a prestação de serviços de qualquer natureza a remuneração decorrente da cessão de direitos patrimoniais de autor ou de imagem, nome, marca ou voz de que seja detentor o titular da pessoa jurídica, vinculados à atividade profissional.\nE) Aplicam-se à empresa individual de responsabilidade limitada, no que couber, as regras previstas para as sociedades limitadas.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q4", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.4", "tema": "", "enun": "A respeito da empresa individual de responsabilidade limitada, assinale a opção correta.\n\nA) A empresa individual de responsabilidade limitada não pode resultar da concentração das quotas de outra modalidade societária em um único sócio\nB) A pessoa natural que constituir empresa individual de responsabilidade limitada pode figurar em outras pessoas dessa espécie.\nC) A expressão “EIRELI\" deve compor o nome empresarial, devendo constar após a firma ou denominação social da empresa.\nD) O capital social desse tipo de empresa não pode ser superior a cem vezes o maior salário mínimo vigente no país.\nE) Aplicam-se à empresa individual de responsabilidade limitada, no que couber, as regras previstas para as sociedades simples.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q5", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.5", "tema": "", "enun": "Sobre o registro empresarial, assinale a alternativa CORRETA.\n\nA) Não poderão as juntas comerciais se recusar a registrar contrato social ou alterações contratuais de sociedade limitada que envolva sócio incapaz, desde que atendidos, de forma conjunta, os seguintes pressupostos: o sócio incapaz não pode exercer a administração da sociedade; o capital social deve ser totalmente integralizado; o sócio relativamente incapaz deve ser assistido e o absolutamente incapaz deve ser representado.\nB) Nas juntas comerciais, o Pedido de Reconsideração terá por objeto obter a revisão de despachos singulares ou de Turmas que formulem exigências para o deferimento do arquivamento e será apresentado no prazo para cumprimento da exigência para apreciação pela autoridade recorrida em 5 (cinco) dias úteis ou 8 (oito) dias úteis, respectivamente.\nC) Qualquer pessoa, desde que prove interesse especifico, poderá, gratuitamente, mediante autorização judicial, consultar os assentamentos existentes nas juntas comerciais e obter certidões.\nD) A sociedade que não proceder a qualquer arquivamento no período de 5 (cinco) anos consecutivos será considerada inativa e, automaticamente, terá o seu registro cancelado\nE) O exercício de atividade empresarial sem o devido registro na junta comercial tem, como uma de suas consequências, a não sujeição do exercente à falência, ficando submetido à insolvência civil.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q6", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.6", "tema": "", "enun": "Sociedade empresária impetra mandado de segurança em face de ato do Presidente da Junta Comercial do Estado do Rio de Janeiro, que nega o arquivamento de alteração contratual. O ato aponta a inviabilidade do nome empresarial, diante de similitude para com outro já existente, de diversa sociedade. Em relação ao lema, analise as assertivas abaixo e, depois, marque a opção correta:\nI - Em relação ao mandado de segurança impetrado, a competência é da Justiça Estadual, já que o ato foi praticado por autoridade estadual;\nII- lndependentemente de tema processual, o controle de similitude de nome empresarial cabe ao Instituto Nacional de Propriedade Industrial, e não à Junta Comercial;\nIII- A colidência de nome empresarial é matéria do interesse exclusivo de seus titulares, e a análise do tema, sem provocação do interessado, não cabe nem à Junta Comercial e nem ao Instituto Nacional de Propriedade Industrial;\nIV — Às Juntas Comerciais cabe a análise da escolha de títulos de estabelecimento e formas societárias, enquanto ao Instituto Nacional de Propriedade Industrial, entre outras tarefas, cabe a análise de pedido de registro e eventual colidência de marcas.\n\nA) Estão erradas todas a assertivas.\nB) penas as assertivas I e II estão corretas.\nC) Apenas as assertivas I e III estão corretas.\nD) Apenas a assertiva IV está correta.\nE) Está correta apenas a assertiva II.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q7", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.7", "tema": "", "enun": "Sófocles, empresário cuja atividade rural constitui sua principal profissão:\n\nA) tem a faculdade de se inscrever no Registro de Empresas, mas só pode exercê-la previamente ao início das suas atividades;\nB) não tem direito de se inscrever no Registro de Empresas, cabendo-lhe se inscrever apenas perante o Ministério da Agricultura, Pecuária e Abastecimento;\nC) tem o dever de se inscrever no Registro de Empresas previamente ao início das suas atividades;\nD) tem o dever de se inscrever no Registro de Empresas até noventa dias depois da data em que iniciar suas atividades;\nE) tem a faculdade de se inscrever no Registro de Empresas, mesmo depois de iniciadas as suas atividades.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q8", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.8", "tema": "", "enun": "Assinale a opção correta com relação ao registro de Empresas e às obrigações jurídicas que o empresário deve cumprir para o exercício regular de sua atividade econômica.\n\nA) O arquivamento dos atos relativos à transformação, incorporação, fusão e cisão de empresas mercantis é objeto de decisão singular do presidente da Junta Comercial;\nB) O empresário que se tornar incapaz poderá continuar a empresa, por meio de representante ou devidamente assistido, cabendo ao Registro Público de Empresas Mercantis a cargo das Juntas Comerciais registrar contratos ou alterações contratuais de sociedade que envolva incapaz;\nC) Para dar início a atividade econômica, mercantil ou rural, o empresário deve formalizar a sua inscrição junto ao Registro Público de Empresas Mercantis;\nD) As modificações contratuais e ou estatutárias da empresa devem ser efetivadas exclusivamente por escritura pública, independentemente da forma adotada no ato constitutivo;\nE) O Departamento de Registro Empresarial e Integração, órgão central do Sistema Nacional de Registro Mercantil, desempenha funções de execução e administração dos serviços de registro.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q9", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.9", "tema": "", "enun": "Com relação à disciplina legal da escrituração e dos livros empresariais, assinale a opção correta.\n\nA) Em princípio, os livros empresariais fazem prova contra os empresários a que pertençam e, em seu favor, quando forem escriturados sem vício extrínseco ou intrínseco e confirmados por outros subsídios;\nB) Pode o juiz, em qualquer caso, autorizar a exibição integral dos livros e papéis da escrituração contábil do empresário ou da sociedade empresária;\nC) As restrições estabelecidas na legislação civil ao exame da escrituração contábil, em parte ou por inteiro, aplicam-se também às autoridades fazendárias, no exercício da fiscalização do pagamento de tributos;\nD) Não constitui crime deixar de elaborar, escriturar ou autenticar os documentos de escrituração contábil obrigatórios;\nE) Não constituem pressuposto do pedido de recuperação judicial as demonstrações contábeis relativas aos três últimos exercícios sociais, nem o balanço patrimonial do empresário ou da sociedade empresária.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q10", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.10", "tema": "", "enun": "Considere as proposições abaixo acerca do nome empresarial.\nI. A sociedade em que houver sócios de responsabilidade ilimitada operará sob denominação social.\nII. A sociedade anônima poderá adotar firma ou denominação social.\nIII. O nome de sócio que vier a falecer pode ser conservado na firma social.\nIV. O nome empresarial não pode ser objeto de compra e venda.\nV. A sociedade em conta de participação não pode ter firma ou denominação.\nEstá correto o que se afirma APENAS em:\n\nA) II e V.\nB) I e III.\nC) II e III.\nD) I e IV.\nE) IV e V.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q11", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.11", "tema": "", "enun": "Acerca do nome empresarial, é correto afirmar:\n\nA) O nome de sócio que vier a falecer pode ser conservado na firma social.\nB) É vedada a alienação do nome empresarial.\nC) A inscrição do nome empresarial somente será cancelada a requerimento do seu titular, mesmo quando cessado o exercício da atividade para que foi adotado.\nD) Independentemente de previsão contratual, o adquirente de estabelecimento, por ato entre vivos, pode usar o nome empresarial do alienante, precedido do seu próprio, com a qualificação de sucessor.\nE) A sociedade em conta de participação pode ter firma ou denominação.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q12", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.12", "tema": "", "enun": "Para os efeitos da Lei Complementar no 123/2006, consideram-se microempresas ou empresas de pequeno porte, a sociedade empresária, a sociedade simples, a empresa individual de responsabilidade limitada e o empresário a que se refere o artigo 966 do Código Civil em vigor, devidamente registrados no Registro de Empresas Mercantis ou no Registro Civil de Pessoas Jurídicas, conforme o caso, desde que:\n\nA) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 400.000,00 (quatrocentos mil reais); no caso de empresa de pequeno porte, aufira receita bruta superior a R$ 400.000,00 (quatrocentos mil reais) e igual ou inferior a R$ 4.800.000,00 (quatro milhões e oitocentos mil reais).\nB) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 360.000,00 (trezentos e sessenta mil reais); no caso de empresa de pequeno porte aufira receita bruta superior a R$ 360.000,00 (trezentos e sessenta mil reais) e igual ou inferior a R$ 4.800.000,00 (quatro milhões e oitocentos mil reais).\nC) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 380.000,00 (trezentos e oitenta mil reais); no caso de empresa de pequeno porte, aufira receita bruta superior a R$ 380.000,00 (trezentos e oitenta mil reais) e igual ou inferior a R$ 4.800.000,00 (quatro milhões e oitocentos mil reais).\nD) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 360.000,00 (trezentos e sessenta mil reais); no caso de empresa de pequeno porte, aufira receita bruta superior a R$ 360.000,00 (trezentos e sessenta mil reais) e igual ou inferior a R$ 5.000.000,00 (cinco milhões de reais).\nE) no caso da microempresa, aufira em cada ano-calendário, receita bruta igual ou inferior a R$ 400.000,00 (quatrocentos mil reais); no caso de empresa de pequeno porte aufira receita bruta superior a R$ 400.000,00 (quatrocentos mil reais) e igual ou inferior a R$ 5.000.000,00 (cinco milhões de reais).", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q13", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.13", "tema": "", "enun": "Cruz Machado pretende iniciar o exercício individual de empresa e adotar como firma, exclusivamente, o nome pelo qual é conhecido pela população de sua cidade – “Monsenhor”.\nDe acordo com as informações acima e as regras legais de formação de nome empresarial para o empresário individual, assinale a afirmativa correta.\n\nA) A pretensão de Cruz Machado é possivel, pois o empresário individual pode escolher livremente a formação de sua firma.\nB) A pretensão de Cruz Machado não é possivel, pois o empresário individual deve adotar denominação indicativa do objeto social como espécie de nome empresarial.\nC) A pretensão de Cruz Machado não é possivel, pois o empresário individual opera sob firma constituída por seu nome, completo ou abreviado.\nD) A pretensão de Cruz Machado é possivel, pois o empresário individual pode substituir seu nome civil por uma designação mais precisa de sua pessoa.\nE) A pretensão de Cruz Machado é possivel, pois o empresário individual opera sob firma constituída por seu nome completo aditando-lhe designação da atividade.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q14", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.14", "tema": "", "enun": "Constitui ato constitutivo da pessoa jurídica de direito privado\n\nA) a certidão simplificada.\nB) o registro de imóvel.\nC) a procuração pública.\nD) o balanço patrimonial.\nE) o contrato social.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q15", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.15", "tema": "", "enun": "Os serviços do Registro Público de Empresas Mercantis e Atividades Afins serão exercidos, em todo o território nacional, de maneira uniforme, harmônica e interdependente, pelo Sistema Nacional de Registro de Empresas Mercantis (Sinrem), composto pelos seguintes órgãos:\nI. Juntas comerciais.\nII. Tabelionatos.\nIII. Departamento de Registro Empresarial e Integração - DREI.\nIV. Serventias.\nA sequência correta é:\n\nA) As assertivas I, II, III e IV estão corretas.\nB) Apenas as assertivas I e III estão corretas.\nC) Apenas a assertiva III está incorreta.\nD) Apenas as assertivas I, II e III estão corretas.\nE) Apenas as assertivas II e III estão corretas.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q16", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.16", "tema": "", "enun": "Considera-se empresário quem exerce profissionalmente atividade econômica organizada para a produção ou a circulação de bens ou de serviços, exceto:\n\nA) quem exerce profissão intelectual, de natureza científica, literária ou artística, ainda com o concurso de auxiliares ou colaboradores.\nB) quem exerce profissão intelectual, de natureza científica, literária ou artística, ainda com o concurso de auxiliares ou colaboradores, que o exercício da profissão constituir elemento de empresa.\nC) Sociedades Anônimas.\nD) Sociedade empresárias.\nE) Bancos.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q17", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.17", "tema": "", "enun": "Homero, titular de uma empresa individual de responsabildade limitada no ramo de padaria, foi interditado judicialmente e declarado absolutamente incapaz para a prática dos atos da vida civil por conta de uma doença mental que lhe sobreveio. Para Homero, nesse caso, é:\n\nA) permitido continuar a empresa por meio de representante, mediante prévia autorização judicial, que não é passível de revogação;\nB) vedado continuar a empresa, ainda que por meio de representante;\nC) permitido continuar a empresa por meio de representante, mediante prévia autorização judicial, que poderá ser revogada, também judicialmente, sem prejuízo dos direitos de terceiros;\nD) permitido continuar a empresa por meio de representante, independentemente de prévia autorização judicial;\nE) permitido continuar a empresa por meio de representante, caso em que todos os bens que já possuía ao tempo da sua interdição ficarão sujeitos ao resultado da empresa, ainda que estranhos ao acervo desta.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q18", "bloco": "MÓDULO 2 — Empresário, Regime Empresarial Simplificado, Registro Escrituração e Nome Empresarial", "num": "Ex.18", "tema": "", "enun": "Tício o é empresário individual, devidamente inscrito no Registro de Empresas e no CNPJ há mais de dez anos. Com exceção dos bens legalmente impenhoráveis, respondem pelas obrigações contraídas por Tício no exercício da atividade econômica:\n\nA) somente os seus bens afetados à atividade econômica, mas limitadamente ao valor do capital da empresa;\nB) todos os seus bens, inclusive os não afetados à atividade econômica, desde que deferida judicialmente a desconsideração da personalidade jurídica da empresa;\nC) todos os seus bens;\nD) todos os seus bens, mas limitadamente ao valor do capital da empresa;\nE) somente os seus bens afetados à atividade econômica.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q1", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.1", "tema": "", "enun": "Assinale a alternativa correta acerca do estabelecimento, conforme disciplinado pelo Código Civil.\n\nA) O adquirente do estabelecimento responde pelo pagamento dos débitos anteriores à transferência, desde que regularmente contabilizados, continuando o devedor primitivo solidariamente responsável, quanto aos créditos vencidos, pelo prazo de dois anos a partir da publicação do trespasse.\nB) Não restando ao alienante bens suficientes para solver seu passivo, a eficácia da alienação do estabelecimento dependerá do pagamento de todos os credores, ou do consentimento expresso destes, no prazo de sessenta dias a partir da notificação.\nC) O contrato que tenha por objeto a alienação, usufruto ou arrendamento do estabelecimento, produzirá efeitos quanto a terceiros a partir da data em que se realize o trespasse.\nD) No caso de arrendamento do estabelecimento, não havendo autorização expressa, o arrendante não poderá fazer concorrência ao arrendatário, nos cinco anos subsequentes ao arrendamento, independentemente do prazo do contrato.\nE) A cessão dos créditos referentes ao estabelecimento transferido produzirá efeito em relação aos respectivos devedores, desde o momento da publicação da transferência, mas o devedor ficará exonerado se de boa-fé pagar ao cedente.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q2", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.2", "tema": "", "enun": "Matheus, empresário individual, pretende alugar um imóvel para instalar seu estabelecimento e nele localizar seu ponto empresarial. Antes de celebrar o contrato, ele procura você para, como advogado(a), informar-lhe sobre aspectos concernentes à locação não residencial.\nSobre a locação não residencial, assinale a afirmativa correta.\n\nA) Na ação de despejo que tiver por fundamento exclusivo o término do prazo contratual, tendo sido proposta a ação em até 30 dias do cumprimento de notificação ao locatário comunicando o intento de retomada, será concedida liminar para desocupação em quinze dias, ouvida a parte contrária e se prestada caução pelo autor no valor equivalente a dois meses de aluguel.\nB) Na locação não residencial de imóvel urbano, na qual o locador procede à prévia aquisição do imóvel especificado pelo pretendente à locação, a fim de que seja a este locado por prazo determinado, poderá ser convencionado no contrato a renúncia ao direito de revisão do valor dos aluguéis durante o prazo de vigência do contrato.\nC) Nas locações de espaço em shopping centers, o locador poderá recusar a renovação do contrato pleiteada pelo locatário se o imóvel vier a ser utilizado pelo locador, que não poderá ser destinado ao uso no mesmo ramo da atividade do locatário.\nD) Nas locações por prazo determinado de imóveis utilizados por estabelecimentos de ensino autorizados e fiscalizados pelo Poder Público, o contrato poderá ser rescindido por denúncia do locador, a qualquer tempo, independentemente de notificação ou aviso.\nE) Nenhuma das alternativas acima.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q3", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.3", "tema": "", "enun": "Determinado contrato de locação não residencial possui as seguintes características:\nI. O contrato foi celebrado por escrito e com prazo determinado de seis anos.\nII. O locatário está explorando o comércio no ramo de lavanderia há três anos e cinco meses ininterruptos, uma vez que no início da locação explorava o ramo alimentício.\nDe acordo com a Lei n° 8.245/91 (Locação Predial Urbana), no caso narrado, respeitadas as determinações legais pertinentes,\n\nA) não haverá direito a renovação, uma vez que ocorreu troca do ramo de exploração comercial.\nB) haverá direito a renovação do contrato por mais seis anos.\nC) haverá direito a renovação do contrato por no máximo mais cinco anos.\nD) não haverá direito a renovação, uma vez que o prazo mínimo exigido quando há troca do ramo de exploração comercial é de quatro anos na nova exploração.\nE) haverá direito a renovação do contrato por no máximo mais três anos.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q4", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.4", "tema": "", "enun": "A respeito de estabelecimento empresarial, aviamento e clientela, assinale a opção correta.\n\nA) Estabelecimento empresarial corresponde a um complexo de bens corpóreos organizados ao exercício de determinada empresa.\nB) O estabelecimento empresarial não é suscetível de avaliação econômica e, por consequência, não pode ser alienado.\nC) Aviamento refere-se à aptidão que determinado estabelecimento empresarial possui para gerar lucros\nD) De acordo com a doutrina, aviamento e clientela são sinônimos.\nE) Na legislação vigente, não há mecanismos de proteção legal à clientela.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q5", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.5", "tema": "", "enun": "Em relação às ações locativas, considere os seguintes enunciados:\nI. Nas ações de despejo, consignação em pagamento de aluguel e acessórios da locação, revisionais de aluguel e renovatórias de locação, os recursos interpostos contra as respectivas sentenças terão efeito meramente devolutivo, possibilitando sua execução provisória.\nII. Nas ações de despejo fundadas na falta de pagamento de aluguel e acessórios da locação, o pedido de rescisão da locação poderá ser cumulado com o pedido de cobrança dos aluguéis e acessórios da locação; nesta hipótese, citar-se-á o locatário para responder ao pedido de rescisão e o locatário e os fiadores para responderem ao pedido de cobrança, devendo ser apresentado, com a inicial, cálculo discriminado do valor do débito.\nIII. Na ação revisional de aluguel, de rito sumário, o aluguel fixado na sentença é devido a partir desse arbitramento, bem como as diferenças devidas durante a demanda, exigíveis de imediato à fixação de novo aluguel.\nIV. Na ação renovatória, a petição inicial deverá indicar o exato cumprimento do contrato, desde que o prazo mínimo a renovar e o tempo de exploração do comércio no mesmo ramo, ininterruptamente, pelo locatário, sejam de três anos.\nV. Nas locações ajustadas por escrito e por prazo igual ou superior a trinta meses, a resolução do contrato ocorrerá findo o prazo estipulado, independentemente de notificação ou aviso; findo o contrato ajustado, se o locatário continuar na posse do imóvel alugado por mais de trinta dias sem oposição do locador, presumir-se-á prorrogada a locação por prazo indeterminado, mantidas as demais cláusulas e condições do contrato.\n\nA) I, II e V.\nB) I, III e IV.\nC) II, III, IV e V.\nD) I, II e IV.\nE) III, IV e V.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q6", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.6", "tema": "", "enun": "Considera-se estabelecimento todo complexo de bens organizado, para exercício da empresa, por empresário ou por sociedade empresária. A esse respeito, o Código Civil vigente dispõe:\n\nA) o contrato que tenha por objeto a alienação, o usufruto ou arrendamento do estabelecimento só produzirá efeitos quanto a terceiros depois de averbado à margem da inscrição do empresário, ou da sociedade empresária, no Registro Público de Empresas Mercantis, e de publicado na imprensa oficial.\nB) a transferência, salvo disposição em contrário, importa a sub-rogação do adquirente nos contratos estipulados para exploração do estabelecimento, se não tiverem caráter pessoal, podendo os terceiros rescindir o contrato no prazo de um ano a contar da publicação da transferência, se ocorrer justa causa ou não, independente de responsabilidade do alienante.\nC) o adquirente do estabelecimento responde pelo pagamento dos débitos anteriores à transferência, independente de serem contabilizados, continuando o devedor primitivo solidariamente obrigado pelo prazo de cinco anos, a partir, quanto aos créditos vencidos, da publicação, e, quanto aos outros, da data do vencimento.\nD) a eficácia da alienação do estabelecimento, se ao alienante não restarem bens suficientes para solver o seu passivo, independe do pagamento de todos os credores, ou do consentimento destes, de modo expresso, em até dez dias a partir de sua notificação.\nE) O imóvel de uma sociedade empresarial utilizado exclusivamente como clube para seus funcionários integra o estabelecimento empresarial.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q7", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.7", "tema": "", "enun": "Ocorrendo a alienação de estabelecimento empresarial,\n\nA) o alienante só poderá fazer concorrência ao adquirente, depois de decorridos dois anos do recebimento do preço e, se foi a vista, decorridos dez anos no mesmo Município ou cinco anos em Municípios diferentes.\nB) o adquirente responde pelo pagamento dos débitos de natureza civil ou mercantil, anteriores à transferência, desde que regularmente contabilizados, continuando o devedor primitivo solidariamente obrigado pelo prazo de um ano, a partir, quanto aos créditos vencidos, da publicação, ressalvada a dispensa de publicação concedida às microempresas e empresas de pequeno porte, e, quanto aos outros créditos, da data do vencimento.\nC) a cessão dos créditos referentes ao estabelecimento transferido produzirá efeito em relação aos respectivos devedores, desde o momento da transferência, dada a publicidade da tradição, não podendo o devedor que pagar ao cedente alegar que o fez de boa-fé.\nD) se ao alienante não restarem bens suficientes para solver o seu passivo, a alienação do estabelecimento será ineficaz de pleno direito.\nE) o contrato que tenha esse objeto ou o usufruto ou arrendamento do estabelecimento produzirá efeitos imediatos quanto a terceiros, haja vista a celeridade e informalidade dos negócios empresariais.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q8", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.8", "tema": "", "enun": "Acerca da teoria do estabelecimento comercial, assinale a opção correta.\n\nA) É condição de eficácia perante terceiros o registro do contrato de trespasse na junta comercial e sua posterior publicação.\nB) Se não houver vedação expressa no contrato de trespasse, o alienante poderá constituir nova sociedade para explorar o mesmo ramo de atividade imediatamente após a alienação do estabelecimento.\nC) A ação renovatória de locação é uma proteção especial ao estabelecimento comercial e será julgada procedente mesmo que o locador não queira a renovação, desde que o locatário tenha no máximo um mês de inadimplência no contrato cuja renovação deseja.\nD) O estabelecimento empresarial, por ser o local onde o empresário exerce sua atividade empresarial, é impenhorável.\nE) O adquirente do estabelecimento comercial é responsável pelos débitos anteriores à transferência que não estejam contabilizados, pois estes seguem a coisa (in propter rem).", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q9", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.9", "tema": "", "enun": "Analise as seguintes assertivas sobre o estabelecimento:\nI. O estabelecimento empresarial tem natureza jurídica de massa patrimonial personificada, possuindo, portanto, personalidade jurídica própria.\nII. A chamada cláusula de proibição de concorrência nos contratos de trespasse tem natureza dispositiva, podendo ser afastada por acordo entre as partes.\nIII. O contrato de trespasse importa a sub-rogação do adquirente em todos os contratos estipulados para a exploração do estabelecimento.\nQuais estão corretas?\n\nA) Apenas I.\nB) Apenas III.\nC) Apenas I e II.\nD) Apenas II e III.\nE) Apenas II.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q10", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.10", "tema": "", "enun": "Quanto ao estabelecimento:\n\nA) A transferência do estabelecimento sempre importará a sub-rogação do adquirente nos contratos estipulados para exploração do estabelecimento tendo ou não caráter pessoal, facultado aos terceiros rescindir o contrato em noventa dias a contar da publicação da transferência.\nB) Os contratos que tenham por objeto a alienação, o usufruto ou o arrendamento do estabelecimento produzirão efeitos imediatos em relação a terceiros, pela presunção de publicidade deles decorrente.\nC) Seja qual for a situação patrimonial do passivo do alienante, a eficácia da alienação do estabelecimento depende do pagamento de todos os credores, ou do consentimento destes, necessariamente expresso, em trinta dias a partir de sua notificação.\nD) O adquirente do estabelecimento responde pelo pagamento dos débitos anteriores à transferência, contabilizados ou não, continuando o devedor primitivo solidariamente obrigado pelo prazo de um ano.\nE) Não havendo autorização expressa, o alienante do estabelecimento não pode fazer concorrência ao adquirente nos cinco anos subsequentes à transferência; no caso de arrendamento ou usufruto do estabelecimento essa proibição persistirá durante o prazo do contrato.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q11", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.11", "tema": "", "enun": "Uma empresária do ramo de moda alienou o seu estabelecimento para um primo, que ali deu continuidade à exploração da mesma atividade.\nNesse caso, de acordo com o Código Civil de 2002\n\nA) a empresária não pode fazer concorrência ao primo, nos cinco anos subsequentes à transferência, se não houver autorização expressa.\nB) a empresária não pode fazer concorrência ao primo, nos três anos subsequentes à transferência, se não houver autorização expressa.\nC) o rapaz não responde por débitos anteriores à transferência, desde que regularmente contabilizados, conforme consta no contrato de trespasse.\nD) o primo responde com exclusividade pelas dívidas vencidas, regularmente contabilizadas, pelo prazo de um ano a partir da publicação do contrato, conforme o contrato de trespasse.\nE) os dois respondem solidariamente pelas dívidas vencidas, regularmente contabilizadas, pelo prazo de dois anos a partir da publicação do contrato, conforme o contrato de trespasse.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q12", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.12", "tema": "", "enun": "O complexo de bens organizado, para exercício da empresa, por empresário, ou por sociedade empresária é chamado de:\n\nA) Estabelecimento.\nB) Estoque.\nC) Empresário.\nD) Empresa.\nE) Ações", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q13", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.13", "tema": "", "enun": "Ananias Targino consulta sua advogada para saber as providências que deve tomar para publicizar o trespasse do estabelecimento da Empresa Individual de Responsabilidade Limitada (EIRELI) por ele constituída e enquadrada como microempresa, cuja firma é Ananias Targino EIRELI ME.\nA advogada corretamente respondeu que :\n\nA) é dispensável qualquer publicização ou arquivamento do contrato de trespasse do estabelecimento por ser a EIRELI enquadrada como microempresa.\nB) é dispensável o arquivamento do contrato de trespasse no Registro Público de Empresas Mercantis, mas ele deverá ser publicado na imprensa oficial.\nC) é dispensável o arquivamento do contrato de trespasse no Registro Público de Empresas Mercantis, mas ele deverá ser publicado na imprensa oficial e em jornal de grande circulação.\nD) é dispensável a publicação do contrato de trespasse na imprensa oficial, mas ele deverá ser arquivado no Registro Público de Empresas Mercantis.\nE) é indispensável a publicação do contrato de trespasse na imprensa oficial; caso essa formalidade não seja observada, o negócio jurídico poderá anulável.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q14", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.14", "tema": "", "enun": "Com relação ao estabelecimento empresarial, assinale a alternativa correta.\n\nA) O contrato que tenha por objeto a alienação, o usufruto ou arrendamento do estabelecimento, só produzirá efeitos quanto às partes e a terceiros depois de averbado à margem da inscrição do empresário, ou da sociedade empresária, no Registro Público de Pessoas Jurídicas, e de publicado na imprensa local.\nB) O adquirente do estabelecimento responde pelo pagamento dos débitos anteriores à transferência, mesmo não contabilizados, continuando o devedor primitivo subsidiariamente obrigado, pelo prazo de três anos, a partir, quanto aos créditos vencidos, da publicação, e, quanto aos outros, da data do vencimento.\nC) A transferência do estabelecimento importa a sub-rogação do adquirente nos contratos estipulados para exploração do estabelecimento, se não tiverem caráter pessoal, podendo os terceiros rescindir o contrato em noventa dias a contar da publicação da transferência, se ocorrer justa causa, ressalvada, neste caso, a responsabilidade do alienante.\nD) Não havendo autorização expressa, o alienante do estabelecimento não pode fazer concorrência ao adquirente, nos dez anos subsequentes à transferência; no caso de arrendamento ou usufruto do estabelecimento, a proibição persistirá durante o prazo contratual, não podendo ser superior a cinco anos.\nE) A cessão dos créditos referentes ao estabelecimento transferido produzirá efeito em relação aos respectivos devedores, desde o momento da assinatura do contrato, e, a partir da publicação da transferência, o devedor que pagar ao cedente, mesmo de boa-fé, terá que pagar novamente ao adquirente.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q15", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.15", "tema": "", "enun": "O empresário individual José de Freitas alienou seu estabelecimento a outro empresário mediante os termos de um contrato escrito, averbado à margem de sua inscrição no Registro Público de Empresas Mercantis, publicado na imprensa oficial, mas não lhe restaram bens suficientes para solver o seu passivo.\nEm relação à alienação do estabelecimento empresarial nessas condições, sua eficácia depende\n\nA) da quitação prévia dos créditos trabalhistas e fiscais vencidos no ano anterior ao da alienação do estabelecimento.\nB) do pagamento a todos os credores, ou do consentimento destes, de modo expresso ou tácito, em trinta dias a partir de sua notificação.\nC) da quitação ou anuência prévia dos credores com garantia real e, quanto aos demais credores, da notificação da transferência com antecedência de, no mínimo, sessenta dias.\nD) do consentimento expresso de todos os credores quirografários ou da consignação prévia das importâncias que lhes são devidas.\nE) do consentimento de todos os credores, de modo expresso ou tácito, em noventa dias a partir de sua notificação.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q16", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.16", "tema": "", "enun": "Sobre a alienação de estabelecimento comercial, é correto afirmar que\n\nA) a sua validade está sujeita a prévia e expressa concordância de todos os credores do vendedor.\nB) o adquirente responde por todas as dívidas do alienante, relativas ao estabelecimento, ainda que não contabilizadas.\nC) se ao alienante não restarem bens suficientes para solver o seu passivo, a eficácia da alienação do estabelecimento dependerá do pagamento de todos os credores, ou do consentimento destes, de modo expresso ou tácito, em trinta dias a partir de sua notificação.\nD) se ao alienante não restarem bens suficientes para solver o seu passivo, a alienação do estabelecimento é passível de anulação por qualquer credor interessado.\nE) o alienante fica legalmente co-obrigado ao pagamento de todas as dívidas assumidas pelo adquirente nos dois primeiros anos seguintes à celebração do contrato.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q17", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.17", "tema": "", "enun": "Acerca da disciplina jurídica do estabelecimento empresarial, julgue os itens que se seguem.\nI Constitui o aviamento, ou goodwill of a trade, a mais valia do conjunto de bens do empresário em relação à soma dos valores individuais, relacionado à expectativa de lucros futuros.\nII O trespasse implica a transferência dos bens que compõem o estabelecimento empresarial e, por conseguinte, a transferência do aviamento.\nIII A clientela, produto da melhor organização da atividade empresarial, não se inclui entre os elementos que compõem o estabelecimento.\nIV No caso de alienação de estabelecimento empresarial, o alienante não pode, sem expressa autorização, fazer concorrência ao adquirente nos cinco anos subseqüentes à transferência.\nA quantidade de itens certos é igual a\n\nA) zero\nB) 1\nC) 2\nD) 3\nE) 4", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q18", "bloco": "MÓDULO 3 — Estabelecimento Empresarial; Clientela e Freguesia", "num": "Ex.18", "tema": "", "enun": "No que tange ao estabelecimento empresarial, é INCORRETO afirmar que:\n\nA) o alienante do estabelecimento assume responsabilidade subsidiária com o adquirente, pelo prazo de um ano a partir, quanto aos créditos vincendos, da publicação e, quanto aos outros, da data do vencimento\nB) o alienante do estabelecimento não pode fazer concorrência ao adquirente, nos cinco anos posteriores ao trepasse, salvo autorização expressa.\nC) o adquirente do estabelecimento é responsável pelo pagamento dos débitos anteriores à transferência, desde que regularmente contabilizados.\nD) se entende por estabelecimento empresarial o conjunto de bens corpóreos e incorpóreos utilizados pelo empresário no exercício de sua empresa.\nE) o estabelecimento pode ser objeto unitário de direitos e de negócios jurídicos, translativos ou constitutivos, que sejam compatíveis com a sua natureza.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q1", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.1", "tema": "", "enun": "Em matéria de propriedade industrial, assinale a alternativa incorreta:\n\nA) A patente somente pode ser requerida pelo autor da invenção/modelo de utilidade ou pelo cessionário;\nB) O inventor pode requerer a não divulgação de sua nomeação;\nC) Técnicas e métodos operatórios ou cirúrgicos não são considerados invenção nem modelo de utilidade;\nD) Obras arquitetônicas não são consideradas modelo de utilidade;\nE) Os direitos de propriedade industrial são considerados bens móveis.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q2", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.2", "tema": "", "enun": "Sociedade empresária obteve, em 2010, o registro da marca “Lord Ello”, para assinalar produtos que, mais tarde, tencionava fabricar. Devido a critérios internos, a fabricação foi adiada e a marca não foi usada. Em 2017, outra pessoa jurídica estuda adotar idêntico designativo, para assinalar produtos da mesma classe e do mesmo segmento consumidor. Indique a opção correta:\n\nA) Como o registro foi deferido à anterior requerente, o uso legítimo da marca, por outrem, exige licença, certo que, dentro dos dez anos de proteção inicial, é indiferente a falta de uso.\nB) Em regra, a falta de uso implica, após o prazo previsto em lei, nulidade absoluta do registro.\nC) A falta de uso pode gerar a anulação do registro, se decorrente de capricho ou de intuito de especulação, mas a invalidade não ocorre quando a abstenção é oriunda de critérios lógicos, como, no caso, prioridades mercadológicas da fabricante.\nD) Em princípio, afigura-se presente, no caso, hipótese de caducidade da marca, apta a ser requerida pela sociedade que apresenta interesse em adotá-la e pronunciada pelo Instituto Nacional de Propriedade Industrial.\nE) Em princípio, afigura-se presente, no caso, hipótese de caducidade da marca, apta a ser requerida pela sociedade que apresenta interesse em adotá-la e pronunciada pelo Instituto Nacional de Propriedade Industrial.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q3", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.3", "tema": "", "enun": "São patenteáveis:\n\nA) as descobertas, teorias científicas e métodos matemáticos.\nB) os microrganismos transgênicos que atendam aos requisitos de novidade, atividade inventiva e aplicação industrial, e que não sejam mera descoberta.\nC) as obras literárias, arquitetônicas, artísticas e científicas e qualquer criação estética.\nD) as técnicas cirúrgicas e métodos terapêuticos e de diagnóstico para aplicação no corpo animal, mas não no corpo humano.\nE) apenas as invenções que atendam os requisitos de novidade, atividade inventiva e aplicação industrial.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q4", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.4", "tema": "", "enun": "Um médico desenvolveu um importante método de diagnóstico de doença degenerativa para aplicação no corpo humano. O método é completamente desconhecido da comunidade técnica e industrial.\nConsiderando-se que o médico deseje patentear esse método, verifica-se que o que foi desenvolvido por ele:\n\nA) é patenteável como modelo de utilidade, desde que suscetível de aplicação industrial.\nB) é patenteável, desde que se comprove que a invenção atende aos requisitos de novidade, atividade inventiva e aplicação industrial.\nC) é patenteável se não estiver comprovadamente compreendido no estado da técnica.\nD) pode ser patenteável, desde que não seja contrário à moral, aos bons costumes e à segurança, à ordem e à saúde públicas;\nE) não é patenteável, não podendo ser considerado invenção ou modelo de utilidade.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q5", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.5", "tema": "", "enun": "Marca notoriamente conhecida em seu ramo de atividade goza de proteção:\n\nA) do direito industrial brasileiro, desde que registrada no INPI.\nB) exclusivamente em seu ramo de atuação, independentemente de estar previamente depositada ou registrada no Brasil.\nC) para preservar seu titular de usurpação, não sendo relevante nessa seara a proteção ao consumidor.\nD) em todos os ramos possíveis de atuação, sendo definida em lei como marca de alto renome registrada no Brasil.\nE) em todos os ramos da indústria, independentemente de registro no Brasil.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q6", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.6", "tema": "", "enun": "A respeito dos legitimados, assinale a opção que indica as pessoas que podem requerer patente de invenção ou modelo de utilidade, de acordo com a Lei nº 9.279/96.\n\nA) O próprio autor, se maior de 18 anos, os herdeiros ou sucessores do autor, o cessionário ou o empregador ou tomador de serviços, no caso de patente desenvolvida por empregado ou prestador de serviço.\nB) O próprio autor, os herdeiros ou sucessores do autor, o cessionário ou aquele a quem a lei ou o contrato de trabalho ou de prestação de serviços determinar que pertença a titularidade da patente ou do modelo de utilidade.\nC) O próprio autor, pessoa natural ou sociedade empresária, o cessionário da patente ou aquele a quem a lei ou o contrato de trabalho ou de prestação de serviços determinar que pertença a titularidade da patente ou do modelo de utilidade.\nD) O próprio autor, os herdeiros ou sucessores do autor até 5 (cinco) anos da data do óbito, o cessionário ou o empregador ou tomador de serviços, no caso de patente desenvolvida por empregado ou prestador de serviço.\nE) O próprio autor, desde que seja menor púbere, ou seja, o maior de 16 e menor de 18 anos de idade não-emancipado, os herdeiros ou sucessores do autor, o cessionário ou o empregador ou tomador de serviços, no caso de patente desenvolvida por empregado ou prestador de serviço.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q7", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.7", "tema": "", "enun": "A proteção dos direitos relativos à propriedade industrial, considerado o seu interesse social e o desenvolvimento tecnológico e econômico do País, efetua-se mediante concessões e repressão, exceto:\n\nA) concessão de patentes de invenção e de modelo de utilidade.\nB) concessão de registro de desenho industrial.\nC) concessão de registro de marca.\nD) repressão às falsas indicações geográficas; e repressão à concorrência desleal.\nE) proteção das topografias de circuitos integrados, ou seja, o desenho de chips eletrônicos, como são conhecidos.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q8", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.8", "tema": "", "enun": "A patente confere ao seu titular o direito de impedir terceiro, sem o seu consentimento, de produzir, usar, colocar à venda, vender ou importar:\n\nA) Produto com finalidade experimental, relacionados a estudos ou pesquisas científicas ou tecnológicas.\nB) Produto objeto de patente e processo ou produto obtido diretamente por processo patenteado.\nC) medicamento de acordo com prescrição médica para casos individuais, executada por profissional habilitado, bem como ao medicamento assim preparado.\nD) produto fabricado de acordo com patente de processo ou de produto que tiver sido colocado no mercado interno diretamente pelo titular da patente ou com seu consentimento.\nE) atos de produção de informações, dados e resultados de testes, executados por terceiro não autorizado, visando à obtenção de registro de comercialização para exploração econômica do objeto da patente, desde que expirado seu prazo de vigor.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q9", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.9", "tema": "", "enun": "Amambaí Inovação e Engenharia S/A obteve, junto ao Instituto Nacional da Propriedade Industrial (INPI), patente de invenção no ano de 2013. Dois anos após, chegou ao conhecimento dos administradores a prática de atos violadores de direitos de patente. No entanto, a ação para reparação de dano causado ao direito de propriedade industrial só foi intentada no ano de 2019. Você é consultado(a), como advogado(a), sobre o caso. Assinale a opção que apresenta seu parecer.\n\nA) A reparação do dano causado pode ser pleiteada, porque o direito de patente é protegido por 20 (vinte) anos, a contar da data do depósito.\nB) A pretensão indenizatória, na data da propositura da ação, encontrava-se prescrita, em razão do decurso de mais de 3 (três) anos.\nC) A pretensão indenizatória, na data da propositura da ação, não se encontrava prescrita porque o prazo de 5 (cinco) anos não havia se esgotado;\nD) A reparação do dano causado não pode ser pleiteada, porque a patente concedida não foi objeto de licenciamento pelo seu titular.\nE) A pretensão indenizatória, na data da propositura da ação, não se encontrava prescrita porque o prazo de 10 (dez) anos não havia se esgotado;", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q10", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.10", "tema": "", "enun": "Sumidouro Alimentos em Conserva Ltda. é titular da marca de produto Areal registrada, em 2004, no Instituto Nacional da Propriedade Industrial (INPI), nas classes 29 (cogumelos em conserva) e 31 (cogumelos frescos) da Classificação Internacional de Marcas de Nice. O registro da marca expirou em 30 de setembro de 2014, mas a sociedade empresária continuou empregando a marca nos produtos indicados nas classes acima, tendo solicitado a prorrogação ao INPI, em 28 de novembro de 2014, com pagamento de retribuição adicional. Considerando que o pedido de prorrogação foi feito após a expiração do registro da marca, o titular da marca poderia ainda requerer a prorrogação do registro?\n\nA) Sim, pois se o pedido de prorrogação não tiver sido efetuado até o termo final da vigência do registro, o titular poderá fazê-lo nos 12 (doze) meses subseqüentes, mediante o pagamento de retribuição adicional.\nB) Não, pois o pedido de prorrogação deverá ser formulado durante o dois últimos anos de vigência do registro, instruído com o comprovante do pagamento da respectiva retribuição.\nC) Não, pois o pedido de prorrogação deverá ser formulado durante o último ano de vigência do registro, instruído com o comprovante do pagamento da respectiva retribuição.\nD) Sim, pois se o pedido de prorrogação não tiver sido efetuado até o termo final da vigência do registro, o titular poderá fazê-lo nos 6 (seis) meses subseqüentes, mediante o pagamento de retribuição adicional.\nE) Não, pois o registro da marca vigorará pelo prazo de 10 (dez) anos, contados da data da concessão do registro e não é prorrogável.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q11", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.11", "tema": "", "enun": "O titular da marca não poderá, exceto:\n\nA) impedir que comerciantes ou distribuidores utilizem sinais distintivos que lhes são próprios, juntamente com a marca do produto, na sua promoção e comercialização.\nB) impedir que fabricantes de acessórios utilizem a marca para indicar a destinação do produto, desde que obedecidas as práticas leais de concorrência.\nC) impedir a livre circulação de produto colocado no mercado interno, por si ou por outrem com seu consentimento.\nD) impedir a citação da marca em discurso, obra científica ou literária ou qualquer outra publicação, desde que sem conotação comercial e sem prejuízo para seu caráter distintivo.\nE) ceder seu registro ou pedido de registro e licenciar seu uso.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q12", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.12", "tema": "", "enun": "Podem requerer registro de marca pessoas físicas ou jurídicas de direito público ou de direito privado. Sendo assim, é correto afirmar que:\n\nA) As pessoas de direito privado só podem requerer registro de marca relativo à atividade que exerçam efetiva e licitamente, de modo direto ou através de empresas que controlem direta ou indiretamente, declarando, no próprio requerimento, esta condição, sob as penas da lei.\nB) O registro de marca coletiva só poderá ser requerido por pessoa física representativa de coletividade, a qual poderá exercer atividade distinta da de seus membros.\nC) O registro da marca de certificação só poderá ser requerido por pessoa com interesse comercial ou industrial direto no produto ou serviço atestado.\nD) A reivindicação de prioridade isenta o pedido da aplicação da Lei de Propriedade Industrial.\nE) As pessoas de direito público só podem requerer registro de marca relativo à atividade que exerçam efetiva e licitamente, de modo direto ou através de empresas que controlem direta ou indiretamente, declarando, no próprio requerimento, esta condição, sob as penas da lei.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q13", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.13", "tema": "", "enun": "Caso dois autores tenham realizado a mesma invenção de forma independente,\n\nA) qualquer um deles poderá requerer a patente, mediante nomeação e qualificação do outro.\nB) aquele que comprovar a data de invenção mais antiga terá direito ao privilégio temporário para a utilização.\nC) aquele que primeiro obtiver o registro usufruirá do privilégio temporário para a utilização da invenção.\nD) aquele que provar o depósito mais antigo terá direito a obter a patente.\nE) qualquer um deles poderá requerer a patente, mas aquele que comprovar a data de invenção mais antiga terá direito ao privilégio temporário para a utilização.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q14", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.14", "tema": "", "enun": "Quanto à patentiabilidade, considera-se invenção:\n\nA) ato decorrente de atividade inventiva e desde que com aplicação industrial.\nB) objeto que apresente nova forma ou disposição, envolvendo ato inventivo, que resulte em melhoria funcional no seu uso ou em sua fabricação.\nC) plano publicitário.\nD) programa de computador em si.\nE) método de diagnóstico para aplicação no corpo humano.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q15", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.15", "tema": "", "enun": "Uma determinada empresa realiza uma campanha comercial na internet, para a qual, para aumentar o volume de acessos ao seu website, faz a compra de palavras-chave como links patrocinados no buscador para as situações em que uma pessoa, ao realizar uma busca por determinada palavra, acabe encontrando o endereço eletrônico da empresa. Dentre as palavras contratadas, a empresa também incluiu algumas que seriam a marca do produto de outra empresa concorrente. Tendo sido consultado para dar a sua recomendação jurídica sobre o caso, com base na legislação em vigor, é correto que\n\nA) todas as palavras podem ser contratadas pela empresa, sem risco jurídico, visto que não é possível a proteção como marca da palavra em si, pois ela é considerada uma informação livre da linguagem, artigo 124, inciso II da Lei n° 9.279/96, pelo princípio da especificidade, e não haveria aproveitamento parasitário em tal prática.\nB) a empresa deve ter cuidado para não contratar palavras-chave que sejam marcas registradas de produtos ou de empresas, pois pode incorrer no crime de concorrência desleal, artigo 195, inciso III da Lei n° 9.279/96.\nC) a empresa só deveria contratar palavras-chave para links patrocinados que fossem suas próprias marcas registradas, visto que não pode utilizar demais palavras de uso comum para essa finalidade.\nD) o uso de palavra-chave pela empresa, mesmo que ela já tenha sido objeto de registro como marca de outra empresa, não seria impeditivo para fins de busca, visto que a proteção das marcas se dá apenas na modalidade de logotipo, portanto o seu uso nominativo seria possível e não feriria o direito marcário.\nE) pela lei, bastaria que uma palavra-chave fosse um domínio de internet para que ela não pudesse ser contratada por uma outra empresa, que não a legítima detentora daquele domínio, não havendo o requisito de ter que ser marca registrada.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q16", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.16", "tema": "", "enun": "Sobre o desenho industrial e seu registro no Instituto Nacional da Propriedade Industrial (INPI), assinale a afirmativa correta.\n\nA) É registrável como desenho industrial qualquer obra ornamental de caráter puramente artístico, ou o conjunto ornamental de linhas e cores que possa ser aplicado a um produto, proporcionando resultado visual novo e original na sua configuração externa.\nB) O registro de desenho industrial vigorará pelo prazo de 20 (vinte) anos contados da data do depósito, prorrogável por até 2 (dois) períodos sucessivos de 10 (dez) anos cada, desde que seja requerida a prorrogação durante o último ano de vigência do registro.\nC) A ação de nulidade de registro de desenho industrial será ajuizada no foro da Justiça Estadual do domicílio do titular do registro, devendo o INPI ser notificado da propositura da ação para avaliar se tem interesse ou não em intervir no feito, quando não for autor.\nD) O pedido de registro que não atender às condições estabelecidas pelo INPI, mas contiver dados suficientes relativos ao depositante, ao desenho industrial e ao autor, poderá ser recebido, desde que sejam cumpridas, em 5 (cinco) dias, as exigências do INPI.\nE) O registro de desenho industrial vigorará pelo prazo de 15 (quinze) anos contados da data do depósito, prorrogável por até 2 (dois) períodos sucessivos de 5 (cinco) anos cada, desde que seja requerida a prorrogação durante o último ano de vigência do registro.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q17", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.17", "tema": "", "enun": "De acordo com a lei que regula os direitos e obrigações relativos à propriedade industrial, a ação para reparação de dano causado ao direito de propriedade industrial prescreve em:\n\nA) 06 (seis) meses.\nB) 05 (cinco) anos.\nC) 02 (dois) anos.\nD) 03 (três) anos.\nE) 04 (quatro) anos.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q18", "bloco": "MÓDULO 4 — Propriedade Industrial", "num": "Ex.18", "tema": "", "enun": "O prazo de vigência para o registro de marca, segundo disposto na Lei nº 9.279/96, é de\n\nA) 5 (cinco) anos, improrrogável.\nB) 5 (cinco) anos, prorrogável por 3 (três) períodos sucessivos de 5 (cinco) anos cada.\nC) 10 (dez) anos, improrrogável.\nD) 10 (dez) anos, prorrogável por períodos iguais e sucessivos.\nE) 70 (setenta) anos, improrrogável.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q1", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.1", "tema": "", "enun": "Cleber e Maurício estabelecem uma sociedade, mas os atos constitutivos dessa sociedade, embora elaborados e subscritos pelos interessados, não foram levados a registro. Maurício realizou contrato com terceiro em nome da sociedade, sem que Cleber tenha participado da negociação. Nesta situação,\n\nA) somente Maurício tem responsabilidade pelas obrigações contraídas e não tem direito ao benefício de ordem.\nB) somente Maurício tem responsabilidade pelas obrigações contraídas, mas é lhe assegurado o benefício de ordem.\nC) ambos os sócios respondem solidária e ilimitadamente pelas obrigações contraídas, mas somente Maurício está excluído do benefício de ordem.\nD) ambos os sócios respondem solidária e ilimitadamente pelas obrigações sociais e ambos têm assegurado o benefício de ordem.\nE) ambos os sócios respondem solidária e ilimitadamente pelas obrigações sociais, mas nenhum deles tem assegurado o benefício de ordem.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q2", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.2", "tema": "", "enun": "Não podem constituir sociedade, entre si ou com terceiros, os cônjuges casados pelos regimes:\n\nA) comunhão parcial e comunhão total;\nB) comunhão total e comunhão parcial;\nC) comunhão total e separação obrigatória;\nD) separação obrigatória e comunhão parcial.\nE) Nenhuma das alternativas acima.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q3", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.3", "tema": "", "enun": "Rodrigo e Manuela decidem desenvolver conjuntamente a atividade empresarial de fornecimento de materiais médico-hospitalares. Para tanto, realizam contrato válido com a finalidade de constituir a sociedade empresarial. Ocorre que o contrato social não foi levado à inscrição no respectivo registro. Considerando a situação descrita, assinale a afirmativa correta.\n\nA) A pessoa jurídica já possui existência legal, sendo certo que com a assinatura do contrato social haverá a separação patrimonial.\nB) A pessoa jurídica já possui existência legal, sendo certo que a assinatura do contrato social é a única etapa necessária para a existência legal da pessoa jurídica.\nC) A pessoa jurídica não possui existência legal, pois para tanto há a necessidade de levar o contrato social ao respectivo registro.\nD) A pessoa jurídica não possui existência legal, porém já há uma sociedade de fato com patrimônio separado da dos seus membros.\nE) A pessoa jurídica não possui existência legal, sendo que a falta de registro torna o contrato social firmado absolutamente nulo.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q4", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.4", "tema": "", "enun": "Nas sociedades não personificadas,\n\nA) os bens sociais, nas sociedades em comum, respondem pelos atos de gestão praticados por qualquer dos sócios, salvo pacto expresso limitativo de poderes, que somente terá eficácia contra o terceiro que o conheça ou deva conhecer.\nB) na sociedade em comum, os sócios, nas relações entre si ou com terceiros, podem provar a existência da sociedade por todos os meios de prova admitidos em direito, mas os terceiros só podem prová-la por escrito.\nC) a constituição da sociedade em conta de participação independe de formalidade, mas só pode provar-se documentalmente.\nD) o contrato social da sociedade em conta de participação produz efeito somente entre os sócios, mas a eventual inscrição de seu instrumento em qualquer registro confere personalidade jurídica à sociedade.\nE) na sociedade em conta de participação, como regra o sócio ostensivo pode admitir livremente novo sócio sem anuência expressa dos demais, por ser quem exerce a atividade constitutiva do objeto social.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q5", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.5", "tema": "", "enun": "Constituem deveres do liquidante da sociedade, segundo o artigo 1103 do Código Civil de 2002:\n\nA) Convocar assembléia dos quotistas, cada nove meses, para apresentar relatório e balanço do estado da liquidação, prestando conta dos atos praticados durante cada trimestre, ou sempre que necessário.\nB) Exigir dos quotistas, quando insuficiente o ativo à solução do passivo, a integralização de suas quotas e, se for o caso, as quantias necessárias, nos limites da responsabilidade de cada um e proporcionalmente à respectiva participação nas perdas, repartindo-se, entre os sócios insolventes e na mesma proporção, o devido pelo solvente.\nC) Ultimar os negócios da sociedade, realizar o ativo, pagar o passivo e partilhar o remanescente entre os sócios ou acionistas.\nD) Proceder no prazo improrrogável de vinte e cinco dias seguintes ao da sua investidura e com a assistência, sempre que possível, dos administradores, à elaboração do inventário e do balanço geral do ativo e do passivo.\nE) No curso da liquidação judicial, o juiz convocará o administrador judicial para presidir as assembleias gerais necessárias para deliberar sobre os interesses da sociedade, dirimindo, sumariamente, as dúvidas e litígios suscitados.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q6", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.6", "tema": "", "enun": "A desconsideração da personalidade jurídica\n\nA) é consequência necessária da ausência de arquivamento dos atos constitutivos da sociedade limitada.\nB) é admitida também para a responsabilização da sociedade por dívidas pessoais dos sócios.\nC) exige a prova do desvio de finalidade, mesmo quando se trate de relações de consumo.\nD) abrange também os empresários individuais, considerando sua função de assegurar o direito dos credores.\nE) nunca atinge o patrimônio de sócios que tenham se retirado da sociedade.", "gab": "B", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q7", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.7", "tema": "", "enun": "O contrato da sociedade do tipo simples Angélica Médicos Associados é omisso quanto à possibilidade de sucessão por morte de sócio. Inocência, uma das sócias, consulta você para saber qual a regra prevista no Código Civil para esse caso. Você respondeu corretamente que, com a morte de sócio,\n\nA) opera-se a dissolução da sociedade de pleno direito. Caberá a liquidação da quota do sócio falecido, cujo valor, considerado pelo montante efetivamente realizado, será apurado, com base no último balanço aprovado, salvo disposição contratual em contrário.\nB) opera-se a sucessão dos herdeiros do sócio falecido na sociedade. Os herdeiros poderão pleitear o levantamento de balanço de resultado econômico para verificação da situação patrimonial da sociedade à data do óbito, salvo disposição contratual em contrário.\nC) opera-se a resolução da sociedade em relação ao sócio falecido. Caberá a liquidação da quota do falecido, cujo valor, considerado pelo montante efetivamente realizado, será apurado, com base na situação patrimonial da sociedade à data do óbito, verificada em balanço especialmente levantado, salvo disposição contratual em contrário.\nD) opera-se a substituição do sócio falecido mediante acordo dos sócios remanescentes com os herdeiros. Os herdeiros poderão pleitear a liquidação da quota com base no valor econômico da sociedade, a ser apurado em avaliação por três peritos ou por sociedade especializada, mediante laudo fundamentado, salvo disposição contratual em contrário.\nE) opera-se a dissolução da sociedade de pleno direito. Caberá a liquidação da quota do sócio falecido, cujo valor, considerado pelo montante efetivamente realizado, será apurado, com base no último balanço aprovado, conforme disposição em lei.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q8", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.8", "tema": "", "enun": "Classificam-se como sociedade não personificada:\n\nA) a simples.\nB) a cooperativa e a sociedade em conta de participação.\nC) a sociedade em comum e a sociedade em conta de participação.\nD) a cooperativa e a em comandita simples.\nE) Nenhuma das alternativas.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q9", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.9", "tema": "", "enun": "A resolução de uma sociedade simples pode ocorrer por:\n\nA) decurso do prazo de duração ou por decisão majoritária dos sócios, quando a sociedade tiver prazo indeterminado.\nB) decisão unânime dos sócios e por perda da autorização legal para o funcionamento da sociedade.\nC) morte do sócio, se não houver disposição diferente no contrato social, ou por exclusão judicial do sócio devido a falta grave no cumprimento de obrigações societárias.\nD) falta de pluralidade de sócios por mais de cento e oitenta dias e por perda da autorização legal para o funcionamento da sociedade.\nE) morte do sócio, se não houver disposição diferente no contrato social, ou por decisão majoritária dos sócios, quando a sociedade tiver prazo indeterminado.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q10", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.10", "tema": "", "enun": "Terezinha, sócia minoritária e administradora da sociedade Z &amp; Cia. Ltda., com participação de 23% no capital social, foi excluída da sociedade por ter se apropriado de bens sociais e alienado-os de forma fraudulenta. A exclusão extrajudicial observou todos os requisitos legais, tendo sido inclusive, aprovada em assembleia própria, com quórum superior à metade do capital social. Após a deliberação, foi alterado o contrato social com a nova composição societária e realizado o arquivamento na Junta Comercial.\nEfetuado o registro da alteração contratual, Z &amp; Cia. Ltda. Deverá\n\nA) realizar a liquidação das quotas de Terezinha, com base no último balanço aprovado; a ex-socia não responderá pelas obrigações sociais anteriores porque, na sociedade limitada, sua responsabilidade é restrita ao valor do capital social.\nB) ser dissolvida, cabendo aos sócios remanescentes investir o liquidante em suas funções; a ex-sócia receberá o valor de suas quotas, apurado com base em balanço especial, no curso da liquidação, após o pagamento aos credores.\nC) reduzir compulsoriamente o capital, sendo vedado aos demais sócios suprir o valor da quota de Terezinha esta responderá subsidiariamente pelas obrigações sociais até dois anos contados da data da deliberação que a excluiu da sociedade.\nD) realizar a liquidação das quotas de Terezinha, com base em balanço especial; a ex-sócia responderá pelas obrigações sociais anteriores, até dois anos após a averbação da resolução da sociedade na Junta Comercial.\nE) realizar a liquidação das quotas de Terezinha, com base no último balanço aprovado; a ex-socia responderá apenas pelas obrigações sociais anteriores porque, na sociedade limitada, sua responsabilidade é não restrita ao valor do capital social.", "gab": "D", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q11", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.11", "tema": "", "enun": "A respeito da sociedade empresarial cujo contrato social não tenha ainda sido inscrito no órgão próprio, assinale a opção correta conforme a legislação pertinente.\n\nA) Bens particulares do sócio que não tiver contratado em nome da sociedade só poderão ser executados por dívidas da sociedade depois de executados os bens sociais.\nB) À situação em apreço é aplicável a teoria da desconsideração da personalidade jurídica, razão por que os patrimônios pessoais dos sócios poderão ser alcançados por dívidas da sociedade.\nC) Os bens e as dívidas sociais não constituem patrimônio especial, pois não há de se cogitar de patrimônio em comum dos sócios.\nD) Devido ao fato de ainda não estar inscrito no órgão próprio, o referido contrato não será considerado válido como prova de existência da sociedade.\nE) Devido ao fato de ainda não estar inscrito no órgão próprio, com relação à participação dos lucros e das perdas, o referido contrato não será considerado válido.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q12", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.12", "tema": "", "enun": "Um empresário emprestou elevada quantia em dinheiro a uma sociedade limitada do ramo de supermercados, regularmente constituída e com capital integralizado.\nCaso não haja o pagamento da dívida, de acordo com o Código Civil de 2002, a(o)\n\nA) integralização do capital impede que o patrimônio dos sócios responda pelas dívidas e obrigações contraídas pela sociedade, mesmo em casos de abuso da personalidade jurídica.\nB) patrimônio dos sócios e o patrimônio da pessoa jurídica, solidariamente, responderão pelas dívidas e obrigações nas sociedades limitadas com capital integralizado.\nC) patrimônio dos sócios responderá pelas dívidas e obrigações da sociedade, apenas se houver confusão patrimonial com comprovada má-fé dos sócios.\nD) patrimônio da sociedade responderá pelas dívidas e obrigações, assim como o patrimônio dos sócios, por força da teoria menor da desconsideração da personalidade jurídica.\nE) patrimônio que responderá pela dívida será o da sociedade; o patrimônio dos sócios responderia pela dívida na hipótese de desconsideração da personalidade jurídica.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q13", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.13", "tema": "", "enun": "No tocante às sociedades, é correto afirmar:\n\nA) O contrato de sociedade é firmado por duas ou mais pessoas, necessariamente naturais ou físicas, que buscam, pela conjugação de esforços e recursos, atingir um objetivo comum lucrativo, na forma prevista em seus atos constitutivos.\nB) A personificação jurídica da sociedade empresária faz com que passem a confundir-se a pessoa do sócio com a pessoa da sociedade, como regra geral.\nC) A aquisição da personalidade jurídica das sociedades ocorre por ocasião da inscrição de seus atos constitutivos, contrato social ou estatuto, no órgão registrário que lhe é próprio em razão de sua natureza jurídica específica.\nD) A sociedade não personificada juridicamente considera-se como inexistente em nosso sistema, dada sua irregularidade não gerando quaisquer efeitos obrigacionais em relação aos sócios ou a terceiros.\nE) Nas sociedades em comum, todos os sócios possuem responsabilidade subsidiária e limitada à participação social.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q14", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.14", "tema": "", "enun": "Sebastião e Marcelo constituíram uma sociedade sem que o documento de constituição tivesse sido levado a registro. Marcelo assumiu uma dívida em seu nome pessoal, mas no interesse da sociedade. Barros é credor de Marcelo pela referida obrigação. Barros poderá provar a existência da sociedade\n\nA) de qualquer modo, e os bens sociais respondem pelos atos de gestão praticados por Marcelo.\nB) somente por escrito, e os bens sociais respondem pelos atos de gestão praticados por Marcelo.\nC) de qualquer modo, e somente os bens particulares de Marcelo respondem pelos atos de gestão por ele praticados.\nD) somente por escrito, e os bens particulares de Marcelo e Sebastião respondem pelos atos de gestão praticados por Marcelo.\nE) de qualquer modo, e os bens sociais não respondem pelos atos de gestão praticados por Marcelo.", "gab": "A", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q15", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.15", "tema": "", "enun": "Quanto à Desconsideração da Personalidade Jurídica, podemos afirmar que:\n\nA) não é aceita em nosso direito;\nB) é aceita e aplicável nos casos de responsabilidade penal e não aos de responsabilidade civil dos dirigentes;\nC) tem aplicação restrita às relações de consumo;\nD) não tem aplicação em sociedades contratuais;\nE) foi desenvolvida pela jurisprudência e tem como pressuposto a fraude e o abuso de direito.", "gab": "E", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q16", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.16", "tema": "", "enun": "Sabe-se que o termo pessoa jurídica expressa um ente detentor de direitos e obrigações. Sendo assim, em relação ao nascimento da personalidade jurídica de uma sociedade é CORRETO afirmar que, para adquirir personalidade jurídica, ela deve ter seu ato constitutivo,\n\nA) (sempre contrato social), arquivado na Junta Comercial, se sociedade empresária.\nB) (estatuto social), arquivado no Registro Civil das Pessoas Jurídicas, se sociedade simples.\nC) (contrato social), registrado no Registro Civil das Pessoas Jurídicas, se sociedade simples.\nD) (contrato social ou estatuto social), arquivado no Cartório de Títulos e Documentos, se sociedade empresária.\nE) Nenhuma das alternativas.", "gab": "C", "gabLabel": "", "html": "", "repete": false, "repeteRef": "", "coment": []}, {"id": "M5-Q17", "bloco": "MÓDULO 5 — Teoria Geral das Sociedades Empresárias", "num": "Ex.17", "tema": "", "enun": "O contrato social é o instrumento através do qual se materializa o encontro de vontade dos sócios da sociedade empresária. A respeito dos requisitos e elementos de validade do contrato social da sociedade empresária, analise as assertivas a seguir.\nI. São requisitos do contrato social: agente capaz; objeto possível e lícito; forma prescrita ou não defesa em lei; todos os sócios devem contribuir para a formação do capital social e participarão dos resultados, positivos ou negativos.\nII. É nula a cláusula que exclua algum dos sócios dos lucros ou da participação nas perdas, bem como que
