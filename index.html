pretação jurisprudencial = autêntica\" → <strong>FALSO</strong> (autêntica = legislador)</li>\n<li>\"CPC adota teoria das fases processuais\" → <strong>FALSO</strong> (adota isolamento dos atos, art. 14)</li>\n<li>\"Tríplice garantia = apenas direito adquirido + coisa julgada\" → <strong>FALSO</strong> (falta ato jurídico perfeito)</li>\n<li>\"Inafastabilidade da jurisdição não tem exceção\" → <strong>FALSO</strong> (exceção: instância desportiva, art. 217, §1º CF)</li>\n<li>\"No CPC atual, legitimidade e interesse são condições da ação\" → <strong>FALSO</strong> (são pressupostos processuais)</li>\n<li>\"Juizados Especiais Estaduais têm competência absoluta\" → <strong>FALSO</strong> (relativa; Federais é que têm absoluta)</li>\n<li>\"Mediação visa garantir legitimidade dos ritos judiciais\" → <strong>FALSO</strong> (fins: desafogar Judiciário, pacificação, acesso)</li>\n</ol>"}], "top5": ["<b>Distinção mediação×conciliação</b> — cobrado em todos os módulos com variações", "<b>Autocomposição (desistência/submissão/transação)</b> — pegadinha da inversão entre submissão e desistência", "<b>Competência legislativa art. 22 × art. 24 CF</b> — cobrado com MP, Estados, procedimentos", "<b>Teoria do isolamento dos atos processuais (art. 14 CPC)</b> — três teorias, CPC adota isolamento", "<b>Pressupostos processuais + competência absoluta×relativa</b> — legitimidade ordinária×extraordinária, juizados, prorrogação"], "questoes": [], "sinteses": [], "cards": [{"id": "c1", "f": "Quais são as três formas de autocomposição?", "v": "Desistência (renúncia à pretensão) | Submissão (renúncia à resistência) | Transação (concessões recíprocas)"}, {"id": "c2", "f": "Qual a diferença entre conciliação e mediação?", "v": "Conciliação → sem vínculo anterior, conciliador PODE sugerir; Mediação → com vínculo anterior, mediador NÃO sugere, apenas facilita o diálogo"}, {"id": "c3", "f": "Para quais direitos é cabível a arbitragem?", "v": "Apenas direitos patrimoniais DISPONÍVEIS (Lei 9.307/96, art. 1º)"}, {"id": "c4", "f": "Cláusula compromissória × compromisso arbitral: qual a diferença?", "v": "Cláusula compromissória = convenção prévia para litígios FUTUROS (art. 4º Lei 9.307/96) | Compromisso arbitral = submete litígio JÁ EXISTENTE (art. 9º)"}, {"id": "c5", "f": "A autotutela é legalmente reconhecida?", "v": "NÃO — é crime (art. 345 CP). Exceções legais: legítima defesa da posse (art. 1.210, §1º CC) e legítima defesa/estado de necessidade (art. 23 CP)"}, {"id": "c6", "f": "Competência para legislar sobre direito processual: privativa ou concorrente?", "v": "PRIVATIVA da União (art. 22, I, CF) para direito processual; CONCORRENTE para procedimentos em matéria processual (art. 24, XI, CF)"}, {"id": "c7", "f": "Medidas provisórias podem versar sobre direito processual civil?", "v": "NÃO — vedação expressa (art. 62, §1º, I, \"b\", CF). Também vedado: penal e processual penal"}, {"id": "c8", "f": "Qual teoria de eficácia temporal a lei processual adota (art. 14 CPC)?", "v": "Teoria do isolamento dos atos processuais — lei nova aplica imediatamente, respeitados os atos já praticados"}, {"id": "c9", "f": "Quais são os limites constitucionais à retroatividade da lei processual?", "v": "Tríplice garantia (art. 5º, XXXVI, CF): direito adquirido + ato jurídico perfeito + coisa julgada"}, {"id": "c10", "f": "Vacatio legis — prazo padrão e marco inicial?", "v": "45 dias contados da PUBLICAÇÃO (não da promulgação) — art. 1º LINDB; 3 meses no exterior"}, {"id": "c11", "f": "Ordem de integração de lacunas (art. 4º LINDB)?", "v": "Analogia → Costumes → Princípios gerais de direito (equidade NÃO está no rol literal)"}, {"id": "c12", "f": "Qual é o \"super princípio\" do processo civil?", "v": "Devido processo legal (art. 5º, LIV, CF) — gênero do qual contraditório, ampla defesa, juiz natural etc. são espécies"}, {"id": "c13", "f": "O que proíbe o princípio do juiz natural?", "v": "Tribunal de exceção (art. 5º, XXXVII, CF); garante juiz pré-constituído e imparcial (art. 5º, LIII, CF)"}, {"id": "c14", "f": "Qual característica da jurisdição justifica a imparcialidade do juiz?", "v": "Característica SUBSTITUTIVA — o Estado substitui as partes na resolução do conflito"}, {"id": "c15", "f": "O que é jurisdição voluntária?", "v": "Administração de interesses privados sem lide; não há partes, mas interessados; ex.: inventário consensual, interdição"}, {"id": "c16", "f": "Qual teoria da ação o CPC/2015 adota?", "v": "Teoria da ASSERÇÃO — condições da ação são analisadas com base nas afirmações da petição inicial; legitimidade e interesse = pressupostos processuais; possibilidade jurídica = mérito"}, {"id": "c17", "f": "Competência absoluta × relativa: principal diferença prática?", "v": "Absoluta = interesse público, pode ser arguida a qualquer tempo e de ofício, NÃO prorroga | Relativa = interesse privado, deve ser arguida na contestação, PRORROGA se não arguida; admite foro de eleição"}, {"id": "c18", "f": "O que é perpetuação da competência (perpetuatio jurisdictionis)?", "v": "Competência fixada no momento do registro/distribuição da petição inicial (art. 43 CPC). Exceções: supressão do órgão ou alteração de competência ABSOLUTA"}, {"id": "c19", "f": "Ação real sobre imóvel: qual o foro competente e que tipo de competência é?", "v": "Foro da situação da coisa (art. 47 CPC); para ação possessória imobiliária é competência ABSOLUTA (art. 47, §2º)"}, {"id": "c20", "f": "Juizados Especiais Estaduais × Federais: competência relativa ou absoluta?", "v": "Estaduais = relativa (opção do demandante até 40 SM) | Federais = ABSOLUTA (art. 3º, §3º, Lei 10.259/01)"}], "cobertura": ["As questões comentadas vêm só dos Módulos 1 a 3. Dos Módulos 4 a 8 há apenas uma síntese, sem as questões.", "Os arquivos trazem gabarito e comentário. Enunciados e alternativas completas não vieram.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "revisao", "ref": "r7", "titulo": "Ponto em que a doutrina diverge", "texto": "O material trata legitimidade e interesse como “pressupostos processuais” e diz que o CPC abandonou a teoria eclética. Muitos autores veem legitimidade e interesse como requisitos de admissibilidade do mérito (art. 17 e art. 485, VI, do CPC), e a possibilidade jurídica do pedido deixou de ser condição. Em prova objetiva, siga a formulação do AVA."}, {"esc": "card", "ref": "c16", "titulo": "Ponto em que a doutrina diverge", "texto": "Mesmo ponto do Módulo 7: classificar legitimidade e interesse como “pressupostos processuais” é uma leitura do material. Siga o AVA."}, {"esc": "revisao", "ref": "r8", "titulo": "Artigo citado fora do lugar", "texto": "Na lista de competência absoluta aparece “territorial art. 47, §1º”. O §1º trata da opção do autor em certos casos. A competência absoluta da possessória imobiliária está no §2º, como no flashcard."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["883X"]={"cod": "883X", "revisao": [{"id": "r1", "titulo": "Princípios da Administração (LIMPE)", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Sigla</th>\n<th>Princípio</th>\n<th>Essência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L</strong></td>\n<td>Legalidade</td>\n<td>Adm. só faz o que a lei AUTORIZA (≠ particular: faz o que a lei não proíbe)</td>\n</tr>\n<tr>\n<td><strong>I</strong></td>\n<td>Impessoalidade</td>\n<td>Igualdade, sem favoritismo; atos imputados ao Estado, não ao agente (Teoria do Órgão)</td>\n</tr>\n<tr>\n<td><strong>M</strong></td>\n<td>Moralidade</td>\n<td>Agir com ética, boa-fé, lealdade, probidade</td>\n</tr>\n<tr>\n<td><strong>P</strong></td>\n<td>Publicidade</td>\n<td>Divulgação oficial obrigatória; regra é transparência, exceção é sigilo (segurança / intimidade)</td>\n</tr>\n<tr>\n<td><strong>E</strong></td>\n<td>Eficiência</td>\n<td>Rapidez + perfeição + rendimento (acrescido pela EC 19/98)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"pega\"><strong>PEGADINHA:</strong> Razoabilidade e proporcionalidade NÃO constam expressamente no art. 37 — são princípios implícitos.</p>\n<p><strong>Supraprincípios (Celso A. Bandeira de Mello):</strong> supremacia do interesse público + indisponibilidade do interesse público.</p>\n<p><strong>Princípios infraconstitucionais:</strong> presunção de legitimidade, continuidade, autotutela (Súm. 473 STF), motivação, razoabilidade, hierarquia.</p>"}, {"id": "r2", "titulo": "Poderes administrativos", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Poder</th>\n<th>Finalidade</th>\n<th>Espécies/Destaque</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Normativo</strong></td>\n<td>Atos gerais e abstratos (regulamento, portaria, resolução)</td>\n<td>Regulamento executivo (regra no BR) vs. autônomo (EC 32/2001, art. 84, VI)</td>\n</tr>\n<tr>\n<td><strong>Hierárquico</strong></td>\n<td>Subordinação entre órgãos da mesma PJ</td>\n<td>Delegar, avocar, punir, rever atos; NÃO existe no Judiciário/Legislativo em suas funções típicas</td>\n</tr>\n<tr>\n<td><strong>Disciplinar</strong></td>\n<td>Punir servidores e contratados</td>\n<td>Decorre do hierárquico; omissão = condescendência criminosa (CP, art. 320)</td>\n</tr>\n<tr>\n<td><strong>Polícia</strong></td>\n<td>Limitar liberdade/propriedade em prol do coletivo</td>\n<td>Atributos: <strong>discricionariedade, autoexecutoriedade, coercibilidade</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Atributos do Poder de Polícia:</strong></p>\n<ul>\n<li>Discricionariedade (regra), mas há atos vinculados (ex: licença para construir)</li>\n<li>Autoexecutoriedade = exigibilidade (meios indiretos) + executoriedade (meios diretos)</li>\n<li>Multa é exigível mas NÃO é executória (cobrança depende de execução fiscal)</li>\n</ul>\n<p><strong>Licença vs. Autorização:</strong></p>\n<ul>\n<li>Licença = vinculado, gera direito subjetivo</li>\n<li>Autorização = discricionário, atende interesse do particular</li>\n</ul>"}, {"id": "r3", "titulo": "Atos administrativos", "prob": "alta", "html": "<p><strong>Requisitos/Elementos — FF.COM:</strong></p>\n<ul>\n<li><strong>F</strong>orma (regra: escrita)</li>\n<li><strong>F</strong>inalidade (interesse público; no sentido restrito: fim especificado na lei)</li>\n<li><strong>C</strong>ompetência/Sujeito (vinculado, irrenunciável, imprescritível, improrrogável)</li>\n<li><strong>O</strong>bjeto (conteúdo; pode ser vinculado ou discricionário)</li>\n<li><strong>M</strong>otivo (pressuposto de fato e direito; ≠ motivação = exposição dos motivos)</li>\n</ul>\n<p><strong>Atributos — PAIT:</strong></p>\n<ul>\n<li>Presunção de legitimidade (juris tantum — relativa; inverte ônus da prova)</li>\n<li>Autoexecutoriedade</li>\n<li>Imperatividade/coercibilidade</li>\n<li>Tipicidade</li>\n</ul>\n<p><strong>Discricionariedade reside normalmente em:</strong> motivo + objeto.</p>\n<p><strong>Teoria dos Motivos Determinantes:</strong> se a Adm. indicou motivo (mesmo desnecessário), fica vinculada a ele. Se o motivo for falso/inexistente → ato nulo.</p>\n<p><strong>Extinção dos atos:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Revogação</th>\n<th>Anulação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Causa</td>\n<td>Inconveniência/inoportunidade</td>\n<td>Ilegalidade</td>\n</tr>\n<tr>\n<td>Efeito</td>\n<td>ex nunc (a partir de agora)</td>\n<td>ex tunc (retroativo)</td>\n</tr>\n<tr>\n<td>Quem</td>\n<td>Só Administração</td>\n<td>Adm. + Judiciário</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>NÃO podem ser revogados:</strong> atos vinculados, atos que esgotaram efeitos, atos que geraram direito adquirido.</p>"}, {"id": "r4", "titulo": "Organização administrativa", "prob": "alta", "html": "<p><strong>Concentração/Desconcentração</strong> — dentro da mesma PJ (hierarquia):</p>\n<ul>\n<li>Desconcentração: distribuição interna (Ministérios, Secretarias, Delegacias)</li>\n</ul>\n<p><strong>Centralização/Descentralização</strong> — entre PJs distintas:</p>\n<ul>\n<li>Descentralização por serviço (outorga): lei cria entidade com titularidade do serviço</li>\n<li>Adm. Indireta: Autarquia, Fundação, Empresa Pública, Sociedade de Economia Mista</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Entidade</th>\n<th>Natureza</th>\n<th>Criação</th>\n<th>Capital</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Autarquia</td>\n<td>Direito Público</td>\n<td>Lei específica</td>\n<td>Público</td>\n</tr>\n<tr>\n<td>Fundação pública</td>\n<td>Público ou Privado</td>\n<td>Lei específica (dir. púb.) / autorização (dir. priv.)</td>\n<td>Público</td>\n</tr>\n<tr>\n<td>Empresa Pública</td>\n<td>Direito Privado</td>\n<td>Autorização legislativa</td>\n<td>100% público; qualquer forma</td>\n</tr>\n<tr>\n<td>Soc. Economia Mista</td>\n<td>Direito Privado</td>\n<td>Autorização legislativa</td>\n<td>Misto; só S/A</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Diferenças EP x SEM:</strong> forma jurídica + capital + foro processual (EP federal = JF; SEM federal = JE).</p>\n<p><strong>Agência Reguladora:</strong> autarquia de regime especial — dirigentes com <strong>mandato fixo + estabilidade</strong> (não exoneração ad nutum).</p>\n<p><strong>Agência Executiva:</strong> qualificação dada a autarquia/fundação que celebra contrato de gestão — não é nova entidade (ex.: INMETRO).</p>\n<p><strong>OAB:</strong> entidade sui generis — NÃO é autarquia; não precisa de concurso público.</p>\n<p><strong>Terceiro Setor:</strong> direito privado, sem fins lucrativos, fora da Adm.</p>\n<ul>\n<li>Sistema S (SESI, SENAI, SEBRAE): parafiscalidade + Tribunal de Contas</li>\n<li>OS (Lei 9.637/98): contrato de gestão; saúde, ensino, pesquisa, meio ambiente, cultura</li>\n<li>OSCIP (Lei 9.790/99): termo de parceria</li>\n</ul>"}, {"id": "r5", "titulo": "Licitação (Lei 14.133/2021)", "prob": "media", "html": "<p><strong>Modalidades (nova lei):</strong> pregão, concorrência, concurso, leilão, diálogo competitivo.\n(Extintas: tomada de preços e convite)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Modalidade</th>\n<th>Objeto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pregão</td>\n<td>Bens e serviços comuns (menor preço ou maior desconto)</td>\n</tr>\n<tr>\n<td>Concorrência</td>\n<td>Bens/serviços especiais + obras de engenharia, qualquer valor</td>\n</tr>\n<tr>\n<td>Concurso</td>\n<td>Trabalho técnico/científico/artístico; critério: melhor técnica</td>\n</tr>\n<tr>\n<td>Leilão</td>\n<td>Alienação de bens imóveis ou móveis inservíveis (maior lance)</td>\n</tr>\n<tr>\n<td>Diálogo Competitivo</td>\n<td>Inovação tecnológica; necessidade não atendida pelo mercado</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Contratação direta:</strong></p>\n<ul>\n<li><strong>Dispensa:</strong> viabilidade de competição, mas lei autoriza não licitar (ex.: guerra, emergência, valores baixos R$100k obras / R$50k outros)</li>\n<li><strong>Inexigibilidade:</strong> inviabilidade de competição (fornecedor exclusivo, artista consagrado, serviço técnico especializado de notória especialização — exceto publicidade)</li>\n</ul>\n<p><strong>Princípio da vinculação ao edital:</strong> edital é a \"lei interna da licitação\" — nem a Adm. pode dele se afastar.</p>"}, {"id": "r6", "titulo": "Contratos administrativos", "prob": "media", "html": "<p><strong>Cláusulas exorbitantes (art. 104, Lei 14.133/21):</strong></p>\n<ol>\n<li>Modificação unilateral</li>\n<li>Extinção unilateral</li>\n<li>Fiscalização</li>\n<li>Aplicação de sanções</li>\n<li>Ocupação provisória de bens</li>\n</ol>\n<p><strong>Equilíbrio econômico-financeiro:</strong> direito do contratado (art. 37, XXI, CF) — rebus sic stantibus / teoria da imprevisão.</p>\n<p><strong>Fato do Príncipe:</strong> medida geral do Estado que onera indiretamente o contrato.\n<strong>Fato da Administração:</strong> ação/omissão direta do contratante que prejudica a execução.</p>\n<p><strong>Acréscimos/supressões obrigatórios:</strong> até 25% (obras/serviços/compras) e 50% (reforma de edifícios/equipamentos).</p>\n<p><strong>Rescisão:</strong> unilateral (Adm.), consensual ou judicial/arbitral.</p>"}, {"id": "r7", "titulo": "Servidor público", "prob": "alta", "html": "<p><strong>Classificação de agentes públicos:</strong></p>\n<ul>\n<li>Agentes políticos (chefes do Executivo, parlamentares, magistrados, MP)</li>\n<li>Servidores estatutários (cargo público, regime estatutário — Lei 8.112/90)</li>\n<li>Empregados públicos (emprego público, CLT — EP e SEM)</li>\n<li>Contratados temporários (art. 37, IX CF — sem concurso, processo seletivo simplificado)</li>\n<li>Particulares em colaboração (mesários = honoríficos; concessionários = delegados; gestores de negócio)</li>\n</ul>\n<p><strong>Cargo em comissão x Função de confiança:</strong></p>\n<ul>\n<li>Comissão: livre nomeação E exoneração (ad nutum), sem concurso</li>\n<li>Função de confiança: SOMENTE para servidores de carreira</li>\n</ul>\n<p><strong>Estabilidade:</strong> 3 anos de estágio probatório. Perde o cargo por: sentença judicial, PAD, avaliação de desempenho ou redução de despesas (LRF).</p>\n<p><strong>Vitaliciedade (magistrados, MP, TCU):</strong> estágio de 2 anos; perde só por sentença judicial.</p>\n<p><strong>Aposentadoria (art. 40, CF):</strong></p>\n<ul>\n<li>Invalidez permanente (proventos proporcionais, salvo acidente/doença grave)</li>\n<li>Compulsória: 75 anos</li>\n<li>Voluntária: requisitos de tempo/contribuição</li>\n</ul>\n<p><strong>Acumulação lícita (art. 37, XVI, CF):</strong></p>\n<ul>\n<li>2 cargos de professor</li>\n<li>1 professor + 1 técnico/científico</li>\n<li>2 cargos de profissional de saúde com profissão regulamentada</li>\n</ul>\n<p><strong>Concurso público:</strong> validade até 2 anos, prorrogável 1x por igual período. NÃO existe concurso só de títulos.</p>\n<p><strong>Responsabilidade do servidor:</strong> civil + penal + administrativa (independentes). Absolvição penal por inexistência do fato ou negativa de autoria afasta responsabilidade adm. e civil.</p>"}], "top5": ["<b>Princípios LIMPE</b> — art. 37, distinção implícito/explícito, aplicação prática", "<b>Atos administrativos</b> — requisitos FF.COM, atributos PAIT, revogação x anulação, teoria dos motivos determinantes", "<b>Poderes administrativos</b> — poder de polícia (atributos), disciplinar x hierárquico, normativo", "<b>Organização administrativa</b> — diferenças EP x SEM, agências reguladoras, desconcentração x descentralização", "<b>Servidor público</b> — estabilidade, acumulação de cargos, cargo em comissão x função de confiança, tipos de aposentadoria"], "questoes": [], "sinteses": [], "cards": [{"id": "c1", "f": "Qual o mnemônico dos princípios constitucionais expressos no art. 37, caput CF?", "v": "<b>LIMPE</b> — Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Razoabilidade e proporcionalidade NÃO constam expressamente."}, {"id": "c2", "f": "Qual a diferença entre o princípio da legalidade para o particular e para a Administração?", "v": "Particular faz tudo que a lei <b>não proíbe</b>. Administração só faz o que a lei <b>expressamente autoriza</b> (Hely Lopes Meirelles)."}, {"id": "c3", "f": "Quais são os atributos do ato administrativo? (mnemônico PAIT)", "v": "<b>P</b>resunção de legitimidade (juris tantum), <b>A</b>utoexecutoriedade, <b>I</b>mperatividade/coercibilidade, <b>T</b>ipicidade. Finalidade é <b>requisito</b>, não atributo."}, {"id": "c4", "f": "Quais são os 5 requisitos/elementos de validade do ato administrativo?", "v": "<b>FF.COM</b> — Forma, Finalidade, Competência (sujeito), Objeto (conteúdo), Motivo. Base: art. 2º, Lei 4.717/65."}, {"id": "c5", "f": "Qual a diferença entre revogação e anulação de ato administrativo?", "v": "<b>Revogação</b> = inconveniência/inoportunidade, efeitos <b>ex nunc</b> (a partir de agora), só pela Administração. <b>Anulação</b> = ilegalidade, efeitos <b>ex tunc</b> (retroativo), pela Adm. ou Judiciário."}, {"id": "c6", "f": "O que é a Teoria dos Motivos Determinantes?", "v": "Se a Administração indicou motivos para praticar o ato (mesmo desnecessário), fica vinculada a eles. Motivo falso ou inexistente = ato nulo, inclusive nos casos de exoneração ad nutum com motivo declarado."}, {"id": "c7", "f": "Quais são os atributos do poder de polícia?", "v": "<b>Discricionariedade</b> (regra; há atos vinculados como licença para construir), <b>Autoexecutoriedade</b> (exigibilidade + executoriedade) e <b>Coercibilidade</b>. Multa é exigível mas NÃO executória."}, {"id": "c8", "f": "Qual a diferença entre licença e autorização no poder de polícia?", "v": "<b>Licença</b> = ato vinculado, gera direito subjetivo (se preenchidos requisitos, não pode ser negada). <b>Autorização</b> = ato discricionário, pode ser negada por interesse público mesmo preenchidos os requisitos."}, {"id": "c9", "f": "Qual a diferença entre desconcentração e descentralização?", "v": "<b>Desconcentração</b> = distribuição interna de competências dentro da mesma PJ, mantendo hierarquia (ex: Ministérios, Secretarias). <b>Descentralização</b> = transferência para PJ distinta (Autarquias, EP, SEM, Fundações)."}, {"id": "c10", "f": "Quais as diferenças entre Empresa Pública e Sociedade de Economia Mista?", "v": "<b>EP</b> = capital 100% público, qualquer forma jurídica, foro na Justiça Federal (federal). <b>SEM</b> = capital misto (maioria votante pública), só S/A, foro na Justiça Estadual (federal). Ambas são PJ de direito privado."}, {"id": "c11", "f": "O que são agências reguladoras? Como diferem das autarquias comuns?", "v": "São <b>autarquias sob regime especial</b> com mandato fixo e estabilidade dos dirigentes (não exoneração ad nutum). Diferem das autarquias comuns exatamente por essa proteção contra ingerência política."}, {"id": "c12", "f": "Qual a natureza jurídica da OAB?", "v": "Entidade <b>sui generis</b> — não é autarquia, não integra a Adm. Indireta da União. Não precisa realizar concurso público para contratar. (STF, ADI 3.026/2006)"}, {"id": "c13", "f": "Quais as modalidades de licitação da Lei 14.133/2021?", "v": "<b>Pregão</b> (bens/serviços comuns), <b>Concorrência</b> (bens/serviços especiais + obras, qualquer valor), <b>Concurso</b> (trabalho técnico/artístico), <b>Leilão</b> (alienação de bens), <b>Diálogo Competitivo</b> (inovação tecnológica). Extintos: tomada de preços e convite."}, {"id": "c14", "f": "Qual a diferença entre dispensa e inexigibilidade de licitação?", "v": "<b>Dispensa</b> = há viabilidade de competição, mas a lei autoriza não licitar por razões de conveniência (ex.: emergência, guerra, valores baixos). <b>Inexigibilidade</b> = inviabilidade de competição (fornecedor exclusivo, artista consagrado, notória especialização)."}, {"id": "c15", "f": "O que são cláusulas exorbitantes nos contratos administrativos?", "v": "Prerrogativas especiais da Administração: modificação unilateral, extinção unilateral, fiscalização, aplicação de sanções e ocupação provisória de bens. Não se admite alteração unilateral das cláusulas <b>econômico-financeiras</b>."}, {"id": "c16", "f": "Quais os percentuais de acréscimos/supressões obrigatórios nos contratos adm.?", "v": "Até <b>25%</b> para obras, serviços ou compras. Até <b>50%</b> no caso de acréscimos para reformas de edifícios ou equipamentos. (art. 65, §1º lei 8.666 / art. 125 lei 14.133)"}, {"id": "c17", "f": "Quais as modalidades de aposentadoria do servidor público (art. 40 CF)?", "v": "<b>Invalidez permanente</b> (proventos proporcionais, salvo acidente/doença grave = integrais), <b>Compulsória</b> aos 75 anos (EC 88/2015), <b>Voluntária</b> (tempo de contribuição + idade)."}, {"id": "c18", "f": "Quais as acumulações lícitas de cargos públicos (art. 37, XVI CF)?", "v": "(1) 2 cargos de <b>professor</b>; (2) 1 cargo de <b>professor + 1 técnico ou científico</b>; (3) 2 cargos de profissional de <b>saúde</b> com profissão regulamentada. Exige compatibilidade de horários."}, {"id": "c19", "f": "Qual a diferença entre cargo em comissão e função de confiança?", "v": "<b>Cargo em comissão</b>: livre nomeação e exoneração (ad nutum), pode ser ocupado por qualquer pessoa (sem concurso). <b>Função de confiança</b>: exclusiva para <b>servidores de carreira</b>. Ambos para direção, chefia e assessoramento (art. 37, V CF)."}, {"id": "c20", "f": "Quando a absolvição penal do servidor repercute nas esferas administrativa e civil?", "v": "Somente quando a absolvição se basear na <b>inexistência do fato</b> ou na <b>negativa de autoria</b>. Absolvição por falta de provas ou outros fundamentos NÃO afasta a responsabilidade adm. e civil. (art. 125 Lei 8.112/90)"}], "cobertura": ["São 96 questões (8 módulos de 12), com gabarito e comentário. Enunciados e alternativas completas não vieram.", "A revisão usa a Lei 14.133/2021, mas várias questões do AVA ainda se baseiam na Lei 8.666/1993.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "card", "ref": "c20", "titulo": "Artigo da Lei 8.112 provavelmente errado", "texto": "A regra de que a absolvição criminal por inexistência do fato ou negativa de autoria afasta a responsabilidade administrativa está no art. 126 da Lei 8.112/90. O art. 125 trata da independência das instâncias."}, {"esc": "card", "ref": "c17", "titulo": "Regra de aposentadoria que mudou", "texto": "A EC 103/2019 passou a chamar a invalidez de incapacidade permanente e alterou o cálculo dos proventos (integrais, em regra, só em acidente de trabalho, doença profissional e doença do trabalho). A versão “proporcionais, salvo doença grave” é a regra antiga. Veja qual versão o AVA cobra."}, {"esc": "revisao", "ref": "r7", "titulo": "Regra de aposentadoria que mudou", "texto": "Mesma observação do flashcard sobre aposentadoria por invalidez: a EC 103/2019 mudou a regra. Veja qual versão o AVA cobra."}, {"esc": "revisao", "ref": "r5", "titulo": "Valores de dispensa desatualizados", "texto": "Os valores de R$ 100 mil e R$ 50 mil são os originais da lei. Desde 1º/01/2026, pelo Decreto 12.807/2025, são R$ 130.984,20 (obras e engenharia) e R$ 65.492,11 (demais serviços e compras). Para a prova, vale o que o AVA disser."}]};</script><script>window.DADOS=window.DADOS||{};window.DADOS["18A1"]={"cod": "18A1", "revisao": [{"id": "r1", "titulo": "DIREITO COMERCIAL — NOÇÕES GERAIS", "prob": "media", "html": "<ul>\n<li><strong>Direito Comercial</strong> = direito privado regulador dos atos necessários às atividades dos comerciantes e dos atos legalmente considerados comerciais</li>\n<li><strong>Surgiu na Idade Média</strong> (corporações de comerciantes) — <strong>NÃO na Roma Antiga</strong> (lá havia o jus civile para todos)</li>\n<li><strong>CC/2002</strong> unificou obrigações civis e comerciais — inspirado no modelo <strong>italiano de 1942</strong>; revogou o Código Comercial de 1850 (1ª parte)</li>\n</ul>\n<p><strong>Teorias do DC:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Teoria</th>\n<th>Fundamento</th>\n<th>Status</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Direito do Comerciante</td>\n<td>Pessoa do comerciante</td>\n<td>Superada</td>\n</tr>\n<tr>\n<td>Direito dos Atos de Comércio</td>\n<td>Natureza do ato (Cód. Napoleônico 1807)</td>\n<td>Superada</td>\n</tr>\n<tr>\n<td>Direito das Empresas</td>\n<td>Organização capital + trabalho</td>\n<td>Atual</td>\n</tr>\n<tr>\n<td>Comerciantes + Atos de Comércio</td>\n<td>Misto</td>\n<td>Mais aceita classicamente</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Características do DC:</strong> simplicidade, internacionalidade, rapidez, boa-fé, onerosidade</p>\n<p><strong>DC ≠ Direito Civil:</strong> imóveis e atividade agrícola = civil | títulos cambiários = sempre comercial</p>\n<p><strong>Principais leis:</strong> CC/2002 (Lei 10.406), LSA (Lei 6.404/76), Lei do Cheque (7.357/85), LPI (9.279/96), LRE (11.101/05), Estatuto ME/EPP (LC 123/06)</p>"}, {"id": "r2", "titulo": "EMPRESÁRIO (art. 966 CC)", "prob": "alta", "html": "<p><strong>Conceito:</strong> quem exerce <em>profissionalmente</em> atividade econômica <em>organizada</em> para produção/circulação de bens ou serviços</p>\n<p><strong>Requisitos:</strong> profissionalismo (habitualidade + pessoalidade + especialidade) + atividade econômica + organização + produção/circulação</p>\n<p><strong>NÃO é empresário</strong> (art. 966 § único): profissão intelectual (científica, literária, artística) — <strong>salvo</strong> se for <em>elemento de empresa</em></p>\n<p><strong>Empresário rural:</strong> registro na Junta Comercial é <strong>FACULTATIVO</strong> (art. 971 CC) e pode ser feito <strong>após</strong> o início das atividades</p>\n<p><strong>Comparativo de portes (LC 123/06 art. 3º):</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Porte</th>\n<th>Receita bruta anual</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>MEI</td>\n<td>até R$ 81 mil</td>\n</tr>\n<tr>\n<td>ME (Microempresa)</td>\n<td>até R$ 360.000</td>\n</tr>\n<tr>\n<td>EPP (Emp. Peq. Porte)</td>\n<td>R$ 360.001 a R$ 4.800.000</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>MEI (LC 128/08):</strong> 1 empregado permitido; recolhe INSS 5% + ISS/ICMS fixo; não pode ser sócio de outra empresa; não pode ter sócio</p>"}, {"id": "r3", "titulo": "TIPOS DE PESSOA JURÍDICA EMPRESARIAL", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Responsabilidade</th>\n<th>Capital mínimo</th>\n<th>Registro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Empresário Individual</td>\n<td>Ilimitada, pessoal e direta</td>\n<td>—</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>SLU (ex-EIRELI)</td>\n<td>Limitada ao capital</td>\n<td>100× maior salário mínimo</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Sociedade Ltda</td>\n<td>Limitada ao valor das quotas</td>\n<td>—</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Sociedade Anônima</td>\n<td>Limitada ao preço de emissão</td>\n<td>—</td>\n<td>JUCEX</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Nome empresarial:</strong></p>\n<ul>\n<li>Firma = usa nome dos sócios</li>\n<li>Denominação = fantasia + objeto social</li>\n<li><strong>NÃO pode ser alienado</strong> (art. 1.164 CC) — princípios: veracidade e novidade</li>\n<li>Sociedade em conta de participação <strong>NÃO tem</strong> firma nem denominação</li>\n</ul>\n<p><strong>Registro — JUCEX (Lei 8.934/94):</strong> publicidade, autenticidade, segurança, eficácia</p>"}, {"id": "r4", "titulo": "ESTABELECIMENTO EMPRESARIAL (art. 1.142 CC)", "prob": "alta", "html": "<ul>\n<li><strong>Estabelecimento</strong> = complexo de bens (materiais e imateriais) organizado para exercício da empresa; universalidade <strong>de fato</strong></li>\n<li><strong>Aviamento</strong> = aptidão/capacidade potencial de gerar lucros (intangível, atributo do estabelecimento, não do empresário)</li>\n<li><strong>Clientela</strong> = conjunto de clientes que frequentam o estabelecimento (elemento imaterial)</li>\n</ul>\n<p><strong>Trespasse (alienação do estabelecimento):</strong></p>\n<ul>\n<li>Credores podem impugnar em <strong>30 dias</strong> após publicação</li>\n<li>Alienante não pode se restabelecer como concorrente por <strong>5 anos</strong> (art. 1.147 CC)</li>\n<li>Adquirente assume contratos vinculados, salvo estipulação contrária (art. 1.148 CC)</li>\n<li>Adquirente responde solidariamente com alienante antes da quitação das dívidas</li>\n</ul>\n<p><strong>Ação renovatória (ponto empresarial):</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Requisito</th>\n<th>Detalhe</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Contrato por escrito</td>\n<td>Obrigatório</td>\n</tr>\n<tr>\n<td>Prazo mínimo</td>\n<td>5 anos (pode ser soma de contratos)</td>\n</tr>\n<tr>\n<td>Ramo mínimo</td>\n<td>3 anos</td>\n</tr>\n<tr>\n<td>Quando propor</td>\n<td>1 ano antes e até 6 meses antes do término</td>\n</tr>\n</tbody>\n</table></div>"}, {"id": "r5", "titulo": "PROPRIEDADE INDUSTRIAL (Lei 9.279/96) — INPI", "prob": "media", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Prazo de proteção</th>\n<th>Renovável?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Patente de invenção</td>\n<td>20 anos do depósito</td>\n<td>Não</td>\n</tr>\n<tr>\n<td>Modelo de utilidade</td>\n<td>15 anos do depósito</td>\n<td>Não</td>\n</tr>\n<tr>\n<td>Desenho industrial</td>\n<td>10 anos do depósito</td>\n<td>Sim, 3× de 5 anos → máx. 25 anos</td>\n</tr>\n<tr>\n<td>Marca</td>\n<td>10 anos do registro</td>\n<td>Sim, indefinidamente</td>\n</tr>\n<tr>\n<td>Segredo industrial</td>\n<td>Sem prazo</td>\n<td>— (protegido enquanto em sigilo)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Marcas NÃO registráveis:</strong> brasões/emblemas oficiais; letras/números isolados sem forma distintiva; expressões contrárias à moral; siglas de órgãos públicos; sinais genéricos/descritivos; nomes civis de terceiros sem consentimento; obras artísticas protegidas por direito autoral</p>\n<p><strong>Indicação Geográfica:</strong> IP (Indicação de Procedência = local com reputação) vs. DO (Denominação de Origem = local + qualidade ligada ao meio)</p>\n<p><strong>Caducidade de marca:</strong> falta de uso por <strong>5 anos consecutivos</strong> após a concessão (art. 143 LPI)</p>\n<p><strong>Marca de alto renome:</strong> proteção em <strong>todos</strong> os ramos de atividade (reconhecida pelo INPI)</p>\n<p><strong>Crime de concorrência desleal:</strong> art. 195 LPI</p>"}, {"id": "r6", "titulo": "TEORIA GERAL DAS SOCIEDADES", "prob": "alta", "html": "<p><strong>Sociedade empresária</strong> (art. 982): objeto = atividade de empresário sujeita a registro | <strong>Sociedade simples</strong> = atividade intelectual → registro no RCPJ (NÃO na Junta Comercial)</p>\n<p><strong>Personalidade jurídica:</strong> começa com o <strong>registro</strong> (art. 985 CC)</p>\n<p><strong>Cônjuges impedidos de se associar entre si (art. 977 CC):</strong> regime de <strong>comunhão universal</strong> OU <strong>separação obrigatória</strong> de bens</p>\n<p><strong>Desconsideração da PJ (art. 50 CC):</strong> abuso/desvio de finalidade ou confusão patrimonial → incidente processual (art. 133 CPC)</p>\n<p><strong>Desconsideração inversa:</strong> responsabiliza a <strong>sociedade</strong> por dívidas pessoais dos sócios (art. 50 §§ 2º e 3º CC)</p>\n<p><strong>Sociedades não personificadas:</strong> em comum (sem registro) e em conta de participação</p>"}, {"id": "r7", "titulo": "ESPÉCIES DE SOCIEDADE", "prob": "alta", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Responsabilidade dos sócios</th>\n<th>Sócios</th>\n<th>Registro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Em Comum</td>\n<td>Solidária e ilimitada (todos)</td>\n<td>Qualquer</td>\n<td>Sem registro</td>\n</tr>\n<tr>\n<td>Conta de Participação</td>\n<td>Ostensivo: ilimitada; oculto: limitada</td>\n<td>Qualquer</td>\n<td>Facultativo</td>\n</tr>\n<tr>\n<td>Simples</td>\n<td>Subsidiária (conforme contrato)</td>\n<td>Qualquer</td>\n<td>RCPJ</td>\n</tr>\n<tr>\n<td>Em Nome Coletivo</td>\n<td>Ilimitada e solidária (todos)</td>\n<td>Só pessoa física</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Em Comandita Simples</td>\n<td>Comanditado: ilimitada; comanditário: limitada</td>\n<td>Misto</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td><strong>Ltda</strong></td>\n<td><strong>Limitada ao valor das quotas</strong></td>\n<td>Qualquer</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td><strong>S/A</strong></td>\n<td><strong>Limitada ao preço de emissão</strong></td>\n<td>Qualquer</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Comandita por Ações</td>\n<td>Diretores: ilimitada; demais: limitada</td>\n<td>Qualquer</td>\n<td>JUCEX</td>\n</tr>\n<tr>\n<td>Cooperativa</td>\n<td>Legislação própria; sobras ≠ lucro</td>\n<td>—</td>\n<td>RCPJ</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Dissolução:</strong> total (extinção da sociedade) ≠ resolução parcial (saída de sócio — sociedade continua)</p>"}, {"id": "r8", "titulo": "SOCIEDADE LIMITADA (arts. 1.052–1.087 CC)", "prob": "alta", "html": "<ul>\n<li>Capital dividido em <strong>quotas</strong>; integralização em dinheiro ou bens — <strong>VEDADO</strong> integralizar com prestação de serviços (art. 1.055 §2º CC)</li>\n<li>Sócios respondem <strong>solidariamente</strong> pela integralização do capital</li>\n<li>Cessão de quotas: aprovação de sócios com <strong>≥ 3/4 do capital</strong> (salvo contrato diferente — art. 1.057 CC)</li>\n<li>Administração: sócio ou não sócio (pessoa física capaz)</li>\n</ul>\n<p><strong>Quórum qualificado (3/4 do capital):</strong> mudança de objeto, fusão, incorporação, cisão, transformação, dissolução, aumento de capital, cessão de quotas</p>\n<p><strong>Quórum maioria simples (&gt;50% do capital):</strong> exclusão de sócio, eleição de administrador</p>\n<p><strong>Reunião obrigatória:</strong> quando &gt;10 sócios; anual para aprovar contas (art. 1.072 CC)</p>\n<p><strong>Redução de capital:</strong> somente se não houver oposição de credores quirografários — prazo 90 dias para oposição (art. 1.084 CC)</p>\n<p><strong>Exclusão extrajudicial de sócio:</strong> falta grave; votos de sócios com &gt;50% do capital (excluindo o sócio acusado do cômputo)</p>"}, {"id": "r9", "titulo": "SOCIEDADE ANÔNIMA (Lei 6.404/76)", "prob": "media", "html": "<ul>\n<li>Capital dividido em <strong>ações</strong>; responsabilidade = limitada ao preço de emissão</li>\n<li><strong>Sempre empresarial</strong> independentemente do objeto (art. 1.089 CC)</li>\n<li>Denominação: \"S.A.\" ou \"Companhia\" — <strong>NÃO usa firma</strong> | \"Cia.\" <strong>não pode</strong> ser usada no <strong>final</strong> da denominação</li>\n<li>Ações: sempre <strong>nominativas</strong> (ações ao portador extintas desde Lei 8.021/90)</li>\n</ul>\n<p><strong>Tipos de ações:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Direito a voto</th>\n<th>Outras características</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ordinárias</td>\n<td>Sim</td>\n<td>Direitos básicos</td>\n</tr>\n<tr>\n<td>Preferenciais</td>\n<td>Pode não ter</td>\n<td>Privilégios econômicos</td>\n</tr>\n<tr>\n<td>De gozo/fruição</td>\n<td>Residual</td>\n<td>Amortizadas, mantém direitos residuais</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Aberta vs. fechada:</strong></p>\n<ul>\n<li>Aberta: ações em bolsa/mercado; sujeita à CVM; maior transparência</li>\n<li>Fechada: restrita a grupo de acionistas; não sujeita à CVM</li>\n</ul>\n<p><strong>Órgãos:</strong></p>\n<ul>\n<li>Assembleia Geral (soberana): AGO anual (até 4 meses após fim do exercício) + AGE quando necessário</li>\n<li>Conselho de Administração: <strong>facultativo</strong> em fechada, <strong>obrigatório</strong> em aberta e de capital autorizado</li>\n<li>Diretoria: <strong>obrigatória</strong></li>\n<li>Conselho Fiscal: facultativo</li>\n</ul>\n<p><strong>Subsidiária integral:</strong> único acionista pode ser pessoa jurídica (exceção à regra de pluralidade)</p>"}, {"id": "r10", "titulo": "PEGADINHAS / ERROS CLÁSSICOS", "prob": "media", "html": "<ol>\n<li><strong>DC surgiu na Roma Antiga</strong> → <strong>FALSO.</strong> Surgiu na <strong>Idade Média</strong> com as corporações de comerciantes.</li>\n<li><strong>ME tem receita bruta até R$400k</strong> → <strong>FALSO.</strong> ME = até <strong>R$360k</strong>; EPP = até <strong>R$4,8M</strong> (LC 123/06 art. 3º).</li>\n<li><strong>Nome empresarial pode ser alienado</strong> → <strong>FALSO.</strong> É intransmissível (art. 1.164 CC).</li>\n<li><strong>EIRELI ainda existe</strong> → <strong>FALSO.</strong> Foi absorvida pela <strong>SLU</strong> (Lei 14.195/21).</li>\n<li><strong>Empresário rural obrigatoriamente se registra antes de iniciar</strong> → <strong>FALSO.</strong> Registro é <strong>facultativo</strong> e pode ser feito após o início (art. 971 CC).</li>\n<li><strong>Integralizar quota com prestação de serviços é permitido na Ltda</strong> → <strong>FALSO.</strong> Vedado expressamente (art. 1.055 §2º CC).</li>\n<li><strong>Cônjuges só são impedidos de se associar em comunhão universal</strong> → <strong>FALSO.</strong> Também na <strong>separação obrigatória</strong> (art. 977 CC).</li>\n<li><strong>Patente de invenção = 15 anos</strong> → <strong>FALSO.</strong> Invenção = <strong>20 anos</strong>; Modelo de utilidade = <strong>15 anos</strong>.</li>\n<li><strong>Marca = proteção por 20 anos</strong> → <strong>FALSO.</strong> Marca = <strong>10 anos</strong> renováveis indefinidamente.</li>\n<li><strong>\"Cia.\" pode aparecer no final da denominação</strong> → <strong>FALSO.</strong> Só no início ou meio (\"Cia. das Letras\" ✓; \"Letras Cia.\" ✗).</li>\n<li><strong>Desconsideração da PJ sempre responsabiliza os sócios</strong> → <strong>FALSO.</strong> Desconsideração <strong>inversa</strong> responsabiliza a <strong>sociedade</strong> pelas dívidas pessoais do sócio.</li>\n<li><strong>Sociedade simples se registra na Junta Comercial</strong> → <strong>FALSO.</strong> Sociedade simples = <strong>RCPJ</strong>; empresária = JUCEX.</li>\n<li><strong>Quórum de cessão de quotas é 50%</strong> → <strong>FALSO.</strong> Cessão = <strong>3/4 do capital</strong> (art. 1.057 CC).</li>\n<li><strong>S/A pode ter firma</strong> → <strong>FALSO.</strong> S/A usa <strong>denominação</strong>, nunca firma.</li>\n<li><strong>Caducidade da marca = 3 anos sem uso</strong> → <strong>FALSO.</strong> Caducidade por falta de uso = <strong>5 anos consecutivos</strong> (art. 143 LPI).</li>\n</ol>"}], "top5": ["<b>Conceito de empresário (art. 966 CC)</b> — cobrado em todos os módulos, inclusive via exclusão (intelectual ≠ empresário)", "<b>Limites ME/EPP e MEI</b> — pegadinha clássica dos valores (R$360k, R$4,8M, R$81k)", "<b>Prazos de Propriedade Industrial</b> — patente 20/15 anos, marca 10 renováveis, desenho 10/25", "<b>Tipos de sociedade e responsabilidade</b> — tabela de espécies cobrada diretamente", "<b>Sociedade Limitada</b> — quórum 3/4 para cessão de quotas + vedação de integralização por serviço"], "questoes": [], "sinteses": [], "cards": [{"id": "c1", "f": "O que é empresário segundo o CC/2002?", "v": "Quem exerce profissionalmente atividade econômica organizada para produção ou circulação de bens ou serviços (art. 966 CC). Requisitos: profissionalismo, organização, atividade econômica.\n\n---"}, {"id": "c2", "f": "Qual o limite de faturamento do MEI, ME e EPP?", "v": "MEI: até R$ 81 mil/ano | ME: até R$ 360 mil/ano | EPP: R$ 360.001 a R$ 4.800.000/ano (LC 123/06).\n\n---"}, {"id": "c3", "f": "Qual o prazo da patente de invenção e do modelo de utilidade?", "v": "Patente de invenção: 20 anos do depósito. Modelo de utilidade: 15 anos do depósito (LPI 9.279/96).\n\n---"}, {"id": "c4", "f": "Por quanto tempo uma marca registrada no INPI é protegida?", "v": "10 anos da concessão, renováveis indefinidamente por períodos iguais de 10 anos.\n\n---"}, {"id": "c5", "f": "Qual o prazo do desenho industrial?", "v": "10 anos do depósito, prorrogável por 3 períodos de 5 anos → máximo 25 anos.\n\n---"}, {"id": "c6", "f": "O que diferencia sociedade empresária de sociedade simples?", "v": "Empresária: objeto = atividade de empresário (produção/circulação organizada), registro na Junta Comercial. Simples: atividade intelectual (científica, literária, artística), registro no RCPJ.\n\n---"}, {"id": "c7", "f": "Qual a diferença entre dissolução total e resolução parcial da sociedade?", "v": "Dissolução: extinção da sociedade. Resolução parcial: saída de um sócio (morte, exclusão, retirada) — a sociedade continua existindo.\n\n---"}, {"id": "c8", "f": "Quais cônjuges não podem ser sócios entre si?", "v": "Casados em comunhão universal de bens ou separação obrigatória de bens (art. 977 CC).\n\n---"}, {"id": "c9", "f": "Quando nasce a personalidade jurídica de uma sociedade?", "v": "Com o registro (art. 985 CC). Sem registro = sociedade em comum (não personificada), todos respondem solidária e ilimitadamente.\n\n---"}, {"id": "c10", "f": "O que é o trespasse e qual a restrição ao alienante?", "v": "Trespasse = alienação do estabelecimento empresarial. O alienante fica proibido de se restabelecer como concorrente por 5 anos (art. 1.147 CC), salvo autorização expressa.\n\n---"}, {"id": "c11", "f": "Quais os requisitos da ação renovatória de locação?", "v": "(1) Contrato escrito; (2) prazo mínimo de 5 anos (pode ser soma de contratos); (3) exploração do mesmo ramo por no mínimo 3 anos; (4) proposta formulada 1 ano antes e no máximo 6 meses antes do fim do contrato.\n\n---"}, {"id": "c12", "f": "Qual é a responsabilidade dos sócios na Sociedade Limitada?", "v": "Limitada ao valor das quotas subscritas, porém todos respondem solidariamente pela integralização total do capital (art. 1.052 CC).\n\n---"}, {"id": "c13", "f": "Que quórum é necessário para cessão de quotas na Ltda?", "v": "Aprovação de sócios representando pelo menos 3/4 do capital social, salvo disposição contrária no contrato.\n\n---"}, {"id": "c14", "f": "O que é a Sociedade Anônima e qual sua responsabilidade?", "v": "Capital dividido em ações; responsabilidade dos acionistas limitada ao preço de emissão das ações subscritas. Sempre empresarial (art. 1.089 CC).\n\n---"}, {"id": "c15", "f": "Qual a diferença entre S/A aberta e fechada?", "v": "Aberta: ações negociadas em bolsa ou mercado de balcão, sujeita à CVM. Fechada: ações restritas a grupo de acionistas, sem negociação pública.\n\n---"}, {"id": "c16", "f": "Que tipo de nome usa a S/A — firma ou denominação?", "v": "Denominação (inclui objeto + \"S/A\", \"Companhia\" ou \"Cia.\" — mas \"Cia.\" não pode ser usado ao final). Não usa firma (nome de sócios).\n\n---"}, {"id": "c17", "f": "Quais os tipos de ações de uma S/A?", "v": "Ordinárias (direito a voto), Preferenciais (privilégios econômicos, podem não ter voto) e De Gozo/Fruição (entregues a acionistas que tiveram suas ações amortizadas).\n\n---"}, {"id": "c18", "f": "Como uma marca pode ser cancelada por falta de uso?", "v": "Caducidade: se o titular não usar a marca por 5 anos consecutivos após a concessão, pode ser declarada caduca pelo INPI a pedido de terceiro com interesse legítimo (art. 143 LPI).\n\n---"}, {"id": "c19", "f": "O que é a desconsideração da personalidade jurídica inversa?", "v": "Responsabiliza a sociedade pelas dívidas pessoais de seus sócios (art. 50 §§ 2º e 3º CC), quando o sócio usa a pessoa jurídica para blindar patrimônio pessoal.\n\n---"}, {"id": "c20", "f": "Quais deliberações na Ltda exigem quórum de 3/4 do capital?", "v": "Mudança de objeto social, fusão, incorporação, cisão, transformação, dissolução e qualquer modificação do contrato que o exija. Cessar de quotas também requer 3/4 salvo disposição contrária."}], "cobertura": ["O próprio arquivo avisa: onde o texto completo da questão não foi extraído, o comentário se baseia no gabarito e no conteúdo do módulo. Parte dos comentários, portanto, é dedução e não texto do AVA.", "Os arquivos trazem gabarito e comentário. Enunciados e alternativas completas não vieram.", "Este material não passou por conferência automática nem por auditoria independente. As frases não trazem citação literal da fonte."], "notas": [{"esc": "revisao", "ref": "r7", "titulo": "Contradiz os flashcards", "texto": "O resumo diz que mudança de objeto, fusão e dissolução na Ltda exigem unanimidade. O flashcard 20 e a Q16 do Módulo 7 dizem 3/4 do capital, que é o que consta nos arts. 1.071 e 1.076 do CC. Confira no AVA."}, {"esc": "card", "ref": "c13", "titulo": "Cessão de quotas: regra mais precisa", "texto": "O art. 1.057 do CC permite a cessão a outro sócio sem consulta, e a estranho se não houver oposição de titulares de mais de 1/4 do capital. “Aprovação de 3/4” é uma simplificação. Veja como o AVA formula."}, {"esc": "card", "ref": "c20", "titulo": "Cessão de quotas: regra mais precisa", "texto": "Para o quórum de cessão de quotas, veja a observação do flashcard 13 (art. 1.057 do CC)."}, {"esc": "card", "ref": "c2", "titulo": "Limite do MEI", "texto": "O teto de R$ 81 mil segue vigente em 2026. Há notícia de lei sancionada que o eleva a R$ 110 mil em 2027 e R$ 140 mil em 2028. Para a prova de 2026, vale o R$ 81 mil."}]};</script><script>/* Estudo UNIP: portal de revisão. Dados em window.DADOS[COD] (gerados por build.py). */
const PROVAS = [
  {dia:"2026-11-03", hora:"12:30", cod:"D05E", nome:"Linguagem e Comunicação Jurídica"},
  {dia:"2026-11-03", hora:"13:15", cod:"803X", nome:"Teoria Geral do Processo"},
  {dia:"2026-11-03", hora:"14:45", cod:"883X", nome:"Bases Constitucionais da Administração Pública"},
  {dia:"2026-11-03", hora:"16:15", cod:"18A1", nome:"Teoria da Empresa"},
  {dia:"2026-11-04", hora:"12:30", cod:"21A1", nome:"Direitos Humanos"},
  {dia:"2026-11-04", hora:"14:00", cod:"D55B", nome:"Psicologia Jurídica"},
  {dia:"2026-11-04", hora:"14:45", cod:"18A7", nome:"Procedimento Comum"},
  {dia:"2026-11-04", hora:"15:30", cod:"D982", nome:"Tópicos Especiais de Direito Privado (optativa)"}
];

const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } }
};
const prog = cod => Object.assign({rev:[], q:[], cards:{}}, store.get("p:" + cod, {}));
const saveProg = (cod, p) => store.set("p:" + cod, p);

const $ = s => document.querySelector(s);
const D = cod => (window.DADOS || {})[cod];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const plain = h => h.replace(/<[^>]+>/g, " ");
const dias = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const ts = p => new Date(p.dia + "T" + p.hora + ":00-03:00");
const fmtDia = iso => { const d = new Date(iso + "T12:00:00-03:00"), n = dias[d.getDay()];
  return `${n[0].toUpperCase() + n.slice(1)}${d.getDay() % 6 === 0 ? "" : "-feira"}, ${d.getDate()} de ${meses[d.getMonth()]}`; };

function pct(cod){
  const d = D(cod); if(!d) return 0;
  const p = prog(cod), total = d.revisao.length + d.questoes.length + d.cards.length;
  const feito = p.rev.length + p.q.length + Object.values(p.cards).filter(v => v === 1).length;
  return total ? Math.round(feito / total * 100) : 0;
}
const blocoLongo = b => b.replace(/^MÓDULO/, "Módulo").replace(/^UNIDADE (I+) — QUESTIONÁRIO/, "Unidade $1, questionário").replace(/^UNIDADE (I+) — ATIVIDADE TELEAULA/, "Unidade $1, teleaula");
const blocoCurto = b => { const m = b.match(/^MÓDULO (\d+)/); return m ? "Módulo " + m[1] : blocoLongo(b); };
const notasDe = (d, esc_, ref) => d.notas.filter(n => n.esc === esc_ && n.ref === ref);
const conferirHtml = ns => ns.map(n => `<div class="conferir"><b>Conferir: ${esc(n.titulo)}</b>${esc(n.texto)}</div>`).join("");

let S = {cod:null, tab:"revisao", filtro:"todos", bloco:"todos", soRepete:false, busca:"", open:new Set(), fila:null, flip:false};

/* ───────── home ───────── */
function countdown(){
  const agora = new Date();
  const prox = PROVAS.map(p => ({p, t:ts(p)})).filter(x => x.t > agora).sort((a, b) => a.t - b.t)[0];
  if(!prox) return `<div class="next"><span><b>Todas as provas foram realizadas.</b> Bom trabalho.</span></div>`;
  const ms = prox.t - agora, h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  const txt = h >= 48 ? `${Math.floor(h / 24)} dias` : `${h} h ${String(m).padStart(2, "0")} min`;
  return `<div class="next"><span>Próxima prova: <b>${esc(prox.p.nome)}</b>, às ${prox.p.hora}</span><span class="cd">em ${txt}</span></div>`;
}
function home(){
  const grupos = {};
  PROVAS.forEach(p => (grupos[p.dia] = grupos[p.dia] || []).push(p));
  let h = `<h1>Provas de 3 e 4 de novembro</h1>
  <p class="lede">As disciplinas na ordem em que você vai fazê-las. Abra uma para ver a revisão de véspera, as questões comentadas e os flashcards.</p>${countdown()}`;
  for(const dia in grupos){
    h += `<section class="day"><h2>${fmtDia(dia)}</h2><ol class="slots">`;
    grupos[dia].forEach(p => {
      const d = D(p.cod), x = pct(p.cod);
      h += `<li class="slot"><span class="slot-time">${p.hora}</span>
      <${d ? "a" : "div"} class="slot-card ${d ? "ready" : ""}" ${d ? `href="#${p.cod.toLowerCase()}-revisao"` : ""}>
        <span><span class="slot-name">${esc(p.nome)}</span><br><span class="slot-code">${p.cod}${d ? `, ${d.revisao.length} tópicos, ${d.questoes.length} questões, ${d.cards.length} flashcards` : ""}</span></span>
        <span class="slot-side">${d ? `<span class="chip pronto">Material recebido</span>` : `<span class="chip wait">Aguardando material</span>`}</span>
        ${d ? `<span class="bar" role="progressbar" aria-valuenow="${x}" aria-valuemin="0" aria-valuemax="100" aria-label="Seu progresso"><i style="width:${x}%"></i></span>` : ""}
      </${d ? "a" : "div"}></li>`;
    });
    h += `</ol></section>`;
  }
  h += `<p class="foot-note">Material de apoio montado a partir dos arquivos extraídos do AVA. Não substitui as aulas nem garante o que cairá na prova. Onde o material tem pontos duvidosos, eles aparecem em azul com o título “Conferir”.</p>`;
  $("#app").innerHTML = h;
}

/* ───────── disciplina ───────── */
function disciplina(slug, tab){
  const p = PROVAS.find(x => x.cod.toLowerCase() === slug), d = D(p.cod);
  const nConf = d.notas.length;
  $("#app").innerHTML = `<a class="voltar" href="#home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Todas as provas</a>
  <h1>${esc(p.nome)}</h1>
  <div class="meta"><span>${p.cod}</span><span>${fmtDia(p.dia)}, ${p.hora}</span><span class="chip wait" title="O material ainda não passou por conferência automática nem por auditoria independente.">Conferência pendente</span></div>
  <div class="panels">
    <details class="panel info"><summary>Pontos para conferir (${nConf})</summary><div class="panel-b"><ul>${
      nConf ? d.notas.map(n => `<li><b>${esc(n.titulo)}.</b> ${esc(n.texto)}</li>`).join("") : "<li>Nenhum ponto marcado.</li>"}</ul></div></details>
    <details class="panel"><summary>O que este material cobre e o que não cobre</summary><div class="panel-b"><ul>${d.cobertura.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div></details>
  </div>
  <div class="tabs" role="tablist">${[["revisao","Revisão de véspera",d.revisao.length],["questoes","Questões comentadas",d.questoes.length],["flashcards","Flashcards",d.cards.length]]
    .map(([k, l, n]) => `<button role="tab" class="tab" aria-selected="${tab === k}" data-tab="${k}">${l}<span>${n}</span></button>`).join("")}</div>
  <div id="pane"></div>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { location.hash = `${slug}-${b.dataset.tab}`; });
  ({revisao: () => revisao(p.cod), questoes: () => questoes(p.cod), flashcards: () => flashcards(p.cod)})[tab]();
}

/* ───────── revisão ───────── */
function revisao(cod){
  const d = D(cod), pr = prog(cod), q = norm(S.busca.trim());
  const lista = d.revisao.filter(t => (S.filtro === "todos" || t.prob === S.filtro) && (!q || norm(t.titulo + " " + plain(t.html)).includes(q)));
  let h = d.top5.length ? `<div class="top5"><h3>Temas que mais caem, segundo o resumo</h3><ol>${d.top5.map(t => `<li>${t}</li>`).join("")}</ol></div>` : "";
  h += `<div class="toolbar">${[["todos","Todos"],["alta","Prioridade alta"],["media","Prioridade média"]]
    .map(([k, l]) => `<button class="fbtn" data-f="${k}" aria-pressed="${S.filtro === k}">${l}</button>`).join("")}
    <input class="search" id="busca" type="search" placeholder="Buscar na revisão" value="${esc(S.busca)}" aria-label="Buscar na revisão">
    <span class="spacer"></span><span class="count">${pr.rev.length} de ${d.revisao.length} revisados</span></div>`;
  if(!lista.length) h += `<div class="empty">Nenhum tópico encontrado.</div>`;
  lista.forEach(t => {
    const feito = pr.rev.includes(t.id);
    h += `<details class="topic ${feito ? "done" : ""}" data-p="${t.prob}" data-id="${t.id}" ${(S.open.has(t.id) || q) ? "open" : ""}>
      <summary><span class="chip ${t.prob}">${t.prob === "alta" ? "Alta" : "Média"}</span><span class="topic-t">${esc(t.titulo)}</span></summary>
      <div class="topic-body"><div class="rev">${t.html}</div>${conferirHtml(notasDe(d, "revisao", t.id))}
        <label class="check"><input type="checkbox" data-rev="${t.id}" ${feito ? "checked" : ""}>Marcar como revisado</label></div></details>`;
  });
  $("#pane").innerHTML = h;
  document.querySelectorAll(".fbtn[data-f]").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; revisao(cod); });
  $("#busca").oninput = e => { S.busca = e.target.value; const pos = e.target.selectionStart; revisao(cod); const i = $("#busca"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll("details.topic").forEach(el => el.addEventListener("toggle", () => { el.open ? S.open.add(el.dataset.id) : S.open.delete(el.dataset.id); }));
  document.querySelectorAll("[data-rev]").forEach(c => c.onchange = () => {
    const p = prog(cod), id = c.dataset.rev;
    p.rev = c.checked ? [...new Set([...p.rev, id])] : p.rev.filter(x => x !== id);
    saveProg(cod, p); S.open.add(id); revisao(cod);
  });
}

/* ───────── questões ───────── */
function questoes(cod){
  const d = D(cod), pr = prog(cod), q = norm(S.busca.trim());
  const blocos = [...new Set(d.questoes.map(x => x.bloco))];
  const lista = d.questoes.filter(x => (S.bloco === "todos" || x.bloco === S.bloco) && (!S.soRepete || x.repete) &&
    (!q || norm([x.num, x.tema, x.enun, x.html, x.coment.join(" "), x.gab].join(" ").replace(/<[^>]+>/g, " ")).includes(q)));
  let h = `<div class="chips-scroll"><button class="fbtn" data-b="todos" aria-pressed="${S.bloco === "todos"}">Todos os blocos</button>${
    blocos.map(b => `<button class="fbtn" data-b="${esc(b)}" aria-pressed="${S.bloco === b}">${esc(blocoCurto(b))}</button>`).join("")}</div>
  <div class="toolbar"><button class="fbtn" id="repete" aria-pressed="${S.soRepete}" title="Questões que repetem um conceito já cobrado">Só as que se repetem</button>
    <input class="search" id="busca" type="search" placeholder="Buscar nas questões" value="${esc(S.busca)}" aria-label="Buscar nas questões">
    <span class="spacer"></span><span class="count">${lista.length} de ${d.questoes.length} questões, ${pr.q.length} revisadas</span></div>`;
  let atual = null;
  lista.forEach(x => {
    if(x.bloco !== atual){ atual = x.bloco; h += `<h3 class="gh">${esc(blocoLongo(atual))}</h3>`; }
    const ns = notasDe(d, "questao", x.id);
    h += `<article class="qrow"><div class="qrow-h"><span class="qn">${esc(x.num)}</span>${x.tema ? `<span class="qtema">${esc(x.tema)}</span>` : `<span class="qtema"></span>`}
      ${x.repete ? `<span class="chip media" title="${esc(x.repeteRef || "Repete um conceito já cobrado")}">Repete</span>` : ""}
      <span class="gab" aria-label="Gabarito ${x.gab}"><b>${x.gab}</b>${x.gabLabel ? `<span>${esc(x.gabLabel)}</span>` : ""}</span></div>
      ${x.enun ? `<p class="qenun">${x.enun}</p>` : ""}${x.html ? `<p class="qtxt">${x.html}</p>` : ""}
      ${x.coment.map(c => `<p class="qcom">${c}</p>`).join("")}${x.repeteRef ? `<p class="qcom">Repete: ${esc(x.repeteRef)}</p>` : ""}${conferirHtml(ns)}
      <label class="check"><input type="checkbox" data-q="${x.id}" ${pr.q.includes(x.id) ? "checked" : ""}>Revisei</label></article>`;
  });
  if(!lista.length) h += `<div class="empty">Nenhuma questão encontrada.</div>`;
  if(d.sinteses.length && S.bloco === "todos" && !S.soRepete && !q){
    h += `<h3 class="gh">Síntese dos módulos sem questões detalhadas</h3>` + d.sinteses.map(s => `<div class="sint"><h3>${esc(s.titulo)}</h3><p>${s.html}</p></div>`).join("");
  }
  $("#pane").innerHTML = h;
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { S.bloco = b.dataset.b; questoes(cod); });
  $("#repete").onclick = () => { S.soRepete = !S.soRepete; questoes(cod); };
  $("#busca").oninput = e => { S.busca = e.target.value; const pos = e.target.selectionStart; questoes(cod); const i = $("#busca"); i.focus(); i.setSelectionRange(pos, pos); };
  document.querySelectorAll("[data-q]").forEach(c => c.onchange = () => {
    const p = prog(cod), id = c.dataset.q; const y = window.scrollY;
    p.q = c.checked ? [...new Set([...p.q, id])] : p.q.filter(z => z !== id); saveProg(cod, p);
    document.querySelector(".count").textContent = `${lista.length} de ${d.questoes.length} questões, ${p.q.length} revisadas`;
  });
}

/* ───────── flashcards ───────── */
function flashcards(cod){
  const d = D(cod), pr = prog(cod);
  if(!S.fila) S.fila = d.cards.filter(c => pr.cards[c.id] !== 1).map(c => c.id);
  const total = d.cards.length, sabidos = d.cards.filter(c => pr.cards[c.id] === 1).length;
  if(!S.fila.length){
    $("#pane").innerHTML = `<div class="fc-done"><h3>Baralho concluído</h3><p class="lede" style="margin:0 auto 16px">Você marcou ${sabidos} de ${total} cards como sabidos.</p><button class="btn main" id="reinicia">Recomeçar baralho</button></div>`;
    $("#reinicia").onclick = () => { const p = prog(cod); p.cards = {}; saveProg(cod, p); S.fila = null; S.flip = false; flashcards(cod); };
    return;
  }
  const c = d.cards.find(x => x.id === S.fila[0]), ns = notasDe(d, "card", c.id);
  $("#pane").innerHTML = `<div class="fc-top"><span>${sabidos} de ${total} sabidos, ${S.fila.length} na fila</span><span class="kbd">Espaço vira, seta esquerda errei, seta direita acertei</span></div>
  <div class="fc-scene"><button class="fc ${S.flip ? "flip" : ""}" id="fc" aria-label="Virar o card">
    <span class="face"><span class="lab">Pergunta</span><span class="txt">${c.f}</span><span class="hint">Toque para ver a resposta</span></span>
    <span class="face back"><span class="lab">Resposta</span><span class="txt">${c.v}</span><span class="hint">Você acertou?</span></span></button></div>
  <div class="fc-note" id="fcnote" ${S.flip ? "" : "hidden"}>${conferirHtml(ns)}</div>
  <div class="fc-actions"><button class="btn wrong" id="errei">Errei, repetir depois</button><button class="btn right" id="acertei">Acertei</button></div>`;
  $("#fc").onclick = () => { S.flip = !S.flip; $("#fc").classList.toggle("flip", S.flip); $("#fcnote").hidden = !S.flip; };
  $("#errei").onclick = () => marca(cod, 0);
  $("#acertei").onclick = () => marca(cod, 1);
}
function marca(cod, v){
  const p = prog(cod), id = S.fila.shift(); p.cards[id] = v; saveProg(cod, p);
  if(v === 0) S.fila.push(id);
  S.flip = false; flashcards(cod);
}

/* ───────── rotas, tema, teclado ───────── */
function route(){
  const h = location.hash.slice(1) || "home";
  const m = h.match(/^([a-z0-9]{4})-(revisao|questoes|flashcards)$/);
  if(m && D(m[1].toUpperCase())){
    if(S.cod !== m[1]){ S = Object.assign(S, {cod:m[1], filtro:"todos", bloco:"todos", soRepete:false, busca:"", fila:null, flip:false, open:new Set([D(m[1].toUpperCase()).revisao[0].id])}); }
    if(S.tab !== m[2]){ S.busca = ""; S.fila = null; S.flip = false; }
    S.tab = m[2]; disciplina(m[1], m[2]);
  } else { S.cod = null; home(); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(x => x.open = true));
document.addEventListener("keydown", e => {
  if(/INPUT|TEXTAREA/.test(e.target.tagName) || S.tab !== "flashcards" || !$("#fc")) return;
  if(e.key === " "){ e.preventDefault(); $("#fc").click(); }
  if(e.key === "ArrowLeft") $("#errei").click();
  if(e.key === "ArrowRight") $("#acertei").click();
});
$("#theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
};
setInterval(() => { if(!S.cod) home(); }, 60000);
route();
</script>
