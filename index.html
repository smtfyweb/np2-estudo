pretação jurisprudencial = autêntica\" → <strong>FALSO</strong> (autêntica = legislador)</li>\n<li>\"CPC adota teoria das fases processuais\" → <strong>FALSO</strong> (adota isolamento dos atos, art. 14)</li>\n<li>\"Tríplice garantia = apenas direito adquirido + coisa julgada\" → <strong>FALSO</strong> (falta ato jurídico perfeito)</li>\n<li>\"Inafastabilidade da jurisdição não tem exceção\" → <strong>FALSO</strong> (exceção: instância desportiva, art. 217, §1º CF)</li>\n<li>\"No CPC atual, legitimidade e interesse são condições da ação\" → <strong>FALSO</strong> (são pressupostos processuais)</li>\n<li>\"Juizados Especiais Estaduais têm competência absoluta\" → <strong>FALSO</strong> (relativa; Federais é que têm absoluta)</li>\n<li>\"Mediação visa garantir legitimidade dos ritos judiciais\" → <strong>FALSO</strong> (fins: desafogar Judiciário, pacificação, acesso)</li>\n</ol>"}], "top5": ["<b>Distinção mediação×conciliação</b> — cobrado em todos os módulos com variações", "<b>Autocomposição (desistência/submissão/transação)</b> — pegadinha da inversão entre submissão e desistência", "<b>Competência legislativa art. 22 × art. 24 CF</b> — cobrado com MP, Estados, procedimentos", "<b>Teoria do isolamento dos atos processuais (art. 14 CPC)</b> — três teorias, CPC adota isolamento", "<b>Pressupostos processuais + competência absoluta×relativa</b> — legitimidade ordinária×extraordinária, juizados, prorrogação"], "questoes": [{"id": "M1-Q1", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.1", "tema": "", "enun": "Sobre meios extrajudiciais de solução de conflitos de interesses, está CORRETO afirmar:\n\nA) O novo código de processo civil ao apontar que não se excluirá da apreciação jurisdicional ameaça ou lesão a direito, proibiu expressamente a composição entre as partes.\nB) A mediação e a conciliação são a mesma coisa, pois que se utilizam de um terceiro para auxiliar as partes na busca de uma solução satisfatória para ambas, sem, contudo, opinar diretamente sobre a lide em questão, utilizando-se de técnicas que propiciem oportunidades para que elas possam tomar decisões, auxiliando de forma construtiva o restabelecimento da comunicação, aproximando-as de tal modo que a decisão tomada seja do agrado de todos.\nC) A arbitragem é um instrumento de solução de conflitos que pode envolver direitos disponíveis e indisponíveis e sempre se dará por equidade.\nD) A negociação se dá sem a participação de terceiros, sendo as próprias partes interessadas as responsáveis pela resolução do conflito, em autocomposição.\nE) NDA.", "gab": "D", "gabLabel": "", "html": "A negociação é um meio autocompositivo direto em que as próprias partes negociam a solução da controvérsia sem a intervenção de terceiros. A arbitragem só versa sobre direitos patrimoniais disponíveis (art. 1º da Lei 9.307/96), a conciliação e a mediação possuem distinções técnicas (art. 165 do CPC) e a autocomposição é amplamente incentivada pelo CPC/15 (art. 3º, § 2º).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q2", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.2", "tema": "", "enun": "A respeito dos métodos alternativos de solução de conflitos, assinale a alternativa correta.\n\nA) A sentença arbitral não admite controle judicial sobre sua validade.\nB) Ao convencionar a arbitragem, as partes renunciam, em definitivo, ao direito de acesso à justiça.\nC) A cláusula compromissória de arbitragem é a convenção por meio da qual as partes estatuem, prévia e abstratamente, que eventuais controvérsias oriundas de certo negócio jurídico sejam dirimidas pelo juízo arbitral.\nD) A autocomposição, por sua rara ocorrência, tem cada vez mais perdido prestígio no ordenamento jurídico brasileiro como método eficaz de solução de conflitos.\nE) A mediação pressupõe a intervenção de um terceiro imparcial e equidistante, sendo, pois, espécie heterocompositiva.", "gab": "C", "gabLabel": "", "html": "Nos termos do art. 4º, caput, da Lei nº 9.307/1996, a cláusula compromissória é a convenção através da qual as partes em um contrato se comprometem a submeter à arbitragem os litígios que possam vir a surgir, relativamente a tal contrato.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q3", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.3", "tema": "", "enun": "No que se refere aos métodos cooperativos de solução de conflitos, assinale a opção correta.\n\nA) Assim como o conciliador, o mediador explorara o conflito, a fim de identificar os interesses por trás das queixas imediatas.\nB) Na mediação, não há interesse em perceber as motivações psíquicas e outras questões pessoais que culminaram no conflito.\nC) A conciliação concentra-se no aspecto objetivo do conflito, ao passo que a mediação atua para viabilizar a solução do conflito, empenhando-se para que haja compreensão mútua.\nD) A mediação, entendida como processo ideal na solução de conflitos, resulta no apaziguamento e, consequentemente, na reconciliação, como, por exemplo, nos casos de separações traumáticas e de adoção.\nE) O objetivo da conciliação é o realinhamento das divergências entre as partes, de forma a finalizar o conflito.", "gab": "C", "gabLabel": "", "html": "Conforme a sistemática do art. 165, §§ 2º e 3º, do CPC/15, a conciliação foca no aspecto objetivo e prático da controvérsia (podendo o conciliador sugerir soluções), enquanto a mediação busca o restabelecimento da comunicação interpessoal e a compreensão mútua das partes (especialmente quando há vínculo anterior).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q4", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.4", "tema": "", "enun": "São mecanismos legalmente reconhecidos para solução dos conflitos, exceto:\n\nA) autotutela.\nB) a jurisdição.\nC) a mediação.\nD) a arbitragem.\nE) a conciliação.", "gab": "A", "gabLabel": "", "html": "A autotutela (uso da própria força) é, em regra, vedada pelo ordenamento jurídico e tipificada como crime (art. 345 do Código Penal - exercício arbitrário das próprias razões), ressalvadas raras exceções legais (ex: legítima defesa da posse - art. 1.210, § 1º, do CC). Os demais institutos são métodos legítimos e institucionalizados de solução de conflitos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q5", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.5", "tema": "", "enun": "A respeito dos mecanismos de Resolução de Conflitos, é correto afirmar:\n\nA) o desequilíbrio extremo de poder entre as partes, na aplicação do processo de mediação, pode ser uma violência ou ter como resultado o desrespeito dos direitos de uma das partes.\nB) o mediador estimula ou facilita a aproximação entre os interessados e restaura o diálogo entre eles, apontando soluções para o conflito.\nC) o mediador possui autoridade suficiente para impor a decisão sobre as pessoas em conflito.\nD) a mediação tem um potencial especial de contribuir naqueles conflitos que surgem de relações de naturezas esporádicas, casuais.\nE) a mediação constitui um processo no qual as partes resolvem o conflito por meio da ação de um terceiro, que sugere a solução para cada caso.", "gab": "A", "gabLabel": "", "html": "A mediação pressupõe o equilíbrio e a isonomia entre as partes para a construção de um consenso genuíno. Caso haja desequilíbrio extremo de poder, o procedimento pode resultar em violação aos direitos da parte mais vulnerável. O mediador jamais impõe ou sugere soluções (art. 165, § 3º, do CPC/15).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q6", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.6", "tema": "", "enun": "Há uma cultura do litígio enraizada na sociedade, cuja tendência é resolver os conflitos de forma adversarial. Nessas circunstâncias, os denominados meios alternativos de resolução de conflitos apresentam especial importância, com destaque para a mediação, na medida em que possuem os seguintes objetivos, EXCETO:\n\nA) aliviar o congestionamento do judiciário;\nB) promover a pacificação social;\nC) democratizar o acesso à justiça;\nD) promover a autocomposição da solução de controvérsias;\nE) garantir a legitimidade dos ritos judiciais.", "gab": "E", "gabLabel": "", "html": "A mediação é um método autocompositivo extrajudicial/adequado voltado para a pacificação social, desobstrução do Judiciário e autonomia das partes, não tendo por finalidade \"garantir a legitimidade dos ritos judiciais\" formais do contencioso estatal.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q7", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.7", "tema": "", "enun": "A mediação e a conciliação são meios alternativos de resolução de conflitos; uma opção ao processo judicial tradicional. Indique a opção que descreve de forma correta a lógica das formas alternativas de resolução de conflitos.\n\nA) Estabelecer uma ordem jurisprudencial para solução de conflitos.\nB) Transferir a competência dos processos legais aos juizados especiais.\nC) Reduzir prazos processuais e otimizar a atuação do Ministério Público.\nD) Facilitar o acesso à justiça de forma a garantir um processo eficaz e eficiente, ou seja, tornar mais ágeis e econômicas as soluções para os conflitos jurídicos mediante o acordo amigável.\nE) NDA.", "gab": "D", "gabLabel": "", "html": "A lógica dos Meios Adequados de Solução de Conflitos (MASCs) consiste na ampliação do acesso à justiça (art. 3º, §§ 2º e 3º, do CPC/15), proporcionando celeridade, eficiência e pacificação social pela via do consenso amigável.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q8", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.8", "tema": "", "enun": "A mediação integra as alternativas de solução de conflitos e disputas e pode ser utilizada em qualquer tipo de conflito se guardadas as condições de voluntariedade, capacidade de compreensão e:\n\nA) desequilíbrio amoroso entre as partes.\nB) desequilíbrio de poder entre as partes.\nC) equilíbrio amoroso entre as partes.\nD) equilíbrio de poder entre as partes.\nE) ausência de habilidade entre as partes.", "gab": "D", "gabLabel": "", "html": "A doutrina de mediação exige a paridade de armas e o equilíbrio de poder entre os conflitantes como pré-requisitos fundamentais para garantir a livre manifestação de vontade e a validade da autocomposição.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q9", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.9", "tema": "", "enun": "A mediação de conflitos:\n\nA) busca fazer com que as pessoas cumpram as normas impostas, já que as relações se baseiam na desigualdade entre os gêneros, entre pais e filhos e outras.\nB) é uma técnica extrajudicial para resolver conflitos, excluindo, no entanto, as situações que envolvam família e filhos.\nC) apoia-se nos paradigmas das ciências contemporâneas e, ao invés de trabalhar com verdades absolutas, tem o objetivo de aceitar a complexidade dos fenômenos interpessoais.\nD) valoriza aquele que é mais forte e com condições de melhor se impor na lógica adversarial, tendo como objetivo sempre eliminar a presença do Judiciário, já que a homologação dos acordos mediados é dispensável.\nE) não pode ser usada pelo Poder Judiciário pois não garante o sigilo entre os mediados e nem o manuseio dos conflitos de forma a contribuir para a superação das diferenças.", "gab": "C", "gabLabel": "", "html": "A mediação é pautada pela aceitação da complexidade das relações interpessoais, restabelecimento do diálogo e escuta ativa, sem a imposição de verdades jurídicas absolutas impostas por um terceiro.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q10", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.10", "tema": "", "enun": "A principal característica do processo de mediação é a:\n\nA) técnica.\nB) competição.\nC) linguagem.\nD) discordância.\nE) comunicação.", "gab": "E", "gabLabel": "", "html": "A comunicação é o instrumento basilar e a característica essencial da mediação, nos termos do art. 165, § 3º, do CPC/15, permitindo às partes compreender os interesses subjacentes e alcançar soluções consensuais.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q11", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.11", "tema": "", "enun": "Um meio de resolução de controvérsias, referentes a direitos patrimoniais disponíveis, no qual ocorre a intervenção de um terceiro independente e imparcial, que recebe poderes de uma convenção para decidir por elas, sendo sua decisão equivalente a uma sentença judicial é denominado de:\n\nA) Mediação.\nB) Arbitragem.\nC) Conciliação.\nD) Audiência.\nE) Avaliação.", "gab": "B", "gabLabel": "", "html": "A arbitragem (regulada pela Lei nº 9.307/96) é um método heterocompositivo privado em que um terceiro imparcial profere sentença arbitral com força vinculante e eficácia de título executivo judicial (art. 515, VII, do CPC/15), restrita a direitos patrimoniais disponíveis.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q12", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.12", "tema": "", "enun": "A interferência em uma negociação ou em um conflito de uma terceira parte aceitável, tendo poder de decisão limitado ou não-autoritário, e que ajuda as partes envolvidas a chegarem voluntariamente a um acordo aceitável com relação às questões em disputa, é denominada\n\nA) mediação.\nB) resolução.\nC) contenda.\nD) arbitragem.\nE) conciliação.", "gab": "A", "gabLabel": "", "html": "Trata-se da definição clássica de mediação: atuação de um terceiro imparcial e sem poder de decisão coercitivo que facilita o restabelecimento do diálogo voluntário entre as partes (art. 165, § 3º, do CPC/15).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q13", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.13", "tema": "", "enun": "Leia as afirmações com atenção e assinale a alternativa correta:\n\nI – Na submissão há concessões recíprocas.\nII – Na desistência há renúncia à pretensão.\nIII – Na transação há renúncia à resistência oferecida à pretensão.\n\nA) Somente a alternativa I está correta;\nB) Somente a alternativa II está correta;\nC) Somente as alternativas II e III estão corretas;\nD) Todas as alternativas estão corretas;\nE) Todas as alternativas estão incorretas.", "gab": "B", "gabLabel": "", "html": "- I é INCORRETA (concessões recíprocas ocorrem na <i>transação</i> - art. 840 do CC);   - II é CORRETA (desistência implica renúncia à pretensão);   - III é INCORRETA (renúncia à resistência caracteriza a <i>submissão</i>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q14", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.14", "tema": "", "enun": "Leia as afirmações com atenção e assinale a alternativa correta:\n\nI – Trata-se de um crime previsto em lei, “Fazer justiça pelas próprias mãos, para satisfazer pretensão, embora legítima, salvo quando a lei o permite”.\nII – A legítima defesa da posse é uma forma de autotutela prevista em lei.\nIII – A autotutela é o único meio de solução de conflitos.\n\nA) Somente a alternativa I está correta;\nB) Somente a alternativa II está correta;\nC) Somente as alternativas I e II estão corretas;\nD) Todas as alternativas estão corretas;\nE) Todas as alternativas estão incorretas.", "gab": "C", "gabLabel": "", "html": "- I é CORRETA (art. 345 do Código Penal - exercício arbitrário das próprias razões);   - II é CORRETA (art. 1.210, § 1º, do Código Civil - desforço imediato/legítima defesa da posse);   - III é INCORRETA (existem autocomposição, arbitragem e jurisdição estatal).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q15", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.15", "tema": "", "enun": "Leia as afirmações com atenção e assinale a alternativa correta:\n\nI – A Arbitragem é uma forma de solução de conflitos relativo a direitos patrimoniais disponíveis, em que as partes escolhem um árbitro, ou grupo de árbitros.\nII – A arbitragem não tem previsão legal, sendo prevista na jurisprudência.\nIII – A compromisso arbitral é a convenção através da qual as partes submetem um litígio à arbitragem de uma ou mais pessoas, podendo ser judicial ou extrajudicial.\n\nA) Somente a alternativa I está correta;\nB) Somente a alternativa II está correta;\nC) Somente as alternativas I e III estão corretas;\nD) Todas as alternativas estão corretas;\nE) Todas as alternativas estão incorretas.", "gab": "C", "gabLabel": "", "html": "- I é CORRETA (art. 1º da Lei nº 9.307/1996);   - II é INCORRETA (a arbitragem possui regramento legal expresso na Lei nº 9.307/96 e no art. 3º, § 1º, do CPC/15);   - III é CORRETA (art. 9º da Lei nº 9.307/1996).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q16", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.16", "tema": "", "enun": "Leia as afirmações com atenção e assinale a alternativa correta:\n\nI – Negociação é a comunicação voltada à persuasão.\nII – Conciliação é um processo consensual breve, envolvendo contextos conflituosos menos complexos, no qual as partes são auxiliadas por um terceiro, neutro à disputa, sem interesse na causa para ajudá-las, por meio de técnicas adequadas, a chegar a uma solução ou acordo.\nIII – Mediação é um processo autocompositivo segundo o qual as partes em disputa são auxiliadas por uma terceira parte neutra ao conflito e sem interesse na causa, para se chegar a uma composição por meio da comunicação.\n\nA) Somente a alternativa I está correta;\nB) Somente a alternativa II está correta;\nC) Somente as alternativas I e III estão corretas;\nD) Todas as alternativas estão corretas;\nE) Todas as alternativas estão incorretas.", "gab": "D", "gabLabel": "", "html": "Todas as afirmações I, II e III conceituam com exatidão doutrinária e legal (art. 165 do CPC/15 e Lei nº 13.140/2015) os três institutos autocompositivos.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q17", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.17", "tema": "", "enun": "Leia as afirmações com atenção e assinale a alternativa correta:\n\nI – A submissão é uma forma de autocomposição.\nII – A desistência é uma forma de autocomposição.\nIII – A transação é uma forma de autocomposição.\n\nA) Somente a alternativa I está correta;\nB) Somente a alternativa II está correta;\nC) Somente as alternativas II e III estão corretas;\nD) Todas as alternativas estão corretas;\nE) Todas as alternativas estão incorretas.", "gab": "D", "gabLabel": "", "html": "As três modalidades (submissão/renúncia à resistência, desistência/renúncia à pretensão e transação/concessões mútuas) constituem as espécies clássicas de autocomposição.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M1-Q18", "bloco": "MÓDULO 1 — Meios de Solução dos Conflitos — Autocomposição, Heterocomposição, Meios Extrajudiciais", "num": "Ex.18", "tema": "", "enun": "Leia as afirmações com atenção e assinale a alternativa correta:\n\nI – Na heterocomposição não há intromissão de terceiro estranho à relação jurídica.\nII – A heterocomposição é uma forma de autotutela.\nIII – A arbitragem é uma forma de solução de conflito de interesses realizada pelo Poder Judiciário através da jurisdição.\n\nA) Somente a alternativa I está correta;\nB) Somente a alternativa II está correta;\nC) Somente as alternativas I e II estão corretas;\nD) Todas as alternativas estão corretas;\nE) Todas as alternativas estão incorretas.", "gab": "E", "gabLabel": "", "html": "- I é INCORRETA (na heterocomposição HÁ necessariamente a intervenção de um terceiro);   - II é INCORRETA (heterocomposição e autotutela são categorias distintas e opostas);   - III é INCORRETA (a arbitragem é heterocomposição privada e não se confunde com a jurisdição estatal).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q1", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.1", "tema": "", "enun": "As matérias de competência legislativa privativa da União incluem:\n\nA) a criação de impostos municipais.\nB) a criação de impostos estaduais.\nC) a criação de impostos municipais e estaduais.\nD) direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho.\nE) estabelecer e implantar política de educação para a segurança do trânsito local.", "gab": "D", "gabLabel": "", "html": "Nos termos do art. 22, inciso I, da Constituição Federal de 1988, compete privativamente à União legislar sobre direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q2", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.2", "tema": "", "enun": "É vedada a edição de medidas provisórias sobre matéria relativa a:\n\nA) direito penal, apenas;\nB) direito penal e processual penal, apenas;\nC) direito processual penal e processual civil, apenas;\nD) direito penal, processual penal e processual civil;\nE) NDA.", "gab": "D", "gabLabel": "", "html": "Conforme o art. 62, § 1º, inciso I, alínea \"b\", da CF/88 (redação dada pela EC nº 32/2001), é vedada a edição de medidas provisórias sobre matéria relativa a direito penal, processual penal e processual civil.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q3", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.3", "tema": "", "enun": "As medidas provisórias podem tratar de matéria relativa a\n\nA) direito eleitoral.\nB) direito econômico se não reservada a lei complementar.\nC) direito processual civil.\nD) direitos políticos.\nE) direito processual penal, mas não a direito penal.", "gab": "B", "gabLabel": "", "html": "O art. 62, § 1º, I, da CF/88 proíbe Medidas Provisórias sobre direito penal, processual penal, processual civil, eleitoral e direitos políticos. O direito econômico pode ser objeto de MP, desde que não envolva matéria reservada a lei complementar (art. 62, § 1º, III, CF).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q4", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.4", "tema": "", "enun": "São fontes formais do direito processual:\n\nA) as leis federais, as leis estaduais e as leis municipais.\nB) apenas as leis federais.\nC) as leis federais, estaduais ou municipais e a Constituição Federal.\nD) as leis federais e a Constituição Federal.\nE) as leis federais e as leis municipais.", "gab": "D", "gabLabel": "", "html": "As fontes formais primárias do Direito Processual são a Constituição Federal (que estabelece os princípios e garantias fundamentais do processo) e as leis federais (dado a competência privativa da União para legislar sobre matéria processual - art. 22, I, CF).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q5", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.5", "tema": "", "enun": "Considerando que “[...] o direito processual civil volta-se ao estudo das normas regentes da atividade jurisdicional destinadas à resolução dos conflitos intersubjetivos [...]”(in Curso sistematizado de direito processual civil : teoria geral do processo civil : volume 1 / Cassio Scarpinella Bueno – São Paulo : Saraiva, 2007) responda:\n\nA) o direito processual civil é estranho a um conflito que não envolva pelo menos duas pessoas.\nB) o direito processual serve para resolver qualquer modalidade de conflito, independentemente do número de pessoa(s) envolvida(s).\nC) o direito processual pode ser utilizado para resolver problemas de inquietações subjetivas indivíduo.\nD) o direito processual não serve para resolver conflitos intersubjetivos, para tanto deve ser utilizado o Código Penal.\nE) o exercício da atividade jurisdicional é disciplinado exclusivamente pela Constituição Federal.", "gab": "A", "gabLabel": "", "html": "Conflito intersubjetivo exige a presença de pelo menos dois sujeitos de direito (duas ou mais pessoas). Não havendo alteridade/intersubjetividade, o processo civil não encontra aplicação, pois não se presta a dirimir dilemas meramente subjetivos ou individuais.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q6", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.6", "tema": "", "enun": "Considere as seguintes assertivas:\n\nI- O novo CPC tem por objetivo estabelecer expressa e implicitamente verdadeira sintonia fina com a Constituição Federal.\nII- O direito processual civil é um ramo autônomo do direito que é regido por normas e princípios próprios.\nIII- O direito processual civil, muito embora seja autônomo, relaciona-se com outros ramos do direito.\n\nA) todas as assertivas estão erradas.\nB) apenas as assertivas I e II estão corretas.\nC) apenas as assertivas I e III estão corretas.\nD) apenas as assertivas II e III estão corretas.\nE) todas as assertivas estão corretas.", "gab": "E", "gabLabel": "", "html": "Todas as assertivas são corretas: I reproduz diretriz da Exposição de Motivos do CPC/15 (art. 1º); II expressa a autonomia científica do Direito Processual; III reflete a interdisciplinaridade do processo civil com o Direito Constitucional, Civil, Penal e Administrativo.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q7", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.7", "tema": "", "enun": "O direito processual civil, muito embora tenha identidade, função, finalidade e naturezas próprias, serve, atende e volta-se para a aplicação concreta do direito material.\n\nA) a afirmativa está correta, pois o direito processual civil é totalmente dependente do direito civil.\nB) a afirmativa está correta, pois o direito processual civil, muito embora seja autônomo e independente, serve para a aplicação do direito material.\nC) a afirmativa não está correta, pois o direito processual civil é totalmente autônomo e independente de qualquer outro ramo do direito.\nD) a afirmativa não está correta, pois o direito processual não tem finalidade instrumental.\nE) n.d.a.", "gab": "B", "gabLabel": "", "html": "O Direito Processual Civil possui autonomia científica, mas detém caráter eminentemente instrumental, atuando como meio indispensável para a realização e efetivação do direito material no mundo empírico.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q8", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.8", "tema": "", "enun": "Considerando a íntima relação entre o direito constitucional e o direito processual leia as afirmações que seguem e depois indique a alternativa correta:\n\nI- ninguém será processado nem sentenciado senão pela autoridade policial competente;\nII- em alguns casos o indivíduo poderá será privado da liberdade e/ou de seus bens sem o devido processo legal;\nIII- serão assegurados aos litigantes apenas em processo judicial, o contraditório e ampla defesa, com os meios e recursos a ela inerentes.\n\nA) todas as assertivas estão erradas.\nB) apenas as assertivas I e II estão corretas.\nC) apenas as assertivas I e III estão corretas.\nD) apenas as assertivas II e III estão corretas.\nE) todas as assertivas estão corretas.", "gab": "A", "gabLabel": "", "html": "- I é INCORRETA (art. 5º, LIII, CF - autoridade <i>judiciária</i> competente);   - II é INCORRETA (art. 5º, LIV, CF - <i>ninguém</i> será privado da liberdade ou bens sem o devido processo legal);   - III é INCORRETA (art. 5º, LV, CF - assegurado em processo judicial <i>ou administrativo</i>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q9", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.9", "tema": "", "enun": "“Sendo ineficiente o sistema processual, todo o ordenamento jurídico passa a carecer de real efetividade. De fato, as normas de direito material se transformam em pura ilusão, sem a garantia de sua correlata realização, no mundo empírico, por meio do processo.” (Exposição de motivos do novo código de processo civil). Considerando tal afirmação responda:\n\nA) o texto indica a total falência do direito material em razão das constantes mudanças da sociedade.\nB) o texto aponta que em razão da existência de relação de dependência entre o direito material e o direito processual, se o processo não for efetivo as normas de direito material são inúteis.\nC) o texto aponta que muito embora inexista de relação de dependência entre o direito material e o direito processual, se o sistema processual não for efetivo, a eficácia das normas de direito material se transformam em ilusão.\nD) o texto aponta que em razão de existência de dependência do direito material em relação ao direito processual, com a mudança do código de processo civil, em breve o legislador também deverá mudar o código civil.\nE) n.d.a.", "gab": "C", "gabLabel": "", "html": "O Direito Material e o Direito Processual são ramos autônomos (inexistindo relação de dependência hierárquica ou existencial). Contudo, dada a instrumentalidade do processo, se o sistema processual for ineficiente, a eficácia concreta das normas materiais vira mera ilusão.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q10", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.10", "tema": "", "enun": "Lei federal que autorizasse os Estados a legislarem sobre aspectos específicos de procedimentos em matéria processual seria:\n\nA) incompatível com a Constituição da República, por se tratar de matéria de competência legislativa concorrente, podendo os Estados até mesmo exercer competência legislativa plena, para atender a suas peculiaridades, na hipótese de inexistência de lei federal sobre normas gerais na matéria.\nB) compatível com a Constituição da República, por se tratar de matéria de competência legislativa privativa da União, a quem compete delegá-la, nesses moldes, aos Estados.\nC) compatível com a Constituição da República, desde que a autorização se dê por lei complementar, espécie normativa exigida para esse fim em relação às matérias de competência legislativa privativa da União.\nD) incompatível com a Constituição da República, por se tratar de competência legislativa privativa da União, que não admite delegação aos Estados.\nE) nenhuma das alternativas anteriores.", "gab": "A", "gabLabel": "", "html": "Por se tratar expressamente de <i>\"procedimentos em matéria processual\"</i>, a competência é concorrente entre União, Estados e DF (art. 24, XI, CF/88). Dessa forma, é incompatível exigir lei federal autorizativa (pois a competência decorre da própria CF), podendo os Estados exercer competência legislativa plena para atender suas peculiaridades caso inexista lei federal sobre normas gerais (art. 24, § 3º, CF/88). Não confundir com <i>direito processual</i> (art. 22, I), que é privativo da União.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q11", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.11", "tema": "", "enun": "As normas de direito material tratam de normas de conduta, com as quais o Estado proporciona o controle do comportamento social, ou seja, cria um conjunto de normas que disciplinam as relações jurídicas referentes aos bens e as utilidades da vida em socidade, cujo mais claro exemplo é a Lei n° 10.406/2002, chamada de Código Civil Brasileiro. Em contrapartida, temos as normas adjetivas, mais conhecidas como processuais, sobre elas é correto afirmar:\n\nA) Trata-se de um conjunto de regras que regulam as relações contratuais estabelecendo, inclusive, cláusulas arbitrais;\nB) Formam um sistema de princípios e regras que regulam o processo, disciplinando as atividades dos sujeitos processuais, dos órgãos jurisdicionais e seus auxiliares;\nC) São exemplos o processo penal, o processo civil, o processo administrativo e o Direito constitucional; São exemplos o processo penal, o processo civil, o processo administrativo e o Direito constitucional;\nD) Todas as anteriores estão corretas;\nE) Nenhuma das anteriores;", "gab": "B", "gabLabel": "", "html": "Conforme expressamente conceituado no texto doutrinário do Módulo 2, as normas adjetivas (processuais) formam o conjunto/sistema de princípios e regras que regulam o processo, disciplinando a atividade dos sujeitos da relação processual, dos órgãos jurisdicionais e de seus auxiliares.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q12", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.12", "tema": "", "enun": "Joãozinho acionou Mariazinha perante a vara cível de sua competência para cobrar-lhe um cheque cuja compensação não ocorreu. O cheque fora dado como pagamento de uma parcela de pagamento da compra de um veículo. Evidentemente, a relação entre Joãozinho e Mariazinha é estritamente privada, ou seja, regulada pelo Direito Civil e de interesse primordial às partes, tanto que, querendo, poderia Joãozinho deixar de cobrar tal valor se entendesse incoveniente. Considerando a natureza instrumental do processo, diante dessa situação o processo terá natureza de Direito _________________________________________________________________________________________________?\nPreencha a lacuna com a afirmativa correta:\n\nA) Natureza de Direito Privado, pois é instrumental ao direito que resolve e, portanto, sendo privado o litígio, privada é a natureza do Processo Civil em questão;\nB) Público, pois ainda que seja instrumental sua natureza, o processo civil sempre será público, pois lida com a jurisdição que tem a capacidade coativa do direito, não se limitando ao exclusivo interesse das partes, mas a toda a sociedade quanto a correta condução desse poder;\nC) Público, pois na verdade, no momento em que a situação vai para o Poder Judiciário a matéria se converte em pública tanto que é proibido às partes firmarem acordo sobre o assunto por se tratar de Direito Indisponível;\nD) Todas as anteriores estão corretas;\nE) Todas as anteriores estão erradas;", "gab": "B", "gabLabel": "", "html": "O Direito Processual Civil é ramo inafastável do Direito Público, pois disciplina o exercício do Poder Jurisdicional do Estado (função soberana), independente da natureza privada do direito material controvertido entre os litigantes.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q13", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.13", "tema": "", "enun": "Por mais que o estudo do Dirieto se dê em partes, é evidente que cada ramo do direito se relaciona com os demais ramos, pois sua divisão é apenas instrumental, ou seja, limita-se para fins estritamente acadêmicos e científicos, pois o direito, em si mesmo, é uno. Considerando isso, qual das alternativas abaixo está ERRADA:\n\nA) O processo civil não tem qualquer diálogo com o Direito Penal;\nB) O Direito Constitucional é a principal influência do Processo Civil conforme impõe seu próprio art. 1º;\nC) O Dirieto Administrativo influência o processo civil principalmente na relação da organização judiciária, dos deveres e direitos dos auxiliares da justiça e administração interna do Poder Judiciário com licitações e concursos públicos;\nD) O Direito Civil - considerado o mais influenciador depois do Direito Constitucional - influência o processo civil em situações como capacidade civil, provas, prescrição e decadência;\nE) Falso testemunho é um exemplo de influência do Direito Penal no Processo Civil.", "gab": "A", "gabLabel": "", "html": "A alternativa A é FALSA (e portanto a resposta solicitada pelo comando \"ERRADA\"), pois o processo civil dialoga constantemente com o Direito Penal (ex: conceitos de falsidade documental, falso testemunho e coação processual).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q14", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.14", "tema": "", "enun": "O Direito Processual Civil não é uma experiência nova - podendo remontar-se até o Século III d.C - e, por isso, teve diversas formas de ver e foi nominado de diversas formas, como, por exemplo, \"práticas\" no Século XI e, mais adiante, \"direito Judiciário\", vindo a chamar-se direito processual apenas depois do Século XIX. Sobre sua denominação, responda:\n\nA) O Direito Material e o Processual são vinculados permanentemente, de modo que o processo inexiste sem o material, denominando-se o processo como \"exercício do direito material\";\nB) Processo é um conjunto de atos no tempo destinados a realizar um contrato entre as partes;\nC) O processo é um conjunto de atos no tempo destinados a resolver uma lide entre duas pessoas ou menos;\nD) A progressão do direito processual fez ele se desvincular absolutamente do direito material levando-o a ser denominado como sequência de atos no tempo destinados a pacificar as opiniões das pessoas;\nE) Todas as anteriores estão erradas;", "gab": "E", "gabLabel": "", "html": "Todas as opções anteriores A, B, C e D trazem equívocos conceituais sobre a evolução histórica e a conceituação científica do Direito Processual Civil.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q15", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.15", "tema": "", "enun": "Quais das normas abaixo não retrata a relação existente entre o Direito Processual Civil e o Direito Constitucional;\n\nA) Art. 1°, O processo civil será ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais estabelecidos na Constituição da República Federativa do Brasil, observando-se as disposições deste Código.\nB) Art. 7º É assegurada às partes paridade de tratamento em relação ao exercício de direitos e faculdades processuais, aos meios de defesa, aos ônus, aos deveres e à aplicação de sanções processuais, competindo ao juiz zelar pelo efetivo contraditório.\nC) Art. 9º Não se proferirá decisão contra uma das partes sem que ela seja previamente ouvida.\nD) Art. 4º As partes têm o direito de obter em prazo razoável a solução integral do mérito, incluída a atividade satisfativa.\nE) Todas as anteriores estão corretas;", "gab": "E", "gabLabel": "", "html": "Todos os artigos transcritos (arts. 1º, 4º, 7º e 9º do CPC/15) retratam direta e expressamente princípios e garantias fundamentais constitucionalizadas no processo civil (devido processo legal, isonomia, contraditório e celeridade).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q16", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.16", "tema": "", "enun": "Alguns dirão que a paz só é obtida por meio da guerra. Outros dirão que o processo civil é o espaço onde as partes combatem processualmente para que não venham a fazê-lo fisicamente na vidade real e, assim, não usem da própria força na prática da autotutela. Considerando tais assertivas, qual é o escopo principal do processo:\n\nA) Educacional;\nB) Atuação da vontade concreta do direito;\nC) Pacificação social;\nD) Preservação da Liberdade;\nE) Nenhuma das anteriores", "gab": "D", "gabLabel": "", "html": "No contexto específico do combate à autotutela (impedir que as partes façam justiça com as próprias mãos pela força física na vida real), a doutrina e o banco de dados da UNIP assinalam o escopo de Preservação da Liberdade (escopo político da jurisdição que assegura a convivência sob o império da lei e da ordem pública).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q17", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.17", "tema": "", "enun": "Qual dos exemplos abaixos retrata corretamente os escopos do processo:\n\nA) Pacificação, educacional, preservação da liverdade, respeito ao ordenamento jurídico e atuação da vontade concreta do direito;\nB) Promover a igualdade material mediante redistribuição de renda;\nC) Pacificação do conflito mediante a obrigação da prática de conciliação ou mediação entre as partes;\nD) Todas as anteriores estão corretas;\nE) Todas as anteriores estão erradas;", "gab": "A", "gabLabel": "", "html": "A alternativa A reproduz integralmente os escopos sociais, jurídicos e políticos da jurisdição elencados pela doutrina (Cândido Rangel Dinamarco / Scarpinella Bueno).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M2-Q18", "bloco": "MÓDULO 2 — Direito Processual — Conceito, Autonomia, Divisão, Relações e Objetivo", "num": "Ex.18", "tema": "", "enun": "Qual é o ramo do direito que mais influencia o Direito Processual Civil:\n\nA) O Direito Civil, por ser o direito material mais invocado pelas lides;\nB) O Direito Penal por limitar as partes e evitar que as mesmas pratiquem atos ilícitos dentro do processo;\nC) O Direito Constitucional por ser a norma fundamental do Estado de onde derivam todas as demais normas;\nD) O Direito do Trabalho, por conter normas processuais na CLT - como o art. 897-A - que podem ser aplicados por analogia legis;\nE) O Direito Administrativo por contar com uma norma de procedimento administrativo próprio - Lei 9.784/99 - que pode ser usada por analogia no processo civil;", "gab": "C", "gabLabel": "", "html": "O Direito Constitucional é o ramo de maior influência sobre o Direito Processual Civil, ditando seus princípios fundamentais, a estrutura do Poder Judiciário e as garantias processuais essenciais (art. 1º do CPC/15).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q1", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.1", "tema": "", "enun": "A respeito da incidência da lei processual nova sobre processos pendentes quando do início da sua vigência, aplica-se a teoria:\n\nA) da unidade processual, segundo a qual a lei nova se aplica apenas aos processos ajuizados após sua entrada em vigor, evitando a retroatividade e preservando a validade dos atos processuais já praticados.\nB) da unidade processual, consoante a qual a lei nova deve incidir sobre todos os atos, passados e futuros do processo pendente, repetindo-se os atos praticados em desconformidade com a lei nova.\nC) do isolamento dos atos processuais, isto é, os atos ainda pendentes dos processos em curso se sujeitam aos comandos da lei nova, respeitada a eficácia daqueles atos já praticados de acordo com a lei antiga.\nD) das fases processuais, devendo cada fase (postulatória, probatória, decisória e recursal) ser compreendida como um conjunto inseparável de atos, devendo a lei nova disciplinar apenas os atos processuais de fases ainda não iniciadas.\nE) n.d.a.", "gab": "C", "gabLabel": "", "html": "Nos termos do art. 14 do CPC/15 e do Item III do texto teórico do Módulo 3, o ordenamento jurídico pátrio adota a teoria do Isolamento dos Atos Processuais, pela qual a lei nova é aplicável imediatamente aos processos em curso, respeitados os atos já praticados sob a vigência da lei revogada.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q2", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.2", "tema": "", "enun": "Considere:\nI. São fontes formais da norma processual civil a Constituição Federal, bem como os demais atos que ela prevê ou consente, quais sejam, a lei, os tratados internacionais, os princípios gerais do direito e os usos e costumes forenses.\nII. Na interpretação da lei processual civil, o método empregado é o exegético ou gramatical, consistente na busca do significado do texto no conjunto das disposições correlatas, contidas na ordem jurídico-positiva como um todo.\nIII. No tocante à eficácia da lei processual civil no tempo, aplica-se ordinariamente a regra <i>tempus regit actum</i>, pela qual fatos ocorridos e situações já consumadas no passado não se regem pela lei nova que entra em vigor, mas continuam valorados segundo a lei do seu tempo.\nEstá correto o que consta em:\n\nA) III, apenas.\nB) I e III, apenas.\nC) I e II, apenas.\nD) II e III, apenas.\nE) I, II e III.", "gab": "B", "gabLabel": "", "html": "As assertivas I e III estão corretas. A assertiva II é incorreta pois a busca do significado no conjunto das disposições correlatas do sistema caracteriza o método <i>sistemático</i>, e não o método exegético/gramatical (Item II do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q3", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.3", "tema": "", "enun": "No tocante à eficácia da lei no tempo, é INCORRETO afirmar:\n\nA) Pode haver retroatividade expressa, desde que não atinja direito adquirido.\nB) Mesmo que a lei retroaja, por expressa vontade legislativa, não pode atingir os efeitos dos atos jurídicos praticados sob o império da norma revogada.\nC) A regra geral, no silêncio da lei, é sua irretroatividade.\nD) São de ordem constitucional os princípios do respeito ao direito adquirido e ao ato jurídico perfeito.\nE) Como regra, a lei nova tem efeito imediato, não se aplicando aos fatos anteriores.", "gab": "B", "gabLabel": "", "html": "A alternativa B é a incorreta (resposta da questão). A lei retroativa pode sim atingir efeitos pendentes ou futuros de atos passados, desde que não viole o ato jurídico perfeito, o direito adquirido e a coisa julgada (art. 5º, XXXVI, CF/88 e art. 6º da LINDB).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q4", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.4", "tema": "", "enun": "Em relação à eficácia da lei no tempo, assinale a opção correta.\n\nA) Por meio da revogação, em sentido amplo, termo afeto ao processo legislativo, a norma é extinta do sistema jurídico por outro ato normativo da mesma espécie, o que não se aplica às normas declaradas inconstitucionais.\nB) A irretroatividade é a regra geral em matéria de direito intertemporal, não se admitindo, em hipótese alguma, a retroatividade de atos normativos em observância à segurança jurídica.\nC) A promulgação da lei a torna obrigatória para a coletividade.\nD) Pode ser promulgated nova lei sobre o mesmo assunto de norma já promulgada, sem que se ab-rogue tacitamente a anterior.\nE) A vigência da lei coincide necessariamente com a data de sua publicação no Diário Oficial.", "gab": "D", "gabLabel": "", "html": "Nos termos do art. 2º, § 2º, da LINDB (<i>\"A lei nova, que estabeleça disposições gerais ou especiais a par das já existentes, não revoga nem altera a lei anterior\"</i>), é possível a coexistência de leis tratando do mesmo assunto sem revogação/ab-rogação tácita.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q5", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.5", "tema": "", "enun": "Direito Civil Baseado em antiga parêmia - <i>ubi eadem ratio, ibi eadem dispositio</i> - escreve Miguel Reale: “É de presumir-se que, havendo correspondência de motivos, igual deve ser o preceito aplicável” (Filosofia do Direito. V. 1, 7. ed. São Paulo: Saraiva, 1975. p. 128). Esse texto refere-se:\n\nA) à eficácia da lei no tempo e no espaço.\nB) à aplicação das leis segundo sua hierarquia.\nC) aos princípios gerais do Direito.\nD) à analogia.\nE) à equidade.", "gab": "D", "gabLabel": "", "html": "A analogia funda-se na identidade de razões jurídicas (<i>ubi eadem ratio, ibi eadem dispositio</i>) para aplicar a mesma solução legislativa a caso não expressamente regulado (Item I do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q6", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.6", "tema": "", "enun": "A lei começa a vigorar, salvo disposição em contrário:\n\nA) trinta dias depois de publicada, mas com eficácia plena durante a <i>vacatio legis</i>.\nB) quarenta e cinco dias depois de promulgada, não produzindo efeitos enquanto não estiver efetivamente em vigor.\nC) quarenta e cinco dias depois de publicada, não produzindo efeitos enquanto não estiver efetivamente em vigor.\nD) quarenta e cinco dias depois de publicada, mas com eficácia plena durante a <i>vacatio legis</i>.\nE) quarenta e cinco dias depois de promulgada, mas com eficácia plena durante a <i>vacatio legis</i>.", "gab": "C", "gabLabel": "", "html": "Art. 1º da LINDB: <i>\"Salvo disposição contrária, a lei começa a vigorar em todo o país quarenta e cinco dias depois de oficialmente publicada\"</i>. Durante o período da <i>vacatio legis</i>, a lei não produz efeitos jurídicos (Item III do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q7", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.7", "tema": "", "enun": "A interpretação normativa:\n\nA) deve ser realizada, preferencialmente, de maneira sistemática e teleológica, considerando o ordenamento em que a norma está inserida e a finalidade para a qual se destina.\nB) deve ser realizada, em regra, de maneira sistemática, considerando a norma em si mesma, em sua literalidade, sem levar em conta o ordenamento em que está inserida.\nC) teleológica, também chamada de histórica, busca a vontade do legislador no momento da elaboração da norma.\nD) histórica prevalece sobre a sistemática, a qual busca o sentido literal de uma determinada norma.\nE) dá-se pela aplicação da analogia, dos costumes e dos princípios gerais do direito, em caso de silêncio eloquente ou de lacuna legal.", "gab": "A", "gabLabel": "", "html": "A interpretação conjunta sistemática e teleológica expressa a regra hermenêutica moderna (art. 5º da LINDB e art. 8º do CPC/15; Item II do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q8", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.8", "tema": "", "enun": "Os termos que obtiveram na linguagem jurídica um significado específico, como, por exemplo, contrato, crédito, impugnabilidade, nulidade de um negócio jurídico, herança, legado, são usados nas leis, na maioria das vezes, com este significado especial. Deste modo, eliminam-se inúmeras variantes de significado do uso linguístico geral e o círculo dos possíveis significados, adentro do qual se há- se proceder à seleção com base noutros critérios, estreita-se em grande medida. Com o esclarecimento do uso linguístico jurídico preciso, a interpretação pode, em certas ocasiões, chegar ao seu termo, a saber, quando nada indicie no sentido de que a lei se desviou, precisamente nesta passagem, daquele uso. (LARENZ, Karl. Metodologia da Ciência do Direito. Tradução de José Lamego. Fundação Calouste Gulbenkian 2. ed. Lisboa, 1989. p. 386) Esse texto corresponde:\n\nA) à interpretação lógica da lei.\nB) aos usos e costumes como fonte interpretativa do direito.\nC) à interpretação literal da lei.\nD) à analogia.\nE) à interpretação sistemática da lei.", "gab": "C", "gabLabel": "", "html": "A interpretação literal ou gramatical analisa a significação dos termos linguísticos técnicos empregados na norma jurídica (Item II do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q9", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.9", "tema": "", "enun": "Com relação aos institutos da interpretação e da integração da lei, assinale a opção correta.\n\nA) Segundo a doutrina, os princípios gerais do direito expressam-se nas máximas jurídicas, nos adágios ou brocardos...\nB) A interpretação histórica tem por objetivo adaptar o sentido ou a finalidade da norma às novas exigências sociais...\nC) Implícito no sistema jurídico civil, o princípio segundo o qual ninguém pode transferir mais direitos do que tem é compreendido como princípio geral de direito, podendo ser utilizado como meio de integração das normas jurídicas.\nD) No direito civil, não há doutrina que admita a hierarquia na utilização dos mecanismos de integração das normas jurídicas...\nE) Não há distinção entre analogia <i>legis</i> e analogia <i>juris</i>...", "gab": "C", "gabLabel": "", "html": "A regra <i>nemo plus iuris ad alium transferre potest quam ipse habet</i> é exemplo clássico de princípio geral do direito utilizado na colmatação de lacunas (Item I do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q10", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.10", "tema": "", "enun": "Quando a lei for omissa, o juiz decidirá o caso com o emprego da:\n\nA) analogia, dos costumes e dos princípios gerais do direito.\nB) equidade em quaisquer casos, dos costumes e dos princípios gerais do direito.\nC) analogia, da equidade e dos costumes, apenas.\nD) interpretação, dos costumes, da equidade e dos princípios gerais do direito.\nE) interpretação, da analogia e dos princípios gerais do direito.", "gab": "A", "gabLabel": "", "html": "Literalidade do art. 4º da LINDB: <i>\"Quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito\"</i> (Item I do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q11", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.11", "tema": "", "enun": "Quanto às Fontes do Direito Processual Civil, compreendendo a inteligência do art. 1º de seu próprio texto, tem-se por correto que:\n\nA) Ao contrário das leis substanciais, o direito processual civil aplica-se no Brasil apenas aos nacionais...\nB) A fonte mais importante no Brasil é a jurisprudência em razão de sua natureza common law...\nC) Como o processo civil é indivisível, deve ser regulado por uma única lei...\nD) A Lei Processual Civil prevalece às normas, regras, princípios e mandamentos esculpidos das Constituição Federal;\nE) A Fonte primeira do Direito Processual Civil é a Constituição Federal.", "gab": "E", "gabLabel": "", "html": "Nos termos do art. 1º do CPC/15 e do Item I do texto do Módulo 3, a Constituição Federal é a fonte primordial e o vetor hermenêutico supremo do Direito Processual Civil brasileiro.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q12", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.12", "tema": "", "enun": "A lei é o preceito jurídico escrito, emanado do legislador e dotado de caráter geral e obrigatório. Qual das características abaixo descritas não integra ao conceito de lei:\n\nA) Generalidade;\nB) Imperatividade;\nC) Autorizamento;\nD) Relatividade;\nE) Permanência;", "gab": "D", "gabLabel": "", "html": "Conforme transcrito no Item I do texto do Módulo 3, as características da lei são: (i) generalidade, (ii) imperatividade, (iii) autorizamento, (iv) permanência e (v) emanada por autoridade competente. \"Relatividade\" não figura entre essas características.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q13", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.13", "tema": "", "enun": "Duas são as principais fontes do Direito Processual: as fontes primárias e as secundárias. Qual dos exemplos abaixo se enquadra no rol de fonte primária:\n\nA) A Lei;\nB) Costume e a Analogia;\nC) Doutrina;\nD) Jurisprudência;\nE) Todas estão corretas;", "gab": "A", "gabLabel": "", "html": "A lei é a fonte primária/principal por excelência do direito positivo brasileiro, figurando as demais como fontes secundárias ou meios de integração (Item I do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q14", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.14", "tema": "", "enun": "Joãozinho, infelizmente, precisou promover um processo de interdição contra sua mãe Adélia para cuidar de seu patrimônio e sua vida. Sua irmã, porém, Mariazinha, divergia dele em muitos pontos e com ele tinha uma inimizade pessoal que a fez intervir tanto na interdição como a promover um processo de regulamentação de visitas. Ocorre que toda vez que Mariazinha visitava sua mãe falava mal do irmão para a mãe com acusações sérias como roubo do seu patrimônio e medicação temerária fazendo com que a mãe, portadora de doenças mentais, ficasse em estado de nervos e irascível contra o fiho que era o seu curador. Joãozinho, exasperado te procurou como advogado, mas você viu que não existia lei sobre o assunto e, então, sugeriu utilizar da Lei de Alienação Parental porque se tratava de uma hipótese parecida com a sua.\n\nNesse caso, qual método de integração foi utilizado:\n\nA) Os Princípios gerais do direito;\nB) Interpretação histórica da Lei;\nC) Os costumes;\nD) Analogia <i>juris</i>;\nE) Analogia <i>legis</i>;", "gab": "E", "gabLabel": "", "html": "A <i>analogia legis</i> consiste na aplicação de uma norma jurídica específica de um dispositivo legal a um caso omisso semelhante (Item I do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q15", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.15", "tema": "", "enun": "O costume, quando a lei for omissa, também poderá juntar-se no trabalho de interpretação do caso <i>sub judice</i>. Seu conceito pode ser definido como uma norma aceita como obrigatória pela consciência popular, sem que o Poder Público a tenha estabelecido (por lei ou jurisprudência). Considerando a assertiva anterior, qual das alternativas abaixo retrata corretamente os requisitos para que o costume intervenha como fonte do direito:\n\nA) O requisito objetivo é a intermitência do ato e o subjetivo é a habitualidade;\nB) O subjetivo é a crença da obrigatoriedade e o objetivo é a constância na realização do ato;\nC) O sentimento de obrigatoriedade é um requisito objective...\nD) Todas as anteriores estão corretas;\nE) Todas as anteriores estão erradas;", "gab": "B", "gabLabel": "", "html": "Literalidade do Item I do texto do Módulo 3: (i) requisito subjetivo = crença na obrigatoriedade (<i>opinio iuris</i>); (ii) requisito objetivo = constância na realização do ato (<i>diuturnitas</i>).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q16", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.16", "tema": "", "enun": "Interpretação é a função de descobrir o sentido e o alcance da norma, buscando o significado dos conceitos jurídicos esculpidos naquela norma e como devem ser aplicados e seu alcance no caso concreto. Um princípio motor é o do art. 5º do Decreto-Lei n ° 4.657/42 (LINDB) que impõe o dever de procurar atender, na interpretação, os fins sociais a que a norma foi feita e realização do bem comum. Para tanto, são utilizados alguns métodos que auxiliam nessa empretiada. Sobre as formas de interpretar, qual das abaixo descritas encontra-se ERRADA:\n\nA) A interpretação sistemática é a interpretação que leva em consideração o sistema em que se insere a norma, relacionando-a com outras normas que tenham o mesmo objetivo;\nB) A interpretação declarativa é a que traduz exatamente o sentido e alcance da norma;\nC) A interpretação restritiva é aquela em que o intérprete descobre que a lei falou mais do que quis e, então, restringue seu alcance;\nD) A interpretação jurisprudencial e a autêntica são iguais e feitas pelas mesmas pessoas: os legisladores;\nE) A interpretação extensiva é aquela em que o intérprete descobre que a norma disse menos do que queria e, então, o intérprete amplia seu alcance.", "gab": "D", "gabLabel": "", "html": "A alternativa D é incorreta pois a interpretação autêntica é promovida pelo Poder Legislativo, enquanto a jurisprudencial é efetuada pelos órgãos do Poder Judiciário (Item II do texto do Módulo 3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q17", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.17", "tema": "", "enun": "Nenhuma norma vale para o mundo inteiro (ainda que jus internacionalista lutem para impor os Direitos Humanos no mundo inteiro) e, por isso, normas encontram um limite de atuação: seja temporal ou territorial. Enquanto territorial, vigora no Brasil o princípio da territorialidade, que significa que:\n\nA) É livre às partes escolherem, em qualquer situação, qual norma processual invocarão...\nB) O art. 23 do Código de Processo Civil fixa uma competência flexível...\nC) A jurisdição civil será regida pelas normas processuais brasileiras, ressalvadas hipóteses específicas previstas em tratados, convenções ou acordos internacionais de que o Brasil seja parte (art. 13, do CPC15).\nD) Todas as anteriores estão corretas;\nE) Nenhuma das anteriores", "gab": "C", "gabLabel": "", "html": "Transcrição exata do art. 13 do CPC/15 e do Item III do texto do Módulo 3 sobre o princípio da territorialidade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M3-Q18", "bloco": "MÓDULO 3 — Fontes, Interpretação e Eficácia da Norma Processual", "num": "Ex.18", "tema": "", "enun": "As leis são feitas para durarem para sempre, pois a regra é de prazo indeterminado e a exceção é a lei temporária. No entanto, a história prova diariamente que nada dura para sempre, muito menos a lei. Por isso, existem regras que fixam a eficácia temporal da norma. Promulgada, publicada e estando em vigor a norma processual, seu princípio motor é tempus regit actum, ou seja, conforme art. 14, do CPC, será aplicável imediatamente aos processos em curso. No entanto, existe um limite fixado pela Constituição, qual deles retrata corretamente o limite constitucional:\n\nA) Direito adquirido e ato jurídico perfeito;\nB) Coisa julgada e ato processual já realizado;\nC) A fase processual já realizada;\nD) Ato jurídico perfeito e a coisa julgada;\nE) Direito adquirido, ato jurídico perfeito e a coisa julgada", "gab": "E", "gabLabel": "", "html": "Conforme a previsão do art. 5º, XXXVI, da CF/88 e do art. 6º da LINDB (transcrito no Item III do texto do Módulo 3), as cláusulas de proteção da segurança jurídica envolvem a tríplice garantia: direito adquirido, ato jurídico perfeito e coisa julgada.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q1", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.1", "tema": "", "enun": "Na prestação jurisdicional há um interesse público maior do que o privado defendido pelas partes. É a garantia de paz e harmonia social, procurada através da manutenção da ordem jurídica. Todos, e não apenas os litigantes, têm direito de conhecer e acompanhar tudo que se passa durante o processo. Esta frase reflete o principio:\n\nA) da economia processual.\nB) da publicidade.\nC) da motivação.\nD) do devido processo legal.\nE) da inafastabilidade do controle jurisdicional.", "gab": "B", "gabLabel": "", "html": "Conforme exposto no Item 4.9 do Módulo 4 e no art. 93, IX, da CF/88, o princípio da publicidade garante a transparência da atividade jurisdicional e a fiscalização pela sociedade.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q2", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.2", "tema": "", "enun": "É a imposição legal de audiência bilateral, ou seja, a necessidade de o juiz, caso tenha ouvido uma das partes, também ouvir a outra, traduzindo-se na imposição legal de dar conhecimento da ação (ao réu) e de todos os atos processuais às partes, e de assegurar-lhes a possibilidade de reagir juridicamente aos atos que lhes forem desfavoráveis (ciência bilateral dos atos contrariáveis). Esse princípio não deve, todavia, ser interpretado como uma exigência de que os litigantes se manifestem, efetivamente, acerca dos atos e termos do processo, mas sim lhes seja concedida a oportunidade para essa manifestação. Fala-se aqui do principio:\n\nA) do contraditório e da ampla defesa.\nB) da oralidade.\nC) da isonomia.\nD) da inafastabilidade do controle jurisdicional.\nE) do juiz natural.", "gab": "A", "gabLabel": "", "html": "Transcrição literal do Item 4.5 do Módulo 4 (art. 5º, LV, da CF/88 e arts. 9º e 10 do CPC/15), caracterizando o Princípio do Contraditório e Ampla Defesa.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q3", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.3", "tema": "", "enun": "O princípio que fala da possibilidade de as partes submeterem a matéria decidida por um juízo à reapreciação de outro, em regra, hierarquicamente superior, trata-se:\n\nA) da economia processual.\nB) do juiz natural.\nC) do duplo grau de jurisdição.\nD) da inafastabilidade do controle jurisdicional.\nE) da duração razoável do processo.", "gab": "C", "gabLabel": "", "html": "Nos termos do Item 4.8 do Módulo 4, o princípio do duplo grau de jurisdição assegura o direito ao recurso e o reexame das decisões por órgão jurisdicional superior.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q4", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.4", "tema": "", "enun": "Proíbe a existência dos Tribunais de Exceção, que são juízos criados para julgar fatos já ocorridos, com parcialidade, para prejudicar ou beneficiar alguém. Toda origem, expressa ou implícita, do poder jurisdicional só pode emanar da Constituição, de modo que não é dado ao legislador ordinário criar juízes e tribunais. Esta ideia reflete o princípio:\n\nA) do devido processo legal.\nB) da inafastabilidade do controle jurisdicional.\nC) da oralidade.\nD) do juiz natural.\nE) da boa fé processual.", "gab": "D", "gabLabel": "", "html": "Conforme o art. 5º, XXXVII e LIII, da CF/88 e o Item 4.3 do Módulo 4, o princípio do juiz natural proíbe a instituição de tribunais de exceção <i>post facto</i>.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q5", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.5", "tema": "", "enun": "O princípio constitucional do juiz natural identifica o juiz competente para o julgamento da causa com base em regras estabelecidas previamente à ocorrência do fato em questão. Esse princípio garante a imparcialidade da própria pessoa do juiz. Nesse sentido, o nosso ordenamento jurídico:\n\nA) proíbe a instituição de juízo ou tribunal de exceção;\nB) admite que se escolha o juízo da causa por foro de eleição;\nC) proíbe que se ajuíze novamente uma mesma demanda quando a primeira foi extinta por carência de ação;\nD) proíbe a criação de varas especializadas nas comarcas;\nE) admite que os juízes sejam substituídos, de ofício, pelo presidente do tribunal para julgar as demandas, em casos de repercussão nacional.", "gab": "A", "gabLabel": "", "html": "O vetor basilar do princípio do juiz natural é a vedação à criação de juízo ou tribunal de exceção (art. 5º, XXXVII, CF/88; Item 4.3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q6", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.6", "tema": "", "enun": "Complete a lacuna inserta na frase a seguir, referindo-se a um dos princípios constitucionais do processo civil. O _________________________________ apresenta dois sentidos, significando “o conjunto de garantias de ordem constitucional, que de um lado asseguram às partes o exercício de suas faculdades poderes de natureza processual e, de outro, legitimam a própria função jurisdicional\".\n\nA) princípio da paridade de armas.\nB) princípio do devido processo legal.\nC) princípio da fundamentação das decisões judiciais.\nD) princípio da inafastabilidade do judiciário.\nE) n.d.a.", "gab": "B", "gabLabel": "", "html": "Definição doutrinária exata do princípio do devido processo legal transcrita no Item 4.4 do Módulo 4.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q7", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.7", "tema": "", "enun": "Sobre o princípio do juiz natural, é correto afirmar:\n\nA) faz referência à necessidade dos magistrados serem brasileiros, natos ou naturalizados.\nB) tem relação com a prerrogativa de foro para determinadas pessoas, em razão do cargo ou função que ocupam.\nC) garante que o juiz que primeiro conhecer a causa deve necessariamente julgá-la.\nD) dispõe sobre a forma de promoção dos juízes, por antiguidade ou por merecimento.\nE) está ligado à competência jurisdicional, imparcialidade do órgão julgador e vedação aos tribunais de exceção.", "gab": "E", "gabLabel": "", "html": "O princípio do juiz natural abrange prévia fixação legal de competência, imparcialidade do julgador e vedação aos tribunais de exceção (Item 4.3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q8", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.8", "tema": "", "enun": "O princípio constitucional da inafastabilidade do controle jurisdicional:\n\nA) não se aplica ao processo civil, por ser de direito substancial constitucional.\nB) não se aplica ao processo civil, por ser próprio do Direito Administrativo e do Direito Tributário.\nC) aplica-se ao processo civil e significa a obrigatoriedade de o Juiz decidir as demandas propostas, quaisquer que sejam.\nD) aplica-se ao processo civil e significa que a lei não excluirá da apreciação do Poder Judiciário qualquer lesão ou ameaça a direito.\nE) aplica-se ao processo civil e significa que ninguém pode alegar o desconhecimento da lei para impedir a prestação jurisdicional.", "gab": "D", "gabLabel": "", "html": "Transcrição exata do art. 5º, XXXV, da CF/88 e do art. 3º do CPC/15 (Item 4.2 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q9", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.9", "tema": "", "enun": "É princípio constitucional aplicado ao processo civil:\n\nA) Do Inquisito.\nB) da Preclusão;\nC) Entidade.\nD) Juiz Natural.\nE) irrecorribilidade das decisões.", "gab": "D", "gabLabel": "", "html": "O Juiz Natural é garantia constitucional expressa (art. 5º, XXXVII e LIII, da CF/88; Item 4.3).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q10", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.10", "tema": "", "enun": "Quanto ao direito ao contraditório no processo civil, é correto afirmar que:\n\nA) esgota-se no direito de informação e no direito de reação a respeito das alegações de fato e das provas produzidas pelas partes.\nB) também chamado de bilateralidade da instância, é um princípio que tem por titulares e destinatários apenas as partes no processo.\nC) é o direito de ser informado, de reagir e de influenciar, tendo como titulares e destinatários apenas as partes no processo.\nD) é o direito de ser informado, de reagir e de influenciar, tendo como titulares as partes e como destinatário o juiz no processo.\nE) nenhuma das afirmações é totalmente correta.", "gab": "D", "gabLabel": "", "html": "A visão contemporânea do contraditório abrange o trinômio informação + reação + poder de influência. As partes são os titulares desse direito, e o juiz é o destinatário precípuo que tem o dever de fundamentação e consideração prévia (arts. 9º e 10 do CPC/15; Item 4.5 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q11", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.11", "tema": "", "enun": "Antônio, famoso cantor da região de Milagrópolis, mata um desafeto ao término de um show, gerando grande repercussão local. Em razão de sua popularidade, Antônio tem seu processo distribuído para o TJCM (Tribunal para Julgamento de Cantores de Milagrópolis), criado após a ocorrência dos fatos esquivando-se, assim, do julgamento pelo Tribunal do Juri. A dinâmica dos fatos revela inequívoca violação a um fundamental princípio do Direito Processual brasileiro. Assinale a alternativa que revela o princípio que, de forma direta e específica, foi violado pelos fatos acima narrados.\n\nA) Princípio da Ampla Defesa.\nB) Princípio do Contraditório.\nC) Princípio do Juiz Natural.\nD) Princípio da Lealdade Processual.\nE) Princípio da Inafastabilidade do Controle Jurisdicional.", "gab": "C", "gabLabel": "", "html": "A criação de tribunal <i>ad hoc</i> após o cometimento do fato para julgar réu específico afronta diretamente a garantia do Juiz Natural e a proibição constitucional aos tribunais de exceção (art. 5º, XXXVII, CF/88; Item 4.3 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q12", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.12", "tema": "", "enun": "Qual das alternativas abaixo explica corretamente o princípio da tutela constitucional do processo também conhecido como a supremacia da Constituição:\n\nA) Art. 42. As causas cíveis serão processadas e decididas pelo juiz nos limites de sua competência, ressalvado às partes o direito de instituir juízo arbitral, na forma da lei. (CPC15)\nB) Art. 373. O ônus da prova incumbe: I - ao autor, quanto ao fato constitutivo de seu direito; II - ao réu, quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor. (CPC15)\nC) Art. 1º O processo civil será ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais estabelecidos na Constituição da República Federativa do Brasil, observando-se as disposições deste Código. (CPC15).\nD) Art. 502. Denomina-se coisa julgada material a autoridade que torna imutável e indiscutível a decisão de mérito não mais sujeita a recurso. (CPC15)\nE) Todas as anteriores estão erradas.", "gab": "C", "gabLabel": "", "html": "O art. 1º do CPC/15 consagra expressamente o princípio da Tutela Constitucional do Processo / Supremacia da Constituição, determinando a filtragem constitucional de toda a legislação infraconstitucional (Item 4.1 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q13", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.13", "tema": "", "enun": "Existem momentos em que as normas colidem onde chamamos antinomias. No entanto, a norma é o gênero de onde brotam as espécies regras e princípios. Além de outros critérios, um dos mais claros para separar o que é uma regra e o que é um princípio vem da interpretação dessa colisão de regras e colisão de princípios. Qual(is) do(s) exemplo(s) abaixo traduz corretamente ao método de colisão entre princípios:\n\nA) Lex posterior derogat legi priori\nB) Lex specialis derogat legi generali\nC) Na colisão entre princípios deve-se derrogar totalmente o princípio anterior\nD) Lex superior derogat legi inferiori\nE) Na colisão de princípios deve-se ponderar a aplicação de ambos os princípios afastando-se temporariamente determinado princípio com vistas a aplicar o que melhor se enquadrar ao caso concreto.", "gab": "E", "gabLabel": "", "html": "Ao contrário das regras (que se excluem por validade), a colisão entre princípios é resolvida pela técnica da ponderação (dimensão de peso), preservando-se a validade de ambos os princípios (Item 4 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q14", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.14", "tema": "", "enun": "O Art. 98, do Código de Processo Civil permite que as partes que não tenham condições de arcar com os encargos econômicos do processo sem afetar sua própria existência digna sejam favorecidas pela isenção de custas e encargos, fixando que \"A pessoa natural ou jurídica, brasileira ou estrangeira, com insuficiência de recursos para pagar as custas, as despesas processuais e os honorários advocatícios tem direito à gratuidade da justiça\". Essa norma visa proteger princípios esculpidos na própria Constituição Federal como o art. 5º, LXXIV, da CF88, além, evidentemente, do próprio princípio da Tutela Constitucional do Processo. Excluindo, portanto, o princípio da Tutela Constitucional do Processo, o art. 98, do CPC15 protege ainda qual(is) outro(s) Princípio(s):\n\nA) O Princípio da Inafastabilidade da Jurisdição e da Isonomia;\nB) O Princípio do Devido Processo Legal e Razoável Duração do Processo;\nC) O Princípio da Eventualidade, Concentração de Atos e Deduzido e Dedutível;\nD) O Princípio da Economia e da Vedação de Provas Ilícita\nE) O Princípio da Presunção de Inocência e do Duplo Grau de Jurisdição.", "gab": "A", "gabLabel": "", "html": "A gratuidade processual viabiliza o acesso material à justiça (Inafastabilidade) e equaliza as chances processuais dos hipossuficientes (Isonomia) - Item 4.11 do Módulo 4.", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q15", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.15", "tema": "", "enun": "Quais dos artigos legais abaixo traduzem e visam atender o princípio constitucional da razoável duração do processo e celeridade esculpidos no art. 5º, LXXVIII, da CF88:\n\nA) Art. 332 (improcedência liminar do pedido)\nB) Art. 311 (tutela da evidência)\nC) Arts. 355 e 356 (julgamento antecipado e parcial do mérito)\nD) Art. 300 (tutela de urgência)\nE) Todas as anteriores estão corretas.", "gab": "E", "gabLabel": "", "html": "Todas as técnicas elencadas (tutelas provisórias, julgamentos antecipados e improcedência liminar) consistem em mecanismos legislativos voltados a conferir celeridade e efetividade processual (Item 4.12 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q16", "bloco": "MÓDULO 4 — Princípios Constitucionais do Processo", "num": "Ex.16", "tema": "", "enun": "Dentro os exemplos abaixo, qual(is) dele(s) retrata(m) um princípio:\n\nA) Art. 350. Se o réu alegar fato impeditivo, modificativo ou extintivo do direito do autor, este será ouvido no prazo de 15 (quinze) dias, permitindo-lhe o juiz a produção de prova. (CPC15)\nB) Art. 489 [...] § 2º No caso de colisão entre normas, o juiz deve justificar o objeto e os critérios gerais da ponderação efetuada, enunciando as razões que autorizam a interferência na norma afastada e as premissas fáticas que fundamentam a conclusão. (CPC15)\nC) Art. 5º Aquele que de qualquer forma participa do processo deve comportar-se de acordo com a boa-fé. (CPC15).\nD) Art. 19. O interesse do autor pode limitar-se à declaração: I - da existência, da inexistência ou do modo de ser de uma relação jurídica; II - da autenticidade ou da falsidade de documento. (CPC15)\nE) Todas as anteriores estão corretas.", "gab": "C", "gabLabel": "", "html": "O art. 5º do CPC/15 consagra o princípio fundamental da Boa-Fé Processual (Itens 4 e 4.4 do Módulo 4).", "repete": false, "repeteRef": "", "coment": []}, {"id": "M4-Q17", "bloco": "MÓDULO 4 — Princípios Constitucionai
